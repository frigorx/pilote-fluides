<svg xmlns="http://www.w3.org/2000/svg" id="scene" viewBox="0 0 1200 620" role="img" aria-labelledby="scene-title scene-desc">
  <title id="scene-title">Schéma interactif du poste : mettre en service une chambre froide négative</title>
  <desc id="scene-desc">Le groupe de condensation et ses vannes de service, le manifold relié par le flexible bleu (BP) et le flexible rouge (HP), la chambre froide avec sa porte et son évaporateur, le thermostat et les pressostats, la mesure de la surchauffe et du sous-refroidissement, et la fiche de mise en service.</desc>
  <defs>
              <g id="hit-help"><text class="svg-hit-help" x="0" y="-30" text-anchor="middle">ICI</text></g>
              <linearGradient id="cylinderFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".32" stop-color="#dcecf7"/><stop offset=".57" stop-color="#f7fbfd"/><stop offset=".59" stop-color="#84b7ec"/><stop offset="1" stop-color="#3d7fca"/></linearGradient>
              <linearGradient id="machineFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbfd"/><stop offset="1" stop-color="#d7e2e9"/></linearGradient>
              <linearGradient id="metalFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".5" stop-color="#dfe8ee"/><stop offset="1" stop-color="#fffdf8"/></linearGradient>
              <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1b3a63" flood-opacity=".13"/></filter>
    <symbol id="scene-background" viewBox="0 0 1200 620">
      <rect x="12" y="12" width="1176" height="596" rx="28" fill="#fffdf8" stroke="#1b3a63" stroke-opacity=".16" stroke-width="3"/>
      <g id="equipment-installation" transform="translate(40 62)">
                  <rect class="equipment-frame" x="0" y="0" width="300" height="305" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="150" y="26" text-anchor="middle" class="svg-title">GROUPE DE CONDENSATION</text>
                  <image href="assets/symboles/groupe-condensation-complet.svg" x="8" y="35" width="284" height="159" preserveAspectRatio="xMidYMid meet"/>

                  <g class="service-marker" transform="translate(109 77)"><circle r="13"/><text y="5">A</text></g>
                  <g class="service-marker" transform="translate(256 74)"><circle r="13"/><text y="5">B</text></g>
                  <g class="service-marker" transform="translate(256 143)"><circle r="13"/><text y="5">C</text></g>

                  <g class="service-legend" transform="translate(12 202)">
                    <text x="0" y="0"><tspan class="legend-letter">A</tspan><tspan dx="5">REFOULEMENT</tspan></text>
                    <text x="145" y="0"><tspan class="legend-letter">B</tspan><tspan dx="5">DÉPART LIQUIDE</tspan></text>
                    <text x="0" y="23"><tspan class="legend-letter">C</tspan><tspan dx="5">ASPIRATION</tspan></text>
                  </g>

                  <path d="M275 165 V258 H167" class="installation-line"/>
                  <image href="assets/symboles/detendeur-thermostatique.svg" x="119" y="239" width="50" height="42" preserveAspectRatio="xMidYMid meet"/>
                  <image href="assets/symboles/evaporateur-cubique.svg" x="169" y="232" width="113" height="61" preserveAspectRatio="xMidYMid meet"/>
                  <path d="M282 263 H289 V188" class="installation-line"/>
                  <text x="72" y="285" text-anchor="middle" class="svg-small">CIRCUIT SIMPLIFIÉ</text>
                </g>

                <g id="equipment-manifold" transform="translate(382 42)" filter="url(#softShadow)">
                  <path class="equipment-frame" d="M38 16 Q38 2 54 2 H286 Q302 2 302 16 V244 Q302 260 286 260 H54 Q38 260 38 244z" fill="url(#metalFill)" stroke="#1b3a63" stroke-width="4"/>
                  <path d="M80 15 Q80 -8 105 -8 H235 Q260 -8 260 15" fill="none" stroke="#10233c" stroke-width="12" stroke-linecap="round"/>
                  <text x="170" y="27" text-anchor="middle" class="svg-title">MANIFOLD 4 VOIES</text>
                  <g transform="translate(102 91)" class="gauge gauge-bp"><circle r="59" fill="#d8e2e9" stroke="#10233c" stroke-width="4"/><circle r="51" fill="#fff" stroke="#3d7fca" stroke-width="7"/><g class="gauge-ticks"><path d="M-37 28l7-5 M-47 6l9-1 M-43-18l9 4 M-27-39l6 8 M0-50v10 M27-39l-6 8 M43-18l-9 4 M47 6l-9-1 M37 28l-7-5"/></g><path d="M-35 22 A43 43 0 0 1 35 22" fill="none" stroke="#637285" stroke-width="2"/><line class="needle" id="needle-bp" x1="0" y1="12" x2="-17" y2="-34" stroke="#10233c" stroke-width="5" stroke-linecap="round"/><circle r="7" fill="#10233c"/><text y="35" text-anchor="middle" class="svg-small">BP</text></g>
                  <g transform="translate(238 91)" class="gauge gauge-hp"><circle r="59" fill="#d8e2e9" stroke="#10233c" stroke-width="4"/><circle r="51" fill="#fff" stroke="#c0392b" stroke-width="7"/><g class="gauge-ticks"><path d="M-37 28l7-5 M-47 6l9-1 M-43-18l9 4 M-27-39l6 8 M0-50v10 M27-39l-6 8 M43-18l-9 4 M47 6l-9-1 M37 28l-7-5"/></g><path d="M-35 22 A43 43 0 0 1 35 22" fill="none" stroke="#637285" stroke-width="2"/><line class="needle" id="needle-hp" x1="0" y1="12" x2="17" y2="-34" stroke="#10233c" stroke-width="5" stroke-linecap="round"/><circle r="7" fill="#10233c"/><text y="35" text-anchor="middle" class="svg-small">HP</text></g>
                  <path d="M57 151 Q57 138 70 138 H270 Q283 138 283 151 V218 H57z" fill="#d5dee4" stroke="#10233c" stroke-width="4"/>
                  <g id="svg-manifold-bp" transform="translate(80 177)"><circle r="21" class="knob blue"/><line y1="-15" y2="15" class="knob-line"/></g>
                  <g id="svg-manifold-vac" transform="translate(140 177)"><circle r="21" class="knob black"/><line y1="-15" y2="15" class="knob-line"/></g>
                  <g id="svg-manifold-service" transform="translate(200 177)"><circle r="21" class="knob yellow"/><line y1="-15" y2="15" class="knob-line"/></g>
                  <g id="svg-manifold-hp" transform="translate(260 177)"><circle r="21" class="knob red"/><line y1="-15" y2="15" class="knob-line"/></g>
                  <text x="80" y="212" text-anchor="middle" class="svg-small">BP</text><text x="140" y="212" text-anchor="middle" class="svg-small">VIDE</text><text x="200" y="212" text-anchor="middle" class="svg-small">SERVICE</text><text x="260" y="212" text-anchor="middle" class="svg-small">HP</text>
                  <g fill="#aab7c1" stroke="#10233c" stroke-width="3"><rect x="70" y="218" width="20" height="23" rx="4"/><rect x="130" y="218" width="20" height="23" rx="4"/><rect x="190" y="218" width="20" height="23" rx="4"/><rect x="250" y="218" width="20" height="23" rx="4"/></g>
                  <circle cx="80" cy="248" r="9" class="socket"/><circle cx="140" cy="248" r="9" class="socket"/><circle cx="200" cy="248" r="9" class="socket"/><circle cx="260" cy="248" r="9" class="socket"/>
                </g>
      <g id="equipment-chambre" transform="translate(720 34)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="450" height="300" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="225" y="28" text-anchor="middle" class="svg-title">LA CHAMBRE FROIDE NÉGATIVE</text>
                  <image href="assets/objets/porte-chambre.svg" x="12" y="44" width="180" height="190" preserveAspectRatio="xMidYMid meet"/>
                  <image href="assets/objets/evaporateur.svg" x="208" y="56" width="222" height="164" preserveAspectRatio="xMidYMid meet"/>
                  <text x="110" y="256" class="svg-small" text-anchor="middle">la porte, son afficheur</text>
                  <text x="320" y="256" class="svg-small" text-anchor="middle">l'évaporateur dans la chambre</text>
                  <text x="225" y="284" class="svg-tiny" text-anchor="middle">La cible de la chambre vient du dossier.</text>
                </g>
      <g id="equipment-regulation" transform="translate(40 392)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="265" height="205" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="132" y="28" text-anchor="middle" class="svg-title">THERMOSTAT</text>
                  <image href="assets/objets/thermostat.svg" x="8" y="42" width="150" height="104" preserveAspectRatio="xMidYMid meet"/>
                  <image href="assets/objets/pressostat-kp1.svg" x="166" y="36" width="70" height="118" preserveAspectRatio="xMidYMid meet"/>
                  <text x="83" y="170" class="svg-small" text-anchor="middle">thermostat</text>
                  <text x="201" y="170" class="svg-tiny" text-anchor="middle">pressostat (ex. KP1)</text>
                  <text x="150" y="192" class="svg-tiny" text-anchor="middle">la consigne, les sécurités</text>
                </g>
      <g id="equipment-tubes" transform="translate(320 392)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="300" height="205" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="150" y="28" text-anchor="middle" class="svg-title">TUBES ET COMPRESSEUR</text>
                  <image href="assets/objets/compresseur-tubes.svg" x="6" y="40" width="258" height="126" preserveAspectRatio="xMidYMid meet"/>
                  <text x="150" y="176" class="svg-tiny" text-anchor="middle">refoulement · aspiration · ligne liquide</text>
                  <text x="150" y="196" class="svg-tiny" text-anchor="middle">la pince se pose sur un fil du compresseur</text>
                </g>
      <g id="equipment-surchauffe" transform="translate(635 392)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="345" height="205" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="172" y="28" text-anchor="middle" class="svg-title">MESURER SC ET SR</text>
                  <image href="assets/planches/mesure-surchauffe.svg" x="6" y="40" width="328" height="124" preserveAspectRatio="xMidYMid meet"/>
                </g>
      <g id="equipment-fiche" transform="translate(995 392)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="175" height="205" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="87" y="28" text-anchor="middle" class="svg-title">LA FICHE</text>
                  <image href="assets/planches/clipboard.svg" x="10" y="44" width="70" height="90" preserveAspectRatio="xMidYMid meet"/>
                  <text x="88" y="70" class="svg-tiny">pressions</text>
                  <text x="88" y="90" class="svg-tiny">températures</text>
                  <text x="88" y="110" class="svg-tiny">intensité</text>
                  <text x="88" y="130" class="svg-tiny">SC · SR</text>
                  <text x="88" y="186" class="svg-tiny" text-anchor="middle">relevés lus et écrits</text>
                </g>
    </symbol>
  </defs>
  <use href="#scene-background" x="0" y="0" width="1200" height="620"></use>
  <g class="hoses" aria-hidden="true">
              <path id="hose-path-blue" class="hose blue-hose" d="M470 302 C420 320 365 270 296 205"/>
              <path id="hose-path-red" class="hose red-hose" d="M644 302 C560 314 430 238 296 136"/>
            </g>
</svg>
