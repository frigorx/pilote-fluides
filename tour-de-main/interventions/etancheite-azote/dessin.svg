              <g class="svg-control-hit machine-target service-control" data-machine-target data-port="install-discharge" data-control="service-discharge" transform="translate(149 139)" role="button" tabindex="0" aria-label="A · vanne de service refoulement">
                <circle class="hit-area" r="29"/><circle class="service-face hp" r="18"/><text class="service-letter" y="5">A</text><line id="svg-service-discharge" class="service-handle" x1="-12" x2="12"/><use href="#hit-help"/>
