              <g class="svg-control-hit machine-target service-control" data-machine-target data-port="install-hp" data-control="service-hp" transform="translate(296 136)" role="button" tabindex="0" aria-label="B · vanne de service départ liquide">
                <circle class="hit-area" r="29"/><circle class="service-face hp" r="18"/><text class="service-letter" y="5">B</text><line id="svg-service-hp" class="service-handle" x1="-12" x2="12"/><use href="#hit-help"/>
              </g>
              <g class="svg-control-hit machine-target service-control" data-machine-target data-port="install-bp" data-control="service-bp" transform="translate(296 205)" role="button" tabindex="0" aria-label="C · vanne de service aspiration">
