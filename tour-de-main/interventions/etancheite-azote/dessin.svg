            <use href="#scene-background" x="0" y="0" width="1040" height="620"></use>
            <rect id="zone-flexibles" x="108" y="96" width="582" height="290" fill="none" stroke="none" pointer-events="none"/>
            <g class="hoses" aria-hidden="true">
