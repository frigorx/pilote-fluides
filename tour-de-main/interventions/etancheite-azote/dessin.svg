                    <rect x="264" y="236" width="12" height="312" rx="5" fill="#56657a"/>
                    <path d="M140 530 V232 Q140 172 195 168 Q250 172 250 232 V530 Z" fill="url(#g-acier)" stroke="#4d5763" stroke-width="3"/>
                    <path d="M140 262 V232 Q140 172 195 168 Q250 172 250 232 V262 Z" fill="#1f2328" stroke="#4d5763" stroke-width="3"/>
                    <rect x="154" y="330" width="82" height="150" rx="10" fill="#fffdf8" stroke="#4d5763" stroke-width="2"/>
                    <text transform="translate(205 405) rotate(-90)" text-anchor="middle" class="svg-etiquette">AZOTE</text>
                    <line x1="134" y1="290" x2="264" y2="290" stroke="#4d5763" stroke-width="7" stroke-dasharray="11 6"/>
                    <rect x="181" y="140" width="28" height="30" fill="#8a96a3" stroke="#4d5763" stroke-width="2"/>
                    <rect x="174" y="112" width="42" height="30" rx="5" fill="url(#g-laiton)" stroke="#6b5420" stroke-width="2"/>
                    <rect x="191" y="96" width="8" height="18" fill="#4d5763"/>
                    <ellipse id="svg-roue-robinet" cx="195" cy="94" rx="30" ry="8" fill="#2c333b"/>
                    <rect x="156" y="120" width="18" height="14" fill="url(#g-laiton)" stroke="#6b5420" stroke-width="1.5"/>
                  </g>
                  <g id="equipment-detendeur" filter="url(#softShadow)">
                    <rect class="cadre-appareil" x="4" y="6" width="170" height="204" rx="20" fill="rgba(255,255,255,.01)" stroke="none"/>
                    <g id="svg-vis"><rect x="50" y="124" width="20" height="12" fill="#8a96a3"/><rect x="35" y="110" width="15" height="40" rx="5" fill="#2c333b"/></g>
                    <line x1="125" y1="96" x2="125" y2="112" stroke="#6b5420" stroke-width="6"/><line x1="48" y1="96" x2="80" y2="116" stroke="#6b5420" stroke-width="6"/>
                    <rect x="70" y="110" width="88" height="40" rx="10" fill="url(#g-laiton)" stroke="#6b5420" stroke-width="2"/>
