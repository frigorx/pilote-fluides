              <path id="hose-path-red" class="hose red-hose" d="M644 302 C650 362 520 374 440 348 C375 327 340 300 337 250 C333 190 350 150 296 136"/>
              <path id="hose-path-yellow" class="hose yellow-hose" d="M582 302 C582 470 810 470 810 300 V216"/>
