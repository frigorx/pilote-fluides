                    <rect x="95" y="150" width="20" height="30" rx="4" fill="url(#g-laiton)" stroke="#6b5420" stroke-width="1.5"/>
                    <circle cx="105" cy="186" r="9" class="socket"/>
                    <g transform="translate(125 62) scale(.62)" class="gauge"><circle r="59" fill="#d8e2e9" stroke="#10233c" stroke-width="4"/><circle r="51" fill="#fff" stroke="#10233c" stroke-width="7"/><g class="gauge-ticks"><path d="M-37 28l7-5 M-47 6l9-1 M-43-18l9 4 M-27-39l6 8 M0-50v10 M27-39l-6 8 M43-18l-9 4 M47 6l-9-1 M37 28l-7-5"/></g><path d="M-35 22 A43 43 0 0 1 35 22" fill="none" stroke="#637285" stroke-width="2"/><line class="needle" id="needle-det-bouteille" x1="0" y1="12" x2="-17" y2="-34" stroke="#10233c" stroke-width="5" stroke-linecap="round"/><circle r="7" fill="#10233c"/></g>
                    <g transform="translate(46 62) scale(.62)" class="gauge"><circle r="59" fill="#d8e2e9" stroke="#10233c" stroke-width="4"/><circle r="51" fill="#fff" stroke="#3d7fca" stroke-width="7"/><g class="gauge-ticks"><path d="M-37 28l7-5 M-47 6l9-1 M-43-18l9 4 M-27-39l6 8 M0-50v10 M27-39l-6 8 M43-18l-9 4 M47 6l-9-1 M37 28l-7-5"/></g><path d="M-35 22 A43 43 0 0 1 35 22" fill="none" stroke="#637285" stroke-width="2"/><line class="needle" id="needle-det-sortie" x1="0" y1="12" x2="-17" y2="-34" stroke="#10233c" stroke-width="5" stroke-linecap="round"/><circle r="7" fill="#10233c"/></g>
                    <text x="125" y="14" text-anchor="middle" class="svg-small">BOUTEILLE</text>
                    <text x="46" y="14" text-anchor="middle" class="svg-small">SORTIE</text>
                    <text x="48" y="226" text-anchor="middle" class="svg-small">MANO-</text><text x="48" y="244" text-anchor="middle" class="svg-small">DÉTENDEUR</text>
                  </g>
                  <text x="148" y="556" text-anchor="middle" class="svg-title">BOUTEILLE D'AZOTE</text>
                </g>
              </symbol>
