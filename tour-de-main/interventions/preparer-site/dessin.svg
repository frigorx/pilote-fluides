<svg xmlns="http://www.w3.org/2000/svg" id="scene" viewBox="0 0 1200 630" role="img" aria-labelledby="scene-title scene-desc">
  <title id="scene-title">Schéma interactif du poste : préparer le site d'intervention</title>
  <desc id="scene-desc">Six cartes dans l'ordre de la préparation : l'accès au site, les papiers, les protections, l'alimentation, l'accès en hauteur et la zone de travail.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1b3a63" flood-opacity=".13"/></filter>
    <symbol id="scene-background" viewBox="0 0 1200 630">
      <rect x="12" y="12" width="1176" height="606" rx="28" fill="#fffdf8" stroke="#1b3a63" stroke-opacity=".16" stroke-width="3"/>
            <g id="equipment-acces" transform="translate(30 30)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">1 · L'ACCÈS AU SITE</text>
                  <image href="assets/symboles/puerta-90.svg" x="14" y="54" width="130" height="130" preserveAspectRatio="xMidYMid meet"/>
                  <text x="160" y="84" class="svg-small">accueil, pièce d'identité</text>
                  <text x="160" y="116" class="svg-small">badge de visiteur</text>
                  <text x="160" y="148" class="svg-small">briefing de sécurité</text>
                  <text x="160" y="180" class="svg-small">un interlocuteur noté</text>
                  <text x="180" y="250" class="svg-tiny" text-anchor="middle">On entre par l'accueil, jamais par la porte du fond.</text>
                </g>
      <g id="equipment-papiers" transform="translate(420 30)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">2 · LES PAPIERS</text>
                  <image href="assets/planches/clipboard.svg" x="16" y="48" width="150" height="190" preserveAspectRatio="xMidYMid meet"/>
                  <text x="176" y="84" class="svg-small">plan de prévention</text>
                  <text x="176" y="116" class="svg-small">permis de feu</text>
                  <text x="176" y="148" class="svg-small">autorisation de consigner</text>
                  <text x="176" y="180" class="svg-small">bon d'intervention</text>
                  <text x="180" y="262" class="svg-tiny" text-anchor="middle">Pas de papier signé, pas de travail.</text>
                </g>
      <g id="equipment-protections" transform="translate(810 30)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">3 · LES PROTECTIONS</text>
                  <image href="assets/planches/q15-casque-securite.svg" x="14" y="46" width="332" height="152" preserveAspectRatio="xMidYMid meet"/>
                  <text x="180" y="224" class="svg-small" text-anchor="middle">lunettes · gants · casque si zone signalée</text>
                  <text x="180" y="252" class="svg-small" text-anchor="middle">chaussures de sécurité · gilet</text>
                </g>
      <g id="equipment-alimentation" transform="translate(30 325)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">4 · L'ALIMENTATION</text>
                  <image href="assets/objets/tableau.svg" x="10" y="60" width="160" height="107" preserveAspectRatio="xMidYMid meet"/>
                  <text x="176" y="92" class="svg-small">la prise ou le tableau</text>
                  <text x="176" y="124" class="svg-small">porte sa tension écrite.</text>
                  <text x="176" y="164" class="svg-small">Elle doit être la même</text>
                  <text x="176" y="188" class="svg-small">que celle de la plaque</text>
                  <text x="176" y="212" class="svg-small">de mon appareil.</text>
                </g>
      <g id="equipment-hauteur" transform="translate(420 325)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">5 · L'ACCÈS EN HAUTEUR</text>
                  <image href="assets/planches/q08-echelle-acces.svg" x="14" y="46" width="332" height="152" preserveAspectRatio="xMidYMid meet"/>
                  <text x="180" y="224" class="svg-small" text-anchor="middle">Une échelle sert à monter,</text>
                  <text x="180" y="252" class="svg-small" text-anchor="middle">pas à travailler.</text>
                </g>
      <g id="equipment-zone" transform="translate(810 325)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">6 · LA ZONE DE TRAVAIL</text>
                  <image href="assets/planches/prepa-chantier.svg" x="8" y="46" width="344" height="118" preserveAspectRatio="xMidYMid meet"/>
                  <text x="180" y="192" class="svg-small" text-anchor="middle">balisée · issue dégagée</text>
                  <text x="180" y="216" class="svg-small" text-anchor="middle">matériel vérifié · ventilation</text>
                  <text x="180" y="252" class="svg-tiny" text-anchor="middle">Un point manquant : on n'engage pas.</text>
                </g>
    </symbol>
  </defs>
  <use href="#scene-background" x="0" y="0" width="1200" height="630"></use>
</svg>
