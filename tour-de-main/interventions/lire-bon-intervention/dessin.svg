<svg xmlns="http://www.w3.org/2000/svg" id="scene" viewBox="0 0 1200 630" role="img" aria-labelledby="scene-title scene-desc">
  <title id="scene-title">Schéma interactif du poste : lire le bon d'intervention et le dossier technique</title>
  <desc id="scene-desc">Cinq cartes : le bon d'intervention, la plaque et le dossier technique, le schéma frigorifique, la machine et sa plaque, puis la préparation avant de partir.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1b3a63" flood-opacity=".13"/></filter>
    <symbol id="scene-background" viewBox="0 0 1200 630">
      <rect x="12" y="12" width="1176" height="606" rx="28" fill="#fffdf8" stroke="#1b3a63" stroke-opacity=".16" stroke-width="3"/>
            <g id="equipment-bon" transform="translate(30 30)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">LE BON D'INTERVENTION</text>
                  <image href="assets/planches/clipboard.svg" x="16" y="48" width="150" height="190" preserveAspectRatio="xMidYMid meet"/>
                  <text x="176" y="84" class="svg-small">client · adresse</text>
                  <text x="176" y="116" class="svg-small">type d'intervention</text>
                  <text x="176" y="148" class="svg-small">descriptif de la mission</text>
                  <text x="176" y="180" class="svg-small">date · heure d'arrivée</text>
                  <text x="176" y="212" class="svg-small">technicien(s)</text>
                  <text x="180" y="262" class="svg-tiny" text-anchor="middle">le papier qui dit CE QU'ON ATTEND DE MOI</text>
                </g>
      <g id="equipment-plaque" transform="translate(420 30)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">LA PLAQUE ET LE DOSSIER</text>
                  <image href="assets/planches/bilan-marquage.svg" x="8" y="56" width="344" height="130" preserveAspectRatio="xMidYMid meet"/>
                  <text x="180" y="214" class="svg-small" text-anchor="middle">Le dossier technique : schémas, notice,</text>
                  <text x="180" y="238" class="svg-small" text-anchor="middle">fiches d'intervention, registre.</text>
                  <text x="180" y="262" class="svg-tiny" text-anchor="middle">Plaque et dossier disent la même chose.</text>
                </g>
      <g id="equipment-schema" transform="translate(810 30)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">LES SCHÉMAS ET LA NOTICE</text>
                  <image href="assets/planches/croix-frigoriste.svg" x="8" y="40" width="344" height="196" preserveAspectRatio="xMidYMid meet"/>
                  <text x="180" y="258" class="svg-tiny" text-anchor="middle">schéma frigorifique · schéma électrique · notice</text>
                </g>
      <g id="equipment-machine" transform="translate(30 325)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="555" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="277" y="28" text-anchor="middle" class="svg-title">LA MACHINE ET SA PLAQUE</text>
                  <image href="assets/objets/groupe.svg" x="10" y="42" width="300" height="190" preserveAspectRatio="xMidYMid meet"/>
                  <text x="330" y="92" class="svg-small">La plaque est sur la machine :</text>
                  <text x="330" y="114" class="svg-small">fluide · charge · n° de série.</text>
                  <text x="330" y="152" class="svg-small">A refoulement · B départ liquide</text>
                  <text x="330" y="174" class="svg-small">C aspiration (vannes de service)</text>
                  <text x="277" y="256" class="svg-tiny" text-anchor="middle">On lit la plaque avant de toucher quoi que ce soit.</text>
                </g>
      <g id="equipment-preparation" transform="translate(615 325)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="555" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="277" y="28" text-anchor="middle" class="svg-title">AVANT DE PARTIR</text>
                  <image href="assets/planches/prepa-chantier.svg" x="10" y="44" width="535" height="182" preserveAspectRatio="xMidYMid meet"/>
                  <text x="277" y="256" class="svg-small" text-anchor="middle">Ma liste : matériel, protections, papiers. Le client est prévenu.</text>
                </g>
    </symbol>
  </defs>
  <use href="#scene-background" x="0" y="0" width="1200" height="630"></use>
</svg>
