<svg xmlns="http://www.w3.org/2000/svg" id="scene" viewBox="0 0 1200 630" role="img" aria-labelledby="scene-title scene-desc">
  <title id="scene-title">Schéma interactif du poste : réceptionner et contrôler une livraison</title>
  <desc id="scene-desc">Cinq cartes : le bon de livraison et la commande, les colis, le matériel livré, la plaque de l'appareil, puis les écarts notés sur le bon avant la signature.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1b3a63" flood-opacity=".13"/></filter>
    <symbol id="scene-background" viewBox="0 0 1200 630">
      <rect x="12" y="12" width="1176" height="606" rx="28" fill="#fffdf8" stroke="#1b3a63" stroke-opacity=".16" stroke-width="3"/>
            <g id="equipment-bon" transform="translate(30 30)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">LE BON ET LA COMMANDE</text>
                  <image href="assets/planches/clipboard.svg" x="14" y="48" width="120" height="150" preserveAspectRatio="xMidYMid meet"/>
                  <text x="144" y="82" class="svg-small">le vendeur · le client</text>
                  <text x="144" y="108" class="svg-small">la référence de commande</text>
                  <text x="144" y="134" class="svg-small">la désignation du matériel</text>
                  <text x="144" y="160" class="svg-small">la quantité livrée</text>
                  <text x="144" y="186" class="svg-small">ce qui reste à livrer</text>
                  <text x="180" y="236" class="svg-small" text-anchor="middle">Le bon dit ce qu'on m'apporte.</text>
                  <text x="180" y="258" class="svg-tiny" text-anchor="middle">La commande dit ce que j'ai demandé.</text>
                </g>
      <g id="equipment-colis" transform="translate(420 30)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">LES COLIS ET LE STOCKAGE</text>
                  <image href="assets/objets/colis-bouteille.svg" x="30" y="44" width="300" height="156" preserveAspectRatio="xMidYMid meet"/>
                  <text x="180" y="222" class="svg-small" text-anchor="middle">colis écrasé, mouillé, déchiré : je l'écris sur le bon.</text>
                  <text x="180" y="250" class="svg-small" text-anchor="middle">Je range à l'abri, bouteilles sanglées.</text>
                </g>
      <g id="equipment-materiel" transform="translate(810 30)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">LE MATÉRIEL LIVRÉ</text>
                  <image href="assets/objets/groupe.svg" x="6" y="40" width="150" height="96" preserveAspectRatio="xMidYMid meet"/>
                  <image href="assets/planches/ligne-liquide-horizontale.svg" x="160" y="44" width="192" height="83" preserveAspectRatio="xMidYMid meet"/>
                  <text x="180" y="176" class="svg-small" text-anchor="middle">référence, désignation, diamètre,</text>
                  <text x="180" y="200" class="svg-small" text-anchor="middle">raccord : brasé ou à visser</text>
                  <text x="180" y="256" class="svg-tiny" text-anchor="middle">ligne par ligne, avec le bon.</text>
                </g>
      <g id="equipment-plaque" transform="translate(30 325)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="555" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="277" y="28" text-anchor="middle" class="svg-title">LA PLAQUE DE L'APPAREIL</text>
                  <image href="assets/planches/plaque-signaletique.svg" x="10" y="44" width="535" height="150" preserveAspectRatio="xMidYMid meet"/>
                  <text x="277" y="222" class="svg-small" text-anchor="middle">tension d'alimentation · fluide compatible · capacité</text>
                  <text x="277" y="250" class="svg-tiny" text-anchor="middle">Je les compare à la commande, pas de mémoire.</text>
                </g>
      <g id="equipment-ecarts" transform="translate(615 325)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="555" height="275" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="277" y="28" text-anchor="middle" class="svg-title">LES ÉCARTS ET MA SIGNATURE</text>
                  <image href="assets/planches/clipboard.svg" x="16" y="46" width="130" height="164" preserveAspectRatio="xMidYMid meet"/>
                  <text x="160" y="84" class="svg-small">manque : quoi, combien</text>
                  <text x="160" y="116" class="svg-small">erreur : livré au lieu de commandé</text>
                  <text x="160" y="148" class="svg-small">colis abîmé : noté</text>
                  <text x="160" y="180" class="svg-small">puis ma signature sur le bon</text>
                  <text x="160" y="212" class="svg-tiny">un exemplaire pour moi,</text>
                  <text x="160" y="230" class="svg-tiny">un pour mon responsable.</text>
                  <text x="277" y="258" class="svg-small" text-anchor="middle">J'écris avant de signer, jamais après.</text>
                </g>
    </symbol>
  </defs>
  <use href="#scene-background" x="0" y="0" width="1200" height="630"></use>
</svg>
