<svg xmlns="http://www.w3.org/2000/svg" id="scene" viewBox="0 0 1200 630" role="img" aria-labelledby="scene-title scene-desc">
  <title id="scene-title">Schéma interactif de l'installation : autocontrôle avant mise en service</title>
  <desc id="scene-desc">Cinq cartes : l'installation ligne par ligne (supports, isolant, raccords, traces), le groupe et ses vannes de service, les raccords et leurs serrages, le sens du fluide et les étiquettes, et ma fiche d'autocontrôle.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1b3a63" flood-opacity=".13"/></filter>
    <symbol id="scene-background" viewBox="0 0 1200 630">
      <rect x="12" y="12" width="1176" height="606" rx="28" fill="#fffdf8" stroke="#1b3a63" stroke-opacity=".16" stroke-width="3"/>
            <g id="equipment-installation" transform="translate(30 30)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="282" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">L'INSTALLATION, LIGNE PAR LIGNE</text>
                  <image href="assets/planches/points-de-fuite.svg" x="10" y="40" width="250" height="216" preserveAspectRatio="xMidYMid meet"/>
                  <text x="266" y="84" class="svg-small">supports</text>
                  <text x="266" y="108" class="svg-small">isolant</text>
                  <text x="266" y="132" class="svg-small">raccords</text>
                  <text x="266" y="156" class="svg-small">huile, rouille,</text>
                  <text x="266" y="178" class="svg-small">chocs</text>
                  <text x="180" y="268" class="svg-tiny" text-anchor="middle">Je suis chaque ligne, du groupe à l'évaporateur.</text>
                </g>
      <g id="equipment-groupe" transform="translate(420 30)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="282" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">LE GROUPE ET SES VANNES</text>
                  <image href="assets/objets/groupe.svg" x="30" y="44" width="300" height="194" preserveAspectRatio="xMidYMid meet"/>
                  <text x="180" y="258" class="svg-small" text-anchor="middle">capuchons, bouchons, fixation du groupe</text>
                </g>
      <g id="equipment-serrages" transform="translate(810 30)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="360" height="282" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="180" y="28" text-anchor="middle" class="svg-title">LES RACCORDS ET LEURS SERRAGES</text>
                  <image href="assets/planches/raccords-voyant.svg" x="8" y="44" width="344" height="150" preserveAspectRatio="xMidYMid meet"/>
                  <text x="180" y="216" class="svg-small" text-anchor="middle">joint, portée et couple</text>
                  <text x="180" y="240" class="svg-small" text-anchor="middle">selon la notice</text>
                </g>
      <g id="equipment-reperage" transform="translate(30 335)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="555" height="270" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="277" y="28" text-anchor="middle" class="svg-title">LE SENS DU FLUIDE ET LES ÉTIQUETTES</text>
                  <image href="assets/planches/ligne-liquide-horizontale.svg" x="10" y="44" width="535" height="176" preserveAspectRatio="xMidYMid meet"/>
                  <text x="277" y="244" class="svg-small" text-anchor="middle">la flèche de chaque élément suit le sens du fluide</text>
                </g>
      <g id="equipment-fiche" transform="translate(615 335)" filter="url(#softShadow)">
                  <rect class="equipment-frame" x="0" y="0" width="555" height="270" rx="24" fill="#f8fbfd" stroke="#1b3a63" stroke-width="3"/>
                  <text x="277" y="28" text-anchor="middle" class="svg-title">MA FICHE D'AUTOCONTRÔLE</text>
                  <image href="assets/planches/clipboard.svg" x="14" y="46" width="130" height="160" preserveAspectRatio="xMidYMid meet"/>
                  <text x="158" y="82" class="svg-small">état général</text>
                  <text x="158" y="110" class="svg-small">supports · serrages</text>
                  <text x="158" y="138" class="svg-small">isolant · repérage</text>
                  <text x="158" y="166" class="svg-small">essais faits, écrits</text>
                  <text x="158" y="194" class="svg-small">écarts corrigés · ma signature</text>
                  <text x="277" y="244" class="svg-small" text-anchor="middle">Je contrôle moi-même avant de présenter.</text>
                </g>
    </symbol>
  </defs>
  <use href="#scene-background" x="0" y="0" width="1200" height="630"></use>
</svg>
