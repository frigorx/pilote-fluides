<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projection — Habilitation fluides frigorigènes</title>
<!--
  MODE PROJECTION — la face « salle » du pack.
  Le contenu vient de cartes.js, l'ordre de parcours.js, et le tout est
  assemblé par build/parcours.mjs dans projection.gen.js. Cette page ne
  fait que le LIRE : on ne corrige jamais un contenu ici.

  La boucle d'une séquence : on projette, on explique, on pose les
  questions, on révèle, on avance.
  Clavier : → ou Espace (suivant) · ← (précédent) · R (révéler) ·
            N (notes formateur) · P (plein écran) · Échap (sommaire)
-->
<style>
  :root{
    --bleu:#1B3A63; --bleu-clair:#2f5689; --orange:#FF6B35; --orange-clair:#ffe2d6;
    --txt:#1d2a38; --mut:#5a6b7d; --fond:#eef2f6; --carte:#fff; --ligne:#d6dee7;
    --ok:#1e7e54; --ok-bg:#e3f5ec; --ko:#c0392b; --ko-bg:#fbe7e4; --attente:#b06a00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:18px/1.55 'Segoe UI',Calibri,system-ui,sans-serif;color:var(--txt);background:var(--fond)}
  button{font:inherit;cursor:pointer}

  /* ---- Sommaire ---- */
  .som{max-width:1100px;margin:0 auto;padding:28px 22px 60px}
  .som h1{color:var(--bleu);font-size:30px;margin:0 0 4px}
  .som .st{color:var(--mut);margin:0 0 26px}
  .jour{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:18px 22px;margin:0 0 18px}
  .jour h2{color:var(--bleu);font-size:22px;margin:0 0 2px}
  .jour .int{color:var(--mut);font-size:15px;margin:0 0 14px}
  .jour .duree{float:right;font-size:14px;font-weight:700;color:var(--orange)}
  .seqs{display:grid;gap:8px}
  .seq{display:flex;align-items:center;gap:12px;border:1px solid var(--ligne);border-radius:10px;
    padding:9px 14px;background:#fff;text-align:left;width:100%}
  .seq:hover{border-color:var(--bleu);background:#f7fafd}
  .seq .n{font-weight:700;color:var(--bleu);min-width:26px}
  .seq .t{flex:1}
  .seq .meta{font-size:13px;color:var(--mut);white-space:nowrap}
  .seq.ex{background:#fffaf2;border-color:#f0d9b5}
  .seq.bi{background:var(--ok-bg);border-color:#a9d9c1}
  .seq.pl{background:#eef3f7;border-color:#b9cbdb}

  /* ---- Scène de projection ---- */
  .scene{display:none;height:100%;flex-direction:column}
  .scene.on{display:flex}
  .tete{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--bleu);color:#fff;font-size:14px}
  .tete .sp{flex:1}
  .tete b{font-weight:700}
  .tete button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:5px 11px;font-size:13px}
  .tete button:hover{background:rgba(255,255,255,.28)}
  .prog{height:4px;background:#dbe3ec}
  .prog i{display:block;height:100%;background:var(--orange);transition:width .2s}

  .diapo{flex:1;display:flex;align-items:center;justify-content:center;padding:34px 46px;overflow:auto}
  .in{max-width:1180px;width:100%}
  .in h2{color:var(--bleu);font-size:40px;line-height:1.2;margin:0 0 22px}
  .in p,.in li{font-size:27px;line-height:1.5}
  .in ul,.in ol{padding-left:1.1em}
  .in li{margin:.42em 0}
  .in b{color:var(--bleu)}
  .in img{max-width:100%;max-height:64vh;display:block;margin:0 auto;border:1px solid var(--ligne);border-radius:10px;background:#fff}
  .dc{display:inline-block;font-size:15px;font-weight:700;color:#fff;background:var(--orange);
    padding:3px 14px;border-radius:999px;margin-bottom:16px}

  /* compétences visées, en ouverture de séquence */
  .comps{display:grid;gap:10px;margin-top:8px}
  .cp{display:flex;align-items:baseline;gap:14px;background:#f3f7fb;border-left:5px solid var(--bleu);
    border-radius:8px;padding:11px 18px}
  .cp .tp{font-size:15px;font-weight:700;border:2px solid;border-radius:999px;padding:2px 11px;white-space:nowrap;background:#fff}
  .cp .tp.p{color:var(--orange);border-color:var(--orange)}
  .cp .tp.t{color:var(--bleu-clair);border-color:var(--bleu-clair)}
  .cp .tp.i{color:var(--mut);border-color:var(--ligne)}
  .cp .lb{flex:1;font-size:23px}
  .cp .cd{font-size:15px;color:var(--mut);font-weight:700}
  .neuf{font-size:14px;font-weight:700;color:var(--attente);white-space:nowrap}
  .avert{margin-top:16px;font-size:20px;font-weight:600;color:var(--attente)}

  /* encadrés */
  .enc{border-left:7px solid var(--bleu);background:#f3f7fb;border-radius:12px;padding:22px 28px}
  .enc.cle{border-color:var(--ok);background:var(--ok-bg)}
  .enc.piege{border-color:var(--orange);background:var(--orange-clair)}
  .enc .t{font-size:22px;font-weight:700;color:var(--bleu);margin-bottom:10px}
  .enc p,.enc{font-size:26px}

  /* questions */
  .qq{font-size:32px;font-weight:700;color:var(--bleu);margin:0 0 26px;line-height:1.3}
  .ch{display:grid;gap:12px;max-width:900px}
  .ch div{border:2px solid var(--ligne);border-radius:10px;padding:14px 20px;font-size:25px;background:#fff}
  .ch div.bon{border-color:var(--ok);background:var(--ok-bg);font-weight:700}
  .ch .lt{display:inline-block;font-weight:700;color:var(--bleu);min-width:1.6em}
  .rem{margin-top:22px;background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:18px 24px;font-size:21px}
  .rem b{color:var(--bleu)}
  .rem p{margin:6px 0}
  .indice{margin-top:20px;font-size:21px;color:var(--mut);font-style:italic}

  /* vidéo : emplacement en attente */
  .vid{border:2px dashed var(--ligne);border-radius:12px;padding:26px;text-align:center;color:var(--mut);font-size:21px}

  /* pied */
  .pied{display:flex;align-items:center;gap:16px;padding:9px 20px;background:#fff;border-top:1px solid var(--ligne);font-size:14px;color:var(--mut)}
  .pied .sp{flex:1}
  .pied button{background:#fff;border:1.5px solid var(--ligne);border-radius:7px;padding:5px 13px;color:var(--txt)}
  .pied button:hover{border-color:var(--bleu)}
  .chrono{font-weight:700;color:var(--bleu)}
  .chrono.fin{color:var(--ko)}

  /* vue orateur */
  .notes{display:none;background:#fdf3e4;border-top:3px solid var(--attente);padding:16px 24px;font-size:17px;max-height:32vh;overflow:auto}
  .notes.on{display:block}
  .notes .t{font-weight:700;color:#8a5a00;margin-bottom:6px}
  .notes .rep{margin-top:10px;padding-top:10px;border-top:1px dashed #e8b95c}

  @media (max-width:820px){
    .in h2{font-size:28px}.in p,.in li{font-size:20px}.qq{font-size:23px}.ch div{font-size:19px}.cp .lb{font-size:18px}
  }
</style>
</head>
<body>
<div id="som" class="som"></div>
<div id="scene" class="scene">
  <div class="tete">
    <b id="t-jour"></b><span id="t-seq"></span><span class="sp"></span>
    <button data-act="notes">Notes (N)</button>
    <button data-act="plein">Plein écran (P)</button>
    <button data-act="sortir">Sommaire (Échap)</button>
  </div>
  <div class="prog"><i id="prog"></i></div>
  <div class="diapo"><div class="in" id="in"></div></div>
  <div class="notes" id="notes"></div>
  <div class="pied">
    <button data-act="prec">◂ Précédent</button>
    <button data-act="suiv">Suivant ▸</button>
    <button data-act="reveler" id="b-rev" style="display:none">Révéler la réponse (R)</button>
    <span class="sp"></span>
    <span id="pos"></span>
    <span class="chrono" id="chrono"></span>
  </div>
</div>

<!-- CODE D'ACCÈS EXIGÉ (25/07) : le support de salle est une page formateur.
     Le pack de projection ne se charge qu'après validation du code — rideau
     assumé, pas un coffre (voir l'en-tête de `moteur/portillon.js`). -->
<script src="moteur/portillon.js"></script>
<script>
function demarrerProjection(){
  "use strict";
  var P = window.PILOTE_PROJECTION;
  var som = document.getElementById("som"), scene = document.getElementById("scene");
  if(!P){ som.innerHTML = "<p>Support de projection absent. Lancer <code>node build/parcours.mjs</code>.</p>"; return; }

  var S = { jour:0, seq:0, i:0, revele:false, notes:false, chrono:null, reste:0 };

  /* ---------------- Sommaire ---------------- */
  function renderSommaire(){
    scene.classList.remove("on"); som.style.display="";
    arreterChrono();
    var h = "<h1>"+esc(P.parcours.titre)+"</h1><p class='st'>"+esc(P.parcours.sous_titre||"")+"</p>";
    P.jours.forEach(function(j, ij){
      var min = j.sequences.reduce(function(n,s){return n+(s.minutes||0);},0);
      h += "<div class='jour'><span class='duree'>"+Math.floor(min/60)+" h "+pad(min%60)+"</span>";
      h += "<h2>"+esc(j.libelle||("Jour "+j.n))+" — "+esc(j.titre)+"</h2><p class='int'>"+esc(j.intention||"")+"</p><div class='seqs'>";
      j.sequences.forEach(function(s, is){
        var cls = s.type==="exercice" ? " ex" : s.type==="bilan" ? " bi" : s.type==="plateau" ? " pl" : "";
        var tag = s.type==="exercice" ? "mise en situation" : s.type==="bilan" ? "point d'étape" :
                  s.type==="plateau" ? "🛠 au plateau, sur machine" :
                  (s.slides.length+" diapos · "+s.questions.length+" questions");
        h += "<button class='seq"+cls+"' data-j='"+ij+"' data-s='"+is+"'>"+
             "<span class='n'>"+(is+1)+"</span><span class='t'>"+esc(s.titre)+"</span>"+
             "<span class='meta'>"+tag+" · "+s.minutes+" min</span></button>";
      });
      h += "</div></div>";
    });
    som.innerHTML = h;
    Array.prototype.forEach.call(som.querySelectorAll(".seq"), function(b){
      b.onclick = function(){ ouvrir(+b.getAttribute("data-j"), +b.getAttribute("data-s")); };
    });
  }

  /* ---------------- Séquence ---------------- */
  function seqCourante(){ return P.jours[S.jour].sequences[S.seq]; }
  function total(){ var s=seqCourante(); return s.slides.length + s.questions.length; }

  function ouvrir(j,s){
    S.jour=j; S.seq=s; S.i=0; S.revele=false;
    som.style.display="none"; scene.classList.add("on");
    lancerChrono(seqCourante().minutes);
    render();
  }

  function render(){
    var j = P.jours[S.jour], s = seqCourante(), n = total();
    document.getElementById("t-jour").textContent = j.libelle || ("Jour "+j.n);
    document.getElementById("t-seq").textContent = s.titre;
    document.getElementById("pos").textContent = (S.i+1)+" / "+n;
    document.getElementById("prog").style.width = Math.round(100*(S.i+1)/n)+"%";

    var estQuestion = S.i >= s.slides.length;
    document.getElementById("b-rev").style.display = estQuestion ? "" : "none";

    document.getElementById("in").innerHTML = estQuestion
      ? vueQuestion(s.questions[S.i - s.slides.length])
      : vueSlide(s.slides[S.i], s);

    majNotes(s, estQuestion);
  }

  function vueSlide(sl, s){
    if(sl.type==="titre"){
      var h = (sl.dc? "<span class='dc'>"+esc(sl.dc)+"</span>":"") +
              "<h2>"+esc(sl.titre)+"</h2>";
      if(sl.competences && sl.competences.length){
        h += "<p style='font-size:22px;color:var(--mut);margin:0 0 14px'>Ce que l'examen attend de vous</p><div class='comps'>";
        sl.competences.forEach(function(c){
          var cats=Object.keys(c.epreuve||{});
          var prat=cats.some(function(k){return c.epreuve[k]==="P";});
          var cls = cats.length? (prat?"p":"t") : "i";
          var tag = cats.length? (prat?"🛠 pratique":"📖 théorique") : "ℹ information";
          h += "<div class='cp'><span class='tp "+cls+"'>"+tag+"</span><span class='lb'>"+esc(c.lib)+"</span>"+
               (c.nouveau?"<span class='neuf'>★ nouveau 2025</span>":"")+
               "<span class='cd'>"+esc(c.code)+"</span></div>";
        });
        h += "</div>";
        if(sl.competences.some(function(c){return c.tirage_au_sort;}))
          h += "<div class='avert'>⚠️ Groupe tiré au sort le jour de l'épreuve — les quatre composants se travaillent.</div>";
      }
      if(s && s.type==="cours" && !s.video)
        h += "<div class='vid' style='margin-top:22px'>🎬 Emplacement vidéo — lien à fournir</div>";
      else if(s && s.video)
        h += "<div style='margin-top:22px'><a href='"+esc(s.video)+"' target='_blank' rel='noopener' style='font-size:22px'>🎬 Ouvrir la vidéo de la séquence</a></div>";
      return h;
    }
    if(sl.type==="schema")
      return "<h2 style='font-size:26px'>"+esc(sl.titre)+"</h2><img src='"+esc((P.base_img||"")+sl.src.replace(/^packs\/fluides\/res\//,""))+"' alt='"+esc(sl.alt)+"'>";
    if(sl.type==="encadre")
      return "<div class='enc "+esc(sl.genre)+"'><div class='t'>"+esc(sl.t)+"</div>"+sl.html+"</div>";
    /* Le plateau ne se projette pas : on annonce le passage à la machine, et
       l'écran s'efface. Une seule diapositive, pour garder le fil de la journée. */
    if(sl.type==="plateau")
      return "<div class='enc'><div class='t'>🛠 On passe au plateau — "+
             Math.floor(sl.minutes/60)+" h "+pad(sl.minutes%60)+"</div>"+
             "<p style='font-size:30px;line-height:1.35'>"+esc(sl.titre)+"</p>"+
             "<p style='font-size:22px;color:var(--mut)'>Préparation de chantier faite, EPI en place, "+
             "consignation vérifiée. Le support reste ouvert pour la reprise.</p></div>";
    return "<div>"+(sl.html||"")+"</div>";
  }

  function vueQuestion(q){
    if(!q) return "<p>Question absente.</p>";
    var L = ["A","B","C","D","E","F"];
    var h = "<p class='qq'>❓ "+esc(q.enonce)+"</p><div class='ch'>";
    q.choix.forEach(function(c,i){
      h += "<div class='"+(S.revele && i===q.bonne ? "bon":"")+"'><span class='lt'>"+L[i]+".</span> "+esc(c)+"</div>";
    });
    h += "</div>";
    if(!S.revele && q.aide) h += "<p class='indice'>💡 "+esc(q.aide)+"</p>";
    if(S.revele && q.remed){
      h += "<div class='rem'>";
      if(q.remed.regle) h += "<p><b>📏 La règle :</b> "+esc(q.remed.regle)+"</p>";
      if(q.remed.pourquoi) h += "<p><b>🎯 Pourquoi :</b> "+esc(q.remed.pourquoi)+"</p>";
      if(q.remed.exemple) h += "<p><b>🧮 Exemple :</b> "+esc(q.remed.exemple)+"</p>";
      if(q.remed.piege) h += "<p><b>⚠️ Le piège :</b> "+esc(q.remed.piege)+"</p>";
      h += "</div>";
    } else if(S.revele && q.explication){
      h += "<div class='rem'><p>"+esc(q.explication)+"</p></div>";
    }
    return h;
  }

  /* La face « guidance formateur » du cahier des charges : le déroulé,
     ce qu'il faut renforcer, et la réponse — visible de l'animateur seul. */
  function majNotes(s, estQuestion){
    var el = document.getElementById("notes");
    el.className = "notes" + (S.notes ? " on" : "");
    var h = "";
    if(s.notes) h += "<div class='t'>👁 Conduite de séquence</div>"+esc(s.notes);
    if(estQuestion){
      var q = s.questions[S.i - s.slides.length];
      if(q) h += "<div class='rep'><b>Réponse attendue :</b> "+["A","B","C","D","E","F"][q.bonne]+" — "+esc(q.choix[q.bonne])+"</div>";
    }
    el.innerHTML = h || "<div class='t'>Aucune note pour cette séquence.</div>";
  }

  /* ---------------- Navigation ---------------- */
  function suiv(){
    var s = seqCourante();
    // sur une question : la première pression révèle, la seconde avance
    if(S.i >= s.slides.length && !S.revele){ S.revele = true; render(); return; }
    if(S.i < total()-1){ S.i++; S.revele=false; render(); return; }
    // fin de séquence : on enchaîne
    var j = P.jours[S.jour];
    if(S.seq < j.sequences.length-1) ouvrir(S.jour, S.seq+1);
    else if(S.jour < P.jours.length-1) ouvrir(S.jour+1, 0);
    else renderSommaire();
  }
  function prec(){ if(S.i>0){ S.i--; S.revele=false; render(); } }

  document.addEventListener("keydown", function(e){
    if(!scene.classList.contains("on")) return;
    if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); suiv(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); prec(); }
    else if(e.key==="r"||e.key==="R"){ S.revele=true; render(); }
    else if(e.key==="n"||e.key==="N"){ S.notes=!S.notes; render(); }
    else if(e.key==="p"||e.key==="P"){ plein(); }
    else if(e.key==="Escape"){ renderSommaire(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-act]"), function(b){
    b.onclick = function(){
      var a = b.getAttribute("data-act");
      if(a==="suiv") suiv(); else if(a==="prec") prec();
      else if(a==="reveler"){ S.revele=true; render(); }
      else if(a==="notes"){ S.notes=!S.notes; render(); }
      else if(a==="plein") plein();
      else if(a==="sortir") renderSommaire();
    };
  });
  function plein(){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }

  /* ---------------- Minuteur de séquence ---------------- */
  function lancerChrono(min){
    arreterChrono();
    S.reste = (min||0)*60;
    var el = document.getElementById("chrono");
    var tic = function(){
      var m = Math.floor(Math.abs(S.reste)/60), s = Math.abs(S.reste)%60;
      el.textContent = (S.reste<0?"+":"")+m+":"+pad(s);
      el.className = "chrono" + (S.reste<=0 ? " fin" : "");
      S.reste--;
    };
    tic(); S.chrono = setInterval(tic, 1000);
  }
  function arreterChrono(){ if(S.chrono){ clearInterval(S.chrono); S.chrono=null; } }

  function pad(n){ return (n<10?"0":"")+n; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  renderSommaire();
}
Portillon.exiger("Support de projection", ["packs/fluides/projection.gen.js"], demarrerProjection);
</script>
</body>
</html>
