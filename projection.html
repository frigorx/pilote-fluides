<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Hors des moteurs de recherche (décision F. Henninot, 20/08) : écran de
     salle, pas une page de site. Reste accessible par son adresse. -->
<meta name="robots" content="noindex">
<title>Projection — Habilitation fluides frigorigènes</title>
<!--
  MODE PROJECTION — la face « salle » du pack.
  Le contenu vient de cartes.js, l'ordre de parcours.js, et le tout est
  assemblé par build/parcours.mjs dans projection.gen.js. Cette page ne
  fait que le LIRE : on ne corrige jamais un contenu ici.

  La boucle d'une séquence : on projette, on explique, on pose les
  questions, on révèle, on avance.
  Clavier : → ou Espace (suivant) · ← (précédent) · R (révéler) ·
            N (notes formateur) · P (plein écran) · Échap (sommaire)

  ── REFONTE DU 31/07/2026 ────────────────────────────────────────────
  Trois défauts constatés en salle, et ce qui les remplace :

  1. « les polices ne sont pas égales » — 37 tailles en pixels, 17 valeurs
     différentes, dont 8 écrites en dur dans le code de rendu. Un titre de
     séquence à 40 px, un titre de schéma à 26 px, pour le même niveau.
     → une ÉCHELLE UNIQUE, en `cqh` : 1 unité = 1 % de la hauteur de
     l'image projetée. Le rendu devient identique sur un vidéoprojecteur
     1024×768 et sur un 1080p — c'est la taille VUE DU FOND DE LA SALLE
     qui est fixée, plus le nombre de pixels.

  2. « fond gris, c'est triste » — le gris bleuté #eef2f6 du moteur, quand
     les expériences interactives sont sur crème depuis toujours (l'écart
     était déjà relevé au § 10.1 de CHARTE-GRAPHIQUE.md).
     → crème #f7f1e7, filigrane de flocons à 5 %, et le contenu posé sur
     une feuille claire qui lui donne du relief.

  3. « il faut une illustration sur chaque diapositive » — 220 écrans de
     texte n'avaient rien du tout.
     → voir moteur/illustration.js : illustration de thème par fiche,
     icônes de rôle selon la nature de l'écran, symboles normalisés quand
     le texte nomme un organe.

  PIÈGE À CONNAÎTRE : les unités `cqh` se mesurent sur la scène, pas sur la
  fenêtre — d'où `container-type:size` sur `#scene`. Le zoom global de
  `lisibilite.js` n'a donc aucun effet ici, et c'est normal : sur une
  diapositive qui remplit déjà l'écran, agrandir ne montre rien de plus.
  Le réglage utile en salle est le curseur de DENSITÉ, dans le pied.
-->
<style>
/* ═══════════════════════════════════════════════════════════════════
   PALETTE — celle de CHARTE-GRAPHIQUE.md § 3.1, sans écart.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --navy:#1b3a63; --navy-800:#12345a; --orange:#ff6b35; --orange-deep:#c9451a;
  --blue:#3d7fca; --blue-soft:#84b7ec;
  --cream:#f7f1e7; --paper:#fffdf8; --ink:#10233c; --muted:#637285;
  --line:rgba(27,58,99,.16);
  --ok:#1e7e54; --ok-bg:#e3f5ec; --ko:#c0392b; --ko-bg:#fbe7e4;
  --attente:#b06a00; --attente-bg:#fff4e0;

  /* L'ÉCHELLE UNIQUE. Toute taille de la scène en descend ; aucune valeur
     en pixels n'est écrite ailleurs. --ech est le curseur de densité. */
  --ech:1;
  --t-sur:  calc(1.9cqh * var(--ech));
  --t-h1:   calc(5.0cqh * var(--ech));
  --t-h2:   calc(4.0cqh * var(--ech));
  --t-corps:calc(2.8cqh * var(--ech));
  --t-sec:  calc(2.3cqh * var(--ech));
  --t-meta: calc(1.7cqh * var(--ech));
  --t-badge:calc(1.55cqh * var(--ech));

  /* Lexend est embarquée (licence OFL) et servait jusqu'ici au seul
     réglage DYS. En projection elle devient la police par défaut :
     lettres ouvertes, sans ambiguïté, lisible du fond de la salle. */
  --police-titre:'Lexend','Trebuchet MS',Calibri,Arial,sans-serif;
  --police-corps:'Lexend',Calibri,'Segoe UI',system-ui,Arial,sans-serif;
}
@font-face{
  font-family:'Lexend';
  src:url('moteur/polices/Lexend-variable.woff2') format('woff2');
  font-weight:100 900; font-display:swap;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--police-corps);color:var(--ink);background:var(--cream)}
button{font:inherit;cursor:pointer}

/* ═══════════════════════════════════════════════════════════════════
   LE SOMMAIRE — la page d'accueil du formateur.
   ═══════════════════════════════════════════════════════════════════ */
.som{max-width:1180px;margin:0 auto;padding:30px 24px 70px}
.som h1{font-family:var(--police-titre);color:var(--navy);font-size:31px;margin:0 0 4px;
  letter-spacing:-.012em}
.som .st{color:var(--muted);margin:0 0 8px}
.som .aide{color:var(--muted);font-size:14px;margin:0 0 26px}
.som .aide kbd{font-family:Consolas,monospace;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;color:var(--navy)}

.jour{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  margin:0 0 20px;overflow:hidden;box-shadow:0 2px 12px rgba(27,58,99,.08)}
.jour .banniere{position:relative;height:132px;background:#e8eef5 center/cover no-repeat}
.jour .banniere::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(27,58,99,.72),rgba(27,58,99,.15) 62%,transparent)}
.jour .banniere .txt{position:absolute;z-index:2;left:24px;bottom:14px;right:24px;color:#fff}
.jour .banniere h2{font-family:var(--police-titre);font-size:23px;margin:0;letter-spacing:-.01em;
  text-shadow:0 1px 3px rgba(16,35,60,.5)}
.jour .banniere .duree{position:absolute;z-index:2;top:14px;right:20px;background:var(--orange);
  color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:4px 14px}
.jour .corps{padding:16px 22px 20px}
.jour .int{color:var(--muted);font-size:15px;margin:0 0 14px;line-height:1.5}
.seqs{display:grid;gap:8px}
.seq{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;
  padding:10px 15px;background:#fff;text-align:left;width:100%;color:var(--ink)}
.seq:hover{border-color:var(--navy);background:#f7fafd}
.seq .n{font-family:var(--police-titre);font-weight:700;color:var(--navy);min-width:26px}
.seq .t{flex:1}
.seq .meta{font-size:13px;color:var(--muted);white-space:nowrap}
.seq .vig{width:34px;height:34px;object-fit:contain;flex:none}
.seq.ex{background:#fffaf2;border-color:#f0d9b5}
.seq.bi{background:var(--ok-bg);border-color:#a9d9c1}
.seq.pl{background:#eef3f7;border-color:#b9cbdb}

/* ═══════════════════════════════════════════════════════════════════
   LA SCÈNE — ce qui part au vidéoprojecteur.
   `container-type:size` en fait l'unité de référence de toute la
   typographie : c'est SA hauteur qui commande, pas celle de la fenêtre.
   ═══════════════════════════════════════════════════════════════════ */
.scene{display:none;height:100%;flex-direction:column;position:relative;overflow:hidden;
  container-type:size;background:var(--cream)}
.scene.on{display:flex}

/* Le fond : crème, filigrane de flocons, et deux halos très pâles pour
   que le grand aplat ne soit pas mort. Le filigrane reste à 5 % : au-delà
   il commence à manger le contraste du texte en salle. */
.scene::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:url("packs/fluides/res/svg/motif-flocon.svg") 0 0/15cqh 15cqh repeat;opacity:.05}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120cqh 80cqh at -10% -20%, rgba(61,127,202,.15), transparent 60%),
    radial-gradient(90cqh 70cqh at 110% 115%, rgba(255,107,53,.09), transparent 62%)}

.tete{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:2cqw;
  padding:0 3cqw;height:7.4cqh;background:var(--navy);color:#fff;
  font-family:var(--police-titre);font-size:var(--t-meta)}
.tete .jr{font-weight:700;letter-spacing:.02em;white-space:nowrap}
.tete .sep{width:1px;height:3.2cqh;background:rgba(255,255,255,.32);flex:none}
.tete .sq{opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tete .sp{flex:1}
.tete button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;
  padding:.5cqh 1.4cqw;font-family:inherit;font-size:calc(var(--t-meta) * .92);font-weight:600}
.tete button:hover{background:rgba(255,255,255,.28)}
.prog{position:relative;z-index:2;flex:none;height:.75cqh;background:rgba(27,58,99,.14)}
.prog i{display:block;height:100%;background:var(--orange);transition:width .2s}

/* La feuille : le contenu posé sur une carte claire. En projection, un
   fond plat n'a aucun relief ; un filet plus une ombre bleutée, si. */
.diapo{position:relative;z-index:2;flex:1;min-height:0;display:flex;padding:3cqh 3.4cqw}
/* La marque inerWeb entre DANS la diapositive (charte R8) : elle est
   projetée avec elle et se retrouve sur toute capture d'écran. Rangée
   dans la gouttière du bas, à l'échelle de l'image projetée (cqh),
   jamais par-dessus la barre de pilotage du formateur. */
.diapo #marque-inerweb.marque-hebergee{left:.6cqw;bottom:.15cqh;gap:.6cqw;opacity:.42;
  font-size:1.5cqh;line-height:1}
.diapo #marque-inerweb.marque-hebergee svg{width:11cqh;height:2.3cqh}
.feuille{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:3cqw;
  background:var(--paper);border:1px solid var(--line);border-radius:1.8cqh;
  box-shadow:0 2.2cqh 6cqh rgba(27,58,99,.13);padding:4cqh 4cqw;
  align-content:center;overflow:hidden;zoom:var(--ajust,1)}
.feuille.avec-visuel{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:center}

/* ---- La colonne visuelle ---- */
.visuel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqh;
  border-left:1px solid var(--line);padding-left:3cqw;height:100%;overflow:hidden}
.visuel .illu{width:100%;max-height:52cqh;object-fit:contain;display:block;transition:transform .15s}
.visuel .lg{font-size:var(--t-meta);color:var(--muted);text-align:center;line-height:1.35}

/* Le symbole normalisé, sous l'illustration : l'objet d'un côté, le signe
   qu'on lira sur un schéma de l'autre. */
.symb{display:flex;align-items:center;gap:1.2cqw;background:#f2f6fb;border:1px solid var(--line);
  border-radius:1cqh;padding:1.1cqh 1.4cqw;width:100%}
.symb img{width:9cqh;height:6cqh;object-fit:contain;flex:none}
.symb .tx{font-size:var(--t-badge);line-height:1.3;color:var(--muted)}
.symb .tx b{display:block;color:var(--navy);font-size:var(--t-meta);font-weight:700}

/* ---- Typographie de diapositive ---- */
.sur{display:inline-flex;align-items:center;gap:.8cqw;font-family:var(--police-titre);
  font-size:var(--t-badge);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;background:var(--orange);border-radius:999px;padding:.6cqh 1.5cqw;margin-bottom:2.2cqh}
.sur.calme{background:transparent;color:var(--muted);border:1px solid var(--line);letter-spacing:.04em}
h1.dia{font-family:var(--police-titre);font-size:var(--t-h1);line-height:1.14;color:var(--navy);
  margin:0 0 2.4cqh;letter-spacing:-.012em;font-weight:700}
h2.dia{font-family:var(--police-titre);font-size:var(--t-h2);line-height:1.18;color:var(--navy);
  margin:0 0 2.2cqh;letter-spacing:-.01em;font-weight:700}
.corps{font-size:var(--t-corps);line-height:1.45;max-width:58ch}
.corps p{margin:0 0 1.6cqh}
.corps p:last-child{margin-bottom:0}
.corps b{color:var(--navy-800);font-weight:700}
.corps ol,.corps ul{margin:0;padding-left:1.15em}
.corps li{margin:.9cqh 0;line-height:1.4}
/* Une liste de gestes reçoit ses icônes en puce : chaque ligne est une
   action distincte, elle mérite son signe. */
.corps ul.avec-icones,.corps ol.avec-icones{list-style:none;padding-left:0}
.corps .avec-icones li{display:flex;align-items:flex-start;gap:1.4cqw}
.corps .avec-icones li img{width:5.2cqh;height:5.2cqh;object-fit:contain;flex:none;margin-top:-.4cqh}
.corps .avec-icones li .vide{width:5.2cqh;flex:none}

/* ---- Compétences visées ---- */
.intro-comp{display:flex;align-items:center;gap:.9cqw;font-size:var(--t-meta);color:var(--muted);
  margin:0 0 1.4cqh;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.intro-comp img{width:3.4cqh;height:3.4cqh;object-fit:contain}
.comps{display:grid;gap:1.2cqh}
.cp{display:flex;align-items:center;gap:1.4cqw;background:#f2f6fb;
  border-left:.6cqh solid var(--navy);border-radius:.9cqh;padding:1.4cqh 1.8cqw}
.cp .tp{font-size:var(--t-badge);font-weight:700;border:2px solid;border-radius:999px;
  padding:.35cqh 1.1cqw;white-space:nowrap;background:#fff}
.cp .tp.p{color:var(--orange-deep);border-color:var(--orange-deep)}
.cp .tp.t{color:var(--blue);border-color:var(--blue)}
.cp .tp.i{color:var(--muted);border-color:var(--line)}
.cp .lb{flex:1;font-size:var(--t-sec);line-height:1.35}
.cp .cd{font-size:var(--t-meta);color:var(--muted);font-weight:700;white-space:nowrap}
.neuf{display:inline-flex;align-items:center;gap:.4cqw;font-size:var(--t-badge);font-weight:700;
  color:var(--attente);background:var(--attente-bg);border-radius:999px;padding:.3cqh 1cqw;white-space:nowrap}
.neuf img{width:2.2cqh;height:2.2cqh}
.avert{display:flex;align-items:center;gap:1cqw;margin-top:1.8cqh;font-size:var(--t-sec);
  font-weight:600;color:var(--attente)}
.avert img{width:4cqh;height:4cqh;flex:none}

/* ---- Encadrés : la couleur ET le mot (règle de charte) ---- */
.enc{border:1px solid var(--line);border-left:.9cqh solid var(--navy);border-radius:1.2cqh;
  background:#f2f6fb;padding:2.6cqh 2.6cqw}
.enc .t{display:flex;align-items:center;gap:.9cqw;font-family:var(--police-titre);
  font-size:var(--t-sec);font-weight:700;color:var(--navy);margin-bottom:1.6cqh}
.enc .t img{width:4.4cqh;height:4.4cqh;object-fit:contain;flex:none}
.enc.cle{border-left-color:var(--ok);background:var(--ok-bg)}
.enc.cle .t{color:#14603f}
.enc.piege{border-left-color:var(--orange);background:#fff1e9}
.enc.piege .t{color:var(--orange-deep)}

/* ---- Schéma plein cadre ---- */
.plein{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqh;height:100%}
.plein img{max-width:100%;max-height:64cqh;object-fit:contain;display:block}
.plein .lg{font-size:var(--t-meta);color:var(--muted);text-align:center;max-width:74ch;line-height:1.4}

/* ---- Expérience interactive ---- */
.lancer{display:flex;flex-direction:column;align-items:center;gap:2.4cqh;text-align:center}
.lancer a{display:inline-flex;align-items:center;gap:1cqw;padding:1.8cqh 4cqw;background:var(--navy);
  color:#fff;font-family:var(--police-titre);font-size:var(--t-h2);font-weight:700;
  text-decoration:none;border-radius:999px;box-shadow:0 1.4cqh 3.4cqh rgba(27,58,99,.24)}
.lancer a:hover{background:var(--navy-800)}
.lancer a img{width:5cqh;height:5cqh;filter:brightness(0) invert(1)}
.lancer .desc{font-size:var(--t-sec);color:var(--muted);max-width:60ch;line-height:1.4}

/* ---- Question ---- */
.qq{display:flex;gap:1.2cqw;font-family:var(--police-titre);font-size:var(--t-h2);font-weight:700;
  color:var(--navy);line-height:1.2;margin:0 0 2.6cqh}
.qq img{width:5.4cqh;height:5.4cqh;flex:none;object-fit:contain}
.ch{display:grid;gap:1.2cqh}
.ch div{display:flex;gap:1.2cqw;align-items:baseline;border:2px solid var(--line);border-radius:1cqh;
  padding:1.4cqh 1.8cqw;font-size:var(--t-sec);background:#fff;line-height:1.32}
.ch div.bon{border-color:var(--ok);background:var(--ok-bg);font-weight:700;
  box-shadow:0 .8cqh 2.4cqh rgba(30,126,84,.18)}
.ch .lt{font-family:var(--police-titre);font-weight:700;color:var(--navy);min-width:1.7em;flex:none}
.ch div.bon .lt{color:var(--ok)}
.ch div.bon::after{content:"réponse attendue";margin-left:auto;flex:none;font-size:var(--t-badge);
  font-weight:700;color:#fff;background:var(--ok);border-radius:999px;padding:.3cqh 1.1cqw;
  letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.indice{margin-top:2.2cqh;font-size:var(--t-sec);color:var(--muted);font-style:italic}
.rem{margin-top:2.4cqh;background:#fff;border:1px solid var(--line);border-radius:1.2cqh;
  padding:2cqh 2.2cqw;font-size:var(--t-sec);line-height:1.4}
.rem p{margin:.7cqh 0}
.rem .et{display:inline-block;font-family:var(--police-titre);font-size:var(--t-badge);font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--navy);margin-right:.7cqw}
.rem .et.al{color:var(--orange-deep)}

/* ---- Plateau : on quitte l'écran, l'écran le dit ---- */
.plateau{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqh;
  text-align:center;height:100%}
.plateau img.pic{width:12cqh;height:12cqh;object-fit:contain}
.plateau .du{font-size:var(--t-sec);font-weight:700;color:#fff;background:var(--navy);
  border-radius:999px;padding:.7cqh 2cqw}
.plateau .tt{font-family:var(--police-titre);font-size:var(--t-h2);font-weight:700;color:var(--navy);
  max-width:30ch;line-height:1.2;margin:0}
.plateau .no{font-size:var(--t-sec);color:var(--muted);max-width:62ch;line-height:1.4;margin:0}

/* ---- Vidéo en attente ---- */
.vid{border:.3cqh dashed var(--line);border-radius:1.2cqh;padding:2.6cqh;text-align:center;
  color:var(--muted);font-size:var(--t-sec);margin-top:2.2cqh}
.vid a{color:var(--navy);font-weight:700}

/* ---- Notes formateur ---- */
.notes{display:none;position:relative;z-index:2;background:#fdf3e4;border-top:.4cqh solid var(--attente);
  padding:2cqh 3cqw;font-size:var(--t-meta);max-height:32cqh;overflow:auto;line-height:1.5}
.notes.on{display:block}
.notes .t{font-family:var(--police-titre);font-weight:700;color:#8a5a00;margin-bottom:.8cqh}
.notes .rep{margin-top:1.2cqh;padding-top:1.2cqh;border-top:1px dashed #e8b95c}

/* ---- Pied ---- */
.pied{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:1.2cqw;
  height:6.2cqh;padding:0 3cqw;background:var(--paper);border-top:1px solid var(--line);
  font-size:var(--t-meta);color:var(--muted)}
.pied .sp{flex:1}
.pied button{font-family:var(--police-titre);font-weight:700;background:#fff;
  border:1.5px solid var(--line);border-radius:.9cqh;padding:.9cqh 1.6cqw;color:var(--ink);
  font-size:var(--t-meta)}
.pied button:hover{border-color:var(--navy);color:var(--navy)}
.pied button.acc{background:var(--navy);border-color:var(--navy);color:#fff}
.pied .dens{display:flex;align-items:center;gap:.5cqw;border-left:1px solid var(--line);
  padding-left:1.2cqw;margin-left:.4cqw}
.pied .dens button{padding:.7cqh 1.1cqw;font-weight:400}
.pied .dens button.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.pied .pos{font-variant-numeric:tabular-nums}
.pied .chrono{font-family:Consolas,monospace;font-weight:700;color:var(--navy);
  font-size:calc(var(--t-meta) * 1.15)}
.pied .chrono.fin{color:var(--ko)}

@media (max-width:820px){
  .feuille.avec-visuel{grid-template-columns:minmax(0,1fr)}
  .visuel{display:none}
}
</style>

<body>
<div id="som" class="som"></div>
<div id="scene" class="scene">
  <div class="tete">
    <b class="jr" id="t-jour"></b>
    <span class="sep"></span>
    <span class="sq" id="t-seq"></span>
    <span class="sp"></span>
    <button data-act="notes">Notes (N)</button>
    <button data-act="plein">Plein écran (P)</button>
    <button data-act="sortir">Sommaire (Échap)</button>
  </div>
  <div class="prog"><i id="prog"></i></div>
  <div class="diapo" data-marque-hote><div class="feuille" id="feuille"></div></div>
  <div class="notes" id="notes"></div>
  <div class="pied">
    <button data-act="prec">◂ Précédent</button>
    <button class="acc" data-act="suiv">Suivant ▸</button>
    <button data-act="reveler" id="b-rev" style="display:none">Révéler (R)</button>
    <span class="dens" title="Densité du texte projeté">
      <span>Texte</span>
      <button data-ech="0.88">−</button>
      <button data-ech="1" class="on">•</button>
      <button data-ech="1.14">+</button>
    </span>
    <span class="sp"></span>
    <span class="pos" id="pos"></span>
    <span class="chrono" id="chrono"></span>
  </div>
</div>

<!-- Quelle image sur quel écran : la règle est isolée dans son fichier,
     elle servira aussi aux autres faces du pack. -->
<script src="moteur/illustration.js?v=7f90a74374"></script>

<!-- ACCÈS ENSEIGNANT EXIGÉ (27/08) : le support de salle est une page
     formateur. Le pack de projection ne se charge qu'après validation. Ce
     n'est plus le code court partagé du 25/07 : le portillon est devenu
     nominatif (voir l'en-tête de `moteur/portillon.js`). `acces.js` passe
     AVANT le portillon : c'est lui qui juge. -->
<script src="moteur/acces.js?v=7f90a74374"></script>
<script src="moteur/portillon.js?v=7f90a74374"></script>
<script>
function demarrerProjection(){
  "use strict";
  var P = window.PILOTE_PROJECTION, I = window.Illustration;
  var som = document.getElementById("som"), scene = document.getElementById("scene");
  var feuille = document.getElementById("feuille");
  if(!P){ som.innerHTML = "<p>Support de projection absent. Lancer <code>node build/parcours.mjs</code>.</p>"; return; }

  var S = { jour:0, seq:0, i:0, revele:false, notes:false, chrono:null, reste:0 };

  /* Densité du texte, mémorisée d'une séance à l'autre. */
  var CLE_ECH = "pilote_projection_densite";
  function poserEchelle(v, muet){
    document.documentElement.style.setProperty("--ech", v);
    Array.prototype.forEach.call(document.querySelectorAll("[data-ech]"), function(b){
      b.classList.toggle("on", parseFloat(b.getAttribute("data-ech")) === v);
    });
    if(!muet){ try{ localStorage.setItem(CLE_ECH, v); }catch(err){} ajuster(); }
  }
  try{ var _e = parseFloat(localStorage.getItem(CLE_ECH)); if(_e >= .8 && _e <= 1.2) poserEchelle(_e, true); }catch(err){}

  /* ---------------- Sommaire ---------------- */
  function renderSommaire(){
    scene.classList.remove("on"); som.style.display="";
    arreterChrono();
    var h = "<h1>"+esc(P.parcours.titre)+"</h1><p class='st'>"+esc(P.parcours.sous_titre||"")+"</p>"+
            "<p class='aide'>Choisir une séquence. En salle : <kbd>→</kbd> avance, <kbd>R</kbd> révèle, "+
            "<kbd>N</kbd> affiche vos notes, <kbd>P</kbd> passe en plein écran.</p>";
    P.jours.forEach(function(j, ij){
      var min = j.sequences.reduce(function(n,s){return n+(s.minutes||0);},0);
      h += "<div class='jour'><div class='banniere' style=\"background-image:url('"+
           I.ambiance("jour"+j.n)+"')\">"+
           "<span class='duree'>"+Math.floor(min/60)+" h "+pad(min%60)+"</span>"+
           "<div class='txt'><h2>"+esc(j.libelle||("Jour "+j.n))+" — "+esc(j.titre)+"</h2></div></div>"+
           "<div class='corps'><p class='int'>"+esc(j.intention||"")+"</p><div class='seqs'>";
      j.sequences.forEach(function(s, is){
        var cls = s.type==="exercice" ? " ex" : s.type==="bilan" ? " bi" : s.type==="plateau" ? " pl" : "";
        var tag = s.type==="exercice" ? "mise en situation" : s.type==="bilan" ? "point d'étape" :
                  s.type==="plateau" ? "au plateau, sur machine" :
                  (s.slides.length+" diapos · "+s.questions.length+" questions");
        var vig = s.fiche ? I.theme(s.fiche)
                          : I.role(s.type==="plateau" ? "plateau" : s.type==="bilan" ? "examen" : "competence");
        h += "<button class='seq"+cls+"' data-j='"+ij+"' data-s='"+is+"'>"+
             "<img class='vig' src='"+vig+"' alt='' onerror=\"this.style.visibility='hidden'\">"+
             "<span class='n'>"+(is+1)+"</span><span class='t'>"+esc(s.titre)+"</span>"+
             "<span class='meta'>"+tag+" · "+s.minutes+" min</span></button>";
      });
      h += "</div></div></div>";
    });
    som.innerHTML = h;
    Array.prototype.forEach.call(som.querySelectorAll(".seq"), function(b){
      b.onclick = function(){ ouvrir(+b.getAttribute("data-j"), +b.getAttribute("data-s")); };
    });
  }

  /* ---------------- Séquence ---------------- */
  function seqCourante(){ return P.jours[S.jour].sequences[S.seq]; }
  function total(){ var s=seqCourante(); return s.slides.length + s.questions.length; }

  function ouvrir(j,s){
    S.jour=j; S.seq=s; S.i=0; S.revele=false;
    som.style.display="none"; scene.classList.add("on");
    lancerChrono(seqCourante().minutes);
    render();
  }

  function render(){
    var j = P.jours[S.jour], s = seqCourante(), n = total();
    document.getElementById("t-jour").textContent = j.libelle || ("Jour "+j.n);
    document.getElementById("t-seq").textContent = s.titre;
    document.getElementById("pos").textContent = (S.i+1)+" / "+n;
    document.getElementById("prog").style.width = Math.round(100*(S.i+1)/n)+"%";

    var estQuestion = S.i >= s.slides.length;
    document.getElementById("b-rev").style.display = estQuestion ? "" : "none";

    var vue = estQuestion ? vueQuestion(s.questions[S.i - s.slides.length], s)
                          : vueSlide(s.slides[S.i], s);
    feuille.className = "feuille" + (vue.visuel ? " avec-visuel" : "");
    feuille.innerHTML = vue.html + (vue.visuel || "");

    majNotes(s, estQuestion);
    ajusterQuandPret();
    cadrerVisuel();
  }

  /* Une image dont le sujet n'occupe qu'un coin du cadre fait timbre-poste
     une fois projetée. On mesure la boîte réelle du dessin et on l'agrandit
     jusqu'à remplir sa colonne — les bords rognés sont vides par
     construction. Silencieux si la mesure échoue. */
  var cacheCadre = {};
  function cadrerVisuel(){
    var img = feuille.querySelector(".illu");
    if(!img) return;
    var src = img.getAttribute("src");
    if(cacheCadre[src] !== undefined){ img.style.transform = "scale("+cacheCadre[src]+")"; return; }
    var appliquer = function(){
      var k = 1;
      try{
        var c = document.createElement("canvas");
        var L = 160, H = Math.round(L * img.naturalHeight / img.naturalWidth) || L;
        c.width = L; c.height = H;
        var x = c.getContext("2d", { willReadFrequently:true });
        x.drawImage(img, 0, 0, L, H);
        var d = x.getImageData(0,0,L,H).data, f = [d[0],d[1],d[2]];
        var x0=L, y0=H, x1=-1, y1=-1;
        for(var yy=0; yy<H; yy++) for(var xx=0; xx<L; xx++){
          var i4 = (yy*L+xx)*4;
          if(Math.abs(d[i4]-f[0])+Math.abs(d[i4+1]-f[1])+Math.abs(d[i4+2]-f[2]) > 24){
            if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(yy<y0)y0=yy; if(yy>y1)y1=yy;
          }
        }
        if(x1 > x0){
          var occupe = Math.max((x1-x0+1)/L, (y1-y0+1)/H);
          if(occupe < .82) k = Math.min(.9/occupe, 1.75);
        }
      }catch(err){ /* image d'une autre origine : on laisse tel quel */ }
      cacheCadre[src] = +k.toFixed(3);
      img.style.transform = "scale("+cacheCadre[src]+")";
    };
    if(img.complete && img.naturalWidth) appliquer();
    else img.onload = appliquer;
  }

  /* Rien ne doit sortir du cadre en salle : ce qui dépasse se resserre, par
     pas de 4 %, jusqu'à 72 % au plus. En dessous, ce n'est plus une question
     de taille — c'est la diapositive qui porte trop de texte.

     PIÈGE, corrigé le 31/07 : mesurer tout de suite ne suffit pas. Tant
     qu'une image n'est pas décodée elle occupe zéro hauteur, la feuille
     paraît tenir, et le débordement n'apparaît qu'après coup — c'était le
     cas des 41 diapositives de schéma, la plus visible de toutes. On
     remesure donc à chaque image qui arrive. */
  function ajuster(){
    var k = 1;
    feuille.style.setProperty("--ajust", 1);
    while(feuille.scrollHeight > feuille.clientHeight + 1 && k > 0.72){
      k -= 0.04;
      feuille.style.setProperty("--ajust", k.toFixed(2));
    }
  }
  /* Dernier recours, sur les rares écrans qui portent vraiment trop de texte :
     l'illustration s'efface et rend sa colonne au contenu. Le texte est ce
     qu'on vient lire ; l'image l'accompagne, elle ne lui dispute pas la place.
     Trois écrans sur 581 en arrivent là — et ils resteront trois tant que le
     découpage « un paragraphe de fiche = un écran » n'aura pas été revu. */
  function ajusterOuLiberer(){
    ajuster();
    if(feuille.scrollHeight <= feuille.clientHeight + 1) return;
    var vis = feuille.querySelector(".visuel");
    if(!vis) return;
    vis.remove();
    feuille.classList.remove("avec-visuel");
    ajuster();
  }

  function ajusterQuandPret(){
    ajusterOuLiberer();
    var images = feuille.querySelectorAll("img");
    var reste = 0;
    Array.prototype.forEach.call(images, function(img){
      if(img.complete) return;
      reste++;
      var fini = function(){ img.removeEventListener("load", fini); img.removeEventListener("error", fini);
                             if(--reste <= 0) ajusterOuLiberer(); };
      img.addEventListener("load", fini);
      img.addEventListener("error", fini);
    });
  }

  /* Le visuel d'accompagnement : l'illustration de la fiche, et le symbole
     normalisé quand le texte de l'écran nomme un organe. */
  function colonne(s, texte){
    if(!s || !s.fiche) return "";
    var h = "<div class='visuel'><img class='illu' src='"+I.theme(s.fiche)+"' alt='' "+
            "onerror=\"this.remove()\">";
    var sy = I.symbole(texte || "");
    if(sy) h += "<div class='symb'><img src='"+sy.src+"' alt='' onerror=\"this.parentNode.remove()\">"+
                "<span class='tx'><b>Le symbole normalisé</b>"+esc(sy.nom)+"</span></div>";
    return h + "</div>";
  }

  /* Les listes de gestes prennent leurs icônes en puce. Le HTML vient des
     fiches : on ne le récrit pas, on l'enrichit.

     Seuil des deux tiers : en dessous, la liste reste nue. Au-dessus, les
     lignes sans icône gardent une puce vide de MÊME largeur — l'alignement
     du texte tient, et c'est lui qu'on regarde. Exiger que chaque ligne
     trouve son icône ne marchait pas : sur toutes les listes du parcours,
     quatre seulement passaient. */
  function iconerListes(html){
    return html.replace(/<(ul|ol)>([\s\S]*?)<\/\1>/g, function(tout, bal, dedans){
      var lignes = dedans.match(/<li>[\s\S]*?<\/li>/g);
      if(!lignes || lignes.length < 2) return tout;
      var trouve = 0;
      var neuf = lignes.map(function(li){
        var brut = li.replace(/<[^>]+>/g, " ");
        var ic = I.notion(brut);
        if(ic){ trouve++; return li.replace(/^<li>/, "<li><img src='"+ic+"' alt='' onerror=\"this.remove()\">"); }
        return li.replace(/^<li>/, "<li><span class='vide'></span>");
      }).join("");
      if(trouve / lignes.length < 0.66) return tout;
      return "<"+bal+" class='avec-icones'>"+neuf+"</"+bal+">";
    });
  }

  function vueSlide(sl, s){
    var ic = function(r, cls){ var u = I.role(r); return u ? "<img "+(cls?"class='"+cls+"' ":"")+
             "src='"+u+"' alt='' onerror=\"this.remove()\">" : ""; };

    if(sl.type==="titre"){
      var h = (sl.dc ? "<span class='sur'>"+esc(sl.dc)+"</span>" : "") +
              "<h1 class='dia'>"+esc(sl.titre)+"</h1>";
      if(sl.competences && sl.competences.length){
        h += "<p class='intro-comp'>"+ic("competence")+"Ce que l'examen attend de vous</p><div class='comps'>";
        sl.competences.forEach(function(c){
          var cats = Object.keys(c.epreuve||{});
          var prat = cats.some(function(k){ return c.epreuve[k]==="P"; });
          var cls = cats.length ? (prat?"p":"t") : "i";
          var tag = cats.length ? (prat?"pratique":"théorique") : "information";
          h += "<div class='cp'><span class='tp "+cls+"'>"+tag+"</span><span class='lb'>"+esc(c.lib)+"</span>"+
               (c.nouveau ? "<span class='neuf'>"+ic("nouveau")+"nouveau 2025</span>" : "")+
               "<span class='cd'>"+esc(c.code)+"</span></div>";
        });
        h += "</div>";
        if(sl.competences.some(function(c){ return c.tirage_au_sort; }))
          h += "<div class='avert'>"+ic("piege")+"<span>Groupe tiré au sort le jour de l'épreuve — "+
               "les quatre composants se travaillent.</span></div>";
      }
      if(s && s.type==="cours" && !s.video)
        h += "<div class='vid'>Emplacement vidéo — lien à fournir</div>";
      else if(s && s.video)
        h += "<div class='vid'><a href='"+esc(s.video)+"' target='_blank' rel='noopener'>"+
             "Ouvrir la vidéo de la séquence ▸</a></div>";
      return { html:"<div>"+h+"</div>", visuel: colonne(s, sl.titre) };
    }

    /* L'expérience interactive reliée à la fiche : une diapositive de
       lancement — on projette l'expérience elle-même (nouvel onglet), le
       texte de la fiche reste pour les diapositives suivantes. */
    if(sl.type==="experience")
      return { html:"<div class='lancer'><h2 class='dia'>"+esc(sl.titre)+"</h2>"+
                    "<a href='"+esc(sl.url)+"' target='_blank' rel='noopener'>"+
                    ic("experience")+esc(sl.lancer)+" ▸</a>"+
                    (sl.desc ? "<p class='desc'>"+esc(sl.desc)+"</p>" : "")+"</div>",
               visuel:"" };

    if(sl.type==="schema")
      return { html:"<div class='plein'><h2 class='dia' style='margin:0'>"+esc(sl.titre)+"</h2>"+
                    "<img src='"+esc((P.base_img||"")+sl.src.replace(/^packs\/fluides\/res\//,""))+"' "+
                    "alt='"+esc(sl.alt)+"'>"+
                    (sl.alt ? "<p class='lg'>"+esc(sl.alt)+"</p>" : "")+"</div>",
               visuel:"" };

    if(sl.type==="encadre"){
      var genre = esc(sl.genre||"");
      var role = genre === "piege" ? "piege" : genre === "cle" ? "cle" : "competence";
      return { html:"<div><span class='sur calme'>"+esc(sl.titre||"")+"</span>"+
                    "<div class='enc "+genre+"'><div class='t'>"+ic(role)+esc(sl.t)+"</div>"+
                    "<div class='corps'>"+iconerListes(sl.html||"")+"</div></div></div>",
               visuel: colonne(s, (sl.t||"") + " " + (sl.html||"")) };
    }

    /* Le plateau ne se projette pas : on annonce le passage à la machine, et
       l'écran s'efface. Une seule diapositive, pour garder le fil du jour. */
    if(sl.type==="plateau")
      return { html:"<div class='plateau'>"+ic("plateau","pic")+
                    "<span class='du'>On passe au plateau — "+Math.floor(sl.minutes/60)+" h "+
                    pad(sl.minutes%60)+"</span>"+
                    "<p class='tt'>"+esc(sl.titre)+"</p>"+
                    "<p class='no'>Préparation de chantier faite, EPI en place, consignation "+
                    "vérifiée. Le support reste ouvert pour la reprise.</p></div>",
               visuel:"" };

    return { html:"<div><span class='sur calme'>"+esc(sl.titre||"")+"</span>"+
                  "<div class='corps'>"+iconerListes(sl.html||"")+"</div></div>",
             visuel: colonne(s, sl.html||"") };
  }

  function vueQuestion(q, s){
    if(!q) return { html:"<p>Question absente.</p>", visuel:"" };
    var ic = function(r){ var u = I.role(r); return u ? "<img src='"+u+"' alt='' onerror=\"this.remove()\">" : ""; };
    var L = ["A","B","C","D","E","F"];
    var h = "<p class='qq'>"+ic("question")+"<span>"+esc(q.enonce)+"</span></p><div class='ch'>";
    q.choix.forEach(function(c,i){
      h += "<div class='"+(S.revele && i===q.bonne ? "bon":"")+"'><span class='lt'>"+L[i]+".</span>"+
           "<span>"+esc(c)+"</span></div>";
    });
    h += "</div>";
    if(!S.revele && q.aide) h += "<p class='indice'>"+esc(q.aide)+"</p>";
    if(S.revele && q.remed){
      h += "<div class='rem'>";
      if(q.remed.regle)    h += "<p><span class='et'>La règle</span>"+esc(q.remed.regle)+"</p>";
      if(q.remed.pourquoi) h += "<p><span class='et'>Pourquoi</span>"+esc(q.remed.pourquoi)+"</p>";
      if(q.remed.exemple)  h += "<p><span class='et'>Exemple</span>"+esc(q.remed.exemple)+"</p>";
      if(q.remed.piege)    h += "<p><span class='et al'>Le piège</span>"+esc(q.remed.piege)+"</p>";
      h += "</div>";
    } else if(S.revele && q.explication){
      h += "<div class='rem'><p>"+esc(q.explication)+"</p></div>";
    }
    return { html:"<div>"+h+"</div>", visuel: colonne(s, q.enonce) };
  }

  /* La face « guidance formateur » du cahier des charges : le déroulé,
     ce qu'il faut renforcer, et la réponse — visible de l'animateur seul. */
  function majNotes(s, estQuestion){
    var el = document.getElementById("notes");
    el.className = "notes" + (S.notes ? " on" : "");
    var h = "";
    if(s.notes) h += "<div class='t'>Conduite de séquence</div>"+esc(s.notes);
    if(estQuestion){
      var q = s.questions[S.i - s.slides.length];
      if(q) h += "<div class='rep'><b>Réponse attendue :</b> "+["A","B","C","D","E","F"][q.bonne]+
                 " — "+esc(q.choix[q.bonne])+"</div>";
    }
    el.innerHTML = h || "<div class='t'>Aucune note pour cette séquence.</div>";
  }

  /* ---------------- Navigation ---------------- */
  function suiv(){
    var s = seqCourante();
    // sur une question : la première pression révèle, la seconde avance
    if(S.i >= s.slides.length && !S.revele){ S.revele = true; render(); return; }
    if(S.i < total()-1){ S.i++; S.revele=false; render(); return; }
    // fin de séquence : on enchaîne
    var j = P.jours[S.jour];
    if(S.seq < j.sequences.length-1) ouvrir(S.jour, S.seq+1);
    else if(S.jour < P.jours.length-1) ouvrir(S.jour+1, 0);
    else renderSommaire();
  }
  function prec(){ if(S.i>0){ S.i--; S.revele=false; render(); } }

  document.addEventListener("keydown", function(e){
    if(!scene.classList.contains("on")) return;
    if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); suiv(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); prec(); }
    else if(e.key==="r"||e.key==="R"){ S.revele=true; render(); }
    else if(e.key==="n"||e.key==="N"){ S.notes=!S.notes; render(); }
    else if(e.key==="p"||e.key==="P"){ plein(); }
    else if(e.key==="Escape"){ renderSommaire(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-act]"), function(b){
    b.onclick = function(){
      var a = b.getAttribute("data-act");
      if(a==="suiv") suiv(); else if(a==="prec") prec();
      else if(a==="reveler"){ S.revele=true; render(); }
      else if(a==="notes"){ S.notes=!S.notes; render(); }
      else if(a==="plein") plein();
      else if(a==="sortir") renderSommaire();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ech]"), function(b){
    b.onclick = function(){ poserEchelle(parseFloat(b.getAttribute("data-ech"))); };
  });
  function plein(){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }
  // le plein écran change la hauteur de la scène : les cqh bougent, on remesure
  document.addEventListener("fullscreenchange", function(){ setTimeout(ajuster, 120); });
  window.addEventListener("resize", function(){ ajuster(); });

  /* ---------------- Minuteur de séquence ---------------- */
  function lancerChrono(min){
    arreterChrono();
    S.reste = (min||0)*60;
    var el = document.getElementById("chrono");
    var tic = function(){
      var m = Math.floor(Math.abs(S.reste)/60), s = Math.abs(S.reste)%60;
      el.textContent = (S.reste<0?"+":"")+m+":"+pad(s);
      el.className = "chrono" + (S.reste<=0 ? " fin" : "");
      S.reste--;
    };
    tic(); S.chrono = setInterval(tic, 1000);
  }
  function arreterChrono(){ if(S.chrono){ clearInterval(S.chrono); S.chrono=null; } }

  function pad(n){ return (n<10?"0":"")+n; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  // sonde pour les contrôles automatisés du support
  window.__projection = { ouvrir:ouvrir, sommaire:renderSommaire, etat:S, total:total, pack:P };

  renderSommaire();
}
Portillon.exiger("Support de projection", ["packs/fluides/projection.gen.js?v=7f90a74374"], demarrerProjection);
</script>
