<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Les trois zones d’un condenseur à air</title>
  <desc id="desc">Le fluide entre à gauche sous forme de vapeur haute pression surchauffée. Il traverse la désurchauffe, la condensation puis le sous-refroidissement avant de sortir à droite sous forme de liquide haute pression. L’air plus frais traverse la batterie et ressort plus chaud.</desc>
  <defs>
    <linearGradient id="coil" x1="0" x2="1">
      <stop offset="0" stop-color="#D93B2B"/>
      <stop offset="0.31" stop-color="#D93B2B"/>
      <stop offset="0.69" stop-color="#7D5A86"/>
      <stop offset="1" stop-color="#2563A6"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#1B6F9C"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#B83224"/>
    </marker>
    <style>
      .zone{fill:#FFFDF8;stroke:#1B3A63;stroke-width:2}.guide{stroke:#8091A8;stroke-width:2;stroke-dasharray:8 8}.label{font:700 23px 'Trebuchet MS',sans-serif;fill:#1B3A63}.small{font:600 17px Calibri,'Segoe UI',sans-serif;fill:#10233C}.state{font:700 18px Calibri,'Segoe UI',sans-serif}.air{fill:none;stroke:#1B6F9C;stroke-width:7;stroke-linecap:round;marker-end:url(#arrowBlue);stroke-dasharray:16 12;animation:air 2.4s linear infinite}.flow{fill:none;stroke:url(#coil);stroke-width:24;stroke-linecap:round;stroke-linejoin:round}.flow-arrow{fill:none;stroke:#B83224;stroke-width:4;marker-end:url(#arrowRed);stroke-dasharray:10 8;animation:fluid 2.2s linear infinite}.fin{stroke:#9AA8B9;stroke-width:3}.vap{fill:#D93B2B;stroke:#7A211A;stroke-width:2}.liq{fill:#2563A6;stroke:#153F6E;stroke-width:2}.mix{fill:#7D5A86;stroke:#51375B;stroke-width:2}@keyframes air{to{stroke-dashoffset:-56}}@keyframes fluid{to{stroke-dashoffset:-54}}
    </style>
  </defs>

  <rect width="960" height="560" rx="26" fill="#F7F1E7"/>
  <text x="480" y="42" text-anchor="middle" class="label" font-size="28">De la vapeur au liquide</text>

  <rect class="zone" x="52" y="70" width="267" height="350" rx="18"/>
  <rect class="zone" x="346" y="70" width="267" height="350" rx="18"/>
  <rect class="zone" x="640" y="70" width="267" height="350" rx="18"/>
  <line class="guide" x1="332" y1="78" x2="332" y2="414"/>
  <line class="guide" x1="626" y1="78" x2="626" y2="414"/>

  <text x="185" y="108" text-anchor="middle" class="label">1 · Désurchauffe</text>
  <text x="479" y="108" text-anchor="middle" class="label">2 · Condensation</text>
  <text x="773" y="108" text-anchor="middle" class="label">3 · Sous-refroidissement</text>
  <text x="185" y="137" text-anchor="middle" class="small">vapeur → vapeur</text>
  <text x="479" y="137" text-anchor="middle" class="small">vapeur + liquide → liquide</text>
  <text x="773" y="137" text-anchor="middle" class="small">liquide → liquide</text>

  <g opacity=".45" aria-hidden="true">
    <path class="fin" d="M95 178v178M125 178v178M155 178v178M185 178v178M215 178v178M245 178v178M275 178v178"/>
    <path class="fin" d="M389 178v178M419 178v178M449 178v178M479 178v178M509 178v178M539 178v178M569 178v178"/>
    <path class="fin" d="M683 178v178M713 178v178M743 178v178M773 178v178M803 178v178M833 178v178M863 178v178"/>
  </g>

  <path class="flow" d="M24 255H934"/>
  <path class="flow-arrow" d="M80 255H285"/>
  <path class="flow-arrow" d="M378 255H575"/>
  <path class="flow-arrow" d="M672 255H870"/>

  <g aria-hidden="true">
    <circle class="vap" cx="104" cy="255" r="10"/><circle class="vap" cx="162" cy="255" r="10"/><circle class="vap" cx="222" cy="255" r="10"/><circle class="vap" cx="286" cy="255" r="10"/>
    <circle class="vap" cx="390" cy="255" r="10"/><circle class="mix" cx="447" cy="255" r="10"/><circle class="mix" cx="503" cy="255" r="10"/><circle class="liq" cx="559" cy="255" r="10"/>
    <circle class="liq" cx="682" cy="255" r="10"/><circle class="liq" cx="742" cy="255" r="10"/><circle class="liq" cx="802" cy="255" r="10"/><circle class="liq" cx="862" cy="255" r="10"/>
  </g>

  <text x="35" y="220" class="state" fill="#8E251C">ENTRÉE</text>
  <text x="68" y="302" class="small">Vapeur HP surchauffée</text>
  <text x="925" y="220" text-anchor="end" class="state" fill="#153F6E">SORTIE</text>
  <text x="892" y="302" text-anchor="end" class="small">Liquide HP sous-refroidi</text>

  <g aria-label="L’air traverse la batterie et se réchauffe">
    <path class="air" d="M155 510V440"/><path class="air" d="M330 510V440"/><path class="air" d="M505 510V440"/><path class="air" d="M680 510V440"/><path class="air" d="M855 510V440"/>
    <text x="78" y="534" class="small" fill="#1B6F9C">AIR PLUS FRAIS</text>
    <text x="882" y="458" text-anchor="end" class="small" fill="#8E251C">AIR PLUS CHAUD</text>
  </g>
</svg>
