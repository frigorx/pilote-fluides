<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Mesurer le sous-refroidissement</title>
  <desc id="desc">La pression haute pression donne la température de saturation liquide avec la relation pression température du fluide. Une sonde de contact mesure la température du tube liquide à la sortie du condenseur. Le sous-refroidissement est la température de saturation liquide moins la température du tube.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#1B3A63"/></marker>
    <style>
      .card{fill:#FFFDF8;stroke:#1B3A63;stroke-width:2}.title{font:700 25px 'Trebuchet MS',sans-serif;fill:#1B3A63}.text{font:600 18px Calibri,'Segoe UI',sans-serif;fill:#10233C}.tiny{font:600 15px Calibri,'Segoe UI',sans-serif;fill:#10233C}.step{font:700 22px Calibri,'Segoe UI',sans-serif;fill:#C9451A}.link{fill:none;stroke:#1B3A63;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="540" rx="26" fill="#F7F1E7"/>
  <text x="480" y="42" text-anchor="middle" class="title" font-size="29">Deux mesures, puis une soustraction</text>

  <rect class="card" x="34" y="76" width="270" height="334" rx="20"/>
  <rect class="card" x="346" y="76" width="270" height="334" rx="20"/>
  <rect class="card" x="658" y="76" width="268" height="334" rx="20"/>
  <text x="58" y="112" class="step">1</text><text x="91" y="112" class="title">Pression HP</text>
  <text x="370" y="112" class="step">2</text><text x="403" y="112" class="title">Tube liquide</text>
  <text x="682" y="112" class="step">3</text><text x="715" y="112" class="title">Calcul</text>

  <g aria-label="Manomètre haute pression">
    <circle cx="170" cy="215" r="78" fill="#EEF4FA" stroke="#1B3A63" stroke-width="7"/>
    <path d="M170 215 214 174" stroke="#C9451A" stroke-width="8" stroke-linecap="round"/>
    <circle cx="170" cy="215" r="11" fill="#1B3A63"/>
    <path d="M109 190l10 5M128 158l8 9M170 145v13M212 158l-8 9M231 190l-10 5" stroke="#1B3A63" stroke-width="4"/>
    <text x="170" y="253" text-anchor="middle" class="text">HP</text>
  </g>
  <text x="169" y="325" text-anchor="middle" class="text">Pression → relation P/T</text>
  <text x="169" y="350" text-anchor="middle" class="text">→ T saturation liquide</text>
  <text x="169" y="382" text-anchor="middle" class="tiny">Mélange à glissement :</text>
  <text x="169" y="401" text-anchor="middle" class="tiny">prendre le point bulle.</text>

  <g aria-label="Sonde de contact fixée sur le tube liquide">
    <path d="M375 250H586" stroke="#2563A6" stroke-width="32" stroke-linecap="round"/>
    <path d="M452 167v64" stroke="#1B3A63" stroke-width="18" stroke-linecap="round"/>
    <rect x="412" y="129" width="80" height="63" rx="13" fill="#FFF4C2" stroke="#1B3A63" stroke-width="5"/>
    <text x="452" y="169" text-anchor="middle" class="text">T °C</text>
    <path d="M420 218q32-26 64 0" fill="none" stroke="#FF6B35" stroke-width="9"/>
  </g>
  <text x="481" y="325" text-anchor="middle" class="text">Sonde en bon contact</text>
  <text x="481" y="350" text-anchor="middle" class="text">à la sortie du condenseur</text>
  <text x="481" y="382" text-anchor="middle" class="tiny">Mesurer la pression et le tube</text>
  <text x="481" y="401" text-anchor="middle" class="tiny">au même régime stabilisé.</text>

  <text x="792" y="188" text-anchor="middle" class="title" font-size="22">Sous-refroidissement</text>
  <rect x="690" y="222" width="204" height="98" rx="15" fill="#EEF4FA" stroke="#1B3A63" stroke-width="3"/>
  <text x="792" y="262" text-anchor="middle" class="text">SR = T sat. liquide</text>
  <text x="792" y="294" text-anchor="middle" class="text">− T tube liquide</text>
  <text x="792" y="352" text-anchor="middle" class="text">Résultat en kelvins (K)</text>
  <text x="792" y="384" text-anchor="middle" class="tiny">Une différence de température,</text>
  <text x="792" y="403" text-anchor="middle" class="tiny">pas une température absolue.</text>

  <path class="link" d="M305 244h33"/><path class="link" d="M617 244h33"/>
  <rect x="144" y="449" width="672" height="57" rx="16" fill="#FFF4C2" stroke="#C9451A" stroke-width="2"/>
  <text x="480" y="474" text-anchor="middle" class="text">La valeur attendue vient de la documentation du système.</text>
  <text x="480" y="497" text-anchor="middle" class="tiny">Ne pas ajouter du fluide sur ce seul indice.</text>
</svg>
