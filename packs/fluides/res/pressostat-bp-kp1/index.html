<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Module inerWeb Édu hors ligne : comprendre et régler un pressostat basse pression de sécurité.">
  <title>Pressostat BP de sécurité — inerWeb Édu</title>
  <style>:root {
  --navy: #1b3a63;
  --ink: #10233c;
  --orange: #ff6b35;
  --orange-deep: #c9451a;
  --blue: #3d7fca;
  --blue-soft: #84b7ec;
  --cream: #f7f1e7;
  --paper: #fffdf8;
  --muted: #637285;
  --line: rgba(27, 58, 99, .16);
  --ok: #1e7e54;
  --ok-bg: #e3f5ec;
  --danger: #c0392b;
  --danger-bg: #fbe7e4;
  --wait: #b06a00;
  --wait-bg: #fff4e0;
  --shadow: 0 10px 30px rgba(27, 58, 99, .12);
}

* { box-sizing: border-box; }

html, body { width: 100%; height: 100%; margin: 0; }

body {
  overflow: hidden;
  background: var(--cream);
  color: var(--ink);
  font-family: Calibri, "Segoe UI", system-ui, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; }
button { cursor: pointer; }

button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid rgba(255, 107, 53, .55);
  outline-offset: 2px;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.course-app {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  display: grid;
  grid-template-rows: 48px 30px minmax(0, 1fr) 52px;
}

.topbar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 5px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 253, 248, .96);
}

.brand { display: flex; align-items: center; min-width: 0; }
.brand-logo { display: block; height: 30px; width: auto; }
.print-signature { display: none; }

.course-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: center;
  color: var(--navy);
  font: 700 16px/1 "Trebuchet MS", Calibri, Arial, sans-serif;
}

.tools { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
.tool-button, .speed-select {
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
  color: var(--navy);
  font-size: 12px;
  font-weight: 700;
}
.tool-button { padding: 0 10px; }
.tool-button.compact { width: 36px; padding: 0; }
.tool-button[aria-pressed="true"] { border: 3px double var(--ok); background: var(--ok-bg); color: var(--ok); }
.tool-button:disabled { cursor: not-allowed; opacity: .45; }
.speed-select { padding: 0 4px; }

.progress-row {
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr) 70px;
  align-items: center;
  gap: 10px;
  padding: 3px 14px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}
.progress-row > :last-child { text-align: right; }
.progress-track {
  height: 8px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
}
.progress-track span { display: block; width: 0; height: 100%; background: var(--orange); transition: width 180ms ease; }

.lesson-grid {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.18fr) minmax(330px, .82fr);
  gap: 10px;
  padding: 0 10px 8px;
}

.visual-panel, .lesson-panel {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--paper);
  box-shadow: var(--shadow);
}

.visual-panel { display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: 8px 10px 6px; }
.visual-stage { min-height: 0; display: grid; place-items: center; overflow: hidden; }
.visual-stage > svg { display: block; width: 100%; height: 100%; max-height: 100%; }
.visual-caption { margin: 3px 4px 0; color: var(--muted); text-align: center; font-size: 11px; line-height: 1.2; }

.visual-composite {
  width: 100%;
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 6px;
}
.visual-tabs { display: flex; justify-content: center; gap: 6px; }
.visual-tab {
  min-height: 34px;
  padding: 5px 14px;
  border: 2px solid var(--navy);
  border-radius: 999px;
  background: var(--paper);
  color: var(--navy);
  font-size: 12px;
  font-weight: 800;
}
.visual-tab[aria-selected="true"] {
  border: 4px double var(--orange-deep);
  background: var(--wait-bg);
  color: var(--orange-deep);
}
.visual-mode-body { width: 100%; height: 100%; min-height: 0; display: grid; place-items: center; overflow: hidden; }
.visual-mode-body > svg { display: block; width: 100%; height: 100%; max-height: 100%; }
.visual-mode-body > div { width: 100%; height: 100%; min-height: 0; }
.claude-frame {
  width: 100%;
  height: 100%;
  min-height: 0;
  margin: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 4px;
  overflow: hidden;
}
.claude-frame img {
  width: 100%;
  height: 100%;
  min-height: 0;
  display: block;
  object-fit: contain;
  border-radius: 13px;
  background: #071b34;
}
.claude-frame figcaption { display: flex; align-items: baseline; justify-content: center; gap: 7px; color: var(--muted); font-size: 10px; line-height: 1.2; text-align: center; }
.claude-frame figcaption strong { color: var(--navy); }

.lesson-panel { display: flex; flex-direction: column; padding: clamp(14px, 2.1vw, 26px); }
.lesson-kicker {
  margin-bottom: 4px;
  color: var(--orange-deep);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}
h1 {
  margin: 0 0 8px;
  color: var(--navy);
  font: 700 clamp(24px, 2.5vw, 38px)/1.08 "Trebuchet MS", Calibri, Arial, sans-serif;
  letter-spacing: -.015em;
}
.lesson-lead { margin: 0 0 10px; color: var(--ink); font-size: clamp(15px, 1.25vw, 18px); line-height: 1.45; }
.lesson-list { margin: 0; padding-left: 1.15em; color: var(--ink); font-size: clamp(14px, 1.05vw, 16px); line-height: 1.42; }
.lesson-list li { margin-bottom: 6px; padding-left: 3px; }

.callout {
  margin-top: auto;
  padding: 10px 12px;
  border: 2px solid var(--navy);
  border-left-width: 6px;
  border-radius: 12px;
  background: var(--paper);
  font-size: 14px;
  line-height: 1.35;
}
.callout strong { display: block; margin-bottom: 2px; color: var(--navy); }
.callout[data-type="key"] { border-style: double; border-width: 4px 2px 4px 7px; border-color: var(--ok); background: var(--ok-bg); }
.callout[data-type="key"] strong { color: var(--ok); }
.callout[data-type="warning"] { border-style: dashed; border-width: 2px 2px 2px 6px; border-color: var(--orange-deep); background: var(--wait-bg); }
.callout[data-type="warning"] strong { color: var(--orange-deep); }
.callout[data-type="note"] { border-left-style: dotted; border-color: var(--blue); background: #f3f7fb; }

.navigation {
  display: grid;
  grid-template-columns: 130px minmax(0, 1fr) 150px;
  align-items: center;
  gap: 10px;
  padding: 5px 10px;
  border-top: 1px solid var(--line);
  background: rgba(247, 241, 231, .98);
}
.nav-button { height: 40px; border-radius: 999px; font-size: 14px; font-weight: 800; }
.nav-button.primary { border: 2px solid var(--navy); background: var(--navy); color: #fff; }
.nav-button.secondary { border: 2px solid var(--navy); background: var(--paper); color: var(--navy); }
.nav-button:disabled { cursor: not-allowed; opacity: .42; }
.nav-state { overflow: hidden; color: var(--muted); text-align: center; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 700; }

/* Visuels et activités */
.visual-html { width: 100%; height: 100%; min-height: 0; display: grid; place-items: center; padding: 4px; }
.compare-grid, .model-grid, .record-grid { width: min(96%, 760px); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mini-card {
  min-width: 0;
  padding: clamp(10px, 1.7vw, 18px);
  border: 2px solid var(--navy);
  border-radius: 16px;
  background: var(--paper);
}
.mini-card h3 { margin: 0 0 7px; color: var(--navy); font: 700 clamp(16px, 1.6vw, 22px)/1.1 "Trebuchet MS", Calibri, Arial, sans-serif; }
.mini-card p { margin: 4px 0; font-size: clamp(12px, 1.15vw, 15px); line-height: 1.35; }
.mini-card.safety { border-style: double; border-width: 5px; border-color: var(--danger); }
.mini-card.regulation { border-style: dashed; border-color: var(--blue); }
.status-pill { display: inline-flex; align-items: center; gap: 5px; margin-bottom: 7px; padding: 4px 9px; border: 2px solid currentColor; border-radius: 999px; font-size: 11px; font-weight: 800; }
.status-pill.danger { color: var(--danger); background: var(--danger-bg); border-style: dashed; }
.status-pill.ok { color: var(--ok); background: var(--ok-bg); border-style: double; }
.status-pill.info { color: var(--navy); background: #f3f7fb; }
.formula { color: var(--navy); font: 800 clamp(18px, 2.5vw, 34px)/1.1 Consolas, monospace; }

.lab { width: min(96%, 760px); min-height: 0; display: grid; gap: 10px; }
.lab-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lab-field { min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: #f3f7fb; }
.lab-field label { display: block; margin-bottom: 4px; color: var(--navy); font-size: 11px; font-weight: 800; }
.lab-field input { width: 100%; min-height: 36px; padding: 4px 8px; border: 2px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font: 700 18px/1 Consolas, monospace; }
.lab-result { min-height: 46px; padding: 9px 12px; border: 2px solid var(--navy); border-radius: 12px; background: var(--paper); color: var(--navy); text-align: center; font-size: 14px; font-weight: 800; }
.lab-result.ok { border-style: double; border-width: 4px; border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.lab-result.danger { border-style: dashed; border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
.lab-result.wait { border-style: dotted; border-color: var(--wait); background: var(--wait-bg); color: #7a4a00; }
.pressure-slider { width: 100%; accent-color: var(--blue); }
.button-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.activity-button { min-height: 38px; padding: 7px 13px; border: 2px solid var(--navy); border-radius: 999px; background: var(--paper); color: var(--navy); font-size: 13px; font-weight: 800; }
.activity-button[aria-pressed="true"] { border-style: double; border-width: 4px; background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }

.quiz-area { display: grid; gap: 8px; margin-top: 4px; }
.quiz-choice {
  width: 100%;
  min-height: 46px;
  padding: 9px 12px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
  color: var(--ink);
  text-align: left;
  font-size: 15px;
  font-weight: 700;
}
.quiz-choice.correct { border: 4px double var(--ok); background: var(--ok-bg); color: var(--ok); }
.quiz-choice.incorrect { border: 2px dashed var(--danger); background: var(--danger-bg); color: var(--danger); }
.quiz-choice:disabled { cursor: default; opacity: 1; }
.feedback { margin-top: auto; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 700; line-height: 1.35; }
.feedback.correct { border: 4px double var(--ok); background: var(--ok-bg); color: var(--ok); }
.feedback.incorrect { border: 2px dashed var(--danger); background: var(--danger-bg); color: var(--danger); }

body.reading-mode .lesson-grid { grid-template-columns: minmax(0, .95fr) minmax(360px, 1.05fr); }
body.reading-mode .lesson-panel { padding: 18px 24px; }
body.reading-mode .lesson-lead, body.reading-mode .lesson-list, body.reading-mode .callout { font-size: 1.05em; line-height: 1.55; }

/* Refonte V2 — visuels techniques et activités */
.visual-stage > div { width: 100%; height: 100%; min-height: 0; }
.technical-svg { display: block; width: 100%; height: 100%; min-height: 0; }
.mechanism-lab, .deadband-lab, .envelope-lab { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 7px; }
.mechanism-controls { display: grid; grid-template-columns: auto minmax(135px, .55fr) minmax(120px, 1fr) auto minmax(180px, 1fr); align-items: center; gap: 7px; }
.mechanism-controls label { color: var(--navy); text-align: center; font-size: 11px; font-weight: 800; }
.mechanism-controls output { display: block; color: var(--orange-deep); font: 800 17px/1.1 Consolas, monospace; }
.mechanism-controls input, .deadband-controls input, .cycle-gauge input { width: 100%; accent-color: var(--blue); }
.mechanism-controls .lab-result { min-height: 38px; padding: 6px 8px; font-size: 11px; }

.symbol-workflow { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-content: center; padding: 28px 18px 52px; }
.workflow-line { position: absolute; z-index: 0; top: 50%; left: 9%; right: 9%; height: 6px; background: var(--orange-deep); }
.symbol-card { position: relative; z-index: 1; min-width: 0; margin: 0; padding: 18px 10px 12px; border: 3px solid var(--navy); border-radius: 18px; background: var(--paper); text-align: center; box-shadow: 0 7px 16px rgba(27,58,99,.13); }
.symbol-card img { display: block; width: 86px; height: 86px; margin: auto; object-fit: contain; }
.symbol-card h3 { margin: 8px 0 2px; color: var(--navy); font: 800 16px/1.1 "Trebuchet MS",sans-serif; }
.symbol-card p { margin: 0; color: var(--muted); font-size: 12px; }
.symbol-step { position: absolute; top: -15px; left: calc(50% - 15px); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: white; font-weight: 800; }
.library-seal { position: absolute; right: 16px; bottom: 10px; left: 16px; padding: 8px; border: 3px double var(--ok); border-radius: 10px; background: var(--ok-bg); color: var(--ok); text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .06em; }

.snap-sequence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-content: center; padding: 18px; }
.snap-card { position: relative; min-width: 0; padding: 20px 14px 12px; border: 3px solid var(--navy); border-radius: 18px; background: var(--paper); text-align: center; }
.snap-card > span { position: absolute; top: -15px; left: calc(50% - 15px); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: white; font-weight: 800; }
.snap-card h3 { min-height: 34px; margin: 4px 0; color: var(--navy); font-size: 15px; }
.snap-card svg { width: 112px; height: 82px; }
.snap-card p { margin: 0; color: var(--muted); font-size: 12px; }
.snap-note { grid-column: 1/-1; display: flex; justify-content: center; gap: 12px; padding: 9px; border: 3px double var(--ok); border-radius: 12px; background: var(--ok-bg); color: var(--ok); }

.deadband-controls { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.deadband-lab .lab-result { min-height: 38px; padding: 6px; font-size: 12px; }

.calculation-lab { display: grid; grid-template-rows: auto auto auto auto auto; gap: 7px; align-content: center; padding: 8px 14px; }
.target-tabs, .formula-choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
.target-tab, .formula-choices button { min-height: 38px; padding: 5px 7px; border: 2px solid var(--navy); border-radius: 10px; background: var(--paper); color: var(--navy); font-size: 11px; font-weight: 800; }
.target-tab.active, .formula-choices button.selected { border: 4px double var(--ok); background: var(--ok-bg); color: var(--ok); }
.formula-choices button.wrong { border-style: dashed; border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
.pressure-ruler { display: grid; grid-template-columns: 1fr 2fr 1fr; overflow: hidden; border: 3px solid var(--navy); border-radius: 14px; text-align: center; font-size: 12px; font-weight: 800; }
.pressure-ruler > span { display: grid; place-items: center; min-height: 62px; padding: 5px; }
.ruler-cutout { background: var(--danger-bg); color: var(--danger); }
.ruler-zone { border-right: 3px dashed var(--wait); border-left: 3px dashed var(--wait); background: var(--wait-bg); color: #7a4a00; }
.ruler-cutin { background: var(--ok-bg); color: var(--ok); }
.calc-prompt { margin: 0; color: var(--navy); text-align: center; font-size: 12px; font-weight: 800; }
.calc-fields { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)) auto; gap: 7px; align-items: stretch; }
.calc-fields .lab-field { padding: 5px; }
.calc-fields .lab-field.answer { border: 3px dashed var(--orange-deep); background: var(--wait-bg); }
.primary-action { background: var(--navy); color: white; }
.calculation-lab .lab-result { min-height: 38px; padding: 6px; font-size: 11px; }

.contact-lab { display: grid; grid-template-columns: minmax(0, 1fr) 180px; grid-template-rows: minmax(0,1fr) auto; gap: 8px; padding: 6px; }
.contact-main { min-height: 0; }
.contact-symbol { display: grid; grid-template-rows: auto minmax(70px,1fr) auto; min-height: 0; padding: 10px; border: 3px double var(--navy); border-radius: 14px; background: #f3f7fb; text-align: center; }
.contact-symbol span { color: var(--navy); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
.contact-symbol img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
.contact-symbol p { margin: 3px 0 0; color: var(--muted); font-size: 10px; line-height: 1.2; }
.contact-buttons { grid-column: 1/-1; display: flex; justify-content: center; gap: 8px; }

.model-compare { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; align-content: center; padding: 10px; }
.model-card { display: grid; grid-template-columns: 130px 1fr; min-width: 0; overflow: hidden; border: 3px solid var(--navy); border-radius: 16px; background: var(--paper); }
.model-card.manual { border-style: dashed; border-color: var(--danger); }
.model-face { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; align-content: start; padding: 14px 8px; background: #171b21; color: white; text-align: center; font-size: 11px; font-weight: 800; }
.model-face i { display: block; height: 132px; border: 1px solid #637285; background: repeating-linear-gradient(to bottom,transparent 0 16px,#c7d0db 17px 19px); }
.model-face.one { grid-template-columns: 1fr; }
.model-face.one b { padding: 7px; border-radius: 6px; background: var(--danger); }
.model-card > div:last-child { padding: 12px; }
.model-card h3 { margin: 2px 0 7px; color: var(--navy); font-size: 15px; }
.model-card dl { display: grid; grid-template-columns: 1fr 1fr; margin: 0; font-size: 11px; }
.model-card dt,.model-card dd { margin: 0; padding: 4px; border-bottom: 1px solid var(--line); }
.model-card dd { font-weight: 800; }
.model-rule { grid-column: 1/-1; display: flex; justify-content: center; gap: 12px; padding: 8px; border: 3px double var(--ok); border-radius: 10px; background: var(--ok-bg); color: var(--ok); font-size: 12px; }

.envelope-lab { padding: 8px; }
.lab-row.two { grid-template-columns: repeat(2,minmax(0,1fr)); }
.envelope-lab .lab-result { min-height: 38px; padding: 6px; font-size: 11px; }

.kp-console { position: relative; display: grid; grid-template-rows: auto minmax(0,1fr); gap: 6px; padding: 6px; }
.kp-provenance { padding: 5px 8px; border: 3px double var(--ok); border-radius: 9px; background: var(--ok-bg); color: var(--ok); text-align: center; font-size: 10px; font-weight: 800; letter-spacing: .07em; }
.kp-face-grid { min-height: 0; display: grid; grid-template-columns: minmax(170px,.8fr) minmax(200px,1fr) minmax(170px,.7fr); gap: 8px; }
.kp-hardware,.kp-gauge { min-height: 0; display: grid; place-items: center; }
.kp-hardware svg,.kp-gauge svg { width: 100%; height: 100%; min-height: 0; }
.kp-gauge { grid-template-rows: minmax(0,1fr) auto; }
.kp-equation { margin-top: -4px; padding: 6px 12px; border-radius: 999px; background: var(--wait-bg); color: #7a4a00; font: 800 16px/1 Consolas,monospace; }
.kp-settings { display: grid; grid-template-rows: auto auto auto auto; gap: 7px; align-content: center; }
.kp-setting,.kp-output { padding: 9px; border: 2px solid var(--navy); border-radius: 13px; background: var(--paper); text-align: center; }
.kp-setting.diff { border-color: var(--orange-deep); }
.kp-setting span,.kp-output span { display: block; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
.kp-setting strong,.kp-output strong { display: block; color: var(--navy); font: 800 20px/1.2 Consolas,monospace; }
.kp-setting.diff strong { color: var(--orange-deep); }
.kp-setting > div { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 5px; }
.kp-setting button { display: grid; place-items: center; width: 34px; height: 28px; border: 2px solid var(--navy); border-radius: 8px; background: var(--paper); color: var(--navy); font-weight: 900; }

  <script>window.__INERWEB_COURSE__ = {"product":"inerWeb Édu — Pressostat BP de sécurité","version":"2.4.0-brouillon","status":"Refonte pédagogique à valider","lessons":[{"id":"intro","short":"Mission","kicker":"Observer avant de régler","title":"Du raccord de pression jusqu’au contact électrique","lead":"Ce parcours montre ce qui bouge réellement dans un pressostat BP mécanique, puis comment régler ses deux seuils.","bullets":["Référence pédagogique principale : Danfoss KP1 mécanique.","Les grandes fonctions restent comparables chez d’autres fabricants.","La notice de l’appareil posé et les limites de la machine font toujours foi."],"callout":{"type":"key","title":"Mission","text":"Expliquer pression → soufflet → ressorts → bascule → contact, puis calculer le différentiel."},"visual":"product","media":{"src":"assets/illustrations-claude/01-ouverture.png","title":"Ouverture du parcours KP1","alt":"Illustration technique bleu nuit d’un pressostat BP KP1 avec raccord de pression, boîtier ouvert et repères de sécurité basse pression.","note":"Vue d’ensemble fournie par Claude : elle situe le KP1 avant l’exploration du schéma inerWeb.","caption":"Illustration Claude intégrée : ouverture du parcours KP1 basse pression."},"caption":"Vue pédagogique originale d’un pressostat mécanique de la famille KP ; aucune coupe constructeur n’est reproduite."},{"id":"role-library","short":"Repérer","kicker":"Sur le schéma et dans l’armoire","title":"Un même organe relie le circuit frigorifique et la commande","lead":"Le raccord reçoit la pression d’aspiration. Le mécanisme transforme ensuite cette pression en changement de contact.","bullets":["Sur le circuit : symbole PB raccordé au côté basse pression.","Dans la commande : un contact électrique autorise ou retire la marche.","Le pressostat réagit à la pression ; il ne diagnostique pas à lui seul la cause de sa baisse."],"callout":{"type":"note","title":"Bibliothèque inerWeb","text":"Les symboles affichés sont les originaux validés du fonds inerWeb, conservés à l’identique."},"visual":"library","caption":"Symboles validés : pressostat BP, pressostat à contact, inverseur et compresseur."},{"id":"mechanism","short":"Mécanisme","kicker":"Laboratoire animé","title":"La pression pousse le soufflet ; les ressorts s’y opposent","lead":"Fais varier la pression. Observe le soufflet, le bras principal et le contact évoluer dans une seule chaîne mécanique.","bullets":["La force exercée sur le soufflet vaut la pression multipliée par sa surface utile : F = p × S.","Le ressort principal règle l’équilibre de la plage ; le ressort différentiel fixe l’écart de retour.","Le mécanisme à action brusque ne bascule qu’au seuil atteint."],"callout":{"type":"key","title":"Pourquoi un soufflet","text":"Il est étanche par sa seule déformation : pas de piston, donc pas de joint qui frotte, qui grippe ou qui fuit. Sa grande surface donne en plus une force exploitable même à basse pression."},"visual":"mechanism","media":{"src":"assets/illustrations-claude/02-soufflet.png","title":"Pression, soufflet et ressort","alt":"Gros plan pédagogique sur le raccord basse pression, le soufflet métallique et le ressort qui s’oppose à sa déformation.","note":"La pression déforme le soufflet ; le schéma inerWeb permet ensuite de manipuler toute la chaîne mécanique.","caption":"Illustration Claude intégrée : la pression agit sur le soufflet face à l’effort du ressort."},"caption":"Coupe fonctionnelle originale : les positions sont pédagogiques, les fonctions et la causalité sont conservées."},{"id":"snap-action","short":"Bascule","kicker":"Action brusque","title":"La bascule rapide évite un contact hésitant","lead":"Près du seuil, le bras accumule un effort. Le mécanisme franchit ensuite son point d’équilibre et change d’état rapidement.","bullets":["Avant le seuil : le contact conserve son état.","Au seuil : la bascule rapide entraîne le contact inverseur.","Après le seuil : il faut atteindre l’autre seuil pour revenir.","Sans elle, le contact resterait entrouvert autour du seuil : arc électrique, échauffement et pastilles collées."],"callout":{"type":"warning","title":"Le piège","text":"Un pressostat n’est pas un capteur analogique : son contact fournit un état, pas une valeur continue."},"visual":"snap","caption":"Séquence en trois temps : charger l’effort, franchir le point de bascule, maintenir le nouvel état."},{"id":"neutral-zone","short":"Zone neutre","kicker":"Deux seuils et une mémoire","title":"Dans la zone neutre, le dernier seuil franchi décide de l’état","lead":"Descends puis remonte la pression. À valeur égale dans la zone neutre, le contact peut être ouvert ou fermé selon le trajet.","bullets":["En descendant : coupure à CUT OUT.","En remontant : réenclenchement à CUT IN, si le réarmement le permet.","Entre les deux : aucun nouveau basculement ; l’état précédent est mémorisé."],"callout":{"type":"key","title":"Définition","text":"La zone neutre est l’intervalle entre CUT OUT et CUT IN. Sa largeur en bar est le différentiel."},"visual":"deadband","media":{"src":"assets/illustrations-claude/04-seuils.png","title":"Les deux seuils BP","alt":"Mécanisme d’un KP1 : la pression d’aspiration vient d’atteindre CUT IN 1,4 bar, le contact 1–4 se referme et le compresseur redémarre ; une échelle verticale situe CUT IN au-dessus de CUT OUT 0,2 bar.","note":"Le cycle se lit dans les deux sens : coupure à CUT OUT en descendant, réenclenchement à CUT IN en remontant.","caption":"Illustration Claude intégrée : CUT OUT, CUT IN et zone neutre sur un exemple BP."},"caption":"Simulateur d’hystérésis : même pression, état différent selon le sens d’évolution."},{"id":"differential","short":"Différentiel","kicker":"Point clé du réglage","title":"DIFF = CUT IN − CUT OUT","lead":"Choisis la grandeur recherchée, sélectionne la bonne relation et réalise toi-même le calcul avant de vérifier.","bullets":["DIFF : largeur de la zone neutre.","CUT OUT = CUT IN − DIFF.","CUT IN = CUT OUT + DIFF.","Différentiel trop étroit : le compresseur démarre et s’arrête en boucle et s’use. Trop large : la pression descend loin avant le redémarrage."],"callout":{"type":"warning","title":"Ordre des termes","text":"En basse pression automatique, CUT IN est supérieur à CUT OUT : le différentiel doit rester positif."},"visual":"differential","caption":"Atelier de calcul : l’apprenant choisit d’abord la formule, puis saisit son résultat."},{"id":"contacts","short":"1–2–4","kicker":"Contact inverseur SPDT","title":"La borne 1 quitte 4 et rejoint 2 quand la pression baisse","lead":"Bascule entre les deux états et suis simultanément le contact de marche et le contact de signalisation.","bullets":["Pression suffisante : 1–4 fermé ; autorisation de marche.","Sous CUT OUT : 1–4 ouvert et 1–2 fermé.","Sur la notice KP : 1–4 s’ouvre à la baisse ; 1–2 s’ouvre à la hausse."],"callout":{"type":"warning","title":"NO / NF","text":"Toujours préciser l’état de référence et lire le diagramme du modèle ; le seul sigle NO ou NF ne suffit pas."},"visual":"contacts","media":{"src":"assets/illustrations-claude/03-contacts.png","title":"Bascule du contact 1–2–4","alt":"Vue rapprochée du mécanisme à action brusque et du contact inverseur 1–2–4 d’un pressostat BP.","note":"L’illustration montre le passage mécanique ; l’activité inerWeb permet de vérifier séparément les états 1–4 et 1–2.","caption":"Illustration Claude intégrée : le mouvement mécanique provoque une bascule franche du contact."},"caption":"Contact 1–2–4 animé et symbole d’inverseur issu de la bibliothèque inerWeb."},{"id":"models","short":"Référence","kicker":"Lire avant de tourner","title":"Automatique réglable et manuel minimum ne se règlent pas pareil","lead":"Le nom KP1 désigne une famille. La référence exacte fixe l’échelle, le différentiel et le mode de réarmement.","bullets":["Exemple automatique 060-205191 : plage −0,2 à 7,5 bar Pe ; DIFF 0,7 à 4 bar.","Exemple manuel minimum 060-111166 : plage CUT OUT −0,9 à 7 bar Pe ; DIFF fixe 0,7 bar.","Sur le manuel minimum, on règle directement CUT OUT puis on réarme quand la pression est revenue.","Ces plages sont en bar Pe, la pression lue au manomètre : zéro à l’air libre, et −0,2 bar Pe est une dépression."],"callout":{"type":"note","title":"Données Danfoss","text":"Exemples vérifiés dans la fiche de données et les pages produit ; la référence réellement posée reste prioritaire."},"visual":"models","caption":"Deux contrats de réglage dans une même famille : automatique et manuel minimum."},{"id":"choose-cutout","short":"Coupure","kicker":"Protéger avant d’essayer","title":"La valeur de coupure vient d’abord de l’enveloppe du compresseur","lead":"On détermine CUT OUT avant l’essai. Le test ne doit jamais faire travailler le compresseur sous sa limite admissible.","bullets":["Relever la limite basse dans la documentation du compresseur et de la machine.","Si elle est donnée en température d’évaporation, employer la relation P/T correcte du fluide.","Choisir une coupure protectrice, puis contrôler les autres contraintes du dossier."],"callout":{"type":"warning","title":"Arrêt immédiat","text":"Si la limite constructeur est atteinte avant la coupure, arrêter le test et corriger le réglage."},"visual":"envelope","caption":"Garde d’enveloppe : la consigne doit agir avant la limite basse autorisée."},{"id":"kp-face","short":"Prérégler","kicker":"Prototype GitHub réemployé","title":"Reporter CUT IN et DIFF sur la face du KP1","lead":"Manipule les deux réglages repris du prototype inerWeb‑Frigolo. Le CUT OUT affiché reste un résultat de calcul à vérifier par un basculement réel.","bullets":["Exemple : CUT IN 1,4 bar et DIFF 1,2 bar donnent CUT OUT 0,2 bar.","L’échelle CUT IN place le redémarrage ; l’échelle DIFF place l’écart.","Les graduations donnent un préréglage, jamais la preuve du seuil obtenu."],"callout":{"type":"key","title":"Filiation","text":"Face KP1, manomètre et logique de réglage adaptés du prototype GitHub canonique déjà relié à Pilote Fluides."},"visual":"kp-face","media":{"src":"assets/illustrations-claude/05-reglage.png","title":"Les deux échelles du KP1","alt":"Face d’un KP1 avec ses deux vis : l’échelle PLAGE réglée sur CUT IN 1,4 bar, l’échelle DIFF sur 1,2 bar, et la relation CUT OUT = CUT IN − DIFF = 0,2 bar.","note":"L’illustration reprend l’exemple du cours. Les valeurs cibles viennent toujours de la machine, et se valident au basculement réel.","caption":"Illustration Claude intégrée : les deux échelles du KP1 et le CUT OUT qui en découle."},"caption":"Portage hors ligne du meilleur écran du prototype GitHub, complété par la relation CUT OUT = CUT IN − DIFF."},{"id":"nitrogen-bench","short":"Banc azote","kicker":"Méthode 1 · Installation arrêtée","title":"Le mano-détendeur alimente le pressostat sans faire tourner le compresseur","lead":"Le banc permet de créer une pression contrôlée et d’observer électriquement le basculement du contact.","bullets":["Bouteille d’azote sec, robinet et mano-détendeur adapté à deux cadrans.","Pression réglée lue sur un manomètre précis raccordé au pressostat.","Continuité contrôlée sur 1–4 et 1–2 ; compresseur isolé électriquement."],"callout":{"type":"warning","title":"Gaz d’essai","text":"Uniquement de l’azote. Jamais d’oxygène ni d’air comprimé."},"visual":"nitrogen","caption":"Banc de réglage original : bouteille, mano-détendeur, flexible, mesure précise, KP1 et contrôleur de continuité."},{"id":"nitrogen-cycle","short":"Régler","kicker":"Mesurer dans les deux sens","title":"Monter jusqu’à CUT IN, puis descendre jusqu’à CUT OUT","lead":"Pilote le banc. Les graduations donnent un préréglage ; seules les pressions réellement relevées au basculement valident les seuils.","bullets":["Monter lentement et relever le passage sur 1–4 : CUT IN.","Descendre lentement et relever l’ouverture de 1–4 : CUT OUT.","Calculer DIFF mesuré, ajuster et refaire plusieurs cycles reproductibles."],"callout":{"type":"note","title":"Après une correction","text":"Revérifier les deux seuils : une retouche du différentiel peut imposer de reprendre le réglage principal."},"visual":"nitrogen-cycle","media":{"src":"assets/illustrations-claude/06-cycle.png","title":"Cycle CUT IN / CUT OUT","alt":"Courbe de pression basse montrant la montée jusqu’au réenclenchement, la descente jusqu’à la coupure et la zone neutre entre les deux.","note":"La courbe donne le sens du cycle ; le banc inerWeb sert à relever soi-même les deux pressions de basculement.","caption":"Illustration Claude intégrée : cycle BP entre CUT IN et CUT OUT."},"caption":"Banc simulé : la pression et le sens d’évolution déterminent le basculement relevé."},{"id":"running-method","short":"En service","kicker":"Méthode 2 · Contrôle en fonctionnement","title":"Faire baisser la BP de façon contrôlée, dans l’enveloppe autorisée","lead":"Sur une installation autorisée, la vanne de départ liquide peut provoquer la baisse de BP nécessaire au contrôle.","bullets":["Stabiliser l’installation et relever les conditions initiales.","Fermer progressivement selon la procédure du site et noter CUT OUT.","Rouvrir sans délai, relever CUT IN ou les conditions de réarmement, puis remettre l’installation en état."],"callout":{"type":"warning","title":"Ce n’est pas le cours pump-down","text":"Le geste sert uniquement à contrôler la sécurité BP ; la séquence de régulation sera étudiée séparément."},"visual":"running","caption":"Contrôle en fonctionnement : pression, limite compresseur et réaction du contact surveillées ensemble."},{"id":"verify","short":"Trois cycles","kicker":"Valeurs mesurées","title":"Calculer le différentiel de chaque cycle et vérifier la répétabilité","lead":"Saisis trois couples CUT OUT / CUT IN. Le tableau calcule seulement après ta demande et n’invente aucune tolérance.","bullets":["DIFF mesuré = CUT IN mesuré − CUT OUT mesuré.","Comparer les trois cycles réalisés dans des conditions comparables.","Appliquer ensuite la tolérance du constructeur ou du cahier des charges."],"callout":{"type":"key","title":"Conforme","text":"Les deux seuils sont dans la tolérance prévue et le comportement est reproductible."},"visual":"verify","caption":"Tableau de relevés : trois cycles, trois différentiels et une étendue de répétabilité."},{"id":"record","short":"Tracer","kicker":"Fin d’intervention","title":"Un autre technicien doit pouvoir refaire ton raisonnement","lead":"La fiche d’intervention relie la source des seuils, le préréglage et les valeurs réellement mesurées.","bullets":["Marque, référence, plage, réarmement, fluide et unité de pression.","Source de la limite compresseur, CUT OUT, CUT IN et DIFF cibles.","Trois cycles mesurés, méthode utilisée, contrôles et anomalies."],"callout":{"type":"note","title":"Statut","text":"Une graduation lue sur le boîtier reste un préréglage tant que les basculements n’ont pas été mesurés."},"visual":"record","caption":"Chaîne de preuve : documenter, régler, mesurer, comparer et tracer."},{"id":"summary","short":"Synthèse","kicker":"Le raisonnement complet","title":"Le réglage tient dans deux seuils, un écart et une preuve","lead":"Tu peux maintenant expliquer le mécanisme et justifier le réglage avant de passer au pressostat BP de régulation.","bullets":["CUT OUT protège à la baisse.","CUT IN autorise le retour à la hausse.","DIFF = CUT IN − CUT OUT = largeur de la zone neutre."],"callout":{"type":"key","title":"Module suivant","text":"Pump-down, régulation BP proprement dite et réduction de puissance, sans les confondre avec la sécurité."},"visual":"summary","media":{"src":"assets/illustrations-claude/07-synthese.png","title":"Synthèse visuelle KP1","alt":"Planche récapitulative du pressostat KP1 reliant la pression, le soufflet, les ressorts, les contacts et les deux seuils.","note":"La planche récapitule le mécanisme, les contacts et les deux échelles, puis rejoue le calcul : 1,4 − 1,2 = 0,2 bar.","caption":"Illustration Claude intégrée : synthèse du fonctionnement et du réglage du KP1."},"caption":"Synthèse mécanique et numérique du pressostat BP de sécurité."}],"quiz":[{"id":"q-chain","question":"Quelle chaîne décrit correctement le fonctionnement mécanique ?","choices":["Pression → soufflet → bras et ressorts → contact","Contact → fluide → ressort → température","Ressort → compresseur → manomètre → pression"],"answer":0,"explanation":"La pression déforme le soufflet ; le mécanisme compare les efforts puis bascule le contact."},{"id":"q-neutral","question":"Que se passe-t-il dans la zone neutre ?","choices":["Le contact commute sans arrêt","Le contact conserve l’état du dernier seuil franchi","Le pressostat ne reçoit plus de pression"],"answer":1,"explanation":"Aucun nouveau basculement n’a lieu entre CUT OUT et CUT IN."},{"id":"q-diff","question":"CUT IN vaut 1,4 bar et CUT OUT vaut 0,2 bar. Quel est DIFF ?","choices":["1,6 bar","1,2 bar","0,2 bar"],"answer":1,"explanation":"DIFF = CUT IN − CUT OUT = 1,4 − 0,2 = 1,2 bar."},{"id":"q-cutout","question":"CUT IN vaut 1,4 bar et DIFF vaut 1,2 bar. Quel est CUT OUT ?","choices":["0,2 bar","1,2 bar","2,6 bar"],"answer":0,"explanation":"CUT OUT = CUT IN − DIFF = 1,4 − 1,2 = 0,2 bar."},{"id":"q-cycling","question":"Pourquoi ne pas régler un différentiel très étroit ?","choices":["Le compresseur démarre et s’arrête en boucle et s’use","Le manomètre du banc perd sa précision au bout de trois cycles","La pression d’aspiration devient une pression absolue"],"answer":0,"explanation":"Un différentiel trop étroit fait court-cycler le compresseur : les démarrages rapprochés l’usent."},{"id":"q-contacts","question":"Sous CUT OUT, quel état correspond au KP1 étudié ?","choices":["1–4 fermé et 1–2 ouvert","1–4 ouvert et 1–2 fermé","1–4 et 1–2 ouverts"],"answer":1,"explanation":"Le contact 1–4 s’ouvre à la baisse et le commun 1 rejoint 2."},{"id":"q-model","question":"Pourquoi relever la référence exacte du pressostat ?","choices":["Pour connaître plage, différentiel et réarmement","Uniquement pour choisir sa couleur","Parce que toutes les références se règlent pareil"],"answer":0,"explanation":"Une version automatique réglable et une version manuelle minimum n’ont pas le même contrat de réglage."},{"id":"q-nitrogen","question":"Pendant un réglage au banc à l’azote, que fait le compresseur ?","choices":["Il tourne jusqu’à CUT OUT","Il reste isolé électriquement","Il comprime l’azote du banc"],"answer":1,"explanation":"Le basculement se mesure au manomètre et au contrôleur de continuité, sans démarrer le compresseur."},{"id":"q-envelope","question":"La limite basse du compresseur est atteinte avant la coupure. Que faire ?","choices":["Continuer jusqu’au clic","Arrêter le test et corriger le réglage","Changer seulement l’unité du manomètre"],"answer":1,"explanation":"La protection de la machine prime sur l’obtention du basculement attendu."}],"final":{"id":"final","short":"Bilan","kicker":"Compétence visée","title":"Tu relies maintenant mécanique, seuils et contrôle réel","lead":"La méthode tient en six verbes : identifier, justifier, calculer, prérégler, mesurer et tracer.","bullets":["Expliquer le rôle du soufflet, des ressorts et de la bascule rapide.","Distinguer zone neutre et différentiel, puis calculer les trois relations.","Contrôler CUT OUT et CUT IN dans les deux sens, sans sortir de l’enveloppe machine.","Référentiel travaillé : 6.03 régler les interrupteurs de sécurité et de contrôle · 9.06 régler un limiteur de pression. En appui : 1.01 · 1.04 · 3.01 · 4.05 · 6.07."],"callout":{"type":"key","title":"Suite","text":"Le prochain chapitre appliquera ce socle au pressostat BP de régulation."},"visual":"final","caption":"Bilan du parcours pressostat BP de sécurité."}};</script>

  function gauge(x, y, radius, title, needleAngle, accent = "#c9451a") {
    const angle = (needleAngle - 90) * Math.PI / 180;
    const nx = x + Math.cos(angle) * radius * .62;
    const ny = y + Math.sin(angle) * radius * .62;
    const ticks = Array.from({ length: 9 }, (_, index) => {
      const a = (-140 + index * 35) * Math.PI / 180;
      const x1 = x + Math.cos(a) * radius * .72;
      const y1 = y + Math.sin(a) * radius * .72;
      const x2 = x + Math.cos(a) * radius * .9;
      const y2 = y + Math.sin(a) * radius * .9;
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1b3a63" stroke-width="3"/>`;
    }).join("");
    return `<g><circle cx="${x}" cy="${y}" r="${radius}" fill="#fffdf8" stroke="#1b3a63" stroke-width="5"/>${ticks}<line x1="${x}" y1="${y}" x2="${nx}" y2="${ny}" stroke="${accent}" stroke-width="6" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="7" fill="#1b3a63"/>${label(x, y + radius + 24, title, "middle", "#1b3a63", 14)}</g>`;
  }

  function wireMechanism() {
    const input = $("mechanismPressure");
    const value = $("mechanismPressureValue");
    const result = $("mechanismResult");
    const bellows = $("mechanismBellows");
    const rod = $("mechanismRod");
    const arm = $("mechanismArm");
    const contact = $("mechanismContactArm");
    const contactLabel = $("mechanismContactLabel");
    let allowed = true;
    let previous = Number(input.value);

    const bellowsPath = (top) => {
      const bottom = 368;
      const leftA = 130;
      const leftB = 154;
      const rightA = 286;
      const rightB = 262;
      const step = (bottom - top) / 6;
      const left = Array.from({ length: 7 }, (_, i) => `${i % 2 ? leftA : leftB} ${bottom - i * step}`).join("L");
      const right = Array.from({ length: 7 }, (_, i) => `${i % 2 ? rightA : rightB} ${top + i * step}`).join("L");
      return `M${leftB} ${bottom}L${left}H${rightA}L${right}Z`;
    };

    const update = (nextValue) => {
      const pressure = clamp(Number(nextValue), -0.2, 2.2);
      const direction = pressure > previous ? 1 : pressure < previous ? -1 : 0;
      if (pressure <= 0.2) allowed = false;
      if (pressure >= 1.4) allowed = true;
      previous = pressure;
      input.value = String(pressure);
      value.textContent = `${fmt(pressure)} bar`;
      const ratio = (pressure + 0.2) / 2.4;
      const top = 305 - ratio * 54;
      bellows.setAttribute("d", bellowsPath(top));
      rod.setAttribute("y1", String(top));
      rod.setAttribute("y2", String(224 - ratio * 5));
      arm.setAttribute("transform", `rotate(${(ratio - .5) * -8} 418 220)`);
      contact.setAttribute("d", allowed ? "M40 121L121 82" : "M40 121L121 164");
      contact.setAttribute("stroke", allowed ? "#1e7e54" : "#c0392b");
      contactLabel.textContent = allowed ? "1–4 FERMÉ" : "1–2 FERMÉ";
      contactLabel.setAttribute("fill", allowed ? "#1e7e54" : "#c0392b");
      result.className = `lab-result ${allowed ? "ok" : "danger"}`;
      const motion = direction > 0 ? "PRESSION EN HAUSSE" : direction < 0 ? "PRESSION EN BAISSE" : "PRESSION STABLE";
      result.textContent = `${motion} · ${allowed ? "1–4 FERMÉ · MARCHE AUTORISÉE" : "1–2 FERMÉ · ARRÊT"}`;
    };
    input.addEventListener("input", () => update(input.value));
    $("mechanismDown").addEventListener("click", () => update(Number(input.value) - .1));
    $("mechanismUp").addEventListener("click", () => update(Number(input.value) + .1));
    update(input.value);
  }

  function wireDeadband() {
    const input = $("deadbandPressure");
    const marker = $("deadbandMarker");
    const arrow = $("deadbandDirection");
    const arrowLabel = $("deadbandDirectionLabel");
    const result = $("deadbandResult");
    let allowed = true;
    let previous = Number(input.value);
    const update = (nextValue) => {
      const pressure = clamp(Number(nextValue), -0.2, 2.2);
      const up = pressure > previous;
      const down = pressure < previous;
      if (pressure <= .2) allowed = false;
      if (pressure >= 1.4) allowed = true;
      previous = pressure;
      input.value = String(pressure);
      marker.setAttribute("cx", String(100 + ((pressure + .2) / 2.4) * 690));
      if (up) {
        arrow.setAttribute("d", "M510 292H650");
        arrow.setAttribute("marker-end", "url(#arrow-orange)");
        arrow.setAttribute("marker-start", "");
        arrowLabel.textContent = "PRESSION EN HAUSSE";
      } else if (down) {
        arrow.setAttribute("d", "M650 292H510");
        arrow.setAttribute("marker-end", "url(#arrow-orange)");
        arrow.setAttribute("marker-start", "");
        arrowLabel.textContent = "PRESSION EN BAISSE";
      }
      const inZone = pressure > .2 && pressure < 1.4;
      result.className = `lab-result ${allowed ? "ok" : "danger"}`;
      result.textContent = `${fmt(pressure)} bar · ${allowed ? "1–4 FERMÉ · MARCHE AUTORISÉE" : "1–2 FERMÉ · ARRÊT"}${inZone ? " · état mémorisé dans la zone neutre" : ""}`;
    };
    input.addEventListener("input", () => update(input.value));
    $("deadbandDown").addEventListener("click", () => update(Number(input.value) - .1));
    $("deadbandUp").addEventListener("click", () => update(Number(input.value) + .1));
    update(input.value);
  }

  function wireDifferential() {
    const configurations = {
      diff: { a: ["CUT IN (bar)", "1,4"], b: ["CUT OUT (bar)", "0,2"], answer: "Ton DIFF (bar)", expected: 1.2, formula: "diff" },
      cutout: { a: ["CUT IN (bar)", "1,4"], b: ["DIFF (bar)", "1,2"], answer: "Ton CUT OUT (bar)", expected: .2, formula: "cutout" },
      cutin: { a: ["CUT OUT (bar)", "0,2"], b: ["DIFF (bar)", "1,2"], answer: "Ton CUT IN (bar)", expected: 1.4, formula: "cutin" }
    };
    let target = "diff";
    let formula = "";
    const result = $("calcResult");

    const setTarget = (next) => {
      target = next;
      formula = "";
      const config = configurations[target];
      $("calcKnownALabel").textContent = config.a[0];
      $("calcKnownA").value = config.a[1];
      $("calcKnownBLabel").textContent = config.b[0];
      $("calcKnownB").value = config.b[1];
      $("calcAnswerLabel").textContent = config.answer;
      $("calcAnswer").value = "";
      document.querySelectorAll(".target-tab").forEach((button) => {
        const active = button.dataset.target === target;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      document.querySelectorAll(".formula-choices button").forEach((button) => {
        button.classList.remove("selected", "wrong");
        button.setAttribute("aria-pressed", "false");
      });
      result.className = "lab-result wait";
      result.textContent = "Choisis une formule, calcule, puis vérifie.";
    };

    document.querySelectorAll(".target-tab").forEach((button) => button.addEventListener("click", () => setTarget(button.dataset.target)));
    document.querySelectorAll(".formula-choices button").forEach((button) => button.addEventListener("click", () => {
      formula = button.dataset.formula;
      document.querySelectorAll(".formula-choices button").forEach((candidate) => {
        const selected = candidate === button;
        candidate.classList.toggle("selected", selected);
        candidate.classList.remove("wrong");
        candidate.setAttribute("aria-pressed", String(selected));
      });
      result.className = "lab-result wait";
      result.textContent = "Formule choisie. Effectue maintenant le calcul.";
    }));
    $("calcCheck").addEventListener("click", () => {
      const config = configurations[target];
      const answer = Number($("calcAnswer").value);
      if (!formula) {
        result.className = "lab-result danger";
        result.textContent = "Choisis d’abord la relation à utiliser.";
        return;
      }
      if (formula !== config.formula) {
        document.querySelector(`.formula-choices button[data-formula="${formula}"]`)?.classList.add("wrong");
        result.className = "lab-result danger";
        result.textContent = "Cette relation ne cherche pas la grandeur demandée. Reprends l’inconnue.";
        return;
      }
      if (!Number.isFinite(answer)) {
        result.className = "lab-result danger";
        result.textContent = "Saisis ton résultat en bar.";
        return;
      }
      const correct = Math.abs(answer - config.expected) <= .005;
      result.className = `lab-result ${correct ? "ok" : "danger"}`;
      result.textContent = correct ? `CORRECT · résultat ${fmt(config.expected, 1)} bar` : "Le choix de formule est bon, mais le calcul est à reprendre.";
    });
    setTarget(target);
  }

  function wireContacts() {
    const setLow = (low) => {
      $("contactArm").setAttribute("d", low ? "M224 208L458 295" : "M224 208L458 121");
      $("contactArm").setAttribute("stroke", low ? "#c0392b" : "#1e7e54");
      $("contactHeadline").textContent = low ? "PRESSION BASSE · 1–2 FERMÉ" : "PRESSION SUFFISANTE · 1–4 FERMÉ";
      $("contactHeadline").setAttribute("fill", low ? "#c0392b" : "#1e7e54");
      $("contactRunBox").setAttribute("fill", low ? "#fffdf8" : "#e3f5ec");
      $("contactRunBox").setAttribute("stroke", low ? "#637285" : "#1e7e54");
      $("contactRunLamp").setAttribute("fill", low ? "#fffdf8" : "#1e7e54");
      $("contactRunLamp").setAttribute("stroke", low ? "#637285" : "#1e7e54");
      $("contactFaultBox").setAttribute("fill", low ? "#fbe7e4" : "#fffdf8");
      $("contactFaultBox").setAttribute("stroke", low ? "#c0392b" : "#637285");
      $("contactFaultLamp").setAttribute("fill", low ? "#c0392b" : "#fffdf8");
      $("contactFaultLamp").setAttribute("stroke", low ? "#c0392b" : "#637285");
      $("contactHigh").setAttribute("aria-pressed", String(!low));
      $("contactLow").setAttribute("aria-pressed", String(low));
    };
    $("contactHigh").addEventListener("click", () => setLow(false));
    $("contactLow").addEventListener("click", () => setLow(true));
  }

  function wireEnvelope() {
    const minimum = $("minimumInput");
    const target = $("targetInput");
    const update = () => {
      const min = Number(minimum.value);
      const cut = Number(target.value);
      const gap = cut - min;
      const good = Number.isFinite(gap) && gap > 0;
      const x = clamp(390 + gap * 325, 330, 780);
      $("targetLine").setAttribute("x1", String(x));
      $("targetLine").setAttribute("x2", String(x));
      $("targetLabel").setAttribute("x", String(x));
      $("marginLabel").setAttribute("x", String((390 + x) / 2));
      $("marginLabel").textContent = Number.isFinite(gap) ? `MARGE ${fmt(gap)} bar` : "MARGE —";
      const result = $("envelopeResult");
      result.className = `lab-result ${good ? "ok" : "danger"}`;
      result.textContent = good ? `COUPURE AVANT LA LIMITE · marge ${fmt(gap)} bar` : gap === 0 ? "AUCUNE MARGE · réglage à justifier" : "COUPURE APRÈS LA LIMITE · DANGER COMPRESSEUR";
    };
    minimum.addEventListener("input", update);
    target.addEventListener("input", update);
    update();
  }

  function wireKpFace() {
    let cutIn = 1.4;
    let diff = 1.2;
    const update = () => {
      cutIn = clamp(Math.round(cutIn * 10) / 10, -.2, 7.5);
      diff = clamp(Math.round(diff * 10) / 10, .7, 4);
      const cutOut = Math.round((cutIn - diff) * 10) / 10;
      $("kpCiValue").textContent = `${fmt(cutIn, 1)} bar`;
      $("kpDiffValue").textContent = `${fmt(diff, 1)} bar`;
      $("kpCoValue").textContent = `${fmt(cutOut, 1)} bar`;
      $("kpEquation").textContent = `${fmt(cutIn, 1)} − ${fmt(diff, 1)} = ${fmt(cutOut, 1)} bar`;
      const ciY = 82 + (clamp(cutIn, 0, 7) / 7) * 266;
      const coY = 82 + (clamp(cutOut, 0, 7) / 7) * 266;
      const dY = 82 + (diff / 4) * 266;
      $("kpCutInMarker").setAttribute("y1", String(ciY));
      $("kpCutInMarker").setAttribute("y2", String(ciY));
      $("kpCutInHandle").setAttribute("y", String(ciY - 12));
      $("kpCutOutGuide").setAttribute("y1", String(coY));
      $("kpCutOutGuide").setAttribute("y2", String(coY));
      $("kpCutOutGuideLabel").setAttribute("y", String(coY + 5));
      $("kpDiffMarker").setAttribute("y1", String(dY));
      $("kpDiffMarker").setAttribute("y2", String(dY));
      $("kpDiffHandle").setAttribute("y", String(dY - 12));
      const needleAngle = -140 + (clamp(cutIn, 0, 10) / 10) * 280;
      const needleRad = needleAngle * Math.PI / 180;
      $("kpNeedle").setAttribute("x2", String(165 + Math.cos(needleRad) * 92));
      $("kpNeedle").setAttribute("y2", String(145 + Math.sin(needleRad) * 92));
      const setMark = (id, pressure) => {
        const angle = (-140 + (clamp(pressure, 0, 10) / 10) * 280) * Math.PI / 180;
        const mark = $(id);
        mark.setAttribute("x1", String(165 + Math.cos(angle) * 105));
        mark.setAttribute("y1", String(145 + Math.sin(angle) * 105));
        mark.setAttribute("x2", String(165 + Math.cos(angle) * 121));
        mark.setAttribute("y2", String(145 + Math.sin(angle) * 121));
      };
      setMark("kpCutInGaugeMark", cutIn);
      setMark("kpCutOutGaugeMark", cutOut);
      const coherent = cutOut >= -.2;
      $("kpStatus").className = `kp-status ${coherent ? "ok" : "danger"}`;
      $("kpStatus").textContent = coherent ? "PRÉRÉGLAGE COHÉRENT · À MESURER" : "CUT OUT SOUS LA PLAGE · REPRENDRE";
    };
    $("kpCiMinus").addEventListener("click", () => { cutIn -= .1; update(); });
    $("kpCiPlus").addEventListener("click", () => { cutIn += .1; update(); });
    $("kpDiffMinus").addEventListener("click", () => { diff -= .1; update(); });
    $("kpDiffPlus").addEventListener("click", () => { diff += .1; update(); });
    update();
  }

  function wireNitrogenCycle() {
    const input = $("nitrogenPressure");
    let previous = Number(input.value);
    let allowed = false;
    let cutIn = null;
    let cutOut = null;
    const update = (nextValue) => {
      const pressure = clamp(Number(nextValue), -.2, 2.2);
      const up = pressure > previous;
      const down = pressure < previous;
      if (up && previous < 1.4 && pressure >= 1.4) {
        allowed = true;
        cutIn = pressure;
      }
      if (down && previous > .2 && pressure <= .2) {
        allowed = false;
        cutOut = pressure;
      }
      if (pressure >= 1.4) allowed = true;
      if (pressure <= .2) allowed = false;
      previous = pressure;
      input.value = String(pressure);
      $("nitrogenPressureValue").textContent = `${fmt(pressure)} bar`;
      const angle = -140 + ((pressure + .2) / 2.4) * 280;
      const rad = (angle - 90) * Math.PI / 180;
      $("nitrogenNeedle").setAttribute("x2", String(170 + Math.cos(rad) * 78));
      $("nitrogenNeedle").setAttribute("y2", String(126 + Math.sin(rad) * 78));
      $("nitrogenContact").className = `contact-meter ${allowed ? "ok" : "danger"}`;
      $("nitrogenContact").querySelector("strong").textContent = allowed ? "1–4 FERMÉ · MARCHE" : "1–2 FERMÉ · ARRÊT";
      $("nitrogenCutIn").textContent = cutIn === null ? "—" : `${fmt(cutIn)} bar`;
      $("nitrogenCutOut").textContent = cutOut === null ? "—" : `${fmt(cutOut)} bar`;
      $("nitrogenDiff").textContent = cutIn === null || cutOut === null ? "—" : `${fmt(cutIn - cutOut)} bar`;
    };
    input.addEventListener("input", () => update(input.value));
    $("nitrogenDown").addEventListener("click", () => update(Number(input.value) - .1));
    $("nitrogenUp").addEventListener("click", () => update(Number(input.value) + .1));
    $("nitrogenReset").addEventListener("click", () => {
      cutIn = null;
      cutOut = null;
      previous = 0;
      allowed = false;
      update(0);
    });
    update(input.value);
  }

  function wireVerify() {
    $("calculateCycles").addEventListener("click", () => {
      const diffs = [];
      for (let index = 1; index <= 3; index += 1) {
        const coRaw = $(`cycleCo${index}`).value;
        const ciRaw = $(`cycleCi${index}`).value;
        if (coRaw === "" || ciRaw === "") {
          $("cyclesResult").className = "lab-result danger";
          $("cyclesResult").textContent = "Complète les six pressions avant de calculer.";
          return;
        }
        const diff = Number(ciRaw) - Number(coRaw);
        diffs.push(diff);
        $(`cycleDiff${index}`).textContent = `${fmt(diff)} bar`;
      }
      const spread = Math.max(...diffs) - Math.min(...diffs);
      const toleranceRaw = $("repeatTolerance").value;
      const result = $("cyclesResult");
      if (toleranceRaw === "") {
        result.className = "lab-result wait";
        result.textContent = `DIFF calculés · étendue ${fmt(spread)} bar · comparer à la tolérance du dossier`;
        return;
      }
      const tolerance = Number(toleranceRaw);
      const good = spread <= tolerance;
      result.className = `lab-result ${good ? "ok" : "danger"}`;
      result.textContent = good ? `RÉPÉTABILITÉ DANS LA TOLÉRANCE · étendue ${fmt(spread)} bar` : `RÉPÉTABILITÉ HORS TOLÉRANCE · étendue ${fmt(spread)} bar`;
    });
  }

  const wirers = {
    mechanism: wireMechanism,
    deadband: wireDeadband,
    differential: wireDifferential,
    contacts: wireContacts,
    envelope: wireEnvelope,
    "kp-face": wireKpFace,
    "nitrogen-cycle": wireNitrogenCycle,
    verify: wireVerify
  };

  window.PressostatVisuals = {
    render(type) {
      return renderers[type] ? renderers[type]() : "";
    },
    wire(type) {
      wirers[type]?.();
    },
    quiz: quizVisual,
    final: finalVisual
  };
})();
</script>
  <script>(() => {
  "use strict";

  const COURSE = window.__INERWEB_COURSE__;
  const VISUALS = window.PressostatVisuals;
  const $ = (id) => document.getElementById(id);
  const ui = {
    stage: $("visualStage"), caption: $("visualCaption"), kicker: $("lessonKicker"),
    title: $("lessonTitle"), lead: $("lessonLead"), list: $("lessonList"),
    callout: $("lessonCallout"), quiz: $("quizArea"), feedback: $("feedback"),
    back: $("backButton"), next: $("nextButton"), navState: $("navState"),
    progressLabel: $("progressLabel"), progressTrack: $("progressTrack"),
    progressFill: $("progressFill"), progressCount: $("progressCount"),
    speak: $("speakButton"), stop: $("stopButton"), speed: $("speedSelect"),
    reading: $("readingButton"), fullscreen: $("fullscreenButton")
  };
  const total = COURSE.lessons.length + COURSE.quiz.length + 1;
  const answers = Array(COURSE.quiz.length).fill(null);
  let screen = 0;
  let speechRun = 0;
  let speaking = false;
  /* Un élève qui ne lit pas ne doit pas avoir à retrouver le bouton à chaque écran :
     « Écouter » arme la lecture suivie, « Stop » la désarme. */
  let lectureSuivie = false;

  const escapeHtml = (value) => String(value)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;");

  function score() {
    return answers.reduce((sum, answer, index) => sum + (answer === COURSE.quiz[index].answer ? 1 : 0), 0);
  }

  function kind() {
    if (screen < COURSE.lessons.length) return "lesson";
    if (screen < COURSE.lessons.length + COURSE.quiz.length) return "quiz";
    return "final";
  }

  function stopSpeech() {
    speechRun += 1;
    speaking = false;
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    ui.speak.setAttribute("aria-pressed", "false");
    ui.speak.innerHTML = "▶ <span>Écouter</span>";
    ui.stop.disabled = true;
  }

  function resetContent() {
    stopSpeech();
    ui.quiz.hidden = true;
    ui.quiz.innerHTML = "";
    ui.feedback.hidden = true;
    ui.feedback.className = "feedback";
    ui.feedback.textContent = "";
    ui.callout.hidden = true;
    ui.callout.removeAttribute("data-type");
    ui.callout.innerHTML = "";
  }

  function fillText(item) {
    ui.kicker.textContent = item.kicker || "";
    ui.title.textContent = item.title;
    ui.lead.textContent = item.lead;
    ui.list.innerHTML = item.bullets.map((bullet) => `<li>${escapeHtml(bullet)}</li>`).join("");
    ui.caption.textContent = item.caption || "";
    if (item.callout) {
      ui.callout.hidden = false;
      ui.callout.dataset.type = item.callout.type || "note";
      ui.callout.innerHTML = `<strong>${escapeHtml(item.callout.title)}</strong><span>${escapeHtml(item.callout.text)}</span>`;
    }
  }

  function renderLessonVisual(item) {
    if (!item.media) {
      ui.stage.innerHTML = VISUALS.render(item.visual);
      ui.stage.setAttribute("role", "img");
      ui.stage.setAttribute("aria-label", item.caption);
      ui.stage.removeAttribute("data-visual-mode");
      ui.caption.textContent = item.caption || "";
      VISUALS.wire(item.visual);
      return;
    }

    const bodyId = `visualModeBody-${screen}`;
    ui.stage.setAttribute("role", "group");
    ui.stage.setAttribute("aria-label", `Deux lectures disponibles pour ${item.media.title}`);
    ui.stage.innerHTML = `
      <div class="visual-composite">
        <div class="visual-tabs" role="tablist" aria-label="Choisir le type de visuel">
          <button class="visual-tab" type="button" role="tab" data-mode="media" aria-controls="${bodyId}">Illustration Claude</button>
          <button class="visual-tab" type="button" role="tab" data-mode="activity" aria-controls="${bodyId}">Schéma / activité</button>
        </div>
        <div class="visual-mode-body" id="${bodyId}" role="tabpanel"></div>
      </div>`;

    const body = document.getElementById(bodyId);
    const tabs = Array.from(ui.stage.querySelectorAll(".visual-tab"));
    const showMode = (mode) => {
      const mediaMode = mode === "media";
      ui.stage.dataset.visualMode = mode;
      tabs.forEach((tab) => {
        const selected = tab.dataset.mode === mode;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
      if (mediaMode) {
        body.innerHTML = `<figure class="claude-frame">
          <img src="${escapeHtml(item.media.src)}" alt="${escapeHtml(item.media.alt)}" draggable="false">
          <figcaption><strong>${escapeHtml(item.media.title)}</strong><span>${escapeHtml(item.media.note)}</span></figcaption>
        </figure>`;
        ui.caption.textContent = item.media.caption;
      } else {
        body.innerHTML = VISUALS.render(item.visual);
        ui.caption.textContent = item.caption;
        VISUALS.wire(item.visual);
      }
    };
    tabs.forEach((tab) => tab.addEventListener("click", () => {
      showMode(tab.dataset.mode);
      /* On change d’onglet pour voir autre chose : la voix doit décrire cet autre chose. */
      if (lectureSuivie) speak();
    }));
    showMode("media");
  }

  function renderLesson() {
    const item = COURSE.lessons[screen];
    fillText(item);
    renderLessonVisual(item);
    ui.next.disabled = false;
    ui.next.textContent = screen === COURSE.lessons.length - 1 ? "Passer au quiz →" : "Continuer →";
    ui.navState.textContent = `Cours · ${screen + 1} sur ${COURSE.lessons.length}`;
  }

  function markQuiz(questionIndex) {
    const chosen = answers[questionIndex];
    if (chosen === null) return;
    const question = COURSE.quiz[questionIndex];
    ui.quiz.querySelectorAll(".quiz-choice").forEach((button, index) => {
      button.disabled = true;
      button.classList.toggle("correct", index === question.answer);
      button.classList.toggle("incorrect", index === chosen && chosen !== question.answer);
    });
    const correct = chosen === question.answer;
    ui.feedback.hidden = false;
    ui.feedback.className = `feedback ${correct ? "correct" : "incorrect"}`;
    ui.feedback.textContent = `${correct ? "Bonne réponse. " : "À reprendre. "}${question.explanation}`;
  }

  function renderQuiz() {
    const questionIndex = screen - COURSE.lessons.length;
    const question = COURSE.quiz[questionIndex];
    ui.kicker.textContent = `Quiz formatif · question ${questionIndex + 1}`;
    ui.title.textContent = question.question;
    ui.lead.textContent = "Choisis une réponse, puis lis l’explication avant de continuer.";
    ui.list.innerHTML = "";
    ui.caption.textContent = "Le score sert à repérer les notions à reprendre ; aucune donnée n’est transmise.";
    ui.stage.innerHTML = VISUALS.quiz(questionIndex, COURSE.quiz.length, score(), question.id);
    ui.stage.setAttribute("role", "img");
    ui.stage.setAttribute("aria-label", `Question ${questionIndex + 1} sur le pressostat BP`);
    ui.stage.removeAttribute("data-visual-mode");
    ui.quiz.hidden = false;
    ui.quiz.innerHTML = question.choices.map((choice, index) => `<button class="quiz-choice" type="button" data-choice="${index}">${escapeHtml(choice)}</button>`).join("");
    ui.quiz.querySelectorAll(".quiz-choice").forEach((button) => button.addEventListener("click", () => {
      if (answers[questionIndex] !== null) return;
      answers[questionIndex] = Number(button.dataset.choice);
      markQuiz(questionIndex);
      ui.next.disabled = false;
      ui.next.focus({ preventScroll: true });
    }));
    markQuiz(questionIndex);
    ui.next.disabled = answers[questionIndex] === null;
    ui.next.textContent = questionIndex === COURSE.quiz.length - 1 ? "Voir le bilan →" : "Question suivante →";
    ui.navState.textContent = `Quiz · ${questionIndex + 1} sur ${COURSE.quiz.length}`;
  }

  function renderFinal() {
    const item = COURSE.final;
    fillText(item);
    ui.stage.innerHTML = VISUALS.final(score(), COURSE.quiz.length);
    ui.stage.setAttribute("role", "img");
    ui.stage.setAttribute("aria-label", `Bilan : ${score()} bonnes réponses sur ${COURSE.quiz.length}`);
    ui.stage.removeAttribute("data-visual-mode");
    ui.next.disabled = true;
    ui.next.textContent = "Parcours terminé";
    ui.navState.textContent = `Bilan · ${score()} / ${COURSE.quiz.length}`;
  }

  function render() {
    resetContent();
    const currentKind = kind();
    if (currentKind === "lesson") renderLesson();
    else if (currentKind === "quiz") renderQuiz();
    else renderFinal();
    const percent = Math.round(((screen + 1) / total) * 100);
    ui.progressFill.style.width = `${percent}%`;
    ui.progressTrack.setAttribute("aria-valuenow", String(percent));
    ui.progressCount.textContent = `${screen + 1} / ${total}`;
    ui.progressLabel.textContent = currentKind === "lesson" ? COURSE.lessons[screen].short : currentKind === "quiz" ? "Quiz" : "Bilan";
    ui.back.disabled = screen === 0;
    if (lectureSuivie) speak();
    document.title = `${ui.title.textContent} — Pressostat BP`;
  }

  function move(delta) {
    if (delta > 0 && kind() === "quiz" && ui.next.disabled) return;
    const next = Math.max(0, Math.min(total - 1, screen + delta));
    if (next !== screen) { screen = next; render(); }
  }

  /* Les symboles se lisent mal à la synthèse vocale. Le public visé comprend des
     élèves qui ne lisent pas : un « 1–4 » prononcé « moins trois », ou une formule
     muette, leur retire purement et simplement l’information. */
  function pourLaVoix(texte) {
    return String(texte)
      .replace(/(\d)\s*[–—-]\s*(\d)/g, "$1 $2")
      .replace(/×/g, " fois ")
      .replace(/−/g, " moins ")
      .replace(/≈/g, " environ ")
      .replace(/=/g, " égale ")
      .replace(/·/g, ", ")
      .replace(/→/g, " puis ")
      .replace(/\.\s*\./g, ".")
      .replace(/\s{2,}/g, " ");
  }

  function spokenText() {
    const parts = [ui.kicker.textContent, ui.title.textContent, ui.lead.textContent,
      ...Array.from(ui.list.querySelectorAll("li"), (li) => li.textContent)];
    if (!ui.callout.hidden) {
      const titre = ui.callout.querySelector("strong");
      const corps = ui.callout.querySelector("span");
      parts.push(titre ? `${titre.textContent} : ${corps ? corps.textContent : ""}` : ui.callout.textContent);
    }
    /* Ce que montre l’écran doit s’entendre, sinon l’illustration et le schéma
       n’existent que pour qui voit ET lit. */
    const image = ui.stage.querySelector(".claude-frame img[alt]");
    if (image && image.alt) {
      parts.push("Ce que montre l’illustration. " + image.alt);
      const note = ui.stage.querySelector(".claude-frame figcaption span");
      if (note) parts.push(note.textContent);
    } else if (ui.caption.textContent) {
      parts.push(ui.caption.textContent);
    }
    /* Les réponses du quiz sont numérotées à voix haute : sans cela, on entend la
       question mais on ne peut pas choisir. */
    if (!ui.quiz.hidden) {
      Array.from(ui.quiz.querySelectorAll(".quiz-choice")).forEach((bouton, index) => {
        parts.push(`Réponse ${index + 1}. ${bouton.textContent}`);
      });
    }
    if (!ui.feedback.hidden) parts.push(ui.feedback.textContent);
    return pourLaVoix(parts.filter(Boolean).join(". "));
  }

  function selectFrenchVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    return voices.find((voice) => voice.localService && /^fr/i.test(voice.lang))
      || voices.find((voice) => /^fr/i.test(voice.lang)) || null;
  }

  function speak() {
    if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
      ui.navState.textContent = "Voix indisponible sur ce navigateur";
      return;
    }
    stopSpeech();
    const run = speechRun;
    const utterance = new SpeechSynthesisUtterance(spokenText());
    utterance.lang = "fr-FR";
    utterance.rate = Number(ui.speed.value);
    utterance.pitch = 1;
    const voice = selectFrenchVoice();
    if (voice) utterance.voice = voice;
    utterance.onstart = () => {
      if (run !== speechRun) return;
      speaking = true;
      ui.speak.setAttribute("aria-pressed", "true");
      ui.speak.innerHTML = "❚❚ <span>Pause</span>";
      ui.stop.disabled = false;
    };
    const finish = () => {
      if (run !== speechRun) return;
      speaking = false;
      ui.speak.setAttribute("aria-pressed", "false");
      ui.speak.innerHTML = "▶ <span>Écouter</span>";
      ui.stop.disabled = true;
    };
    utterance.onend = finish;
    utterance.onerror = finish;
    window.speechSynthesis.speak(utterance);
  }

  ui.back.addEventListener("click", () => move(-1));
  ui.next.addEventListener("click", () => move(1));
  ui.speak.addEventListener("click", () => {
    if (speaking && window.speechSynthesis.speaking) {
      window.speechSynthesis.pause(); speaking = false;
      ui.speak.setAttribute("aria-pressed", "false");
      ui.speak.innerHTML = "▶ <span>Reprendre</span>";
    } else if (window.speechSynthesis?.paused) {
      window.speechSynthesis.resume(); speaking = true;
      ui.speak.setAttribute("aria-pressed", "true");
      ui.speak.innerHTML = "❚❚ <span>Pause</span>";
    } else { lectureSuivie = true; speak(); }
  });
  ui.stop.addEventListener("click", () => { lectureSuivie = false; stopSpeech(); });
  ui.reading.addEventListener("click", () => {
    const active = document.body.classList.toggle("reading-mode");
    ui.reading.setAttribute("aria-pressed", String(active));
  });
  ui.fullscreen.addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch { ui.navState.textContent = "Plein écran refusé par le navigateur"; }
  });
  document.addEventListener("keydown", (event) => {
    if (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(event.target.tagName)) return;
    if (event.key === "ArrowRight") move(1);
    if (event.key === "ArrowLeft") move(-1);
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { lectureSuivie = false; stopSpeech(); } });
  window.addEventListener("beforeunload", stopSpeech);
  render();
})();
</script>
</body>
</html>
