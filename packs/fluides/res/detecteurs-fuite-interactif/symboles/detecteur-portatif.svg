<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20.0 -22.0 38.0 38.0" width="38" height="38">
<!-- Détecteur électronique de fuite, portatif : boîtier, poignée, voyants, sonde souple. Dessin inerWeb fait main (22/10/2026).
     Retourné le 22/10 (Franck) : la sonde vers la fuite, le boîtier vers la main. Même cadre que l'ancien symbole (-20 -22 38 38) : la pointe de la sonde tombe sur le halo d'alarme (0,5 ; 7,5). -->
<g transform="translate(1,0) scale(-1,1)">
<g stroke="#1b3a63" stroke-linejoin="round" stroke-linecap="round">
  <!-- la sonde souple : un col de cygne qui descend vers la pointe -->
  <path d="M1.4,-8.2 C-4.6,-6.5 -4.8,0.5 0.4,5.6" fill="none" stroke-width="1.6"/>
  <path d="M1.4,-8.2 C-4.6,-6.5 -4.8,0.5 0.4,5.6" fill="none" stroke="#9cc3e6" stroke-width="0.7" stroke-dasharray="0.9 0.6"/>
  <!-- la pointe de mesure -->
  <path d="M-0.4,5 L1.3,4.6 L1.3,8.3 L0.5,9.2 L-0.3,8.4 Z" fill="#cfe3f5" stroke-width="0.6"/>
  <!-- le boîtier, incliné -->
  <g transform="translate(7.6,-12.2) rotate(-28)">
    <rect x="-7.5" y="-3.4" width="15" height="6.8" rx="2" fill="#cfe3f5" stroke-width="0.8"/>
    <!-- la poignée -->
    <rect x="1.8" y="-3.4" width="5.7" height="6.8" rx="2" fill="#ff6b35" stroke-width="0.8"/>
    <!-- les trois voyants -->
    <circle cx="-5" cy="-0.9" r="0.85" fill="#2e9e5b" stroke-width="0.4"/>
    <circle cx="-2.8" cy="-0.9" r="0.85" fill="#f2a33a" stroke-width="0.4"/>
    <circle cx="-0.6" cy="-0.9" r="0.85" fill="#d64541" stroke-width="0.4"/>
    <!-- deux boutons -->
    <rect x="-5.4" y="1.1" width="1.9" height="1.1" rx="0.5" fill="#ffffff" stroke-width="0.4"/>
    <rect x="-2.4" y="1.1" width="1.9" height="1.1" rx="0.5" fill="#ffffff" stroke-width="0.4"/>
    <!-- le départ de la sonde -->
    <rect x="-9.3" y="-1.1" width="2" height="2.2" rx="0.6" fill="#1b3a63" stroke-width="0.4"/>
  </g>
</g>
</g>
</svg>
