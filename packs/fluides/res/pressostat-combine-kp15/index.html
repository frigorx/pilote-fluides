<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Module inerWeb Édu hors ligne : comprendre, câbler, régler et contrôler un pressostat combiné KP15 HP/BP.">
  <title>Pressostat combiné KP15 HP/BP — inerWeb Édu</title>
  <style>:root {
  --navy: #1b3a63;
  --ink: #10233c;
  --orange: #ff6b35;
  --orange-deep: #c9451a;
  --blue: #3d7fca;
  --blue-soft: #84b7ec;
  --cream: #f7f1e7;
  --paper: #fffdf8;
  --muted: #637285;
  --line: rgba(27, 58, 99, .16);
  --ok: #1e7e54;
  --ok-bg: #e3f5ec;
  --danger: #c0392b;
  --danger-bg: #fbe7e4;
  --wait: #b06a00;
  --wait-bg: #fff4e0;
  --shadow: 0 10px 30px rgba(27, 58, 99, .12);
}

* { box-sizing: border-box; }

html, body { width: 100%; height: 100%; margin: 0; }

body {
  overflow: hidden;
  background: var(--cream);
  color: var(--ink);
  font-family: Calibri, "Segoe UI", system-ui, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; }
button { cursor: pointer; }

button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid rgba(255, 107, 53, .55);
  outline-offset: 2px;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.course-app {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  display: grid;
  grid-template-rows: 48px 30px minmax(0, 1fr) 52px;
}

.topbar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 5px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 253, 248, .96);
}

.brand { display: flex; align-items: center; min-width: 0; }
.brand-logo { display: block; height: 30px; width: auto; }
.print-signature { display: none; }

.course-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: center;
  color: var(--navy);
  font: 700 16px/1 "Trebuchet MS", Calibri, Arial, sans-serif;
}

.tools { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
.tool-button, .speed-select {
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
  color: var(--navy);
  font-size: 12px;
  font-weight: 700;
}
.tool-button { padding: 0 10px; }
.tool-button.compact { width: 36px; padding: 0; }
.tool-button[aria-pressed="true"] { border: 3px double var(--ok); background: var(--ok-bg); color: var(--ok); }
.tool-button:disabled { cursor: not-allowed; opacity: .45; }
.speed-select { padding: 0 4px; }

.progress-row {
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr) 70px;
  align-items: center;
  gap: 10px;
  padding: 3px 14px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}
.progress-row > :last-child { text-align: right; }
.progress-track {
  height: 8px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
}
.progress-track span { display: block; width: 0; height: 100%; background: var(--orange); transition: width 180ms ease; }

.lesson-grid {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.18fr) minmax(330px, .82fr);
  gap: 10px;
  padding: 0 10px 8px;
}

.visual-panel, .lesson-panel {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--paper);
  box-shadow: var(--shadow);
}

.visual-panel { display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: 8px 10px 6px; }
.visual-stage { min-height: 0; display: grid; place-items: center; overflow: hidden; }
.visual-stage > svg { display: block; width: 100%; height: 100%; max-height: 100%; }
.visual-caption { margin: 3px 4px 0; color: var(--muted); text-align: center; font-size: 11px; line-height: 1.2; }

.visual-composite {
  width: 100%;
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 6px;
}
.visual-tabs { display: flex; justify-content: center; gap: 6px; }
.visual-tab {
  min-height: 34px;
  padding: 5px 14px;
  border: 2px solid var(--navy);
  border-radius: 999px;
  background: var(--paper);
  color: var(--navy);
  font-size: 12px;
  font-weight: 800;
}
.visual-tab[aria-selected="true"] {
  border: 4px double var(--orange-deep);
  background: var(--wait-bg);
  color: var(--orange-deep);
}
.visual-mode-body { width: 100%; height: 100%; min-height: 0; display: grid; place-items: center; overflow: hidden; }
.visual-mode-body > svg { display: block; width: 100%; height: 100%; max-height: 100%; }
.visual-mode-body > div { width: 100%; height: 100%; min-height: 0; }
.claude-frame {
  width: 100%;
  height: 100%;
  min-height: 0;
  margin: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 4px;
  overflow: hidden;
}
.claude-frame img {
  width: 100%;
  height: 100%;
  min-height: 0;
  display: block;
  object-fit: contain;
  border-radius: 13px;
  background: #071b34;
}
.claude-frame figcaption { display: flex; align-items: baseline; justify-content: center; gap: 7px; color: var(--muted); font-size: 10px; line-height: 1.2; text-align: center; }
.claude-frame figcaption strong { color: var(--navy); }

.lesson-panel { display: flex; flex-direction: column; padding: clamp(14px, 2.1vw, 26px); }
.lesson-kicker {
  margin-bottom: 4px;
  color: var(--orange-deep);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}
h1 {
  margin: 0 0 8px;
  color: var(--navy);
  font: 700 clamp(24px, 2.5vw, 38px)/1.08 "Trebuchet MS", Calibri, Arial, sans-serif;
  letter-spacing: -.015em;
}
.lesson-lead { margin: 0 0 10px; color: var(--ink); font-size: clamp(15px, 1.25vw, 18px); line-height: 1.45; }
.lesson-list { margin: 0; padding-left: 1.15em; color: var(--ink); font-size: clamp(14px, 1.05vw, 16px); line-height: 1.42; }
.lesson-list li { margin-bottom: 6px; padding-left: 3px; }

.callout {
  margin-top: auto;
  padding: 10px 12px;
  border: 2px solid var(--navy);
  border-left-width: 6px;
  border-radius: 12px;
  background: var(--paper);
  font-size: 14px;
  line-height: 1.35;
}
.callout strong { display: block; margin-bottom: 2px; color: var(--navy); }
.callout[data-type="key"] { border-style: double; border-width: 4px 2px 4px 7px; border-color: var(--ok); background: var(--ok-bg); }
.callout[data-type="key"] strong { color: var(--ok); }
.callout[data-type="warning"] { border-style: dashed; border-width: 2px 2px 2px 6px; border-color: var(--orange-deep); background: var(--wait-bg); }
.callout[data-type="warning"] strong { color: var(--orange-deep); }
.callout[data-type="note"] { border-left-style: dotted; border-color: var(--blue); background: #f3f7fb; }

.navigation {
  display: grid;
  grid-template-columns: 130px minmax(0, 1fr) 150px;
  align-items: center;
  gap: 10px;
  padding: 5px 10px;
  border-top: 1px solid var(--line);
  background: rgba(247, 241, 231, .98);
}
.nav-button { height: 40px; border-radius: 999px; font-size: 14px; font-weight: 800; }
.nav-button.primary { border: 2px solid var(--navy); background: var(--navy); color: #fff; }
.nav-button.secondary { border: 2px solid var(--navy); background: var(--paper); color: var(--navy); }
.nav-button:disabled { cursor: not-allowed; opacity: .42; }
.nav-state { overflow: hidden; color: var(--muted); text-align: center; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 700; }

/* Visuels et activités */
.visual-html { width: 100%; height: 100%; min-height: 0; display: grid; place-items: center; padding: 4px; }
.compare-grid, .model-grid, .record-grid { width: min(96%, 760px); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mini-card {
  min-width: 0;
  padding: clamp(10px, 1.7vw, 18px);
  border: 2px solid var(--navy);
  border-radius: 16px;
  background: var(--paper);
}
.mini-card h3 { margin: 0 0 7px; color: var(--navy); font: 700 clamp(16px, 1.6vw, 22px)/1.1 "Trebuchet MS", Calibri, Arial, sans-serif; }
.mini-card p { margin: 4px 0; font-size: clamp(12px, 1.15vw, 15px); line-height: 1.35; }
.mini-card.safety { border-style: double; border-width: 5px; border-color: var(--danger); }
.mini-card.regulation { border-style: dashed; border-color: var(--blue); }
.status-pill { display: inline-flex; align-items: center; gap: 5px; margin-bottom: 7px; padding: 4px 9px; border: 2px solid currentColor; border-radius: 999px; font-size: 11px; font-weight: 800; }
.status-pill.danger { color: var(--danger); background: var(--danger-bg); border-style: dashed; }
.status-pill.ok { color: var(--ok); background: var(--ok-bg); border-style: double; }
.status-pill.info { color: var(--navy); background: #f3f7fb; }
.formula { color: var(--navy); font: 800 clamp(18px, 2.5vw, 34px)/1.1 Consolas, monospace; }

.lab { width: min(96%, 760px); min-height: 0; display: grid; gap: 10px; }
.lab-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lab-field { min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: #f3f7fb; }
.lab-field label { display: block; margin-bottom: 4px; color: var(--navy); font-size: 11px; font-weight: 800; }
.lab-field input { width: 100%; min-height: 36px; padding: 4px 8px; border: 2px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font: 700 18px/1 Consolas, monospace; }
.lab-result { min-height: 46px; padding: 9px 12px; border: 2px solid var(--navy); border-radius: 12px; background: var(--paper); color: var(--navy); text-align: center; font-size: 14px; font-weight: 800; }
.lab-result.ok { border-style: double; border-width: 4px; border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.lab-result.danger { border-style: dashed; border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
.lab-result.wait { border-style: dotted; border-color: var(--wait); background: var(--wait-bg); color: #7a4a00; }
.pressure-slider { width: 100%; accent-color: var(--blue); }
.button-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.activity-button { min-height: 38px; padding: 7px 13px; border: 2px solid var(--navy); border-radius: 999px; background: var(--paper); color: var(--navy); font-size: 13px; font-weight: 800; }
.activity-button[aria-pressed="true"] { border-style: double; border-width: 4px; background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }

.quiz-area { display: grid; gap: 8px; margin-top: 4px; }
.quiz-choice {
  width: 100%;
  min-height: 46px;
  padding: 9px 12px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
  color: var(--ink);
  text-align: left;
  font-size: 15px;
  font-weight: 700;
}
.quiz-choice.correct { border: 4px double var(--ok); background: var(--ok-bg); color: var(--ok); }
.quiz-choice.incorrect { border: 2px dashed var(--danger); background: var(--danger-bg); color: var(--danger); }
.quiz-choice:disabled { cursor: default; opacity: 1; }
.feedback { margin-top: auto; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 700; line-height: 1.35; }
.feedback.correct { border: 4px double var(--ok); background: var(--ok-bg); color: var(--ok); }
.feedback.incorrect { border: 2px dashed var(--danger); background: var(--danger-bg); color: var(--danger); }

body.reading-mode .lesson-grid { grid-template-columns: minmax(0, .95fr) minmax(360px, 1.05fr); }
body.reading-mode .lesson-panel { padding: 18px 24px; }
body.reading-mode .lesson-lead, body.reading-mode .lesson-list, body.reading-mode .callout { font-size: 1.05em; line-height: 1.55; }

/* Refonte V2 — visuels techniques et activités */
.visual-stage > div { width: 100%; height: 100%; min-height: 0; }
.technical-svg { display: block; width: 100%; height: 100%; min-height: 0; }
.mechanism-lab, .deadband-lab, .envelope-lab { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 7px; }
.mechanism-controls { display: grid; grid-template-columns: auto minmax(135px, .55fr) minmax(120px, 1fr) auto minmax(180px, 1fr); align-items: center; gap: 7px; }
.mechanism-controls label { color: var(--navy); text-align: center; font-size: 11px; font-weight: 800; }
.mechanism-controls output { display: block; color: var(--orange-deep); font: 800 17px/1.1 Consolas, monospace; }
.mechanism-controls input, .deadband-controls input, .cycle-gauge input { width: 100%; accent-color: var(--blue); }
.mechanism-controls .lab-result { min-height: 38px; padding: 6px 8px; font-size: 11px; }

.symbol-workflow { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-content: center; padding: 28px 18px 52px; }
.workflow-line { position: absolute; z-index: 0; top: 50%; left: 9%; right: 9%; height: 6px; background: var(--orange-deep); }
.symbol-card { position: relative; z-index: 1; min-width: 0; margin: 0; padding: 18px 10px 12px; border: 3px solid var(--navy); border-radius: 18px; background: var(--paper); text-align: center; box-shadow: 0 7px 16px rgba(27,58,99,.13); }
.symbol-card img { display: block; width: 86px; height: 86px; margin: auto; object-fit: contain; }
.symbol-card h3 { margin: 8px 0 2px; color: var(--navy); font: 800 16px/1.1 "Trebuchet MS",sans-serif; }
.symbol-card p { margin: 0; color: var(--muted); font-size: 12px; }
.symbol-step { position: absolute; top: -15px; left: calc(50% - 15px); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: white; font-weight: 800; }
.library-seal { position: absolute; right: 16px; bottom: 10px; left: 16px; padding: 8px; border: 3px double var(--ok); border-radius: 10px; background: var(--ok-bg); color: var(--ok); text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .06em; }

.snap-sequence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-content: center; padding: 18px; }
.snap-card { position: relative; min-width: 0; padding: 20px 14px 12px; border: 3px solid var(--navy); border-radius: 18px; background: var(--paper); text-align: center; }
.snap-card > span { position: absolute; top: -15px; left: calc(50% - 15px); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: white; font-weight: 800; }
.snap-card h3 { min-height: 34px; margin: 4px 0; color: var(--navy); font-size: 15px; }
.snap-card svg { width: 112px; height: 82px; }
.snap-card p { margin: 0; color: var(--muted); font-size: 12px; }
.snap-note { grid-column: 1/-1; display: flex; justify-content: center; gap: 12px; padding: 9px; border: 3px double var(--ok); border-radius: 12px; background: var(--ok-bg); color: var(--ok); }

.deadband-controls { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.deadband-lab .lab-result { min-height: 38px; padding: 6px; font-size: 12px; }

.calculation-lab { display: grid; grid-template-rows: auto auto auto auto auto; gap: 7px; align-content: center; padding: 8px 14px; }
.target-tabs, .formula-choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
.target-tab, .formula-choices button { min-height: 38px; padding: 5px 7px; border: 2px solid var(--navy); border-radius: 10px; background: var(--paper); color: var(--navy); font-size: 11px; font-weight: 800; }
.target-tab.active, .formula-choices button.selected { border: 4px double var(--ok); background: var(--ok-bg); color: var(--ok); }
.formula-choices button.wrong { border-style: dashed; border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
.pressure-ruler { display: grid; grid-template-columns: 1fr 2fr 1fr; overflow: hidden; border: 3px solid var(--navy); border-radius: 14px; text-align: center; font-size: 12px; font-weight: 800; }
.pressure-ruler > span { display: grid; place-items: center; min-height: 62px; padding: 5px; }
.ruler-cutout { background: var(--danger-bg); color: var(--danger); }
.ruler-zone { border-right: 3px dashed var(--wait); border-left: 3px dashed var(--wait); background: var(--wait-bg); color: #7a4a00; }
.ruler-cutin { background: var(--ok-bg); color: var(--ok); }
.calc-prompt { margin: 0; color: var(--navy); text-align: center; font-size: 12px; font-weight: 800; }
.calc-fields { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)) auto; gap: 7px; align-items: stretch; }
.calc-fields .lab-field { padding: 5px; }
.calc-fields .lab-field.answer { border: 3px dashed var(--orange-deep); background: var(--wait-bg); }
.primary-action { background: var(--navy); color: white; }
.calculation-lab .lab-result { min-height: 38px; padding: 6px; font-size: 11px; }

.contact-lab { display: grid; grid-template-columns: minmax(0, 1fr) 180px; grid-template-rows: minmax(0,1fr) auto; gap: 8px; padding: 6px; }
.contact-main { min-height: 0; }
.contact-symbol { display: grid; grid-template-rows: auto minmax(70px,1fr) auto; min-height: 0; padding: 10px; border: 3px double var(--navy); border-radius: 14px; background: #f3f7fb; text-align: center; }
.contact-symbol span { color: var(--navy); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
.contact-symbol img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
.contact-symbol p { margin: 3px 0 0; color: var(--muted); font-size: 10px; line-height: 1.2; }
.contact-buttons { grid-column: 1/-1; display: flex; justify-content: center; gap: 8px; }

.model-compare { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; align-content: center; padding: 10px; }
.model-card { display: grid; grid-template-columns: 130px 1fr; min-width: 0; overflow: hidden; border: 3px solid var(--navy); border-radius: 16px; background: var(--paper); }
.model-card.manual { border-style: dashed; border-color: var(--danger); }
.model-face { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; align-content: start; padding: 14px 8px; background: #171b21; color: white; text-align: center; font-size: 11px; font-weight: 800; }
.model-face i { display: block; height: 132px; border: 1px solid #637285; background: repeating-linear-gradient(to bottom,transparent 0 16px,#c7d0db 17px 19px); }
.model-face.one { grid-template-columns: 1fr; }
.model-face.one b { padding: 7px; border-radius: 6px; background: var(--danger); }
.model-card > div:last-child { padding: 12px; }
.model-card h3 { margin: 2px 0 7px; color: var(--navy); font-size: 15px; }
.model-card dl { display: grid; grid-template-columns: 1fr 1fr; margin: 0; font-size: 11px; }
.model-card dt,.model-card dd { margin: 0; padding: 4px; border-bottom: 1px solid var(--line); }
.model-card dd { font-weight: 800; }
.model-rule { grid-column: 1/-1; display: flex; justify-content: center; gap: 12px; padding: 8px; border: 3px double var(--ok); border-radius: 10px; background: var(--ok-bg); color: var(--ok); font-size: 12px; }

.envelope-lab { padding: 8px; }
.lab-row.two { grid-template-columns: repeat(2,minmax(0,1fr)); }
.envelope-lab .lab-result { min-height: 38px; padding: 6px; font-size: 11px; }

.kp-console { position: relative; display: grid; grid-template-rows: auto minmax(0,1fr); gap: 6px; padding: 6px; }
.kp-provenance { padding: 5px 8px; border: 3px double var(--ok); border-radius: 9px; background: var(--ok-bg); color: var(--ok); text-align: center; font-size: 10px; font-weight: 800; letter-spacing: .07em; }
.kp-face-grid { min-height: 0; display: grid; grid-template-columns: minmax(170px,.8fr) minmax(200px,1fr) minmax(170px,.7fr); gap: 8px; }
.kp-hardware,.kp-gauge { min-height: 0; display: grid; place-items: center; }
.kp-hardware svg,.kp-gauge svg { width: 100%; height: 100%; min-height: 0; }
.kp-gauge { grid-template-rows: minmax(0,1fr) auto; }
.kp-equation { margin-top: -4px; padding: 6px 12px; border-radius: 999px; background: var(--wait-bg); color: #7a4a00; font: 800 16px/1 Consolas,monospace; }
.kp-settings { display: grid; grid-template-rows: auto auto auto auto; gap: 7px; align-content: center; }
.kp-setting,.kp-output { padding: 9px; border: 2px solid var(--navy); border-radius: 13px; background: var(--paper); text-align: center; }
.kp-setting.diff { border-color: var(--orange-deep); }
.kp-setting span,.kp-output span { display: block; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
.kp-setting strong,.kp-output strong { display: block; color: var(--navy); font: 800 20px/1.2 Consolas,monospace; }
.kp-setting.diff strong { color: var(--orange-deep); }
.kp-setting > div { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 5px; }
.kp-setting button { display: grid; place-items: center; width: 34px; height: 28px; border: 2px solid var(--navy); border-radius: 8px; background: var(--paper); color: var(--navy); font-weight: 900; }

/* KP15 — moule visuel spécifique. */
.claude-viewport { width: 100%; height: 100%; min-height: 0; overflow: hidden; border-radius: 13px; background: #071b34; }

.logic-token.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }.logic-token.danger { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
.truth-table,.verify-lab table { width: 100%; border-collapse: separate; border-spacing: 3px; text-align: center; font-size: 11px; }
.truth-table th,.verify-lab th { padding: 7px; background: var(--navy); color: white; }.truth-table td,.verify-lab td { padding: 7px; background: #edf3f8; color: var(--navy); font-weight: 700; }
.cycle-lab { width: 100%; max-width: 700px; justify-self: center; display: grid; gap: 14px; padding: 20px; border: 4px solid #315e8f; border-radius: 18px; background: #f5f9fd; }

.cycle-lab > input { width: 100%; accent-color: var(--orange-deep); }.threshold-line { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; color: var(--navy); font-size: 11px; font-weight: 800; }.threshold-line b { padding: 7px; border: 3px double var(--orange-deep); border-radius: 8px; background: var(--wait-bg); text-align: center; }
.cycle-actions { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; }.cycle-lab.bp .cycle-actions { grid-template-columns: repeat(2,minmax(0,1fr)); }
.calculator,.verify-lab { max-width: 760px; justify-self: center; }
.formula-card { display: grid; grid-template-columns: auto 1fr 1fr; gap: 10px; align-items: center; padding: 12px; border: 4px double var(--navy); border-radius: 12px; background: #eef5fb; color: var(--navy); text-align: center; }
.formula-card b { color: var(--orange-deep); }.lab-prompt { margin: 0; color: var(--navy); font-weight: 800; }.answer-row { display: grid; grid-template-columns: auto minmax(90px,1fr) auto auto; gap: 7px; align-items: center; }.answer-row input { min-height: 39px; border: 2px solid var(--line); border-radius: 8px; text-align: center; font: 800 17px Consolas,monospace; }
.compare-formulas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }.compare-formulas section { display: grid; gap: 9px; padding: 18px; border: 4px solid #315e8f; border-radius: 16px; background: #f5f9fd; color: var(--navy); text-align: center; }.compare-formulas section+section { border-color: #c45422; background: #fff8f4; }.compare-formulas strong { font: 900 20px Consolas,monospace; }.compare-formulas p { margin: 0; font-size: 16px; }.direction-arrow { padding: 8px; border-radius: 8px; background: #dce8f4; font-weight: 800; }.direction-arrow.down { background: #fee4d7; color: #a6451b; }.memory-rule { padding: 14px; border: 4px double var(--orange-deep); border-radius: 12px; background: var(--wait-bg); color: var(--navy); text-align: center; }
.terminal-lab .technical-svg { max-height: 330px; }.terminal-roles { grid-template-columns: repeat(5,minmax(0,1fr)); }.terminal-roles .pe { border-color: var(--ok); color: var(--ok); }
.nameplate { max-width: 760px; justify-self: center; }.nameplate-head { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px; padding: 13px; border-radius: 13px 13px 0 0; background: var(--navy); color: white; align-items: baseline; }.nameplate-head strong { color: #fff; font-size: 22px; }.nameplate-head span { color: #bed1e4; font-size: 10px; letter-spacing: .12em; }.nameplate-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }.nameplate-grid section { display: grid; gap: 7px; padding: 14px; border: 2px solid var(--line); border-radius: 11px; background: #f5f8fb; color: var(--navy); text-align: center; }.nameplate-grid p { margin: 0; font-size: 11px; }.side-badge { display: inline-block; justify-self: center; padding: 4px 9px; border-radius: 999px; background: var(--navy); color: white; font-size: 10px; font-weight: 900; }.side-badge.bp { background: #315e8f; }.side-badge.hp { background: #c45422; }.source-stamp { margin: 0; color: var(--muted); font-size: 9px; text-align: center; }
.setting-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }.setting-panel { display: grid; gap: 10px; padding: 16px; border: 4px solid #315e8f; border-radius: 16px; background: #f5f9fd; }.setting-panel.hp { border-color: #c45422; background: #fff8f4; }.fixed-diff,.calculated-threshold { padding: 10px; border-radius: 9px; background: #e5edf5; color: var(--navy); text-align: center; }.setting-panel.hp .fixed-diff,.setting-panel.hp .calculated-threshold { background: #fee4d7; }.calculated-threshold strong { display: block; color: var(--orange-deep); font: 900 23px Consolas,monospace; }
.nitrogen-top { display: grid; grid-template-columns: 100px 180px 1fr 120px; gap: 12px; align-items: center; }.bottle { display: grid; place-items: center; height: 150px; border: 5px solid #315e8f; border-radius: 40px 40px 14px 14px; background: #dce8f4; color: var(--navy); font-size: 28px; font-weight: 900; }.bottle small,.kp-mini small { display: block; font-size: 9px; }.regulator { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }.regulator div { display: grid; place-items: center; aspect-ratio: 1; border: 5px double var(--navy); border-radius: 50%; color: var(--navy); font-size: 9px; text-align: center; }.selector { display: grid; gap: 8px; }.kp-mini { display: grid; place-items: center; height: 110px; border: 5px solid var(--navy); border-radius: 14px; color: var(--navy); font-size: 24px; font-weight: 900; }.nitrogen-readings { grid-template-columns: repeat(3,minmax(0,1fr)); }
.guard-path { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 10px; align-items: center; }.guard-path section { padding: 18px 10px; border: 4px solid var(--navy); border-radius: 14px; background: #f3f7fb; color: var(--navy); text-align: center; }.guard-path p { margin: 7px 0 0; font-size: 11px; }.guard-path>span { color: var(--orange-deep); font-size: 28px; font-weight: 900; }.stop-panel { display: grid; grid-template-columns: auto repeat(3,1fr); gap: 7px; align-items: center; padding: 12px; border: 4px double var(--danger); border-radius: 12px; background: var(--danger-bg); color: var(--danger); }.stop-panel span { font-size: 10px; font-weight: 800; }
.verify-tabs { grid-template-columns: 1fr 1fr; }.verify-lab input { width: 100%; min-height: 32px; border: 2px solid var(--line); border-radius: 6px; text-align: center; }.record-card { max-width: 760px; justify-self: center; }.record-title,.record-footer { padding: 12px; background: var(--navy); color: white; text-align: center; font-weight: 900; }.record-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }.record-grid section { display: grid; gap: 8px; padding: 15px; border: 2px solid var(--line); border-radius: 10px; background: #f5f8fb; color: var(--navy); }.record-grid span { font-size: 11px; }.record-footer { border-radius: 0 0 12px 12px; background: var(--wait-bg); color: var(--orange-deep); }
.summary-map { grid-template-columns: 1fr 130px 1fr; grid-template-rows: 1fr 1fr; gap: 10px; }.summary-center { grid-column: 2; grid-row: 1/-1; align-self: center; display: grid; place-items: center; aspect-ratio: 1; border: 7px double var(--orange-deep); border-radius: 50%; background: var(--navy); color: white; font-size: 30px; font-weight: 900; }.summary-center small { font-size: 11px; }.summary-map section { display: grid; gap: 4px; padding: 12px; border: 3px solid var(--navy); border-radius: 12px; background: #f3f7fb; color: var(--navy); text-align: center; }.sum-bp{grid-column:1;grid-row:1}.sum-hp{grid-column:3;grid-row:1;border-color:#c45422!important}.sum-wire{grid-column:1;grid-row:2}.sum-proof{grid-column:3;grid-row:2}.summary-map section span{font-size:10px}.quiz-symbol { display:grid; place-items:center; width:150px; aspect-ratio:1; border:8px double var(--orange-deep); border-radius:50%; background:var(--navy); color:white; font-size:72px; font-weight:900; }.quiz-symbol small{display:block;font-size:14px}.final-chain span{padding:10px;border:3px solid var(--navy);border-radius:10px;background:#f3f7fb}

n série, jamais en parallèle","text":"Les deux contacts d’autorisation sont montés en série dans la chaîne d’arrêt : un seul contact ouvert suffit à couper. En parallèle, chacun contournerait l’autre et il n’y aurait plus de sécurité."},"visual":"logic","caption":"Table de vérité interactive BP ET HP."},{"id":"bp-zone","short":"Cycle BP","kicker":"Coupure en bas · retour plus haut","title":"Dans la zone neutre BP, le dernier seuil franchi décide de l’état","lead":"Descends puis remonte la pression. Entre CUT OUT et CUT IN, le contact conserve l’état acquis au dernier seuil.","bullets":["À la baisse : coupure BP à CUT OUT.","À la hausse : retour automatique à CUT IN.","Zone neutre BP = intervalle entre les deux seuils."],"callout":{"type":"key","title":"Sens BP","text":"CUT IN est supérieur à CUT OUT."},"visual":"bp-cycle","caption":"Hystérésis BP : une même pression intermédiaire peut correspondre à deux états selon le trajet."},{"id":"bp-differential","short":"DIFF BP","kicker":"Premier calcul essentiel","title":"En BP : DIFF = CUT IN − CUT OUT","lead":"Choisis d’abord la grandeur recherchée et la relation, puis saisis toi-même le résultat.","bullets":["DIFF BP = CUT IN − CUT OUT.","CUT OUT BP = CUT IN − DIFF.","CUT IN BP = CUT OUT + DIFF.","Différentiel trop étroit : le compresseur démarre et s’arrête en boucle et s’use."],"callout":{"type":"warning","title":"Toujours positif","text":"La largeur de la zone neutre ne peut pas être négative."},"visual":"differential","caption":"Atelier de calcul BP : formule choisie avant calcul."},{"id":"hp-cycle","short":"Cycle HP","kicker":"Coupure en haut · retour plus bas","title":"En HP, le seuil haut coupe ; la baisse rend le réarmement possible","lead":"Sur la référence 060‑126491, la HP est à réarmement manuel maximum et le différentiel HP est fixe à 4 bar.","bullets":["À la hausse : coupure HP à CUT OUT.","À la baisse : seuil de réarmement = CUT OUT − 4 bar.","La baisse ne referme pas seule le contact : il faut RESET."],"callout":{"type":"key","title":"Sens HP","text":"CUT OUT est supérieur au seuil de retour ou de réarmement."},"visual":"hp-cycle","media":{"src":"assets/illustrations-claude/03-cote-hp.png","focus":"mechanism","title":"Mécanisme du côté HP","alt":"Gros plan recadré sur le soufflet et les ressorts haute pression d’un pressostat KP15.","note":"La vue Claude sert à lire la voie mécanique HP ; le schéma électrique de référence est présenté dans l’étape Bornier.","caption":"Illustration Claude intégrée : la montée HP agit sur le soufflet droit jusqu’à la coupure haute."},"caption":"Cycle HP manuel maximum : déclenchement, baisse, disponibilité du RESET puis réarmement."},{"id":"hp-differential","short":"DIFF HP","kicker":"Le calcul change de sens","title":"En HP : DIFF = CUT OUT − seuil de réarmement","lead":"Pour la référence étudiée, CUT OUT 24 bar et DIFF 4 bar donnent un réarmement possible à 20 bar ou moins.","bullets":["DIFF HP = CUT OUT − seuil de réarmement.","Seuil de réarmement = CUT OUT − DIFF.","24 − 4 = 20 bar dans l’exemple, pas une consigne universelle."],"callout":{"type":"warning","title":"Deux sens","text":"BP : le retour est plus haut que la coupure. HP : le réarmement devient possible plus bas que la coupure."},"visual":"dual-differential","caption":"Comparateur BP/HP : le grand seuil moins le petit donne toujours la largeur positive."},{"id":"terminals","short":"A B C D + PE","kicker":"Quatre conducteurs actifs plus la terre","title":"A alimente, C commande la charge, B signale la BP et D signale la HP","lead":"La variante KP15 étudiée possède les quatre bornes actives A, B, C, D et une borne de protection PE.","bullets":["A : arrivée ligne commune ; C : sortie vers la charge ou la commande KM1.","B : sortie de signalisation du défaut BP ; D : sortie de signalisation du défaut HP.","PE : conducteur de protection, distinct des quatre conducteurs actifs."],"callout":{"type":"warning","title":"Variante exacte","text":"Tous les KP15 n’ont pas la borne D. Le diagramme de la référence réellement posée fait foi."},"visual":"terminals","caption":"Schéma inerWeb corrigé d’après le diagramme Danfoss « LP and HP signal » : A/B/C/D + PE."},{"id":"reference","short":"Référence","kicker":"060‑126491","title":"La référence fixe les plages, le différentiel HP et les réarmements","lead":"Le nom KP15 désigne une famille. Les chiffres ci-dessous appartiennent à la référence suivie dans ce module.","bullets":["BP : −0,2 à 7,5 bar Pe ; DIFF réglable 0,7 à 4 bar ; retour automatique.","HP : 8 à 32 bar Pe ; DIFF fixe 4 bar ; réarmement manuel maximum.","bar Pe = pression lue au manomètre, zéro à l’air libre ; −0,2 bar Pe est une dépression.","Fonction de contact annoncée : SPDT + SPST(NO), avec borne D limitée à sa puissance documentée."],"callout":{"type":"note","title":"Ne pas généraliser","text":"Une autre référence KP15 peut avoir un autre raccordement ou un autre mode de réarmement."},"visual":"nameplate","caption":"Fiche d’identité pédagogique de la référence 060‑126491."},{"id":"settings","short":"Prérégler","kicker":"Lire les deux plaques","title":"Le côté BP règle CUT IN et DIFF ; le côté HP règle CUT OUT","lead":"Manipule les valeurs. Les graduations placent un préréglage ; seuls les basculements mesurés valident les seuils obtenus.","bullets":["BP : CUT OUT calculé = CUT IN − DIFF.","HP : seuil de RESET calculé = CUT OUT − 4 bar.","Après une retouche, revérifier les deux seuils du côté concerné."],"callout":{"type":"key","title":"Deux plaques, deux lectures","text":"Ne transpose pas la lecture RANGE/DIFF BP sur la plaque HP."},"visual":"kp15-face","caption":"Face interactive originale : réglages BP et HP liés aux seuils calculés."},{"id":"nitrogen","short":"Banc azote","kicker":"Installation arrêtée","title":"Contrôler un côté à la fois avec un banc et des limites adaptés","lead":"Le banc applique une pression connue au raccord choisi et suit électriquement les contacts sans démarrer le compresseur.","bullets":["Bouteille d’azote sec arrimée, mano-détendeur, manomètre précis et flexibles compatibles.","Sélectionner LP ou HP et respecter la pression d’essai admissible de ce côté.","Contrôler A–C puis le signal B ou D correspondant ; installation isolée électriquement."],"callout":{"type":"warning","title":"Gaz et énergie","text":"Jamais d’oxygène ni d’air comprimé. Aucun démarrage du compresseur sous azote."},"visual":"nitrogen","caption":"Banc azote à deux voies : une seule sortie active, limite LP/HP affichée et contrôle de continuité."},{"id":"running","short":"En service","kicker":"Contrôle encadré","title":"Une limite machine prime toujours sur l’obtention du clic","lead":"Avant l’essai, vérifier l’enveloppe du compresseur, les pressions admissibles et le moyen d’arrêt immédiat.","bullets":["Côté BP : ne pas forcer le compresseur sous sa limite basse admissible.","Côté HP : ne jamais fermer une vanne de refoulement pour provoquer une montée.","Trois crans dans cet ordre : le pressostat HP coupe, la soupape de sécurité s’ouvre ensuite, la pression maximale admissible PS reste au-dessus.","Si une limite est atteinte avant le seuil attendu, arrêter et corriger le diagnostic ou le réglage."],"callout":{"type":"warning","title":"Sécurité","text":"Consignation, procédure du site, habilitations et notice restent prioritaires."},"visual":"running","caption":"Contrôle en fonctionnement : pression, enveloppe compresseur, état électrique et moyen d’arrêt suivis ensemble."},{"id":"verify","short":"Trois cycles","kicker":"Mesurer et comparer","title":"Valider séparément le côté BP et le côté HP","lead":"Choisis le côté, saisis trois couples de seuils, puis calcule la répétabilité après tes relevés.","bullets":["BP : CUT IN hausse et CUT OUT baisse.","HP : CUT OUT hausse et seuil de RESET baisse, puis action volontaire sur RESET.","Comparer l’étendue mesurée à la tolérance documentée, jamais à une tolérance inventée."],"callout":{"type":"key","title":"Preuve","text":"La graduation prérègle ; trois cycles mesurés prouvent le comportement."},"visual":"verify","caption":"Tableau de relevés BP/HP : trois cycles, trois différentiels et une étendue."},{"id":"record","short":"Tracer","kicker":"Fin d’intervention","title":"Le compte rendu distingue les deux côtés et la référence exacte","lead":"Un autre technicien doit pouvoir reprendre le raisonnement sans confondre BP, HP, charge et signalisations.","bullets":["Marque, référence, plage, raccordement A/B/C/D + PE et modes de réarmement.","Seuils cibles, source des limites machine et méthode d’essai.","Trois cycles BP, trois cycles HP, action du RESET, anomalies et remise en état."],"callout":{"type":"note","title":"Statut","text":"Ce module reste un brouillon tant que le bon à tirer métier n’a pas été donné."},"visual":"record","caption":"Chaîne de preuve : identifier, calculer, prérégler, mesurer, comparer et tracer."},{"id":"summary","short":"Synthèse","kicker":"Le raisonnement complet","title":"Deux pressions, deux sens de cycle, quatre bornes actives et un PE","lead":"Tu peux maintenant expliquer le mécanisme, calculer les deux différentiels et lire le câblage de la variante étudiée.","bullets":["BP : CUT OUT en bas, CUT IN plus haut, DIFF = CUT IN − CUT OUT.","HP : CUT OUT en haut, retour plus bas, DIFF = CUT OUT − retour.","A = ligne, C = charge, B = signal BP, D = signal HP, PE = protection."],"callout":{"type":"key","title":"Règle finale","text":"Un RESET ne supprime jamais la cause d’un défaut."},"visual":"summary","caption":"Synthèse mécanique, numérique, électrique et méthodologique du KP15."}],"quiz":[{"id":"q-chain","question":"Quelle chaîne décrit le fonctionnement mécanique du KP15 ?","choices":["Pression → soufflet → ressorts et bascule → contacts","Contact → fluide → compresseur → pression","Ressort → température → huile → contact"],"answer":0,"explanation":"Chaque pression agit sur un soufflet ; le mécanisme compare les efforts puis bascule les contacts."},{"id":"q-logic","question":"La BP est correcte mais la HP est en défaut. Quel est le verdict ?","choices":["Charge autorisée","Charge arrêtée","Le défaut HP est annulé par la BP"],"answer":1,"explanation":"La fonction de charge exige BP correcte ET HP correcte."},{"id":"q-bp","question":"CUT IN BP vaut 1,4 bar et CUT OUT BP 0,2 bar. Quel est DIFF BP ?","choices":["1,2 bar","1,6 bar","0,2 bar"],"answer":0,"explanation":"DIFF BP = CUT IN − CUT OUT = 1,4 − 0,2 = 1,2 bar."},{"id":"q-hp","question":"CUT OUT HP vaut 24 bar et DIFF 4 bar. À quelle pression le RESET devient-il possible ?","choices":["28 bar","20 bar ou moins","4 bar"],"answer":1,"explanation":"Seuil de retour HP = CUT OUT − DIFF = 24 − 4 = 20 bar."},{"id":"q-reset","question":"La HP a baissé sous le seuil de retour sur le manuel maximum. Que manque-t-il ?","choices":["Un appui volontaire sur RESET","Une nouvelle montée HP","Un shunt de sécurité"],"answer":0,"explanation":"La baisse rend le réarmement possible ; elle ne referme pas seule la charge."},{"id":"q-wires","question":"Quel repérage correspond aux quatre conducteurs actifs de la variante étudiée ?","choices":["A, B, C, D","1, 2, 4, PE","L1, L2, L3, N"],"answer":0,"explanation":"A/B/C/D sont quatre bornes actives ; le PE est en plus et reste un conducteur de protection."},{"id":"q-terminals","question":"Quelle association est correcte ?","choices":["A ligne, C charge, B signal BP, D signal HP","A terre, B neutre, C HP, D BP","A charge, C terre, B et D inutilisées"],"answer":0,"explanation":"C’est le repérage du diagramme Danfoss avec signalisations LP et HP."},{"id":"q-nitrogen","question":"Comment contrôler le KP15 au banc azote ?","choices":["Un côté à la fois, installation isolée","Envoyer la pression HP dans les deux raccords","Démarrer le compresseur sous azote"],"answer":0,"explanation":"LP et HP ont des domaines différents ; le banc contrôle une voie à la fois sans démarrer la machine."}],"final":{"id":"final","short":"Bilan","kicker":"Compétence visée","title":"Tu sais lire, régler et éprouver les deux côtés du KP15","lead":"La méthode tient en sept verbes : repérer, documenter, calculer, prérégler, mesurer, réarmer et tracer.","bullets":["Expliquer les deux chaînes pression–soufflet–ressort–contact.","Calculer le différentiel BP et HP sans inverser les seuils.","Câbler et contrôler A/B/C/D plus PE selon la référence posée.","Référentiel travaillé : 6.03 régler les interrupteurs de sécurité et de contrôle · 7.04 régler les sécurités côté condenseur · 9.06 régler un limiteur de pression. En appui : 1.01 · 1.04 · 3.01 · 4.05 · 6.07."],"callout":{"type":"key","title":"À retenir","text":"BP correcte ET HP correcte = marche possible ; tout défaut impose d’en rechercher la cause."},"visual":"final","caption":"Bilan du parcours KP15 combiné HP/BP."}};</script>
  <script>(() => {

  function logicVisual() {

  let speechRun = 0;
  let speaking = false;
  /* Un élève qui ne lit pas ne doit pas avoir à retrouver le bouton à chaque écran :
     « Écouter » arme la lecture suivie, « Stop » la désarme. */
  let lectureSuivie = false;

  const escapeHtml = (value) => String(value)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;");

  function score() {
    return answers.reduce((sum, answer, index) => sum + (answer === COURSE.quiz[index].answer ? 1 : 0), 0);
  }

  function kind() {
    if (screen < COURSE.lessons.length) return "lesson";
    if (screen < COURSE.lessons.length + COURSE.quiz.length) return "quiz";
    return "final";
  }

  function stopSpeech() {
    speechRun += 1;
    speaking = false;
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    ui.speak.setAttribute("aria-pressed", "false");
    ui.speak.innerHTML = "▶ <span>Écouter</span>";
    ui.stop.disabled = true;
  }

  function resetContent() {
    stopSpeech();
    ui.quiz.hidden = true;
    ui.quiz.innerHTML = "";
    ui.feedback.hidden = true;
    ui.feedback.className = "feedback";
    ui.feedback.textContent = "";
    ui.callout.hidden = true;
    ui.callout.removeAttribute("data-type");
    ui.callout.innerHTML = "";
  }

  function fillText(item) {
    ui.kicker.textContent = item.kicker || "";
    ui.title.textContent = item.title;
    ui.lead.textContent = item.lead;
    ui.list.innerHTML = item.bullets.map((bullet) => `<li>${escapeHtml(bullet)}</li>`).join("");
    ui.caption.textContent = item.caption || "";
    if (item.callout) {
      ui.callout.hidden = false;
      ui.callout.dataset.type = item.callout.type || "note";
      ui.callout.innerHTML = `<strong>${escapeHtml(item.callout.title)}</strong><span>${escapeHtml(item.callout.text)}</span>`;
    }
  }

  function renderLessonVisual(item) {
    if (!item.media) {
      ui.stage.innerHTML = VISUALS.render(item.visual);
      ui.stage.setAttribute("role", "img");
      ui.stage.setAttribute("aria-label", item.caption);
      ui.stage.removeAttribute("data-visual-mode");
      ui.caption.textContent = item.caption || "";
      VISUALS.wire(item.visual);
      return;
    }

    const bodyId = `visualModeBody-${screen}`;
    ui.stage.setAttribute("role", "group");
    ui.stage.setAttribute("aria-label", `Deux lectures disponibles pour ${item.media.title}`);
    ui.stage.innerHTML = `
      <div class="visual-composite">
        <div class="visual-tabs" role="tablist" aria-label="Choisir le type de visuel">
          <button class="visual-tab" type="button" role="tab" data-mode="media" aria-controls="${bodyId}">Illustration Claude</button>
          <button class="visual-tab" type="button" role="tab" data-mode="activity" aria-controls="${bodyId}">Schéma / activité</button>
        </div>
        <div class="visual-mode-body" id="${bodyId}" role="tabpanel"></div>
      </div>`;

    const body = document.getElementById(bodyId);
    const tabs = Array.from(ui.stage.querySelectorAll(".visual-tab"));
    const showMode = (mode) => {
      const mediaMode = mode === "media";
      ui.stage.dataset.visualMode = mode;
      tabs.forEach((tab) => {
        const selected = tab.dataset.mode === mode;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
      if (mediaMode) {
        const focus = item.media.focus ? ` data-focus="${escapeHtml(item.media.focus)}"` : "";
        body.innerHTML = `<figure class="claude-frame"${focus}>
          <div class="claude-viewport"><img src="${escapeHtml(item.media.src)}" alt="${escapeHtml(item.media.alt)}" draggable="false"></div>
          <figcaption><strong>${escapeHtml(item.media.title)}</strong><span>${escapeHtml(item.media.note)}</span></figcaption>
        </figure>`;
        ui.caption.textContent = item.media.caption;
      } else {
        body.innerHTML = VISUALS.render(item.visual);
        ui.caption.textContent = item.caption;
        VISUALS.wire(item.visual);
      }
    };
    tabs.forEach((tab) => tab.addEventListener("click", () => {
      showMode(tab.dataset.mode);
      /* On change d’onglet pour voir autre chose : la voix doit décrire cet autre chose. */
      if (lectureSuivie) speak();
    }));
    showMode("media");
  }

  function renderLesson() {
    const item = COURSE.lessons[screen];
    fillText(item);
    renderLessonVisual(item);
    ui.next.disabled = false;
    ui.next.textContent = screen === COURSE.lessons.length - 1 ? "Passer au quiz →" : "Continuer →";
    ui.navState.textContent = `Cours · ${screen + 1} sur ${COURSE.lessons.length}`;
  }

  function markQuiz(questionIndex) {
    const chosen = answers[questionIndex];
    if (chosen === null) return;
    const question = COURSE.quiz[questionIndex];
    ui.quiz.querySelectorAll(".quiz-choice").forEach((button, index) => {
      button.disabled = true;
      button.classList.toggle("correct", index === question.answer);
      button.classList.toggle("incorrect", index === chosen && chosen !== question.answer);
    });
    const correct = chosen === question.answer;
    ui.feedback.hidden = false;
    ui.feedback.className = `feedback ${correct ? "correct" : "incorrect"}`;
    ui.feedback.textContent = `${correct ? "Bonne réponse. " : "À reprendre. "}${question.explanation}`;
  }

  function renderQuiz() {
    const questionIndex = screen - COURSE.lessons.length;
    const question = COURSE.quiz[questionIndex];
    ui.kicker.textContent = `Quiz formatif · question ${questionIndex + 1}`;
    ui.title.textContent = question.question;
    ui.lead.textContent = "Choisis une réponse, puis lis l’explication avant de continuer.";
    ui.list.innerHTML = "";
    ui.caption.textContent = "Le score sert à repérer les notions à reprendre ; aucune donnée n’est transmise.";
    ui.stage.innerHTML = VISUALS.quiz(questionIndex, COURSE.quiz.length, score(), question.id);
    ui.stage.setAttribute("role", "img");
    ui.stage.setAttribute("aria-label", `Question ${questionIndex + 1} sur le pressostat combiné KP15`);
    ui.stage.removeAttribute("data-visual-mode");
    ui.quiz.hidden = false;
    ui.quiz.innerHTML = question.choices.map((choice, index) => `<button class="quiz-choice" type="button" data-choice="${index}">${escapeHtml(choice)}</button>`).join("");
    ui.quiz.querySelectorAll(".quiz-choice").forEach((button) => button.addEventListener("click", () => {
      if (answers[questionIndex] !== null) return;
      answers[questionIndex] = Number(button.dataset.choice);
      markQuiz(questionIndex);
      ui.next.disabled = false;
      ui.next.focus({ preventScroll: true });
    }));
    markQuiz(questionIndex);
    ui.next.disabled = answers[questionIndex] === null;
    ui.next.textContent = questionIndex === COURSE.quiz.length - 1 ? "Voir le bilan →" : "Question suivante →";
    ui.navState.textContent = `Quiz · ${questionIndex + 1} sur ${COURSE.quiz.length}`;
  }

  function renderFinal() {
    const item = COURSE.final;
    fillText(item);
    ui.stage.innerHTML = VISUALS.final(score(), COURSE.quiz.length);
    ui.stage.setAttribute("role", "img");
    ui.stage.setAttribute("aria-label", `Bilan : ${score()} bonnes réponses sur ${COURSE.quiz.length}`);
    ui.stage.removeAttribute("data-visual-mode");
    ui.next.disabled = true;
    ui.next.textContent = "Parcours terminé";
    ui.navState.textContent = `Bilan · ${score()} / ${COURSE.quiz.length}`;
  }

  function render() {
    resetContent();
    const currentKind = kind();
    if (currentKind === "lesson") renderLesson();
    else if (currentKind === "quiz") renderQuiz();
    else renderFinal();
    const percent = Math.round(((screen + 1) / total) * 100);
    ui.progressFill.style.width = `${percent}%`;
    ui.progressTrack.setAttribute("aria-valuenow", String(percent));
    ui.progressCount.textContent = `${screen + 1} / ${total}`;
    ui.progressLabel.textContent = currentKind === "lesson" ? COURSE.lessons[screen].short : currentKind === "quiz" ? "Quiz" : "Bilan";
    ui.back.disabled = screen === 0;
    if (lectureSuivie) speak();
    document.title = `${ui.title.textContent} — KP15 HP/BP`;
  }

  function move(delta) {
    if (delta > 0 && kind() === "quiz" && ui.next.disabled) return;
    const next = Math.max(0, Math.min(total - 1, screen + delta));
    if (next !== screen) { screen = next; render(); }
  }

  /* Les symboles se lisent mal à la synthèse vocale. Le public visé comprend des
     élèves qui ne lisent pas : un « 1–4 » prononcé « moins trois », ou une formule
     muette, leur retire purement et simplement l’information. */
  function pourLaVoix(texte) {
    return String(texte)
      .replace(/(\d)\s*[–—-]\s*(\d)/g, "$1 $2")
      .replace(/×/g, " fois ")
      .replace(/−/g, " moins ")
      .replace(/≈/g, " environ ")
      .replace(/=/g, " égale ")
      .replace(/·/g, ", ")
      .replace(/→/g, " puis ")
      .replace(/\.\s*\./g, ".")
      .replace(/\s{2,}/g, " ");
  }

  function spokenText() {
    const parts = [ui.kicker.textContent, ui.title.textContent, ui.lead.textContent,
      ...Array.from(ui.list.querySelectorAll("li"), (li) => li.textContent)];
    if (!ui.callout.hidden) {
      const titre = ui.callout.querySelector("strong");
      const corps = ui.callout.querySelector("span");
      parts.push(titre ? `${titre.textContent} : ${corps ? corps.textContent : ""}` : ui.callout.textContent);
    }
    /* Ce que montre l’écran doit s’entendre, sinon l’illustration et le schéma
       n’existent que pour qui voit ET lit. */
    const image = ui.stage.querySelector(".claude-frame img[alt]");
    if (image && image.alt) {
      parts.push("Ce que montre l’illustration. " + image.alt);
      const note = ui.stage.querySelector(".claude-frame figcaption span");
      if (note) parts.push(note.textContent);
    } else if (ui.caption.textContent) {
      parts.push(ui.caption.textContent);
    }
    /* Les réponses du quiz sont numérotées à voix haute : sans cela, on entend la
       question mais on ne peut pas choisir. */
    if (!ui.quiz.hidden) {
      Array.from(ui.quiz.querySelectorAll(".quiz-choice")).forEach((bouton, index) => {
        parts.push(`Réponse ${index + 1}. ${bouton.textContent}`);
      });
    }
    if (!ui.feedback.hidden) parts.push(ui.feedback.textContent);
    return pourLaVoix(parts.filter(Boolean).join(". "));
  }

  function selectFrenchVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    return voices.find((voice) => voice.localService && /^fr/i.test(voice.lang))
      || voices.find((voice) => /^fr/i.test(voice.lang)) || null;
  }

  function speak() {
    if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
      ui.navState.textContent = "Voix indisponible sur ce navigateur";
      return;
    }
    stopSpeech();
    const run = speechRun;
    const utterance = new SpeechSynthesisUtterance(spokenText());
    utterance.lang = "fr-FR";
    utterance.rate = Number(ui.speed.value);
    utterance.pitch = 1;
    const voice = selectFrenchVoice();
    if (voice) utterance.voice = voice;
    utterance.onstart = () => {
      if (run !== speechRun) return;
      speaking = true;
      ui.speak.setAttribute("aria-pressed", "true");
      ui.speak.innerHTML = "❚❚ <span>Pause</span>";
      ui.stop.disabled = false;
    };
    const finish = () => {
      if (run !== speechRun) return;
      speaking = false;
      ui.speak.setAttribute("aria-pressed", "false");
      ui.speak.innerHTML = "▶ <span>Écouter</span>";
      ui.stop.disabled = true;
    };
    utterance.onend = finish;
    utterance.onerror = finish;
    window.speechSynthesis.speak(utterance);
  }

  ui.back.addEventListener("click", () => move(-1));
  ui.next.addEventListener("click", () => move(1));
  ui.speak.addEventListener("click", () => {
    if (speaking && window.speechSynthesis.speaking) {
      window.speechSynthesis.pause(); speaking = false;
      ui.speak.setAttribute("aria-pressed", "false");
      ui.speak.innerHTML = "▶ <span>Reprendre</span>";
    } else if (window.speechSynthesis?.paused) {
      window.speechSynthesis.resume(); speaking = true;
      ui.speak.setAttribute("aria-pressed", "true");
      ui.speak.innerHTML = "❚❚ <span>Pause</span>";
    } else { lectureSuivie = true; speak(); }
  });
  ui.stop.addEventListener("click", () => { lectureSuivie = false; stopSpeech(); });
  ui.reading.addEventListener("click", () => {
    const active = document.body.classList.toggle("reading-mode");
    ui.reading.setAttribute("aria-pressed", String(active));
  });
  ui.fullscreen.addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch { ui.navState.textContent = "Plein écran refusé par le navigateur"; }
  });
  document.addEventListener("keydown", (event) => {
    if (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(event.target.tagName)) return;
    if (event.key === "ArrowRight") move(1);
    if (event.key === "ArrowLeft") move(-1);
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { lectureSuivie = false; stopSpeech(); } });
  window.addEventListener("beforeunload", stopSpeech);
  render();
})();
</script>
</body>
</html>
