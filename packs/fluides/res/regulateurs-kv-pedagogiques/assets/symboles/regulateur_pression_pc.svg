  <title id="title">Régulateur de pression PC</title>
  <desc id="desc">Symbole schématique fourni pour une vanne de régulation de pression. La vanne est montée en ligne entre les raccords gauche et droit. Une membrane de commande repérée PC agit sur le clapet.</desc>
