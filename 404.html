<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Page introuvable — inerWeb Édu</title>
<!-- GitHub Pages sert ce fichier pour tout chemin inexistant. Autonome :
     styles inclus, chemins ABSOLUS (la 404 peut être servie depuis
     n'importe quelle profondeur d'URL). -->
<style>
  body { margin:0; background:#f7f1e7; color:#10233c;
         font:17px/1.6 Calibri,'Segoe UI',system-ui,Arial,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .carte { background:#fffdf8; border:1px solid #d6dee7; border-radius:14px;
           box-shadow:0 2px 10px rgba(27,58,99,.10); max-width:460px;
           margin:20px; padding:28px 30px; text-align:center; }
  .flocon { font-size:56px; line-height:1; }
  h1 { font-family:'Trebuchet MS',Calibri,Arial,sans-serif; color:#1b3a63;
       font-size:24px; margin:10px 0 8px; }
  p { margin:0 0 18px; color:#5a6b7d; }
  a { display:inline-block; padding:10px 22px; border-radius:999px;
      font:bold 16px 'Trebuchet MS',Calibri,Arial,sans-serif;
      text-decoration:none; margin:4px; min-height:44px; box-sizing:border-box; }
  a.plein { background:#1b3a63; color:#fff; }
  a.creux { background:#fffdf8; color:#1b3a63; border:2px solid #2f5689; }
  a:focus-visible { outline:3px solid #ff6b35; outline-offset:2px; }
</style>
</head>
<body>
  <main class="carte">
    <div class="flocon" aria-hidden="true">❄️</div>
    <h1>Cette page n'existe pas (ou plus)</h1>
    <p>L'adresse a peut-être changé pendant les travaux du site.
       Tout le contenu reste accessible depuis le plan de formation.</p>
    <a class="plein" href="/">Retour à l'accueil</a>
    <a class="creux" href="/#liste-cours">Tous les cours en liste</a>
  </main>
</body>
</html>
