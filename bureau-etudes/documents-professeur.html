<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bureau d’études, corrigés pour l’enseignant</title>
<link rel="stylesheet" href="accueil.css">
<style>
  /* Les CORRIGÉS du réseau Bureau d'études : le coffre chiffré (produit « bureau-etudes », indice 6), ouvert par le
     code enseignant (décision 41 du 31/10/2026 : aucun corrigé en accès libre). Rien n'est en clair sur le serveur :
     chaque document est déchiffré dans le navigateur par la clé que transporte le code (moteur/acces.js du site).
     Modèle : cablage-virtuel/documents-professeur.html. Le coffre vient de outils/chiffrer-coffre.mjs de l'atelier. */
  body.prof{background:#eef2f7;min-height:100vh;margin:0;font-family:Calibri,Carlito,"Segoe UI",sans-serif;color:#10233c}
  .prof main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
  .prof h1{color:#1b3a63;font-size:26px;margin:.2em 0 .1em}
  .prof .chapo{color:#637285;font-size:17px;margin:0 0 18px}
  .prof .cadre{background:#fff;border:1px solid #c3cdd9;border-radius:12px;padding:16px 18px;margin:0 0 14px;box-shadow:0 1px 3px rgba(16,35,60,.08)}
  .prof .cadre.ferme{border-left:6px solid #e8914a}
  .prof .cadre.ouvert{border-left:6px solid #2e8b57}
  .prof .cadre h2{margin:0 0 6px;font-size:19px;color:#1b3a63}
  .prof .groupe{scroll-margin-top:12px}
  .prof .groupe.vise{outline:3px solid #e8914a;outline-offset:2px}
  .prof .ligne{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:7px 0;border-top:1px solid #c3cdd9}
  .prof .ligne:first-of-type{border-top:none}
  .prof .ligne .t{flex:1;min-width:180px;font-size:17px}
  .prof button.doc{min-height:44px;padding:6px 14px;border-radius:10px;border:2px solid #1b3a63;background:#fff;color:#1b3a63;font:700 16px system-ui,sans-serif;cursor:pointer}
  .prof button.doc:disabled{opacity:.5;cursor:wait}
  .prof .bouton{display:inline-block;padding:10px 16px;border-radius:10px;background:#1b3a63;color:#fff;font-weight:700;text-decoration:none;margin:6px 8px 0 0}
  .prof .bouton.second{background:#fff;color:#1b3a63;border:2px solid #1b3a63}
  .prof .etat{font-size:16px;color:#637285;margin:4px 0 0}
  .prof .erreur{color:#b3261e;font-weight:700}
  .prof .retour{display:inline-block;margin:12px 0 0;color:#1b3a63;font-size:17px}
</style>
</head>
<body class="prof">
<main>
  <a class="retour" href="index.html">‹ Retour au réseau Bureau d’études</a>
  <h1>Corrigés pour l’enseignant</h1>
  <p class="chapo">Le corrigé de chaque feuille des stations et de chaque exercice de la ligne « Lire les plans », en PDF. Réservés aux enseignants : ils s’ouvrent avec votre code d’accès inerWeb Bureau d’études. Rien n’est en clair sur le serveur.</p>
  <div id="porte"></div>
  <div id="liste"></div>
</main>
<script src="../moteur/acces.js?v=20261031"></script>
<script>
(function () {
  'use strict';
  var PRODUIT = 'bureau-etudes', MILLESIME = 2026, COFFRE = 'coffre-' + MILLESIME + '/';
  var A = window.inerwebAcces;
  var porte = document.getElementById('porte'), liste = document.getElementById('liste');
  function el(tag, cls, texte) { var e = document.createElement(tag); if (cls) e.className = cls; if (texte) e.textContent = texte; return e; }
  if (!A) { porte.appendChild(el('p', 'erreur', 'La page d’accès n’a pas pu se charger. Rechargez, ou revenez plus tard.')); return; }
  if (!A.estTitulaire(PRODUIT)) {
    var c = el('div', 'cadre ferme');
    c.appendChild(el('h2', null, '🔒 Accès enseignant'));
    c.appendChild(el('p', null, 'Ces corrigés sont chiffrés. Collez le code du Bureau d’études que vous avez reçu sur la page d’activation, puis revenez ici : ce navigateur s’en souviendra.'));
    var a1 = el('a', 'bouton', 'J’ai un code : l’activer'); a1.href = '../activer.html?retour=' + encodeURIComponent(location.pathname + location.hash); c.appendChild(a1);
    var a2 = el('a', 'bouton second', 'Demander un code'); a2.href = '../demander-un-acces.html'; c.appendChild(a2);
    porte.appendChild(c);
    return;
  }
  var acces = A.accesDe(PRODUIT);
  A.filigrane(PRODUIT);
  var ok = el('div', 'cadre ouvert');
  ok.appendChild(el('h2', null, '✓ Ouvert pour ' + acces.nom));
  ok.appendChild(el('p', 'etat', 'Accès ' + (acces.millesime || MILLESIME) + (acces.expireLe ? ', valable jusqu’au ' + acces.expireLe.split('-').reverse().join('/') : '') + '. Les documents portent votre nom en filigrane à l’écran.'));
  porte.appendChild(ok);
  fetch(COFFRE + 'index.json', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('index introuvable');
    return r.json();
  }).then(function (idx) {
    var groupes = [], parGroupe = {};
    idx.documents.forEach(function (d) {
      if (!parGroupe[d.groupe]) { parGroupe[d.groupe] = { id: d.groupe, titre: d.exercice, docs: [] }; groupes.push(parGroupe[d.groupe]); }
      parGroupe[d.groupe].docs.push(d);
    });
    groupes.forEach(function (g) {
      var bloc = el('section', 'cadre groupe'); bloc.id = g.id;
      bloc.appendChild(el('h2', null, g.titre));
      g.docs.forEach(function (d) {
        var ligne = el('div', 'ligne');
        ligne.appendChild(el('span', 't', d.titre));
        var b = el('button', 'doc', '📄 PDF');
        b.title = d.fichier;
        b.onclick = function () { ouvrir(d, b); };
        ligne.appendChild(b);
        bloc.appendChild(ligne);
      });
      liste.appendChild(bloc);
    });
    var vise = location.hash && document.getElementById(location.hash.slice(1));
    if (vise) { vise.classList.add('vise'); vise.scrollIntoView(); }
  }).catch(function () {
    liste.appendChild(el('p', 'erreur', 'La liste des documents est introuvable. Rechargez la page.'));
  });
  function ouvrir(d, bouton) {
    bouton.disabled = true;
    A.ouvrirDocument(PRODUIT, COFFRE + d.id + '.enc', 'prof').then(function (clair) {
      var url = URL.createObjectURL(new Blob([clair], { type: 'application/pdf' }));
      var a = document.createElement('a'); a.href = url; a.target = '_blank';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }).catch(function () {
      alert('Ce document ne s’ouvre pas avec votre code (accès d’une autre année ?).');
    }).then(function () { bouton.disabled = false; });
  }
})();
</script>
</body>
</html>
