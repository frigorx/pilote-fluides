<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 67.00" width="180mm" height="67.00mm" role="img">
<title>Où va la puissance absorbée par le caisson</title>
<rect width="180" height="67.00" fill="#fff"/>
<g><text x="90" y="37" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 90 37)">inerWeb, by inerweb.fr</text><text x="40" y="20" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 40 20)">inerWeb, by inerweb.fr</text><text x="140" y="55" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 140 55)">inerWeb, by inerweb.fr</text></g>
<text x="1.50" y="5.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Logement d’exemple, caisson A en position 2, en pointe</text>
<text x="6.00" y="15.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Puissance absorbée par le moteur : 15,74 W</text>
<rect x="6.00" y="18.00" width="168.00" height="8.00" fill="#1b3a63" stroke="#1b3a63" stroke-width="0.2"/>
<rect x="6.00" y="32.00" width="42.01" height="8.00" fill="#d9771f" stroke="#d9771f" stroke-width="0.2"/>
<rect x="48.01" y="32.00" width="125.99" height="8.00" fill="#dfe5ee" stroke="#8a96a6" stroke-width="0.2"/>
<text x="6.00" y="47.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Donnée à l’air : q ÷ 3 600 × Δp = 3,94 W</text>
<text x="6.00" y="54.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Perdue en chaleur et en bruit : 11,80 W</text>
<text x="6.00" y="63.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Rendement global η = 0,25</text>
