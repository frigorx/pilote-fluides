<text x="6.00" y="90.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Air rejeté dehors,</text>
<text x="6.00" y="97.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">refroidi</text>
<text x="174.00" y="90.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">Air neuf réchauffé,</text>
<text x="174.00" y="97.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">vers les pièces</text>
<text x="6.00" y="107.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">Les deux flux se croisent sans se mélanger.</text>
<text x="6.00" y="114.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">η = 0,70 : il ne reste à chauffer que 1 − η = 0,30 de l’écart.</text>
<text x="6.00" y="121.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Φv = 0,34 × 75 × (1 − 0,70) × 26 = 199 W</text>
<text x="6.00" y="128.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">au lieu de 663 W sans échangeur.</text>
