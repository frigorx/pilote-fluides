<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 132" width="180mm" height="132mm" role="img">
<title>Chauffer l’air neuf : débit, coefficient 0,34 et écart de température donnent la puissance Φv</title>
<rect width="180" height="132" fill="#fff"/>
<g><text x="90" y="73" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 90 73)">inerWeb, by inerweb.fr</text><text x="40" y="40" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 40 40)">inerWeb, by inerweb.fr</text><text x="140" y="108" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 140 108)">inerWeb, by inerweb.fr</text></g>
<text x="6.00" y="13.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Dehors</text>
<text x="6.00" y="20.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">θe = −7 °C</text>
<text x="6.00" y="35.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">qv = 30 m³/h</text>
<line x1="6.00" y1="42.00" x2="68.00" y2="42.00" stroke="#3d7fca" stroke-width="0.8"/>
<line x1="68.00" y1="42.00" x2="65.72" y2="43.25" stroke="#3d7fca" stroke-width="0.8"/>
<line x1="68.00" y1="42.00" x2="65.72" y2="40.75" stroke="#3d7fca" stroke-width="0.8"/>
<text x="6.00" y="51.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">air neuf, froid</text>
<rect x="70.00" y="22.00" width="104.00" height="44.00" fill="#eef3f9" stroke="#1b3a63" stroke-width="0.6"/>
<text x="122.00" y="31.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">Pièce à θi = 19 °C</text>
<line x1="78.00" y1="42.00" x2="166.00" y2="42.00" stroke="#ff6b35" stroke-width="0.8"/>
<line x1="166.00" y1="42.00" x2="163.72" y2="43.25" stroke="#ff6b35" stroke-width="0.8"/>
<line x1="166.00" y1="42.00" x2="163.72" y2="40.75" stroke="#ff6b35" stroke-width="0.8"/>
<text x="122.00" y="51.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">l’air neuf s’y réchauffe</text>
<rect x="6.00" y="80.00" width="34.00" height="22.00" fill="#fff" stroke="#1b3a63" stroke-width="0.6"/>
<text x="23.00" y="89.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">qv</text>
<text x="23.00" y="97.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">30 m³/h</text>
<text x="44.67" y="93.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">×</text>
<rect x="49.33" y="80.00" width="38.00" height="22.00" fill="#fff" stroke="#1b3a63" stroke-width="0.6"/>
<text x="68.33" y="89.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">0,34</text>
<text x="68.33" y="97.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">Wh/(m³.K)</text>
<text x="92.00" y="93.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">×</text>
<rect x="96.67" y="80.00" width="34.00" height="22.00" fill="#fff" stroke="#1b3a63" stroke-width="0.6"/>
<text x="113.67" y="89.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">ΔT</text>
<text x="113.67" y="97.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">26 K</text>
<text x="135.33" y="93.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">=</text>
<rect x="140.00" y="80.00" width="34.00" height="22.00" fill="#fff" stroke="#ff6b35" stroke-width="0.9"/>
<text x="157.00" y="89.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">Φv</text>
<text x="157.00" y="97.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">265 W</text>
<text x="6.00" y="111.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">ΔT = θi − θe = 19 − (−7) = 26 K</text>
<text x="6.00" y="118.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Hv = 0,34 × 30 = 10,2 W/K ; Φv = 10,2 × 26 = 265 W</text>
<line x1="4.00" y1="121.50" x2="176.00" y2="121.50" stroke="#000" stroke-width="0.3"/>
<text x="6.00" y="128.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">inerWeb, Bureau d’études</text>
<text x="174.00" y="128.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">Schéma de principe</text>
</svg>
