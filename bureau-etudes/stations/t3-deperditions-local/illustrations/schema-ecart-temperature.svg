<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 132" width="180mm" height="132mm" role="img">
<title>Échelle des températures : θi = 19 °C dedans, θe = −7 °C dehors, ΔT = 26 K</title>
