<text x="61.00" y="29.70" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="end" fill="#1b3a63">Dedans, θi = 19 °C</text>
<text x="61.00" y="107.70" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="end" fill="#1b3a63">Dehors, θe = −7 °C</text>
