<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 138.8" width="180mm" height="138.8mm" role="img">
<title>Deux cohérences du bâtiment d’exemple</title>
<rect width="180" height="138.8" fill="#fff"/>
<g><text x="90" y="76" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 90 76)">inerWeb, by inerweb.fr</text><text x="40" y="42" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 40 42)">inerWeb, by inerweb.fr</text><text x="140" y="114" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 140 114)">inerWeb, by inerweb.fr</text></g>
<text x="4.00" y="9.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Deux lignes qui doivent se répondre</text>
<text x="6.00" y="20.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Hiver, à −7 °C dehors : stations T5 et T9</text>
<rect x="6.00" y="24.00" width="142.86" height="8.00" fill="#eef3f9" stroke="#1b3a63" stroke-width="0.3"/>
<text x="6.00" y="38.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Déperditions de base (T5) : 2996 W</text>
<rect x="6.00" y="42.00" width="125.41" height="8.00" fill="#eef3f9" stroke="#1b3a63" stroke-width="0.3"/>
<rect x="131.41" y="42.00" width="17.45" height="8.00" fill="#ff6b35" stroke="#ff6b35" stroke-width="0.3"/>
<text x="6.00" y="56.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Machine PAC 3,5 (T9) 2630 W + appoint 366 W (orange)</text>
<text x="6.00" y="66.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Eau : stations H1 et H4</text>
<rect x="6.00" y="70.00" width="141.43" height="8.00" fill="#eef3f9" stroke="#1b3a63" stroke-width="0.3"/>
<text x="6.00" y="84.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Débit du circuit (H1) : 297 L/h</text>
<rect x="6.00" y="88.00" width="142.86" height="8.00" fill="#eef3f9" stroke="#1b3a63" stroke-width="0.3"/>
<text x="6.00" y="102.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Point demandé à la pompe (H4) : 0,30 m³/h, soit 300 L/h</text>
<text x="6.00" y="114.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">La seconde barre de chaque groupe atteint la première : les</text>
<text x="6.00" y="121.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">lignes se répondent. Un écart se signale, toujours en le disant.</text>
<line x1="4.00" y1="128.30" x2="176.00" y2="128.30" stroke="#000" stroke-width="0.3"/>
<text x="6.00" y="134.80" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">inerWeb, Bureau d’études</text>
<text x="174.00" y="134.80" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">Bâtiment d’exemple</text>
</svg>
