<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 185.8" width="180mm" height="185.8mm" role="img">
<title>La page de synthèse, en tête de la note : ses blocs</title>
<rect width="180" height="185.8" fill="#fff"/>
<g><text x="90" y="102" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 90 102)">inerWeb, by inerweb.fr</text><text x="40" y="56" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 40 56)">inerWeb, by inerweb.fr</text><text x="140" y="152" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 140 152)">inerWeb, by inerweb.fr</text></g>
<text x="4.00" y="9.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Une page A4, six blocs, rien d’autre</text>
<rect x="20.00" y="18.00" width="140.00" height="135.00" fill="#fff" stroke="#1b3a63" stroke-width="0.6"/>
<text x="90.00" y="25.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#1b3a63">Synthèse de la note de calcul</text>
<rect x="24.00" y="28.00" width="132.00" height="18.50" fill="#eef3f9" stroke="#1b3a63" stroke-width="0.35"/>
<text x="28.00" y="35.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">Objet</text>
<text x="28.00" y="42.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">le projet, le bâtiment, la commande</text>
<rect x="24.00" y="48.50" width="132.00" height="18.50" fill="#ffe3d6" stroke="#ff6b35" stroke-width="0.35"/>
<text x="28.00" y="55.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">Choix retenus</text>
<text x="28.00" y="63.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">chaque choix et sa raison</text>
<rect x="24.00" y="69.00" width="132.00" height="18.50" fill="#eef3f9" stroke="#1b3a63" stroke-width="0.35"/>
<text x="28.00" y="76.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">Résultats clés</text>
<text x="28.00" y="83.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">une valeur par ligne, avec sa station</text>
<rect x="24.00" y="89.50" width="132.00" height="18.50" fill="#eef3f9" stroke="#1b3a63" stroke-width="0.35"/>
<text x="28.00" y="96.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">Cohérences vérifiées</text>
<text x="28.00" y="104.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">les lignes qui doivent se répondre</text>
<rect x="24.00" y="110.00" width="132.00" height="18.50" fill="#eef3f9" stroke="#1b3a63" stroke-width="0.35"/>
<text x="28.00" y="117.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">Données de l’exercice</text>
<text x="28.00" y="124.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">à faire valider</text>
<rect x="24.00" y="130.50" width="132.00" height="18.50" fill="#eef3f9" stroke="#1b3a63" stroke-width="0.35"/>
<text x="28.00" y="137.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">Relecture</text>
<text x="28.00" y="145.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">qui a relu, la date</text>
<text x="6.00" y="160.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Chaque choix renvoie à la section qui le calcule.</text>
<text x="6.00" y="167.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Les calculs restent dans leur section.</text>
<line x1="4.00" y1="175.30" x2="176.00" y2="175.30" stroke="#000" stroke-width="0.3"/>
<text x="6.00" y="181.80" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">inerWeb, Bureau d’études</text>
<text x="174.00" y="181.80" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">Gabarit vierge</text>
</svg>
