<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 92" width="180mm" height="92mm" role="img">
<title>Le volume minimal, l’eau déjà là et le ballon</title>
<rect width="180" height="92" fill="#fff"/>
<g><text x="90" y="51" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 90 51)">inerWeb, by inerweb.fr</text><text x="40" y="28" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 40 28)">inerWeb, by inerweb.fr</text><text x="140" y="75" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 140 75)">inerWeb, by inerweb.fr</text></g>
<text x="8.00" y="14.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Volume minimal d’eau en circulation</text>
<rect x="8.00" y="18.00" width="150.47" height="8.00" fill="#fff" stroke="#1b3a63" stroke-width="0.5" stroke-dasharray="1.4 0.8"/>
<text x="160.47" y="24.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">110,1 L</text>
<rect x="8.00" y="34.00" width="51.25" height="8.00" fill="#dfe7f1" stroke="#1b3a63" stroke-width="0.4"/>
<rect x="59.25" y="34.00" width="99.22" height="8.00" fill="#1b3a63" stroke="#1b3a63" stroke-width="0.4"/>
<text x="8.00" y="50.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#1b3a63">déjà là : 37,5 L</text>
<text x="158.47" y="50.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#1b3a63">à ajouter : 72,6 L</text>
<rect x="8.00" y="58.00" width="136.67" height="8.00" fill="#fff" stroke="#ff6b35" stroke-width="0.7"/>
<text x="146.67" y="64.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">100 L</text>
<text x="8.00" y="74.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Ballon de la série, au-dessus du volume à ajouter</text>
<line x1="4.00" y1="81.50" x2="176.00" y2="81.50" stroke="#000" stroke-width="0.3"/>
<text x="6.00" y="88.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">inerWeb, Bureau d’études</text>
<text x="174.00" y="88.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">Bâtiment d’exemple</text>
