<text x="60.00" y="85.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Sortie du stockage dès 400 L :</text>
<text x="60.00" y="92.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">55 °C au moins</text>
