<text x="56.00" y="77.70" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Eau froide du réseau</text>
<text x="56.00" y="47.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">ΔT = 28 K</text>
<text x="56.00" y="54.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">40 − 12</text>
