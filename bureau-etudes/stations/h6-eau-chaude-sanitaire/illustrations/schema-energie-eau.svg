<text x="147.00" y="75.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">E = 3 908 Wh</text>
<text x="147.00" y="82.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">soit 3,9 kWh</text>
<text x="90.00" y="100.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">Piège : oublier l’eau froide, c’est compter 40 K</text>
<text x="90.00" y="107.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">au lieu de 28 K, soit 43 % d’énergie en trop.</text>
