<text x="34.00" y="77.70" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">12 °C</text>
<line x1="50.00" y1="22.00" x2="50.00" y2="76.00" stroke="#ff6b35" stroke-width="1.4"/>
