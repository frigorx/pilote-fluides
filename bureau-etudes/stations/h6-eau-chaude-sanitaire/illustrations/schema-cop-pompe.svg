<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 148" width="180mm" height="148mm" role="img">
<title>La pompe à chaleur du chauffe-eau : l’air et l’électricité entrent, la puissance thermique sort, puis le temps de chauffe</title>
<rect width="180" height="148" fill="#fff"/>
<g><text x="90" y="81" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 90 81)">inerWeb, by inerweb.fr</text><text x="35" y="44" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 35 44)">inerWeb, by inerweb.fr</text><text x="150" y="118" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 150 118)">inerWeb, by inerweb.fr</text></g>
<text x="6.00" y="13.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Pompe à chaleur de l’exemple, COP 2,8</text>
<rect x="66.00" y="38.00" width="48.00" height="40.00" fill="#e3eefa"/>
<line x1="66.00" y1="38.00" x2="114.00" y2="38.00" stroke="#1b3a63" stroke-width="0.5"/>
<line x1="114.00" y1="38.00" x2="114.00" y2="78.00" stroke="#1b3a63" stroke-width="0.5"/>
<line x1="114.00" y1="78.00" x2="66.00" y2="78.00" stroke="#1b3a63" stroke-width="0.5"/>
<line x1="66.00" y1="78.00" x2="66.00" y2="38.00" stroke="#1b3a63" stroke-width="0.5"/>
<text x="90.00" y="51.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">Pompe à</text>
<text x="90.00" y="58.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">chaleur</text>
<text x="90.00" y="70.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">COP 2,8</text>
<text x="6.00" y="43.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Chaleur de l’air</text>
<line x1="8.00" y1="50.00" x2="66.00" y2="50.00" stroke="#1b3a63" stroke-width="0.8" stroke-dasharray="1.6 1.2"/>
<line x1="66.00" y1="50.00" x2="63.72" y2="51.25" stroke="#1b3a63" stroke-width="0.8"/>
<line x1="66.00" y1="50.00" x2="63.72" y2="48.75" stroke="#1b3a63" stroke-width="0.8"/>
<text x="6.00" y="65.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Électricité</text>
<text x="6.00" y="72.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">536 W</text>
<line x1="8.00" y1="77.00" x2="66.00" y2="77.00" stroke="#1b3a63" stroke-width="1"/>
<line x1="66.00" y1="77.00" x2="63.72" y2="78.25" stroke="#1b3a63" stroke-width="1"/>
<line x1="66.00" y1="77.00" x2="63.72" y2="75.75" stroke="#1b3a63" stroke-width="1"/>
<line x1="114.00" y1="58.00" x2="164.00" y2="58.00" stroke="#ff6b35" stroke-width="2.8"/>
<line x1="168.00" y1="58.00" x2="163.61" y2="60.40" stroke="#ff6b35" stroke-width="1.2"/>
<line x1="168.00" y1="58.00" x2="163.61" y2="55.60" stroke="#ff6b35" stroke-width="1.2"/>
<text x="141.00" y="41.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">Chaleur donnée</text>
<text x="141.00" y="48.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">à l’eau</text>
<text x="141.00" y="70.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">P thermique</text>
<text x="141.00" y="77.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">1 500 W</text>
<text x="90.00" y="96.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#1b3a63">P électrique = P thermique ÷ COP</text>
<text x="90.00" y="103.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">1 500 ÷ 2,8 = 536 W</text>
<line x1="10.00" y1="110.00" x2="170.00" y2="110.00" stroke="#1b3a63" stroke-width="0.3"/>
<text x="90.00" y="119.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">Ballon de 100 L : E = 5 582 Wh</text>
<text x="90.00" y="126.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">t = 5 582 ÷ 1 500 = 3,72 h, soit 3 h 43 min</text>
<line x1="4.00" y1="137.50" x2="176.00" y2="137.50" stroke="#1b3a63" stroke-width="0.3"/>
<text x="6.00" y="144.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">inerWeb, Bureau d’études</text>
<text x="174.00" y="144.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">Schéma de principe</text>
</svg>
