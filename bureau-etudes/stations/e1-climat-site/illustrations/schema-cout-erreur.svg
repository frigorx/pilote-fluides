<line x1="6.00" y1="70.00" x2="6.00" y2="58.00" stroke="#1b3a63" stroke-width="0.5"/>
<rect x="111.60" y="58.00" width="13.20" height="12.00" fill="#ffe1d4"/>
<line x1="111.60" y1="58.00" x2="124.80" y2="58.00" stroke="#ff6b35" stroke-width="1"/>
<line x1="124.80" y1="58.00" x2="124.80" y2="70.00" stroke="#ff6b35" stroke-width="1"/>
<line x1="124.80" y1="70.00" x2="111.60" y2="70.00" stroke="#ff6b35" stroke-width="1"/>
<line x1="111.60" y1="70.00" x2="111.60" y2="58.00" stroke="#ff6b35" stroke-width="1"/>
<text x="9.00" y="66.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">ΔT = 27 K</text>
<line x1="111.60" y1="41.00" x2="111.60" y2="58.00" stroke="#1b3a63" stroke-width="0.4" stroke-dasharray="1.4 1"/>
<text x="127.80" y="66.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">+ 3 K</text>
<text x="6.00" y="82.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Φ = H × ΔT : avec le même H,</text>
<text x="6.00" y="89.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">la puissance grandit de 12,5 %.</text>
