<text x="115.00" y="42.20" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#ff6b35">10 DJU</text>
<text x="6.00" y="98.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Un jour : 18 − 8 = 10 DJU.</text>
<text x="6.00" y="105.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Chaleur du jour : H × 10 × 24 = 115,23 × 240 = 27655 Wh.</text>
<text x="6.00" y="112.80" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">L’année : H × DJU × 24 ÷ 1000, en kWh, puis × c.</text>
<line x1="4.00" y1="123.70" x2="176.00" y2="123.70" stroke="#000" stroke-width="0.3"/>
<text x="6.00" y="130.20" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">inerWeb, Bureau d’études</text>
<text x="174.00" y="130.20" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">Schéma de principe</text>
