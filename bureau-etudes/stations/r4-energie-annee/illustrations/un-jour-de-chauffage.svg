<text x="24.50" y="70.20" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">5</text>
<line x1="26" y1="51.00" x2="112" y2="51.00" stroke="#c8ccd2" stroke-width="0.25"/>
<text x="24.50" y="52.70" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">10</text>
<line x1="26" y1="33.50" x2="112" y2="33.50" stroke="#c8ccd2" stroke-width="0.25"/>
<text x="24.50" y="35.20" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">15</text>
<line x1="26" y1="16.00" x2="112" y2="16.00" stroke="#c8ccd2" stroke-width="0.25"/>
<text x="24.50" y="17.70" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">20</text>
<line x1="26.00" y1="16.00" x2="26.00" y2="86.00" stroke="#000" stroke-width="0.5"/>
<text x="4.00" y="11.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Température (°C)</text>
<line x1="26.00" y1="23.00" x2="112.00" y2="23.00" stroke="#1b3a63" stroke-width="0.8" stroke-dasharray="3 1.6"/>
<text x="115.00" y="24.70" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Base : 18 °C</text>
<line x1="26.00" y1="58.00" x2="112.00" y2="58.00" stroke="#1b3a63" stroke-width="0.9"/>
<text x="115.00" y="59.70" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Moyenne du jour : 8 °C</text>
<rect x="56" y="23.00" width="22" height="35.00" fill="#ffe3d6"/>
<line x1="67.00" y1="57.20" x2="67.00" y2="23.80" stroke="#ff6b35" stroke-width="0.8"/>
<line x1="67.00" y1="23.80" x2="68.15" y2="25.91" stroke="#ff6b35" stroke-width="0.8"/>
