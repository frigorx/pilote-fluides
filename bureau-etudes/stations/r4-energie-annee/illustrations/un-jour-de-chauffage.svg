<line x1="67.00" y1="23.80" x2="67.00" y2="57.20" stroke="#ff6b35" stroke-width="0.8"/>
<line x1="67.00" y1="57.20" x2="65.85" y2="55.09" stroke="#ff6b35" stroke-width="0.8"/>
