<text x="77.00" y="64.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">38 − 26 = 12 K</text>
<text x="148.00" y="58.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">Local technique</text>
<text x="148.00" y="65.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">non chauffé</text>
<line x1="140.00" y1="85.00" x2="100.00" y2="85.00" stroke="#c9451a" stroke-width="0.8"/>
