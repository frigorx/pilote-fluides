<text x="6.00" y="95.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Mur ouest de l’exemple à 16 h : 6 + 30,7 = 36,7 K ; Φ = U × A × 36,7</text>
