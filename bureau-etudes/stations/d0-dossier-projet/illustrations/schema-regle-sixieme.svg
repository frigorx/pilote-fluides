<text x="23.33" y="31.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">10,00 m²</text>
<text x="10.00" y="48.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">un sixième : 60,00 ÷ 6 = 10,00 m²</text>
<text x="10.00" y="60.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Baies vitrées : 9,50 m²</text>
