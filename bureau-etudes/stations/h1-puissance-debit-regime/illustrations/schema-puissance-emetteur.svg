<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 100" width="180mm" height="100mm" role="img">
<title>La puissance de chaque émetteur : Φ du local plus relance</title>
<rect width="180" height="100" fill="#fff"/>
<g><text x="90" y="55" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 90 55)">inerWeb, by inerweb.fr</text><text x="40" y="30" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 40 30)">inerWeb, by inerweb.fr</text><text x="140" y="82" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 140 82)">inerWeb, by inerweb.fr</text></g>
<text x="6.00" y="10.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Puissance de l’émetteur = Φ du local + relance</text>
<line x1="50.00" y1="14.00" x2="50.00" y2="56.00" stroke="#000" stroke-width="0.4"/>
<text x="6.00" y="24.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Bureau</text>
<rect x="50.40" y="17.00" width="38.80" height="9.00" fill="#cfe0f3" stroke="#1b3a63" stroke-width="0.3"/>
<rect x="89.20" y="17.00" width="5.83" height="9.00" fill="#ff6b35" stroke="#1b3a63" stroke-width="0.3"/>
<text x="98.03" y="24.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">1179 + 177 = 1356 W</text>
<text x="6.00" y="38.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Salle de réunion</text>
<rect x="50.40" y="31.00" width="52.17" height="9.00" fill="#cfe0f3" stroke="#1b3a63" stroke-width="0.3"/>
<rect x="102.57" y="31.00" width="7.83" height="9.00" fill="#ff6b35" stroke="#1b3a63" stroke-width="0.3"/>
<text x="113.40" y="38.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">1585 + 238 = 1823 W</text>
<text x="6.00" y="52.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Sanitaires</text>
<rect x="50.40" y="45.00" width="7.67" height="9.00" fill="#cfe0f3" stroke="#1b3a63" stroke-width="0.3"/>
<rect x="58.07" y="45.00" width="1.15" height="9.00" fill="#ff6b35" stroke="#1b3a63" stroke-width="0.3"/>
<text x="62.22" y="52.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">233 + 35 = 268 W</text>
<rect x="6.00" y="63.00" width="5.00" height="5.00" fill="#cfe0f3" stroke="#1b3a63" stroke-width="0.3"/>
<text x="14.00" y="67.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Φ du local (station T5)</text>
<rect x="6.00" y="71.00" width="5.00" height="5.00" fill="#ff6b35" stroke="#1b3a63" stroke-width="0.3"/>
<text x="14.00" y="75.50" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Relance, 15 % du Φ du local</text>
<text x="6.00" y="84.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Somme des émetteurs : 3447 W</text>
<line x1="4.00" y1="89.50" x2="176.00" y2="89.50" stroke="#000" stroke-width="0.3"/>
<text x="6.00" y="96.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">inerWeb, Bureau d’études</text>
<text x="174.00" y="96.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="end" fill="#000">Schéma de principe</text>
