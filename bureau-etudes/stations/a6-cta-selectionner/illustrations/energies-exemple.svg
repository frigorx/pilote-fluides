<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 75.00" width="180mm" height="75.00mm" role="img">
<title>Salle de réunion seule : énergie de l’année</title>
<rect width="180" height="75.00" fill="#fff"/>
<g><text x="90" y="41" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 90 41)">inerWeb, by inerweb.fr</text><text x="40" y="23" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 40 23)">inerWeb, by inerweb.fr</text><text x="140" y="61" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 140 61)">inerWeb, by inerweb.fr</text></g>
<text x="2.00" y="7.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#1b3a63">Salle de réunion seule, 240 m³/h : énergie de l’année</text>
<text x="2.00" y="20.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Sans récupérateur</text>
<rect x="64.00" y="14.00" width="76.00" height="9.00" fill="#dfe5ec" stroke="#8a96a6" stroke-width="0.25"/>
<text x="142.50" y="20.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">1 609 kWh</text>
<text x="2.00" y="35.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Plaques, η = 0,60</text>
<rect x="64.00" y="29.00" width="76.00" height="9.00" fill="#dfe5ec" stroke="#8a96a6" stroke-width="0.25"/>
<rect x="64.00" y="29.00" width="45.60" height="9.00" fill="#1b3a63" stroke="#1b3a63" stroke-width="0.25"/>
<text x="142.50" y="35.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">965 kWh</text>
<text x="2.00" y="50.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Roue, η = 0,75</text>
<rect x="64.00" y="44.00" width="76.00" height="9.00" fill="#dfe5ec" stroke="#8a96a6" stroke-width="0.25"/>
<rect x="64.00" y="44.00" width="57.00" height="9.00" fill="#1b3a63" stroke="#1b3a63" stroke-width="0.25"/>
<text x="142.50" y="50.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="start" fill="#000">1 207 kWh</text>
<rect x="3.00" y="59.00" width="9.00" height="4.60" fill="#1b3a63" stroke="#1b3a63" stroke-width="0.2"/>
<text x="15.00" y="63.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Énergie récupérée sur l’année</text>
<rect x="3.00" y="66.00" width="9.00" height="4.60" fill="#dfe5ec" stroke="#8a96a6" stroke-width="0.2"/>
<text x="15.00" y="70.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="start" fill="#000">Ce que la batterie chaude fournit encore</text>
</svg>
