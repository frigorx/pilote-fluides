<text x="90.00" y="49.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">L’air traverse</text>
<text x="90.00" y="56.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">le logement</text>
<line x1="69.00" y1="62.00" x2="111.00" y2="62.00" stroke="#ff6b35" stroke-width="0.7"/>
<polygon points="111.00,62.00 108.61,63.01 108.61,60.99" fill="#ff6b35"/>
<text x="90.00" y="74.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">entre = sort</text>
<text x="90.00" y="118.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">Chaque entrée d’air reçoit sa part, au prorata du volume.</text>
<text x="90.00" y="126.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">Ce qui entre égale ce qui sort.</text>
