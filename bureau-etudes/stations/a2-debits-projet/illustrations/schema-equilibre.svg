<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 132.00" width="180mm" height="132.00mm" role="img">
<title>L’équilibre du logement d’exemple en débit de base : deux colonnes de même hauteur, les trois entrées d’air du séjour et des deux chambres à gauche, les trois bouches d’extraction de la cuisine, de la salle de bains et du WC à droite, 75 m³/h de chaque côté</title>
<rect width="180" height="132.00" fill="#fff"/>
<g><text x="90" y="73" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 90 73)">inerWeb, by inerweb.fr</text><text x="40" y="40" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 40 40)">inerWeb, by inerweb.fr</text><text x="140" y="108" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#1b3a63" fill-opacity="0.07" transform="rotate(-18 140 108)">inerWeb, by inerweb.fr</text></g>
<text x="37.00" y="17.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#1b3a63">Entrées d’air</text>
