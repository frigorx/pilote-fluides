<text x="37.00" y="75.55" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">Chambre 1, 18,1</text>
<rect x="8.00" y="82.70" width="58.00" height="16.30" fill="#e3eefa" stroke="#1b3a63" stroke-width="0.4"/>
<text x="37.00" y="92.75" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">Chambre 2, 16,3</text>
<text x="37.00" y="107.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#000">75 m³/h</text>
<text x="143.00" y="17.00" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" font-weight="bold" text-anchor="middle" fill="#1b3a63">Extractions</text>
<rect x="114.00" y="24.00" width="58.00" height="45.00" fill="#eeeeee" stroke="#1b3a63" stroke-width="0.4"/>
<text x="143.00" y="48.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">Cuisine, 45</text>
<rect x="114.00" y="69.00" width="58.00" height="15.00" fill="#eeeeee" stroke="#1b3a63" stroke-width="0.4"/>
<text x="143.00" y="78.40" font-family="Trebuchet MS, Arial, sans-serif" font-size="4.94" text-anchor="middle" fill="#000">WC, 15</text>
<rect x="114.00" y="84.00" width="58.00" height="15.00" fill="#eeeeee" stroke="#1b3a63" stroke-width="0.4"/>
