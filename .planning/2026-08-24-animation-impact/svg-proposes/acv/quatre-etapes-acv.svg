<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img"
     aria-labelledby="t-qe" aria-describedby="d-qe" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-qe">Les quatre étapes d'une analyse de cycle de vie</title>
  <desc id="d-qe">Quatre blocs alignés, reliés par des flèches dans l'ordre : fabriquer, transporter,
    exploiter, démolir. Le bloc « exploiter » est le plus large des quatre, pour rappeler que
    c'est en général l'étape la plus longue pour un équipement fixe. Une bande en bas indique que
    ces quatre étapes ensemble forment l'analyse de cycle de vie, ou ACV. L'animation construit
    la chaîne bloc par bloc et élargit le bloc exploiter ; l'image fixe montre la chaîne complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fffdf8; }
    .num { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:15px; fill:#fffdf8; }
    .band{ font-size:15px; fill:#10233c; }
  </style>

  <text class="ttl" x="450" y="26" text-anchor="middle">Le cycle de vie complet, en quatre étapes</text>

  <g>
    <rect x="20" y="70" width="150" height="90" rx="12" fill="#1b3a63"/>
    <text class="num" x="95" y="94" text-anchor="middle">1</text>
    <text class="qui" x="95" y="128" text-anchor="middle">Fabriquer</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.10;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <g>
    <path d="M172,115 h48" stroke="#5a6b7d" stroke-width="3" marker-end="url(#fa)"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.15;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <g>
    <rect x="222" y="70" width="150" height="90" rx="12" fill="#1b3a63"/>
    <text class="num" x="297" y="94" text-anchor="middle">2</text>
    <text class="qui" x="297" y="128" text-anchor="middle">Transporter</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.17;0.22;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <g>
    <path d="M374,115 h48" stroke="#5a6b7d" stroke-width="3" marker-end="url(#fa)"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.27;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- Exploiter : apparaît à la taille des autres, puis s'élargit -->
  <g>
    <rect x="424" y="60" width="230" height="110" rx="12" fill="#047857">
      <animate attributeName="x" values="464;464;464;424;424" keyTimes="0;0.29;0.35;0.45;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="width" values="150;150;150;230;230" keyTimes="0;0.29;0.35;0.45;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="y" values="70;70;70;60;60" keyTimes="0;0.29;0.35;0.45;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="height" values="90;90;90;110;110" keyTimes="0;0.29;0.35;0.45;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text class="num" x="539" y="86" text-anchor="middle">3</text>
    <text class="qui" x="539" y="120" text-anchor="middle">Exploiter</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.29;0.33;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <text class="num" x="539" y="144" text-anchor="middle" font-weight="normal" font-size="15">la plus longue étape</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.50;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <g>
    <path d="M656,115 h48" stroke="#5a6b7d" stroke-width="3" marker-end="url(#fa)"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.55;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <g>
    <rect x="706" y="70" width="150" height="90" rx="12" fill="#1b3a63"/>
    <text class="num" x="781" y="94" text-anchor="middle">4</text>
    <text class="qui" x="781" y="128" text-anchor="middle">Démolir</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.57;0.62;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <defs>
    <marker id="fa" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5a6b7d"/>
    </marker>
  </defs>

  <rect x="20" y="206" width="860" height="42" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <g>
    <text class="band" x="450" y="232" text-anchor="middle" font-weight="bold">Ensemble, ces quatre étapes forment l'analyse de cycle de vie (ACV)</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.72;1" dur="14s" repeatCount="indefinite"/>
  </g>
</svg>
