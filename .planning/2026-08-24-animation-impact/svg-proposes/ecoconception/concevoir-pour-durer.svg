<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
     aria-labelledby="t-durer" aria-describedby="d-durer" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-durer">Concevoir pour durer : trois choix qui allongent la vie de l'appareil</title>
  <desc id="d-durer">Trois cartes en haut : matériaux robustes, pièces standard plutôt que
    propriétaires, conception qui vieillit bien. Trois flèches descendent de ces cartes vers un
    encadré central « L'appareil ». Une flèche part de cet encadré vers un titre « Durée de vie
    en service ». En dessous, deux barres horizontales comparent la durée : une barre verte
    longue « Avec ces choix » se termine par le mot « dure longtemps » ; une barre grise plus
    courte, en tirets, « Sans ces choix », se termine par une petite croix rouge et le mot
    « s'arrête plus tôt ». L'animation fait progresser les deux barres ensemble : la grise
    s'arrête tôt sur la croix, la verte continue ; l'image fixe montre le résultat complet.</desc>
  <defs>
    <marker id="fl-durer" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <style>
    .hd  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#fffdf8; }
    .ti  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lb  { font-size:16px; fill:#10233c; }
    .lb2 { font-size:15px; fill:#5a6b7d; }
    .app { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#1b3a63; }
    .good{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#047857; }
    .bad { font-size:15px; fill:#5a6b7d; }
  </style>

  <!-- trois cartes -->
  <g>
    <rect x="20" y="20" width="260" height="70" rx="12" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
    <text class="hd" fill="#10233c" x="150" y="50" text-anchor="middle">MATÉRIAUX</text>
    <text class="hd" fill="#10233c" x="150" y="72" text-anchor="middle">ROBUSTES</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.09;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="320" y="20" width="260" height="70" rx="12" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
    <text class="hd" fill="#10233c" x="450" y="44" text-anchor="middle">PIÈCES STANDARD</text>
    <text class="hd" fill="#10233c" x="450" y="65" text-anchor="middle" font-size="14px">(pas propriétaires)</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.10;0.15;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="620" y="20" width="260" height="70" rx="12" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
    <text class="hd" fill="#10233c" x="750" y="50" text-anchor="middle">CONCEPTION QUI</text>
    <text class="hd" fill="#10233c" x="750" y="72" text-anchor="middle">VIEILLIT BIEN</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.21;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- flèches vers l'appareil -->
  <g>
    <line x1="150" y1="90" x2="385" y2="138" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#fl-durer)"/>
    <line x1="450" y1="90" x2="450" y2="138" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#fl-durer)"/>
    <line x1="750" y1="90" x2="515" y2="138" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#fl-durer)"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.28;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- l'appareil -->
  <g>
    <rect x="350" y="140" width="200" height="86" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <text class="app" x="450" y="188" text-anchor="middle">L'APPAREIL</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.29;0.35;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <g>
    <line x1="450" y1="226" x2="450" y2="256" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#fl-durer)"/>
    <text class="ti" x="450" y="278" text-anchor="middle">Durée de vie en service</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.36;0.41;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- barre "avec ces choix" : progresse jusqu'au bout -->
  <g>
    <text class="lb" x="30" y="309" text-anchor="start">Avec ces choix</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.46;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <rect x="250" y="296" width="430" height="18" rx="8" fill="#047857">
    <animate attributeName="width" values="0;0;430;430" keyTimes="0;0.44;0.62;1" dur="14s" repeatCount="indefinite"/>
  </rect>
  <g>
    <text class="good" x="696" y="309" text-anchor="start">dure longtemps</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.68;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- barre "sans ces choix" : progresse au même rythme et s'arrête tôt -->
  <g>
    <text class="lb" x="30" y="343" text-anchor="start">Sans ces choix</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.46;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <rect x="250" y="330" width="220" height="18" rx="8" fill="none" stroke="#5a6b7d" stroke-width="2.5" stroke-dasharray="7 6">
    <animate attributeName="width" values="1;1;220;220" keyTimes="0;0.44;0.53;1" dur="14s" repeatCount="indefinite"/>
  </rect>
  <g>
    <line x1="486" y1="332" x2="498" y2="346" stroke="#c0392b" stroke-width="3"/>
    <line x1="498" y1="332" x2="486" y2="346" stroke="#c0392b" stroke-width="3"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.54;0.58;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <text class="bad" x="510" y="343" text-anchor="start">s'arrête plus tôt</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.60;1" dur="14s" repeatCount="indefinite"/>
  </g>
</svg>
