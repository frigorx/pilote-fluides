<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
     aria-labelledby="t-tewi" aria-describedby="d-tewi" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-tewi">Le lien avec le TEWI : la part indirecte varie avec la classe énergie</title>
  <desc id="d-tewi">À gauche, l'icône d'une PAC ou d'un groupe de condensation, avec une flèche
    vers deux barres empilées. Chaque barre a une base grise identique, « part directe, la fuite
    de fluide », qui reste comparable. Au-dessus, une portion colorée, « part indirecte, la
    consommation électrique » : plus petite et verte pour l'appareil mieux classé, plus grande et
    ambrée pour l'appareil moins bien classé. Aucun chiffre n'est indiqué : seule la hauteur
    relative des barres porte la comparaison, doublée par les mots « plus faible » et « plus
    élevée ». L'animation pose d'abord les deux bases grises identiques, puis fait grandir les
    deux parts indirectes à des hauteurs différentes ; l'image fixe montre le résultat complet.</desc>
  <defs>
    <marker id="fl-tewi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <style>
    .ti  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .lb  { font-size:15px; fill:#10233c; }
    .lb2 { font-size:14px; fill:#5a6b7d; }
    .good{ font-weight:bold; fill:#047857; font-size:15px; }
    .warn{ font-weight:bold; fill:#b06a00; font-size:15px; }
  </style>

  <!-- icône PAC / groupe de condensation -->
  <g>
    <rect x="30" y="190" width="180" height="90" rx="6" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="120" cy="165" r="30" fill="none" stroke="#1b3a63" stroke-width="3"/>
    <line x1="120" y1="140" x2="120" y2="190" stroke="#1b3a63" stroke-width="3"/>
    <line x1="95"  y1="152" x2="145" y2="178" stroke="#1b3a63" stroke-width="3"/>
    <line x1="145" y1="152" x2="95"  y2="178" stroke="#1b3a63" stroke-width="3"/>
    <text class="lb" x="120" y="300" text-anchor="middle">PAC / groupe de</text>
    <text class="lb" x="120" y="318" text-anchor="middle">condensation</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.11;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <g>
    <line x1="215" y1="235" x2="330" y2="235" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#fl-tewi)"/>
    <text class="lb2" x="272" y="220" text-anchor="middle">consommation</text>
    <text class="lb2" x="272" y="255" text-anchor="middle">électrique sur sa vie</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.13;0.19;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- bases grises identiques : la part directe reste comparable -->
  <rect x="420" y="280" width="120" height="60" fill="#5a6b7d">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.21;0.27;1" dur="14s" repeatCount="indefinite"/>
  </rect>
  <rect x="640" y="280" width="120" height="60" fill="#5a6b7d">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.21;0.27;1" dur="14s" repeatCount="indefinite"/>
  </rect>
  <g>
    <rect x="448" y="300" width="264" height="40" rx="8" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/>
    <text class="lb2" x="580" y="317" text-anchor="middle" fill="#10233c">part directe (fuite de fluide)</text>
    <text class="lb2" x="580" y="334" text-anchor="middle" fill="#10233c">— reste comparable —</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.33;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- part indirecte verte : grandit un peu -->
  <rect x="420" y="230" width="120" height="50" fill="#047857">
    <animate attributeName="y" values="280;280;230;230" keyTimes="0;0.36;0.44;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="height" values="0;0;50;50" keyTimes="0;0.36;0.44;1" dur="14s" repeatCount="indefinite"/>
  </rect>
  <g>
    <text class="ti" x="480" y="362" text-anchor="middle" font-size="15px">Mieux classé</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.21;0.27;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- part indirecte ambrée : grandit beaucoup -->
  <rect x="640" y="150" width="120" height="130" fill="#b06a00">
    <animate attributeName="y" values="280;280;150;150" keyTimes="0;0.46;0.58;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="height" values="0;0;130;130" keyTimes="0;0.46;0.58;1" dur="14s" repeatCount="indefinite"/>
  </rect>
  <g>
    <text class="ti" x="700" y="362" text-anchor="middle" font-size="15px">Moins bien classé</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.21;0.27;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <g>
    <text class="lb2" x="480" y="30" text-anchor="middle">Part indirecte</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.36;0.42;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <text class="good" x="480" y="210" text-anchor="middle">plus faible</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.50;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <text class="warn" x="700" y="130" text-anchor="middle">plus élevée</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.64;1" dur="14s" repeatCount="indefinite"/>
  </g>
</svg>
