<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"
     aria-labelledby="t-re" aria-describedby="d-re" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-re">Repère à deux axes : où se situent plusieurs fluides</title>
  <desc id="d-re">Un repère avec en abscisse l'ODP (nul à gauche, non nul à droite) et en ordonnée
    le PRP (faible en bas, très élevé en haut). Tous les points placés dans la colonne ODP nul
    sont des HFC ou des fluides naturels : l'ammoniac R-717 en bas avec un PRP de 0, le CO2 R-744
    juste au-dessus avec un PRP de 1, le propane R-290 avec un PRP de 3, puis en montant le R-32
    à 675, le R-410A à 2088 et le R-404A à 3922, le plus haut du repère. Une zone à droite,
    hachurée et sans point chiffré, représente les CFC et HCFC : leur ODP est non nul, sans
    valeur donnée ici. La légende rappelle que la position sur l'axe horizontal ne dit rien de
    la position sur l'axe vertical. L'animation fait apparaître les six fluides l'un après
    l'autre, du PRP le plus bas au plus élevé ; l'image fixe les montre déjà tous.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .ax  { font-size:15px; fill:#5a6b7d; }
    .lbl { font-size:15px; fill:#10233c; font-weight:bold; }
    .band{ font-size:15px; fill:#10233c; }
  </style>

  <defs>
    <pattern id="hach" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#fdf1ef"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#e8b8b0" stroke-width="3"/>
    </pattern>
    <marker id="axf" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10233c"/>
    </marker>
  </defs>

  <text class="ttl" x="450" y="26" text-anchor="middle">Chaque fluide a sa place sur les deux échelles</text>

  <!-- zone CFC/HCFC : ODP non nul (hachurée : couleur + trame, jamais la couleur seule) -->
  <rect x="620" y="60" width="200" height="300" fill="url(#hach)" stroke="#e8b8b0" stroke-width="1.5"/>
  <text class="lbl" x="720" y="90" text-anchor="middle" fill="#c0392b" font-size="15px">CFC / HCFC</text>
  <text class="ax" x="720" y="108" text-anchor="middle">ODP non nul (sans valeur ici)</text>

  <!-- axes -->
  <line x1="140" y1="360" x2="830" y2="360" stroke="#10233c" stroke-width="2.5" marker-end="url(#axf)"/>
  <line x1="140" y1="360" x2="140" y2="52" stroke="#10233c" stroke-width="2.5" marker-end="url(#axf)"/>
  <text class="ax" x="480" y="386" text-anchor="middle">ODP — nul à gauche · non nul à droite →</text>
  <text class="ax" x="70" y="210" text-anchor="middle" transform="rotate(-90 70 210)">PRP — faible en bas · très élevé en haut</text>

  <!-- points, colonne ODP nul — apparition séquentielle du plus bas au plus haut -->
  <g>
    <circle cx="200" cy="350" r="8" fill="#047857" stroke="#fffdf8" stroke-width="2"/>
    <text class="lbl" x="240" y="354" font-size="15px">R-717 ammoniac · PRP 0</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.10;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="200" cy="335" r="8" fill="#047857" stroke="#fffdf8" stroke-width="2"/>
    <text class="lbl" x="240" y="332" font-size="15px">R-744 CO₂ · PRP 1</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.18;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="200" cy="322" r="8" fill="#047857" stroke="#fffdf8" stroke-width="2"/>
    <text class="lbl" x="240" y="316" font-size="15px">R-290 propane · PRP 3</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.26;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="200" cy="230" r="8" fill="#1b3a63" stroke="#fffdf8" stroke-width="2"/>
    <text class="lbl" x="240" y="234" font-size="15px">R-32 · PRP 675</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.36;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="200" cy="150" r="8" fill="#b06a00" stroke="#fffdf8" stroke-width="2"/>
    <text class="lbl" x="240" y="154" font-size="15px">R-410A · PRP 2088</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.46;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="200" cy="80" r="8" fill="#c0392b" stroke="#fffdf8" stroke-width="2"/>
    <text class="lbl" x="240" y="84" font-size="15px">R-404A · PRP 3922</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.56;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <g>
    <text class="band" x="480" y="410" text-anchor="middle">La colonne de gauche (ODP nul) contient les PRP les plus élevés comme les plus bas.</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.60;0.65;1" dur="14s" repeatCount="indefinite"/>
  </g>
</svg>
