<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"
     aria-labelledby="t-cf" aria-describedby="d-cf" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-cf">Cas métier : une chambre froide qui fuit, au R-404A puis au CO2</title>
  <desc id="d-cf">Deux chambres froides identiques. Chacune perd une goutte de fluide de taille
    identique, représentant la même masse perdue. À gauche, la chambre au R-404A : la goutte est
    reliée à un grand nuage rouge marqué « impact ×3922 par rapport au CO2 ». À droite, la
    chambre au CO2 : la goutte, de même taille, est reliée à un petit nuage vert marqué « ×1,
    la référence ». En bas, une bande résume : même masse perdue, impact climatique très
    différent — c'est le PRP qui fait la différence, pas la quantité. L'animation fait partir
    les deux nuages à la même taille, puis le nuage du R-404A gonfle 3922 fois plus ; l'image
    fixe montre déjà le résultat final.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .lbl { font-size:16px; fill:#10233c; }
    .cap { font-size:15px; fill:#5a6b7d; }
    .val { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; }
  </style>

  <defs>
    <path id="nuage" d="M -95 20 C -95 -8 -70 -22 -50 -16 C -46 -44 -12 -54 8 -38 C 24 -56 62 -48 66 -24 C 92 -22 100 6 82 20 C 88 40 64 52 46 44 C 30 58 -10 58 -24 46 C -48 58 -78 48 -80 30 C -92 30 -95 26 -95 20 Z"/>
    <marker id="fr1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/>
    </marker>
    <marker id="fv1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#047857"/>
    </marker>
  </defs>

  <!-- séparation (dessinée sous les nuages : le grand nuage a le droit de déborder) -->
  <line x1="450" y1="60" x2="450" y2="300" stroke="#d6dee7" stroke-width="2"/>

  <!-- chambre R-404A -->
  <rect x="40" y="60" width="140" height="170" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <rect x="55" y="75" width="110" height="120" rx="6" fill="#eef3f9" stroke="#2f5689" stroke-width="1.5"/>
  <circle cx="150" cy="130" r="6" fill="#1b3a63"/>
  <text class="ttl" x="110" y="252" text-anchor="middle">Chambre froide</text>
  <text class="lbl" x="110" y="272" text-anchor="middle">R-404A (PRP 3922)</text>

  <!-- goutte identique gauche -->
  <path d="M240,150 q14,20 0,36 q-14,-16 0,-36 Z" fill="#fffdf8" stroke="#5a6b7d" stroke-width="2.5"/>
  <text class="cap" x="240" y="204" text-anchor="middle">fuite : même masse</text>
  <g>
    <line x1="268" y1="166" x2="330" y2="136" stroke="#c0392b" stroke-width="2.5" marker-end="url(#fr1)"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.27;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <!-- goutte mobile gauche (décor animé : invisible à l'arrêt) -->
  <circle r="6" fill="#5a6b7d" opacity="0">
    <animateMotion path="M150,130 C176,118 214,124 238,150" keyPoints="0;0;1;1" keyTimes="0;0.08;0.19;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.10;0.17;0.20;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- grand nuage rouge : part de la taille du nuage vert, puis gonfle ×3922 -->
  <g transform="translate(415,116)">
    <g>
      <use href="#nuage" fill="#fbe7e4" stroke="#c0392b" stroke-width="3" vector-effect="non-scaling-stroke"/>
      <animateTransform attributeName="transform" type="scale" additive="replace"
        values="0.36;0.36;0.36;1;1" keyTimes="0;0.28;0.34;0.58;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.30;1" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>
  <g>
    <text class="val" x="415" y="112" text-anchor="middle" fill="#c0392b">impact ×3922</text>
    <text class="cap" x="415" y="135" text-anchor="middle">par rapport au CO₂</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.65;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- chambre CO2 -->
  <rect x="720" y="60" width="140" height="170" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <rect x="735" y="75" width="110" height="120" rx="6" fill="#eef3f9" stroke="#2f5689" stroke-width="1.5"/>
  <circle cx="830" cy="130" r="6" fill="#1b3a63"/>
  <text class="ttl" x="790" y="252" text-anchor="middle">Chambre froide</text>
  <text class="lbl" x="790" y="272" text-anchor="middle">CO₂ (PRP 1)</text>

  <!-- goutte identique droite -->
  <path d="M660,150 q14,20 0,36 q-14,-16 0,-36 Z" fill="#fffdf8" stroke="#5a6b7d" stroke-width="2.5"/>
  <text class="cap" x="660" y="204" text-anchor="middle">fuite : même masse</text>
  <g>
    <line x1="632" y1="166" x2="576" y2="148" stroke="#047857" stroke-width="2.5" marker-end="url(#fv1)"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.27;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <!-- goutte mobile droite (décor animé : invisible à l'arrêt) -->
  <circle r="6" fill="#5a6b7d" opacity="0">
    <animateMotion path="M830,130 C804,118 690,126 662,150" keyPoints="0;0;1;1" keyTimes="0;0.08;0.19;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.10;0.17;0.20;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- petit nuage vert : la référence, il ne bouge pas -->
  <g transform="translate(530,142)">
    <g>
      <use href="#nuage" fill="#e6f2f0" stroke="#047857" stroke-width="3" vector-effect="non-scaling-stroke" transform="scale(0.36)"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.30;1" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>
  <g>
    <text class="cap" x="530" y="147" text-anchor="middle" fill="#047857" font-weight="bold">×1</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.36;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <rect x="40" y="310" width="820" height="60" rx="12" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="lbl" x="450" y="336" text-anchor="middle">Même masse perdue, impact climatique très différent :</text>
  <text class="lbl" x="450" y="358" text-anchor="middle">c'est le PRP qui fait la différence, pas la quantité.</text>
</svg>
