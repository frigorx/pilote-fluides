<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"
     aria-labelledby="t-mp" aria-describedby="d-mp" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-mp">Le mécanisme du PRP : une molécule retient plus ou moins la chaleur</title>
  <desc id="d-mp">Le soleil en haut envoie des rayons qui traversent l'atmosphère et réchauffent le
    sol, dessiné en bas. Le sol relâche de la chaleur infrarouge vers le haut : une ondulation
    rouge monte, rencontre la molécule de fluide au centre de l'atmosphère, et une partie repart
    vers le sol — flèche rouge pleine, « renvoyée vers le sol » — tandis qu'une autre partie,
    en gris tireté, s'échappe vers le haut. Une bande en bas rappelle l'échelle du PRP : combien
    de fois plus qu'un CO2 fixé à 1, indépendamment de l'ODP. L'animation fait circuler la
    chaleur ; l'image fixe montre déjà le trajet complet.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#1b3a63; }
    .lbl { font-size:15px; fill:#10233c; }
    .cap { font-size:14px; fill:#5a6b7d; }
    .band{ font-size:15px; fill:#10233c; }
  </style>

  <defs>
    <marker id="pr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c0392b"/>
    </marker>
    <marker id="pg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a97a6"/>
    </marker>
    <marker id="ps" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b06a00"/>
    </marker>
  </defs>

  <text class="ttl" x="450" y="26" text-anchor="middle">Comment une molécule retient la chaleur</text>

  <!-- atmosphère -->
  <rect x="20" y="120" width="860" height="116" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="cap" x="36" y="140">atmosphère</text>

  <!-- soleil et rayons vers le sol -->
  <circle cx="160" cy="66" r="18" fill="#b06a00"/>
  <path d="M160,66 m-26,0 h-12 M160,66 m26,0 h12 M160,66 m0,-26 v-12 M160,40 m-18,8 l-8,-8 M160,40 m18,8 l8,-8" stroke="#b06a00" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M178,80 L328,246" stroke="#b06a00" stroke-width="3" marker-end="url(#ps)"/>
  <text class="cap" x="212" y="110">le soleil réchauffe le sol</text>

  <!-- photon mobile le long du rayon (décor animé : invisible à l'arrêt) -->
  <circle r="7" fill="#b06a00" opacity="0">
    <animateMotion path="M178,80 L322,240" keyPoints="0;0;1;1" keyTimes="0;0.05;0.20;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.07;0.18;0.21;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- molécule au centre -->
  <circle cx="450" cy="178" r="18" fill="#1b3a63"/>
  <circle cx="450" cy="178" r="18" fill="none" stroke="#c0392b" stroke-width="2" opacity="0">
    <animate attributeName="r" values="18;18;30;30" keyTimes="0;0.40;0.50;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.40;0.45;0.52;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text class="qui" x="640" y="170" text-anchor="middle">La molécule renvoie une partie</text>
  <text class="qui" x="640" y="190" text-anchor="middle">de la chaleur vers le sol</text>

  <!-- chaleur infrarouge : montée depuis le sol, renvoi vers le sol, échappée -->
  <path id="c-monte" d="M408,248 C398,226 424,214 436,192" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#pr)"/>
  <text class="cap" x="330" y="212" text-anchor="middle" fill="#c0392b">le sol relâche l'infrarouge</text>
  <path id="c-retour" d="M464,192 C482,214 470,228 486,248" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#pr)"/>
  <text class="cap" x="565" y="232" text-anchor="middle" fill="#c0392b">renvoyée vers le sol</text>
  <path id="c-echappe" d="M770,248 C760,210 782,170 772,116" stroke="#8a97a6" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#pg)"/>
  <text class="cap" x="790" y="104" text-anchor="middle" fill="#5a6b7d">une partie s'échappe</text>

  <!-- billes de chaleur mobiles (décor animé : invisibles à l'arrêt) -->
  <circle r="7" fill="#c0392b" opacity="0">
    <animateMotion path="M408,248 C398,226 424,214 436,192" keyPoints="0;0;1;1" keyTimes="0;0.25;0.40;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.38;0.41;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" fill="#c0392b" opacity="0">
    <animateMotion path="M464,192 C482,214 470,228 486,248" keyPoints="0;0;1;1" keyTimes="0;0.44;0.58;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.46;0.56;0.59;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#8a97a6" opacity="0">
    <animateMotion path="M770,248 C760,210 782,170 772,116" keyPoints="0;0;1;1" keyTimes="0;0.25;0.50;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.25;0.28;0.46;0.51;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- le sol -->
  <rect x="20" y="252" width="860" height="30" fill="#f0e6d8" stroke="#b06a00" stroke-width="1.5"/>
  <text class="cap" x="58" y="272" fill="#8a5a00" font-weight="bold">le sol</text>

  <!-- échelle -->
  <rect x="20" y="340" width="860" height="48" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
  <text class="band" x="450" y="370" text-anchor="middle" font-weight="bold">PRP : combien de fois plus qu'un CO₂ (référence = 1) — indépendant de l'ODP</text>
</svg>
