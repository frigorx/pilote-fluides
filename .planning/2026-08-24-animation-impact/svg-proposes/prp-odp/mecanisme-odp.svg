<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
     aria-labelledby="t-mo" aria-describedby="d-mo" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-mo">Le mécanisme de l'ODP : le chlore ou le brome attaquent l'ozone</title>
  <desc id="d-mo">En haut, une bande représente la couche d'ozone stratosphérique. À gauche, une
    molécule de CFC ou HCFC monte vers cette couche ; elle porte l'étiquette « contient du chlore
    ou du brome » et une flèche rouge montre qu'elle abîme la couche à son contact : une entaille
    rouge s'ouvre dans la bande, avec la mention « ODP non nul ». À droite, une molécule de HFC
    monte elle aussi, mais porte l'étiquette « ni chlore ni brome » et traverse la couche sans
    l'entamer — une coche verte le confirme — avec la mention « ODP nul ». En bas, une phrase
    résume : c'est la présence de chlore ou de brome qui décide, rien d'autre. L'animation fait
    monter les deux molécules l'une après l'autre ; l'image fixe montre déjà le résultat complet.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .lbl { font-size:15px; fill:#10233c; }
    .ok  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#1e7e54; }
    .non { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#c0392b; }
    .band{ font-size:15px; fill:#10233c; }
  </style>

  <defs>
    <linearGradient id="ozone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5ede8"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
    <marker id="fa" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,10 L5,0 L10,10 Z" fill="#c0392b"/>
    </marker>
    <marker id="fb" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,10 L5,0 L10,10 Z" fill="#1e7e54"/>
    </marker>
  </defs>

  <text class="ttl" x="450" y="30" text-anchor="middle">Ce qui rend l'ODP différent de zéro</text>

  <!-- couche d'ozone -->
  <rect x="20" y="56" width="860" height="34" rx="10" fill="url(#ozone)" stroke="#047857" stroke-width="2.5"/>
  <text class="lbl" x="450" y="78" text-anchor="middle" font-weight="bold" fill="#047857">Couche d'ozone stratosphérique</text>

  <!-- CFC / HCFC : gauche -->
  <rect x="60" y="150" width="290" height="150" rx="14" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
  <circle cx="130" cy="210" r="24" fill="#fffdf8" stroke="#c0392b" stroke-width="3"/>
  <text class="qui" x="130" y="216" text-anchor="middle" fill="#c0392b">Cl</text>
  <text class="qui" x="240" y="200" text-anchor="middle">CFC / HCFC</text>
  <text class="lbl" x="240" y="222" text-anchor="middle">contient chlore ou brome</text>
  <text class="non" x="240" y="270" text-anchor="middle">ODP non nul</text>
  <path d="M130,186 L130,98" stroke="#c0392b" stroke-width="4" stroke-dasharray="6 5" marker-end="url(#fa)"/>

  <!-- entaille dans la couche, au point d'impact (état final : visible) -->
  <g id="entaille">
    <path d="M130,90 l-6,-9 l9,-8 l-7,-9" stroke="#c0392b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M118,84 l-7,-6 M142,74 l8,-5" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.04;0.30;0.36;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- molécule mobile gauche (décor animé : invisible à l'arrêt) -->
  <g opacity="0">
    <circle cx="130" cy="186" r="10" fill="#c0392b"/>
    <animateTransform attributeName="transform" type="translate" additive="replace"
      values="0,0;0,0;0,-88;0,-88" keyTimes="0;0.06;0.30;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.08;0.28;0.33;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- HFC : droite -->
  <rect x="550" y="150" width="290" height="150" rx="14" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/>
  <circle cx="620" cy="210" r="24" fill="#fffdf8" stroke="#1e7e54" stroke-width="3"/>
  <text class="qui" x="620" y="216" text-anchor="middle" fill="#1e7e54">F</text>
  <text class="qui" x="730" y="200" text-anchor="middle">HFC</text>
  <text class="lbl" x="730" y="222" text-anchor="middle">ni chlore ni brome</text>
  <text class="ok" x="730" y="270" text-anchor="middle">ODP nul</text>
  <path d="M620,186 L620,52" stroke="#1e7e54" stroke-width="4" marker-end="url(#fb)"/>

  <!-- coche : la couche reste intacte (état final : visible) -->
  <g id="coche">
    <circle cx="662" cy="42" r="13" fill="#1e7e54"/>
    <path d="M655,42 l5,5 l9,-10" stroke="#fffdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.04;0.50;0.56;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- molécule mobile droite (décor animé : invisible à l'arrêt) -->
  <g opacity="0">
    <circle cx="620" cy="186" r="10" fill="#1e7e54"/>
    <animateTransform attributeName="transform" type="translate" additive="replace"
      values="0,0;0,0;0,-146;0,-146" keyTimes="0;0.22;0.50;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21;0.24;0.46;0.52;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <rect x="20" y="322" width="860" height="42" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="450" y="348" text-anchor="middle" font-weight="bold">C'est la présence de chlore ou de brome qui décide, rien d'autre.</text>
</svg>
