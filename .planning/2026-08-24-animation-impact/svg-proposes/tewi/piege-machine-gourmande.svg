<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"
     aria-labelledby="t-p1" aria-describedby="d-p1" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-p1">Piège n°1 : un fluide bas PRP mais une machine mal dimensionnée</title>
  <desc id="d-p1">À gauche, une pompe à chaleur schématique porte l'étiquette propane, PRP 3, et la
    mention peu de fuites : le direct est marqué faible. À droite, un compteur électrique dont
    l'aiguille est poussée vers la zone rouge porte la mention consommation élevée, machine mal
    dimensionnée : l'indirect est marqué fort. En bas, une balance penche nettement du côté de
    l'indirect, avec la conclusion écrite : malgré un fluide bas PRP, l'indirect peut dominer le
    TEWI. L'animation fait monter l'aiguille dans le rouge puis pencher la balance ; l'image
    fixe montre déjà la balance penchée.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#1e7e54; }
    .lbl { font-size:15px; fill:#10233c; }
    .lblr{ font-size:15px; fill:#c0392b; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
  </style>

  <text class="ttl" x="450" y="30" text-anchor="middle">Fluide bas PRP, mais machine gourmande</text>

  <!-- PAC, fluide bas PRP -->
  <g>
    <rect x="30" y="56" width="380" height="150" rx="14" fill="#fffdf8" stroke="#1e7e54" stroke-width="3"/>
    <rect x="60" y="76" width="150" height="86" rx="8" fill="none" stroke="#5a6b7d" stroke-width="2"/>
    <text class="lbl" x="135" y="112" text-anchor="middle" font-weight="bold">Pompe à</text>
    <text class="lbl" x="135" y="132" text-anchor="middle" font-weight="bold">chaleur</text>
    <text class="lbl" x="135" y="150" text-anchor="middle" font-size="13px">fluide propane</text>
    <circle cx="320" cy="104" r="7" fill="#1e7e54"/>
    <text class="qui" x="320" y="132" text-anchor="middle" font-size="15px">PRP 3</text>
    <text class="lbl" x="320" y="152" text-anchor="middle" font-size="13px">peu de fuites</text>
    <text class="qui" x="220" y="188" text-anchor="middle" font-size="16px">Direct : faible</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.13;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Compteur, consommation élevée : l'aiguille monte dans le rouge -->
  <g>
    <rect x="490" y="56" width="380" height="150" rx="14" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <circle cx="590" cy="112" r="40" fill="#fffdf8" stroke="#c0392b" stroke-width="3"/>
    <g>
      <line x1="590" y1="112" x2="616" y2="90" stroke="#c0392b" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" additive="replace"
        values="-75 590 112;-75 590 112;0 590 112;0 590 112" keyTimes="0;0.18;0.30;1" dur="12s" repeatCount="indefinite"/>
    </g>
    <circle cx="590" cy="112" r="4" fill="#c0392b"/>
    <text class="lblr" x="720" y="106" text-anchor="middle" font-size="15px">consommation</text>
    <text class="lblr" x="720" y="126" text-anchor="middle" font-size="15px">élevée</text>
    <text class="lblr" x="720" y="150" text-anchor="middle" font-size="13px">machine mal dimensionnée</text>
    <text class="qui" x="680" y="188" text-anchor="middle" font-size="16px" fill="#c0392b">Indirect : fort</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.22;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Balance : à plat au départ, penche côté indirect -->
  <line x1="220" y1="238" x2="680" y2="266" stroke="#1b3a63" stroke-width="4">
    <animate attributeName="y1" values="252;252;238;238" keyTimes="0;0.34;0.46;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="252;252;266;266" keyTimes="0;0.34;0.46;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <polygon points="450,238 428,278 472,278" fill="#5a6b7d" stroke="#10233c" stroke-width="2"/>
  <g>
    <line x1="220" y1="238" x2="220" y2="264" stroke="#5a6b7d" stroke-width="2"/>
    <ellipse cx="220" cy="286" rx="70" ry="26" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2"/>
    <text class="lbl" x="220" y="292" text-anchor="middle" font-size="14px">direct</text>
    <animateTransform attributeName="transform" type="translate" additive="replace"
      values="0,14;0,14;0,0;0,0" keyTimes="0;0.34;0.46;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <line x1="680" y1="266" x2="680" y2="298" stroke="#5a6b7d" stroke-width="2"/>
    <ellipse cx="680" cy="320" rx="70" ry="26" fill="#fbe7e4" stroke="#c0392b" stroke-width="2"/>
    <text class="lblr" x="680" y="326" text-anchor="middle" font-size="14px">indirect</text>
    <animateTransform attributeName="transform" type="translate" additive="replace"
      values="0,-14;0,-14;0,0;0,0" keyTimes="0;0.34;0.46;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <g>
    <text class="band" x="450" y="378" text-anchor="middle">Malgré un fluide « propre », l'indirect peut dominer le TEWI.</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.60;1" dur="12s" repeatCount="indefinite"/>
  </g>
</svg>
