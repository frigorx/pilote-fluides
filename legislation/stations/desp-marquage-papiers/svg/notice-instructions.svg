<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-ni" aria-describedby="d-ni" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-ni">La notice d'instructions, fournie avec l'équipement</title>
  <desc id="d-ni">Un document divisé en trois bandes empilées : les conditions d'utilisation, les
    opérations d'entretien, et les limites de l'équipement — dont la pression maximale admissible,
    la PS. En dessous, un exemple concret : la notice fournie avec un condenseur ou un séparateur
    d'huile livré par le fabricant.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fffdf8; }
    .sec  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
    .lbl  { font-size:15px; fill:#5a6b7d; }
    .ex   { font-size:15px; fill:#10233c; font-style:italic; }
  </style>

  <!-- Le document -->
  <rect x="200" y="20" width="500" height="230" rx="14" fill="#fffdf8" stroke="#1e7e54" stroke-width="3"/>
  <rect x="200" y="20" width="500" height="40" rx="14" fill="#1e7e54"/>
  <rect x="200" y="46" width="500" height="14" fill="#1e7e54"/>
  <text class="ttl" x="450" y="47" text-anchor="middle">NOTICE D'INSTRUCTIONS</text>

  <!-- Bande 1 : conditions d'utilisation -->
  <rect x="222" y="72" width="456" height="54" rx="8" fill="#eef3f9" stroke="#d6dee7" stroke-width="2"/>
  <text class="sec" x="240" y="94">Conditions d'utilisation</text>
  <text class="lbl" x="240" y="114">comment faire fonctionner l'équipement</text>

  <!-- Bande 2 : entretien -->
  <rect x="222" y="134" width="456" height="54" rx="8" fill="#eef3f9" stroke="#d6dee7" stroke-width="2"/>
  <text class="sec" x="240" y="156">Entretien</text>
  <text class="lbl" x="240" y="176">ce qui doit être vérifié, et à quel rythme</text>

  <!-- Bande 3 : limites -->
  <rect x="222" y="196" width="456" height="54" rx="8" fill="#fbf1de" stroke="#b06a00" stroke-width="2.5"/>
  <text class="sec" x="240" y="218" fill="#b06a00">Limites de l'équipement</text>
  <text class="lbl" x="240" y="238" fill="#10233c">dont la pression maximale admissible — la PS</text>

  <!-- L'exemple, en bas -->
  <rect x="70" y="272" width="760" height="52" rx="10" fill="#fffdf8" stroke="#5a6b7d" stroke-width="2"/>
  <text class="ex" x="450" y="304" text-anchor="middle">Exemple : la notice livrée avec un condenseur ou un séparateur d'huile</text>
</svg>
