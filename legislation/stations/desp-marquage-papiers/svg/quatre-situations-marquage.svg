<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-4s" aria-describedby="d-4s" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-4s">Quatre situations de terrain autour du marquage et des papiers</title>
  <desc id="d-4s">Quatre cartes numérotées, chacune avec une situation rencontrée sur le terrain et
    la réponse qui en découle : recevoir un équipement neuf sans notice, un contrôle qui demande
    le dossier de l'installation, une plaque sans PS lisible, et une déclaration de conformité
    égarée.</desc>
  <style>
    .num  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#fffdf8; }
    .sit  { font-size:15px; fill:#10233c; font-style:italic; }
    .rep  { font-size:15px; fill:#10233c; }
  </style>

  <!-- Carte 1 -->
  <rect x="20" y="20" width="205" height="290" rx="14" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <circle cx="55" cy="55" r="22" fill="#0c4a6e"/>
  <text class="num" x="55" y="63" text-anchor="middle">1</text>
  <text class="sit" x="40" y="100">« Je reçois un</text>
  <text class="sit" x="40" y="120">équipement neuf,</text>
  <text class="sit" x="40" y="140">sans notice. »</text>
  <line x1="40" y1="156" x2="205" y2="156" stroke="#d6dee7" stroke-width="2"/>
  <text class="rep" x="40" y="182">Ne pas l'installer</text>
  <text class="rep" x="40" y="202">sans la réclamer</text>
  <text class="rep" x="40" y="222">au fabricant : elle</text>
  <text class="rep" x="40" y="242">doit être fournie.</text>

  <!-- Carte 2 -->
  <rect x="238" y="20" width="205" height="290" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <circle cx="273" cy="55" r="22" fill="#1b3a63"/>
  <text class="num" x="273" y="63" text-anchor="middle">2</text>
  <text class="sit" x="258" y="100">« Un contrôle</text>
  <text class="sit" x="258" y="120">demande le dossier</text>
  <text class="sit" x="258" y="140">de l'installation. »</text>
  <line x1="258" y1="156" x2="423" y2="156" stroke="#d6dee7" stroke-width="2"/>
  <text class="rep" x="258" y="182">Présenter la</text>
  <text class="rep" x="258" y="202">déclaration et la</text>
  <text class="rep" x="258" y="222">notice, conservées</text>
  <text class="rep" x="258" y="242">depuis le montage.</text>

  <!-- Carte 3 -->
  <rect x="456" y="20" width="205" height="290" rx="14" fill="#fffdf8" stroke="#b06a00" stroke-width="3"/>
  <circle cx="491" cy="55" r="22" fill="#b06a00"/>
  <text class="num" x="491" y="63" text-anchor="middle">3</text>
  <text class="sit" x="476" y="100">« La plaque porte</text>
  <text class="sit" x="476" y="120">le CE, mais pas de</text>
  <text class="sit" x="476" y="140">PS lisible. »</text>
  <line x1="476" y1="156" x2="641" y2="156" stroke="#d6dee7" stroke-width="2"/>
  <text class="rep" x="476" y="182">Un champ manque :</text>
  <text class="rep" x="476" y="202">la plaque n'est pas</text>
  <text class="rep" x="476" y="222">complète — à</text>
  <text class="rep" x="476" y="242">signaler.</text>

  <!-- Carte 4 -->
  <rect x="674" y="20" width="205" height="290" rx="14" fill="#fffdf8" stroke="#1e7e54" stroke-width="3"/>
  <circle cx="709" cy="55" r="22" fill="#1e7e54"/>
  <text class="num" x="709" y="63" text-anchor="middle">4</text>
  <text class="sit" x="694" y="100">« Je ne retrouve</text>
  <text class="sit" x="694" y="120">plus la déclaration</text>
  <text class="sit" x="694" y="140">de conformité. »</text>
  <line x1="694" y1="156" x2="859" y2="156" stroke="#d6dee7" stroke-width="2"/>
  <text class="rep" x="694" y="182">La redemander au</text>
  <text class="rep" x="694" y="202">fabricant : elle se</text>
  <text class="rep" x="694" y="222">reconstitue, elle ne</text>
  <text class="rep" x="694" y="242">s'improvise pas.</text>
</svg>
