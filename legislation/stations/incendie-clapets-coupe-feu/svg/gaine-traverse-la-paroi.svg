<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img"
     aria-labelledby="t-gt" aria-describedby="d-gt" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-gt">Une gaine qui traverse une paroi coupe-feu ouvre un chemin au feu</title>
  <desc id="d-gt">Coupe schématique. À gauche, un local sinistré où brûlent deux flammes. Au milieu, une paroi
    coupe-feu épaisse, hachurée. À droite, un local voisin. Une gaine de ventilation horizontale traverse la
    paroi de part en part. Une flèche rouge suit l'intérieur de la gaine, du local sinistré jusqu'au local
    voisin, et des volutes de fumée grise sortent de la gaine côté voisin. En bas, deux phrases : le feu suit
    la gaine et ressort de l'autre côté ; le trou de la gaine annule le degré coupe-feu de la paroi.
    L'animation trace la flèche puis fait apparaître la fumée ; l'image fixe est complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .lieu { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .cap1 { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:21px; fill:#b91c1c; }
    .cap2 { font-size:18px; fill:#5a6b7d; }
  </style>
  <defs>
    <pattern id="hach" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#e2e8f0"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#94a3b8" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="800" height="480" fill="#fffdf8"/>

  <text class="ttl" x="400" y="36" text-anchor="middle">Une gaine perce la paroi coupe-feu</text>

  <!-- les deux locaux -->
  <rect x="40" y="62" width="300" height="288" fill="#fbe7e4"/>
  <rect x="460" y="62" width="300" height="288" fill="#eef3f9"/>
  <line x1="40" y1="350" x2="760" y2="350" stroke="#5a6b7d" stroke-width="4"/>

  <!-- la paroi -->
  <rect x="340" y="62" width="120" height="288" fill="url(#hach)" stroke="#1b3a63" stroke-width="3"/>

  <!-- la gaine -->
  <rect x="40" y="165" width="720" height="70" fill="#fffdf8"/>
  <line x1="40" y1="165" x2="760" y2="165" stroke="#1b3a63" stroke-width="4"/>
  <line x1="40" y1="235" x2="760" y2="235" stroke="#1b3a63" stroke-width="4"/>

  <!-- flammes du local sinistré -->
  <g transform="translate(140,350)">
    <path d="M0 0 C-30 -4 -38 -36 -14 -62 C-14 -44 -4 -40 0 -32 C4 -54 16 -68 22 -82 C42 -54 42 -8 0 0 Z" fill="#e8914a"/>
    <path d="M0 0 C-14 -2 -16 -18 -4 -30 C-2 -22 2 -20 6 -26 C14 -16 14 -2 0 0 Z" fill="#b91c1c"/>
  </g>
  <g transform="translate(232,350) scale(.8)">
    <path d="M0 0 C-30 -4 -38 -36 -14 -62 C-14 -44 -4 -40 0 -32 C4 -54 16 -68 22 -82 C42 -54 42 -8 0 0 Z" fill="#e8914a"/>
    <path d="M0 0 C-14 -2 -16 -18 -4 -30 C-2 -22 2 -20 6 -26 C14 -16 14 -2 0 0 Z" fill="#b91c1c"/>
  </g>

  <!-- le chemin du feu : flèche et fumée (animés) -->
  <g>
    <line x1="80" y1="200" x2="712" y2="200" stroke="#b91c1c" stroke-width="7" stroke-linecap="round"
          pathLength="100" stroke-dasharray="100" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0;100;100"
               keyTimes="0;0.04;0.50;0.95;0.965;1" dur="13s" repeatCount="indefinite"/>
    </line>
    <polygon points="708,184 738,200 708,216" fill="#b91c1c">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.95;0.965;1" dur="13s" repeatCount="indefinite"/>
    </polygon>
    <g fill="#94a3b8">
      <circle cx="690" cy="140" r="13"><animate attributeName="opacity" values="0;0;.9;.9;0;0" keyTimes="0;0.50;0.58;0.95;0.965;1" dur="13s" repeatCount="indefinite"/></circle>
      <circle cx="716" cy="112" r="17"><animate attributeName="opacity" values="0;0;.9;.9;0;0" keyTimes="0;0.56;0.64;0.95;0.965;1" dur="13s" repeatCount="indefinite"/></circle>
      <circle cx="694" cy="84" r="21"><animate attributeName="opacity" values="0;0;.9;.9;0;0" keyTimes="0;0.62;0.70;0.95;0.965;1" dur="13s" repeatCount="indefinite"/></circle>
    </g>
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.92;0.945;0.985;0.995;1" dur="13s" repeatCount="indefinite"/>
  </g>

  <!-- étiquettes -->
  <text class="lieu" x="190" y="386" text-anchor="middle">Local sinistré</text>
  <text class="lieu" x="400" y="386" text-anchor="middle">Paroi coupe-feu</text>
  <text class="lieu" x="610" y="386" text-anchor="middle">Local voisin</text>

  <text class="cap1" x="400" y="432" text-anchor="middle">Le feu suit la gaine et ressort de l'autre côté</text>
  <text class="cap2" x="400" y="462" text-anchor="middle">Le trou de la gaine annule le degré coupe-feu de la paroi</text>
</svg>
