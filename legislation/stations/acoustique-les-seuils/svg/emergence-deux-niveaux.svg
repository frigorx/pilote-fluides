<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-em" aria-describedby="d-em" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-em">L'émergence : la différence entre deux niveaux mesurés</title>
  <desc id="d-em">Deux colonnes côte à côte. La première, en gris-bleu, est le bruit résiduel, machine à
    l'arrêt : 35 décibels pondérés A dans l'exemple. La seconde est le bruit ambiant, machine en marche :
    41 décibels pondérés A. Une ligne en tireté prolonge le sommet de la première colonne ; la part de la
    seconde colonne qui la dépasse est en orange et porte une accolade : c'est l'émergence, 6 décibels
    pondérés A. En bas, la formule : émergence égale ambiant moins résiduel. Les chiffres sont choisis
    pour l'exemple. L'animation construit les colonnes l'une après l'autre ; l'image fixe montre tout.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .lbl { font-size:18px; fill:#10233c; }
    .val { font-weight:bold; font-size:20px; fill:#1b3a63; }
  </style>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text class="ttl" x="400" y="34" text-anchor="middle">Deux mesures, une différence</text>

  <!-- ligne de base -->
  <line x1="60" y1="390" x2="740" y2="390" stroke="#5a6b7d" stroke-width="3"/>

  <!-- colonne résiduel : 35 x 7 = 245 -->
  <rect x="140" y="145" width="150" height="245" fill="#c7d3e3" stroke="#1b3a63" stroke-width="3">
    <animate attributeName="height" values="0;0;245;245" keyTimes="0;0.02;0.14;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y" values="390;390;145;145" keyTimes="0;0.02;0.14;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text class="val" x="215" y="135" text-anchor="middle">35 dB(A)
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.13;0.17;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- tireté de comparaison -->
  <line x1="290" y1="145" x2="590" y2="145" stroke="#5a6b7d" stroke-width="2" stroke-dasharray="8 6">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.25;1" dur="12s" repeatCount="indefinite"/>
  </line>

  <!-- colonne ambiant : partie commune (violet clair) 245 + partie en plus (orange) 42 -->
  <rect x="420" y="145" width="150" height="245" fill="#c9b5ee" stroke="#1b3a63" stroke-width="3">
    <animate attributeName="height" values="0;0;245;245" keyTimes="0;0.28;0.40;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y" values="390;390;145;145" keyTimes="0;0.28;0.40;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect x="420" y="103" width="150" height="42" fill="#e8914a" stroke="#1b3a63" stroke-width="3">
    <animate attributeName="height" values="0;0;42;42" keyTimes="0;0.42;0.52;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y" values="145;145;103;103" keyTimes="0;0.42;0.52;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text class="val" x="495" y="93" text-anchor="middle">41 dB(A)
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.51;0.55;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- accolade et étiquette d'émergence -->
  <g>
    <path d="M 592 103 L 604 103 L 604 145 L 592 145" fill="none" stroke="#10233c" stroke-width="3"/>
    <text x="616" y="122" font-size="22" font-weight="bold" fill="#c9451a">Émergence</text>
    <text x="616" y="146" font-size="20" font-weight="bold" fill="#c9451a">6 dB(A)</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.62;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- légendes des colonnes -->
  <text class="lbl" x="215" y="418" text-anchor="middle" font-weight="bold">Bruit résiduel</text>
  <text class="lbl" x="215" y="440" text-anchor="middle">machine à l'arrêt</text>
  <text class="lbl" x="495" y="418" text-anchor="middle" font-weight="bold">Bruit ambiant</text>
  <text class="lbl" x="495" y="440" text-anchor="middle">machine en marche</text>

  <!-- formule -->
  <g>
    <text x="400" y="472" text-anchor="middle" font-size="22" font-weight="bold" fill="#10233c">Émergence = niveau ambiant − niveau résiduel</text>
    <text x="400" y="493" text-anchor="middle" font-size="16" fill="#5a6b7d">(valeurs choisies pour l'exemple)</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.72;1" dur="12s" repeatCount="indefinite"/>
  </g>
</svg>
