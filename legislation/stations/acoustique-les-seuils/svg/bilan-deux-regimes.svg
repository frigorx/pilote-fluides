<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-bd" aria-describedby="d-bd" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-bd">Bilan : deux régimes, deux questions</title>
  <desc id="d-bd">Deux colonnes séparées par un signe différent. À gauche, le voisinage, Code de la santé
    publique : un pictogramme de maison ; la question est de combien le bruit dépasse le bruit habituel ; la
    mesure est une différence entre ambiant et résiduel ; les repères sont 5 et 3 décibels pondérés A plus un
    terme selon la durée. À droite, le travail, Code du travail : un pictogramme de salarié casqué ; la
    question est quel bruit il reçoit dans sa journée ; la mesure est un niveau absolu ; les repères sont 80,
    85 et 87 décibels pondérés A. En bas, le réflexe : mesurer le bruit résiduel avant d'installer la machine.</desc>
  <rect width="800" height="500" fill="#fffdf8"/>

  <!-- colonne voisinage -->
  <rect x="20" y="20" width="350" height="360" rx="14" fill="#fffdf8" stroke="#6d28d9" stroke-width="3"/>
  <!-- pictogramme maison -->
  <polygon points="66,86 96,60 126,86" fill="#6d28d9"/>
  <rect x="72" y="86" width="48" height="34" fill="#6d28d9"/>
  <rect x="90" y="98" width="12" height="22" fill="#fffdf8"/>
  <text x="145" y="86" font-size="22" font-weight="bold" fill="#6d28d9">Le voisinage</text>
  <text x="145" y="108" font-size="17" fill="#5a6b7d">Code de la santé publique</text>
  <g font-size="18" fill="#10233c">
    <text x="40" y="160" font-weight="bold">La question</text>
    <text x="40" y="184">De combien le bruit dépasse-t-il</text>
    <text x="40" y="206">le bruit habituel ?</text>
    <text x="40" y="244" font-weight="bold">La mesure</text>
    <text x="40" y="268">Une différence : ambiant − résiduel</text>
    <text x="40" y="306" font-weight="bold">Les repères</text>
    <text x="40" y="330">5 dB(A) le jour, 3 dB(A) la nuit,</text>
    <text x="40" y="352">plus un terme selon la durée</text>
  </g>

  <!-- signe différent -->
  <text x="400" y="210" text-anchor="middle" font-size="52" font-weight="bold" fill="#5a6b7d">≠</text>

  <!-- colonne travail -->
  <rect x="430" y="20" width="350" height="360" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <!-- pictogramme salarié casqué -->
  <circle cx="474" cy="82" r="14" fill="#1b3a63"/>
  <path d="M 458 80 A 16 16 0 0 1 490 80 Z" fill="#e8914a" stroke="#1b3a63" stroke-width="2"/>
  <rect x="454" y="79" width="40" height="5" rx="2" fill="#e8914a" stroke="#1b3a63" stroke-width="1.5"/>
  <path d="M 452 124 L 452 104 Q 452 96 462 96 L 486 96 Q 496 96 496 104 L 496 124 Z" fill="#1b3a63"/>
  <text x="520" y="86" font-size="22" font-weight="bold" fill="#1b3a63">Le travail</text>
  <text x="520" y="108" font-size="17" fill="#5a6b7d">Code du travail</text>
  <g font-size="18" fill="#10233c">
    <text x="450" y="160" font-weight="bold">La question</text>
    <text x="450" y="184">Quel bruit le salarié reçoit-il</text>
    <text x="450" y="206">dans sa journée ?</text>
    <text x="450" y="244" font-weight="bold">La mesure</text>
    <text x="450" y="268">Un niveau absolu, moyenné</text>
    <text x="450" y="306" font-weight="bold">Les repères</text>
    <text x="450" y="330">80, 85 et 87 dB(A) d'exposition</text>
    <text x="450" y="352">quotidienne</text>
  </g>

  <!-- réflexe -->
  <rect x="20" y="400" width="760" height="80" rx="14" fill="#fff3e4" stroke="#c9451a" stroke-width="3"/>
  <text x="400" y="434" text-anchor="middle" font-size="20" font-weight="bold" fill="#c9451a">Le réflexe du chargé d'affaires</text>
  <text x="400" y="464" text-anchor="middle" font-size="19" fill="#10233c">Connaître le bruit résiduel AVANT d'installer la machine.</text>
</svg>
