<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-rec" aria-describedby="d-rec" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-rec">Recyclage : les chutes de cuivre transformées en matière neuve</title>
  <desc id="d-rec">À gauche, des chutes de cuivre irrégulières. Une flèche les fait entrer dans un
    symbole de transformation, un four stylisé, au centre. Une seconde flèche en ressort vers la
    droite, où la matière apparaît sous une forme neuve et régulière : du cuivre prêt à resservir.
    En bas, la phrase : contrairement au réemploi, le recyclage transforme la matière avant
    qu'elle resserve.</desc>
  <style>
    .cadre  { fill:#fffdf8; stroke:#57534e; stroke-width:3; }
    .ttl    { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .lbl    { font-size:15px; fill:#5a6b7d; }
  </style>

  <!-- chutes de cuivre -->
  <rect class="cadre" x="30" y="70" width="210" height="160" rx="14"/>
  <polygon points="90,120 110,100 130,115 120,140 140,150 125,175 95,170 80,150" fill="#fffdf8" stroke="#b06a00" stroke-width="3"/>
  <polygon points="150,150 175,140 195,160 180,185 155,190" fill="#fffdf8" stroke="#b06a00" stroke-width="3"/>
  <text class="ttl" x="135" y="216" text-anchor="middle">Chutes de cuivre</text>

  <!-- flèche entrante -->
  <line x1="245" y1="150" x2="335" y2="150" stroke="#57534e" stroke-width="4"/>
  <polygon points="352,150 328,138 328,162" fill="#57534e"/>

  <!-- le four stylisé -->
  <path d="M360 230 v-90 q0 -60 60 -60 q60 0 60 60 v90 z" fill="#fffdf8" stroke="#57534e" stroke-width="3.5"/>
  <rect x="392" y="185" width="56" height="34" rx="6" fill="#57534e"/>
  <text class="ttl" x="420" y="256" text-anchor="middle">Transformation</text>
  <text class="lbl" x="420" y="276" text-anchor="middle">(four)</text>

  <!-- flèche sortante -->
  <line x1="490" y1="150" x2="580" y2="150" stroke="#57534e" stroke-width="4"/>
  <polygon points="597,150 573,138 573,162" fill="#57534e"/>

  <!-- cuivre neuf -->
  <rect class="cadre" x="620" y="70" width="250" height="160" rx="14"/>
  <rect x="660" y="120" width="170" height="18" rx="9" fill="#fffdf8" stroke="#b06a00" stroke-width="3"/>
  <rect x="660" y="148" width="170" height="18" rx="9" fill="#fffdf8" stroke="#b06a00" stroke-width="3"/>
  <rect x="660" y="176" width="170" height="18" rx="9" fill="#fffdf8" stroke="#b06a00" stroke-width="3"/>
  <text class="ttl" x="745" y="216" text-anchor="middle">Cuivre neuf</text>

  <text x="450" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#10233c">Le recyclage transforme la matière avant qu'elle resserve.</text>
</svg>
