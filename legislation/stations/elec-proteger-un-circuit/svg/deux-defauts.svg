<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img"
     aria-labelledby="t-df" aria-describedby="d-df" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-df">Deux défauts de courant : la surcharge et le court-circuit</title>
  <desc id="d-df">Deux cartes côte à côte. À gauche, la surcharge : un petit graphique du courant en fonction du temps
    montre un courant un peu au-dessus du courant nominal, pendant longtemps. Cause : trop de récepteurs ou un moteur
    qui force. Effet : échauffement lent. Déclencheur qui répond : le thermique, à bilame. À droite, le court-circuit :
    le graphique montre un courant énorme, très bref, coupé net. Cause : contact direct entre deux conducteurs sous
    tension. Effet : forces et chaleur brutales. Déclencheur qui répond : le magnétique, à bobine. Une bande résume :
    deux défauts, deux vitesses, deux déclencheurs.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#fffdf8; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
  </style>

  <!-- Carte surcharge -->
  <rect x="20" y="20" width="410" height="266" rx="14" fill="#fffdf8" stroke="#a16207" stroke-width="3"/>
  <rect x="20" y="20" width="410" height="42" rx="14" fill="#a16207"/>
  <rect x="20" y="48" width="410" height="14" fill="#a16207"/>
  <text class="ttl" x="225" y="49" text-anchor="middle">SURCHARGE</text>
  <text class="mut" x="50" y="86">courant</text>
  <g stroke="#5a6b7d" stroke-width="2" fill="none">
    <path d="M50,94 V190 H300"/>
    <path d="M50,150 H300" stroke-dasharray="6 6"/>
  </g>
  <path d="M52,150 H80 V122 H300" fill="none" stroke="#a16207" stroke-width="4" stroke-linejoin="round"/>
  <text class="mut" x="310" y="156">nominal</text>
  <text class="mut" x="300" y="212" text-anchor="end">temps</text>
  <text class="qui" x="40" y="238">Un peu trop de courant, longtemps</text>
  <text class="lbl" x="40" y="260">Cause : trop de récepteurs, moteur qui force</text>
  <text class="lbl" x="40" y="280" font-weight="bold">Effet lent · déclencheur thermique (bilame)</text>

  <!-- Carte court-circuit -->
  <rect x="470" y="20" width="410" height="266" rx="14" fill="#fffdf8" stroke="#c0392b" stroke-width="3"/>
  <rect x="470" y="20" width="410" height="42" rx="14" fill="#c0392b"/>
  <rect x="470" y="48" width="410" height="14" fill="#c0392b"/>
  <text class="ttl" x="675" y="49" text-anchor="middle">COURT-CIRCUIT</text>
  <text class="mut" x="500" y="86">courant</text>
  <g stroke="#5a6b7d" stroke-width="2" fill="none">
    <path d="M500,94 V190 H750"/>
    <path d="M500,150 H750" stroke-dasharray="6 6"/>
  </g>
  <path d="M502,150 H600 V98 H630 V188" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round"/>
  <text class="mut" x="760" y="156">nominal</text>
  <text class="mut" x="750" y="212" text-anchor="end">temps</text>
  <text class="qui" x="490" y="238">Un courant énorme, en un instant</text>
  <text class="lbl" x="490" y="260">Cause : deux conducteurs sous tension en contact</text>
  <text class="lbl" x="490" y="280" font-weight="bold">Effet brutal · déclencheur magnétique (bobine)</text>

  <rect x="20" y="304" width="860" height="44" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="450" y="332" text-anchor="middle">Deux défauts, deux vitesses, deux déclencheurs</text>
</svg>
