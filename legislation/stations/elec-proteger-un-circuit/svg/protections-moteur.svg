<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img"
     aria-labelledby="t-pm" aria-describedby="d-pm" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-pm">La règle des protections d'un moteur : une tête, puis une seule protection moteur</title>
  <desc id="d-pm">Trois colonnes de blocs empilés, reliés par des traits verticaux. Colonne A, encadrée en vert : une tête,
    sectionneur porte-fusibles ; puis un disjoncteur moteur ; puis le moteur du compresseur. Légende : un seul appareil
    protège le moteur. Colonne B, encadrée en vert : une tête, disjoncteur modulaire ; puis un contacteur ; puis un
    relais thermique ; puis le moteur. Légende : le contacteur commande, le relais thermique protège. Colonne C,
    encadrée en rouge et marquée d'une croix, à éviter : un disjoncteur moteur, puis un relais thermique, puis le moteur.
    Légende : le même moteur protégé deux fois pour rien. Les blocs de tête sont ocre, les appareils de protection et de
    commande du moteur sont orange, le moteur est bleu.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#fffdf8; }
    .tb  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
    .lbl { font-size:16px; fill:#10233c; }
    .capo{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#047857; }
    .capk{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#c0392b; }
  </style>

  <!-- Colonne A -->
  <rect x="20" y="20" width="270" height="460" rx="14" fill="#fffdf8" stroke="#047857" stroke-width="3"/>
  <rect x="20" y="20" width="270" height="42" rx="14" fill="#047857"/><rect x="20" y="48" width="270" height="14" fill="#047857"/>
  <text class="ttl" x="155" y="49" text-anchor="middle">A · Disjoncteur moteur</text>
  <path d="M155,140 V180 M155,240 V280" stroke="#5a6b7d" stroke-width="3"/>
  <rect x="40" y="80" width="230" height="60" rx="10" fill="#f4eadb" stroke="#a16207" stroke-width="2.5"/>
  <text class="tb" x="155" y="106" text-anchor="middle">Tête :</text><text class="tb" x="155" y="127" text-anchor="middle">sectionneur porte-fusibles</text>
  <rect x="40" y="180" width="230" height="60" rx="10" fill="#fdeede" stroke="#e8914a" stroke-width="2.5"/>
  <text class="tb" x="155" y="216" text-anchor="middle">Disjoncteur moteur</text>
  <rect x="40" y="280" width="230" height="60" rx="10" fill="#eef3f9" stroke="#2f5689" stroke-width="2.5"/>
  <text class="tb" x="155" y="316" text-anchor="middle">Moteur du compresseur</text>
  <text class="capo" x="155" y="400" text-anchor="middle">Un seul appareil</text>
  <text class="capo" x="155" y="422" text-anchor="middle">protège le moteur</text>

  <!-- Colonne B -->
  <rect x="315" y="20" width="270" height="460" rx="14" fill="#fffdf8" stroke="#047857" stroke-width="3"/>
  <rect x="315" y="20" width="270" height="42" rx="14" fill="#047857"/><rect x="315" y="48" width="270" height="14" fill="#047857"/>
  <text class="ttl" x="450" y="49" text-anchor="middle">B · Contacteur + thermique</text>
  <path d="M450,140 V170 M450,220 V250 M450,300 V330" stroke="#5a6b7d" stroke-width="3"/>
  <rect x="335" y="80" width="230" height="60" rx="10" fill="#f4eadb" stroke="#a16207" stroke-width="2.5"/>
  <text class="tb" x="450" y="106" text-anchor="middle">Tête :</text><text class="tb" x="450" y="127" text-anchor="middle">disjoncteur modulaire</text>
  <rect x="335" y="170" width="230" height="50" rx="10" fill="#fdeede" stroke="#e8914a" stroke-width="2.5"/>
  <text class="tb" x="450" y="201" text-anchor="middle">Contacteur</text>
  <rect x="335" y="250" width="230" height="50" rx="10" fill="#fdeede" stroke="#e8914a" stroke-width="2.5"/>
  <text class="tb" x="450" y="281" text-anchor="middle">Relais thermique</text>
  <rect x="335" y="330" width="230" height="60" rx="10" fill="#eef3f9" stroke="#2f5689" stroke-width="2.5"/>
  <text class="tb" x="450" y="366" text-anchor="middle">Moteur du compresseur</text>
  <text class="capo" x="450" y="430" text-anchor="middle">Le contacteur commande,</text>
  <text class="capo" x="450" y="452" text-anchor="middle">le thermique protège</text>

  <!-- Colonne C : à éviter -->
  <rect x="610" y="20" width="270" height="460" rx="14" fill="#fffdf8" stroke="#c0392b" stroke-width="3"/>
  <rect x="610" y="20" width="270" height="42" rx="14" fill="#c0392b"/><rect x="610" y="48" width="270" height="14" fill="#c0392b"/>
  <text class="ttl" x="745" y="49" text-anchor="middle">C · À éviter</text>
  <path d="M745,140 V180 M745,240 V280" stroke="#5a6b7d" stroke-width="3"/>
  <rect x="630" y="80" width="230" height="60" rx="10" fill="#fdeede" stroke="#e8914a" stroke-width="2.5"/>
  <text class="tb" x="745" y="116" text-anchor="middle">Disjoncteur moteur</text>
  <rect x="630" y="180" width="230" height="60" rx="10" fill="#fdeede" stroke="#e8914a" stroke-width="2.5"/>
  <text class="tb" x="745" y="216" text-anchor="middle">Relais thermique</text>
  <rect x="630" y="280" width="230" height="60" rx="10" fill="#eef3f9" stroke="#2f5689" stroke-width="2.5"/>
  <text class="tb" x="745" y="316" text-anchor="middle">Moteur du compresseur</text>
  <path d="M820,366 l28,28 m0,-28 l-28,28" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
  <text class="capk" x="745" y="430" text-anchor="middle">Le même moteur protégé</text>
  <text class="capk" x="745" y="452" text-anchor="middle">deux fois, pour rien</text>
</svg>
