<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-cvc" aria-describedby="d-cvc" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-cvc">L'interface entre le lot sécurité incendie et le lot CVC</title>
  <desc id="d-cvc">À gauche, le lot sécurité incendie avec son centralisateur. À droite, le lot CVC avec un clapet, un volet et une ventilation. Entre les deux, deux flèches : les ordres vont du SSI vers le CVC, fermer, ouvrir, arrêter ; les informations, comme la position des dispositifs, remontent du CVC vers le SSI. En bas, deux cartes : ce que le règlement impose, et ce que le cahier des charges doit fixer.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .h2  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#1b3a63; }
    .lbl { font-size:16px; fill:#10233c; }
    .lb  { font-size:16px; font-weight:bold; fill:#10233c; }
    .gr  { font-size:16px; fill:#5a6b7d; }
    .big { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:44px; fill:#1b3a63; }
    .wht { font-size:16px; font-weight:bold; fill:#fff; }
  </style>

  <text class="ttl" x="400" y="30" text-anchor="middle">Deux lots, une frontière à écrire</text>
  <rect x="20" y="52" width="210" height="250" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="h2" x="125" y="84" text-anchor="middle">Lot sécurité incendie</text>
  <g>
    <rect x="55" y="120" width="140" height="100" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <rect x="75" y="136" width="100" height="34" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/>
    <circle cx="93" cy="196" r="7" fill="#1b3a63"/><circle cx="125" cy="196" r="7" fill="#1b3a63"/><circle cx="157" cy="196" r="7" fill="#1b3a63"/>
  </g>
  <text class="lb" x="125" y="250" text-anchor="middle">Centralisateur</text>
  <rect x="570" y="52" width="210" height="250" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="h2" x="675" y="84" text-anchor="middle">Lot CVC</text>
  <g><rect x="588" y="110" width="64" height="40" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
    <line x1="620" y1="110" x2="620" y2="150" stroke="#e8914a" stroke-width="6" stroke-linecap="round"></line>
  </g><text class="lb" x="676" y="136" text-anchor="start">Clapets</text>
  <g><rect x="588" y="176" width="64" height="40" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
    <line x1="594" y1="196" x2="646" y2="196" stroke="#e8914a" stroke-width="6" stroke-linecap="round"></line>
  </g><text class="lb" x="676" y="202" text-anchor="start">Volets</text>
  <g>
    <circle cx="620" cy="262" r="27" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <g>
      <ellipse cx="620" cy="250" rx="6" ry="11" fill="#e8914a" transform="rotate(0 620 262)"/>
      <ellipse cx="620" cy="250" rx="6" ry="11" fill="#e8914a" transform="rotate(90 620 262)"/>
      <ellipse cx="620" cy="250" rx="6" ry="11" fill="#e8914a" transform="rotate(180 620 262)"/>
      <ellipse cx="620" cy="250" rx="6" ry="11" fill="#e8914a" transform="rotate(270 620 262)"/>
      
    </g>
    <circle cx="620" cy="262" r="4" fill="#1b3a63"/>
  </g><text class="lb" x="676" y="268" text-anchor="start">CTA</text>

  <text class="lb" x="400" y="110" text-anchor="middle">Ordres du SSI</text>
  <line x1="236" y1="128" x2="550" y2="128" stroke="#1b3a63" stroke-width="3"/><polygon points="564,128 553,121 553,135" fill="#1b3a63"/>
  <text class="gr" x="400" y="156" text-anchor="middle">fermer · ouvrir · arrêter</text>
  <text class="lb" x="400" y="214" text-anchor="middle">Informations du CVC</text>
  <line x1="564" y1="232" x2="250" y2="232" stroke="#e8914a" stroke-width="3" stroke-dasharray="9 6"/><polygon points="236,232 247,225 247,239" fill="#1b3a63"/>
  <text class="gr" x="400" y="260" text-anchor="middle">position des dispositifs</text>

  <rect x="20" y="322" width="375" height="160" rx="14" fill="#fffdf8" stroke="#b91c1c" stroke-width="3"/>
  <text class="h2" x="207" y="350" text-anchor="middle">Le règlement impose</text>
  <text class="lbl" x="207" y="380" text-anchor="middle">Clapets télécommandés et portes</text>
    <text class="lbl" x="207" y="401" text-anchor="middle">coupe-feu : marque NF (MS 60, § 4)</text>
    <text class="lbl" x="207" y="422" text-anchor="middle">Commande : procès-verbal d'un</text>
    <text class="lbl" x="207" y="443" text-anchor="middle">laboratoire agréé (MS 60, § 4)</text>
  <rect x="405" y="322" width="375" height="160" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="h2" x="592" y="350" text-anchor="middle">Le cahier des charges fixe</text>
  <text class="lbl" x="592" y="380" text-anchor="middle">Qui fournit, qui câble, qui règle</text>
    <text class="lbl" x="592" y="401" text-anchor="middle">Contacts de position, commandes,</text>
    <text class="lbl" x="592" y="422" text-anchor="middle">arrêt des ventilations :</text>
    <text class="lbl" x="592" y="443" text-anchor="middle">lot par lot, par écrit</text>
</svg>
