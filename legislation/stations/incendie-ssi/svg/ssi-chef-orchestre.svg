<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-orch" aria-describedby="d-orch" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-orch">Le SSI : recueillir, traiter, agir</title>
  <desc id="d-orch">Trois colonnes reliées par des flèches. À gauche, recueillir : un détecteur et un déclencheur manuel. Au centre, traiter : le centralisateur de mise en sécurité. À droite, agir : cinq fonctions de mise en sécurité, compartimentage, évacuation, désenfumage, extinction automatique et arrêt de certaines installations techniques. En bas, la définition du système de sécurité incendie. L'animation fait partir une impulsion du détecteur vers le centralisateur puis vers les cinq fonctions, qui s'allument l'une après l'autre ; l'image fixe montre tout allumé.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .h2  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#1b3a63; }
    .lbl { font-size:16px; fill:#10233c; }
    .lb  { font-size:16px; font-weight:bold; fill:#10233c; }
    .gr  { font-size:16px; fill:#5a6b7d; }
    .big { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:44px; fill:#1b3a63; }
    .wht { font-size:16px; font-weight:bold; fill:#fff; }
  </style>

  <text class="ttl" x="400" y="32" text-anchor="middle">Le SSI : recueillir, traiter, agir</text>

  <rect x="20" y="60" width="215" height="320" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <rect x="290" y="60" width="200" height="320" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <rect x="545" y="60" width="235" height="320" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="h2" x="127" y="94" text-anchor="middle">1 · Recueillir</text>
  <text class="h2" x="390" y="94" text-anchor="middle">2 · Traiter</text>
  <text class="h2" x="662" y="94" text-anchor="middle">3 · Agir</text>

  <g>
    <circle cx="66" cy="180" r="22" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="66" cy="180" r="9" fill="#1b3a63"></circle>
  </g>
  <text class="lb" x="102" y="186" text-anchor="start">Détecteurs</text>
  <g>
    <rect x="44" y="268" width="44" height="44" rx="6" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <rect x="54" y="278" width="24" height="24" rx="3" fill="#b91c1c"/>
    <polyline points="60,278 67,288 63,292 71,302" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
  <text class="lb" x="102" y="284" text-anchor="start">Déclencheurs</text>
    <text class="lb" x="102" y="305" text-anchor="start">manuels</text>

  <g>
    <rect x="320" y="150" width="140" height="100" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <rect x="340" y="166" width="100" height="34" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/>
    <circle cx="358" cy="226" r="7" fill="#1b3a63"/><circle cx="390" cy="226" r="7" fill="#1b3a63"/><circle cx="422" cy="226" r="7" fill="#1b3a63"/>
  </g>
  <text class="lb" x="390" y="290" text-anchor="middle">Centralisateur de</text>
    <text class="lb" x="390" y="311" text-anchor="middle">mise en sécurité</text>
  <rect x="290" y="60" width="200" height="320" rx="14" fill="none" stroke="#b91c1c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.4;0.44;1" dur="12s" repeatCount="indefinite"/></rect>

  <line x1="235" y1="220" x2="279" y2="220" stroke="#1b3a63" stroke-width="3"/><polygon points="289,220 278,213 278,227" fill="#1b3a63"/>
  <line x1="490" y1="220" x2="534" y2="220" stroke="#1b3a63" stroke-width="3"/><polygon points="544,220 533,213 533,227" fill="#1b3a63"/>
  <circle r="8" fill="#b91c1c" stroke="#fff" stroke-width="2" opacity="0">
      <animateMotion path="M235,220 H289" dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.08;0.2;1"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.086;0.194;0.2;1" dur="12s" repeatCount="indefinite"/>
    </circle>
  <circle r="8" fill="#b91c1c" stroke="#fff" stroke-width="2" opacity="0">
      <animateMotion path="M490,220 H544" dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3;0.4;1"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.306;0.394;0.4;1" dur="12s" repeatCount="indefinite"/>
    </circle>

  <g>
    <g>
      <circle cx="574" cy="135" r="7" fill="#b91c1c"/>
      <text class="lb" x="592" y="140" text-anchor="start">Compartimentage</text>
      <animate attributeName="opacity" values="0.25;0.25;1;1" keyTimes="0;0.42;0.47;1" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="574" cy="182" r="7" fill="#b91c1c"/>
      <text class="lb" x="592" y="187" text-anchor="start">Évacuation</text>
      <animate attributeName="opacity" values="0.25;0.25;1;1" keyTimes="0;0.49;0.54;1" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="574" cy="229" r="7" fill="#b91c1c"/>
      <text class="lb" x="592" y="234" text-anchor="start">Désenfumage</text>
      <animate attributeName="opacity" values="0.25;0.25;1;1" keyTimes="0;0.56;0.61;1" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="574" cy="276" r="7" fill="#b91c1c"/>
      <text class="lb" x="592" y="281" text-anchor="start">Extinction automatique</text>
      <animate attributeName="opacity" values="0.25;0.25;1;1" keyTimes="0;0.63;0.68;1" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="574" cy="323" r="7" fill="#b91c1c"/>
      <text class="lb" x="592" y="328" text-anchor="start">Arrêt d'installations</text>
      <text class="lb" x="592" y="348" text-anchor="start">techniques</text>
      <animate attributeName="opacity" values="0.25;0.25;1;1" keyTimes="0;0.70;0.75;1" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <rect x="20" y="410" width="760" height="72" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="lb" x="400" y="438" text-anchor="middle">Le système de sécurité incendie : l'ensemble des matériels qui recueillent les informations liées à la seule</text>
    <text class="lb" x="400" y="459" text-anchor="middle">sécurité incendie, les traitent, et mettent l'établissement en sécurité.</text>
</svg>
