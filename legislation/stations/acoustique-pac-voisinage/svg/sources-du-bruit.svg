<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-src" aria-describedby="d-src" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-src">Deux chemins pour le bruit d'une unité extérieure</title>
  <desc id="d-src">Vue de côté d'une unité extérieure de pompe à chaleur posée sur un socle en béton, à côté du mur d'une maison. Le ventilateur et le compresseur sont désignés. À droite, trois arcs violets figurent le bruit aérien porté par l'air. Sous le socle et le long des deux tuyaux qui rejoignent le mur, des zigzags orange figurent le bruit solidien : les vibrations transmises à la structure.</desc>
  <style>
    .ttl  { font-weight:bold; font-size:22px; fill:#10233c; }
    .lbl  { font-size:17px; fill:#10233c; }
    .lblb { font-size:18px; font-weight:bold; fill:#1b3a63; }
    .aer  { font-size:18px; font-weight:bold; fill:#6d28d9; }
    .sol  { font-size:18px; font-weight:bold; fill:#b45309; }
    .fin  { font-size:16px; fill:#5a6b7d; }
  </style>

  <text class="ttl" x="400" y="34" text-anchor="middle">Deux chemins pour le bruit d'une unité extérieure</text>

  <!-- sol et socle -->
  <rect x="0" y="400" width="800" height="40" fill="#e6e0d4"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#5a6b7d" stroke-width="3"/>
  <rect x="240" y="380" width="280" height="20" fill="#b9c2cd" stroke="#5a6b7d" stroke-width="2"/>

  <!-- mur de la maison -->
  <rect x="40" y="110" width="70" height="290" fill="#d9dee5" stroke="#5a6b7d" stroke-width="3"/>
  <text class="fin" x="75" y="98" text-anchor="middle">Mur</text>

  <!-- unité extérieure -->
  <rect x="250" y="230" width="260" height="150" rx="10" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <rect x="270" y="285" width="80" height="80" rx="8" fill="#dfe7f1" stroke="#5a6b7d" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="430" cy="305" r="52" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <ellipse cx="430" cy="283" rx="12" ry="22" fill="#2f5689" opacity="0.8"/>
  <ellipse cx="430" cy="283" rx="12" ry="22" fill="#2f5689" opacity="0.8" transform="rotate(120 430 305)"/>
  <ellipse cx="430" cy="283" rx="12" ry="22" fill="#2f5689" opacity="0.8" transform="rotate(240 430 305)"/>
  <circle cx="430" cy="305" r="8" fill="#1b3a63"/>

  <!-- tuyaux vers le mur -->
  <line x1="110" y1="330" x2="250" y2="330" stroke="#5a6b7d" stroke-width="5"/>
  <line x1="110" y1="348" x2="250" y2="348" stroke="#1b3a63" stroke-width="5"/>
  <path d="M125,339 l10,-4 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-4"
        fill="none" stroke="#e8914a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- vibrations dans le socle et le sol -->
  <path d="M330,404 l12,10 l-24,10 l24,10 l-12,8" fill="none" stroke="#e8914a" stroke-width="4"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- bruit aérien -->
  <g fill="none" stroke="#6d28d9" stroke-width="5" stroke-linecap="round">
    <path d="M548,286 A30 30 0 0 1 548,324"/>
    <path d="M567,270 A55 55 0 0 1 567,340"/>
    <path d="M586,254 A80 80 0 0 1 586,356"/>
  </g>

  <!-- repères -->
  <g stroke="#5a6b7d" stroke-width="1.5" fill="#5a6b7d">
    <line x1="430" y1="216" x2="430" y2="253" fill="none"/><circle cx="430" cy="253" r="3.5" stroke="none"/>
    <line x1="310" y1="216" x2="310" y2="285" fill="none"/><circle cx="310" cy="285" r="3.5" stroke="none"/>
  </g>
  <text class="lblb" x="430" y="208" text-anchor="middle">Ventilateur</text>
  <text class="lblb" x="310" y="208" text-anchor="middle">Compresseur</text>
  <text class="lbl" x="180" y="318" text-anchor="middle">Tuyaux</text>
  <text class="lbl" x="380" y="468" text-anchor="middle">Vibrations par le socle</text>

  <text class="aer" x="615" y="300">Bruit aérien</text>
  <text class="lbl" x="615" y="322">porté par l'air</text>

  <text class="sol" x="560" y="440">Bruit solidien</text>
  <text class="lbl" x="560" y="462">vibrations transmises</text>
  <text class="lbl" x="560" y="484">à la structure</text>
</svg>
