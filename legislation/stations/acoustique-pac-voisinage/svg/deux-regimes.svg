<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-reg" aria-describedby="d-reg" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-reg">Deux régimes, selon l'usage de la pompe à chaleur</title>
  <desc id="d-reg">Un arbre de décision à partir de la question « Qui utilise la PAC ? ». À gauche, l'usage domestique : l'article R. 1336-5 du code de la santé publique interdit tout bruit particulier qui porte atteinte à la tranquillité du voisinage ou à la santé, sans seuil chiffré. À droite, l'usage professionnel : les articles R. 1336-6 à R. 1336-8 fixent une émergence globale limitée à 5 dB(A) le jour et 3 dB(A) la nuit plus un terme correctif, et une émergence spectrale de 7 dB puis 5 dB, recherchées si le bruit ambiant dépasse 25 dB(A) à l'intérieur ou 30 dB(A) ailleurs. En bas, une bande rappelle que le droit civil s'ajoute dans les deux cas.</desc>
  <style>
    .ttl  { font-weight:bold; font-size:22px; fill:#10233c; }
    .q    { font-weight:bold; font-size:20px; fill:#fffdf8; }
    .h    { font-weight:bold; font-size:21px; fill:#1b3a63; }
    .art  { font-weight:bold; font-size:18px; fill:#6d28d9; }
    .lbl  { font-size:17px; fill:#10233c; }
    .fin  { font-size:17px; fill:#5a6b7d; }
  </style>

  <text class="ttl" x="400" y="30" text-anchor="middle">Deux régimes, selon l'usage</text>

  <rect x="290" y="46" width="220" height="44" rx="22" fill="#1b3a63"/>
  <text class="q" x="400" y="75" text-anchor="middle">Qui utilise la PAC ?</text>
  <path d="M400,90 v22 M200,112 h400 M200,112 v22 M600,112 v22" fill="none" stroke="#5a6b7d" stroke-width="3" stroke-linejoin="round"/>

  <!-- domestique -->
  <rect x="30" y="134" width="360" height="270" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="h" x="210" y="166" text-anchor="middle">Usage domestique</text>
  <text class="fin" x="210" y="190" text-anchor="middle">maison, logement du particulier</text>
  <text class="art" x="210" y="228" text-anchor="middle">Article R. 1336-5</text>
  <text class="lbl" x="210" y="258" text-anchor="middle">Aucun bruit particulier ne doit,</text>
  <text class="lbl" x="210" y="280" text-anchor="middle">par sa durée, sa répétition ou</text>
  <text class="lbl" x="210" y="302" text-anchor="middle">son intensité, porter atteinte à</text>
  <text class="lbl" x="210" y="324" text-anchor="middle">la tranquillité du voisinage</text>
  <text class="lbl" x="210" y="346" text-anchor="middle">ou à la santé de l'homme.</text>
  <text class="lbl" x="210" y="384" text-anchor="middle" font-weight="bold">Pas de seuil chiffré dans le texte.</text>

  <!-- professionnel -->
  <rect x="410" y="134" width="360" height="270" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="h" x="590" y="166" text-anchor="middle">Usage professionnel</text>
  <text class="fin" x="590" y="190" text-anchor="middle">commerce, bureau, activité artisanale</text>
  <text class="art" x="590" y="228" text-anchor="middle">Articles R. 1336-6 à R. 1336-8</text>
  <text class="lbl" x="590" y="256" text-anchor="middle">Émergence globale : 5 dB(A) le jour,</text>
  <text class="lbl" x="590" y="277" text-anchor="middle">3 dB(A) la nuit, plus un terme correctif.</text>
  <text class="lbl" x="590" y="304" text-anchor="middle">Pièces principales, émergence spectrale :</text>
  <text class="lbl" x="590" y="325" text-anchor="middle">7 dB (125 et 250 Hz), 5 dB (500 à 4 000 Hz).</text>
  <text class="lbl" x="590" y="352" text-anchor="middle">Recherchée si le bruit ambiant dépasse</text>
  <text class="lbl" x="590" y="373" text-anchor="middle">25 dB(A) à l'intérieur, 30 dB(A) ailleurs.</text>

  <!-- civil -->
  <rect x="30" y="420" width="740" height="68" rx="14" fill="#f4ecfa" stroke="#6d28d9" stroke-width="2.5"/>
  <text class="lbl" x="400" y="449" text-anchor="middle" font-weight="bold">Dans les deux cas, le droit civil s'ajoute :</text>
  <text class="lbl" x="400" y="472" text-anchor="middle">trouble anormal de voisinage, responsabilité de plein droit (Code civil, art. 1253)</text>
</svg>
