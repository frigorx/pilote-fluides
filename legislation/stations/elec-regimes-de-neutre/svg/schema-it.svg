  <path d="M800,146 L791,155.12 L807,159.92 L798,170" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="655" y="80" text-anchor="middle">Machine A</text>
  <text class="h" x="815" y="80" text-anchor="middle">Machine B</text>
  <path d="M660,200 V270 H820 V200" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M740,270 V340" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M734,340 H746 V395 L740,405 L734,395 Z" fill="#c9c2b3" stroke="#5a6b7d" stroke-width="2"/>
  <text class="l" x="740" y="250" text-anchor="middle">Masses reliées</text>
  <text class="lb" x="725" y="300" text-anchor="end">Court-circuit</text>
  <text class="lb" x="725" y="322" text-anchor="end">entre deux phases</text>

  <path d="M600,120 L603.0,120.0" stroke="#b45309" stroke-width="2" marker-end="url(#fl-it)"/><path d="M740,270 L743.0,270.0" stroke="#b45309" stroke-width="2" marker-end="url(#fl-it)"/><path d="M700,170 L697.0,170.0" stroke="#b45309" stroke-width="2" marker-end="url(#fl-it)"/>

  <!-- légende : l'épaisseur dit l'intensité -->
