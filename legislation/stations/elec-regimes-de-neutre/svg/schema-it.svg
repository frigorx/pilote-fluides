  <text class="l" x="105" y="521" text-anchor="start">Courant de défaut faible</text>
  <path d="M400,515 H460" fill="none" stroke="#e8914a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <text class="l" x="475" y="521" text-anchor="start">Court-circuit : forte intensité</text>
  
