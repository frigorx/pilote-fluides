  <circle r="6.5" fill="#c0392b" stroke="#10233c" stroke-width="1.5" opacity="0">
    <animateMotion dur="13s" repeatCount="indefinite" calcMode="linear" path="M570,120 H635 V150 H660 V270 H820 V146 H800 V170 H570" keyPoints="0;0;1;1" keyTimes="0;0.580;0.880;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.580;0.590;0.870;0.880;1" dur="13s" repeatCount="indefinite"/>
