  <path d="M380,340 V430 H190 V340" fill="none" stroke="#e8914a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" stroke-dasharray="12 9"/>
  <path d="M190,340 V170 H110" fill="none" stroke="#e8914a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <path d="M110,120 H300 M110,170 H300" fill="none" stroke="#1b3a63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M70,190 V240" fill="none" stroke="#1b3a63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="40" y="240" width="60" height="36" rx="6" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
