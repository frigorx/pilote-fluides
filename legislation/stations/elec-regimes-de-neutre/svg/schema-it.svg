  <rect x="20" y="340" width="410" height="130" rx="6" fill="#efe6d5" stroke="#d8c9a8" stroke-width="2"/>
  <text class="m" x="420" y="362" text-anchor="end">Sol</text>
  <rect x="30" y="100" width="80" height="90" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <circle cx="58" cy="153" r="20" fill="none" stroke="#1b3a63" stroke-width="3"/>
  <circle cx="82" cy="153" r="20" fill="none" stroke="#1b3a63" stroke-width="3"/>
  <text class="lb" x="70" y="88" text-anchor="middle">Poste</text>

  <rect x="300" y="90" width="110" height="110" rx="8" fill="#fffdf8" stroke="#5a6b7d" stroke-width="6"/>
  <path d="M110,120 H330" fill="none" stroke="#e8914a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
