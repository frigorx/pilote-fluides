<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img"
     aria-labelledby="t-it" aria-describedby="d-it" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-it">Régime IT : le premier défaut est signalé, le second est coupé</title>
  <desc id="d-it">Deux schémas côte à côte. À gauche, premier défaut : le neutre du poste est isolé de la terre et surveillé par un contrôleur permanent d'isolement, le CPI, qui porte un voyant d'alarme allumé. Un éclair marque le défaut entre une phase et la carcasse d'une machine. Un mince trait orange suit le courant : par le conducteur de protection, la terre, puis les fuites d'isolement du réseau ; ce courant est faible et le circuit n'est pas coupé. À droite, deuxième défaut : deux machines, A et B, ont chacune un défaut sur une phase différente et leurs masses sont reliées entre elles. Un gros trait orange forme une boucle entre les deux phases par les masses : c'est un court-circuit, qui déclenche la protection.</desc>
  <style>
    .t { font:bold 22px 'Trebuchet MS',Calibri,sans-serif; fill:#10233c; }
    .h { font:bold 20px 'Trebuchet MS',Calibri,sans-serif; fill:#1b3a63; }
    .l { font:17px Calibri,'Segoe UI',sans-serif; fill:#10233c; }
    .lb { font:bold 17px Calibri,'Segoe UI',sans-serif; fill:#10233c; }
    .m { font:16px Calibri,'Segoe UI',sans-serif; fill:#5a6b7d; }
    .big { font:bold 60px 'Trebuchet MS',Calibri,sans-serif; fill:#a16207; }
    .w { font:bold 30px 'Trebuchet MS',Calibri,sans-serif; fill:#fffdf8; }
  </style>
  <defs>
