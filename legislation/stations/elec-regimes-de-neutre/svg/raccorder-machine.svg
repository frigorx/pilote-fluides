<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" role="img"
     aria-labelledby="t-rac" aria-describedby="d-rac" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-rac">Raccorder une machine : ce que change le régime de neutre</title>
  <desc id="d-rac">Trois cartes côte à côte, une par régime. La carte TT montre l'anneau d'un dispositif différentiel autour de deux conducteurs : c'est lui qui coupe, immédiatement, au premier défaut ; le technicien relie la masse au conducteur de protection et contrôle le différentiel. La carte TN montre un fusible : le disjoncteur ou le fusible coupe, car le défaut est un court-circuit ; le technicien relie la masse au conducteur de protection et vérifie le déclenchement. La carte IT montre le contrôleur permanent d'isolement avec son voyant : au premier défaut, une alarme et pas de coupure ; le technicien relie la masse au conducteur de protection et signale toute alarme.</desc>
  <style>
    .t { font:bold 22px 'Trebuchet MS',Calibri,sans-serif; fill:#10233c; }
    .h { font:bold 20px 'Trebuchet MS',Calibri,sans-serif; fill:#1b3a63; }
    .l { font:17px Calibri,'Segoe UI',sans-serif; fill:#10233c; }
    .lb { font:bold 17px Calibri,'Segoe UI',sans-serif; fill:#10233c; }
    .m { font:16px Calibri,'Segoe UI',sans-serif; fill:#5a6b7d; }
    .big { font:bold 60px 'Trebuchet MS',Calibri,sans-serif; fill:#a16207; }
    .w { font:bold 30px 'Trebuchet MS',Calibri,sans-serif; fill:#fffdf8; }
  </style>
  <defs>
    <marker id="fl-rac" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#b45309" stroke="#10233c" stroke-width="1"/>
    </marker>
  </defs>

  
  <rect x="20" y="20" width="260" height="490" rx="16" fill="#fffdf8" stroke="#a16207" stroke-width="3"/>
  <path d="M20,60 V36 a16,16 0 0 1 16,-16 h228 a16,16 0 0 1 16,16 V60 z" fill="#a16207"/>
  <text class="w" x="150" y="52" text-anchor="middle">TT</text>
  
  <circle cx="150" cy="130" r="32" fill="none" stroke="#1b3a63" stroke-width="7"/>
  <path d="M140,92 V170 M160,92 V170" fill="none" stroke="#2f5689" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M36,200 H264" fill="none" stroke="#d6dee7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="lb" x="36" y="226" text-anchor="start">Qui coupe ?</text>
  <text class="l" x="36" y="252" text-anchor="start">Le différentiel</text>
  <path d="M36,312 H264" fill="none" stroke="#d6dee7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="lb" x="36" y="338" text-anchor="start">Au premier défaut</text>
  <text class="l" x="36" y="364" text-anchor="start">Coupure immédiate</text>
  <path d="M36,410 H264" fill="none" stroke="#d6dee7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="lb" x="36" y="436" text-anchor="start">Votre geste</text>
  <text class="l" x="36" y="462" text-anchor="start">Relier la masse au PE ;</text>
  <text class="l" x="36" y="484" text-anchor="start">contrôler le différentiel</text>
  
  <rect x="300" y="20" width="260" height="490" rx="16" fill="#fffdf8" stroke="#a16207" stroke-width="3"/>
  <path d="M300,60 V36 a16,16 0 0 1 16,-16 h228 a16,16 0 0 1 16,16 V60 z" fill="#a16207"/>
  <text class="w" x="430" y="52" text-anchor="middle">TN</text>
  
  <path d="M360,130 H390 M470,130 H500" fill="none" stroke="#2f5689" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="390" y="112" width="80" height="36" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="5"/>
  <path d="M390,130 H470" fill="none" stroke="#1b3a63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M316,200 H544" fill="none" stroke="#d6dee7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="lb" x="316" y="226" text-anchor="start">Qui coupe ?</text>
  <text class="l" x="316" y="252" text-anchor="start">Disjoncteur ou fusible</text>
  <path d="M316,312 H544" fill="none" stroke="#d6dee7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="lb" x="316" y="338" text-anchor="start">Au premier défaut</text>
  <text class="l" x="316" y="364" text-anchor="start">Coupure : le défaut</text>
  <text class="l" x="316" y="386" text-anchor="start">est un court-circuit</text>
  <path d="M316,410 H544" fill="none" stroke="#d6dee7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="lb" x="316" y="436" text-anchor="start">Votre geste</text>
  <text class="l" x="316" y="462" text-anchor="start">Relier la masse au PE ;</text>
  <text class="l" x="316" y="484" text-anchor="start">vérifier le déclenchement</text>
  
  <rect x="580" y="20" width="260" height="490" rx="16" fill="#fffdf8" stroke="#a16207" stroke-width="3"/>
  <path d="M580,60 V36 a16,16 0 0 1 16,-16 h228 a16,16 0 0 1 16,16 V60 z" fill="#a16207"/>
  <text class="w" x="710" y="52" text-anchor="middle">IT</text>
  
  <rect x="648" y="108" width="52" height="44" rx="6" fill="#fffdf8" stroke="#1b3a63" stroke-width="4"/>
  <text class="lb" x="674" y="136" text-anchor="middle">CPI</text>
  <path d="M700,130 H718" fill="none" stroke="#2f5689" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="744" cy="130" r="15" fill="#e8914a" stroke="#10233c" stroke-width="3"/>
  <path d="M718,130 h6 M764,130 h6 M744,104 v6 M744,150 v6" fill="none" stroke="#e8914a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M596,200 H824" fill="none" stroke="#d6dee7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="lb" x="596" y="226" text-anchor="start">Qui coupe ?</text>
  <text class="l" x="596" y="252" text-anchor="start">Personne au 1er défaut,</text>
  <text class="l" x="596" y="274" text-anchor="start">les protections au 2e</text>
  <path d="M596,312 H824" fill="none" stroke="#d6dee7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="lb" x="596" y="338" text-anchor="start">Au premier défaut</text>
  <text class="l" x="596" y="364" text-anchor="start">Alarme du CPI,</text>
  <text class="l" x="596" y="386" text-anchor="start">pas de coupure</text>
  <path d="M596,410 H824" fill="none" stroke="#d6dee7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="lb" x="596" y="436" text-anchor="start">Votre geste</text>
  <text class="l" x="596" y="462" text-anchor="start">Relier la masse au PE ;</text>
  <text class="l" x="596" y="484" text-anchor="start">signaler toute alarme</text>
</svg>
