<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
     aria-labelledby="t-bilan" aria-describedby="d-bilan" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-bilan">Bilan : durer, se réparer, consommer moins, et l'étiquette comme repère</title>
  <desc id="d-bilan">Trois cartes en haut — durer, se réparer, consommer moins — reliées par des
    flèches à un encadré central « L'appareil ». Une flèche part de cet encadré vers une
    étiquette énergie schématique à droite, portant la mention « repère du client, avant
    l'achat ». Une bande en bas résume les trois piliers de l'écoconception.</desc>
  <defs>
    <marker id="fl-bilan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <style>
    .hd  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
    .app { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#1b3a63; }
    .lb  { font-size:15px; fill:#10233c; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
  </style>

  <!-- trois piliers -->
  <rect x="20" y="20" width="170" height="70" rx="12" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
  <text class="hd" x="105" y="61" text-anchor="middle">DURER</text>

  <rect x="215" y="20" width="170" height="70" rx="12" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
  <text class="hd" x="300" y="61" text-anchor="middle">SE RÉPARER</text>

  <rect x="410" y="20" width="220" height="70" rx="12" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
  <text class="hd" x="520" y="61" text-anchor="middle">CONSOMMER MOINS</text>

  <!-- flèches vers l'appareil -->
  <line x1="105" y1="90" x2="270" y2="148" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#fl-bilan)"/>
  <line x1="300" y1="90" x2="320" y2="148" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#fl-bilan)"/>
  <line x1="520" y1="90" x2="380" y2="148" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#fl-bilan)"/>

  <!-- appareil -->
  <rect x="220" y="150" width="200" height="80" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="app" x="320" y="196" text-anchor="middle">L'APPAREIL</text>

  <!-- flèche vers étiquette -->
  <line x1="420" y1="190" x2="590" y2="190" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#fl-bilan)"/>

  <!-- étiquette énergie miniature -->
  <rect x="610" y="130" width="220" height="20" fill="#047857"/>
  <rect x="610" y="152" width="185" height="20" fill="#7a9a3a"/>
  <rect x="610" y="174" width="150" height="20" fill="#c98a2e"/>
  <rect x="610" y="196" width="115" height="20" fill="#c0392b"/>
  <text class="lb" x="720" y="240" text-anchor="middle" font-weight="bold">Repère du client</text>
  <text class="lb" x="720" y="258" text-anchor="middle">avant l'achat</text>

  <!-- bande résumé -->
  <rect x="20" y="300" width="860" height="60" rx="14" fill="#e6f2f0" stroke="#047857" stroke-width="2"/>
  <text class="band" x="450" y="336" text-anchor="middle">Durer · se réparer · consommer moins — et l'étiquette comme repère</text>
</svg>
