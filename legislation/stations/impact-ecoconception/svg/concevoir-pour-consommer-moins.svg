<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
     aria-labelledby="t-conso" aria-describedby="d-conso" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-conso">Concevoir pour consommer moins : trois leviers</title>
  <desc id="d-conso">Trois cartes en haut, chacune avec une icône. « Dimensionnement juste » :
    un cadran avec une aiguille pointée sur une zone centrale verte, encadrée par deux zones
    grises « trop petit » et « trop grand ». « Régulation efficace » : un thermostat représenté
    par un cercle avec un curseur. « Isolation soignée » : une coupe de mur avec une couche
    hachurée entre deux parois. Trois flèches descendent de ces cartes vers un encadré final
    « Consommation réduite sur la vie de l'appareil ».</desc>
  <defs>
    <marker id="fl-conso" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <style>
    .hd  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:15.5px; fill:#10233c; }
    .lb  { font-size:15px; fill:#5a6b7d; }
    .lbz { font-size:14px; fill:#5a6b7d; }
    .out { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#047857; }
  </style>

  <!-- carte 1 : dimensionnement juste -->
  <rect x="20" y="20" width="260" height="220" rx="12" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
  <text class="hd" x="150" y="46" text-anchor="middle">DIMENSIONNEMENT JUSTE</text>
  <path d="M60,150 A90,90 0 0 1 240,150" fill="none" stroke="#d6dee7" stroke-width="20"/>
  <path d="M108,128 A60,60 0 0 1 192,128" fill="none" stroke="#047857" stroke-width="20"/>
  <line x1="150" y1="150" x2="150" y2="95" stroke="#10233c" stroke-width="3"/>
  <circle cx="150" cy="150" r="6" fill="#10233c"/>
  <text class="lbz" x="65" y="175" text-anchor="middle">trop petit</text>
  <text class="lbz" x="150" y="90" text-anchor="middle" fill="#047857" font-weight="bold">juste</text>
  <text class="lbz" x="235" y="175" text-anchor="middle">trop grand</text>

  <!-- carte 2 : régulation efficace -->
  <rect x="320" y="20" width="260" height="220" rx="12" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
  <text class="hd" x="450" y="46" text-anchor="middle">RÉGULATION EFFICACE</text>
  <circle cx="450" cy="150" r="55" fill="none" stroke="#1b3a63" stroke-width="4"/>
  <circle cx="450" cy="150" r="8" fill="#1b3a63"/>
  <line x1="450" y1="150" x2="486" y2="118" stroke="#1b3a63" stroke-width="4"/>
  <path d="M450,95 A55,55 0 0 1 490,120" fill="none" stroke="#047857" stroke-width="6"/>
  <text class="lb" x="450" y="228" text-anchor="middle">ajuste le fonctionnement au besoin</text>

  <!-- carte 3 : isolation soignée -->
  <rect x="620" y="20" width="260" height="220" rx="12" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
  <text class="hd" x="750" y="46" text-anchor="middle">ISOLATION SOIGNÉE</text>
  <rect x="670" y="95" width="20" height="120" fill="#1b3a63"/>
  <rect x="690" y="95" width="70" height="120" fill="#fffdf8" stroke="#047857" stroke-width="2"/>
  <line x1="700" y1="105" x2="750" y2="155" stroke="#047857" stroke-width="2"/>
  <line x1="700" y1="130" x2="750" y2="180" stroke="#047857" stroke-width="2"/>
  <line x1="700" y1="155" x2="750" y2="205" stroke="#047857" stroke-width="2"/>
  <line x1="700" y1="180" x2="735" y2="215" stroke="#047857" stroke-width="2"/>
  <rect x="760" y="95" width="20" height="120" fill="#1b3a63"/>
  <text class="lb" x="750" y="228" text-anchor="middle">limite les déperditions</text>

  <!-- flèches vers le résultat -->
  <line x1="150" y1="240" x2="400" y2="288" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#fl-conso)"/>
  <line x1="450" y1="240" x2="450" y2="288" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#fl-conso)"/>
  <line x1="750" y1="240" x2="500" y2="288" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#fl-conso)"/>

  <rect x="270" y="292" width="360" height="70" rx="14" fill="#e6f2f0" stroke="#047857" stroke-width="2.5"/>
  <text class="out" x="450" y="322" text-anchor="middle">Consommation réduite</text>
  <text class="out" x="450" y="346" text-anchor="middle" font-size="15px">sur toute la vie de l'appareil</text>
</svg>
