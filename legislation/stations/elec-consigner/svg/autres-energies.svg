<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-nrj" aria-describedby="d-nrj" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-nrj">Trois énergies à consigner sur un groupe extérieur</title>
  <desc id="d-nrj">À gauche, trois cartes empilées : électrique (sectionneur ouvert et condamné, tension vérifiée absente), fluidique (vannes fermées, purge ouverte, absence de pression vérifiée), mécanique (pales immobilisées, masses calées, ressorts détendus). À droite, un circuit de fluide horizontal avec deux vannes fermées ; entre elles, une branche verticale porte une vanne de purge ouverte, dont le fluide est récupéré, et une autre branche descend vers un manomètre dont l'aiguille est revenue à zéro. Une bande rappelle que couper l'électricité ne consigne ni le fluide ni les pièces mobiles. L'animation ferme les vannes, ouvre la purge et fait retomber l'aiguille ; l'image fixe montre l'état final.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .lb  { font-size:17px; fill:#10233c; }
    .lbb { font-size:17px; font-weight:bold; fill:#10233c; }
    .m   { font-size:18px; font-weight:bold; fill:#10233c; }
    .sm  { font-size:16px; fill:#5a6b7d; }
    .num { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:30px; fill:#ffffff; }
  </style>
  <rect width="800" height="500" fill="#fffdf8"/>
<text class="ttl" x="400" y="36" text-anchor="middle">Trois énergies, un seul groupe extérieur</text><rect x="30" y="70" width="320" height="90" rx="12" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><circle cx="68" cy="115" r="26" fill="#f4eadb" stroke="#a16207" stroke-width="3"/><polygon points="74,97 60,118 68,118 63,134 78,112 70,112" fill="#a16207"/><text class="h" x="108" y="100" text-anchor="start">Électrique</text><text class="sm" x="108" y="124" text-anchor="start">sectionneur ouvert, condamné,</text><text class="sm" x="108" y="144" text-anchor="start">tension vérifiée absente</text><rect x="30" y="175" width="320" height="90" rx="12" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><circle cx="68" cy="220" r="26" fill="#f4eadb" stroke="#a16207" stroke-width="3"/><path d="M68,203 q-13,16 -13,24 a13,13 0 0 0 26,0 q0,-8 -13,-24 z" fill="#a16207"/><text class="h" x="108" y="205" text-anchor="start">Fluidique</text><text class="sm" x="108" y="229" text-anchor="start">vannes fermées, purge ouverte,</text><text class="sm" x="108" y="249" text-anchor="start">absence de pression vérifiée</text><rect x="30" y="280" width="320" height="90" rx="12" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><circle cx="68" cy="325" r="26" fill="#f4eadb" stroke="#a16207" stroke-width="3"/><ellipse cx="68" cy="314" rx="5" ry="10" fill="#a16207" transform="rotate(0 68 325)"/><ellipse cx="68" cy="314" rx="5" ry="10" fill="#a16207" transform="rotate(90 68 325)"/><ellipse cx="68" cy="314" rx="5" ry="10" fill="#a16207" transform="rotate(180 68 325)"/><ellipse cx="68" cy="314" rx="5" ry="10" fill="#a16207" transform="rotate(270 68 325)"/><circle cx="68" cy="325" r="4" fill="#1b3a63"/><text class="h" x="108" y="310" text-anchor="start">Mécanique</text><text class="sm" x="108" y="334" text-anchor="start">pales immobilisées, masses</text><text class="sm" x="108" y="354" text-anchor="start">calées, ressorts détendus</text><rect x="380" y="70" width="390" height="335" rx="14" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><text class="h" x="575" y="98" text-anchor="middle">Consignation fluidique</text><line x1="400" y1="185" x2="470" y2="185" stroke="#e8914a" stroke-width="7" stroke-linecap="round"/><line x1="710" y1="185" x2="750" y2="185" stroke="#e8914a" stroke-width="7" stroke-linecap="round"/><line x1="530" y1="185" x2="650" y2="185" stroke="#b9c6d3" stroke-width="7" stroke-linecap="round"><animate attributeName="stroke" values="#e8914a;#e8914a;#b9c6d3;#b9c6d3" keyTimes="0;0.30;0.55;1" dur="14s" repeatCount="indefinite"/></line><line x1="590" y1="185" x2="590" y2="110" stroke="#b9c6d3" stroke-width="7" stroke-linecap="round"/><line x1="590" y1="185" x2="590" y2="256" stroke="#b9c6d3" stroke-width="7" stroke-linecap="round"/><polygon points="484,171 500,185 484,199" fill="#1b3a63" stroke="#1b3a63" stroke-width="3" stroke-linejoin="round"><animate attributeName="fill" values="#fffdf8;#fffdf8;#1b3a63;#1b3a63" keyTimes="0;0.05;0.15;1" dur="14s" repeatCount="indefinite"/></polygon><polygon points="516,171 500,185 516,199" fill="#1b3a63" stroke="#1b3a63" stroke-width="3" stroke-linejoin="round"><animate attributeName="fill" values="#fffdf8;#fffdf8;#1b3a63;#1b3a63" keyTimes="0;0.05;0.15;1" dur="14s" repeatCount="indefinite"/></polygon><polygon points="664,171 680,185 664,199" fill="#1b3a63" stroke="#1b3a63" stroke-width="3" stroke-linejoin="round"><animate attributeName="fill" values="#fffdf8;#fffdf8;#1b3a63;#1b3a63" keyTimes="0;0.05;0.15;1" dur="14s" repeatCount="indefinite"/></polygon><polygon points="696,171 680,185 696,199" fill="#1b3a63" stroke="#1b3a63" stroke-width="3" stroke-linejoin="round"><animate attributeName="fill" values="#fffdf8;#fffdf8;#1b3a63;#1b3a63" keyTimes="0;0.05;0.15;1" dur="14s" repeatCount="indefinite"/></polygon><polygon points="576,120 590,135 604,120" fill="#fffdf8" stroke="#1b3a63" stroke-width="3" stroke-linejoin="round"><animate attributeName="fill" values="#1b3a63;#1b3a63;#fffdf8;#fffdf8" keyTimes="0;0.25;0.30;1" dur="14s" repeatCount="indefinite"/></polygon><polygon points="576,150 590,135 604,150" fill="#fffdf8" stroke="#1b3a63" stroke-width="3" stroke-linejoin="round"><animate attributeName="fill" values="#1b3a63;#1b3a63;#fffdf8;#fffdf8" keyTimes="0;0.25;0.30;1" dur="14s" repeatCount="indefinite"/></polygon><g><text class="lbb" x="500" y="228" text-anchor="middle">Vanne fermée</text><text class="lbb" x="680" y="228" text-anchor="middle">Vanne fermée</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.20;1" dur="14s" repeatCount="indefinite"/></g><g><text class="lbb" x="612" y="132" text-anchor="start">Purge : fluide</text><text class="lbb" x="612" y="154" text-anchor="start">récupéré</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.36;1" dur="14s" repeatCount="indefinite"/></g><circle cx="590" cy="300" r="44" fill="#ffffff" stroke="#1b3a63" stroke-width="3"/><text class="lbb" x="546" y="342" text-anchor="middle">0</text><g><line x1="590" y1="300" x2="565" y2="325" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" values="180 590 300;180 590 300;0 590 300;0 590 300" keyTimes="0;0.20;0.55;1" dur="14s" repeatCount="indefinite"/></g><circle cx="590" cy="300" r="5" fill="#1b3a63"/><text class="lbb" x="590" y="392" text-anchor="middle">Manomètre</text><g><rect x="30" y="425" width="740" height="56" rx="14" fill="#fff4e0" stroke="#c9451a" stroke-width="2" stroke-dasharray="8 5"/><text class="m" x="400" y="459" text-anchor="middle">Couper l'électricité ne consigne ni le fluide, ni les pièces mobiles.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.70;0.76;1" dur="14s" repeatCount="indefinite"/></g>
</svg>
