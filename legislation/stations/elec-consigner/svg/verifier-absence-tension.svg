<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-vat" aria-describedby="d-vat" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-vat">La vérification d'absence de tension en trois temps</title>
  <desc id="d-vat">Trois vignettes côte à côte, chacune avec un vérificateur d'absence de tension dont le voyant est en haut. Première vignette : le vérificateur est contrôlé sur une source connue, son voyant est allumé. Deuxième vignette : il est appliqué sur chaque conducteur, L1, L2, L3 et neutre ; le voyant reste éteint et une coche verte marque chaque conducteur vérifié. Troisième vignette : le vérificateur est contrôlé de nouveau sur la source connue, voyant allumé. Une bande en bas rappelle qu'il faut un vérificateur conçu pour cela et non un voltmètre ou un tournevis testeur, sur chaque conducteur actif, neutre compris. L'animation déroule les trois temps ; l'image fixe montre tout.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .lb  { font-size:17px; fill:#10233c; }
    .lbb { font-size:17px; font-weight:bold; fill:#10233c; }
    .m   { font-size:18px; font-weight:bold; fill:#10233c; }
    .sm  { font-size:16px; fill:#5a6b7d; }
    .num { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:30px; fill:#ffffff; }
  </style>
  <rect width="800" height="500" fill="#fffdf8"/>
<text class="ttl" x="400" y="36" text-anchor="middle">Vérifier l'absence de tension (VAT)</text><g><rect x="20" y="60" width="230" height="320" rx="12" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><text class="h" x="135" y="92" text-anchor="middle">1 · Contrôler</text><rect x="107" y="130" width="56" height="110" rx="10" fill="#1b3a63" stroke="#1b3a63" stroke-width="2"/><circle cx="135" cy="158" r="14" fill="#ffd08a" stroke="#e8914a" stroke-width="3"/><text class="lbb" x="135" y="120" text-anchor="middle">voyant allumé</text><line x1="121" y1="240" x2="105" y2="286" stroke="#5a6b7d" stroke-width="4" stroke-linecap="round"/><line x1="149" y1="240" x2="165" y2="286" stroke="#5a6b7d" stroke-width="4" stroke-linecap="round"/><circle cx="105" cy="288" r="4" fill="#5a6b7d"/><circle cx="165" cy="288" r="4" fill="#5a6b7d"/><rect x="70" y="302" width="130" height="30" rx="6" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><text class="lb" x="135" y="324" text-anchor="middle">Source connue</text><text class="lb" x="135" y="366" text-anchor="middle">sur une source connue</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.10;1" dur="14s" repeatCount="indefinite"/></g><g><rect x="285" y="60" width="230" height="320" rx="12" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><text class="h" x="400" y="92" text-anchor="middle">2 · Vérifier</text><rect x="372" y="130" width="56" height="110" rx="10" fill="#1b3a63" stroke="#1b3a63" stroke-width="2"/><circle cx="400" cy="158" r="14" fill="#fffdf8" stroke="#8aa0b6" stroke-width="3"/><text class="lbb" x="400" y="120" text-anchor="middle">voyant éteint</text><line x1="386" y1="240" x2="370" y2="286" stroke="#5a6b7d" stroke-width="4" stroke-linecap="round"/><line x1="414" y1="240" x2="430" y2="286" stroke="#5a6b7d" stroke-width="4" stroke-linecap="round"/><circle cx="370" cy="288" r="4" fill="#5a6b7d"/><circle cx="430" cy="288" r="4" fill="#5a6b7d"/><rect x="314" y="296" width="40" height="28" rx="6" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><text class="lbb" x="334" y="316" text-anchor="middle">L1</text><rect x="360" y="296" width="40" height="28" rx="6" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><text class="lbb" x="380" y="316" text-anchor="middle">L2</text><rect x="406" y="296" width="40" height="28" rx="6" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><text class="lbb" x="426" y="316" text-anchor="middle">L3</text><rect x="452" y="296" width="40" height="28" rx="6" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><text class="lbb" x="472" y="316" text-anchor="middle">N</text><text class="lb" x="400" y="366" text-anchor="middle">phases et neutre</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.38;1" dur="14s" repeatCount="indefinite"/></g><g><rect x="550" y="60" width="230" height="320" rx="12" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><text class="h" x="665" y="92" text-anchor="middle">3 · Contrôler</text><rect x="637" y="130" width="56" height="110" rx="10" fill="#1b3a63" stroke="#1b3a63" stroke-width="2"/><circle cx="665" cy="158" r="14" fill="#ffd08a" stroke="#e8914a" stroke-width="3"/><text class="lbb" x="665" y="120" text-anchor="middle">voyant allumé</text><line x1="651" y1="240" x2="635" y2="286" stroke="#5a6b7d" stroke-width="4" stroke-linecap="round"/><line x1="679" y1="240" x2="695" y2="286" stroke="#5a6b7d" stroke-width="4" stroke-linecap="round"/><circle cx="635" cy="288" r="4" fill="#5a6b7d"/><circle cx="695" cy="288" r="4" fill="#5a6b7d"/><rect x="600" y="302" width="130" height="30" rx="6" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><text class="lb" x="665" y="324" text-anchor="middle">Source connue</text><text class="lb" x="665" y="366" text-anchor="middle">de nouveau</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.60;0.66;1" dur="14s" repeatCount="indefinite"/></g><g><path d="M326,338 l6,7 l12,-14" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.40;0.43;1" dur="14s" repeatCount="indefinite"/></g><g><path d="M372,338 l6,7 l12,-14" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.48;1" dur="14s" repeatCount="indefinite"/></g><g><path d="M418,338 l6,7 l12,-14" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.53;1" dur="14s" repeatCount="indefinite"/></g><g><path d="M464,338 l6,7 l12,-14" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.58;1" dur="14s" repeatCount="indefinite"/></g><g><rect x="20" y="400" width="760" height="80" rx="14" fill="#fff4e0" stroke="#c9451a" stroke-width="2" stroke-dasharray="8 5"/><text class="m" x="400" y="432" text-anchor="middle">Ni voltmètre, ni tournevis testeur : un vérificateur d'absence de tension</text><text class="m" x="400" y="460" text-anchor="middle">conçu pour cela, sur chaque conducteur actif, neutre compris.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.92;1" dur="14s" repeatCount="indefinite"/></g>
</svg>
