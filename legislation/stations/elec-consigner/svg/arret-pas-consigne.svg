<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img"
     aria-labelledby="t-arret" aria-describedby="d-arret" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-arret">Arrêté ne veut pas dire hors tension</title>
  <desc id="d-arret">Schéma de principe de gauche à droite. Le réseau alimente, par un trait orange qui signifie sous tension, un sectionneur représenté fermé, puis un groupe extérieur. Dans le groupe, le trait orange s'arrête devant un contacteur ouvert ; au-delà, le trait est gris, hors tension, jusqu'au compresseur. En bas du groupe, un bouton d'arrêt est enfoncé et son voyant est éteint. Une bande rappelle que le bouton a coupé la commande, pas l'alimentation : en amont du contacteur, tout reste sous tension. Image fixe.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .lb  { font-size:17px; fill:#10233c; }
    .lbb { font-size:17px; font-weight:bold; fill:#10233c; }
    .m   { font-size:18px; font-weight:bold; fill:#10233c; }
    .sm  { font-size:16px; fill:#5a6b7d; }
    .num { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:30px; fill:#ffffff; }
  </style>
  <rect width="800" height="460" fill="#fffdf8"/>
<text class="ttl" x="400" y="36" text-anchor="middle">Arrêté ne veut pas dire hors tension</text><rect x="30" y="140" width="120" height="110" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><text class="h" x="90" y="202" text-anchor="middle">Réseau</text><line x1="150" y1="195" x2="215" y2="195" stroke="#e8914a" stroke-width="7" stroke-linecap="round"/><rect x="215" y="160" width="90" height="70" rx="12" fill="#ffffff" stroke="#1b3a63" stroke-width="3"/><line x1="225" y1="195" x2="295" y2="195" stroke="#e8914a" stroke-width="7" stroke-linecap="round"/><circle cx="225" cy="195" r="6" fill="#1b3a63"/><circle cx="295" cy="195" r="6" fill="#1b3a63"/><text class="lbb" x="260" y="262" text-anchor="middle">Sectionneur fermé</text><line x1="305" y1="195" x2="470" y2="195" stroke="#e8914a" stroke-width="7" stroke-linecap="round"/><rect x="400" y="100" width="370" height="230" rx="14" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><line x1="305" y1="195" x2="470" y2="195" stroke="#e8914a" stroke-width="7" stroke-linecap="round"/><text class="h" x="585" y="130" text-anchor="middle">Groupe extérieur</text><circle cx="470" cy="195" r="6" fill="#1b3a63"/><circle cx="510" cy="195" r="6" fill="#1b3a63"/><line x1="470" y1="195" x2="505" y2="172" stroke="#1b3a63" stroke-width="5" stroke-linecap="round"/><text class="lbb" x="490" y="160" text-anchor="middle">Contacteur ouvert</text><line x1="510" y1="195" x2="600" y2="195" stroke="#b9c6d3" stroke-width="7" stroke-linecap="round"/><rect x="600" y="165" width="140" height="60" rx="8" fill="#ffffff" stroke="#5a6b7d" stroke-width="3"/><text class="lb" x="670" y="201" text-anchor="middle">Compresseur</text><circle cx="450" cy="285" r="18" fill="#c9d3de" stroke="#5a6b7d" stroke-width="3"/><text class="lb" x="478" y="291" text-anchor="start">Bouton arrêt enfoncé</text><circle cx="690" cy="285" r="10" fill="#ffffff" stroke="#5a6b7d" stroke-width="3"/><text class="lb" x="690" y="318" text-anchor="middle">voyant éteint</text><line x1="40" y1="300" x2="80" y2="300" stroke="#e8914a" stroke-width="7" stroke-linecap="round"/><text class="lb" x="92" y="306" text-anchor="start">Sous tension</text><line x1="230" y1="300" x2="270" y2="300" stroke="#b9c6d3" stroke-width="7" stroke-linecap="round"/><text class="lb" x="282" y="306" text-anchor="start">Hors tension</text><rect x="30" y="360" width="740" height="80" rx="14" fill="#fff4e0" stroke="#c9451a" stroke-width="2" stroke-dasharray="8 5"/><text class="m" x="400" y="394" text-anchor="middle">Le bouton a coupé la commande, pas l'alimentation.</text><text class="lb" x="400" y="424" text-anchor="middle">En amont du contacteur, tout reste sous tension.</text>
</svg>
