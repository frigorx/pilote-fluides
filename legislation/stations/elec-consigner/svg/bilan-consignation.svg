<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img"
     aria-labelledby="t-bil" aria-describedby="d-bil" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-bil">L'essentiel de la station en quatre cartes</title>
  <desc id="d-bil">Quatre cartes numérotées. 1, prouver et ne pas supposer : un arrêt n'est pas une consignation. 2, dans l'ordre : séparer, condamner, identifier, vérifier l'absence de tension, puis mise à la terre si prescrite. 3, une personne et un papier : le chargé de consignation atteste par écrit puis déconsigne après l'avis de fin de travail. 4, toutes les énergies : électrique, fluide sous pression, mécanique, l'ordre venant de l'analyse des risques. Une bande en bas donne le réflexe : avant de toucher, savoir qui a consigné, quoi, et où est la preuve. Image fixe.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .lb  { font-size:17px; fill:#10233c; }
    .lbb { font-size:17px; font-weight:bold; fill:#10233c; }
    .m   { font-size:18px; font-weight:bold; fill:#10233c; }
    .sm  { font-size:16px; fill:#5a6b7d; }
    .num { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:30px; fill:#ffffff; }
  </style>
  <rect width="800" height="520" fill="#fffdf8"/>
<text class="ttl" x="400" y="36" text-anchor="middle">L'essentiel en quatre cartes</text><rect x="30" y="60" width="360" height="170" rx="14" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><circle cx="70" cy="98" r="22" fill="#a16207"/><text class="num" x="70" y="107" text-anchor="middle" style="font-size:26px">1</text><text class="h" x="106" y="106" text-anchor="start">Prouver, pas supposer</text><text class="lb" x="56" y="148" text-anchor="start">Un arrêt n'est pas une</text><text class="lb" x="56" y="174" text-anchor="start">consignation : la mise hors</text><text class="lb" x="56" y="200" text-anchor="start">tension se prouve.</text><rect x="410" y="60" width="360" height="170" rx="14" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><circle cx="450" cy="98" r="22" fill="#a16207"/><text class="num" x="450" y="107" text-anchor="middle" style="font-size:26px">2</text><text class="h" x="486" y="106" text-anchor="start">Dans l'ordre</text><text class="lb" x="436" y="148" text-anchor="start">Séparer, condamner, identifier,</text><text class="lb" x="436" y="174" text-anchor="start">vérifier l'absence de tension,</text><text class="lb" x="436" y="200" text-anchor="start">puis mise à la terre si prescrite.</text><rect x="30" y="245" width="360" height="170" rx="14" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><circle cx="70" cy="283" r="22" fill="#a16207"/><text class="num" x="70" y="292" text-anchor="middle" style="font-size:26px">3</text><text class="h" x="106" y="291" text-anchor="start">Une personne, un papier</text><text class="lb" x="56" y="333" text-anchor="start">Le chargé de consignation atteste</text><text class="lb" x="56" y="359" text-anchor="start">par écrit, puis déconsigne</text><text class="lb" x="56" y="385" text-anchor="start">après l'avis de fin de travail.</text><rect x="410" y="245" width="360" height="170" rx="14" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><circle cx="450" cy="283" r="22" fill="#a16207"/><text class="num" x="450" y="292" text-anchor="middle" style="font-size:26px">4</text><text class="h" x="486" y="291" text-anchor="start">Toutes les énergies</text><text class="lb" x="436" y="333" text-anchor="start">Électrique, fluide sous pression,</text><text class="lb" x="436" y="359" text-anchor="start">mécanique : l'ordre vient de</text><text class="lb" x="436" y="385" text-anchor="start">l'analyse des risques.</text><rect x="30" y="435" width="740" height="66" rx="14" fill="#f4eadb" stroke="#a16207" stroke-width="3"/><text class="m" x="400" y="464" text-anchor="middle">Le réflexe : avant de toucher, savoir qui a consigné, quoi,</text><text class="m" x="400" y="488" text-anchor="middle">et où est la preuve.</text>
</svg>
