<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img"
     aria-labelledby="t-sep" aria-describedby="d-sep" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-sep">Séparer, condamner, identifier</title>
  <desc id="d-sep">À gauche, une armoire avec un sectionneur représenté sur un seul conducteur. En haut, le conducteur amont est orange : sous tension. La lame du sectionneur s'ouvre ; le conducteur aval devient gris : hors tension. Un cadenas bloque le sectionneur ouvert, et une mention rappelle que tous les pôles sont ouverts, neutre compris. En haut à droite, une pancarte rouge porte les mots CONDAMNÉ, DÉFENSE DE MANŒUVRER SANS AUTORISATION, avec un nom, une date, une heure et un repère. En bas à droite, deux groupes portent chacun une plaque de repère, Q1 et Q2 ; la plaque Q2 est entourée : le repère du sectionneur est celui du groupe. L'animation ouvre la lame puis pose cadenas, pancarte et repères ; l'image fixe est complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .lb  { font-size:17px; fill:#10233c; }
    .lbb { font-size:17px; font-weight:bold; fill:#10233c; }
    .m   { font-size:18px; font-weight:bold; fill:#10233c; }
    .sm  { font-size:16px; fill:#5a6b7d; }
    .num { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:30px; fill:#ffffff; }
  </style>
  <rect width="800" height="480" fill="#fffdf8"/>
<text class="ttl" x="400" y="36" text-anchor="middle">Séparer, condamner, identifier</text><rect x="40" y="60" width="340" height="400" rx="14" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><text class="h" x="210" y="92" text-anchor="middle">Armoire</text><line x1="170" y1="110" x2="170" y2="190" stroke="#e8914a" stroke-width="7" stroke-linecap="round"/><text class="lbb" x="200" y="124" text-anchor="start">Amont : sous tension</text><line x1="170" y1="300" x2="170" y2="400" stroke="#b9c6d3" stroke-width="7" stroke-linecap="round"><animate attributeName="stroke" values="#e8914a;#e8914a;#b9c6d3;#b9c6d3" keyTimes="0;0.10;0.28;1" dur="13s" repeatCount="indefinite"/></line><g><text class="lbb" x="200" y="414" text-anchor="start">Aval : hors tension</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.34;1" dur="13s" repeatCount="indefinite"/></g><circle cx="170" cy="190" r="6" fill="#1b3a63"/><circle cx="170" cy="300" r="6" fill="#1b3a63"/><line x1="170" y1="300" x2="115" y2="205" stroke="#1b3a63" stroke-width="6" stroke-linecap="round"><animate attributeName="x2" values="170;170;115;115" keyTimes="0;0.10;0.26;1" dur="13s" repeatCount="indefinite"/><animate attributeName="y2" values="190;190;205;205" keyTimes="0;0.10;0.26;1" dur="13s" repeatCount="indefinite"/></line><g><text class="lbb" x="200" y="246" text-anchor="start">Sectionneur ouvert</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.32;1" dur="13s" repeatCount="indefinite"/></g><g><path d="M252,300 v-14 a13,13 0 0 1 26,0 v14" fill="none" stroke="#1b3a63" stroke-width="5"/><rect x="245" y="300" width="40" height="34" rx="6" fill="#a16207" stroke="#1b3a63" stroke-width="3"/><circle cx="265" cy="316" r="4" fill="#fffdf8"/><text class="lbb" x="265" y="362" text-anchor="middle">Cadenas</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.44;1" dur="13s" repeatCount="indefinite"/></g><text class="sm" x="210" y="444" text-anchor="middle">Tous les pôles ouverts, neutre compris</text><g><rect x="420" y="60" width="340" height="170" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><circle cx="590" cy="76" r="6" fill="#fffdf8" stroke="#c0392b" stroke-width="3"/><text x="590" y="122" text-anchor="middle" style="font-family:'Trebuchet MS',Calibri,sans-serif;font-weight:bold;font-size:32px;fill:#c0392b">CONDAMNÉ</text><text class="m" x="590" y="158" text-anchor="middle">DÉFENSE DE MANŒUVRER</text><text class="m" x="590" y="182" text-anchor="middle">SANS AUTORISATION</text><text class="sm" x="590" y="214" text-anchor="middle">Nom · date · heure · repère</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.56;1" dur="13s" repeatCount="indefinite"/></g><g><rect x="420" y="260" width="340" height="200" rx="10" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><text class="h" x="440" y="290" text-anchor="start">Identifier</text><rect x="440" y="304" width="120" height="50" rx="8" fill="#ffffff" stroke="#5a6b7d" stroke-width="3"/><text class="lb" x="500" y="336" text-anchor="middle">Groupe 1</text><rect x="470" y="362" width="60" height="28" rx="6" fill="#ffffff" stroke="#5a6b7d" stroke-width="2"/><text class="lbb" x="500" y="382" text-anchor="middle">Q1</text><rect x="620" y="304" width="120" height="50" rx="8" fill="#ffffff" stroke="#1b3a63" stroke-width="3"/><text class="lbb" x="680" y="336" text-anchor="middle">Groupe 2</text><rect x="650" y="362" width="60" height="28" rx="6" fill="#f4eadb" stroke="#a16207" stroke-width="4"/><text class="lbb" x="680" y="382" text-anchor="middle">Q2</text><text class="lb" x="590" y="418" text-anchor="middle">Repère du sectionneur</text><text class="lbb" x="590" y="442" text-anchor="middle">= repère du groupe</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.70;1" dur="13s" repeatCount="indefinite"/></g>
</svg>
