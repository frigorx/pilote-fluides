<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"
     aria-labelledby="t-ordre" aria-describedby="d-ordre" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-ordre">Les opérations de la consignation électrique, dans l'ordre imposé</title>
  <desc id="d-ordre">Cinq cercles reliés par des flèches, de gauche à droite. Les quatre premiers sont pleins et numérotés : séparer, condamner, identifier, vérifier l'absence de tension. Le cinquième est en pointillé orange : mise à la terre et en court-circuit. Sous eux, une barre indique que les quatre premières se font toujours et que la cinquième se fait si elle est prescrite. Une bande rappelle qu'avant la première opération l'équipement est préalablement identifié. L'animation fait apparaître les cercles l'un après l'autre ; l'image fixe montre tout.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .lb  { font-size:17px; fill:#10233c; }
    .lbb { font-size:17px; font-weight:bold; fill:#10233c; }
    .m   { font-size:18px; font-weight:bold; fill:#10233c; }
    .sm  { font-size:16px; fill:#5a6b7d; }
    .num { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:30px; fill:#ffffff; }
  </style>
  <rect width="800" height="450" fill="#fffdf8"/>
<text class="ttl" x="400" y="36" text-anchor="middle">Les opérations, dans l'ordre imposé</text><g><circle cx="90" cy="110" r="42" fill="#1b3a63" stroke="#1b3a63" stroke-width="3"/><text class="num" x="90" y="121" text-anchor="middle">1</text><text class="lbb" x="90" y="188" text-anchor="middle">Séparer</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.08;1" dur="13s" repeatCount="indefinite"/></g><g><circle cx="250" cy="110" r="42" fill="#1b3a63" stroke="#1b3a63" stroke-width="3"/><text class="num" x="250" y="121" text-anchor="middle">2</text><text class="lbb" x="250" y="188" text-anchor="middle">Condamner</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.18;1" dur="13s" repeatCount="indefinite"/></g><g><line x1="140" y1="110" x2="190" y2="110" stroke="#1b3a63" stroke-width="4" stroke-linecap="round"/><polygon points="200,110 186,102 186,118" fill="#1b3a63"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.15;1" dur="13s" repeatCount="indefinite"/></g><g><circle cx="410" cy="110" r="42" fill="#1b3a63" stroke="#1b3a63" stroke-width="3"/><text class="num" x="410" y="121" text-anchor="middle">3</text><text class="lbb" x="410" y="188" text-anchor="middle">Identifier</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.28;1" dur="13s" repeatCount="indefinite"/></g><g><line x1="300" y1="110" x2="350" y2="110" stroke="#1b3a63" stroke-width="4" stroke-linecap="round"/><polygon points="360,110 346,102 346,118" fill="#1b3a63"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.25;1" dur="13s" repeatCount="indefinite"/></g><g><circle cx="570" cy="110" r="42" fill="#1b3a63" stroke="#1b3a63" stroke-width="3"/><text class="num" x="570" y="121" text-anchor="middle">4</text><text class="lbb" x="570" y="188" text-anchor="middle">Vérifier</text><text class="lbb" x="570" y="210" text-anchor="middle">l'absence de</text><text class="lbb" x="570" y="232" text-anchor="middle">tension (VAT)</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.38;1" dur="13s" repeatCount="indefinite"/></g><g><line x1="460" y1="110" x2="510" y2="110" stroke="#1b3a63" stroke-width="4" stroke-linecap="round"/><polygon points="520,110 506,102 506,118" fill="#1b3a63"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.35;1" dur="13s" repeatCount="indefinite"/></g><g><circle cx="730" cy="110" r="42" fill="#fffdf8" stroke="#a16207" stroke-width="4" stroke-dasharray="9 6"/><text class="num" x="730" y="121" text-anchor="middle" style="fill:#a16207">5</text><text class="lbb" x="730" y="188" text-anchor="middle">Mise à la</text><text class="lbb" x="730" y="210" text-anchor="middle">terre et en</text><text class="lbb" x="730" y="232" text-anchor="middle">court-circuit</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.48;1" dur="13s" repeatCount="indefinite"/></g><g><line x1="620" y1="110" x2="670" y2="110" stroke="#a16207" stroke-width="4" stroke-linecap="round"/><polygon points="680,110 666,102 666,118" fill="#a16207"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.45;1" dur="13s" repeatCount="indefinite"/></g><g><rect x="48" y="262" width="564" height="40" rx="10" fill="#f4eadb" stroke="#a16207" stroke-width="2"/><text class="m" x="330" y="289" text-anchor="middle">Toujours : les quatre premières</text><rect x="668" y="262" width="120" height="40" rx="10" fill="#fffdf8" stroke="#a16207" stroke-width="2" stroke-dasharray="7 4"/><text class="lbb" x="728" y="289" text-anchor="middle">Si prescrite</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.60;0.66;1" dur="13s" repeatCount="indefinite"/></g><g><rect x="48" y="338" width="704" height="90" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/><text class="lb" x="400" y="374" text-anchor="middle">Avant la première : l'équipement est préalablement identifié,</text><text class="lb" x="400" y="402" text-anchor="middle">pour savoir exactement sur quoi l'on va travailler.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="13s" repeatCount="indefinite"/></g>
</svg>
