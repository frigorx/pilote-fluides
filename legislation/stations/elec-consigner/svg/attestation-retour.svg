<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" role="img"
     aria-labelledby="t-att" aria-describedby="d-att" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-att">Qui consigne, avec quel papier, et le retour</title>
  <desc id="d-att">Schéma en trois bandes. En haut, de gauche à droite : le chargé de consignation, habilité BC, remet une attestation de consignation, représentée par une feuille, au chargé de travaux. Au milieu, une bande rappelle que pendant les travaux la tension ne peut pas revenir. En bas, de droite à gauche : le chargé de travaux rend un avis de fin de travail au chargé de consignation, qui déconsigne. Un encadré résume le retour : d'abord les protections et les mises à la terre, puis la condamnation, puis on referme l'appareil de séparation. Image fixe.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .lb  { font-size:17px; fill:#10233c; }
    .lbb { font-size:17px; font-weight:bold; fill:#10233c; }
    .m   { font-size:18px; font-weight:bold; fill:#10233c; }
    .sm  { font-size:16px; fill:#5a6b7d; }
    .num { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:30px; fill:#ffffff; }
  </style>
  <rect width="800" height="510" fill="#fffdf8"/>
<text class="ttl" x="400" y="36" text-anchor="middle">Qui consigne, avec quel papier, et le retour</text><rect x="30" y="70" width="230" height="100" rx="12" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><circle cx="68" cy="108" r="14" fill="#1b3a63"/><path d="M49,154 q0,-30 19,-30 q19,0 19,30 z" fill="#1b3a63"/><text class="lbb" x="106" y="110" text-anchor="start">Chargé de</text><text class="lbb" x="106" y="132" text-anchor="start">consignation</text><text class="sm" x="106" y="156" text-anchor="start">habilité BC</text><rect x="540" y="70" width="230" height="100" rx="12" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><circle cx="578" cy="108" r="14" fill="#1b3a63"/><path d="M559,154 q0,-30 19,-30 q19,0 19,30 z" fill="#1b3a63"/><text class="lbb" x="616" y="110" text-anchor="start">Chargé de</text><text class="lbb" x="616" y="132" text-anchor="start">travaux</text><line x1="260" y1="120" x2="368" y2="120" stroke="#1b3a63" stroke-width="4" stroke-linecap="round"/><path d="M370,82 h42 l18,18 v58 h-60 z" fill="#ffffff" stroke="#1b3a63" stroke-width="3" stroke-linejoin="round"/><path d="M412,82 v18 h18" fill="none" stroke="#1b3a63" stroke-width="3"/><line x1="380" y1="116" x2="418" y2="116" stroke="#b9c6d3" stroke-width="3" stroke-linecap="round"/><line x1="380" y1="130" x2="418" y2="130" stroke="#b9c6d3" stroke-width="3" stroke-linecap="round"/><line x1="380" y1="144" x2="418" y2="144" stroke="#b9c6d3" stroke-width="3" stroke-linecap="round"/><line x1="430" y1="120" x2="528" y2="120" stroke="#1b3a63" stroke-width="4" stroke-linecap="round"/><polygon points="538,120 524,112 524,128" fill="#1b3a63"/><text class="lbb" x="400" y="192" text-anchor="middle">Attestation de consignation</text><rect x="30" y="215" width="740" height="44" rx="12" fill="#fff4e0" stroke="#c9451a" stroke-width="2" stroke-dasharray="8 5"/><text class="m" x="400" y="244" text-anchor="middle">Pendant les travaux, la tension ne peut pas revenir.</text><rect x="30" y="290" width="230" height="100" rx="12" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><circle cx="68" cy="328" r="14" fill="#1b3a63"/><path d="M49,374 q0,-30 19,-30 q19,0 19,30 z" fill="#1b3a63"/><text class="lbb" x="106" y="330" text-anchor="start">Chargé de</text><text class="lbb" x="106" y="352" text-anchor="start">consignation</text><text class="lb" x="106" y="376" text-anchor="start">déconsigne à la fin</text><rect x="540" y="290" width="230" height="100" rx="12" fill="#f2f6fa" stroke="#1b3a63" stroke-width="3"/><circle cx="578" cy="328" r="14" fill="#1b3a63"/><path d="M559,374 q0,-30 19,-30 q19,0 19,30 z" fill="#1b3a63"/><text class="lbb" x="616" y="330" text-anchor="start">Chargé de</text><text class="lbb" x="616" y="352" text-anchor="start">travaux</text><line x1="540" y1="340" x2="432" y2="340" stroke="#1b3a63" stroke-width="4" stroke-linecap="round"/><path d="M370,302 h42 l18,18 v58 h-60 z" fill="#ffffff" stroke="#1b3a63" stroke-width="3" stroke-linejoin="round"/><path d="M412,302 v18 h18" fill="none" stroke="#1b3a63" stroke-width="3"/><line x1="380" y1="336" x2="418" y2="336" stroke="#b9c6d3" stroke-width="3" stroke-linecap="round"/><line x1="380" y1="350" x2="418" y2="350" stroke="#b9c6d3" stroke-width="3" stroke-linecap="round"/><line x1="380" y1="364" x2="418" y2="364" stroke="#b9c6d3" stroke-width="3" stroke-linecap="round"/><line x1="368" y1="340" x2="272" y2="340" stroke="#1b3a63" stroke-width="4" stroke-linecap="round"/><polygon points="262,340 276,332 276,348" fill="#1b3a63"/><text class="lbb" x="400" y="412" text-anchor="middle">Avis de fin de travail</text><rect x="30" y="430" width="740" height="66" rx="12" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/><text class="lb" x="400" y="458" text-anchor="middle">Retour : d'abord protections et mises à la terre, puis la condamnation,</text><text class="lb" x="400" y="484" text-anchor="middle">puis on referme l'appareil de séparation.</text>
</svg>
