<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-malt" aria-describedby="d-malt" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-malt">Mise à la terre et en court-circuit : l'ordre des gestes</title>
  <desc id="d-malt">Quatre traits horizontaux gris représentent les trois phases L1, L2, L3 et le neutre N. Une barre verticale orange les relie tous entre eux par des pinces, et un câble la relie à un symbole de terre en bas. À droite, deux repères numérotés : 1, le côté terre d'abord ; 2, puis sur tous les conducteurs actifs, neutre compris. Une bande rappelle qu'en basse tension cette étape n'est pas toujours requise et que la norme NF C 18-510 précise quand. L'animation raccorde d'abord la terre, puis fait monter la barre et poser les pinces ; l'image fixe est complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .lb  { font-size:17px; fill:#10233c; }
    .lbb { font-size:17px; font-weight:bold; fill:#10233c; }
    .m   { font-size:18px; font-weight:bold; fill:#10233c; }
    .sm  { font-size:16px; fill:#5a6b7d; }
    .num { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:30px; fill:#ffffff; }
  </style>
  <rect width="800" height="500" fill="#fffdf8"/>
<text class="ttl" x="400" y="36" text-anchor="middle">Mise à la terre et en court-circuit</text><line x1="120" y1="110" x2="520" y2="110" stroke="#5a6b7d" stroke-width="5" stroke-linecap="round"/><text class="m" x="96" y="116" text-anchor="end">L1</text><line x1="120" y1="160" x2="520" y2="160" stroke="#5a6b7d" stroke-width="5" stroke-linecap="round"/><text class="m" x="96" y="166" text-anchor="end">L2</text><line x1="120" y1="210" x2="520" y2="210" stroke="#5a6b7d" stroke-width="5" stroke-linecap="round"/><text class="m" x="96" y="216" text-anchor="end">L3</text><line x1="120" y1="260" x2="520" y2="260" stroke="#5a6b7d" stroke-width="5" stroke-linecap="round"/><text class="m" x="96" y="266" text-anchor="end">N</text><g><line x1="400" y1="300" x2="400" y2="352" stroke="#1b3a63" stroke-width="5" stroke-linecap="round"/><line x1="368" y1="356" x2="432" y2="356" stroke="#1b3a63" stroke-width="5" stroke-linecap="round"/><line x1="380" y1="370" x2="420" y2="370" stroke="#1b3a63" stroke-width="5" stroke-linecap="round"/><line x1="392" y1="384" x2="408" y2="384" stroke="#1b3a63" stroke-width="5" stroke-linecap="round"/><circle cx="580" cy="352" r="17" fill="#a16207"/><text class="num" x="580" y="360" text-anchor="middle" style="font-size:22px">1</text><text class="m" x="608" y="358" text-anchor="start">Côté terre d'abord</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.14;1" dur="13s" repeatCount="indefinite"/></g><line x1="400" y1="300" x2="400" y2="110" stroke="#a16207" stroke-width="7" stroke-linecap="round"><animate attributeName="y2" values="300;300;110;110" keyTimes="0;0.30;0.46;1" dur="13s" repeatCount="indefinite"/></line><g><circle cx="400" cy="260" r="10" fill="#a16207" stroke="#fffdf8" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.320;0.350;1" dur="13s" repeatCount="indefinite"/></g><g><circle cx="400" cy="210" r="10" fill="#a16207" stroke="#fffdf8" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.355;0.385;1" dur="13s" repeatCount="indefinite"/></g><g><circle cx="400" cy="160" r="10" fill="#a16207" stroke="#fffdf8" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.390;0.420;1" dur="13s" repeatCount="indefinite"/></g><g><circle cx="400" cy="110" r="10" fill="#a16207" stroke="#fffdf8" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.425;0.455;1" dur="13s" repeatCount="indefinite"/></g><g><circle cx="580" cy="150" r="17" fill="#a16207"/><text class="num" x="580" y="158" text-anchor="middle" style="font-size:22px">2</text><text class="m" x="608" y="144" text-anchor="start">Puis sur tous les</text><text class="m" x="608" y="168" text-anchor="start">conducteurs actifs,</text><text class="m" x="608" y="192" text-anchor="start">neutre compris</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.38;1" dur="13s" repeatCount="indefinite"/></g><g><rect x="20" y="410" width="760" height="70" rx="14" fill="#fff4e0" stroke="#c9451a" stroke-width="2" stroke-dasharray="8 5"/><text class="m" x="400" y="440" text-anchor="middle">En basse tension, elle n'est pas toujours requise :</text><text class="m" x="400" y="466" text-anchor="middle">la norme NF C 18-510 dit quand.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.68;1" dur="13s" repeatCount="indefinite"/></g>
</svg>
