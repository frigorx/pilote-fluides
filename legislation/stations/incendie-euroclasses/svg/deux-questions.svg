<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="t" aria-describedby="d" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t">Deux questions, deux textes</title>
  <desc id="d">Deux panneaux côte à côte. À gauche, la réaction au feu : un morceau de matériau surmonté d'une flamme, la question est de savoir si le matériau alimente le feu, la réponse est une classe de A1 à F, fixée par l'arrêté du 21 novembre 2002. À droite, la résistance au feu : un mur exposé à une flamme et un chronomètre, la question est de savoir si l'ouvrage tient, la réponse s'exprime avec les lettres R, E et I et une durée, selon l'arrêté du 22 mars 2026 qui remplace celui de 2004. Une bande rappelle qu'une classe de réaction ne dit rien de la tenue d'un mur.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .sub { font-size:17px; fill:#5a6b7d; }
    .h   { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .hr  { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:22px; fill:#b91c1c; }
    .lbl { font-size:17px; fill:#10233c; }
    .lb  { font-size:17px; font-weight:bold; fill:#10233c; }
    .gry { font-size:17px; fill:#5a6b7d; }
    .code{ font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:34px; fill:#1b3a63; }
    .big { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:72px; fill:#1b3a63; }
    .bigr{ font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:56px; fill:#b91c1c; }
    .band{ font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .num { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:22px; fill:#e8914a; }
  </style>
  <defs><path id="fl" d="M0 -85 C-20 -55 -35 -45 -27 -18 C-23 -4 -10 0 0 0 C13 0 27 -6 27 -24 C27 -45 13 -55 0 -85 Z" fill="#e8914a" stroke="#b91c1c" stroke-width="2"/><path id="fli" d="M0 -48 C-9 -32 -16 -26 -12 -12 C-9 -4 -4 0 0 0 C6 0 12 -3 12 -12 C12 -26 6 -32 0 -48 Z" fill="#f6c58e"/>
    <marker id="pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5a6b7d"/></marker>
  </defs>
<text class="ttl" x="400" y="36" text-anchor="middle">Deux questions, deux textes</text>
<rect x="30" y="56" width="350" height="335" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
<rect x="420" y="56" width="350" height="335" rx="12" fill="#fffdf8" stroke="#b91c1c" stroke-width="2"/>
<text class="hr" x="205" y="92" text-anchor="middle">Réaction au feu</text>
<text class="lbl" x="205" y="122" text-anchor="middle">Le matériau alimente-t-il le feu ?</text>
<g transform="translate(205,262) scale(1.05)"><use href="#fl"/><use href="#fli"/></g>
<rect x="100" y="262" width="210" height="28" rx="4" fill="#cfd6df" stroke="#5a6b7d" stroke-width="2"/>
<text class="lb" x="205" y="332" text-anchor="middle">Classe du produit : A1 à F</text>
<text class="gry" x="205" y="362" text-anchor="middle">arrêté du 21 novembre 2002</text>
<text class="hr" x="595" y="92" text-anchor="middle">Résistance au feu</text>
<text class="lbl" x="595" y="122" text-anchor="middle">L'ouvrage tient-il ?</text>
<g transform="translate(500,262) scale(0.75)"><use href="#fl"/><use href="#fli"/></g>
<rect x="548" y="160" width="44" height="130" rx="3" fill="#cfd6df" stroke="#5a6b7d" stroke-width="2"/>
<circle cx="675" cy="232" r="38" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
<rect x="666" y="182" width="18" height="10" rx="3" fill="#1b3a63"/>
<line x1="675" y1="232" x2="675" y2="206" stroke="#1b3a63" stroke-width="3" stroke-linecap="round"/>
<line x1="675" y1="232" x2="693" y2="240" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
<text class="lb" x="595" y="332" text-anchor="middle">Tenue de l'ouvrage : R, E, I</text>
<text class="gry" x="595" y="362" text-anchor="middle">arrêté du 22 mars 2026 (ex-2004)</text>
<rect x="30" y="412" width="740" height="56" rx="12" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
<text class="band" x="400" y="447" text-anchor="middle">Une classe de réaction ne dit rien de la tenue d'un mur</text>
</svg>
