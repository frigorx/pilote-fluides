<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t" aria-describedby="d" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t">Quatre étiquettes, deux questions</title>
  <desc id="d">Quatre lignes. Chaque ligne associe une étiquette à gauche et sa lecture à droite. B-s1,d0 relève de la réaction au feu et décrit un produit : classe B, fumée faible, aucune gouttelette enflammée. EI 30 relève de la résistance au feu et décrit un ouvrage : étanche et isolant pendant 30 minutes, c'est du coupe-feu. R 90 : l'ouvrage porte pendant 90 minutes, ce qui répond à une exigence de stabilité au feu de 1 h 30. E 30 : étanche seulement pendant 30 minutes, ce qui répond à une exigence de pare-flammes.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .sub { font-size:17px; fill:#5a6b7d; }
    .h   { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .hr  { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:22px; fill:#b91c1c; }
    .lbl { font-size:17px; fill:#10233c; }
    .lb  { font-size:17px; font-weight:bold; fill:#10233c; }
    .gry { font-size:17px; fill:#5a6b7d; }
    .code{ font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:34px; fill:#1b3a63; }
    .big { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:72px; fill:#1b3a63; }
    .bigr{ font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:56px; fill:#b91c1c; }
    .band{ font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .num { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:22px; fill:#e8914a; }
  </style>
  <defs><path id="fl" d="M0 -85 C-20 -55 -35 -45 -27 -18 C-23 -4 -10 0 0 0 C13 0 27 -6 27 -24 C27 -45 13 -55 0 -85 Z" fill="#e8914a" stroke="#b91c1c" stroke-width="2"/><path id="fli" d="M0 -48 C-9 -32 -16 -26 -12 -12 C-9 -4 -4 0 0 0 C6 0 12 -3 12 -12 C12 -26 6 -32 0 -48 Z" fill="#f6c58e"/>
    <marker id="pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5a6b7d"/></marker>
  </defs>
<text class="ttl" x="400" y="34" text-anchor="middle">Quatre étiquettes, deux questions</text>
<rect x="30" y="56" width="210" height="80" rx="12" fill="#fffdf8" stroke="#e8914a" stroke-width="4"/><text class="code" x="135" y="108" text-anchor="middle">B-s1,d0</text>
<rect x="260" y="56" width="510" height="80" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/><text class="h" x="280" y="90" text-anchor="start">Réaction au feu : le produit</text><text class="lbl" x="280" y="118" text-anchor="start">classe B, fumée faible, aucune gouttelette enflammée</text>
<rect x="30" y="150" width="210" height="80" rx="12" fill="#fffdf8" stroke="#b91c1c" stroke-width="4"/><text class="code" x="135" y="202" text-anchor="middle">EI 30</text>
<rect x="260" y="150" width="510" height="80" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/><text class="h" x="280" y="184" text-anchor="start">Résistance au feu : l'ouvrage</text><text class="lbl" x="280" y="212" text-anchor="start">étanche et isolant pendant 30 minutes : coupe-feu</text>
<rect x="30" y="244" width="210" height="80" rx="12" fill="#fffdf8" stroke="#b91c1c" stroke-width="4"/><text class="code" x="135" y="296" text-anchor="middle">R 90</text>
<rect x="260" y="244" width="510" height="80" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/><text class="h" x="280" y="278" text-anchor="start">Résistance au feu : l'ouvrage</text><text class="lbl" x="280" y="306" text-anchor="start">porte pendant 90 minutes : exigence SF 1 h 30</text>
<rect x="30" y="338" width="210" height="80" rx="12" fill="#fffdf8" stroke="#b91c1c" stroke-width="4"/><text class="code" x="135" y="390" text-anchor="middle">E 30</text>
<rect x="260" y="338" width="510" height="80" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/><text class="h" x="280" y="372" text-anchor="start">Résistance au feu : l'ouvrage</text><text class="lbl" x="280" y="400" text-anchor="start">étanche seulement, 30 minutes : pare-flammes</text>
</svg>
