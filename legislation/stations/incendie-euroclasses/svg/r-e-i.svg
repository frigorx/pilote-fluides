<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t" aria-describedby="d" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t">R, E, I : trois critères de résistance au feu</title>
  <desc id="d">Trois panneaux. Panneau R, résistance mécanique : une colonne supporte une charge, une flèche descend sur elle, l'élément continue de porter. Panneau E, étanchéité : une flamme d'un côté d'un mur, des gaz chauds qui viennent buter contre le mur et ne passent pas. Panneau I, isolation thermique : une flamme d'un côté d'un mur, un thermomètre de l'autre côté dont la colonne reste basse, la face non exposée reste peu chauffée. Une bande donne deux exemples : EI 30, étanche et isolant pendant 30 minutes, et R 90, qui porte pendant 90 minutes. Dans l'animation, les trois panneaux apparaissent l'un après l'autre ; l'image fixe est complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .sub { font-size:17px; fill:#5a6b7d; }
    .h   { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .hr  { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:22px; fill:#b91c1c; }
    .lbl { font-size:17px; fill:#10233c; }
    .lb  { font-size:17px; font-weight:bold; fill:#10233c; }
    .gry { font-size:17px; fill:#5a6b7d; }
    .code{ font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:34px; fill:#1b3a63; }
    .big { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:72px; fill:#1b3a63; }
    .bigr{ font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:56px; fill:#b91c1c; }
    .band{ font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .num { font-family:'Trebuchet MS','Segoe UI',sans-serif; font-weight:bold; font-size:22px; fill:#e8914a; }
  </style>
  <defs><path id="fl" d="M0 -85 C-20 -55 -35 -45 -27 -18 C-23 -4 -10 0 0 0 C13 0 27 -6 27 -24 C27 -45 13 -55 0 -85 Z" fill="#e8914a" stroke="#b91c1c" stroke-width="2"/><path id="fli" d="M0 -48 C-9 -32 -16 -26 -12 -12 C-9 -4 -4 0 0 0 C6 0 12 -3 12 -12 C12 -26 6 -32 0 -48 Z" fill="#f6c58e"/>
    <marker id="pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5a6b7d"/></marker>
  </defs>
<text class="ttl" x="400" y="36" text-anchor="middle">Résistance au feu : trois lettres, une durée en minutes</text>
<g><rect x="20" y="56" width="240" height="300" rx="12" fill="#fffdf8" stroke="#b91c1c" stroke-width="2"/><text class="bigr" x="140.0" y="120" text-anchor="middle">R</text><line x1="140.0" y1="138" x2="140.0" y2="176" stroke="#1b3a63" stroke-width="4" marker-end="url(#pt)"/><rect x="88.0" y="180" width="104" height="14" rx="3" fill="#cfd6df" stroke="#5a6b7d" stroke-width="2"/><rect x="124.0" y="194" width="32" height="70" fill="#cfd6df" stroke="#5a6b7d" stroke-width="2"/><text class="h" x="140.0" y="296" text-anchor="middle">R : résistance</text><text class="lbl" x="140.0" y="322" text-anchor="middle">mécanique : l'élément</text><text class="lbl" x="140.0" y="346" text-anchor="middle">continue de porter</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.14;1" dur="13s" repeatCount="indefinite"/></g>
<g><rect x="280" y="56" width="240" height="300" rx="12" fill="#fffdf8" stroke="#b91c1c" stroke-width="2"/><text class="bigr" x="400.0" y="120" text-anchor="middle">E</text><g transform="translate(308.0,262) scale(0.75)"><use href="#fl"/><use href="#fli"/></g><rect x="386.0" y="150" width="28" height="112" fill="#cfd6df" stroke="#5a6b7d" stroke-width="2"/><path d="M336.0 200 q10 -10 20 0 t20 0 M336.0 226 q10 -10 20 0 t20 0" fill="none" stroke="#5a6b7d" stroke-width="2" stroke-dasharray="5 4"/><text class="h" x="400.0" y="296" text-anchor="middle">E : étanchéité</text><text class="lbl" x="400.0" y="322" text-anchor="middle">flammes et gaz chauds</text><text class="lbl" x="400.0" y="346" text-anchor="middle">ne passent pas</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.34;1" dur="13s" repeatCount="indefinite"/></g>
<g><rect x="540" y="56" width="240" height="300" rx="12" fill="#fffdf8" stroke="#b91c1c" stroke-width="2"/><text class="bigr" x="660.0" y="120" text-anchor="middle">I</text><g transform="translate(604.0,262) scale(0.75)"><use href="#fl"/><use href="#fli"/></g><rect x="630.0" y="150" width="28" height="112" fill="#cfd6df" stroke="#5a6b7d" stroke-width="2"/><rect x="690.0" y="160" width="14" height="72" rx="7" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/><circle cx="697.0" cy="244" r="15" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/><rect x="693.0" y="226" width="8" height="12" fill="#e8914a"/><circle cx="697.0" cy="244" r="9" fill="#e8914a"/><text class="h" x="660.0" y="296" text-anchor="middle">I : isolation thermique</text><text class="lbl" x="660.0" y="322" text-anchor="middle">la face non exposée</text><text class="lbl" x="660.0" y="346" text-anchor="middle">reste peu chauffée</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.54;1" dur="13s" repeatCount="indefinite"/></g>
<g><rect x="20" y="382" width="760" height="56" rx="12" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/><text class="band" x="400" y="416" text-anchor="middle">Exemples : EI 30 (étanche et isolant, 30 minutes) · R 90 (porte, 90 minutes)</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.70;0.76;1" dur="13s" repeatCount="indefinite"/></g>
</svg>
