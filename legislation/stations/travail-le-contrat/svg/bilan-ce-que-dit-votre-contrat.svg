<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-bil" aria-describedby="d-bil" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-bil">Quatre lignes à lire dans vos propres papiers</title>
  <desc id="d-bil">À gauche, quatre lignes numérotées à cocher, chacune avec une case : quel contrat, avec son
    motif et sa durée ; quelle période d'essai, prévue ou non ; quelle convention collective, lue sur la
    fiche de paie ; comment en sortir, avec le préavis et les modes de rupture. À droite, une feuille de
    papier avec quatre traits, surmontée d'une loupe, qui représente vos propres papiers à lire.</desc>
  <style>
    .ttl { font-weight:bold; font-size:21px; fill:#10233c; }
    .qt  { font-weight:bold; font-size:18px; fill:#9d174d; }
    .ql  { font-size:16px; fill:#10233c; }
    .ft  { font-weight:bold; font-size:17px; fill:#1b3a63; }
  </style>
  <text class="ttl" x="400" y="34" text-anchor="middle">Quatre lignes à lire sur vos propres papiers</text>

  <g>
    <rect x="30" y="60" width="480" height="90" rx="12" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
    <rect x="48" y="86" width="38" height="38" rx="6" fill="#ffffff" stroke="#1b3a63" stroke-width="3"/>
    <path d="M56,106 L66,116 L80,92" fill="none" stroke="#e8914a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="qt" x="104" y="96">1. Quel contrat ?</text>
    <text class="ql" x="104" y="122">CDI, CDD, alternance : son motif, sa durée</text>
  </g>
  <g>
    <rect x="30" y="165" width="480" height="90" rx="12" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
    <rect x="48" y="191" width="38" height="38" rx="6" fill="#ffffff" stroke="#1b3a63" stroke-width="3"/>
    <path d="M56,211 L66,221 L80,197" fill="none" stroke="#e8914a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="qt" x="104" y="201">2. Quelle période d'essai ?</text>
    <text class="ql" x="104" y="227">prévue au contrat, ou pas, et sa durée</text>
  </g>
  <g>
    <rect x="30" y="270" width="480" height="90" rx="12" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
    <rect x="48" y="296" width="38" height="38" rx="6" fill="#ffffff" stroke="#1b3a63" stroke-width="3"/>
    <path d="M56,316 L66,326 L80,302" fill="none" stroke="#e8914a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="qt" x="104" y="306">3. Quelle convention collective ?</text>
    <text class="ql" x="104" y="332">son intitulé et son IDCC, sur la fiche de paie</text>
  </g>
  <g>
    <rect x="30" y="375" width="480" height="90" rx="12" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
    <rect x="48" y="401" width="38" height="38" rx="6" fill="#ffffff" stroke="#1b3a63" stroke-width="3"/>
    <path d="M56,421 L66,431 L80,407" fill="none" stroke="#e8914a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="qt" x="104" y="411">4. Comment en sortir ?</text>
    <text class="ql" x="104" y="437">le préavis, les trois modes de rupture</text>
  </g>

  <!-- la feuille et la loupe -->
  <rect x="580" y="90" width="170" height="240" rx="8" fill="#ffffff" stroke="#1b3a63" stroke-width="3"/>
  <g fill="#d5dde6">
    <rect x="600" y="114" width="130" height="10" rx="5"/>
    <rect x="600" y="144" width="100" height="10" rx="5"/>
    <rect x="600" y="174" width="130" height="10" rx="5"/>
    <rect x="600" y="204" width="90" height="10" rx="5"/>
  </g>
  <circle cx="660" cy="290" r="44" fill="#fffdf8" fill-opacity="0.85" stroke="#9d174d" stroke-width="5"/>
  <path d="M692,322 L730,364" stroke="#9d174d" stroke-width="9" stroke-linecap="round"/>
  <text class="ft" x="660" y="400" text-anchor="middle">Vos propres papiers</text>
  <text class="ql" x="660" y="424" text-anchor="middle">à lire, crayon en main</text>
</svg>
