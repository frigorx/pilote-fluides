<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img"
     aria-labelledby="t-ts" aria-describedby="d-ts" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-ts">La tête de sprinkler et son ampoule</title>
  <desc id="d-ts">Deux têtes de sprinkler fixées sous un tuyau d'eau sous pression. À gauche, la tête au repos : une ampoule de verre rouge, tenue entre deux bras, bouche la sortie et retient l'eau ; sous elle, le déflecteur. À droite, la même tête à la chaleur : l'ampoule a éclaté, des éclats sont tombés, l'eau sort et frappe le déflecteur qui l'étale en gerbe vers le bas. Une bande rappelle que le liquide de l'ampoule se dilate avec la chaleur jusqu'à briser le verre. L'animation de la tête de droite montre la chaleur qui monte, l'ampoule qui gonfle puis éclate, et l'eau qui jaillit ; l'image fixe montre la tête déclenchée.</desc>
  <style>
    .lbl { font-size:17px; fill:#10233c; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#b91c1c; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
  </style>

  <text class="lbl" x="40" y="44">Tuyau d'eau sous pression</text>
  <rect x="40" y="55" width="820" height="14" rx="4" fill="#2f5689"/>

  <!-- ===== tête au repos (gauche), cx = 210 ===== -->
  <rect x="203" y="69" width="14" height="24" fill="#5a6b7d"/>
  <rect x="194" y="93" width="32" height="18" rx="3" fill="#5a6b7d"/>
  <rect x="201" y="111" width="18" height="7" fill="#10233c"/>
  <path d="M196,111 L178,186 M224,111 L242,186" fill="none" stroke="#5a6b7d" stroke-width="4"/>
  <ellipse cx="210" cy="142" rx="10" ry="24" fill="#b91c1c"/>
  <line x1="172" y1="186" x2="248" y2="186" stroke="#1b3a63" stroke-width="6" stroke-linecap="round"/>
  <text class="lbl" x="160" y="148" text-anchor="end">Ampoule</text>
  <line x1="166" y1="143" x2="198" y2="143" stroke="#5a6b7d" stroke-width="1.5"/>
  <text class="lbl" x="160" y="197" text-anchor="end">Déflecteur</text>
  <text class="qui" x="210" y="252" text-anchor="middle">Au repos</text>
  <text class="lbl" x="210" y="280" text-anchor="middle">L'ampoule bouche la sortie :</text>
  <text class="lbl" x="210" y="302" text-anchor="middle">l'eau reste dans le tuyau.</text>

  <!-- ===== tête déclenchée (droite), cx = 650 ===== -->
  <rect x="643" y="69" width="14" height="24" fill="#5a6b7d"/>
  <rect x="634" y="93" width="32" height="18" rx="3" fill="#5a6b7d"/>
  <rect x="641" y="111" width="18" height="7" fill="#10233c" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.21;0.22;1" dur="13s" repeatCount="indefinite"/>
  </rect>
  <path d="M636,111 L618,186 M664,111 L682,186" fill="none" stroke="#5a6b7d" stroke-width="4"/>
  <!-- l'ampoule : gonfle puis disparaît (invisible à l'arrêt) -->
  <ellipse cx="650" cy="142" rx="10" ry="24" fill="#b91c1c" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.21;0.22;1" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="10;10;13;13" keyTimes="0;0.06;0.21;1" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="24;24;27;27" keyTimes="0;0.06;0.21;1" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <!-- l'eau qui sort -->
  <g opacity="1">
    <rect x="644" y="118" width="12" height="66" fill="#2f5689"/>
    <path d="M622,190 L572,232 M638,190 L618,238 M650,190 L650,240 M662,190 L682,238 M678,190 L728,232" fill="none" stroke="#2f5689" stroke-width="4" stroke-dasharray="9 6" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.27;1" dur="13s" repeatCount="indefinite"/>
  </g>
  <line x1="612" y1="186" x2="688" y2="186" stroke="#1b3a63" stroke-width="6" stroke-linecap="round"/>
  <!-- éclats de verre : tombent de la tête vers leur place finale -->
  <g transform="translate(0 0)" opacity="1">
    <path d="M628,214 l8,-12 l6,12 z M664,224 l7,-11 l7,11 z M690,208 l6,-10 l6,10 z" fill="#b91c1c"/>
    <animateTransform attributeName="transform" type="translate" values="12 -74;12 -74;0 0;0 0" keyTimes="0;0.22;0.30;1" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.21;0.22;1" dur="13s" repeatCount="indefinite"/>
  </g>
  <!-- la chaleur qui monte (décor animé, invisible à l'arrêt) -->
  <path d="M574,206 q9,-14 0,-28 q-9,-14 0,-28 M594,206 q9,-14 0,-28 q-9,-14 0,-28 M706,206 q9,-14 0,-28 q-9,-14 0,-28 M726,206 q9,-14 0,-28 q-9,-14 0,-28" fill="none" stroke="#e8914a" stroke-width="4" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.03;0.08;0.20;0.24;1" dur="13s" repeatCount="indefinite"/>
  </path>

  <text class="qui" x="650" y="262" text-anchor="middle">À la chaleur</text>
  <text class="lbl" x="650" y="290" text-anchor="middle">L'ampoule éclate, l'eau sort</text>
  <text class="lbl" x="650" y="312" text-anchor="middle">et frappe le déflecteur.</text>

  <text class="band" x="450" y="356" text-anchor="middle">Le liquide de l'ampoule se dilate avec la chaleur jusqu'à briser le verre.</text>
</svg>
