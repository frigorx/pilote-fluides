<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" role="img"
     aria-labelledby="t-sf" aria-describedby="d-sf" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-sf">Seule la tête au-dessus du foyer s'ouvre</title>
  <desc id="d-sf">Un tuyau au plafond porte cinq têtes de sprinkler alignées. Sous la tête du milieu, un foyer brûle sur le sol et une colonne d'air chaud monte vers elle. Seule cette tête du milieu est ouverte : son ampoule a éclaté et l'eau tombe en gerbe sur le foyer, dont la flamme est réduite. Les quatre autres têtes, à gauche et à droite, restent fermées, ampoule intacte. Une bande rappelle que seule la tête au-dessus du foyer s'ouvre. L'animation montre le foyer qui grandit, la chaleur qui monte, l'ampoule qui éclate puis l'eau qui tombe et maîtrise la flamme ; l'image fixe montre le résultat.</desc>
  <style>
    .lbl { font-size:17px; fill:#10233c; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#b91c1c; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
  </style>

  <rect x="40" y="63" width="820" height="14" rx="4" fill="#2f5689"/>
  <line x1="40" y1="322" x2="860" y2="322" stroke="#5a6b7d" stroke-width="4"/>
  <rect x="144" y="77" width="12" height="18" fill="#5a6b7d"/>
  <rect x="137" y="95" width="26" height="14" rx="3" fill="#5a6b7d"/>
  <path d="M139,109 L126,150 M161,109 L174,150" fill="none" stroke="#5a6b7d" stroke-width="4"/>
  <ellipse cx="150" cy="127" rx="8" ry="17" fill="#b91c1c"/>
  <line x1="122" y1="150" x2="178" y2="150" stroke="#1b3a63" stroke-width="5" stroke-linecap="round"/>
  <text class="lbl" x="150" y="44" text-anchor="middle">fermée</text>
  <rect x="294" y="77" width="12" height="18" fill="#5a6b7d"/>
  <rect x="287" y="95" width="26" height="14" rx="3" fill="#5a6b7d"/>
  <path d="M289,109 L276,150 M311,109 L324,150" fill="none" stroke="#5a6b7d" stroke-width="4"/>
  <ellipse cx="300" cy="127" rx="8" ry="17" fill="#b91c1c"/>
  <line x1="272" y1="150" x2="328" y2="150" stroke="#1b3a63" stroke-width="5" stroke-linecap="round"/>
  <text class="lbl" x="300" y="44" text-anchor="middle">fermée</text>
  <rect x="594" y="77" width="12" height="18" fill="#5a6b7d"/>
  <rect x="587" y="95" width="26" height="14" rx="3" fill="#5a6b7d"/>
  <path d="M589,109 L576,150 M611,109 L624,150" fill="none" stroke="#5a6b7d" stroke-width="4"/>
  <ellipse cx="600" cy="127" rx="8" ry="17" fill="#b91c1c"/>
  <line x1="572" y1="150" x2="628" y2="150" stroke="#1b3a63" stroke-width="5" stroke-linecap="round"/>
  <text class="lbl" x="600" y="44" text-anchor="middle">fermée</text>
  <rect x="744" y="77" width="12" height="18" fill="#5a6b7d"/>
  <rect x="737" y="95" width="26" height="14" rx="3" fill="#5a6b7d"/>
  <path d="M739,109 L726,150 M761,109 L774,150" fill="none" stroke="#5a6b7d" stroke-width="4"/>
  <ellipse cx="750" cy="127" rx="8" ry="17" fill="#b91c1c"/>
  <line x1="722" y1="150" x2="778" y2="150" stroke="#1b3a63" stroke-width="5" stroke-linecap="round"/>
  <text class="lbl" x="750" y="44" text-anchor="middle">fermée</text>
  <!-- panache de chaleur -->
  <polygon points="425,290 475,290 505,160 395,160" fill="#e8914a" opacity="0.18">
    <animate attributeName="opacity" values="0;0;0.18;0.18" keyTimes="0;0.08;0.22;1" dur="14s" repeatCount="indefinite"/>
  </polygon>
  <rect x="444" y="77" width="12" height="18" fill="#5a6b7d"/>
  <rect x="437" y="95" width="26" height="14" rx="3" fill="#5a6b7d"/>
  <path d="M439,109 L426,150 M461,109 L474,150" fill="none" stroke="#5a6b7d" stroke-width="4"/>
  <!-- ampoule de la tête ouverte : gonfle puis éclate (invisible à l'arrêt) -->
  <ellipse cx="450" cy="127" rx="8" ry="17" fill="#b91c1c" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.25;0.26;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="8;8;10;10" keyTimes="0;0.10;0.25;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="17;17;20;20" keyTimes="0;0.10;0.25;1" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <g>
    <rect x="445" y="109" width="10" height="40" fill="#2f5689"/>
    <path d="M428,153 L385,268 M440,153 L424,274 M450,153 L450,278 M460,153 L476,274 M472,153 L515,268" fill="none" stroke="#2f5689" stroke-width="4" stroke-dasharray="9 6" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.32;1" dur="14s" repeatCount="indefinite"/>
  </g>
  <line x1="422" y1="150" x2="478" y2="150" stroke="#1b3a63" stroke-width="5" stroke-linecap="round"/>
  <text class="qui" x="450" y="44" text-anchor="middle">ouverte</text>

  <!-- le foyer -->
  <g transform="translate(450 322)">
    <g transform="scale(1 0.5)">
      <path d="M0,0 C-30,0 -34,-30 -14,-52 C-14,-36 -6,-34 -4,-46 C4,-62 -6,-76 6,-92 C14,-70 34,-50 30,-22 C28,-8 16,0 0,0 Z" fill="#e8914a" stroke="#b91c1c" stroke-width="3"/>
      <path d="M0,-2 C-14,-2 -16,-16 -6,-26 C0,-14 8,-14 12,-24 C16,-12 14,-2 0,-2 Z" fill="#b91c1c"/>
      <animateTransform attributeName="transform" type="scale" values="1 0.15;1 0.15;1 1;1 1;1 0.5;1 0.5" keyTimes="0;0.02;0.10;0.34;0.62;1" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>
  <text class="qui" x="396" y="312" text-anchor="end">Foyer</text>
  <text class="lbl" x="506" y="296">Chaleur qui monte</text>

  <text class="band" x="450" y="372" text-anchor="middle">Seule la tête au-dessus du foyer s'ouvre : les autres restent fermées.</text>
</svg>
