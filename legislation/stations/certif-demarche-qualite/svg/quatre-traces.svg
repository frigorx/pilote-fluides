<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-traces" aria-describedby="d-traces" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-traces">Quatre traces qui prouvent ce qui a été fait</title>
  <desc id="d-traces">Quatre cartes. La fiche d&#x27;intervention signée, gardée cinq ans au moins. Le registre de l&#x27;équipement et les pesées. La marque de contrôle posée sur l&#x27;équipement après un contrôle d&#x27;étanchéité. Les photos avant et après, avec le bon d&#x27;intervention signé par le client. En bas : celui qui dit avoir fait son travail doit pouvoir le justifier.</desc>
  
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">Quatre traces</text>
  <g><rect x="30" y="46" width="360" height="128" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><text x="44" y="76.2" font-size="19" font-weight="bold" fill="#1b3a63">La fiche signée</text><text x="44" y="101.9" font-size="16" fill="#10233c">gardée 5 ans au moins, par vous et par le</text><text x="44" y="123.7" font-size="16" fill="#10233c">client</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.11;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="410" y="46" width="360" height="128" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="3" stroke-dasharray="2 7"/><text x="424" y="76.2" font-size="19" font-weight="bold" fill="#0f766e">Le registre et les pesées</text><text x="424" y="101.9" font-size="16" fill="#10233c">le fluide ajouté ou récupéré, en kg</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.25;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="188" width="360" height="128" rx="12" fill="#fdf1e6" stroke="#9a4d0c" stroke-width="3" stroke-dasharray="10 7"/><text x="44" y="218.2" font-size="19" font-weight="bold" fill="#9a4d0c">La marque de contrôle</text><text x="44" y="243.9" font-size="16" fill="#10233c">posée sur l&#x27;équipement après un contrôle</text><text x="44" y="265.7" font-size="16" fill="#10233c">d&#x27;étanchéité</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.39;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="410" y="188" width="360" height="128" rx="12" fill="#e8e6f6" stroke="#3730a3" stroke-width="3" stroke-dasharray="14 5 3 5"/><text x="424" y="218.2" font-size="19" font-weight="bold" fill="#3730a3">Photos et bon signé</text><text x="424" y="243.9" font-size="16" fill="#10233c">photos avant et après, bon d&#x27;intervention</text><text x="424" y="265.7" font-size="16" fill="#10233c">signé par le client</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.53;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="340" width="740" height="128" rx="12" fill="#fff" stroke="#1e7e54" stroke-width="3"/><text x="46" y="372" font-size="18" font-weight="bold" fill="#1e7e54">Sans trace, c&#x27;est votre parole contre celle du client.</text><text x="46" y="400" font-size="16" fill="#10233c">Celui qui dit avoir fait son travail doit pouvoir le justifier (Code civil, article 1353).</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.72;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
