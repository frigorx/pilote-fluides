<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-boucle" aria-describedby="d-boucle" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-boucle">La boucle de la qualité : préparer, faire, contrôler, corriger</title>
  <desc id="d-boucle">Une boucle à quatre étapes, dans le sens des aiguilles d&#x27;une montre. En haut à gauche : préparer, lire le dossier, repérer les risques, choisir le matériel. En haut à droite : faire, bien faire du premier coup. En bas à droite : contrôler, c&#x27;est l&#x27;autocontrôle avant de présenter son travail. En bas à gauche : corriger, réparer puis chercher la cause. Au centre : à chaque étape, on laisse une trace pour pouvoir le prouver. Dans l&#x27;animation, une goutte parcourt la boucle.</desc>
  <defs><marker id="mboucle5a6b7d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">Préparer, faire, contrôler, corriger</text>
  <g><rect x="40" y="48" width="290" height="132" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><text x="54" y="77.3" font-size="18" font-weight="bold" fill="#1b3a63">1 · Préparer</text><text x="54" y="101.8" font-size="16" fill="#10233c">lire le dossier, repérer les risques,</text><text x="54" y="123.6" font-size="16" fill="#10233c">choisir le matériel</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.08;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="470" y="48" width="290" height="132" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="3" stroke-dasharray="2 7"/><text x="484" y="77.3" font-size="18" font-weight="bold" fill="#1b3a63">2 · Faire</text><text x="484" y="101.8" font-size="16" fill="#10233c">bien faire du premier coup, selon la</text><text x="484" y="123.6" font-size="16" fill="#10233c">méthode</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.26;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="470" y="318" width="290" height="132" rx="12" fill="#fdf1e6" stroke="#9a4d0c" stroke-width="3" stroke-dasharray="10 7"/><text x="484" y="347.3" font-size="18" font-weight="bold" fill="#1b3a63">3 · Contrôler</text><text x="484" y="371.8" font-size="16" fill="#10233c">l&#x27;autocontrôle, avant de présenter</text><text x="484" y="393.6" font-size="16" fill="#10233c">son travail</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.44;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="40" y="318" width="290" height="132" rx="12" fill="#e8e6f6" stroke="#3730a3" stroke-width="3" stroke-dasharray="14 5 3 5"/><text x="54" y="347.3" font-size="18" font-weight="bold" fill="#1b3a63">4 · Corriger</text><text x="54" y="371.8" font-size="16" fill="#10233c">réparer, puis chercher la cause</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.62;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M332,114 H466" fill="none" stroke="#5a6b7d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mboucle5a6b7d)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.16;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M615,184 V314" fill="none" stroke="#5a6b7d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mboucle5a6b7d)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.34;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M468,384 H334" fill="none" stroke="#5a6b7d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mboucle5a6b7d)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.52;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M185,314 V184" fill="none" stroke="#5a6b7d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mboucle5a6b7d)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.7;1" dur="12s" repeatCount="indefinite"/></g>
  <rect x="230" y="214" width="340" height="74" rx="12" fill="#fff" stroke="#1e7e54" stroke-width="3"/>
  <text x="400" y="244" font-size="17" font-weight="bold" fill="#1e7e54" text-anchor="middle">À chaque étape,</text>
  <text x="400" y="270" font-size="17" font-weight="bold" fill="#1e7e54" text-anchor="middle">on laisse une trace.</text>
  <circle r="8" fill="#e8914a" opacity="0" cx="0" cy="0"><animateMotion path="M185,114 H468 V384 H185 V114" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1;0.94;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.12;0.93;0.95;1" dur="12s" repeatCount="indefinite"/></circle>
</svg>
