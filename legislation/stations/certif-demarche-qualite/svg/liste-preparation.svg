<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-preparation" aria-describedby="d-preparation" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-preparation">La liste de préparation avant de partir chez le client</title>
  <desc id="d-preparation">Cinq lignes à cocher avant de partir : j&#x27;ai lu l&#x27;ordre de travail et le dossier ; j&#x27;ai repéré les risques ; j&#x27;ai choisi le matériel et l&#x27;outillage ; mes outils sont vérifiés et en bon état ; j&#x27;ai organisé mon poste avant de commencer.</desc>
  
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">Avant de partir : cinq questions</text>
  <rect x="30" y="52" width="740" height="74" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/>
  <rect x="48" y="75" width="28" height="28" rx="4" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/>
  <path d="M53,90 L60,97 L71,80" fill="none" stroke="#1e7e54" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="97" font-size="18" fill="#10233c">J&#x27;ai lu l&#x27;ordre de travail et le dossier.</text>
  <rect x="30" y="136" width="740" height="74" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/>
  <rect x="48" y="159" width="28" height="28" rx="4" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/>
  <path d="M53,174 L60,181 L71,164" fill="none" stroke="#1e7e54" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="181" font-size="18" fill="#10233c">J&#x27;ai repéré les risques.</text>
  <rect x="30" y="220" width="740" height="74" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/>
  <rect x="48" y="243" width="28" height="28" rx="4" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/>
  <path d="M53,258 L60,265 L71,248" fill="none" stroke="#1e7e54" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="265" font-size="18" fill="#10233c">J&#x27;ai choisi le matériel et l&#x27;outillage.</text>
  <rect x="30" y="304" width="740" height="74" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/>
  <rect x="48" y="327" width="28" height="28" rx="4" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/>
  <path d="M53,342 L60,349 L71,332" fill="none" stroke="#1e7e54" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="349" font-size="18" fill="#10233c">Mes outils sont vérifiés et en bon état.</text>
  <rect x="30" y="388" width="740" height="74" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/>
  <rect x="48" y="411" width="28" height="28" rx="4" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/>
  <path d="M53,426 L60,433 L71,416" fill="none" stroke="#1e7e54" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="433" font-size="18" fill="#10233c">J&#x27;ai organisé mon poste avant de commencer.</text>
