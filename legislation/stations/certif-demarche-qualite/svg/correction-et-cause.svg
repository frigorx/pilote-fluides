<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-correction-cause" aria-describedby="d-correction-cause" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-correction-cause">Correction et action corrective : deux gestes différents</title>
  <desc id="d-correction-cause">À gauche, la non-conformité : une fiche sans la signature du détenteur. En haut à droite, la correction, tout de suite : retourner la faire signer ; elle supprime l&#x27;effet. En dessous, l&#x27;action corrective en trois temps, numérotés : un, chercher la cause, personne ne relit la fiche avant de partir ; deux, agir sur la cause, ajouter les signatures à la liste de fin d&#x27;intervention ; trois, vérifier que ça ne revient pas. En bas : la correction soigne le cas d&#x27;aujourd&#x27;hui, l&#x27;action corrective soigne la cause.</desc>
  <defs><marker id="mcorrection-cause1e7e54" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e7e54"/></marker><marker id="mcorrection-cause3730a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3730a3"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">Corriger, puis traiter la cause</text>
  <g><rect x="30" y="150" width="210" height="160" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 7"/><text x="44" y="179.3" font-size="18" font-weight="bold" fill="#c0392b">Non-conformité</text><text x="44" y="203.8" font-size="16" fill="#10233c">fiche sans la signature</text><text x="44" y="225.6" font-size="16" fill="#10233c">du détenteur</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.08;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M242,200 C262,200 262,92 286,92" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mcorrection-cause1e7e54)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.14;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="290" y="46" width="480" height="92" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3.5"/><text x="304" y="75.3" font-size="18" font-weight="bold" fill="#1e7e54">Correction : tout de suite</text><text x="304" y="99.8" font-size="16" fill="#10233c">retourner la faire signer. Elle supprime l&#x27;effet.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.2;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M242,260 C262,260 262,200 286,200" fill="none" stroke="#3730a3" stroke-width="4" stroke-dasharray="14 5 3 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mcorrection-cause3730a3)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.34;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="290" y="152" width="480" height="78" rx="12" fill="#e8e6f6" stroke="#3730a3" stroke-width="3" stroke-dasharray="14 5 3 5"/><circle cx="324" cy="191" r="18" fill="#3730a3"/><text x="324" y="198" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="354" y="184" font-size="18" font-weight="bold" fill="#3730a3">Chercher la cause</text><text x="354" y="210" font-size="16" fill="#10233c">personne ne relit la fiche avant de partir</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.41;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="290" y="240" width="480" height="78" rx="12" fill="#e8e6f6" stroke="#3730a3" stroke-width="3" stroke-dasharray="14 5 3 5"/><circle cx="324" cy="279" r="18" fill="#3730a3"/><text x="324" y="286" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="354" y="272" font-size="18" font-weight="bold" fill="#3730a3">Agir sur la cause</text><text x="354" y="298" font-size="16" fill="#10233c">ajouter « signatures » à la liste de fin d&#x27;intervention</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.55;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="290" y="328" width="480" height="78" rx="12" fill="#e8e6f6" stroke="#3730a3" stroke-width="3" stroke-dasharray="14 5 3 5"/><circle cx="324" cy="367" r="18" fill="#3730a3"/><text x="324" y="374" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="354" y="360" font-size="18" font-weight="bold" fill="#3730a3">Vérifier</text><text x="354" y="386" font-size="16" fill="#10233c">sur les fiches suivantes, la signature est-elle là ?</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.69;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="420" width="740" height="56" rx="12" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><text x="400" y="454" font-size="17" font-weight="bold" fill="#10233c" text-anchor="middle">La correction soigne le cas d&#x27;aujourd&#x27;hui. L&#x27;action corrective soigne la cause.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.86;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
