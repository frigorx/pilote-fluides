<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-reclamation" aria-describedby="d-reclamation" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-reclamation">La réclamation d&#x27;un client : cinq temps et deux repères</title>
  <desc id="d-reclamation">À gauche, cinq temps numérotés : un, accuser réception et noter ; deux, comprendre, quoi, où, quand ; trois, corriger, réparer chez le client ; quatre, chercher la cause et agir ; cinq, répondre au client et vérifier. À droite, deux repères. Le délai : un an après la réception du chantier, la garantie de parfait achèvement, avec une notification écrite pour un défaut apparu après la réception. Le client particulier : il peut saisir gratuitement un médiateur de la consommation.</desc>
  
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">Une réclamation : cinq temps</text>
  <g><rect x="30" y="50" width="400" height="76" rx="12" fill="#fff" stroke="#3730a3" stroke-width="3"/><circle cx="68" cy="88" r="20" fill="#3730a3"/><text x="68" y="96" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="104" y="86" font-size="17" fill="#10233c">J&#x27;accuse réception et je note.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.1;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="136" width="400" height="76" rx="12" fill="#fff" stroke="#3730a3" stroke-width="3"/><circle cx="68" cy="174" r="20" fill="#3730a3"/><text x="68" y="182" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="104" y="172" font-size="17" fill="#10233c">Je comprends : quoi, où, quand.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.22;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="222" width="400" height="76" rx="12" fill="#fff" stroke="#3730a3" stroke-width="3"/><circle cx="68" cy="260" r="20" fill="#3730a3"/><text x="68" y="268" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="104" y="258" font-size="17" fill="#10233c">Je corrige : je répare chez le client.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.34;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="308" width="400" height="76" rx="12" fill="#fff" stroke="#3730a3" stroke-width="3"/><circle cx="68" cy="346" r="20" fill="#3730a3"/><text x="68" y="354" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="104" y="344" font-size="17" fill="#10233c">Je cherche la cause et j&#x27;agis.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.46;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="394" width="400" height="76" rx="12" fill="#fff" stroke="#3730a3" stroke-width="3"/><circle cx="68" cy="432" r="20" fill="#3730a3"/><text x="68" y="440" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="104" y="430" font-size="17" fill="#10233c">Je réponds au client et je vérifie.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.58;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="450" y="50" width="320" height="190" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="3" stroke-dasharray="2 7"/><text x="464" y="80.2" font-size="19" font-weight="bold" fill="#0f766e">Le délai : 1 an</text><text x="464" y="105.9" font-size="16" fill="#10233c">Après la réception d&#x27;un chantier, la</text><text x="464" y="127.7" font-size="16" fill="#10233c">garantie de parfait achèvement : un</text><text x="464" y="149.4" font-size="16" fill="#10233c">défaut apparu après la réception se</text><text x="464" y="171.2" font-size="16" fill="#10233c">signale par écrit.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.72;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="450" y="260" width="320" height="200" rx="12" fill="#fdf1e6" stroke="#9a4d0c" stroke-width="3" stroke-dasharray="10 7"/><text x="464" y="290.1" font-size="19" font-weight="bold" fill="#9a4d0c">Client particulier</text><text x="464" y="315.9" font-size="16" fill="#10233c">Il peut saisir gratuitement un</text><text x="464" y="337.7" font-size="16" fill="#10233c">médiateur de la consommation.</text><text x="464" y="359.4" font-size="16" fill="#10233c">L&#x27;entreprise lui en donne les</text><text x="464" y="381.2" font-size="16" fill="#10233c">coordonnées.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.84;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
