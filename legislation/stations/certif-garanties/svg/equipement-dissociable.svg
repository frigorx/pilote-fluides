<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img"
     aria-labelledby="t-eq" aria-describedby="d-eq" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-eq">Le test de la dépose : équipement dissociable ou non</title>
  <desc id="d-eq">Deux scènes côte à côte. À gauche, un mur gris et un appareil bleu : l'appareil est
    déposé et le mur reste intact, sans trace ; c'est un équipement dissociable, couvert par la
    garantie de bon fonctionnement, deux ans au minimum. À droite, un mur gris et un appareil pris
    dans un bloc de matière : en le déposant, le bloc de mur part avec lui et laisse un trou
    en pointillé ; l'équipement fait corps avec l'ouvrage, la décennale s'applique. Une bande en
    bas rappelle qu'un équipement dissociable peut aussi relever de la décennale s'il rend
    l'ouvrage impropre à sa destination. L'animation joue la dépose des deux appareils ; l'image
    fixe montre l'état après dépose.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .qui  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl  { font-size:17px; fill:#10233c; }
    .sm   { font-size:16px; fill:#5a6b7d; }
  </style>

  <!-- ===== Panneau gauche : dissociable ===== -->
  <text class="ttl" x="225" y="32" text-anchor="middle">Équipement dissociable</text>
  <rect x="60" y="56" width="70" height="190" fill="#d9dfe6" stroke="#5a6b7d" stroke-width="2"/>
  <g transform="translate(110 0)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;110 0;110 0" keyTimes="0;0.15;0.35;1" dur="12s" repeatCount="indefinite"/>
    <rect x="70" y="106" width="120" height="90" rx="10" fill="#2f5689" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="130" cy="151" r="26" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <line x1="130" y1="127" x2="130" y2="175" stroke="#1b3a63" stroke-width="3"/>
    <line x1="106" y1="151" x2="154" y2="151" stroke="#1b3a63" stroke-width="3"/>
  </g>
  <text class="qui" x="225" y="276" text-anchor="middle">La dépose ne laisse aucune trace</text>
  <text class="lbl" x="225" y="302" text-anchor="middle">Le mur reste intact.</text>
  <text class="qui" x="225" y="334" text-anchor="middle" style="fill:#3730a3">Bon fonctionnement</text>
  <text class="lbl" x="225" y="358" text-anchor="middle">2 ans au minimum</text>

  <!-- ===== Panneau droit : indissociable ===== -->
  <text class="ttl" x="675" y="32" text-anchor="middle">Équipement indissociable</text>
  <rect x="510" y="56" width="130" height="190" fill="#d9dfe6" stroke="#5a6b7d" stroke-width="2"/>
  <!-- le trou laissé après la dépose (visible à l'état final) -->
  <rect x="550" y="96" width="90" height="120" fill="#fffdf8" stroke="#5a6b7d" stroke-width="3" stroke-dasharray="10 6">
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.15;0.16;0.36;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(110 0)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;110 0;110 0" keyTimes="0;0.15;0.35;1" dur="12s" repeatCount="indefinite"/>
    <rect x="550" y="96" width="90" height="120" fill="#d9dfe6" stroke="#5a6b7d" stroke-width="2"/>
    <rect x="560" y="116" width="120" height="80" rx="10" fill="#2f5689" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="620" cy="156" r="24" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <line x1="620" y1="134" x2="620" y2="178" stroke="#1b3a63" stroke-width="3"/>
    <line x1="598" y1="156" x2="642" y2="156" stroke="#1b3a63" stroke-width="3"/>
  </g>
  <text class="qui" x="675" y="276" text-anchor="middle">La dépose arrache de la matière</text>
  <text class="lbl" x="675" y="302" text-anchor="middle">Il fait corps avec l'ouvrage.</text>
  <text class="qui" x="675" y="334" text-anchor="middle" style="fill:#3730a3">Décennale</text>
  <text class="lbl" x="675" y="358" text-anchor="middle">même pour sa solidité</text>

  <!-- Bande -->
  <rect x="30" y="378" width="840" height="52" rx="12" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="lbl" x="450" y="400" text-anchor="middle">Un équipement dissociable relève aussi de la décennale</text>
  <text class="lbl" x="450" y="421" text-anchor="middle">s'il rend l'ouvrage impropre à sa destination.</text>
</svg>
