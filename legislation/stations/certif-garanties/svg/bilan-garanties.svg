<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"
     aria-labelledby="t-bil" aria-describedby="d-bil" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-bil">Bilan : tout se compte à partir de la date de réception</title>
  <desc id="d-bil">À gauche, un procès-verbal de réception avec sa date encadrée en orange : c'est de
    cette date que part tout le reste. À droite, trois pastilles superposées : un an, parfait
    achèvement ; deux ans au minimum, bon fonctionnement ; dix ans, décennale. Une bande en bas
    donne le réflexe professionnel : connaître la date de réception et la garder avec le procès-verbal.</desc>
  <defs>
    <marker id="pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .qui  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl  { font-size:17px; fill:#10233c; }
    .sm   { font-size:16px; fill:#5a6b7d; }
    .puc  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#fffdf8; }
    .band { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#fffdf8; }
  </style>

  <text class="ttl" x="450" y="30" text-anchor="middle">Une date, trois durées</text>

  <!-- Le procès-verbal -->
  <rect x="30" y="56" width="290" height="250" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="qui" x="175" y="90" text-anchor="middle">Procès-verbal de réception</text>
  <rect x="60" y="110" width="230" height="8" rx="4" fill="#d6dee7"/>
  <rect x="60" y="130" width="190" height="8" rx="4" fill="#d6dee7"/>
  <rect x="60" y="164" width="230" height="64" rx="10" fill="#fff4e0" stroke="#e8914a" stroke-width="4"/>
  <text class="sm" x="175" y="188" text-anchor="middle">date de réception</text>
  <text class="qui" x="175" y="214" text-anchor="middle">le point de départ</text>
  <text class="lbl" x="175" y="262" text-anchor="middle">avec ou sans réserves</text>
  <text class="sm" x="175" y="286" text-anchor="middle">à conserver avec le dossier</text>

  <!-- Flèche -->
  <line x1="332" y1="180" x2="400" y2="180" stroke="#5a6b7d" stroke-width="4" marker-end="url(#pt)"/>

  <!-- Trois pastilles -->
  <rect x="412" y="56" width="120" height="66" rx="14" fill="#e8914a"/>
  <text class="puc" x="472" y="98" text-anchor="middle">1 an</text>
  <text class="qui" x="548" y="96">Parfait achèvement</text>

  <rect x="412" y="140" width="120" height="66" rx="14" fill="#2f5689"/>
  <text class="puc" x="472" y="170" text-anchor="middle">2 ans</text>
  <text class="sm" x="472" y="194" text-anchor="middle" style="fill:#fffdf8">au minimum</text>
  <text class="qui" x="548" y="180">Bon fonctionnement</text>

  <rect x="412" y="224" width="120" height="66" rx="14" fill="#3730a3"/>
  <text class="puc" x="472" y="266" text-anchor="middle">10 ans</text>
  <text class="qui" x="548" y="264">Décennale</text>

  <!-- Bande -->
  <rect x="30" y="330" width="840" height="70" rx="14" fill="#3730a3"/>
  <text class="band" x="450" y="362" text-anchor="middle">Le réflexe : connaître la date de réception de chaque chantier,</text>
  <text class="band" x="450" y="386" text-anchor="middle">et la garder avec le procès-verbal.</text>
</svg>
