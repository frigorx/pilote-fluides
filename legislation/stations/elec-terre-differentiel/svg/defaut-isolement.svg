<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"
     aria-labelledby="t-di" aria-describedby="d-di" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-di">Le défaut d'isolement : la carcasse devient une masse sous tension</title>
  <desc id="d-di">Deux carcasses d'appareil vues en coupe. À gauche, l'isolement est sain : le conducteur est entièrement enveloppé de son isolant et ne touche pas la carcasse. À droite, l'isolant est abîmé : le conducteur nu touche le fond de la carcasse au point entouré de rouge, et la carcasse est marquée sous tension par un éclair. Une bande en bas rappelle qu'une masse n'est pas sous tension en fonctionnement normal.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:21px; fill:#10233c; }
    .sub { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .acc { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#a16207; }
    .wht { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fff; }
    .bad { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#c0392b; }
    .nw { white-space:nowrap; }
  </style>
  <text class="ttl" x="225" y="42" text-anchor="middle">Isolement sain</text>
  <text class="ttl" x="675" y="42" text-anchor="middle">Défaut d'isolement</text>
  <line x1="450" y1="26" x2="450" y2="300" stroke="#b9c6d3" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="mut" x="60" y="95" text-anchor="start">carcasse (masse)</text>
  <rect x="60" y="110" width="330" height="150" rx="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="4"/>
  <rect x="90" y="173" width="270" height="24" rx="10" fill="#f6d3ae" stroke="#e8914a" stroke-width="2"/>
  <line x1="90" y1="185" x2="360" y2="185" stroke="#1b3a63" stroke-width="6" stroke-linecap="round"/>
  <text class="lbl" x="225" y="153" text-anchor="middle">conducteur de phase</text>
  <text class="lbl" x="225" y="228" text-anchor="middle">isolant intact</text>
  <text class="lbl" x="225" y="292" text-anchor="middle">aucun contact avec la carcasse</text>
  <text class="mut" x="510" y="95" text-anchor="start">carcasse (masse)</text>
  <rect x="510" y="110" width="330" height="150" rx="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="4"/>
  <rect x="540" y="173" width="90" height="24" rx="10" fill="#f6d3ae" stroke="#e8914a" stroke-width="2"/>
  <rect x="712" y="173" width="98" height="24" rx="10" fill="#f6d3ae" stroke="#e8914a" stroke-width="2"/>
  <line x1="540" y1="185" x2="810" y2="185" stroke="#1b3a63" stroke-width="6" stroke-linecap="round"/>
  <line x1="670" y1="185" x2="670" y2="258" stroke="#1b3a63" stroke-width="6" stroke-linecap="round"/>
  <circle cx="670" cy="258" r="14" fill="none" stroke="#c0392b" stroke-width="4"/>
  <polygon points="815,120 806,144 814,144 809,164 826,136 817,136 823,120" fill="#e8914a"/>
  <text class="lbl" x="625" y="153" text-anchor="middle">conducteur de phase</text>
  <text class="lbl" x="585" y="228" text-anchor="middle">isolant abîmé</text>
  <text class="lbl" x="670" y="292" text-anchor="middle">le conducteur touche la carcasse</text>
  <rect x="20" y="326" width="860" height="72" rx="14" fill="#f8efe0" stroke="#a16207" stroke-width="2"/>
  <text class="acc" x="450" y="356" text-anchor="middle">Une masse n'est pas sous tension en fonctionnement normal.</text>
  <text class="lbl" x="450" y="382" text-anchor="middle">Un défaut d'isolement suffit à la rendre dangereuse, sans que rien ne se voie.</text>
</svg>
