<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img"
     aria-labelledby="t-se" aria-describedby="d-se" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-se">La sensibilité : 500, 300, 30 milliampères</title>
  <desc id="d-se">À gauche, trois barres horizontales à l'échelle, une par sensibilité de dispositif différentiel couramment utilisée : 500 milliampères, 300 milliampères et 30 milliampères. La barre de 30 milliampères est la plus courte, en accent, marquée haute sensibilité. À droite, une liste des cas où l'INRS rend la haute sensibilité obligatoire : prises de courant jusqu'à 32 ampères, prises en locaux mouillés, installations temporaires, salles d'eau, logements.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:21px; fill:#10233c; }
    .sub { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .acc { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#a16207; }
    .wht { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fff; }
    .bad { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#c0392b; }
    .nw { white-space:nowrap; }
  </style>
  <text class="ttl" x="30" y="36" text-anchor="start">Plus la sensibilité est faible, plus il coupe tôt</text>
  <rect x="40" y="70" width="300" height="34" rx="6" fill="#d5dde6" stroke="#5a6b7d" stroke-width="2"/>
  <text class="lbl" x="355" y="94" text-anchor="start">500 mA</text>
  <rect x="40" y="130" width="180" height="34" rx="6" fill="#d5dde6" stroke="#5a6b7d" stroke-width="2"/>
  <text class="lbl" x="235" y="154" text-anchor="start">300 mA</text>
  <rect x="40" y="190" width="18" height="34" rx="4" fill="#a16207" stroke="#a16207" stroke-width="2"/>
  <text class="acc" x="72" y="214" text-anchor="start">30 mA</text>
  <text class="acc" x="40" y="256" text-anchor="start">≤ 30 mA : haute sensibilité,</text>
  <text class="acc" x="40" y="280" text-anchor="start">pour protéger les personnes</text>
  <text class="mut" x="40" y="310" text-anchor="start">Barres à l'échelle : 30 mA est plus de</text>
  <text class="mut" x="40" y="332" text-anchor="start">seize fois plus sensible que 500 mA.</text>
  <rect x="470" y="62" width="410" height="262" rx="12" fill="#fdf6ea" stroke="#a16207" stroke-width="3"/>
  <text class="acc" x="490" y="92" text-anchor="start">Obligatoire à 30 mA ou moins (INRS)</text>
  <g fill="#a16207"><circle cx="496" cy="130" r="5"/><circle cx="496" cy="170" r="5"/><circle cx="496" cy="210" r="5"/><circle cx="496" cy="250" r="5"/><circle cx="496" cy="290" r="5"/></g>
  <text class="lbl" x="514" y="136" text-anchor="start">prises de courant jusqu'à 32 A</text>
  <text class="lbl" x="514" y="176" text-anchor="start">prises en locaux mouillés</text>
  <text class="lbl" x="514" y="216" text-anchor="start">installations temporaires (chantiers…)</text>
  <text class="lbl" x="514" y="256" text-anchor="start">salles d'eau</text>
  <text class="lbl" x="514" y="296" text-anchor="start">logements</text>
</svg>
