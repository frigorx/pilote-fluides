<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"
     aria-labelledby="t-ms" aria-describedby="d-ms" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-ms">Les cinq vérifications à la mise en service</title>
  <desc id="d-ms">Cinq lignes numérotées. Un : continuité du conducteur de protection. Deux : valeur de la prise de terre. Trois : bon fonctionnement du dispositif différentiel, par le bouton test. Quatre : repérage des circuits. Cinq, en pointillé : la vérification initiale de l'installation, réalisée par un organisme accrédité.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:21px; fill:#10233c; }
    .sub { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .acc { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#a16207; }
    .wht { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fff; }
    .bad { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#c0392b; }
    .nw { white-space:nowrap; }
  </style>
  <text class="ttl" x="450" y="34" text-anchor="middle">Ce que l'on vérifie à la mise en service</text>
  <rect x="30" y="58" width="840" height="58" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="66" cy="87" r="17" fill="#a16207"/><text class="wht" x="66" y="94" text-anchor="middle">1</text>
  <text class="sub" x="100" y="84" text-anchor="start">Continuité du conducteur de protection</text>
  <text class="mut" x="100" y="106" text-anchor="start">chaque masse est réellement reliée à la terre</text>
  <rect x="30" y="126" width="840" height="58" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="66" cy="155" r="17" fill="#a16207"/><text class="wht" x="66" y="162" text-anchor="middle">2</text>
  <text class="sub" x="100" y="152" text-anchor="start">Valeur de la prise de terre</text>
  <text class="mut" x="100" y="174" text-anchor="start">elle reste compatible avec la sensibilité du différentiel</text>
  <rect x="30" y="194" width="840" height="58" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="66" cy="223" r="17" fill="#a16207"/><text class="wht" x="66" y="230" text-anchor="middle">3</text>
  <text class="sub" x="100" y="220" text-anchor="start">Bon fonctionnement du différentiel</text>
  <text class="mut" x="100" y="242" text-anchor="start">essai par le bouton test : le dispositif déclenche</text>
  <rect x="30" y="262" width="840" height="58" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="66" cy="291" r="17" fill="#a16207"/><text class="wht" x="66" y="298" text-anchor="middle">4</text>
  <text class="sub" x="100" y="288" text-anchor="start">Repérage des circuits</text>
  <text class="mut" x="100" y="310" text-anchor="start">on sait quel circuit est protégé par quel dispositif</text>
  <rect x="30" y="330" width="840" height="58" rx="12" fill="#fdf6ea" stroke="#a16207" stroke-width="3" stroke-dasharray="10 6"/>
  <circle cx="66" cy="359" r="17" fill="#a16207"/><text class="wht" x="66" y="366" text-anchor="middle">5</text>
  <text class="sub" x="100" y="356" text-anchor="start">Vérification initiale de l'installation</text>
  <text class="mut" x="100" y="378" text-anchor="start">réalisée par un organisme accrédité</text>
</svg>
