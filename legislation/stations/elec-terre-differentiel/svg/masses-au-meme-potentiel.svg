<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img"
     aria-labelledby="t-mp" aria-describedby="d-mp" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-mp">Toutes les masses reliées à la même prise de terre</title>
  <desc id="d-mp">Trois éléments en haut : la carcasse d'une pompe à chaleur, celle d'un groupe froid et une canalisation métallique du bâtiment. Chacun est relié par un conducteur à une barre commune, la borne principale de terre, en dessous. La barre est reliée à la prise de terre par le conducteur de terre. Une bande en bas rappelle que toutes les masses accessibles ensemble sont ainsi au même potentiel.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:21px; fill:#10233c; }
    .sub { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .acc { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#a16207; }
    .wht { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fff; }
    .bad { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#c0392b; }
    .nw { white-space:nowrap; }
  </style>
  <text class="ttl" x="450" y="34" text-anchor="middle">Toutes les masses au même potentiel</text>
  <rect x="40" y="70" width="190" height="100" rx="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="4"/>
  <text class="lbl" x="135" y="115" text-anchor="middle">Pompe à chaleur</text><text class="mut" x="135" y="140" text-anchor="middle">(carcasse)</text>
  <rect x="270" y="70" width="190" height="100" rx="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="4"/>
  <text class="lbl" x="365" y="115" text-anchor="middle">Groupe froid</text><text class="mut" x="365" y="140" text-anchor="middle">(carcasse)</text>
  <rect x="520" y="90" width="340" height="40" rx="20" fill="#eef3f9" stroke="#1b3a63" stroke-width="4"/>
  <text class="lbl" x="690" y="80" text-anchor="middle">canalisation métallique</text>
  <line x1="135" y1="170" x2="135" y2="245" stroke="#1b3a63" stroke-width="4"/>
  <line x1="365" y1="170" x2="365" y2="245" stroke="#1b3a63" stroke-width="4"/>
  <line x1="690" y1="130" x2="690" y2="245" stroke="#1b3a63" stroke-width="4" stroke-dasharray="12 7"/>
  <text class="lbl" x="150" y="215" text-anchor="start">conducteur de protection</text>
  <text class="lbl" x="705" y="215" text-anchor="start">liaison équipotentielle</text>
  <rect x="100" y="245" width="640" height="30" rx="8" fill="#a16207"/>
  <text class="wht" x="420" y="267" text-anchor="middle">borne principale de terre</text>
  <line x1="420" y1="275" x2="420" y2="330" stroke="#1b3a63" stroke-width="4"/>
  <text class="lbl" x="405" y="312" text-anchor="end">conducteur de terre</text>
  <g stroke="#1b3a63" stroke-width="4" stroke-linecap="round"><line x1="398" y1="330" x2="442" y2="330"/><line x1="405.48" y1="339" x2="434.52" y2="339"/><line x1="413.84" y1="348" x2="426.16" y2="348"/></g>
  <text class="lbl" x="452" y="346" text-anchor="start">prise de terre</text>
  <rect x="20" y="380" width="860" height="46" rx="14" fill="#f8efe0" stroke="#a16207" stroke-width="2"/>
  <text class="lbl" x="450" y="410" text-anchor="middle">Les masses touchables en même temps sont reliées : pas de différence de potentiel dangereuse.</text>
</svg>
