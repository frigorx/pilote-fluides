<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img"
     aria-labelledby="t-esc" aria-describedby="d-esc" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-esc">Un parcours de formation qui monte par paliers</title>
  <desc id="d-esc">Un escalier de cinq marches qui montent de gauche à droite : se former d'abord, avec un diplôme ou
    un titre ; maintenir ses obligations, habilitation et attestation d'aptitude ; financer avec le compte personnel
    de formation ; faire reconnaître son expérience par la validation des acquis ; piloter avec l'entretien de
    parcours professionnel. Un pictogramme de personne gravit l'escalier marche après marche et s'arrête sur la
    dernière. Une phrase en bas donne le réflexe : connaître la date de sa dernière habilitation et de son attestation.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#1b3a63; }
    .h    { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#9d174d; }
    .lbl  { font-size:17px; fill:#10233c; }
    .lblb { font-size:18px; fill:#10233c; font-weight:bold; }
  </style>

  <text class="ttl" x="450" y="34" text-anchor="middle">Un parcours qui monte par paliers</text>

  <!-- Marches -->
  <rect x="20"  y="316" width="160" height="60"  fill="#f3e4eb" stroke="#9d174d" stroke-width="3"/>
  <text class="h" x="32" y="342">Se former</text>
  <text class="lbl" x="32" y="364">d'abord</text>

  <rect x="190" y="268" width="160" height="108" fill="#f3e4eb" stroke="#9d174d" stroke-width="3"/>
  <text class="h" x="202" y="294">Maintenir</text>
  <text class="lbl" x="202" y="318">habilitation,</text>
  <text class="lbl" x="202" y="340">aptitude</text>

  <rect x="360" y="220" width="160" height="156" fill="#f3e4eb" stroke="#9d174d" stroke-width="3"/>
  <text class="h" x="372" y="246">Financer</text>
  <text class="lbl" x="372" y="270">le compte</text>
  <text class="lbl" x="372" y="292">personnel de</text>
  <text class="lbl" x="372" y="314">formation</text>

  <rect x="530" y="172" width="160" height="204" fill="#f3e4eb" stroke="#9d174d" stroke-width="3"/>
  <text class="h" x="542" y="198">Reconnaître</text>
  <text class="lbl" x="542" y="222">son expérience :</text>
  <text class="lbl" x="542" y="244">la validation</text>
  <text class="lbl" x="542" y="266">des acquis</text>

  <rect x="700" y="124" width="180" height="252" fill="#f3e4eb" stroke="#9d174d" stroke-width="3"/>
  <text class="h" x="712" y="150">Piloter</text>
  <text class="lbl" x="712" y="174">l'entretien de</text>
  <text class="lbl" x="712" y="196">parcours, tous</text>
  <text class="lbl" x="712" y="218">les quatre ans</text>

  <!-- Personne qui monte : elle finit sur la dernière marche -->
  <g fill="#e8914a" stroke="#9d174d" stroke-width="2" transform="translate(790 122)">
    <circle cx="0" cy="-34" r="9"/>
    <path d="M -12 0 v -18 q 0 -8 8 -8 h 8 q 8 0 8 8 v 18 z"/>
    <animateTransform attributeName="transform" type="translate"
      values="100,314; 100,314; 270,266; 440,218; 610,170; 790,122; 790,122"
      keyTimes="0;0.06;0.20;0.34;0.48;0.62;1" dur="13s" repeatCount="indefinite" calcMode="linear"/>
  </g>

  <text class="lblb" x="450" y="412" text-anchor="middle">Le réflexe : connaître la date de sa dernière habilitation et de son attestation.</text>
</svg>
