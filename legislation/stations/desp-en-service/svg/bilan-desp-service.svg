<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
     aria-labelledby="t-bil" aria-describedby="d-bil" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-bil">Bilan : le réflexe en fin de station</title>
  <desc id="d-bil">Quatre petites cases en haut résument les quatre points de la station : les
    inspections vérifient la conformité, la requalification est plus approfondie, le dossier
    d'exploitation rassemble tout, l'exploitant est responsable du suivi. En bas, une grande bande met
    en évidence le réflexe final : consulter le dossier d'exploitation et le texte réglementaire en
    vigueur pour connaître l'échéance exacte de l'équipement concerné.</desc>
  <style>
    .coltt { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#0c4a6e; }
    .lbl   { font-size:15px; fill:#10233c; }
    .band  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#fffdf8; }
    .plus  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:30px; fill:#5a6b7d; }
  </style>

  <!-- Quatre cases de rappel -->
  <rect x="20" y="20" width="200" height="120" rx="12" fill="#eaf2f6" stroke="#0c4a6e" stroke-width="2"/>
  <text class="coltt" x="120" y="50" text-anchor="middle">Inspections</text>
  <text class="lbl" x="120" y="76" text-anchor="middle">vérifient la</text>
  <text class="lbl" x="120" y="98" text-anchor="middle">conformité</text>

  <rect x="240" y="20" width="200" height="120" rx="12" fill="#eaf2f6" stroke="#0c4a6e" stroke-width="2"/>
  <text class="coltt" x="340" y="50" text-anchor="middle">Requalification</text>
  <text class="lbl" x="340" y="76" text-anchor="middle">contrôle plus</text>
  <text class="lbl" x="340" y="98" text-anchor="middle">approfondi</text>

  <rect x="460" y="20" width="200" height="120" rx="12" fill="#eaf2f6" stroke="#0c4a6e" stroke-width="2"/>
  <text class="coltt" x="560" y="50" text-anchor="middle">Dossier</text>
  <text class="lbl" x="560" y="76" text-anchor="middle">d'exploitation</text>
  <text class="lbl" x="560" y="98" text-anchor="middle">rassemble tout</text>

  <rect x="680" y="20" width="200" height="120" rx="12" fill="#eaf2f6" stroke="#0c4a6e" stroke-width="2"/>
  <text class="coltt" x="780" y="50" text-anchor="middle">Exploitant</text>
  <text class="lbl" x="780" y="76" text-anchor="middle">responsable</text>
  <text class="lbl" x="780" y="98" text-anchor="middle">du suivi</text>

  <!-- Réflexe -->
  <rect x="80" y="200" width="280" height="90" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="lbl" x="220" y="234" text-anchor="middle">Dossier</text>
  <text class="lbl" x="220" y="258" text-anchor="middle">d'exploitation</text>

  <text class="plus" x="410" y="256" text-anchor="middle">+</text>

  <rect x="460" y="200" width="330" height="90" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="lbl" x="625" y="234" text-anchor="middle">Texte réglementaire</text>
  <text class="lbl" x="625" y="258" text-anchor="middle">en vigueur</text>

  <rect x="20" y="320" width="860" height="50" rx="14" fill="#0c4a6e"/>
  <text class="band" x="450" y="352" text-anchor="middle">Le réflexe : l'échéance exacte de CET équipement s'y trouve écrite</text>
</svg>
