<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"
     aria-labelledby="t-ar" aria-describedby="d-ar" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-ar">Le relevé du bruit ambiant puis du bruit résiduel</title>
  <desc id="d-ar">Deux panneaux côte à côte. À gauche, machine en marche : une unité extérieure émet des ondes violettes vers un sonomètre monté sur trépied ; des arcs gris sur le bord droit représentent les bruits habituels ; on relève le bruit ambiant, machine plus bruits habituels. À droite, machine arrêtée : la même unité, grisée et sans ondes, le sonomètre au même endroit, les mêmes arcs gris ; on relève le bruit résiduel, bruits habituels seuls. Une bande en bas donne la formule : émergence égale niveau ambiant moins niveau résiduel, et une ligne rappelle que tout le reste est identique. L'animation éclaire d'abord le panneau de gauche, puis celui de droite, puis la bande ; l'image fixe est complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .hb  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .hv  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#6d28d9; }
    .t   { font-size:17px; fill:#10233c; }
    .g   { font-size:16px; fill:#5a6b7d; }
  </style>
<text class="ttl" x="400" y="34" text-anchor="middle">Le relevé : ambiant, puis résiduel</text>
  <g><rect x="20" y="58" width="370" height="286" rx="14" fill="#fffdf8" stroke="#5a6b7d" stroke-width="2"/>
  <text class="h" x="205" y="90" text-anchor="middle">1. Machine en marche</text>
  <text class="hv" x="205" y="116" text-anchor="middle">bruit ambiant</text>
  <line x1="32" y1="290" x2="378" y2="290" stroke="#5a6b7d" stroke-width="2.5"/>
  <rect x="50" y="190" width="60" height="60" rx="7" fill="#dfe7f0" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="80" cy="220" r="20" fill="none" stroke="#1b3a63" stroke-width="2.5"/>
    <path d="M 80 200 L 80 240 M 60 220 L 100 220" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="g" x="80" y="274" text-anchor="middle">en marche</text>
  <g><path d="M 151.0 197.5 A 45 45 0 0 1 151.0 242.5" fill="none" stroke="#6d28d9" stroke-width="4" stroke-linecap="round" opacity="1"/>
    <path d="M 177.0 182.5 A 75 75 0 0 1 177.0 257.5" fill="none" stroke="#6d28d9" stroke-width="4" stroke-linecap="round" opacity="1"/>
    <path d="M 202.9 167.5 A 105 105 0 0 1 202.9 272.5" fill="none" stroke="#6d28d9" stroke-width="4" stroke-linecap="round" opacity="1"/>
    <path d="M 228.9 152.5 A 135 135 0 0 1 228.9 287.5" fill="none" stroke="#6d28d9" stroke-width="4" stroke-linecap="round" opacity="1"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.1;1" dur="13s" repeatCount="indefinite"/></g>
  <line x1="284" y1="226" x2="284" y2="290" stroke="#1b3a63" stroke-width="3"/>
  <line x1="284" y1="264" x2="264" y2="290" stroke="#1b3a63" stroke-width="3"/>
  <line x1="284" y1="264" x2="304" y2="290" stroke="#1b3a63" stroke-width="3"/>
  <g>
    <line x1="284" y1="180" x2="284" y2="164" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="284" cy="160" r="6" fill="#1b3a63"/>
    <rect x="270" y="180" width="28" height="46" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <rect x="275" y="187" width="18" height="12" fill="#ede3f4" stroke="#1b3a63" stroke-width="1.5"/>
    <circle cx="284" cy="213" r="4" fill="#e8914a"/>
  </g>
  <text class="g" x="284" y="150" text-anchor="middle">sonomètre</text>
  <path d="M 353.7 213.7 A 16 16 0 0 0 353.7 236.3" fill="none" stroke="#5a6b7d" stroke-width="3" stroke-linecap="round" opacity="1"/>
    <path d="M 343.8 203.8 A 30 30 0 0 0 343.8 246.2" fill="none" stroke="#5a6b7d" stroke-width="3" stroke-linecap="round" opacity="1"/>
    <path d="M 333.9 193.9 A 44 44 0 0 0 333.9 256.1" fill="none" stroke="#5a6b7d" stroke-width="3" stroke-linecap="round" opacity="1"/>
  <text class="t" x="205" y="326" text-anchor="middle">machine + bruits habituels</text></g>
  <g><rect x="410" y="58" width="370" height="286" rx="14" fill="#f6f6f4" stroke="#5a6b7d" stroke-width="2"/>
  <text class="h" x="595" y="90" text-anchor="middle">2. Machine arrêtée</text>
  <text class="hv" x="595" y="116" text-anchor="middle">bruit résiduel</text>
  <line x1="422" y1="290" x2="768" y2="290" stroke="#5a6b7d" stroke-width="2.5"/>
  <rect x="440" y="190" width="60" height="60" rx="7" fill="#f1f2f4" stroke="#5a6b7d" stroke-width="3"/>
    <circle cx="470" cy="220" r="20" fill="none" stroke="#5a6b7d" stroke-width="2.5"/>
    <path d="M 470 200 L 470 240 M 450 220 L 490 220" stroke="#5a6b7d" stroke-width="2.5"/>
  <text class="g" x="470" y="274" text-anchor="middle">à l'arrêt</text>
  
  <line x1="674" y1="226" x2="674" y2="290" stroke="#1b3a63" stroke-width="3"/>
  <line x1="674" y1="264" x2="654" y2="290" stroke="#1b3a63" stroke-width="3"/>
  <line x1="674" y1="264" x2="694" y2="290" stroke="#1b3a63" stroke-width="3"/>
  <g>
    <line x1="674" y1="180" x2="674" y2="164" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="674" cy="160" r="6" fill="#1b3a63"/>
    <rect x="660" y="180" width="28" height="46" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <rect x="665" y="187" width="18" height="12" fill="#ede3f4" stroke="#1b3a63" stroke-width="1.5"/>
    <circle cx="674" cy="213" r="4" fill="#e8914a"/>
  </g>
  <text class="g" x="674" y="150" text-anchor="middle">sonomètre</text>
  <path d="M 743.7 213.7 A 16 16 0 0 0 743.7 236.3" fill="none" stroke="#5a6b7d" stroke-width="3" stroke-linecap="round" opacity="1"/>
    <path d="M 733.8 203.8 A 30 30 0 0 0 733.8 246.2" fill="none" stroke="#5a6b7d" stroke-width="3" stroke-linecap="round" opacity="1"/>
    <path d="M 723.9 193.9 A 44 44 0 0 0 723.9 256.1" fill="none" stroke="#5a6b7d" stroke-width="3" stroke-linecap="round" opacity="1"/>
  <text class="t" x="595" y="326" text-anchor="middle">bruits habituels seuls</text>
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.42;1" dur="13s" repeatCount="indefinite"/></g>
  <rect x="16" y="54" width="378" height="294" rx="16" fill="none" stroke="#e8914a" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.12000000000000001;0.32;0.34;1" dur="13s" repeatCount="indefinite"/></rect>
  <rect x="406" y="54" width="378" height="294" rx="16" fill="none" stroke="#e8914a" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.46;0.64;0.66;1" dur="13s" repeatCount="indefinite"/></rect>
  <g>
  <rect x="20" y="368" width="760" height="62" rx="14" fill="#ede3f4" stroke="#6d28d9" stroke-width="2.5"/>
  <text class="hv" x="400" y="408" text-anchor="middle">Émergence = niveau ambiant − niveau résiduel</text>
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.76;1" dur="13s" repeatCount="indefinite"/></g>
  <text class="g" x="400" y="466" text-anchor="middle">Même point, même heure, même météo, mêmes réglages : seule la machine change.</text>
</svg>
