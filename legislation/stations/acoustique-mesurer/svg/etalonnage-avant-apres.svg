<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" role="img"
     aria-labelledby="t-ea" aria-describedby="d-ea" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-ea">Étalonnage avant et après la série de mesures</title>
  <desc id="d-ea">Trois cartes reliées par des flèches orange : 1, avant, un calibreur posé sur le microphone, on note le niveau lu et le réglage éventuel ; 2, pendant, le sonomètre et ses ondes, on relève l'ambiant puis le résiduel sans toucher au matériel ; 3, après, le même calibreur sur le même micro, on note l'écart avec le contrôle d'avant. En dessous, deux issues : à gauche, encadrée d'un trait plein avec une coche, écart dans la tolérance, la série est utilisable ; à droite, encadrée d'un trait tireté avec une croix, écart hors tolérance, la série est à refaire. Une ligne rappelle que la tolérance se lit dans la notice et la méthode. L'animation fait apparaître les blocs dans l'ordre ; l'image fixe est complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .hb  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .hv  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#6d28d9; }
    .t   { font-size:17px; fill:#10233c; }
    .g   { font-size:16px; fill:#5a6b7d; }
  </style>
<text class="ttl" x="400" y="34" text-anchor="middle">Étalonner avant, étalonner après</text>
<g>
  <rect x="30" y="62" width="210" height="196" rx="14" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <g>
    <line x1="135" y1="138" x2="135" y2="122" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="135" cy="118" r="6" fill="#1b3a63"/>
    <rect x="121" y="138" width="28" height="46" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <rect x="126" y="145" width="18" height="12" fill="#ede3f4" stroke="#1b3a63" stroke-width="1.5"/>
    <circle cx="135" cy="171" r="4" fill="#e8914a"/>
  </g>
  <rect x="120" y="102" width="30" height="30" rx="6" fill="#e8914a" stroke="#1b3a63" stroke-width="3"/>
  <text class="h" x="135" y="204" text-anchor="middle">1. Avant</text>
  <text class="g" x="135" y="232" text-anchor="middle">calibreur sur le micro</text>
  <text class="t" x="135" y="290" text-anchor="middle">on note le niveau lu</text>
  <text class="t" x="135" y="314" text-anchor="middle">et le réglage éventuel</text>
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.13;1" dur="13s" repeatCount="indefinite"/>
  </g>
  <line x1="248" y1="160" x2="279.8" y2="160.0" stroke="#e8914a" stroke-width="4"/>
    <polygon points="287,160 277.1,155.2 277.1,164.8" fill="#e8914a"/>
  <g>
  <rect x="295" y="62" width="210" height="196" rx="14" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <g>
    <line x1="400" y1="138" x2="400" y2="122" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="400" cy="118" r="6" fill="#1b3a63"/>
    <rect x="386" y="138" width="28" height="46" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <rect x="391" y="145" width="18" height="12" fill="#ede3f4" stroke="#1b3a63" stroke-width="1.5"/>
    <circle cx="400" cy="171" r="4" fill="#e8914a"/>
  </g>
  <path d="M 439.6 140.4 A 22 22 0 0 1 439.6 171.6" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" opacity="1"/>
    <path d="M 450.9 129.1 A 38 38 0 0 1 450.9 182.9" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" opacity="1"/>
  <text class="h" x="400" y="204" text-anchor="middle">2. Pendant</text>
  <text class="g" x="400" y="232" text-anchor="middle">ambiant, puis résiduel</text>
  <text class="t" x="400" y="290" text-anchor="middle">on ne touche plus</text>
  <text class="t" x="400" y="314" text-anchor="middle">au matériel ni aux réglages</text>
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.21000000000000002;0.29000000000000004;1" dur="13s" repeatCount="indefinite"/>
  </g>
  <line x1="513" y1="160" x2="544.8" y2="160.0" stroke="#e8914a" stroke-width="4"/>
    <polygon points="552,160 542.1,155.2 542.1,164.8" fill="#e8914a"/>
  <g>
  <rect x="560" y="62" width="210" height="196" rx="14" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <g>
    <line x1="665" y1="138" x2="665" y2="122" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="665" cy="118" r="6" fill="#1b3a63"/>
    <rect x="651" y="138" width="28" height="46" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <rect x="656" y="145" width="18" height="12" fill="#ede3f4" stroke="#1b3a63" stroke-width="1.5"/>
    <circle cx="665" cy="171" r="4" fill="#e8914a"/>
  </g>
  <rect x="650" y="102" width="30" height="30" rx="6" fill="#e8914a" stroke="#1b3a63" stroke-width="3"/>
  <text class="h" x="665" y="204" text-anchor="middle">3. Après</text>
  <text class="g" x="665" y="232" text-anchor="middle">même calibreur, même micro</text>
  <text class="t" x="665" y="290" text-anchor="middle">on note l'écart</text>
  <text class="t" x="665" y="314" text-anchor="middle">avec le contrôle d'avant</text>
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.37;0.45;1" dur="13s" repeatCount="indefinite"/>
  </g>
  <g>
  <rect x="30" y="358" width="360" height="90" rx="14" fill="#eef3f9" stroke="#047857" stroke-width="3"/>
  <path d="M 58 400 l 9 10 l 18 -22" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="hb" x="100" y="392">Écart dans la tolérance</text>
  <text class="t" x="100" y="420">la série est utilisable</text>
  <rect x="410" y="358" width="360" height="90" rx="14" fill="#eef3f9" stroke="#e8914a" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M 440 384 l 18 18 M 458 384 l -18 18" fill="none" stroke="#e8914a" stroke-width="5" stroke-linecap="round"/>
  <text class="hb" x="480" y="392">Écart hors tolérance</text>
  <text class="t" x="480" y="420">la série est à refaire</text>
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.7;1" dur="13s" repeatCount="indefinite"/>
  </g>
  <text class="g" x="400" y="486" text-anchor="middle">La tolérance se lit dans la notice de l'appareil et dans la méthode retenue.</text>
</svg>
