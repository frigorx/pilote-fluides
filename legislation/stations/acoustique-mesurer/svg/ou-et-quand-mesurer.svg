<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-oq" aria-describedby="d-oq" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-oq">Où et quand mesurer</title>
  <desc id="d-oq">Vue de dessus. À gauche, l'installation avec son unité extérieure contre le mur ; au centre, la limite de propriété en tirets ; à droite, le logement du plaignant, dont une fenêtre donne sur l'installation. Deux repères pour le microphone : un premier, barré d'une croix orange, tout près de l'unité ; un second, coché, dans la pièce chez le plaignant. En bas, trois conditions à noter avec leur pictogramme : l'heure de la gêne, le jour et la nuit ; la météo, vent et pluie ; la durée de chaque relevé.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .hb  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .hv  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#6d28d9; }
    .t   { font-size:17px; fill:#10233c; }
    .g   { font-size:16px; fill:#5a6b7d; }
  </style>
<text class="ttl" x="400" y="34" text-anchor="middle">Mesurer là où le bruit est perçu</text>
  <!-- installation -->
  <polygon points="40,160 130,115 220,160" fill="#dfe7f0" stroke="#1b3a63" stroke-width="3" stroke-linejoin="round"/>
  <rect x="40" y="160" width="180" height="160" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <rect x="222" y="225" width="44" height="60" rx="7" fill="#dfe7f0" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="244" cy="255" r="20" fill="none" stroke="#1b3a63" stroke-width="2.5"/>
    <path d="M 244 235 L 244 275 M 224 255 L 264 255" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="g" x="130" y="350" text-anchor="middle">Installation</text>
  <text class="g" x="130" y="372" text-anchor="middle">et unité extérieure</text>
  <!-- limite -->
  <line x1="400" y1="120" x2="400" y2="320" stroke="#5a6b7d" stroke-width="3" stroke-dasharray="10 8"/>
  <text class="g" x="400" y="106" text-anchor="middle">limite de propriété</text>
  <!-- logement -->
  <polygon points="510,160 640,115 770,160" fill="#dfe7f0" stroke="#1b3a63" stroke-width="3" stroke-linejoin="round"/>
  <rect x="510" y="160" width="260" height="160" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <rect x="504" y="205" width="14" height="60" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="g" x="640" y="350" text-anchor="middle">Logement du plaignant</text>
  <!-- repère 1 : trop près -->
  <text class="g" x="322" y="190" text-anchor="middle">tout près</text>
  <text class="g" x="322" y="210" text-anchor="middle">de l'unité</text>
  <circle cx="322" cy="256" r="24" fill="#fffdf8" stroke="#e8914a" stroke-width="4"/>
  <path d="M 313 247 l 18 18 M 331 247 l -18 18" fill="none" stroke="#e8914a" stroke-width="5" stroke-linecap="round"/>
  <!-- repère 2 : chez le plaignant -->
  <text class="g" x="608" y="190" text-anchor="middle">dans la pièce,</text>
  <text class="g" x="608" y="210" text-anchor="middle">chez le plaignant</text>
  <circle cx="608" cy="256" r="24" fill="#fffdf8" stroke="#047857" stroke-width="4"/>
  <path d="M 597 258 l 7.2 8 l 14.4 -17.6" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- conditions -->
  <text class="h" x="400" y="408" text-anchor="middle">Trois conditions à noter</text>
  <circle cx="66" cy="452" r="20" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/><path d="M 66 452 L 66 440 M 66 452 L 75 457" stroke="#1b3a63" stroke-width="3" stroke-linecap="round"/>
  <text class="hb" x="102" y="450">l'heure de la gêne</text>
  <text class="g" x="102" y="474">le jour et la nuit</text>
  <path d="M 308 442 h 30 a 7 7 0 1 0 -7 -7 M 308 454 h 40 a 7 7 0 1 1 -7 7 M 308 466 h 22" fill="none" stroke="#1b3a63" stroke-width="3" stroke-linecap="round"/>
  <text class="hb" x="362" y="450">la météo</text>
  <text class="g" x="362" y="474">vent, pluie, notés</text>
  <path d="M 572 432 h 28 M 572 472 h 28 M 574 432 L 598 472 M 598 432 L 574 472" fill="none" stroke="#1b3a63" stroke-width="3" stroke-linecap="round"/>
  <text class="hb" x="622" y="450">la durée</text>
  <text class="g" x="622" y="474">de chaque relevé</text>
  
</svg>
