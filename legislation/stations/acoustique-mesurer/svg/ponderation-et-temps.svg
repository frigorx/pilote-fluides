<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"
     aria-labelledby="t-pt" aria-describedby="d-pt" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-pt">Pondération A et constante de temps</title>
  <desc id="d-pt">Deux graphiques. À gauche, la sensibilité en fonction de la fréquence, des graves aux aigus : une ligne grise en tirets horizontale pour un appareil sans pondération, et une courbe violette pour la pondération A, très basse dans les graves, qui monte puis redescend légèrement dans les aigus. À droite, le niveau sonore en fonction du temps : un bruit qui fluctue en gris, la réponse rapide en orange qui le suit de près, la réponse lente en bleu qui le lisse, et une ligne violette en tirets, le niveau continu équivalent, une seule valeur pour toute la durée. Une légende sous chaque graphique. L'animation trace les courbes l'une après l'autre ; l'image fixe est complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .hb  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .hv  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#6d28d9; }
    .t   { font-size:17px; fill:#10233c; }
    .g   { font-size:16px; fill:#5a6b7d; }
  </style>

  <text class="ttl" x="400" y="34" text-anchor="middle">Deux réglages : la pondération et la constante de temps</text>
  <text class="hv" x="50" y="76">Pondération A</text>
  <text class="hv" x="430" y="76">Constante de temps</text>
  <!-- panneau gauche -->
  <line x1="50" y1="92" x2="50" y2="290" stroke="#5a6b7d" stroke-width="2.5"/>
  <line x1="50" y1="290" x2="380" y2="290" stroke="#5a6b7d" stroke-width="2.5"/>
  <text class="g" x="58" y="112">sensibilité</text>
  <text class="g" x="60" y="314">graves</text>
  <text class="g" x="378" y="314" text-anchor="end">aigus</text>
  <line x1="52" y1="150" x2="378" y2="150" stroke="#5a6b7d" stroke-width="3" stroke-dasharray="9 7"/>
  <path d="M 52 275 C 110 268 150 215 205 170 S 300 128 335 140 S 368 160 378 178" fill="none" stroke="#6d28d9" stroke-width="5" pathLength="1" stroke-dasharray="1 1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.05;0.2;1" dur="13s" repeatCount="indefinite"/></path>
  <!-- panneau droit -->
  <line x1="430" y1="92" x2="430" y2="290" stroke="#5a6b7d" stroke-width="2.5"/>
  <line x1="430" y1="290" x2="760" y2="290" stroke="#5a6b7d" stroke-width="2.5"/>
  <text class="g" x="438" y="112">niveau sonore</text>
  <text class="g" x="758" y="314" text-anchor="end">temps</text>
  <polyline points="440,230 470,200 490,250 520,150 545,240 575,210 600,120 625,235 655,215 685,160 710,245 740,225" fill="none" stroke="#5a6b7d" stroke-width="2.5" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" opacity="0.85"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.24;0.36;1" dur="13s" repeatCount="indefinite"/></polyline>
  <polyline points="440,226 470,206 490,238 520,168 545,232 575,212 600,146 625,226 655,214 685,176 710,232 740,224" fill="none" stroke="#e8914a" stroke-width="4" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.4;0.5;1" dur="13s" repeatCount="indefinite"/></polyline>
  <polyline points="440,222 500,214 560,204 620,196 680,192 740,200" fill="none" stroke="#1b3a63" stroke-width="4" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.54;0.64;1" dur="13s" repeatCount="indefinite"/></polyline>
  <line x1="432" y1="186" x2="758" y2="186" stroke="#6d28d9" stroke-width="3.5" stroke-dasharray="14 8"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.76;1" dur="13s" repeatCount="indefinite"/></line>
  <!-- légendes -->
  <line x1="50" y1="360" x2="92" y2="360" stroke="#6d28d9" stroke-width="5"/>
  <text class="t" x="104" y="366">avec la pondération A</text>
  <line x1="50" y1="392" x2="92" y2="392" stroke="#5a6b7d" stroke-width="3" stroke-dasharray="9 7"/>
  <text class="t" x="104" y="398">sans pondération</text>
  <line x1="430" y1="360" x2="472" y2="360" stroke="#5a6b7d" stroke-width="3"/>
  <text class="t" x="484" y="366">le bruit qui fluctue</text>
  <line x1="430" y1="392" x2="472" y2="392" stroke="#e8914a" stroke-width="5"/>
  <text class="t" x="484" y="398">réponse rapide : suit le bruit</text>
  <line x1="430" y1="424" x2="472" y2="424" stroke="#1b3a63" stroke-width="5"/>
  <text class="t" x="484" y="430">réponse lente : lisse le bruit</text>
  <line x1="430" y1="456" x2="472" y2="456" stroke="#6d28d9" stroke-width="3.5" stroke-dasharray="10 6"/>
  <text class="t" x="484" y="462">niveau continu équivalent (LAeq)</text>
</svg>
