<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img"
     aria-labelledby="t-cs" aria-describedby="d-cs" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-cs">La chaîne de mesure d'un sonomètre</title>
  <desc id="d-cs">Cinq blocs alignés de gauche à droite reliés par des flèches : le microphone qui capte la pression de l'air, le filtre de pondération A qui imite l'oreille, le détecteur qui règle la vitesse de réaction, l'intégrateur qui moyenne l'énergie sur la durée, l'affichage en décibels. Au-dessus du premier bloc, une flèche orange venue de la pression acoustique. En bas, une bande : pour un bruit de voisinage, sonomètre intégrateur homologué de classe 1 ou de classe 2. L'animation éclaire les blocs l'un après l'autre ; l'image fixe est complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .hb  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .hv  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#6d28d9; }
    .t   { font-size:17px; fill:#10233c; }
    .g   { font-size:16px; fill:#5a6b7d; }
  </style>

  <text class="ttl" x="400" y="34" text-anchor="middle">La chaîne de mesure d'un sonomètre</text>
  <text class="g" x="90" y="112" text-anchor="middle">Pression acoustique</text>
  <line x1="90" y1="120" x2="90.0" y2="146.8" stroke="#e8914a" stroke-width="3"/>
    <polygon points="90,154 94.8,144.1 85.2,144.1" fill="#e8914a"/>
  <rect x="25" y="160" width="130" height="70" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <text class="hb" x="90" y="202" text-anchor="middle">Microphone</text>
  <text class="g" x="90" y="262" text-anchor="middle">capte la pression</text>
  <text class="g" x="90" y="284" text-anchor="middle">de l'air</text>
  <line x1="158" y1="195" x2="169.8" y2="195.0" stroke="#5a6b7d" stroke-width="3"/>
    <polygon points="177,195 167.1,190.2 167.1,199.8" fill="#5a6b7d"/>
  <rect x="180" y="160" width="130" height="70" rx="12" fill="#ede3f4" stroke="#1b3a63" stroke-width="3"/>
  <text class="hb" x="245" y="202" text-anchor="middle">Filtre A</text>
  <text class="g" x="245" y="262" text-anchor="middle">imite l'oreille</text>
  <text class="g" x="245" y="284" text-anchor="middle">(pondération A)</text>
  <line x1="313" y1="195" x2="324.8" y2="195.0" stroke="#5a6b7d" stroke-width="3"/>
    <polygon points="332,195 322.1,190.2 322.1,199.8" fill="#5a6b7d"/>
  <rect x="335" y="160" width="130" height="70" rx="12" fill="#ede3f4" stroke="#1b3a63" stroke-width="3"/>
  <text class="hb" x="400" y="202" text-anchor="middle">Détecteur</text>
  <text class="g" x="400" y="262" text-anchor="middle">règle la vitesse</text>
  <text class="g" x="400" y="284" text-anchor="middle">de réaction</text>
  <line x1="468" y1="195" x2="479.8" y2="195.0" stroke="#5a6b7d" stroke-width="3"/>
    <polygon points="487,195 477.1,190.2 477.1,199.8" fill="#5a6b7d"/>
  <rect x="490" y="160" width="130" height="70" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <text class="hb" x="555" y="202" text-anchor="middle">Intégrateur</text>
  <text class="g" x="555" y="262" text-anchor="middle">moyenne l'énergie</text>
  <text class="g" x="555" y="284" text-anchor="middle">sur la durée</text>
  <line x1="623" y1="195" x2="634.8" y2="195.0" stroke="#5a6b7d" stroke-width="3"/>
    <polygon points="642,195 632.1,190.2 632.1,199.8" fill="#5a6b7d"/>
  <rect x="645" y="160" width="130" height="70" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <text class="hb" x="710" y="202" text-anchor="middle">Affichage</text>
  <text class="g" x="710" y="262" text-anchor="middle">affiche le niveau</text>
  <text class="g" x="710" y="284" text-anchor="middle">en décibels</text>
  <rect x="21" y="156" width="138" height="78" rx="14" fill="none" stroke="#e8914a" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.06;0.08;0.18;0.19999999999999998;1" dur="13s" repeatCount="indefinite"/></rect>
  <rect x="176" y="156" width="138" height="78" rx="14" fill="none" stroke="#e8914a" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.32;0.34;1" dur="13s" repeatCount="indefinite"/></rect>
  <rect x="331" y="156" width="138" height="78" rx="14" fill="none" stroke="#e8914a" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.36000000000000004;0.46;0.48000000000000004;1" dur="13s" repeatCount="indefinite"/></rect>
  <rect x="486" y="156" width="138" height="78" rx="14" fill="none" stroke="#e8914a" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48000000000000004;0.5;0.6000000000000001;0.6200000000000001;1" dur="13s" repeatCount="indefinite"/></rect>
  <rect x="641" y="156" width="138" height="78" rx="14" fill="none" stroke="#e8914a" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6200000000000001;0.6400000000000001;0.7400000000000001;0.7600000000000001;1" dur="13s" repeatCount="indefinite"/></rect>
  <rect x="25" y="330" width="750" height="80" rx="14" fill="#ede3f4" stroke="#6d28d9" stroke-width="2.5"/>
  <text class="hv" x="400" y="362" text-anchor="middle">Bruit de voisinage : un sonomètre intégrateur homologué,</text>
  <text class="h" x="400" y="392" text-anchor="middle">de classe 1 ou de classe 2</text>
  <text class="g" x="400" y="446" text-anchor="middle">Le calibreur contrôle toute cette chaîne sur le terrain : voir l'écran 4.</text>
</svg>
