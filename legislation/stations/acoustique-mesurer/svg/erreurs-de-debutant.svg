<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"
     aria-labelledby="t-ed" aria-describedby="d-ed" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-ed">Les trois erreurs de débutant</title>
  <desc id="d-ed">Trois cartes, chacune marquée d'une croix orange dans le coin. Première carte, trop près de la machine : une unité extérieure avec ses ondes et un sonomètre tout proche ; le niveau relevé n'est pas celui reçu par le voisin. Deuxième carte, pas de bruit résiduel : on ne relève que la machine en marche et ses ondes, jamais la machine arrêtée ; sans résiduel, pas d'émergence. Troisième carte, vent sur le microphone : des lignes de vent gris soufflent vers un sonomètre ; le souffle s'ajoute au bruit mesuré, il faut protéger le micro et noter la météo. En bas, la consigne : et toujours, étalonner avant et après.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .hb  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .hv  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#6d28d9; }
    .t   { font-size:17px; fill:#10233c; }
    .g   { font-size:16px; fill:#5a6b7d; }
  </style>
<text class="ttl" x="400" y="34" text-anchor="middle">Trois erreurs de débutant</text>
<rect x="25" y="60" width="230" height="376" rx="14" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <rect x="49" y="150" width="50" height="50" rx="7" fill="#dfe7f0" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="74" cy="175" r="16.666666666666668" fill="none" stroke="#1b3a63" stroke-width="2.5"/>
    <path d="M 74 158.33333333333334 L 74 191.66666666666666 M 57.33333333333333 175 L 90.66666666666667 175" stroke="#1b3a63" stroke-width="2.5"/><path d="M 116.6 159.4 A 22 22 0 0 1 116.6 190.6" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" opacity="1"/>
    <path d="M 129.3 146.7 A 40 40 0 0 1 129.3 203.3" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" opacity="1"/><g>
    <line x1="167" y1="150" x2="167" y2="134" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="167" cy="130" r="6" fill="#1b3a63"/>
    <rect x="153" y="150" width="28" height="46" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <rect x="158" y="157" width="18" height="12" fill="#ede3f4" stroke="#1b3a63" stroke-width="1.5"/>
    <circle cx="167" cy="183" r="4" fill="#e8914a"/>
  </g>
  <circle cx="225" cy="90" r="18" fill="#fffdf8" stroke="#e8914a" stroke-width="4"/><path d="M 216 81 l 9 9 M 225 81 l -9 9" fill="none" stroke="#e8914a" stroke-width="5" stroke-linecap="round"/>
  <text class="h" x="140" y="252" text-anchor="middle">Trop près</text>
  <text class="h" x="140" y="278" text-anchor="middle">de la machine</text>
  <text class="t" x="140" y="322" text-anchor="middle">Ce n'est pas le niveau</text>
  <text class="t" x="140" y="348" text-anchor="middle">reçu par le voisin.</text>
  <text class="t" x="140" y="374" text-anchor="middle">Mesurer là où il</text>
  <text class="t" x="140" y="400" text-anchor="middle">l'entend.</text>
  <rect x="285" y="60" width="230" height="376" rx="14" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <rect x="309" y="150" width="50" height="50" rx="7" fill="#dfe7f0" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="334" cy="175" r="16.666666666666668" fill="none" stroke="#1b3a63" stroke-width="2.5"/>
    <path d="M 334 158.33333333333334 L 334 191.66666666666666 M 317.3333333333333 175 L 350.6666666666667 175" stroke="#1b3a63" stroke-width="2.5"/><path d="M 376.6 159.4 A 22 22 0 0 1 376.6 190.6" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" opacity="1"/>
    <path d="M 389.3 146.7 A 40 40 0 0 1 389.3 203.3" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" opacity="1"/>
    <path d="M 402.0 134.0 A 58 58 0 0 1 402.0 216.0" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" opacity="1"/><g>
    <line x1="467" y1="150" x2="467" y2="134" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="467" cy="130" r="6" fill="#1b3a63"/>
    <rect x="453" y="150" width="28" height="46" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <rect x="458" y="157" width="18" height="12" fill="#ede3f4" stroke="#1b3a63" stroke-width="1.5"/>
    <circle cx="467" cy="183" r="4" fill="#e8914a"/>
  </g>
  
  <circle cx="485" cy="90" r="18" fill="#fffdf8" stroke="#e8914a" stroke-width="4"/><path d="M 476 81 l 9 9 M 485 81 l -9 9" fill="none" stroke="#e8914a" stroke-width="5" stroke-linecap="round"/>
  <text class="h" x="400" y="252" text-anchor="middle">Pas de</text>
  <text class="h" x="400" y="278" text-anchor="middle">bruit résiduel</text>
  <text class="t" x="400" y="322" text-anchor="middle">Sans résiduel,</text>
  <text class="t" x="400" y="348" text-anchor="middle">pas d'émergence :</text>
  <text class="t" x="400" y="374" text-anchor="middle">aucune conclusion</text>
  <text class="t" x="400" y="400" text-anchor="middle">n'est possible.</text>
  <rect x="545" y="60" width="230" height="376" rx="14" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <path d="M 567 158 h 60 a 9 9 0 1 0 -9 -9 M 567 176 h 84 a 9 9 0 1 1 -9 9 M 567 194 h 44" fill="none" stroke="#5a6b7d" stroke-width="4" stroke-linecap="round"/><g>
    <line x1="719" y1="150" x2="719" y2="134" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="719" cy="130" r="6" fill="#1b3a63"/>
    <rect x="705" y="150" width="28" height="46" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
    <rect x="710" y="157" width="18" height="12" fill="#ede3f4" stroke="#1b3a63" stroke-width="1.5"/>
    <circle cx="719" cy="183" r="4" fill="#e8914a"/>
  </g>
  <circle cx="745" cy="90" r="18" fill="#fffdf8" stroke="#e8914a" stroke-width="4"/><path d="M 736 81 l 9 9 M 745 81 l -9 9" fill="none" stroke="#e8914a" stroke-width="5" stroke-linecap="round"/>
  <text class="h" x="660" y="252" text-anchor="middle">Vent sur</text>
  <text class="h" x="660" y="278" text-anchor="middle">le microphone</text>
  <text class="t" x="660" y="322" text-anchor="middle">Le souffle s'ajoute</text>
  <text class="t" x="660" y="348" text-anchor="middle">au bruit mesuré.</text>
  <text class="t" x="660" y="374" text-anchor="middle">Protéger le micro,</text>
  <text class="t" x="660" y="400" text-anchor="middle">noter la météo.</text>
  
  <text class="hv" x="400" y="474" text-anchor="middle">Et toujours : étalonner avant et après.</text>
</svg>
