<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t-bil" aria-describedby="d-bil" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-bil">Bilan : ce qui oblige, ce qui n'oblige pas</title>
  <desc id="d-bil">Un tableau à trois colonnes, nature, qui l'écrit, oblige-t-il, et cinq lignes. Règlement, directive, loi, décret, arrêté : écrits par l'Union, le Parlement ou le gouvernement, ils obligent, la directive après transposition. La norme : écrite par les organismes de normalisation, elle n'oblige pas, elle est volontaire. La norme rendue obligatoire : norme plus arrêté, elle oblige par l'arrêté. Le NF DTU : écrit par les professionnels, il oblige par le contrat. L'avis technique : écrit par le CSTB, il n'oblige pas, il éclaire. Une bande donne le réflexe : pour chaque référence, dire ce qui l'oblige. Image fixe.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:21px; fill:#10233c; }
    .h    { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#3730a3; }
    .hb   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .lbl  { font-size:17px; fill:#10233c; }
    .sm   { font-size:16px; fill:#5a6b7d; }
    .band { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .wht  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#fffdf8; }
  </style>
  <g><rect x="20" y="20" width="250" height="44" rx="0" fill="#3730a3" stroke="#3730a3" stroke-width="2"/><text class="wht" x="145.0" y="49" text-anchor="middle">Nature</text></g>
  <g><rect x="270" y="20" width="330" height="44" rx="0" fill="#3730a3" stroke="#3730a3" stroke-width="2"/><text class="wht" x="435.0" y="49" text-anchor="middle">Qui l'écrit</text></g>
  <g><rect x="600" y="20" width="280" height="44" rx="0" fill="#3730a3" stroke="#3730a3" stroke-width="2"/><text class="wht" x="740.0" y="49" text-anchor="middle">Oblige-t-il ?</text></g>
  <g><rect x="20" y="64" width="250" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="hb" x="145.0" y="89" text-anchor="middle">Règlement, directive,</text><text class="lbl" x="145.0" y="111" text-anchor="middle">loi, décret, arrêté</text><rect x="270" y="64" width="330" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="lbl" x="435.0" y="99" text-anchor="middle">Union, Parlement, gouvernement</text><rect x="600" y="64" width="280" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="hb" x="740.0" y="89" text-anchor="middle">Oui</text><text class="lbl" x="740.0" y="111" text-anchor="middle">(directive : après transposition)</text></g>
  <g><rect x="20" y="122" width="250" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="hb" x="145.0" y="157" text-anchor="middle">Norme</text><rect x="270" y="122" width="330" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="lbl" x="435.0" y="157" text-anchor="middle">organismes de normalisation</text><rect x="600" y="122" width="280" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="hb" x="740.0" y="157" text-anchor="middle">Non : volontaire</text></g>
  <g><rect x="20" y="180" width="250" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="hb" x="145.0" y="205" text-anchor="middle">Norme rendue</text><text class="lbl" x="145.0" y="227" text-anchor="middle">obligatoire</text><rect x="270" y="180" width="330" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="lbl" x="435.0" y="215" text-anchor="middle">la norme, puis un arrêté</text><rect x="600" y="180" width="280" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="hb" x="740.0" y="215" text-anchor="middle">Oui, par l'arrêté</text></g>
  <g><rect x="20" y="238" width="250" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="hb" x="145.0" y="273" text-anchor="middle">NF DTU</text><rect x="270" y="238" width="330" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="lbl" x="435.0" y="273" text-anchor="middle">les professionnels, validé par l'AFNOR</text><rect x="600" y="238" width="280" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="hb" x="740.0" y="273" text-anchor="middle">Oui, par le contrat</text></g>
  <g><rect x="20" y="296" width="250" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="hb" x="145.0" y="331" text-anchor="middle">Avis technique</text><rect x="270" y="296" width="330" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="lbl" x="435.0" y="331" text-anchor="middle">le CSTB</text><rect x="600" y="296" width="280" height="58" rx="0" fill="#fffdf8" stroke="#5a6b7d" stroke-width="1.5"/><text class="hb" x="740.0" y="331" text-anchor="middle">Non : il éclaire</text></g>
  <g><rect x="20" y="372" width="860" height="44" rx="12" fill="#e8e7f6" stroke="#3730a3" stroke-width="2"/><text class="band" x="450" y="401" text-anchor="middle">Le réflexe : pour chaque référence, dire ce qui l'oblige</text></g>
</svg>
