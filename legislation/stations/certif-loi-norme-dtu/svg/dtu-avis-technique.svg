<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="t-dtu" aria-describedby="d-dtu" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-dtu">Le DTU et l'avis technique : procédé courant, procédé nouveau</title>
  <desc id="d-dtu">Deux cartes côte à côte. À gauche, le NF DTU, pour le procédé courant : ce sont les règles de l'art de mise en œuvre, une norme française validée par l'AFNOR, obligatoire si le marché y renvoie. À droite, l'avis technique du CSTB, pour le procédé nouveau : une évaluation volontaire demandée par le fabricant, pour un produit ou un procédé hors du savoir-faire courant. Une bande dit que ni l'un ni l'autre n'est un texte de loi : c'est le marché qui les rend obligatoires. Image fixe.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:21px; fill:#10233c; }
    .h    { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#3730a3; }
    .hb   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .lbl  { font-size:17px; fill:#10233c; }
    .sm   { font-size:16px; fill:#5a6b7d; }
    .band { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .wht  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#fffdf8; }
  </style>
  <g><rect x="20" y="20" width="420" height="270" rx="12" fill="#fffdf8" stroke="#3730a3" stroke-width="3"/><rect x="20" y="20" width="420" height="56" rx="12" fill="#3730a3" stroke="#3730a3" stroke-width="3"/><rect x="20" y="52" width="420" height="24" fill="#3730a3"/><text class="wht" x="230" y="56" text-anchor="middle">NF DTU — procédé courant</text><text class="h" x="230" y="118" text-anchor="middle">Les règles de l'art</text><text class="h" x="230" y="144" text-anchor="middle">de mise en œuvre</text><text class="lbl" x="230" y="190" text-anchor="middle">une norme française</text><text class="lbl" x="230" y="214" text-anchor="middle">validée par l'AFNOR</text><text class="lbl" x="230" y="258" text-anchor="middle">obligatoire si le marché y renvoie</text></g>
  <g><rect x="460" y="20" width="420" height="270" rx="12" fill="#fffdf8" stroke="#e8914a" stroke-width="3"/><rect x="460" y="20" width="420" height="56" rx="12" fill="#e8914a" stroke="#e8914a" stroke-width="3"/><rect x="460" y="52" width="420" height="24" fill="#e8914a"/><text class="wht" x="670" y="56" text-anchor="middle">Avis technique — procédé nouveau</text><text class="h" x="670" y="118" text-anchor="middle">Une évaluation du CSTB</text><text class="h" x="670" y="144" text-anchor="middle">pour un produit hors du courant</text><text class="lbl" x="670" y="190" text-anchor="middle">volontaire : demandée</text><text class="lbl" x="670" y="214" text-anchor="middle">par le fabricant</text><text class="lbl" x="670" y="258" text-anchor="middle">il éclaire, il n'oblige pas seul</text></g>
  <g><rect x="20" y="314" width="860" height="76" rx="12" fill="#e8e7f6" stroke="#3730a3" stroke-width="2"/><text class="band" x="450" y="346" text-anchor="middle">Ni l'un ni l'autre n'est un texte de loi.</text><text class="band" x="450" y="376" text-anchor="middle">C'est le marché, le contrat, qui les rend obligatoires.</text></g>
</svg>
