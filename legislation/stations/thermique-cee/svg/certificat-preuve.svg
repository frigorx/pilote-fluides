<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-cp" aria-describedby="d-cp" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-cp">Le certificat d'économie d'énergie, la preuve que l'obligation est remplie</title>
  <desc id="d-cp">Des travaux réalisés, à gauche, donnent lieu à un certificat, au centre, timbré
    d'un sceau. Une pile de plusieurs certificats semblables est représentée à droite, avec la
    mention « à produire en nombre suffisant pour remplir l'obligation fixée par l'État ».</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl { font-size:15px; fill:#5a6b7d; }
    .foc { font-size:15px; fill:#92400e; font-weight:bold; }
  </style>

  <text class="ttl" x="450" y="26" text-anchor="middle">Le certificat, la preuve à produire</text>

  <rect x="60" y="120" width="150" height="100" rx="10" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2.5"/>
  <text class="lbl" x="135" y="240" text-anchor="middle" fill="#10233c" font-weight="bold">travaux réalisés</text>

  <path d="M 220 170 C 280 170, 300 170, 350 170" fill="none" stroke="#92400e" stroke-width="3"/>
  <polygon points="350,170 332,163 332,177" fill="#92400e"/>

  <rect x="365" y="110" width="140" height="120" rx="8" fill="#fffdf8" stroke="#92400e" stroke-width="3"/>
  <circle cx="435" cy="145" r="24" fill="none" stroke="#92400e" stroke-width="3"/>
  <line x1="405" y1="190" x2="465" y2="190" stroke="#92400e" stroke-width="2"/>
  <line x1="405" y1="205" x2="465" y2="205" stroke="#92400e" stroke-width="2"/>
  <text class="lbl" x="435" y="248" text-anchor="middle">certificat (CEE)</text>

  <path d="M 520 170 C 560 170, 580 170, 610 170" fill="none" stroke="#92400e" stroke-width="3"/>
  <polygon points="610,170 592,163 592,177" fill="#92400e"/>

  <rect x="630" y="120" width="100" height="90" rx="6" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
  <rect x="640" y="110" width="100" height="90" rx="6" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
  <rect x="650" y="100" width="100" height="90" rx="6" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="lbl" x="700" y="150" text-anchor="middle" font-size="13">pile de</text>
  <text class="lbl" x="700" y="167" text-anchor="middle" font-size="13">certificats</text>

  <rect x="600" y="240" width="240" height="60" rx="10" fill="#fff4e0" stroke="#92400e" stroke-width="2"/>
  <text class="foc" x="720" y="265" text-anchor="middle" font-size="14">à produire en nombre suffisant</text>
  <text class="foc" x="720" y="285" text-anchor="middle" font-size="14">pour remplir l'obligation</text>
</svg>
