<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-2p" aria-describedby="d-2p" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-2p">Deux papiers, deux titulaires : l'aptitude et la capacité</title>
  <desc id="d-2p">Deux documents côte à côte. À gauche, l'attestation d'aptitude : elle concerne la
    personne, c'est le technicien qui la détient, elle prouve qu'il sait faire. À droite,
    l'attestation de capacité : elle concerne l'entreprise, et prouve que la société dispose du
    personnel, de l'outillage et des procédures. Entre les deux, un signe plus. Sous les deux
    documents, une bande indique qu'il faut les deux et que l'une ne remplace jamais l'autre ;
    en dessous, la phrase fausse la plus fréquente du métier est barrée : « mon patron a la
    capacité, donc je peux y aller ».</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fffdf8; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#0f766e; }
    .lbl { font-size:16px; fill:#10233c; }
    .plus{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:44px; fill:#5a6b7d; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .faux{ font-size:16px; fill:#c0392b; font-style:italic; }
  </style>

  <!-- L'aptitude : la personne -->
  <rect x="20" y="20" width="380" height="176" rx="14" fill="#fffdf8" stroke="#0f766e" stroke-width="3"/>
  <rect x="20" y="20" width="380" height="42" rx="14" fill="#0f766e"/>
  <rect x="20" y="48" width="380" height="14" fill="#0f766e"/>
  <text class="ttl" x="210" y="48" text-anchor="middle">ATTESTATION D'APTITUDE</text>
  <text class="qui" x="210" y="98" text-anchor="middle">La personne</text>
  <text class="lbl" x="210" y="128" text-anchor="middle">c'est le technicien qui la détient</text>
  <text class="lbl" x="210" y="154" text-anchor="middle">elle prouve qu'il sait faire</text>
  <text class="lbl" x="210" y="180" text-anchor="middle">elle le suit s'il change d'employeur</text>

  <!-- Le signe plus -->
  <text class="plus" x="450" y="122" text-anchor="middle">+</text>

  <!-- La capacité : l'entreprise -->
  <rect x="500" y="20" width="380" height="176" rx="14" fill="#fffdf8" stroke="#1e40af" stroke-width="3"/>
  <rect x="500" y="20" width="380" height="42" rx="14" fill="#1e40af"/>
  <rect x="500" y="48" width="380" height="14" fill="#1e40af"/>
  <text class="ttl" x="690" y="48" text-anchor="middle">ATTESTATION DE CAPACITÉ</text>
  <text class="qui" x="690" y="98" text-anchor="middle" fill="#1e40af">L'entreprise</text>
  <text class="lbl" x="690" y="128" text-anchor="middle">c'est la société qui la détient</text>
  <text class="lbl" x="690" y="154" text-anchor="middle">personnel, outillage, procédures</text>
  <text class="lbl" x="690" y="180" text-anchor="middle">elle ne suit personne</text>

  <!-- La bande : il faut les deux -->
  <rect x="20" y="224" width="860" height="48" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="450" y="253" text-anchor="middle">Il faut LES DEUX — et l'une ne remplace jamais l'autre</text>

  <!-- L'erreur classique, barrée -->
  <text class="faux" x="450" y="304" text-anchor="middle">« Mon patron a la capacité, donc je peux y aller »</text>
  <line x1="238" y1="299" x2="662" y2="299" stroke="#c0392b" stroke-width="2.5"/>
  <text class="lbl" x="450" y="328" text-anchor="middle">Sans votre aptitude, vous n'intervenez pas — même dans une entreprise en règle.</text>
</svg>
