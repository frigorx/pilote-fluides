<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img"
     aria-labelledby="t-maj" aria-describedby="d-maj" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-maj">Heures supplémentaires : 25 % pour les huit premières, 50 % ensuite, sauf accord</title>
  <desc id="d-maj">En haut, une bande bleue : les trente-cinq premières heures, payées au taux normal. Dessous, dix jetons pour les dix heures supplémentaires de la semaine : les huit premiers en orange, majorés de vingt-cinq pour cent, les deux suivants en brun, majorés de cinquante pour cent. Une accolade sous chaque groupe. En bas, une échelle de décision en trois cartes reliées par des flèches : d'abord un accord d'entreprise ou d'établissement, à défaut un accord de branche, à défaut la règle du Code du travail, vingt-cinq puis cinquante pour cent. Un bandeau précise qu'un accord peut fixer un autre taux, jamais inférieur à dix pour cent. Dans l'animation, les jetons arrivent un par un puis les cartes ; l'image fixe est complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:21px; fill:#1b3a63; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .hw  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#ffffff; }
    .lbl { font-size:17px; fill:#10233c; }
    .lw  { font-size:17px; fill:#ffffff; }
    .sm  { font-size:16px; fill:#5a6b7d; }
    .big { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:26px; fill:#10233c; }
  </style>
  <text class="ttl" x="450" y="34" text-anchor="middle">Ce qu'on paie en plus, semaine par semaine</text>
