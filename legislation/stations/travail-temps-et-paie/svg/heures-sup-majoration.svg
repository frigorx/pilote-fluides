  <text class="h" x="450" y="470" text-anchor="middle">Un accord peut fixer un autre taux, jamais en dessous de 10 %</text>
  <text class="lbl" x="450" y="496" text-anchor="middle">Une heure à 25 % se paie 1,25 fois le taux horaire ; à 50 %, 1,5 fois</text>
