<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" role="img"
     aria-labelledby="t-sem" aria-describedby="d-sem" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-sem">La semaine qui se remplit : la 36e heure devient supplémentaire</title>
  <desc id="d-sem">Une semaine de lundi à dimanche, dessinée en petits carrés d'une heure. Cinq jours de neuf heures se remplissent l'un après l'autre. Les trente-cinq premiers carrés sont bleus. Un trait pointillé marque la trente-cinquième heure, au milieu du jeudi. À partir de là, les carrés sont orange : ce sont des heures supplémentaires. Le vendredi se remplit en orange. Samedi et dimanche restent vides. Un compteur donne le total : quarante-cinq heures, dont trente-cinq normales et dix supplémentaires. Dans l'animation, les carrés se remplissent un à un ; l'image fixe est complète.</desc>
