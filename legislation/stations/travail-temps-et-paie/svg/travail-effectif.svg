<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img"
     aria-labelledby="t-te" aria-describedby="d-te" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-te">Ce qui compte comme temps de travail effectif</title>
  <desc id="d-te">Une bande définit le temps de travail effectif : le salarié est à la disposition de l'employeur, se conforme à ses directives et ne peut pas vaquer librement à des occupations personnelles. Dessous, une journée découpée en quatre blocs. Le trajet entre le domicile et le lieu habituel de travail, en gris, ne compte pas. Le travail sur le chantier, en bleu, compte. La pause, en trait tireté, compte seulement si le salarié reste à disposition. La reprise du travail, en bleu, compte. En bas, deux cartes : un trajet plus long que le trajet normal ouvre une contrepartie, et une tenue de travail imposée à enfiler sur place aussi.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:21px; fill:#1b3a63; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .hw  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#ffffff; }
    .lbl { font-size:17px; fill:#10233c; }
    .lw  { font-size:17px; fill:#ffffff; }
    .sm  { font-size:16px; fill:#5a6b7d; }
    .big { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:26px; fill:#10233c; }
  </style>
  <text class="ttl" x="450" y="34" text-anchor="middle">Ce qui compte comme temps de travail effectif</text>
  <rect x="30" y="52" width="840" height="72" rx="10" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="lbl" x="450" y="82" text-anchor="middle">Vous êtes à la disposition de l'employeur, vous suivez ses directives,</text>
  <text class="lbl" x="450" y="109" text-anchor="middle">et vous ne pouvez pas vaquer librement à vos occupations personnelles.</text>
  <rect x="30" y="152" width="200" height="92" rx="10" fill="#dfe5ec" stroke="#5a6b7d" stroke-width="2"/>
  <text class="h" x="130" y="192" text-anchor="middle">Trajet</text>
  <text class="lbl" x="130" y="218" text-anchor="middle">domicile – lieu habituel</text>
  <rect x="238" y="152" width="252" height="92" rx="10" fill="#1b3a63"/>
  <text class="hw" x="364" y="192" text-anchor="middle">Travail</text>
  <text class="lw" x="364" y="218" text-anchor="middle">sur le chantier</text>
  <rect x="498" y="152" width="148" height="92" rx="10" fill="#fffdf8" stroke="#5a6b7d" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text class="h" x="572" y="205" text-anchor="middle">Pause</text>
  <rect x="654" y="152" width="216" height="92" rx="10" fill="#1b3a63"/>
  <text class="hw" x="762" y="192" text-anchor="middle">Reprise</text>
  <text class="lw" x="762" y="218" text-anchor="middle">du travail</text>
  <circle cx="130" cy="282" r="14" fill="#8a2f2f"/>
  <path d="M124 276 L136 288 M136 276 L124 288" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <text class="h" x="130" y="325" text-anchor="middle">ne compte pas</text>
  <circle cx="364" cy="282" r="14" fill="#1f7a4d"/>
  <path d="M357 282 L362 288 L372 276" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="364" y="325" text-anchor="middle">compte</text>
  <circle cx="572" cy="282" r="14" fill="#5a6b7d"/>
  <text x="572" y="289" text-anchor="middle" font-family="Trebuchet MS,Calibri,sans-serif" font-weight="bold" font-size="20" fill="#fff">?</text>
  <text class="lbl" x="572" y="325" text-anchor="middle">compte si vous</text>
  <text class="lbl" x="572" y="347" text-anchor="middle">restez à disposition</text>
  <circle cx="762" cy="282" r="14" fill="#1f7a4d"/>
  <path d="M755 282 L760 288 L770 276" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="762" y="325" text-anchor="middle">compte</text>
  <rect x="30" y="368" width="410" height="58" rx="10" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
  <text class="lbl" x="235" y="393" text-anchor="middle">Trajet plus long que le trajet normal :</text>
  <text class="lbl" x="235" y="415" text-anchor="middle">une contrepartie, en repos ou en argent</text>
  <rect x="460" y="368" width="410" height="58" rx="10" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
  <text class="lbl" x="665" y="393" text-anchor="middle">Tenue imposée, enfilée sur place :</text>
  <text class="lbl" x="665" y="415" text-anchor="middle">une contrepartie aussi</text>
</svg>
