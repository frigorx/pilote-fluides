<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img"
     aria-labelledby="t-rep" aria-describedby="d-rep" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-rep">Les repos : une journée, une semaine</title>
  <desc id="d-rep">Deux bandes. En haut, une journée : deux blocs de travail bleus séparés par une pause en trait tireté, puis un bloc gris hachuré, le repos quotidien. Une accolade indique un maximum de dix heures de travail effectif. La pause dure au moins vingt minutes dès que la journée atteint six heures. Le repos quotidien est de onze heures consécutives au moins. En dessous, une semaine : six blocs bleus, du lundi au samedi, sous une accolade qui rappelle six jours de travail au plus, puis un bloc gris hachuré pour le dimanche, repos hebdomadaire de vingt-quatre heures consécutives auxquelles s'ajoute le repos quotidien. Un bandeau rappelle que dans le bâtiment, la convention des ouvriers organise en principe la semaine sur cinq jours, avec deux jours de repos consécutifs.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:21px; fill:#1b3a63; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .hw  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#ffffff; }
    .lbl { font-size:17px; fill:#10233c; }
    .lw  { font-size:17px; fill:#ffffff; }
    .sm  { font-size:16px; fill:#5a6b7d; }
    .big { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:26px; fill:#10233c; }
  </style>
  <defs>
    <pattern id="hach" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#dfe5ec"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b4bfcb" stroke-width="4"/>
    </pattern>
  </defs>
  <text class="ttl" x="450" y="34" text-anchor="middle">Ce que le Code du travail impose entre deux périodes de travail</text>
  <text class="h" x="40" y="70" text-anchor="start">Une journée (schéma non à l'échelle)</text>
  <path d="M40 118 L40 108 L522 108 L522 118" fill="none" stroke="#1b3a63" stroke-width="3.5" stroke-linejoin="round"/>
  <text class="lbl" x="281" y="98" text-anchor="middle">au plus 10 h de travail effectif (sauf dérogation)</text>
  <rect x="40" y="124" width="258" height="50" rx="10" fill="#1b3a63"/>
  <text class="hw" x="169" y="156" text-anchor="middle">travail</text>
  <rect x="304" y="124" width="72" height="50" rx="8" fill="#fffdf8" stroke="#5a6b7d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text class="lbl" x="340" y="156" text-anchor="middle">pause</text>
  <rect x="382" y="124" width="140" height="50" rx="10" fill="#1b3a63"/>
  <text class="hw" x="452" y="156" text-anchor="middle">travail</text>
  <rect x="528" y="124" width="332" height="50" rx="10" fill="url(#hach)" stroke="#5a6b7d" stroke-width="2.5"/>
  <rect x="600" y="132" width="188" height="34" rx="6" fill="#fffdf8"/>
  <text class="h" x="694" y="156" text-anchor="middle">repos quotidien</text>
  <line x1="340" y1="174" x2="340" y2="200" stroke="#5a6b7d" stroke-width="2.5"/>
  <line x1="694" y1="174" x2="694" y2="200" stroke="#5a6b7d" stroke-width="2.5"/>
  <rect x="150" y="200" width="380" height="64" rx="10" fill="#fffdf8" stroke="#5a6b7d" stroke-width="2.5"/>
  <text class="lbl" x="340" y="228" text-anchor="middle">Pause : 20 minutes consécutives au moins,</text>
  <text class="lbl" x="340" y="251" text-anchor="middle">dès que la journée atteint 6 h de travail</text>
  <rect x="556" y="200" width="304" height="64" rx="10" fill="#fffdf8" stroke="#5a6b7d" stroke-width="2.5"/>
  <text class="lbl" x="708" y="228" text-anchor="middle">Repos quotidien : 11 h de suite</text>
  <text class="lbl" x="708" y="251" text-anchor="middle">au moins avant de reprendre</text>
  <text class="h" x="40" y="318" text-anchor="start">Une semaine</text>
  <path d="M55 362 L55 352 L730 352 L730 362" fill="none" stroke="#1b3a63" stroke-width="3.5" stroke-linejoin="round"/>
  <text class="lbl" x="392.5" y="342" text-anchor="middle">6 jours de travail au plus</text>
  <rect x="55" y="368" width="100" height="46" rx="10" fill="#1b3a63"/>
  <text class="hw" x="105.0" y="398" text-anchor="middle">Lun.</text>
  <rect x="170" y="368" width="100" height="46" rx="10" fill="#1b3a63"/>
  <text class="hw" x="220.0" y="398" text-anchor="middle">Mar.</text>
  <rect x="285" y="368" width="100" height="46" rx="10" fill="#1b3a63"/>
  <text class="hw" x="335.0" y="398" text-anchor="middle">Mer.</text>
  <rect x="400" y="368" width="100" height="46" rx="10" fill="#1b3a63"/>
  <text class="hw" x="450.0" y="398" text-anchor="middle">Jeu.</text>
  <rect x="515" y="368" width="100" height="46" rx="10" fill="#1b3a63"/>
  <text class="hw" x="565.0" y="398" text-anchor="middle">Ven.</text>
  <rect x="630" y="368" width="100" height="46" rx="10" fill="#1b3a63"/>
  <text class="hw" x="680.0" y="398" text-anchor="middle">Sam.</text>
  <rect x="745" y="368" width="100" height="46" rx="10" fill="url(#hach)" stroke="#5a6b7d" stroke-width="2.5"/>
  <rect x="753" y="376" width="84" height="30" rx="5" fill="#fffdf8"/>
  <text class="h" x="795.0" y="398" text-anchor="middle">Dim.</text>
  <line x1="795.0" y1="414" x2="795.0" y2="432" stroke="#5a6b7d" stroke-width="2.5"/>
  <rect x="430" y="432" width="430" height="84" rx="10" fill="#fffdf8" stroke="#5a6b7d" stroke-width="2.5"/>
  <text class="lbl" x="645" y="458" text-anchor="middle">Repos hebdomadaire : 24 h de suite,</text>
  <text class="lbl" x="645" y="481" text-anchor="middle">auxquelles s'ajoutent les 11 h de repos</text>
  <text class="lbl" x="645" y="504" text-anchor="middle">quotidien (en principe le dimanche)</text>
  <rect x="40" y="436" width="370" height="80" rx="10" fill="#eef3f9" stroke="#9d174d" stroke-width="2.5"/>
  <text class="h" x="225" y="462" text-anchor="middle">Dans le bâtiment (ouvriers) :</text>
  <text class="lbl" x="225" y="486" text-anchor="middle">semaine sur 5 jours, 2 jours de repos</text>
  <text class="lbl" x="225" y="507" text-anchor="middle">de suite (convention collective)</text>
</svg>
