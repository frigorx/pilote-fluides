<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"
     aria-labelledby="t-cp" aria-describedby="d-cp" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-cp">Les congés payés : un compteur, deux calendriers, une indemnité</title>
  <desc id="d-cp">En haut, douze cartes bleues alignées, chacune marquée deux virgule cinq : un mois de travail effectif donne deux jours et demi ouvrables. Une accolade en dessous : douze mois font trente jours ouvrables, soit cinq semaines. Au milieu, deux calendriers d'acquisition : pour le cas général, une barre bleue du premier juin au trente et un mai de l'année suivante ; pour les entreprises du bâtiment affiliées à une caisse de congés payés, une barre brune du premier avril au trente et un mars. En bas, l'indemnité de congés : le dixième de la rémunération brute totale de la période de référence, ou le maintien du salaire qu'on aurait perçu en travaillant, le plus élevé des deux.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:21px; fill:#1b3a63; }
    .h   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .hw  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#ffffff; }
    .lbl { font-size:17px; fill:#10233c; }
    .lw  { font-size:17px; fill:#ffffff; }
    .sm  { font-size:16px; fill:#5a6b7d; }
    .big { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:26px; fill:#10233c; }
  </style>
  <text class="ttl" x="450" y="34" text-anchor="middle">Les congés payés : le compteur, les dates, l'indemnité</text>
  <rect x="46" y="60" width="60" height="50" rx="10" fill="#1b3a63"/>
  <text class="hw" x="76.0" y="93" text-anchor="middle">2,5</text>
  <rect x="114" y="60" width="60" height="50" rx="10" fill="#1b3a63"/>
  <text class="hw" x="144.0" y="93" text-anchor="middle">2,5</text>
  <rect x="182" y="60" width="60" height="50" rx="10" fill="#1b3a63"/>
  <text class="hw" x="212.0" y="93" text-anchor="middle">2,5</text>
  <rect x="250" y="60" width="60" height="50" rx="10" fill="#1b3a63"/>
  <text class="hw" x="280.0" y="93" text-anchor="middle">2,5</text>
