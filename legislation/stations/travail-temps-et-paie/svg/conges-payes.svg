  <text class="hw" x="552.0" y="93" text-anchor="middle">2,5</text>
  <rect x="590" y="60" width="60" height="50" rx="10" fill="#1b3a63"/>
  <text class="hw" x="620.0" y="93" text-anchor="middle">2,5</text>
  <rect x="658" y="60" width="60" height="50" rx="10" fill="#1b3a63"/>
  <text class="hw" x="688.0" y="93" text-anchor="middle">2,5</text>
  <rect x="726" y="60" width="60" height="50" rx="10" fill="#1b3a63"/>
  <text class="hw" x="756.0" y="93" text-anchor="middle">2,5</text>
  <rect x="794" y="60" width="60" height="50" rx="10" fill="#1b3a63"/>
  <text class="hw" x="824.0" y="93" text-anchor="middle">2,5</text>
  <path d="M46 118 L46 128 L854 128 L854 118" fill="none" stroke="#1b3a63" stroke-width="3.5" stroke-linejoin="round"/>
  <text class="h" x="450" y="160" text-anchor="middle">12 mois de travail effectif = 30 jours ouvrables (5 semaines)</text>
  <text class="h" x="40" y="208" text-anchor="start">Cas général : la période d'acquisition</text>
  <rect x="40" y="220" width="820" height="32" rx="6" fill="#1b3a63"/>
  <text class="hw" x="450" y="243" text-anchor="middle">12 mois</text>
  <text class="lbl" x="40" y="278" text-anchor="start">1er juin</text>
  <text class="lbl" x="860" y="278" text-anchor="end">31 mai de l'année suivante</text>
  <text class="h" x="40" y="316" text-anchor="start">Entreprises du bâtiment affiliées à une caisse de congés payés</text>
  <rect x="40" y="328" width="820" height="32" rx="6" fill="#a8410b"/>
  <text class="hw" x="450" y="351" text-anchor="middle">12 mois</text>
  <text class="lbl" x="40" y="386" text-anchor="start">1er avril</text>
  <text class="lbl" x="860" y="386" text-anchor="end">31 mars de l'année suivante</text>
  <rect x="40" y="412" width="370" height="88" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="h" x="225" y="440" text-anchor="middle">Le dixième</text>
  <text class="lbl" x="225" y="464" text-anchor="middle">de la rémunération brute totale</text>
  <text class="lbl" x="225" y="486" text-anchor="middle">de la période de référence</text>
  <rect x="490" y="412" width="370" height="88" rx="10" fill="#fffdf8" stroke="#a8410b" stroke-width="3"/>
  <text class="h" x="675" y="440" text-anchor="middle">Le maintien</text>
  <text class="lbl" x="675" y="464" text-anchor="middle">du salaire qu'on aurait perçu</text>
  <text class="lbl" x="675" y="486" text-anchor="middle">en continuant à travailler</text>
  <text class="h" x="450" y="450" text-anchor="middle">le plus</text>
  <text class="h" x="450" y="474" text-anchor="middle">élevé</text>
</svg>
