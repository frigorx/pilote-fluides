  <rect x="386" y="60" width="60" height="50" rx="10" fill="#1b3a63"/>
  <text class="hw" x="416.0" y="93" text-anchor="middle">2,5</text>
  <rect x="454" y="60" width="60" height="50" rx="10" fill="#1b3a63"/>
  <text class="hw" x="484.0" y="93" text-anchor="middle">2,5</text>
