<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-cp" aria-describedby="d-cp" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-cp">Le choc pétrolier de 1974, point de départ de la réglementation thermique</title>
  <desc id="d-cp">Deux maisons encadrent un jalon central. À gauche, une maison sans aucune couche
    d'isolation dessinée, sous le titre « avant 1974 : aucune règle nationale d'isolation ». Au
    centre, un jalon daté 1974 avec un baril stylisé et une flèche vers le bas indiquant que
    l'approvisionnement en pétrole devient incertain. À droite, une maison dont les murs portent
    une couche d'isolation hachurée, sous le titre « après 1974 : première réglementation
    thermique française ».</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .lbl { font-size:15px; fill:#5a6b7d; }
    .an  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:26px; fill:#92400e; }
    .cap { font-size:15px; fill:#10233c; }
  </style>

  <!-- Avant 1974 -->
  <rect x="20" y="20" width="300" height="290" rx="14" fill="#fffdf8" stroke="#d6dee7" stroke-width="2"/>
  <text class="ttl" x="170" y="48" text-anchor="middle">Avant 1974</text>
  <!-- maison sans isolation -->
  <polygon points="90,170 170,110 250,170" fill="none" stroke="#5a6b7d" stroke-width="3"/>
  <rect x="105" y="170" width="130" height="90" fill="none" stroke="#5a6b7d" stroke-width="3"/>
  <text class="cap" x="170" y="290" text-anchor="middle">aucune règle nationale</text>
  <text class="cap" x="170" y="290" text-anchor="middle" dy="18">d'isolation</text>

  <!-- Le jalon 1974 -->
  <line x1="340" y1="170" x2="560" y2="170" stroke="#92400e" stroke-width="4"/>
  <circle cx="450" cy="170" r="34" fill="#fff4e0" stroke="#92400e" stroke-width="3"/>
  <!-- baril stylisé -->
  <rect x="434" y="152" width="32" height="36" rx="6" fill="#fffdf8" stroke="#92400e" stroke-width="2.5"/>
  <line x1="434" y1="164" x2="466" y2="164" stroke="#92400e" stroke-width="2"/>
  <line x1="434" y1="176" x2="466" y2="176" stroke="#92400e" stroke-width="2"/>
  <text class="an" x="450" y="220" text-anchor="middle">1974</text>
  <text class="lbl" x="450" y="245" text-anchor="middle">choc pétrolier</text>
  <path d="M 450 260 L 450 285" stroke="#c0392b" stroke-width="3"/>
  <polygon points="443,280 450,295 457,280" fill="#c0392b"/>
  <text class="cap" x="450" y="315" text-anchor="middle">approvisionnement fragilisé</text>

  <!-- Après 1974 -->
  <rect x="580" y="20" width="300" height="290" rx="14" fill="#fffdf8" stroke="#92400e" stroke-width="2.5"/>
  <text class="ttl" x="730" y="48" text-anchor="middle">Après 1974</text>
  <polygon points="650,170 730,110 810,170" fill="none" stroke="#10233c" stroke-width="3"/>
  <rect x="665" y="170" width="130" height="90" fill="none" stroke="#10233c" stroke-width="3"/>
  <!-- couche d'isolation hachurée sur les murs -->
  <rect x="665" y="170" width="10" height="90" fill="#fff4e0" stroke="#92400e" stroke-width="1.5"/>
  <rect x="785" y="170" width="10" height="90" fill="#fff4e0" stroke="#92400e" stroke-width="1.5"/>
  <text class="cap" x="730" y="290" text-anchor="middle">première réglementation</text>
  <text class="cap" x="730" y="290" text-anchor="middle" dy="18">thermique française</text>
</svg>
