<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-tr" aria-describedby="d-tr" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-tr">La RE2020 remplace la RT2012 pour les bâtiments neufs</title>
  <desc id="d-tr">Deux cartes reliées par une flèche. À gauche, la carte « RT2012 », grisée, portant
    la mention « ancien texte, ne s'applique plus au dépôt de permis neuf ». À droite, la carte
    « RE2020 », en couleur, portant la mention « texte en vigueur pour le neuf ». La flèche entre
    les deux porte la mention « remplace », sans date de bascule inscrite dessus.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:26px; }
    .lbl { font-size:15px; fill:#5a6b7d; }
    .fl  { font-size:16px; fill:#10233c; font-weight:bold; font-family:'Trebuchet MS',Calibri,sans-serif; }
  </style>

  <rect x="30" y="80" width="330" height="180" rx="14" fill="#eef1f4" stroke="#98a6b3" stroke-width="3"/>
  <text class="ttl" x="195" y="160" text-anchor="middle" fill="#5a6b7d">RT2012</text>
  <text class="lbl" x="195" y="195" text-anchor="middle">ancien texte</text>
  <text class="lbl" x="195" y="216" text-anchor="middle">ne s'applique plus</text>
  <text class="lbl" x="195" y="237" text-anchor="middle">au neuf</text>

  <line x1="375" y1="170" x2="525" y2="170" stroke="#92400e" stroke-width="5"/>
  <polygon points="525,170 505,158 505,182" fill="#92400e"/>
  <text class="fl" x="450" y="145" text-anchor="middle">remplace</text>

  <rect x="540" y="80" width="330" height="180" rx="14" fill="#fff4e0" stroke="#92400e" stroke-width="3.5"/>
  <text class="ttl" x="705" y="160" text-anchor="middle" fill="#92400e">RE2020</text>
  <text class="lbl" x="705" y="195" text-anchor="middle">texte en vigueur</text>
  <text class="lbl" x="705" y="216" text-anchor="middle">pour les bâtiments</text>
  <text class="lbl" x="705" y="237" text-anchor="middle">neufs</text>
</svg>
