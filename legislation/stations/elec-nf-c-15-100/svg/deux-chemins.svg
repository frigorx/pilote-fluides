<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t2" aria-describedby="d2" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t2">Deux chemins vers les mêmes objectifs de sécurité</title>
  <desc id="d2">À gauche, un cadre : les objectifs de sécurité de l'arrêté du 3 août 2016. À droite, un cadre : objectifs atteints. Entre les deux, deux voies. La voie du haut, en trait plein, passe par la norme NF C 15-100 : la conformité est alors présumée. La voie du bas, en trait tireté, passe par une autre norme équivalente : il faut démontrer le même niveau de sécurité. En bas, une note rappelle qu'avant 2016 l'arrêté du 22 octobre 1969 imposait la norme en entier et qu'il est abrogé. L'animation fait voyager un point sur chaque voie, l'une après l'autre ; l'image fixe est complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .b20 { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .w20 { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#ffffff; }
    .t17 { font-size:17px; fill:#10233c; }
  </style>
  <text class="ttl" x="400" y="34" text-anchor="middle">Deux chemins, les mêmes objectifs</text>

  <!-- Départ -->
  <rect x="30" y="150" width="200" height="200" rx="16" fill="#1b3a63"/>
  <text class="w20" x="130" y="228" text-anchor="middle">Les objectifs</text>
  <text class="w20" x="130" y="254" text-anchor="middle">de sécurité</text>
  <text x="130" y="288" text-anchor="middle" font-size="16" fill="#ffffff">arrêté du 3 août 2016</text>

  <!-- Arrivée -->
  <rect x="590" y="150" width="180" height="200" rx="16" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <rect x="590" y="150" width="180" height="200" rx="16" fill="#a16207" opacity="0">
    <animate attributeName="opacity" values="0;0;0.28;0;0;0.28;0;0" keyTimes="0;0.24;0.28;0.36;0.62;0.66;0.74;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text class="b20" x="680" y="240" text-anchor="middle">Objectifs</text>
  <text class="b20" x="680" y="266" text-anchor="middle">atteints</text>

  <!-- Voie du haut : la norme (trait plein) -->
  <line x1="230" y1="170" x2="330" y2="170" stroke="#a16207" stroke-width="4"/>
  <line x1="490" y1="170" x2="580" y2="170" stroke="#a16207" stroke-width="4"/>
  <polygon points="578,160 578,180 590,170" fill="#a16207"/>
  <circle r="9" fill="#a16207" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.10;0.26;1" calcMode="linear" path="M230,170 L590,170"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.09;0.10;0.26;0.27;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect x="330" y="146" width="160" height="48" rx="24" fill="#f4eadb" stroke="#a16207" stroke-width="3"/>
  <text class="b20" x="410" y="177" text-anchor="middle">NF C 15-100</text>
  <text class="t17" x="410" y="226" text-anchor="middle">conformité présumée</text>

  <!-- Voie du bas : une autre norme (trait tireté) -->
  <line x1="230" y1="330" x2="320" y2="330" stroke="#5a6b7d" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="500" y1="330" x2="580" y2="330" stroke="#5a6b7d" stroke-width="4" stroke-dasharray="10 8"/>
  <polygon points="578,320 578,340 590,330" fill="#5a6b7d"/>
  <circle r="9" fill="#5a6b7d" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.44;0.64;1" calcMode="linear" path="M230,330 L590,330"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.43;0.44;0.64;0.65;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect x="320" y="306" width="180" height="48" rx="24" fill="#fffdf8" stroke="#5a6b7d" stroke-width="3" stroke-dasharray="10 6"/>
  <text class="b20" x="410" y="337" text-anchor="middle">Autre norme</text>
  <text class="t17" x="410" y="384" text-anchor="middle">même niveau de sécurité</text>
  <text class="t17" x="410" y="406" text-anchor="middle">à démontrer</text>

  <!-- Rappel historique -->
  <rect x="40" y="436" width="720" height="50" rx="12" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="t17" x="400" y="458" text-anchor="middle">Avant 2016, l'arrêté du 22 octobre 1969 imposait la norme en entier.</text>
  <text class="t17" x="400" y="478" text-anchor="middle" font-weight="bold">Il est abrogé.</text>
</svg>
