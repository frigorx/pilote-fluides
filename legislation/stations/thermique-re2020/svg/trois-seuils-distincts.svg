<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 258" role="img" aria-labelledby="title desc"><title id="title">Chaque exigence doit être respectée</title><desc id="desc">Bbio dépassé : Revoir la conception du bâtiment ; Carbone favorable : Ne compense pas le Bbio dépassé ; Autres indicateurs : À contrôler séparément</desc><style>text{font-family:Calibri,Arial,sans-serif;fill:#1b3a63}.label{font-size:24px;font-weight:bold}.value{font-size:22px}</style><rect width="900" height="100%" fill="#fffdf8"/><text x="24" y="35" font-size="28" font-weight="bold">Chaque exigence doit être respectée</text><rect x="18" y="58" width="864" height="49" rx="5" fill="none" stroke="#9aaabb"/><text x="32" y="90" class="label">Bbio dépassé</text><text x="270" y="90" class="value">Revoir la conception du bâtiment</text><rect x="18" y="114" width="864" height="49" rx="5" fill="none" stroke="#9aaabb"/><text x="32" y="146" class="label">Carbone favorable</text><text x="270" y="146" class="value">Ne compense pas le Bbio dépassé</text><rect x="18" y="170" width="864" height="49" rx="5" fill="none" stroke="#9aaabb"/><text x="32" y="202" class="label">Autres indicateurs</text><text x="270" y="202" class="value">À contrôler séparément</text></svg>
