<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 258" role="img" aria-labelledby="title desc"><title id="title">Énergie primaire : deux indicateurs</title><desc id="desc">Cep : Total renouvelable et non renouvelable ; Cep,nr : Part non renouvelable ; Périmètre : Usages réglementaires, pas toute la facture</desc><style>text{font-family:Calibri,Arial,sans-serif;fill:#1b3a63}.label{font-size:24px;font-weight:bold}.value{font-size:22px}</style><rect width="900" height="100%" fill="#fffdf8"/><text x="24" y="35" font-size="28" font-weight="bold">Énergie primaire : deux indicateurs</text><rect x="18" y="58" width="864" height="49" rx="5" fill="none" stroke="#9aaabb"/><text x="32" y="90" class="label">Cep</text><text x="270" y="90" class="value">Total renouvelable et non renouvelable</text><rect x="18" y="114" width="864" height="49" rx="5" fill="none" stroke="#9aaabb"/><text x="32" y="146" class="label">Cep,nr</text><text x="270" y="146" class="value">Part non renouvelable</text><rect x="18" y="170" width="864" height="49" rx="5" fill="none" stroke="#9aaabb"/><text x="32" y="202" class="label">Périmètre</text><text x="270" y="202" class="value">Usages réglementaires, pas toute la facture</text></svg>
