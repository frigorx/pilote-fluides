<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" role="img" aria-labelledby="title desc"><title id="title">RE2020 : six indicateurs</title><desc id="desc">Bbio : Besoins de chauffage, froid et éclairage ; Cep : Consommation primaire totale ; Cep,nr : Part primaire non renouvelable ; Ic énergie : Carbone lié aux consommations ; Ic construction : Carbone des composants et du chantier ; DH : Degrés-heures d’inconfort en été</desc><style>text{font-family:Calibri,Arial,sans-serif;fill:#1b3a63}.label{font-size:24px;font-weight:bold}.value{font-size:22px}</style><rect width="900" height="100%" fill="#fffdf8"/><text x="24" y="35" font-size="28" font-weight="bold">RE2020 : six indicateurs</text><rect x="18" y="58" width="864" height="49" rx="5" fill="none" stroke="#9aaabb"/><text x="32" y="90" class="label">Bbio</text><text x="270" y="90" class="value">Besoins de chauffage, froid et éclairage</text><rect x="18" y="114" width="864" height="49" rx="5" fill="none" stroke="#9aaabb"/><text x="32" y="146" class="label">Cep</text><text x="270" y="146" class="value">Consommation primaire totale</text><rect x="18" y="170" width="864" height="49" rx="5" fill="none" stroke="#9aaabb"/><text x="32" y="202" class="label">Cep,nr</text><text x="270" y="202" class="value">Part primaire non renouvelable</text><rect x="18" y="226" width="864" height="49" rx="5" fill="none" stroke="#9aaabb"/><text x="32" y="258" class="label">Ic énergie</text><text x="270" y="258" class="value">Carbone lié aux consommations</text><rect x="18" y="282" width="864" height="49" rx="5" fill="none" stroke="#9aaabb"/><text x="32" y="314" class="label">Ic construction</text><text x="270" y="314" class="value">Carbone des composants et du chantier</text><rect x="18" y="338" width="864" height="49" rx="5" fill="none" stroke="#9aaabb"/><text x="32" y="370" class="label">DH</text><text x="270" y="370" class="value">Degrés-heures d’inconfort en été</text></svg>
