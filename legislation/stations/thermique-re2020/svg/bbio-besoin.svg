<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-bb" aria-describedby="d-bb" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-bb">Le Bbio mesure le bâti, pas les équipements</title>
  <desc id="d-bb">Une maison stylisée, compacte, avec un soleil du côté sud et une couche
    d'isolation hachurée sur ses murs : trois facteurs qui pèsent sur le Bbio, orientation,
    compacité, isolation. À côté, une chaudière et un climatiseur sont dessinés en trait
    pointillé et barrés d'une croix, avec la mention « les équipements n'entrent pas dans le
    calcul du Bbio ».</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .lbl { font-size:15px; fill:#5a6b7d; }
    .fac { font-size:15px; fill:#92400e; font-weight:bold; }
  </style>

  <!-- maison compacte, orientée, isolée -->
  <rect x="40" y="20" width="480" height="300" rx="14" fill="#fffdf8" stroke="#92400e" stroke-width="2.5"/>
  <text class="ttl" x="280" y="50" text-anchor="middle">Ce qui compte pour le Bbio</text>

  <circle cx="120" cy="120" r="26" fill="#fff4e0" stroke="#92400e" stroke-width="2.5"/>
  <line x1="120" y1="80" x2="120" y2="65" stroke="#92400e" stroke-width="2"/>
  <line x1="120" y1="160" x2="120" y2="175" stroke="#92400e" stroke-width="2"/>
  <line x1="80" y1="120" x2="65" y2="120" stroke="#92400e" stroke-width="2"/>

  <polygon points="200,190 280,130 360,190" fill="none" stroke="#10233c" stroke-width="3"/>
  <rect x="215" y="190" width="130" height="90" fill="none" stroke="#10233c" stroke-width="3"/>
  <rect x="215" y="190" width="10" height="90" fill="#fff4e0" stroke="#92400e" stroke-width="1.5"/>
  <rect x="335" y="190" width="10" height="90" fill="#fff4e0" stroke="#92400e" stroke-width="1.5"/>

  <text class="fac" x="280" y="298" text-anchor="middle">orientation · compacité · isolation</text>

  <!-- équipements exclus -->
  <rect x="560" y="20" width="300" height="300" rx="14" fill="#eef1f4" stroke="#98a6b3" stroke-width="2.5"/>
  <text class="ttl" x="710" y="50" text-anchor="middle" fill="#5a6b7d">Hors du calcul du Bbio</text>

  <rect x="620" y="90" width="60" height="80" rx="6" fill="none" stroke="#5a6b7d" stroke-width="2.5" stroke-dasharray="5 5"/>
  <text class="lbl" x="650" y="190" text-anchor="middle">chaudière</text>
  <line x1="605" y1="85" x2="695" y2="175" stroke="#5a6b7d" stroke-width="2.5"/>
  <line x1="695" y1="85" x2="605" y2="175" stroke="#5a6b7d" stroke-width="2.5"/>

  <rect x="760" y="100" width="70" height="45" rx="8" fill="none" stroke="#5a6b7d" stroke-width="2.5" stroke-dasharray="5 5"/>
  <text class="lbl" x="795" y="170" text-anchor="middle">climatiseur</text>
  <line x1="750" y1="92" x2="840" y2="152" stroke="#5a6b7d" stroke-width="2.5"/>
  <line x1="840" y1="92" x2="750" y2="152" stroke="#5a6b7d" stroke-width="2.5"/>

  <text class="lbl" x="710" y="230" text-anchor="middle">le Bbio mesure le bâti,</text>
  <text class="lbl" x="710" y="250" text-anchor="middle">pas ce qu'on y installe</text>
</svg>
