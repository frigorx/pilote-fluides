<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"
     aria-labelledby="t-rr" aria-describedby="d-rr" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-rr">La responsabilité ne s'arrête pas à la remise</title>
  <desc id="d-rr">Un chemin en deux tronçons partant du même chantier. Le premier, en trait plein avec
    une coche verte, va vers un repreneur autorisé : le dossier est soldé. Le second, en trait tireté
    avec une croix rouge, va vers un repreneur non autorisé ; à côté de ce tronçon, la mention « la
    responsabilité reste » indique que le frigoriste reste engagé si ce déchet est mal géré. Un encadré
    rappelle le réflexe : vérifier, avant de remettre, que le destinataire a le droit de recevoir ce
    déchet-là.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl { font-size:16px; fill:#10233c; }
    .lblb{ font-size:16px; fill:#10233c; font-weight:bold; }
    .note{ font-size:15px; fill:#5a6b7d; font-style:italic; }
  </style>

  <!-- Le chantier, point de départ -->
  <rect x="20" y="150" width="140" height="100" rx="12" fill="#eef0ee" stroke="#57534e" stroke-width="3"/>
  <text class="ttl" x="90" y="206" text-anchor="middle">Chantier</text>

  <!-- Tronçon 1 : repreneur autorisé (trait plein, coche verte) -->
  <path d="M 160 180 C 300 180 340 75 480 75 H 500" stroke="#1e7e54" stroke-width="8" stroke-linecap="round" fill="none"/>
  <polygon points="500,63 524,75 500,87" fill="#1e7e54"/>
  <rect x="540" y="20" width="340" height="110" rx="14" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/>
  <circle cx="582" cy="60" r="17" fill="#1e7e54"/>
  <path d="M 573 60 L 580 68 L 593 50" stroke="#fffdf8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="ttl" x="612" y="56">Repreneur autorisé</text>
  <text class="lbl" x="612" y="84">le dossier est soldé</text>
  <text class="lbl" x="612" y="106">pour ce maillon</text>

  <!-- Tronçon 2 : repreneur non autorisé (trait tireté, croix rouge) -->
  <path d="M 160 220 C 300 220 340 305 480 305 H 500" stroke="#c0392b" stroke-width="8" stroke-linecap="round" fill="none" stroke-dasharray="16 12"/>
  <polygon points="500,293 524,305 500,317" fill="#c0392b"/>
  <rect x="540" y="250" width="340" height="110" rx="14" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
  <circle cx="582" cy="290" r="17" fill="#c0392b"/>
  <path d="M 575 283 L 589 297 M 589 283 L 575 297" stroke="#fffdf8" stroke-width="4" stroke-linecap="round"/>
  <text class="ttl" x="612" y="286">Repreneur non autorisé</text>
  <text class="lblb" x="612" y="314">la responsabilité reste</text>
  <text class="lbl" x="612" y="336">le frigoriste répond si ce</text>
  <text class="lbl" x="612" y="356">déchet est mal géré</text>

  <!-- Réflexe -->
  <rect x="20" y="392" width="860" height="90" rx="12" fill="#fffdf8" stroke="#2f5689" stroke-width="2"/>
  <text class="ttl" x="40" y="420" fill="#1b3a63">Le réflexe</text>
  <text class="lbl" x="40" y="446">vérifier, avant de remettre, que le destinataire a le droit</text>
  <text class="lbl" x="40" y="468">de recevoir ce déchet-là</text>

  <text class="note" x="450" y="506" text-anchor="middle">Trait plein + coche : le repreneur a le droit. Trait tireté + croix : il ne l'a pas.</text>
</svg>
