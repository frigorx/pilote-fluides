<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-cpd" aria-describedby="d-cpd" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-cpd">Producteur et détenteur : deux mots, une seule chaîne</title>
  <desc id="d-cpd">Deux personnages reliés par une flèche pleine : le déchet passe de main en main, sans
    texte sur la flèche elle-même. À gauche, le frigoriste étiqueté « producteur » : c'est son activité
    qui fait naître le déchet. À droite, un second personnage étiqueté « détenteur » : c'est lui qui a
    la garde du déchet à cet instant — cela peut être le producteur lui-même, ou la personne à qui il
    l'a remis. En bas, une bande rappelle que les deux mots désignent deux maillons de la même chaîne
    de responsabilité, pas deux règles différentes.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fffdf8; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#57534e; }
    .lbl { font-size:16px; fill:#10233c; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
  </style>

  <!-- Le producteur -->
  <rect x="20" y="20" width="360" height="176" rx="14" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
  <rect x="20" y="20" width="360" height="42" rx="14" fill="#57534e"/>
  <rect x="20" y="48" width="360" height="14" fill="#57534e"/>
  <text class="ttl" x="200" y="48" text-anchor="middle">LE PRODUCTEUR</text>
  <!-- personnage stylisé -->
  <circle cx="120" cy="110" r="20" fill="#eef0ee" stroke="#57534e" stroke-width="2.5"/>
  <path d="M 92 168 Q 120 128 148 168 Z" fill="#eef0ee" stroke="#57534e" stroke-width="2.5"/>
  <text class="lbl" x="240" y="100" text-anchor="middle">son activité fait naître</text>
  <text class="lbl" x="240" y="122" text-anchor="middle">le déchet</text>
  <text class="lbl" x="240" y="154" text-anchor="middle">— vidange, dépose d'un filtre,</text>
  <text class="lbl" x="240" y="176" text-anchor="middle">sortie d'un groupe</text>

  <!-- La flèche, sans texte dessus -->
  <path d="M 390 108 H 500" stroke="#5a6b7d" stroke-width="8" stroke-linecap="round" fill="none"/>
  <polygon points="500,96 524,108 500,120" fill="#5a6b7d"/>
  <text class="lbl" x="455" y="72" text-anchor="middle" fill="#5a6b7d">le déchet passe</text>
  <text class="lbl" x="455" y="212" text-anchor="middle" fill="#5a6b7d">de main en main</text>

  <!-- Le détenteur -->
  <rect x="520" y="20" width="360" height="176" rx="14" fill="#fffdf8" stroke="#1e40af" stroke-width="3"/>
  <rect x="520" y="20" width="360" height="42" rx="14" fill="#1e40af"/>
  <rect x="520" y="48" width="360" height="14" fill="#1e40af"/>
  <text class="ttl" x="700" y="48" text-anchor="middle">LE DÉTENTEUR</text>
  <circle cx="620" cy="110" r="20" fill="#eef0ee" stroke="#1e40af" stroke-width="2.5"/>
  <path d="M 592 168 Q 620 128 648 168 Z" fill="#eef0ee" stroke="#1e40af" stroke-width="2.5"/>
  <text class="lbl" x="750" y="100" text-anchor="middle">a la garde du déchet</text>
  <text class="lbl" x="750" y="122" text-anchor="middle">à cet instant</text>
  <text class="lbl" x="750" y="154" text-anchor="middle">— le producteur lui-même,</text>
  <text class="lbl" x="750" y="176" text-anchor="middle">ou qui il l'a reçu</text>

  <!-- La bande -->
  <rect x="20" y="224" width="860" height="72" rx="14" fill="#eef0ee" stroke="#57534e" stroke-width="2"/>
  <text class="band" x="450" y="252" text-anchor="middle">Deux mots, pas deux règles différentes</text>
  <text class="lbl" x="450" y="278" text-anchor="middle">ils désignent deux maillons de la même chaîne de responsabilité</text>
</svg>
