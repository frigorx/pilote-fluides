<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
     aria-labelledby="t-mbj" aria-describedby="d-mbj" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-mbj">Une main tenant un déchet face à plusieurs bennes, puis la flèche vers la bonne</title>
  <desc id="d-mbj">Une main tient un déchet, un point d'interrogation au-dessus : quelle est sa
    matière ? Face à elle, une rangée de quatre bennes du chantier. Une flèche part du déchet et va
    droit vers la benne qui correspond à sa matière, entourée en vert et marquée « la bonne benne »
    ; les trois autres restent en gris neutre.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .lbl { font-size:15px; fill:#10233c; text-anchor:middle; }
    .mot { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; text-anchor:middle; }
    .q   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:44px; fill:#57534e; }
  </style>

  <text class="ttl" x="450" y="30" text-anchor="middle">La benne juste : identifier la matière avant de jeter</text>

  <!-- la main tenant un déchet -->
  <g>
    <path d="M60,220 q-8,-40 10,-60 q6,-8 14,0 l0,30 q10,-30 20,-24 q6,4 2,14 l-8,20
             q12,-22 22,-14 q6,4 0,14 l-10,20
             q10,-14 18,-6 q6,6 -2,14 l-18,26 q-10,16 -30,16 q-18,0 -18,-50 z"
          fill="#f2d9b8" stroke="#10233c" stroke-width="2.5"/>
    <rect x="86" y="150" width="30" height="30" fill="#5a6b7d" stroke="#10233c" stroke-width="2" transform="rotate(-18 101 165)"/>
  </g>
  <text class="q" x="185" y="95" text-anchor="middle">?</text>
  <text class="mot" x="120" y="270">Quelle matière ?</text>

  <!-- flèche vers la bonne benne -->
  <path d="M210,180 C320,120 430,120 520,150" fill="none" stroke="#1e7e54" stroke-width="5" marker-end="url(#fh)"/>
  <defs>
    <marker id="fh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e7e54"/>
    </marker>
  </defs>

  <!-- rangée de bennes -->
  <g>
    <!-- benne 1, neutre -->
    <polygon points="540,220 610,220 602,320 548,320" fill="#fffdf8" stroke="#5a6b7d" stroke-width="3"/>
    <rect x="532" y="208" width="86" height="14" rx="4" fill="#fffdf8" stroke="#5a6b7d" stroke-width="3"/>
    <text class="lbl" x="575" y="340">Bois</text>

    <!-- benne 2, la bonne : entourée en vert -->
    <polygon points="640,215 715,215 706,320 649,320" fill="#fffdf8" stroke="#1e7e54" stroke-width="5"/>
    <rect x="630" y="200" width="96" height="16" rx="4" fill="#fffdf8" stroke="#1e7e54" stroke-width="5"/>
    <circle cx="677" cy="190" r="18" fill="#fffdf8" stroke="#1e7e54" stroke-width="3"/>
    <polyline points="668,190 674,197 688,180" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mot" x="677" y="158" fill="#1e7e54">la bonne benne</text>
    <text class="lbl" x="677" y="340" font-weight="bold" fill="#1e7e54">Métaux</text>

    <!-- benne 3, neutre -->
    <polygon points="750,220 820,220 812,320 758,320" fill="#fffdf8" stroke="#5a6b7d" stroke-width="3"/>
    <rect x="742" y="208" width="86" height="14" rx="4" fill="#fffdf8" stroke="#5a6b7d" stroke-width="3"/>
    <text class="lbl" x="785" y="340">Carton</text>
  </g>

</svg>
