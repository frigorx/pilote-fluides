<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"
     aria-labelledby="t-buvt" aria-describedby="d-buvt" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-buvt">Une benne unique mélangée, contre plusieurs bennes triées par matière</title>
  <desc id="d-buvt">À gauche, une benne unique où toutes les matières sont mélangées : bois, métal,
    carton, plastique s'y côtoient en vrac. Une croix rouge et le mot « à éviter » marquent cette
    pratique. À droite, quatre bennes séparées, chacune dédiée à une matière — cuivre, bois,
    carton, plastique — surmontées d'une coche verte et du mot « tri correct ». En bas, une bande
    résume : trier à la source, c'est séparer les déchets dès leur production, matière par
    matière, plutôt que tout mélanger dans une seule benne.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fffdf8; }
    .lbl  { font-size:15px; fill:#10233c; }
    .mot  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:15px; }
    .band { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
  </style>

  <!-- ===== Gauche : la benne unique mélangée ===== -->
  <rect x="20" y="20" width="380" height="44" rx="12" fill="#c0392b"/>
  <text class="ttl" x="210" y="48" text-anchor="middle">TOUT MÉLANGÉ</text>

  <!-- la benne (trapèze) -->
  <polygon points="110,120 310,120 290,250 130,250" fill="#fffdf8" stroke="#c0392b" stroke-width="3"/>
  <rect x="95" y="108" width="230" height="16" rx="4" fill="#fffdf8" stroke="#c0392b" stroke-width="3"/>
  <!-- déchets mélangés en vrac : formes et couleurs variées, sans ordre -->
  <circle cx="150" cy="150" r="12" fill="#b06a00"/>
  <rect x="185" y="140" width="26" height="18" fill="#5a6b7d"/>
  <circle cx="240" cy="155" r="11" fill="#1e7e54"/>
  <rect x="150" y="175" width="22" height="22" fill="#1b3a63"/>
  <circle cx="200" cy="185" r="13" fill="#b06a00"/>
  <rect x="235" y="178" width="24" height="20" fill="#5a6b7d"/>
  <circle cx="170" cy="215" r="10" fill="#1b3a63"/>
  <rect x="205" y="210" width="26" height="18" fill="#1e7e54"/>

  <!-- croix rouge, posée à côté de la benne, jamais sur un tracé -->
  <circle cx="352" cy="105" r="24" fill="#fffdf8" stroke="#c0392b" stroke-width="3"/>
  <line x1="340" y1="93" x2="364" y2="117" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <line x1="364" y1="93" x2="340" y2="117" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <text class="mot" x="352" y="146" text-anchor="middle" fill="#c0392b">à éviter</text>

  <text class="lbl" x="210" y="285" text-anchor="middle">Une seule benne, toutes les matières ensemble</text>

  <!-- ===== Droite : les bennes triées par matière ===== -->
  <rect x="500" y="20" width="380" height="44" rx="12" fill="#57534e"/>
  <text class="ttl" x="690" y="48" text-anchor="middle">TRIÉ PAR MATIÈRE</text>

  <!-- coche verte -->
  <circle cx="690" cy="92" r="20" fill="#fffdf8" stroke="#1e7e54" stroke-width="3"/>
  <polyline points="680,92 687,100 702,82" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mot" x="690" y="128" text-anchor="middle" fill="#1e7e54">tri correct</text>

  <!-- quatre bennes séparées -->
  <g>
    <polygon points="520,160 580,160 573,250 527,250" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="512" y="150" width="76" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="533" y="178" width="34" height="34" fill="#5a6b7d"/>
    <text class="lbl" x="550" y="270" text-anchor="middle">Cuivre</text>
  </g>
  <g>
    <polygon points="606,160 666,160 659,250 613,250" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="598" y="150" width="76" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="619" y="178" width="34" height="34" fill="#b06a00"/>
    <text class="lbl" x="636" y="270" text-anchor="middle">Bois</text>
  </g>
  <g>
    <polygon points="692,160 752,160 745,250 699,250" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="684" y="150" width="76" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="705" y="178" width="34" height="34" fill="#1b3a63"/>
    <text class="lbl" x="722" y="270" text-anchor="middle">Carton</text>
  </g>
  <g>
    <polygon points="778,160 838,160 831,250 785,250" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="770" y="150" width="76" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="791" y="178" width="34" height="34" fill="#1e7e54"/>
    <text class="lbl" x="808" y="270" text-anchor="middle">Plastique</text>
  </g>

  <!-- ===== Bande de synthèse ===== -->
  <rect x="20" y="320" width="860" height="60" rx="14" fill="#eef0ee" stroke="#57534e" stroke-width="2"/>
  <text class="band" x="450" y="348" text-anchor="middle">Trier à la source : séparer les déchets dès leur</text>
  <text class="band" x="450" y="370" text-anchor="middle">production, matière par matière — pas une seule benne mélangée</text>
</svg>
