<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img"
     aria-labelledby="t-rbm" aria-describedby="d-rbm" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-rbm">Une rangée de bennes par famille de matière, plus une benne tout-venant à part</title>
  <desc id="d-rbm">Une rangée de huit bennes, chacune étiquetée par une famille de matière : métaux,
    bois, plastiques, verre, textiles, papier-carton, plâtre, et une fraction minérale ou inerte. À droite,
    séparée du reste par un trait pointillé et le mot « à part », une benne « tout-venant »,
    réservée à ce qui ne peut vraiment être trié dans aucune de ces familles.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .lbl { font-size:15px; fill:#10233c; font-weight:bold; text-anchor:middle; }
    .sep { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:15px; fill:#5a6b7d; }
  </style>

  <text class="ttl" x="500" y="34" text-anchor="middle">Les bennes d'un chantier, par grande famille de matière</text>

  <!-- huit bennes triées, en rangée (art. D. 543-281 du code de l'environnement, depuis le 01/01/2025) -->
  <g>
    <!-- Métaux -->
    <polygon points="20,120 100,120 92,220 28,220" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="15" y="108" width="90" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="42" y="140" width="36" height="10" fill="#5a6b7d"/>
    <rect x="46" y="155" width="28" height="10" fill="#5a6b7d"/>
    <text class="lbl" x="60" y="240">Métaux</text>

    <!-- Bois -->
    <polygon points="120,120 200,120 192,220 128,220" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="115" y="108" width="90" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <line x1="132" y1="145" x2="188" y2="145" stroke="#b06a00" stroke-width="6"/>
    <line x1="132" y1="163" x2="188" y2="163" stroke="#b06a00" stroke-width="6"/>
    <text class="lbl" x="160" y="240">Bois</text>

    <!-- Plastiques -->
    <polygon points="220,120 300,120 292,220 228,220" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="215" y="108" width="90" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <path d="M240,165 q20,-30 40,0" fill="none" stroke="#1e7e54" stroke-width="6" stroke-linecap="round"/>
    <text class="lbl" x="260" y="240">Plastiques</text>

    <!-- Verre -->
    <polygon points="320,120 400,120 392,220 328,220" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="315" y="108" width="90" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <path d="M352,140 v14 q0,10 8,10 q8,0 8,-10 v-14 z" fill="none" stroke="#1b3a63" stroke-width="4"/>
    <text class="lbl" x="360" y="240">Verre</text>

    <!-- Textiles (ajoutés aux flux obligatoires le 01/01/2025) -->
    <polygon points="420,120 500,120 492,220 428,220" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="415" y="108" width="90" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <path d="M444,146 l8,-7 h16 l8,7 l-5,8 l-4,-2 v18 h-22 v-18 l-4,2 z" fill="#7d4c9e"/>
    <text class="lbl" x="460" y="240">Textiles</text>

    <!-- Papier-carton -->
    <polygon points="520,120 600,120 592,220 528,220" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="515" y="108" width="90" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="543" y="140" width="34" height="26" fill="none" stroke="#57534e" stroke-width="4"/>
    <line x1="543" y1="153" x2="577" y2="153" stroke="#57534e" stroke-width="3"/>
    <text class="lbl" x="560" y="240">Papier-carton</text>

    <!-- Plâtre -->
    <polygon points="620,120 700,120 692,220 628,220" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="615" y="108" width="90" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="644" y="142" width="32" height="22" fill="#d6dee7" stroke="#5a6b7d" stroke-width="2"/>
    <text class="lbl" x="660" y="240">Plâtre</text>

    <!-- Minérale / inerte -->
    <polygon points="720,120 800,120 792,220 728,220" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="715" y="108" width="90" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <polygon points="742,166 752,142 767,150 774,166" fill="#5a6b7d"/>
    <text class="lbl" x="760" y="240">Minérale, inerte</text>
  </g>

  <!-- séparation : trait pointillé -->
  <line x1="850" y1="90" x2="850" y2="260" stroke="#5a6b7d" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="sep" x="850" y="80" text-anchor="middle">à part</text>

  <!-- benne tout-venant, en retrait -->
  <g>
    <polygon points="875,140 965,140 955,240 885,240" fill="#fffdf8" stroke="#b06a00" stroke-width="3" stroke-dasharray="7 5"/>
    <rect x="867" y="128" width="106" height="14" rx="4" fill="#fffdf8" stroke="#b06a00" stroke-width="3"/>
    <text class="lbl" x="920" y="260" fill="#b06a00">Tout-venant</text>
  </g>

  <!-- bande d'explication -->
  <rect x="20" y="300" width="960" height="130" rx="14" fill="#f4f0ec" stroke="#57534e" stroke-width="2"/>
  <text class="lbl" x="500" y="335" text-anchor="middle" font-size="16" font-weight="normal">Huit familles de matière, chacune sa benne — plus une benne « tout-venant »</text>
  <text class="lbl" x="500" y="365" text-anchor="middle" font-size="16" font-weight="normal">réservée à ce qui ne peut vraiment être trié dans aucune de ces familles.</text>
</svg>
