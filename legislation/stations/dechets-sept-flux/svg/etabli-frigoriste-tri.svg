<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img"
     aria-labelledby="t-eft" aria-describedby="d-eft" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-eft">Ce qu'un frigoriste trie vraiment : cinq déchets, cinq flèches vers leur benne</title>
  <desc id="d-eft">Un établi de frigoriste porte cinq déchets réellement produits sur un chantier :
    du cuivre de tuyauterie, des cartons et palettes, des chutes de bois, des chutes d'isolant, et
    des gaines métalliques ou plastiques. Chacun est relié par une flèche courte vers sa benne :
    le cuivre vers la benne métaux, les cartons vers la benne papier-carton, le bois vers la benne
    bois, l'isolant vers la benne tout-venant car il est souvent non recyclable, et les gaines vers
    la benne métaux ou la benne plastiques selon leur matière.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .lbl { font-size:15px; fill:#10233c; font-weight:bold; text-anchor:middle; }
    .note{ font-size:15px; fill:#5a6b7d; font-style:italic; text-anchor:middle; }
  </style>

  <text class="ttl" x="500" y="30" text-anchor="middle">L'établi du frigoriste : cinq déchets, chacun sa benne</text>

  <!-- l'établi -->
  <rect x="30" y="120" width="940" height="20" rx="4" fill="#57534e"/>
  <rect x="50" y="140" width="20" height="70" fill="#5a6b7d"/>
  <rect x="930" y="140" width="20" height="70" fill="#5a6b7d"/>

  <!-- les cinq déchets, posés sur l'établi -->
  <g>
    <!-- cuivre : tuyauterie -->
    <rect x="70" y="80" width="14" height="35" rx="6" fill="#b06a00"/>
    <rect x="90" y="70" width="14" height="45" rx="6" fill="#b06a00"/>
    <rect x="110" y="90" width="14" height="25" rx="6" fill="#b06a00"/>
    <text class="lbl" x="100" y="60">Cuivre</text>
  </g>
  <g>
    <!-- cartons et palettes -->
    <rect x="270" y="75" width="60" height="42" fill="none" stroke="#57534e" stroke-width="4"/>
    <line x1="270" y1="96" x2="330" y2="96" stroke="#57534e" stroke-width="3"/>
    <text class="lbl" x="300" y="60">Cartons, palettes</text>
  </g>
  <g>
    <!-- chutes de bois -->
    <line x1="460" y1="82" x2="540" y2="82" stroke="#b06a00" stroke-width="8" stroke-linecap="round"/>
    <line x1="470" y1="100" x2="530" y2="100" stroke="#b06a00" stroke-width="8" stroke-linecap="round"/>
    <text class="lbl" x="500" y="60">Chutes de bois</text>
  </g>
  <g>
    <!-- chutes d'isolant -->
    <rect x="665" y="75" width="70" height="40" fill="#d6dee7" stroke="#5a6b7d" stroke-width="3"/>
    <line x1="675" y1="85" x2="725" y2="105" stroke="#5a6b7d" stroke-width="2"/>
    <line x1="675" y1="105" x2="725" y2="85" stroke="#5a6b7d" stroke-width="2"/>
    <text class="lbl" x="700" y="60">Chutes d'isolant</text>
  </g>
  <g>
    <!-- gaines -->
    <path d="M870,110 q15,-40 30,0 q15,-40 30,0" fill="none" stroke="#1e7e54" stroke-width="7" stroke-linecap="round"/>
    <text class="lbl" x="900" y="60">Gaines</text>
  </g>

  <!-- flèches courtes vers les bennes -->
  <g stroke="#10233c" stroke-width="3" fill="none" marker-end="url(#fleche)">
    <line x1="100" y1="145" x2="100" y2="260"/>
    <line x1="300" y1="145" x2="300" y2="260"/>
    <line x1="500" y1="145" x2="500" y2="260"/>
    <line x1="700" y1="145" x2="700" y2="260"/>
    <line x1="860" y1="145" x2="815" y2="260"/>
    <line x1="920" y1="145" x2="935" y2="260"/>
  </g>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10233c"/>
    </marker>
  </defs>

  <!-- les bennes de destination -->
  <g>
    <polygon points="60,270 140,270 132,360 68,360" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="52" y="258" width="96" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <text class="lbl" x="100" y="380">Métaux</text>
  </g>
  <g>
    <polygon points="260,270 340,270 332,360 268,360" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="252" y="258" width="96" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <text class="lbl" x="300" y="380">Papier-carton</text>
  </g>
  <g>
    <polygon points="460,270 540,270 532,360 468,360" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="452" y="258" width="96" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <text class="lbl" x="500" y="380">Bois</text>
  </g>
  <g>
    <polygon points="775,270 855,270 847,360 783,360" fill="#fffdf8" stroke="#b06a00" stroke-width="3" stroke-dasharray="7 5"/>
    <rect x="767" y="258" width="96" height="14" rx="4" fill="#fffdf8" stroke="#b06a00" stroke-width="3"/>
    <text class="lbl" x="815" y="380" fill="#b06a00">Tout-venant</text>
  </g>
  <g>
    <polygon points="895,270 975,270 967,360 903,360" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <rect x="887" y="258" width="96" height="14" rx="4" fill="#fffdf8" stroke="#57534e" stroke-width="3"/>
    <text class="lbl" x="935" y="378" font-size="15">Métaux ou</text>
    <text class="lbl" x="935" y="396" font-size="15">plastiques</text>
  </g>

  <text class="note" x="500" y="440">Le frigoriste ne produit presque jamais de plâtre ou de verre — mais il partage souvent</text>
  <text class="note" x="500" y="462">les bennes d'un chantier commun avec d'autres corps de métier.</text>
</svg>
