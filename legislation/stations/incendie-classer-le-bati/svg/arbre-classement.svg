<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-arb" aria-describedby="d-arb" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-arb">Un bâtiment, quatre questions, quatre régimes</title>
  <desc id="d-arb">À gauche, un pictogramme de bâtiment étiqueté « Un bâtiment à classer ». Un tronc vertical
    relie ce bâtiment à quatre lignes. Chaque ligne associe une question à un régime. Première ligne : des
    personnes extérieures y sont-elles admises ? Régime : ERP, établissement recevant du public. Deuxième ligne :
    le plancher du dernier niveau est-il très haut ? Régime : IGH, immeuble de grande hauteur. Troisième ligne :
    y habite-t-on ? Régime : habitation, familles un à quatre. Quatrième ligne : seuls des salariés y travaillent ?
    Régime : Code du travail. En bas, une bande rappelle qu'un même bâtiment peut cumuler plusieurs cas et qu'on
    applique alors la règle la plus contraignante. L'animation allume les quatre lignes l'une après l'autre ;
    l'image fixe est complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .qst { font-size:17px; fill:#10233c; }
    .rg  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#b91c1c; }
    .sub { font-size:16px; fill:#10233c; }
    .bat { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#1b3a63; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
  </style>

  <text class="ttl" x="400" y="32" text-anchor="middle">Le classement commence par quatre questions</text>

  <!-- Le bâtiment à classer -->
  <rect x="24" y="170" width="150" height="120" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <rect x="50" y="188" width="98" height="52" fill="#eef3f9" stroke="#5a6b7d" stroke-width="2"/>
  <rect x="58" y="196" width="18" height="14" fill="#5a6b7d"/><rect x="84" y="196" width="18" height="14" fill="#5a6b7d"/><rect x="110" y="196" width="18" height="14" fill="#5a6b7d"/>
  <rect x="58" y="218" width="18" height="14" fill="#5a6b7d"/><rect x="84" y="218" width="18" height="14" fill="#5a6b7d"/><rect x="110" y="218" width="18" height="14" fill="#5a6b7d"/>
  <text class="bat" x="99" y="262" text-anchor="middle">Un bâtiment</text>
  <text class="bat" x="99" y="282" text-anchor="middle">à classer</text>

  <!-- Le tronc et les branches -->
  <line x1="174" y1="230" x2="205" y2="230" stroke="#1b3a63" stroke-width="3"/>
  <line x1="205" y1="102" x2="205" y2="372" stroke="#1b3a63" stroke-width="3"/>
  <line x1="205" y1="102" x2="235" y2="102" stroke="#1b3a63" stroke-width="3"/>
  <line x1="205" y1="192" x2="235" y2="192" stroke="#1b3a63" stroke-width="3"/>
  <line x1="205" y1="282" x2="235" y2="282" stroke="#1b3a63" stroke-width="3"/>
  <line x1="205" y1="372" x2="235" y2="372" stroke="#1b3a63" stroke-width="3"/>

  <!-- Ligne 1 : ERP -->
  <g>
    <rect x="238" y="64" width="290" height="76" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
    <text class="qst" x="383" y="94" text-anchor="middle">Des personnes extérieures</text>
    <text class="qst" x="383" y="118" text-anchor="middle">y sont-elles admises ?</text>
    <line x1="528" y1="102" x2="556" y2="102" stroke="#b91c1c" stroke-width="3"/>
    <rect x="558" y="64" width="222" height="76" rx="12" fill="#fbeaea" stroke="#b91c1c" stroke-width="2.5"/>
    <text class="rg" x="669" y="94" text-anchor="middle">ERP</text>
    <text class="sub" x="669" y="118" text-anchor="middle">recevant du public</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.13;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <!-- Ligne 2 : IGH -->
  <g>
    <rect x="238" y="154" width="290" height="76" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
    <text class="qst" x="383" y="184" text-anchor="middle">Le plancher du dernier niveau</text>
    <text class="qst" x="383" y="208" text-anchor="middle">est-il très haut ?</text>
    <line x1="528" y1="192" x2="556" y2="192" stroke="#b91c1c" stroke-width="3"/>
    <rect x="558" y="154" width="222" height="76" rx="12" fill="#fbeaea" stroke="#b91c1c" stroke-width="2.5"/>
    <text class="rg" x="669" y="184" text-anchor="middle">IGH</text>
    <text class="sub" x="669" y="208" text-anchor="middle">grande hauteur</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.28;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <!-- Ligne 3 : habitation -->
  <g>
    <rect x="238" y="244" width="290" height="76" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
    <text class="qst" x="383" y="288" text-anchor="middle">Y habite-t-on ?</text>
    <line x1="528" y1="282" x2="556" y2="282" stroke="#b91c1c" stroke-width="3"/>
    <rect x="558" y="244" width="222" height="76" rx="12" fill="#fbeaea" stroke="#b91c1c" stroke-width="2.5"/>
    <text class="rg" x="669" y="274" text-anchor="middle">Habitation</text>
    <text class="sub" x="669" y="298" text-anchor="middle">familles 1 à 4</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.43;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <!-- Ligne 4 : Code du travail -->
  <g>
    <rect x="238" y="334" width="290" height="76" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
    <text class="qst" x="383" y="364" text-anchor="middle">Seuls des salariés y</text>
    <text class="qst" x="383" y="388" text-anchor="middle">travaillent-ils ?</text>
    <line x1="528" y1="372" x2="556" y2="372" stroke="#b91c1c" stroke-width="3"/>
    <rect x="558" y="334" width="222" height="76" rx="12" fill="#fbeaea" stroke="#b91c1c" stroke-width="2.5"/>
    <text class="rg" x="669" y="364" text-anchor="middle">Code du travail</text>
    <text class="sub" x="669" y="388" text-anchor="middle">lieux de travail</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.58;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Bande -->
  <g>
    <rect x="24" y="426" width="752" height="66" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
    <text class="band" x="400" y="452" text-anchor="middle">Un même bâtiment peut cumuler plusieurs cas :</text>
    <text class="band" x="400" y="478" text-anchor="middle">on applique alors la règle la plus contraignante</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.76;1" dur="12s" repeatCount="indefinite"/>
  </g>
</svg>
