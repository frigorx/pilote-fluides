<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img"
     aria-labelledby="t-igh" aria-describedby="d-igh" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-igh">L'IGH se mesure jusqu'au plancher bas du dernier niveau</title>
  <desc id="d-igh">Deux immeubles posés sur une ligne de sol. Deux lignes horizontales en tirets rouges marquent les seuils :
    50 mètres pour un immeuble d'habitation, 28 mètres pour tout autre immeuble. À gauche, l'immeuble d'habitation : une barre
    verticale orange monte du sol jusqu'au plancher bas de son dernier niveau, repéré par un trait orange, au-dessus de la ligne des
    50 mètres. À droite, l'immeuble de bureaux : la barre monte jusqu'au plancher bas du dernier niveau, au-dessus de la ligne des
    28 mètres. Une note à droite précise que la cote s'arrête au plancher bas du dernier niveau, pas au toit. Sous la ligne de sol,
    la légende précise que la mesure part du niveau du sol le plus haut utilisable par les engins de secours. L'animation fait monter
    les deux barres l'une après l'autre ; l'image fixe est complète.</desc>
  <defs>
    <pattern id="fen" width="30" height="24" patternUnits="userSpaceOnUse">
      <rect x="8" y="7" width="14" height="10" fill="#5a6b7d" opacity="0.55"/>
    </pattern>
  </defs>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .seuil{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#b91c1c; }
    .nom { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#1b3a63; }
    .not { font-size:16px; fill:#10233c; }
    .notb{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
  </style>

  <text class="ttl" x="400" y="32" text-anchor="middle">La hauteur d'un IGH : jusqu'au plancher bas du dernier niveau</text>

  <!-- Seuils -->
  <line x1="20" y1="140" x2="780" y2="140" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="10 7"/>
  <line x1="20" y1="285" x2="780" y2="285" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text class="seuil" x="20" y="130">Habitation : 50 m</text>
  <text class="seuil" x="20" y="275">Autres : 28 m</text>

  <!-- Immeuble d'habitation -->
  <rect x="215" y="95" width="150" height="375" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <rect x="215" y="95" width="150" height="375" fill="url(#fen)"/>
  <text class="nom" x="290" y="83" text-anchor="middle">Immeuble d'habitation</text>
  <!-- Immeuble de bureaux -->
  <rect x="470" y="215" width="150" height="255" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <rect x="470" y="215" width="150" height="255" fill="url(#fen)"/>
  <text class="nom" x="545" y="203" text-anchor="middle">Immeuble de bureaux</text>

  <!-- Sol -->
  <line x1="20" y1="470" x2="780" y2="470" stroke="#1b3a63" stroke-width="5"/>
  <text class="not" x="400" y="500" text-anchor="middle">Mesure depuis le sol le plus haut utilisable par les engins de secours</text>

  <!-- Cotes qui montent -->
  <rect x="180" y="125" width="9" height="345" fill="#e8914a">
    <animate attributeName="y" values="470;470;125;125" keyTimes="0;0.10;0.30;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="height" values="0;0;345;345" keyTimes="0;0.10;0.30;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect x="435" y="250" width="9" height="220" fill="#e8914a">
    <animate attributeName="y" values="470;470;250;250" keyTimes="0;0.32;0.50;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="height" values="0;0;220;220" keyTimes="0;0.32;0.50;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- Plancher bas du dernier niveau -->
  <g>
    <line x1="180" y1="125" x2="365" y2="125" stroke="#e8914a" stroke-width="5"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.34;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <line x1="435" y1="250" x2="620" y2="250" stroke="#e8914a" stroke-width="5"/>
    <line x1="620" y1="250" x2="646" y2="250" stroke="#5a6b7d" stroke-width="2"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.54;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Note -->
  <g>
    <text class="notb" x="652" y="200">Plancher bas</text>
    <text class="notb" x="652" y="220">du dernier niveau :</text>
    <text class="not" x="652" y="246">la cote s'arrête</text>
    <text class="not" x="652" y="266">ici, pas au toit</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.64;1" dur="12s" repeatCount="indefinite"/>
  </g>
</svg>
