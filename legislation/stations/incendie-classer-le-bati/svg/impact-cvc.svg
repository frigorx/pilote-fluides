<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-cvc" aria-describedby="d-cvc" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-cvc">Ce que le classement change pour le lot CVC</title>
  <desc id="d-cvc">Au centre, une carte « Le classement du bâtiment ». Quatre traits la relient à quatre cartes placées aux quatre coins.
    En haut à gauche : le désenfumage, obligatoire ou non, naturel ou mécanique, qui dépend du classement. En haut à droite : le compartimentage,
    une gaine qui traverse une paroi ne doit pas défaire le compartiment. En bas à gauche : les matériaux, dont le comportement au feu est encadré.
    En bas à droite : le système de sécurité incendie, catégories A à E, qui porte les scénarios de mise en sécurité. Chaque carte renvoie à une station
    voisine du réseau. L'animation fait apparaître les quatre cartes une à une ; l'image fixe est complète.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .ctr { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#fffdf8; }
    .tag { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#b91c1c; }
    .nom { font-size:16px; fill:#10233c; }
    .gr  { font-size:16px; fill:#5a6b7d; font-style:italic; }
  </style>
  <text class="ttl" x="400" y="30" text-anchor="middle">Le classement décide quatre choses pour vous</text>
  <g>
    <line x1="300" y1="215" x2="200" y2="160" stroke="#1b3a63" stroke-width="3"/>
    <rect x="20" y="50" width="360" height="110" rx="12" fill="#fffdf8" stroke="#b91c1c" stroke-width="2.5"/>
    <text class="tag" x="36" y="80">Désenfumage</text>
    <text class="nom" x="36" y="106">Obligatoire ou non, naturel ou mécanique :</text>
    <text class="nom" x="36" y="126">tout dépend du classement du bâtiment.</text>
    <text class="gr" x="36" y="148">Station voisine : désenfumage</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.16;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <line x1="500" y1="215" x2="600" y2="160" stroke="#1b3a63" stroke-width="3"/>
    <rect x="420" y="50" width="360" height="110" rx="12" fill="#fffdf8" stroke="#b91c1c" stroke-width="2.5"/>
    <text class="tag" x="436" y="80">Compartimentage</text>
    <text class="nom" x="436" y="106">Une gaine qui traverse une paroi ne doit</text>
    <text class="nom" x="436" y="126">pas défaire le compartiment.</text>
    <text class="gr" x="436" y="148">Station voisine : clapets coupe-feu</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.32;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <line x1="300" y1="305" x2="200" y2="360" stroke="#1b3a63" stroke-width="3"/>
    <rect x="20" y="360" width="360" height="110" rx="12" fill="#fffdf8" stroke="#b91c1c" stroke-width="2.5"/>
    <text class="tag" x="36" y="390">Matériaux</text>
    <text class="nom" x="36" y="416">Le comportement au feu des matériaux et</text>
    <text class="nom" x="36" y="436">des éléments de construction est encadré.</text>
    <text class="gr" x="36" y="458">Station voisine : euroclasses</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.40;0.48;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <line x1="500" y1="305" x2="600" y2="360" stroke="#1b3a63" stroke-width="3"/>
    <rect x="420" y="360" width="360" height="110" rx="12" fill="#fffdf8" stroke="#b91c1c" stroke-width="2.5"/>
    <text class="tag" x="436" y="390">Système de sécurité incendie</text>
    <text class="nom" x="436" y="416">Le SSI, catégories A à E, porte les scénarios</text>
    <text class="nom" x="436" y="436">de mise en sécurité de l’établissement.</text>
    <text class="gr" x="436" y="458">Station voisine : SSI</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.64;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <rect x="290" y="215" width="220" height="90" rx="14" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <text class="ctr" x="400" y="255" text-anchor="middle">Le classement</text>
  <text class="ctr" x="400" y="281" text-anchor="middle">du bâtiment</text>
</svg>
