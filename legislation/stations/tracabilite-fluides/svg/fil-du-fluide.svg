<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-fil" aria-describedby="d-fil" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-fil">Le fil du fluide, de la machine à la filière</title>
  <desc id="d-fil">Cinq étapes alignées de gauche à droite, reliées par des flèches : la machine, la récupération du fluide, la bouteille de récupération, le distributeur et l'installation de traitement. Au-dessus, deux bandeaux : à gauche, en trait plein bleu, la fiche d'intervention Cerfa 15497 couvre la machine et la récupération ; à droite, en trait tireté orange, le bordereau de suivi BSFF dans Trackdéchets couvre la bouteille, le distributeur et le traitement. Une bande en bas rappelle que chaque étape laisse une trace écrite et signée. Dans l'animation, une goutte suit le fil de gauche à droite ; l'image fixe montre déjà tout.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomt{ font-weight:bold; font-size:18px; fill:#0f766e; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text class="ttl" x="400" y="36" text-anchor="middle">Le fil du fluide, de la machine à la filière</text>
  <g>
    <rect x="30" y="62" width="340" height="64" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
    <text class="nom" x="200" y="91" text-anchor="middle">FICHE D'INTERVENTION</text>
    <text class="txt" x="200" y="114" text-anchor="middle">Cerfa 15497 · l'intervention</text>
    <path d="M80,126 V200 M240,126 V200" stroke="#1b3a63" stroke-width="3" fill="none"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.08;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="400" y="62" width="370" height="64" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3" stroke-dasharray="10 7"/>
    <text class="nomo" x="585" y="91" text-anchor="middle">BSFF DANS TRACKDÉCHETS</text>
    <text class="txt" x="585" y="114" text-anchor="middle">le fluide devenu déchet</text>
    <path d="M400,126 V200 M560,126 V200 M720,126 V200" stroke="#e8914a" stroke-width="3" stroke-dasharray="7 6" fill="none"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.36;0.44;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <g>
    <circle cx="80" cy="250" r="46" fill="#fff" stroke="#5a6b7d" stroke-width="2.5"/>
    <rect x="58" y="234" width="44" height="32" rx="4" stroke="#1b3a63" stroke-width="2.5" fill="#eef3f9" stroke-linejoin="round"/><circle cx="73" cy="250" r="9" fill="none" stroke="#1b3a63" stroke-width="2.5"/><path d="M88,242 v16 M95,242 v16" stroke="#1b3a63" stroke-width="2.5"/>
    <text class="nom" x="80" y="332" text-anchor="middle">Machine</text>
    <text class="txt" x="80" y="356" text-anchor="middle">intervention</text>
    <path d="M130,250 H186" stroke="#5a6b7d" stroke-width="3" fill="none" marker-end="url(#fl)"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.07;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="240" cy="250" r="46" fill="#fff" stroke="#5a6b7d" stroke-width="2.5"/>
    <rect x="219" y="235" width="42" height="30" rx="4" stroke="#1b3a63" stroke-width="2.5" fill="#eef3f9" stroke-linejoin="round"/><circle cx="232" cy="250" r="7" fill="none" stroke="#1b3a63" stroke-width="2.5"/><path d="M249,242 v11" stroke="#1b3a63" stroke-width="3"/><path d="M243,251 l6,8 l6,-8 z" fill="#1b3a63"/>
    <text class="nom" x="240" y="332" text-anchor="middle">Récupération</text>
    <text class="txt" x="240" y="356" text-anchor="middle">du fluide</text>
    <path d="M290,250 H346" stroke="#5a6b7d" stroke-width="3" fill="none" marker-end="url(#fl)"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09000000000000001;0.14;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="400" cy="250" r="46" fill="#fff" stroke="#5a6b7d" stroke-width="2.5"/>
    <rect x="394" y="223" width="12" height="12" rx="2" stroke="#1b3a63" stroke-width="2.5" fill="#eef3f9" stroke-linejoin="round"/><rect x="391" y="220" width="18" height="5" rx="2" fill="#1b3a63"/><rect x="387" y="234" width="26" height="42" rx="9" stroke="#1b3a63" stroke-width="2.5" fill="#eef3f9" stroke-linejoin="round"/>
    <text class="nom" x="400" y="332" text-anchor="middle">Bouteille</text>
    <text class="txt" x="400" y="356" text-anchor="middle">de récupération</text>
    <path d="M450,250 H506" stroke="#5a6b7d" stroke-width="3" fill="none" marker-end="url(#fl)"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.21000000000000002;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="560" cy="250" r="46" fill="#fff" stroke="#5a6b7d" stroke-width="2.5"/>
    <path d="M536,266 V246 L560,230 L584,246 V266 Z" stroke="#1b3a63" stroke-width="2.5" fill="#eef3f9" stroke-linejoin="round"/><rect x="553" y="251" width="14" height="15" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/>
    <text class="nom" x="560" y="332" text-anchor="middle">Distributeur</text>
    <text class="txt" x="560" y="356" text-anchor="middle">regroupement</text>
    <path d="M610,250 H666" stroke="#5a6b7d" stroke-width="3" fill="none" marker-end="url(#fl)"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.23;0.28;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="720" cy="250" r="46" fill="#fff" stroke="#5a6b7d" stroke-width="2.5"/>
    <rect x="697" y="247" width="46" height="20" stroke="#1b3a63" stroke-width="2.5" fill="#eef3f9" stroke-linejoin="round"/><rect x="726" y="228" width="11" height="19" stroke="#1b3a63" stroke-width="2.5" fill="#eef3f9" stroke-linejoin="round"/><path d="M697,247 l12,-9 v9 l12,-9 v9" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round"/>
    <text class="nom" x="720" y="332" text-anchor="middle">Traitement</text>
    <text class="txt" x="720" y="356" text-anchor="middle">régénération</text>
    <text class="txt" x="720" y="378" text-anchor="middle">ou destruction</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30000000000000004;0.35000000000000003;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <circle r="8" fill="#0f766e" opacity="0" cx="0" cy="0">
    <animateMotion path="M80,304 H720" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.10;0.70;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.10;0.12;0.68;0.71;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect x="30" y="404" width="740" height="76" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="2.5"/>
  <text class="nomt" x="400" y="435" text-anchor="middle">Chaque étape laisse une trace écrite et signée.</text>
  <text class="txt" x="400" y="462" text-anchor="middle">Si un maillon manque, le fil se coupe : la preuve n'existe plus.</text>
</svg>
