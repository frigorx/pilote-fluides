<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-dr" aria-describedby="d-dr" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-dr">Climatiser en dernier recours : un besoin déjà réduit par les trois leviers passifs</title>
  <desc id="d-dr">Une grande barre verticale représente le besoin de rafraîchissement de départ.
    Trois flèches viennent la réduire par étapes, une pour chaque levier déjà vu : protection
    solaire, inertie, ventilation nocturne. Ce qui reste en haut de la barre, plus petit, porte la
    mention besoin résiduel : c'est seulement lui que la climatisation doit couvrir, et c'est sur
    lui qu'elle se dimensionne.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl { font-size:15px; fill:#10233c; }
    .etape{ font-size:14px; fill:#1b3a63; }
  </style>

  <text class="ttl" x="450" y="26" text-anchor="middle">La climatisation se dimensionne sur ce qui reste</text>

  <!-- barre du besoin, du bas vers le haut : réduit par 3 étapes -->
  <rect x="360" y="60"  width="180" height="60"  fill="#fbe7e4" stroke="#c0392b" stroke-width="2.5"/>
  <text class="lbl" x="450" y="95" text-anchor="middle" fill="#c0392b" font-weight="bold">besoin résiduel</text>

  <rect x="360" y="120" width="180" height="50" fill="#eef3f9" stroke="#98a6b3" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="etape" x="450" y="150" text-anchor="middle">réduit par la ventilation nocturne</text>

  <rect x="360" y="170" width="180" height="50" fill="#eef3f9" stroke="#98a6b3" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="etape" x="450" y="200" text-anchor="middle">réduit par l'inertie</text>

  <rect x="360" y="220" width="180" height="50" fill="#eef3f9" stroke="#98a6b3" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="etape" x="450" y="250" text-anchor="middle">réduit par la protection solaire</text>

  <text class="lbl" x="450" y="290" text-anchor="middle">besoin de rafraîchissement, avant tout levier</text>

  <!-- climatiseur couvrant le besoin résiduel -->
  <rect x="620" y="60" width="140" height="80" rx="10" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/>
  <circle cx="660" cy="100" r="16" fill="none" stroke="#1e7e54" stroke-width="2.5"/>
  <circle cx="710" cy="100" r="16" fill="none" stroke="#1e7e54" stroke-width="2.5"/>
  <path d="M 545 90 L 615 90" fill="none" stroke="#1e7e54" stroke-width="2.5"/>
  <polygon points="615,90 600,83 600,97" fill="#1e7e54"/>
  <text class="lbl" x="690" y="165" text-anchor="middle" fill="#1e7e54" font-weight="bold">dimensionnée</text>
  <text class="lbl" x="690" y="185" text-anchor="middle" fill="#1e7e54" font-weight="bold">sur ce reste</text>
</svg>
