<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-hc" aria-describedby="d-hc" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-hc">La hiérarchie des solutions : la conception avant la climatisation</title>
  <desc id="d-hc">Quatre blocs empilés en escalier descendant, numérotés de un à quatre. Premier
    bloc, le plus large : protection solaire. Deuxième bloc : inertie thermique. Troisième bloc :
    ventilation nocturne. Quatrième bloc, le plus étroit et de couleur différente : climatiser,
    en dernier recours. Une flèche verticale à gauche indique l'ordre dans lequel les leviers
    sont mobilisés.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .lbl { font-size:15px; fill:#5a6b7d; }
    .num { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#fffdf8; }
  </style>

  <line x1="40" y1="40" x2="40" y2="300" stroke="#92400e" stroke-width="3"/>
  <polygon points="40,300 32,282 48,282" fill="#92400e"/>
  <text class="lbl" x="40" y="30" text-anchor="middle" font-size="14">ordre</text>

  <rect x="90" y="40" width="700" height="55" rx="10" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5"/>
  <circle cx="120" cy="67" r="16" fill="#1b3a63"/>
  <text class="num" x="120" y="73" text-anchor="middle">1</text>
  <text class="ttl" x="440" y="73" text-anchor="middle">Protection solaire</text>

  <rect x="120" y="105" width="640" height="55" rx="10" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5"/>
  <circle cx="150" cy="132" r="16" fill="#1b3a63"/>
  <text class="num" x="150" y="138" text-anchor="middle">2</text>
  <text class="ttl" x="455" y="138" text-anchor="middle">Inertie thermique</text>

  <rect x="150" y="170" width="580" height="55" rx="10" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5"/>
  <circle cx="180" cy="197" r="16" fill="#1b3a63"/>
  <text class="num" x="180" y="203" text-anchor="middle">3</text>
  <text class="ttl" x="470" y="203" text-anchor="middle">Ventilation nocturne</text>

  <rect x="180" y="235" width="440" height="55" rx="10" fill="#fff4e0" stroke="#92400e" stroke-width="3"/>
  <circle cx="210" cy="262" r="16" fill="#92400e"/>
  <text class="num" x="210" y="268" text-anchor="middle">4</text>
  <text class="ttl" x="440" y="262" text-anchor="middle" fill="#92400e">Climatiser — en dernier recours</text>
</svg>
