<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="Deux colonnes à ne pas confondre. À gauche, l'équipement neuf : l'annexe du règlement fixe un échéancier par catégorie d'équipement et par seuil de PRP, de 2025 à 2035. À droite, la maintenance et l'entretien du parc existant : certains fluides à très fort PRP ne peuvent plus servir en appoint, mais des tolérances existent pour le fluide recyclé ou régénéré.">
<title>Interdictions : le neuf d'abord, la maintenance ensuite</title>
<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><cc:Work rdf:about=""><dc:title>Interdictions : le neuf d'abord, la maintenance ensuite</dc:title><dc:creator><cc:Agent><dc:title>inerWeb — F. Henninot</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date><cc:license rdf:resource="https://creativecommons.org/licenses/by-nc-nd/4.0/"/></cc:Work></rdf:RDF></metadata>
<style>
  .t  { font:700 19px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
  .ct { font:700 17px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
  .cs { font:400 14px Calibri,Segoe UI,sans-serif; fill:#637285; }
  .lg { font:400 14px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
  .co { font:700 14.5px Calibri,Segoe UI,sans-serif; fill:#c9451a; }
  .pa { font:700 14px Calibri,Segoe UI,sans-serif; fill:#1e7e54; }
</style>
<rect width="880" height="360" fill="#ffffff"/>
<text class="t" x="30" y="28">Deux familles d'interdictions, à ne pas confondre</text>

<rect x="30" y="55" width="400" height="215" rx="8" fill="#f7fafc" stroke="#c9d4de" stroke-width="1.5"/>
<line x1="30" y1="57" x2="430" y2="57" stroke="#1b3a63" stroke-width="5"/>
<text class="ct" x="52" y="88">1 · ÉQUIPEMENT NEUF</text>
<text class="cs" x="52" y="110">mise sur le marché</text>
<text class="lg" x="52" y="144">L'annexe du règlement fixe un échéancier</text>
<text class="lg" x="52" y="166">par catégorie d'équipement et par seuil de PRP.</text>
<text class="lg" x="52" y="198">2025 → 2035 : climatiseurs, pompes à chaleur,</text>
<text class="lg" x="52" y="220">froid commercial glissent vers les bas PRP,</text>
<text class="lg" x="52" y="242">puis vers les fluides naturels.</text>

<rect x="450" y="55" width="400" height="215" rx="8" fill="#fdf9f4" stroke="#e8b9a8" stroke-width="1.5"/>
<line x1="450" y1="57" x2="850" y2="57" stroke="#c9451a" stroke-width="5" stroke-dasharray="10 6"/>
<text class="ct" x="472" y="88">2 · MAINTENANCE ET ENTRETIEN</text>
<text class="cs" x="472" y="110">faire vivre le parc existant</text>
<text class="lg" x="472" y="144">Certains fluides à très fort PRP ne peuvent</text>
<text class="lg" x="472" y="166">plus servir en appoint.</text>
<text class="lg" x="472" y="198">Mais des tolérances existent, pour que le parc</text>
<text class="lg" x="472" y="220">existant vive sa fin de carrière :</text>
<rect x="472" y="232" width="215" height="28" rx="14" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2.5"/>
<text class="pa" x="579" y="251" text-anchor="middle">recyclé ou régénéré</text>

<rect x="30" y="288" width="820" height="56" rx="8" fill="#fdf1ed" stroke="#e8b9a8" stroke-width="1.5"/>
<text class="co" x="48" y="312">La règle maison : ne pas apprendre l'échéancier par cœur.</text>
<text class="lg" x="48" y="333">Savoir qu'il existe, savoir où le vérifier — l'annexe du règlement en vigueur — et le vérifier à chaque affaire.</text>
</svg>
