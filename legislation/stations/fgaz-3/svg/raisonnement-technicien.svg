<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 456" role="img" aria-label="Logigramme en cascade de quatre questions, dans l'ordre. Un : quel PRP ? Deux : quelle charge, donc combien de tonnes équivalent CO2 ? Trois : ce fluide restera-t-il disponible et abordable sous quota ? Quatre : une alternative bas PRP ou naturelle est-elle possible ici ? Chaque question mène à la suivante par une flèche descendante.">
<title>Le raisonnement du technicien</title>
<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><cc:Work rdf:about=""><dc:title>Le raisonnement du technicien</dc:title><dc:creator><cc:Agent><dc:title>inerWeb — F. Henninot</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date><cc:license rdf:resource="https://creativecommons.org/licenses/by-nc-nd/4.0/"/></cc:Work></rdf:RDF></metadata>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
  </marker>
</defs>
<style>
  .t  { font:700 19px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
  .q  { font:700 17px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
  .lg { font:400 13.5px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
  .nu { font:700 17px Calibri,Segoe UI,sans-serif; fill:#ffffff; }
  .co { font:700 14.5px Calibri,Segoe UI,sans-serif; fill:#c9451a; }
</style>
<rect width="880" height="456" fill="#ffffff"/>
<text class="t" x="30" y="28">Devant un choix de fluide ou d'équipement, quatre questions dans l'ordre</text>

<rect x="30" y="48" width="530" height="62" rx="8" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="60" cy="79" r="17" fill="#0f766e"/>
<text class="nu" x="60" y="85" text-anchor="middle">1</text>
<text class="q" x="92" y="85">Quel PRP ?</text>

<line x1="130" y1="112" x2="130" y2="132" stroke="#0f766e" stroke-width="2.5" marker-end="url(#fl)"/>

<rect x="90" y="136" width="530" height="62" rx="8" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="120" cy="167" r="17" fill="#0f766e"/>
<text class="nu" x="120" y="173" text-anchor="middle">2</text>
<text class="q" x="152" y="164">Quelle charge, donc combien de t éq. CO₂ ?</text>
<text class="lg" x="152" y="185">ce sont les obligations et les contrôles qui en dépendent</text>

<line x1="190" y1="200" x2="190" y2="220" stroke="#0f766e" stroke-width="2.5" marker-end="url(#fl)"/>

<rect x="150" y="224" width="560" height="62" rx="8" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="180" cy="255" r="17" fill="#0f766e"/>
<text class="nu" x="180" y="261" text-anchor="middle">3</text>
<text class="q" x="212" y="261">Ce fluide restera-t-il disponible et abordable sous quota ?</text>

<line x1="250" y1="288" x2="250" y2="308" stroke="#0f766e" stroke-width="2.5" marker-end="url(#fl)"/>

<rect x="210" y="312" width="560" height="62" rx="8" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<circle cx="240" cy="343" r="17" fill="#0f766e"/>
<text class="nu" x="240" y="349" text-anchor="middle">4</text>
<text class="q" x="272" y="349">Une alternative bas PRP ou naturelle est-elle possible ici ?</text>

<rect x="30" y="392" width="820" height="52" rx="8" fill="#fdf1ed" stroke="#e8b9a8" stroke-width="1.5"/>
<text class="co" x="48" y="414">Le frigoriste n'est plus seulement un poseur : il conseille le client sur la trajectoire de son parc.</text>
<text class="lg" x="48" y="434">C'est une compétence commerciale autant que technique.</text>
</svg>
