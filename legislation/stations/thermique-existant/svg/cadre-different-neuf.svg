<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-cd" aria-describedby="d-cd" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-cd">Rénover obéit à un cadre différent de celui du neuf</title>
  <desc id="d-cd">Un point de départ « bâtiment » se sépare en deux chemins. Le chemin du haut
    mène à une carte « bâtiment neuf, RE2020 », déjà vue dans une autre station. Le chemin du bas
    mène à une carte « bâtiment existant, RT existant », le sujet de cette station : un cadre
    différent, pensé pour rénover plutôt que pour construire.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl { font-size:15px; fill:#5a6b7d; }
    .neuf{ font-size:14px; fill:#5a6b7d; }
  </style>

  <rect x="20" y="140" width="150" height="60" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="ttl" x="95" y="176" text-anchor="middle" font-size="16">Un bâtiment</text>

  <path d="M 175 155 C 300 90, 400 90, 480 100" fill="none" stroke="#98a6b3" stroke-width="3"/>
  <polygon points="480,100 462,93 465,109" fill="#98a6b3"/>

  <path d="M 175 185 C 300 250, 400 250, 480 240" fill="none" stroke="#92400e" stroke-width="3.5"/>
  <polygon points="480,240 462,233 465,249" fill="#92400e"/>

  <rect x="490" y="55" width="360" height="90" rx="14" fill="#eef1f4" stroke="#98a6b3" stroke-width="2.5"/>
  <text class="ttl" x="670" y="90" text-anchor="middle" fill="#5a6b7d">Bâtiment neuf</text>
  <text class="neuf" x="670" y="115" text-anchor="middle">RE2020 — vu dans une autre station</text>

  <rect x="490" y="195" width="360" height="100" rx="14" fill="#fff4e0" stroke="#92400e" stroke-width="3.5"/>
  <text class="ttl" x="670" y="230" text-anchor="middle" fill="#92400e">Bâtiment existant</text>
  <text class="lbl" x="670" y="255" text-anchor="middle" fill="#92400e" font-weight="bold">RT existant — le sujet de cette station</text>
  <text class="neuf" x="670" y="278" text-anchor="middle">un cadre pensé pour rénover, pas pour construire</text>
</svg>
