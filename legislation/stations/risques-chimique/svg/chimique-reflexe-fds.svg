<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-5" aria-describedby="d-5" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-5">C'est la FDS qui répond, pas la mémoire</title>
  <desc id="d-5">Un bidon schématique, sans étiquette lisible, porte un grand point d'interrogation. Une
    flèche part de ce point d'interrogation vers une fiche de données de sécurité posée à côté, seule
    source qui répond réellement à la question du danger.</desc>
  <style>
    .lbl{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .fleche{ stroke:#5a6b7d; stroke-width:3; fill:none; }
  </style>

  <!-- Bidon -->
  <rect x="120" y="140" width="130" height="150" rx="10" fill="#dbeafe" stroke="#1b3a63" stroke-width="2.5"/>
  <rect x="158" y="108" width="54" height="32" rx="6" fill="#dbeafe" stroke="#1b3a63" stroke-width="2.5"/>
  <text x="185" y="95" text-anchor="middle" font-family="'Trebuchet MS',Calibri,sans-serif" font-weight="bold" font-size="40" fill="#c2410c">?</text>

  <path class="fleche" d="M260 200 Q400 150 520 170" marker-end="url(#f5)"/>
  <defs>
    <marker id="f5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5a6b7d"/>
    </marker>
  </defs>

  <!-- FDS -->
  <rect x="540" y="70" width="300" height="220" rx="14" fill="#fffdf8" stroke="#1e7e54" stroke-width="3"/>
  <text class="lbl" x="690" y="110" text-anchor="middle">Fiche de données</text>
  <text class="lbl" x="690" y="132" text-anchor="middle">de sécurité</text>
  <line x1="580" y1="160" x2="800" y2="160" stroke="#d6dee7" stroke-width="2"/>
  <line x1="580" y1="185" x2="800" y2="185" stroke="#d6dee7" stroke-width="2"/>
  <line x1="580" y1="210" x2="760" y2="210" stroke="#d6dee7" stroke-width="2"/>
  <circle cx="690" cy="250" r="18" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/>
  <path d="M681 250 l6 7 l14 -16" fill="none" stroke="#1e7e54" stroke-width="3.5" stroke-linecap="round"/>
</svg>
