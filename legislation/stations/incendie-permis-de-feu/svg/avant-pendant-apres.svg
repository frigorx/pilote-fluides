<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pf5" aria-describedby="d-pf5" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pf5">Les mesures du permis de feu : avant, pendant, après</title>
  <desc id="d-pf5">Trois colonnes. Avant : éloigner les combustibles de 10 mètres au moins ou les couvrir, extincteurs à portée de main, bouteilles de gaz loin de la zone de brasage, détection d'incendie évitée sur la zone, alerte prévue avec un téléphone et le 18. Pendant : un surveillant formé qui ne fait que surveiller, protections portées, projections surveillées, objets chauds posés sur des supports qui résistent. Après : inspecter le lieu et les locaux voisins, remettre la détection en service, surveiller 2 heures au moins, archiver le permis, 5 ans conseillés. En bas, une barre qui grandit représente la surveillance après les travaux : deux heures au moins.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#b91c1c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-pf5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<g><rect x="15" y="20" width="246" height="326" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><rect x="15" y="20" width="246" height="42" rx="12" fill="#1b3a63"/><rect x="15" y="44" width="246" height="18" fill="#1b3a63"/><text class="wht" x="138" y="50" text-anchor="middle"><tspan x="138" dy="0">AVANT</tspan></text><text class="txt" x="31" y="90" text-anchor="start"><tspan x="31" dy="0">éloigner les combustibles</tspan><tspan x="31" dy="21">(10 m au moins) ou les couvrir</tspan></text><text class="txt" x="31" y="142" text-anchor="start"><tspan x="31" dy="0">extincteurs</tspan><tspan x="31" dy="21">à portée de main</tspan></text><text class="txt" x="31" y="194" text-anchor="start"><tspan x="31" dy="0">bouteilles de gaz</tspan><tspan x="31" dy="21">loin de la zone de brasage</tspan></text><text class="txt" x="31" y="246" text-anchor="start"><tspan x="31" dy="0">détection d’incendie</tspan><tspan x="31" dy="21">évitée sur la zone</tspan></text><text class="txt" x="31" y="298" text-anchor="start"><tspan x="31" dy="0">alerte prévue :</tspan><tspan x="31" dy="21">téléphone, le 18</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.040;0.110;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="277" y="20" width="246" height="326" rx="12" fill="#fff" stroke="#e8914a" stroke-width="3"/><rect x="277" y="20" width="246" height="42" rx="12" fill="#e8914a"/><rect x="277" y="44" width="246" height="18" fill="#e8914a"/><text class="wht" x="400" y="50" text-anchor="middle"><tspan x="400" dy="0">PENDANT</tspan></text><text class="txt" x="293" y="90" text-anchor="start"><tspan x="293" dy="0">un surveillant formé,</tspan><tspan x="293" dy="21">qui ne fait que surveiller</tspan></text><text class="txt" x="293" y="142" text-anchor="start"><tspan x="293" dy="0">protections portées</tspan><tspan x="293" dy="21">(lunettes, gants, tablier)</tspan></text><text class="txt" x="293" y="194" text-anchor="start"><tspan x="293" dy="0">projections surveillées</tspan><tspan x="293" dy="21">et points de chute</tspan></text><text class="txt" x="293" y="246" text-anchor="start"><tspan x="293" dy="0">objets chauds sur des</tspan><tspan x="293" dy="21">supports qui résistent</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.180;0.250;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="539" y="20" width="246" height="326" rx="12" fill="#fff" stroke="#1e7e54" stroke-width="3"/><rect x="539" y="20" width="246" height="42" rx="12" fill="#1e7e54"/><rect x="539" y="44" width="246" height="18" fill="#1e7e54"/><text class="wht" x="662" y="50" text-anchor="middle"><tspan x="662" dy="0">APRÈS</tspan></text><text class="txt" x="555" y="90" text-anchor="start"><tspan x="555" dy="0">inspecter le lieu,</tspan><tspan x="555" dy="21">les locaux voisins</tspan></text><text class="txt" x="555" y="142" text-anchor="start"><tspan x="555" dy="0">détection remise</tspan><tspan x="555" dy="21">en service</tspan></text><text class="txt" x="555" y="194" text-anchor="start"><tspan x="555" dy="0">surveiller 2 h</tspan><tspan x="555" dy="21">au moins</tspan></text><text class="txt" x="555" y="246" text-anchor="start"><tspan x="555" dy="0">archiver le permis</tspan><tspan x="555" dy="21">(5 ans conseillés)</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.320;0.390;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="15" y="364" width="770" height="122" rx="14" fill="#f7e2de" stroke="#b91c1c" stroke-width="3"/><g transform="translate(60 425) scale(1.3)"><circle cx="0" cy="0" r="17" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M0,-10 V0 L8,5" fill="none" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nomc" x="110" y="400" text-anchor="start"><tspan x="110" dy="0">La surveillance après les travaux : 2 heures au moins</tspan></text><rect x="110" y="418" width="640" height="26" rx="13" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="112" y="420" width="636" height="22" rx="6" fill="#b91c1c"><animate attributeName="width" values="0;0;636;636" keyTimes="0;0.550;0.850;1" dur="12s" repeatCount="indefinite"/></rect><text class="txt" x="110" y="470" text-anchor="start"><tspan x="110" dy="0">Un feu peut couver, puis se déclarer longtemps après l'arrêt du chalumeau.</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.560;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
