<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pf1" aria-describedby="d-pf1" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pf1">Le triangle du feu et le point chaud</title>
  <desc id="d-pf1">À gauche, un triangle dont les trois côtés se tracent l'un après l'autre : le combustible (ce qui brûle), le comburant (l'oxygène de l'air) et la source d'énergie (une flamme ou une étincelle, avec un chalumeau). Une flamme apparaît au centre quand les trois sont réunis. À droite, trois cartes : « 30 % des incendies en entreprise viennent de travaux par points chauds » (source INRS) ; « retirez un seul côté : le feu ne part pas » ; « il n'y a pas de petits travaux ». Une bande rouge en bas : le permis de feu prépare le travail, le contrôle, puis le surveille.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#b91c1c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-pf1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<g><path d="M240,76 L110,300" stroke="#5a6b7d" stroke-width="10" stroke-linecap="round" fill="none"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.050;0.130;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M110,300 L370,300" stroke="#1b3a63" stroke-width="10" stroke-linecap="round" fill="none"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.180;0.260;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M370,300 L240,76" stroke="#e8914a" stroke-width="10" stroke-linecap="round" fill="none"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.310;0.390;1" dur="12s" repeatCount="indefinite"/></g><g><text class="nom" x="240" y="44" text-anchor="middle"><tspan x="240" dy="0">Combustible</tspan></text><text class="mut" x="240" y="64" text-anchor="middle"><tspan x="240" dy="0">(ce qui brûle)</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.050;0.120;1" dur="12s" repeatCount="indefinite"/></g><g><text class="nom" x="110" y="340" text-anchor="middle"><tspan x="110" dy="0">Comburant</tspan><tspan x="110" dy="22">(l'oxygène de l'air)</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.180;0.240;1" dur="12s" repeatCount="indefinite"/></g><g><text class="nomo" x="370" y="340" text-anchor="middle"><tspan x="370" dy="0">Source d'énergie</tspan><tspan x="370" dy="22">(flamme, étincelle)</tspan></text><g transform="translate(410 262) scale(1.1)"><path d="M-18,12 L4,-6" stroke="#1b3a63" stroke-width="7" stroke-linecap="round"/><path d="M4,-6 L12,-12" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M16,-18 C20,-10 24,-8 22,-2 A6,6 0 0 1 12,-4 C11,-9 15,-11 16,-18 z" fill="#e8914a" stroke="#9a4d0c" stroke-width="2"/></g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.310;0.370;1" dur="12s" repeatCount="indefinite"/></g><g><g transform="translate(240 215) scale(2.2)"><path d="M0,-22 C9,-10 15,-3 13,8 A13,13 0 0 1 -13,8 C-15,-1 -6,-8 0,-22 z" fill="#e8914a" stroke="#9a4d0c" stroke-width="2.5" stroke-linejoin="round"/><path d="M0,0 C5,5 7,9 5,13 A6,6 0 0 1 -5,13 C-6,8 -2,5 0,0 z" fill="#fdf1e6"/></g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.460;0.520;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="460" y="30" width="320" height="150" rx="14" fill="#fff" stroke="#b91c1c" stroke-width="3"/><text class="nomc" style="font-size:44px" x="535" y="112" text-anchor="middle"><tspan x="535" dy="0">30 %</tspan></text><text class="txt" x="665" y="84" text-anchor="middle"><tspan x="665" dy="0">des incendies en</tspan><tspan x="665" dy="22">entreprise viennent</tspan><tspan x="665" dy="22">de travaux par</tspan><tspan x="665" dy="22">points chauds</tspan></text><text class="mut" x="620" y="168" text-anchor="middle"><tspan x="620" dy="0">(source : INRS)</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.560;0.630;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="460" y="196" width="320" height="96" rx="14" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><g transform="translate(500 244) scale(1.1)"><circle cx="0" cy="0" r="16" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2.5"/><path d="M-8,0 l6,7 l11,-13" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text class="nom" x="640" y="236" text-anchor="middle"><tspan x="640" dy="0">Retirez un seul côté :</tspan><tspan x="640" dy="24">le feu ne part pas.</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.680;0.750;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="460" y="308" width="320" height="96" rx="14" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><g transform="translate(500 356)"><path d="M-18,12 L4,-6" stroke="#1b3a63" stroke-width="7" stroke-linecap="round"/><path d="M4,-6 L12,-12" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M16,-18 C20,-10 24,-8 22,-2 A6,6 0 0 1 12,-4 C11,-9 15,-11 16,-18 z" fill="#e8914a" stroke="#9a4d0c" stroke-width="2"/></g><text class="nomo" x="640" y="348" text-anchor="middle"><tspan x="640" dy="0">Il n’y a pas de</tspan><tspan x="640" dy="24">« petits travaux ».</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.780;0.850;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="20" y="424" width="760" height="62" rx="12" fill="#f7e2de" stroke="#b91c1c" stroke-width="2.5"/><text class="nom" x="400" y="462" text-anchor="middle"><tspan x="400" dy="0">Le permis de feu prépare le travail, le contrôle, puis le surveille.</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.860;0.920;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
