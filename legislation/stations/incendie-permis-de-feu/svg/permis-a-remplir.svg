<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pf7" aria-describedby="d-pf7" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pf7">Le permis à remplir, bloc par bloc</title>
  <desc id="d-pf7">Sept lignes numérotées, chacune avec une case à cocher : un, qui signe ; deux, où et quand ; trois, quels travaux ; quatre, quels risques sur place ; cinq, quelles mesures avant ; six, qui surveille, et jusqu'à quand ; sept, comment alerter. Dans l'animation, les lignes apparaissent puis se cochent l'une après l'autre. Le dessin ne donne aucune réponse : elles sont à trouver dans le simulateur.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#b91c1c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-pf7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<text class="ttl" x="400" y="30" text-anchor="middle"><tspan x="400" dy="0">Le permis, bloc par bloc</tspan></text><g><rect x="60" y="48" width="680" height="52" rx="10" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/><circle cx="96" cy="74" r="19" fill="#b91c1c"/><text class="wht" x="96" y="81" text-anchor="middle"><tspan x="96" dy="0">1</tspan></text><text class="nom" style="font-size:19px" x="135" y="81" text-anchor="start"><tspan x="135" dy="0">Qui signe ?</tspan></text><rect x="660" y="58" width="32" height="32" rx="6" fill="#fff" stroke="#10233c" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.050;0.110;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M666,75 l8,9 l14,-17" fill="none" stroke="#1e7e54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.100;0.150;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="60" y="110" width="680" height="52" rx="10" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/><circle cx="96" cy="136" r="19" fill="#b91c1c"/><text class="wht" x="96" y="143" text-anchor="middle"><tspan x="96" dy="0">2</tspan></text><text class="nom" style="font-size:19px" x="135" y="143" text-anchor="start"><tspan x="135" dy="0">Où et quand ?</tspan></text><rect x="660" y="120" width="32" height="32" rx="6" fill="#fff" stroke="#10233c" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.150;0.210;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M666,137 l8,9 l14,-17" fill="none" stroke="#1e7e54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.200;0.250;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="60" y="172" width="680" height="52" rx="10" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/><circle cx="96" cy="198" r="19" fill="#b91c1c"/><text class="wht" x="96" y="205" text-anchor="middle"><tspan x="96" dy="0">3</tspan></text><text class="nom" style="font-size:19px" x="135" y="205" text-anchor="start"><tspan x="135" dy="0">Quels travaux ?</tspan></text><rect x="660" y="182" width="32" height="32" rx="6" fill="#fff" stroke="#10233c" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.310;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M666,199 l8,9 l14,-17" fill="none" stroke="#1e7e54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.300;0.350;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="60" y="234" width="680" height="52" rx="10" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/><circle cx="96" cy="260" r="19" fill="#b91c1c"/><text class="wht" x="96" y="267" text-anchor="middle"><tspan x="96" dy="0">4</tspan></text><text class="nom" style="font-size:19px" x="135" y="267" text-anchor="start"><tspan x="135" dy="0">Quels risques sur place ?</tspan></text><rect x="660" y="244" width="32" height="32" rx="6" fill="#fff" stroke="#10233c" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.350;0.410;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M666,261 l8,9 l14,-17" fill="none" stroke="#1e7e54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.400;0.450;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="60" y="296" width="680" height="52" rx="10" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/><circle cx="96" cy="322" r="19" fill="#b91c1c"/><text class="wht" x="96" y="329" text-anchor="middle"><tspan x="96" dy="0">5</tspan></text><text class="nom" style="font-size:19px" x="135" y="329" text-anchor="start"><tspan x="135" dy="0">Quelles mesures avant ?</tspan></text><rect x="660" y="306" width="32" height="32" rx="6" fill="#fff" stroke="#10233c" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.450;0.510;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M666,323 l8,9 l14,-17" fill="none" stroke="#1e7e54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.550;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="60" y="358" width="680" height="52" rx="10" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/><circle cx="96" cy="384" r="19" fill="#b91c1c"/><text class="wht" x="96" y="391" text-anchor="middle"><tspan x="96" dy="0">6</tspan></text><text class="nom" style="font-size:19px" x="135" y="391" text-anchor="start"><tspan x="135" dy="0">Qui surveille, et jusqu’à quand ?</tspan></text><rect x="660" y="368" width="32" height="32" rx="6" fill="#fff" stroke="#10233c" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.550;0.610;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M666,385 l8,9 l14,-17" fill="none" stroke="#1e7e54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.600;0.650;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="60" y="420" width="680" height="52" rx="10" fill="#fff" stroke="#1b3a63" stroke-width="2.5"/><circle cx="96" cy="446" r="19" fill="#b91c1c"/><text class="wht" x="96" y="453" text-anchor="middle"><tspan x="96" dy="0">7</tspan></text><text class="nom" style="font-size:19px" x="135" y="453" text-anchor="start"><tspan x="135" dy="0">Comment alerter ?</tspan></text><rect x="660" y="430" width="32" height="32" rx="6" fill="#fff" stroke="#10233c" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.650;0.710;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M666,447 l8,9 l14,-17" fill="none" stroke="#1e7e54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.700;0.750;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
