<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pf3" aria-describedby="d-pf3" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pf3">Qui délivre et qui signe le permis de feu</title>
  <desc id="d-pf3">À gauche, l'entreprise utilisatrice, celle qui accueille les travaux, avec trois personnes, chacune cochée : l'employeur ou son représentant, qui établit le permis ; le superviseur des travaux ; le chargé de sécurité, qui met en place les mesures. À droite, l'entreprise intervenante, celle qui fait les travaux : le responsable d'intervention, coché, qui valide le permis, et le technicien qui brase, coché lui aussi, qui connaît les mesures. Cinq coches en tout ; dans un petit restaurant, cela fait trois signatures. En bas, une bande rouge : le surveillant de sécurité, formé à la première intervention contre l'incendie, surveille et ne brase pas.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#b91c1c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-pf3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<g><text class="ttl" x="400" y="30" text-anchor="middle"><tspan x="400" dy="0">Qui signe le permis de feu ?</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.020;0.060;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="15" y="46" width="378" height="300" rx="14" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text class="nom" style="font-size:17px" x="204" y="78" text-anchor="middle"><tspan x="204" dy="0">Entreprise utilisatrice</tspan><tspan x="204" dy="22">(celle qui accueille les travaux)</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.030;0.090;1" dur="12s" repeatCount="indefinite"/></g><g><circle cx="52" cy="148" r="24" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(52 148) scale(0.7)"><circle cx="0" cy="-8" r="7" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-10,-11 a10,10 0 0 1 20,0 z" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-13" y="-12" width="26" height="3" rx="1.5" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-15,19 v-3 a15,12 0 0 1 30,0 v3 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:16px" x="88" y="144" text-anchor="start"><tspan x="88" dy="0">Employeur ou représentant</tspan></text><text class="txt" x="88" y="168" text-anchor="start"><tspan x="88" dy="0">il établit le permis</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.120;0.170;1" dur="12s" repeatCount="indefinite"/></g><g><circle cx="52" cy="222" r="24" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(52 222) scale(0.7)"><circle cx="0" cy="-10" r="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-15,18 v-3 a15,12 0 0 1 30,0 v3 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:16px" x="88" y="218" text-anchor="start"><tspan x="88" dy="0">Superviseur des travaux</tspan></text><text class="txt" x="88" y="242" text-anchor="start"><tspan x="88" dy="0">il suit le travail</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.190;0.240;1" dur="12s" repeatCount="indefinite"/></g><g><circle cx="52" cy="296" r="24" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(52 296) scale(0.7)"><circle cx="0" cy="-8" r="7" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-10,-11 a10,10 0 0 1 20,0 z" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-13" y="-12" width="26" height="3" rx="1.5" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-15,19 v-3 a15,12 0 0 1 30,0 v3 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:16px" x="88" y="292" text-anchor="start"><tspan x="88" dy="0">Chargé de sécurité</tspan></text><text class="txt" x="88" y="316" text-anchor="start"><tspan x="88" dy="0">il met en place les mesures</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.260;0.310;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="407" y="46" width="378" height="300" rx="14" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="nomo" style="font-size:17px" x="596" y="78" text-anchor="middle"><tspan x="596" dy="0">Entreprise intervenante</tspan><tspan x="596" dy="22">(celle qui fait les travaux)</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.030;0.090;1" dur="12s" repeatCount="indefinite"/></g><g><circle cx="446" cy="148" r="24" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(446 148) scale(0.7)"><circle cx="0" cy="-8" r="7" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-10,-11 a10,10 0 0 1 20,0 z" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-13" y="-12" width="26" height="3" rx="1.5" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-15,19 v-3 a15,12 0 0 1 30,0 v3 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nomo" style="font-size:16px" x="482" y="144" text-anchor="start"><tspan x="482" dy="0">Responsable d'intervention</tspan></text><text class="txt" x="482" y="168" text-anchor="start"><tspan x="482" dy="0">il valide le permis</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.120;0.170;1" dur="12s" repeatCount="indefinite"/></g><g><circle cx="446" cy="222" r="24" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(446 222) scale(0.7)"><path d="M-18,12 L4,-6" stroke="#1b3a63" stroke-width="7" stroke-linecap="round"/><path d="M4,-6 L12,-12" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M16,-18 C20,-10 24,-8 22,-2 A6,6 0 0 1 12,-4 C11,-9 15,-11 16,-18 z" fill="#e8914a" stroke="#9a4d0c" stroke-width="2"/></g><text class="nomo" style="font-size:16px" x="482" y="218" text-anchor="start"><tspan x="482" dy="0">Technicien qui brase</tspan></text><text class="txt" x="482" y="242" text-anchor="start"><tspan x="482" dy="0">il connaît les mesures</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.190;0.240;1" dur="12s" repeatCount="indefinite"/></g><g><g transform="translate(362 148) scale(0.85)"><circle cx="0" cy="0" r="16" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2.5"/><path d="M-8,0 l6,7 l11,-13" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.360;0.410;1" dur="12s" repeatCount="indefinite"/></g><g><g transform="translate(362 222) scale(0.85)"><circle cx="0" cy="0" r="16" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2.5"/><path d="M-8,0 l6,7 l11,-13" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.420;0.470;1" dur="12s" repeatCount="indefinite"/></g><g><g transform="translate(362 296) scale(0.85)"><circle cx="0" cy="0" r="16" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2.5"/><path d="M-8,0 l6,7 l11,-13" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.480;0.530;1" dur="12s" repeatCount="indefinite"/></g><g><g transform="translate(756 148) scale(0.85)"><circle cx="0" cy="0" r="16" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2.5"/><path d="M-8,0 l6,7 l11,-13" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.540;0.590;1" dur="12s" repeatCount="indefinite"/></g><g><g transform="translate(756 222) scale(0.85)"><circle cx="0" cy="0" r="16" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2.5"/><path d="M-8,0 l6,7 l11,-13" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.600;0.650;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="15" y="360" width="770" height="124" rx="14" fill="#f7e2de" stroke="#b91c1c" stroke-width="3"/><g transform="translate(66 424) scale(1.3)"><rect x="-9" y="-6" width="18" height="28" rx="6" fill="#fbe7e4" stroke="#c0392b" stroke-width="2.5"/><rect x="-4" y="-13" width="8" height="7" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M4,-11 h9 l5,7" fill="none" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-9,4 h18" stroke="#c0392b" stroke-width="2.5"/></g><text class="nomc" x="110" y="396" text-anchor="start"><tspan x="110" dy="0">Le surveillant de sécurité</tspan></text><text class="txt" x="110" y="422" text-anchor="start"><tspan x="110" dy="0">Une personne formée à la première intervention contre l'incendie.</tspan><tspan x="110" dy="24">Il surveille, il ne brase pas. Il peut venir de l’une ou l’autre entreprise.</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.680;0.740;1" dur="12s" repeatCount="indefinite"/></g>
