<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pf8" aria-describedby="d-pf8" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pf8">Le parcours du permis de feu, en six temps</title>
  <desc id="d-pf8">Six cartes en deux rangées de trois : un, remplir le permis, bloc par bloc ; deux, le signer avec les bonnes personnes ; trois, l'afficher près du lieu de travail ; quatre, braser avec le surveillant ; cinq, surveiller deux heures au moins ; six, archiver, cinq ans conseillés. En bas, une bande rouge : pas de permis signé, pas de chalumeau ; si le lieu, la méthode, les travaux ou la personne qui brase changent, on revoit le permis.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#b91c1c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-pf8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<!-- 1 : Remplir -->
<rect x="20" y="24" width="236" height="140" rx="14" fill="#fff" stroke="#1b3a63" stroke-width="3"/><circle cx="56" cy="58" r="18" fill="#b91c1c"/><text class="wht" x="56" y="65" text-anchor="middle"><tspan x="56" dy="0">1</tspan></text><g transform="translate(210 64) scale(1.1)"><path d="M-13,-19 h17 l10,10 v28 h-27 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M4,-19 v10 h10" fill="none" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-7,0 h14 M-7,7 h14 M-7,14 h8" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:20px" x="138" y="116" text-anchor="middle"><tspan x="138" dy="0">Remplir</tspan></text><text class="txt" x="138" y="142" text-anchor="middle"><tspan x="138" dy="0">le permis, bloc par bloc</tspan></text>
<path d="M258,94 l12,8 l-12,8 z" fill="#5a6b7d"/>
<!-- 2 : Signer -->
<rect x="282" y="24" width="236" height="140" rx="14" fill="#fff" stroke="#1b3a63" stroke-width="3"/><circle cx="318" cy="58" r="18" fill="#b91c1c"/><text class="wht" x="318" y="65" text-anchor="middle"><tspan x="318" dy="0">2</tspan></text><g transform="translate(472 64) scale(1.1)"><path d="M-14,16 L-10,6 L10,-14 L16,-8 L-4,12 z" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-14,16 L-10,6 L-4,12 z" fill="#1b3a63"/></g><text class="nom" style="font-size:20px" x="400" y="116" text-anchor="middle"><tspan x="400" dy="0">Signer</tspan></text><text class="txt" x="400" y="142" text-anchor="middle"><tspan x="400" dy="0">les bonnes personnes</tspan></text>
<path d="M520,94 l12,8 l-12,8 z" fill="#5a6b7d"/>
<!-- 3 : Afficher -->
<rect x="544" y="24" width="236" height="140" rx="14" fill="#fff" stroke="#1b3a63" stroke-width="3"/><circle cx="580" cy="58" r="18" fill="#b91c1c"/><text class="wht" x="580" y="65" text-anchor="middle"><tspan x="580" dy="0">3</tspan></text><g transform="translate(734 64) scale(1.1)"><path d="M-20,16 V-12 h14 l4,5 h22 V16 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-20,-2 h40" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:20px" x="662" y="116" text-anchor="middle"><tspan x="662" dy="0">Afficher</tspan></text><text class="txt" x="662" y="142" text-anchor="middle"><tspan x="662" dy="0">près du lieu de travail</tspan></text>
<!-- 4 : Braser -->
<rect x="20" y="194" width="236" height="140" rx="14" fill="#fff" stroke="#e8914a" stroke-width="3"/><circle cx="56" cy="228" r="18" fill="#b91c1c"/><text class="wht" x="56" y="235" text-anchor="middle"><tspan x="56" dy="0">4</tspan></text><g transform="translate(210 234) scale(1.1)"><path d="M-18,12 L4,-6" stroke="#1b3a63" stroke-width="7" stroke-linecap="round"/><path d="M4,-6 L12,-12" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M16,-18 C20,-10 24,-8 22,-2 A6,6 0 0 1 12,-4 C11,-9 15,-11 16,-18 z" fill="#e8914a" stroke="#9a4d0c" stroke-width="2"/></g><text class="nom" style="font-size:20px" x="138" y="286" text-anchor="middle"><tspan x="138" dy="0">Braser</tspan></text><text class="txt" x="138" y="312" text-anchor="middle"><tspan x="138" dy="0">avec le surveillant</tspan></text>
<path d="M258,264 l12,8 l-12,8 z" fill="#5a6b7d"/>
<!-- 5 : Surveiller -->
<rect x="282" y="194" width="236" height="140" rx="14" fill="#fff" stroke="#1b3a63" stroke-width="3"/><circle cx="318" cy="228" r="18" fill="#b91c1c"/><text class="wht" x="318" y="235" text-anchor="middle"><tspan x="318" dy="0">5</tspan></text><g transform="translate(472 234) scale(1.1)"><circle cx="0" cy="0" r="17" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M0,-10 V0 L8,5" fill="none" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:20px" x="400" y="286" text-anchor="middle"><tspan x="400" dy="0">Surveiller</tspan></text><text class="txt" x="400" y="312" text-anchor="middle"><tspan x="400" dy="0">2 heures au moins</tspan></text>
<path d="M520,264 l12,8 l-12,8 z" fill="#5a6b7d"/>
<!-- 6 : Archiver -->
<rect x="544" y="194" width="236" height="140" rx="14" fill="#fff" stroke="#1b3a63" stroke-width="3"/><circle cx="580" cy="228" r="18" fill="#b91c1c"/><text class="wht" x="580" y="235" text-anchor="middle"><tspan x="580" dy="0">6</tspan></text><g transform="translate(734 234) scale(1.1)"><rect x="-14" y="6" width="28" height="9" rx="2" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-6,6 V-2 a6,6 0 1 1 12,0 V6" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:20px" x="662" y="286" text-anchor="middle"><tspan x="662" dy="0">Archiver</tspan></text><text class="txt" x="662" y="312" text-anchor="middle"><tspan x="662" dy="0">5 ans conseillés</tspan></text>
<!-- 7 : la règle d'or -->
<rect x="20" y="372" width="760" height="112" rx="14" fill="#f7e2de" stroke="#b91c1c" stroke-width="3"/><g transform="translate(80 428) scale(1.3)"><path d="M0,-22 C9,-10 15,-3 13,8 A13,13 0 0 1 -13,8 C-15,-1 -6,-8 0,-22 z" fill="#e8914a" stroke="#9a4d0c" stroke-width="2.5" stroke-linejoin="round"/><path d="M0,0 C5,5 7,9 5,13 A6,6 0 0 1 -5,13 C-6,8 -2,5 0,0 z" fill="#fdf1e6"/></g><text class="nomc" style="font-size:24px" x="440" y="410" text-anchor="middle"><tspan x="440" dy="0">Pas de permis signé, pas de chalumeau.</tspan></text><text class="txt" x="440" y="444" text-anchor="middle"><tspan x="440" dy="0">Si le lieu, la méthode, les travaux ou la personne</tspan><tspan x="440" dy="22">qui brase changent : on revoit le permis.</tspan></text>
</svg>
