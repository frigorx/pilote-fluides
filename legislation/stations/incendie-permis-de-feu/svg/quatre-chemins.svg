e" stroke="#e8914a" stroke-width="3" marker-end="url(#fl-pf2)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.520;0.580;1" dur="12s" repeatCount="indefinite"/></g><g><circle cx="95" cy="236" r="16" fill="#b91c1c"/><text class="wht" x="95" y="242" text-anchor="middle"><tspan x="95" dy="0">4</tspan></text><path d="M150,214 L130,262" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 5" fill="none"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.660;0.720;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="20" y="346" width="184" height="140" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2.5"/><text class="nomc" style="font-size:17px" x="112" y="376" text-anchor="middle"><tspan x="112" dy="0">1 · Étincelles</tspan></text><text class="txt" x="112" y="406" text-anchor="middle"><tspan x="112" dy="0">gouttes de métal à</tspan><tspan x="112" dy="22">1 000-2 000 °C,</tspan><tspan x="112" dy="22">projetées à</tspan><tspan x="112" dy="22">plusieurs mètres</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.780;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="212" y="346" width="184" height="140" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2.5"/><text class="nomc" style="font-size:17px" x="304" y="376" text-anchor="middle"><tspan x="304" dy="0">2 · Conduction</tspan></text><text class="txt" x="304" y="406" text-anchor="middle"><tspan x="304" dy="0">la chaleur suit</tspan><tspan x="304" dy="22">le tube jusque dans</tspan><tspan x="304" dy="22">la pièce voisine</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.790;0.830;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="404" y="346" width="184" height="140" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2.5"/><text class="nomc" style="font-size:17px" x="496" y="376" text-anchor="middle"><tspan x="496" dy="0">3 · Gaz chauds</tspan></text><text class="txt" x="496" y="406" text-anchor="middle"><tspan x="496" dy="0">ils montent et</tspan><tspan x="496" dy="22">gagnent les niveaux</tspan><tspan x="496" dy="22">du dessus</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.840;0.880;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="596" y="346" width="184" height="140" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2.5"/><text class="nomc" style="font-size:17px" x="688" y="376" text-anchor="middle"><tspan x="688" dy="0">4 · Contact</tspan></text><text class="txt" x="688" y="406" text-anchor="middle"><tspan x="688" dy="0">ce qui est près de</tspan><tspan x="688" dy="22">la flamme et mal</tspan><tspan x="688" dy="22">protégé s’enflamme</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.890;0.930;1" dur="12s" repeatCount="indefinite"/></g>
