<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pf2" aria-describedby="d-pf2" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pf2">Les quatre chemins du feu pendant un brasage</title>
  <desc id="d-pf2">Une scène : un chalumeau chauffe un tube de cuivre qui traverse un mur entre le local de travail et une pièce voisine. Quatre repères numérotés : un, les étincelles, des gouttes de métal à 1 000 à 2 000 degrés projetées à plusieurs mètres vers des cartons au sol ; deux, la conduction, la chaleur qui suit le tube jusque dans la pièce voisine où d'autres cartons sont stockés ; trois, les gaz chauds qui montent vers le haut ; quatre, le contact avec ce qui est près de la flamme et mal protégé. Quatre cartes en bas reprennent ces quatre chemins. Dans l'animation, des points suivent chaque chemin.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#b91c1c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
