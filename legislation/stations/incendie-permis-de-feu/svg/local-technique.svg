<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pf6" aria-describedby="d-pf6" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pf6">Le local technique de la chambre froide</title>
  <desc id="d-pf6">Une coupe du local technique. À gauche, la chambre froide. Un tube de cuivre en sort vers la droite et se termine par un raccord à braser, entouré d'orange, avec un chalumeau à côté. À trois mètres du raccord, une double flèche marquée « 3 m » mène à une pile de cartons. Au plafond, un détecteur de fumée. Entre le raccord et la porte de la cuisine, qui reste en service, se tient Marc, le surveillant. Une bande en bas rappelle : brasage fort d'un raccord de cuivre, mardi de 8 h à 11 h, le circuit est déjà vidé de son fluide.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#b91c1c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-pf6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<!-- 1 : le local et la chambre froide -->
<rect x="20" y="20" width="760" height="360" rx="10" fill="#f7f4ee" stroke="#5a6b7d" stroke-width="3"/><rect x="20" y="340" width="760" height="40" fill="#e2e8ee"/><rect x="40" y="60" width="150" height="280" fill="#cbd5df" stroke="#5a6b7d" stroke-width="3"/><g transform="translate(115 110) scale(1.4)"><path d="M0,-18 V18 M-16,-9 L16,9 M16,-9 L-16,9" fill="none" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="0" cy="0" r="3" fill="#1b3a63"/></g><text class="nom" x="115" y="170" text-anchor="middle"><tspan x="115" dy="0">Chambre</tspan><tspan x="115" dy="22">froide</tspan></text>
<!-- 2 : le tube et le raccord à braser -->
<rect x="190" y="228" width="190" height="14" rx="4" fill="#e8c9a0" stroke="#9a4d0c" stroke-width="2.5"/><circle cx="380" cy="235" r="20" fill="none" stroke="#e8914a" stroke-width="4"/><g transform="translate(430 200) scale(1.4)"><path d="M-18,12 L4,-6" stroke="#1b3a63" stroke-width="7" stroke-linecap="round"/><path d="M4,-6 L12,-12" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M16,-18 C20,-10 24,-8 22,-2 A6,6 0 0 1 12,-4 C11,-9 15,-11 16,-18 z" fill="#e8914a" stroke="#9a4d0c" stroke-width="2"/></g><text class="nomo" x="380" y="280" text-anchor="middle"><tspan x="380" dy="0">raccord</tspan><tspan x="380" dy="22">à braser</tspan></text>
<!-- 3 : les cartons à 3 m -->
<rect x="540" y="290" width="70" height="50" fill="#e8c9a0" stroke="#9a4d0c" stroke-width="2.5"/><rect x="615" y="304" width="58" height="36" fill="#e8c9a0" stroke="#9a4d0c" stroke-width="2.5"/><text class="nom" x="606" y="366" text-anchor="middle"><tspan x="606" dy="0">Cartons</tspan></text><path d="M392,364 H538 M392,354 V374 M538,354 V374" stroke="#b91c1c" stroke-width="3" fill="none"/><text class="nomc" x="465" y="352" text-anchor="middle"><tspan x="465" dy="0">3 m</tspan></text>
<!-- 4 : le détecteur de fumée -->
<circle cx="300" cy="48" r="14" fill="#fff" stroke="#1b3a63" stroke-width="3"/><circle cx="300" cy="48" r="4" fill="#1b3a63"/><text class="nom" style="font-size:17px" x="325" y="54" text-anchor="start"><tspan x="325" dy="0">Détecteur de fumée</tspan></text>
<!-- 5 : la porte de la cuisine et le surveillant -->
<rect x="700" y="130" width="60" height="210" fill="#fff" stroke="#5a6b7d" stroke-width="3"/><text class="nom" style="font-size:16px" x="730" y="84" text-anchor="middle"><tspan x="730" dy="0">Cuisine</tspan><tspan x="730" dy="22">(en service)</tspan></text><g transform="translate(470 262) scale(1.2)"><circle cx="0" cy="-10" r="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-15,18 v-3 a15,12 0 0 1 30,0 v3 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" x="470" y="306" text-anchor="middle"><tspan x="470" dy="0">Marc</tspan></text><text class="txt" style="font-size:16px" x="470" y="326" text-anchor="middle"><tspan x="470" dy="0">surveillant</tspan></text>
<!-- 6 : la bande du bas -->
<rect x="20" y="398" width="760" height="88" rx="12" fill="#f7e2de" stroke="#b91c1c" stroke-width="2.5"/><text class="nomc" x="400" y="430" text-anchor="middle"><tspan x="400" dy="0">Brasage fort d’un raccord de cuivre. Mardi, de 8 h à 11 h.</tspan></text><text class="txt" x="400" y="458" text-anchor="middle"><tspan x="400" dy="0">Le circuit est déjà vidé de son fluide.</tspan></text>
</svg>
