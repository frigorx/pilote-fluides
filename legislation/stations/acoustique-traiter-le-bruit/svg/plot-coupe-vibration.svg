<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pcv" aria-describedby="d-pcv" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-pcv">Le plot antivibratile coupe le chemin solidien</title>
  <desc id="d-pcv">Deux vues côte à côte. À gauche, sans plot : la machine repose directement sur la dalle ; une ligne ondulée orange court dans la dalle et trois arcs orange pleins descendent dans le local du dessous, ce qui montre que la vibration traverse la dalle. À droite, avec plots : la machine repose sur deux plots antivibratiles ; la dalle reste lisse et les arcs sous la dalle sont seulement pointillés gris et très atténués, ce qui montre que les plots coupent l'essentiel du chemin. Dans l'animation, les machines vibrent, la vibration se propage à gauche et s'éteint à droite.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .t20 { font-weight:bold; font-size:20px; fill:#1b3a63; }
    .lbl { font-size:17px; fill:#10233c; }
    .lblb{ font-size:17px; font-weight:bold; fill:#1b3a63; }
    .sub { font-size:16px; fill:#5a6b7d; }
    .aer { font-size:17px; font-weight:bold; fill:#5b21b6; }
    .sol { font-size:17px; font-weight:bold; fill:#9a4d0a; }
    .band{ font-size:18px; font-weight:bold; fill:#10233c; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5689"/></marker>
  </defs>

  <path d="M400,40 V400" stroke="#d6dee7" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- SANS PLOT -->
  <text class="t20" x="210" y="62" text-anchor="middle">Sans plot</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0;0 2;0 0" dur="0.9s" repeatCount="indefinite"/>
    <rect x="130" y="100" width="160" height="100" rx="10" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="210" cy="150" r="26" fill="none" stroke="#5a6b7d" stroke-width="2.5"/><path d="M210,128 V172 M188,150 H232" stroke="#5a6b7d" stroke-width="2.5"/>
    <rect x="30" y="200" width="360" height="36" fill="#d9dee5" stroke="#5a6b7d" stroke-width="2"/>
  </g>
  <path d="M50,218 q10,-9 20,0 q10,9 20,0 q10,-9 20,0 q10,9 20,0 q10,-9 20,0 q10,9 20,0 q10,-9 20,0 q10,9 20,0 q10,-9 20,0 q10,9 20,0 q10,-9 20,0 q10,9 20,0 q10,-9 20,0 q10,9 20,0 q10,-9 20,0 q10,9 20,0" fill="none" stroke="#e8914a" stroke-width="4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.1;0.3;1" dur="12s" repeatCount="indefinite"/></path>
  <path d="M236,257.9 A34,34 0 0 1 184,257.9" fill="none" stroke="#e8914a" stroke-width="5" stroke-linecap="round"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.32;1" dur="12s" repeatCount="indefinite"/></path>
  <path d="M259,277.1 A64,64 0 0 1 161,277.1" fill="none" stroke="#e8914a" stroke-width="5" stroke-linecap="round"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.38;1" dur="12s" repeatCount="indefinite"/></path>
  <path d="M282,296.4 A94,94 0 0 1 138,296.4" fill="none" stroke="#e8914a" stroke-width="5" stroke-linecap="round"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.44;1" dur="12s" repeatCount="indefinite"/></path>
  <text class="sub" x="210" y="372" text-anchor="middle">Local du dessous</text>
  <g>
    <text class="sol" x="210" y="430" text-anchor="middle">La vibration traverse la dalle</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.16;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- AVEC PLOTS -->
  <text class="t20" x="600" y="62" text-anchor="middle">Avec plots</text>
  <rect x="420" y="200" width="360" height="36" fill="#d9dee5" stroke="#5a6b7d" stroke-width="2"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0;0 3;0 0" dur="0.9s" repeatCount="indefinite"/>
    <rect x="520" y="82" width="160" height="100" rx="10" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="600" cy="132" r="26" fill="none" stroke="#5a6b7d" stroke-width="2.5"/><path d="M600,110 V154 M578,132 H622" stroke="#5a6b7d" stroke-width="2.5"/>
  </g>
  <rect x="530" y="182" width="30" height="18" rx="3" fill="#cfe0f3" stroke="#1b3a63" stroke-width="2.5"/><path d="M535,191 h20" stroke="#1b3a63" stroke-width="2"/>
  <rect x="640" y="182" width="30" height="18" rx="3" fill="#cfe0f3" stroke="#1b3a63" stroke-width="2.5"/><path d="M645,191 h20" stroke="#1b3a63" stroke-width="2"/>
  <path d="M626,257.9 A34,34 0 0 1 574,257.9" fill="none" stroke="#9aa7b5" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.32;1" dur="12s" repeatCount="indefinite"/></path>
  <path d="M649,277.1 A64,64 0 0 1 551,277.1" fill="none" stroke="#9aa7b5" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.38;1" dur="12s" repeatCount="indefinite"/></path>
  <path d="M672,296.4 A94,94 0 0 1 528,296.4" fill="none" stroke="#9aa7b5" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.44;1" dur="12s" repeatCount="indefinite"/></path>
  <text class="sub" x="600" y="372" text-anchor="middle">Local du dessous</text>
  <g>
    <text class="lblb" x="600" y="430" text-anchor="middle">Les plots coupent l'essentiel</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.56;1" dur="12s" repeatCount="indefinite"/>
  </g>
</svg>
