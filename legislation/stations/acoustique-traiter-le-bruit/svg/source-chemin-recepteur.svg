<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-scr" aria-describedby="d-scr" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-scr">Trois endroits où agir contre le bruit</title>
  <desc id="d-scr">Trois cartes reliées par des flèches, de gauche à droite. Première carte, la source : une machine, avec les actions machine plus discrète, vitesse réduite, mode nuit. Deuxième carte, le chemin : un mur traversé par des ondes, avec plots antivibratiles, manchettes souples, silencieux, écran, capot. Troisième carte, le récepteur : un personnage, avec isoler le local, éloigner les postes, protection auditive. En bas, une bande rappelle l'ordre : d'abord la source, puis le chemin, en dernier le récepteur.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .t20 { font-weight:bold; font-size:20px; fill:#1b3a63; }
    .lbl { font-size:17px; fill:#10233c; }
    .lblb{ font-size:17px; font-weight:bold; fill:#1b3a63; }
    .sub { font-size:16px; fill:#5a6b7d; }
    .aer { font-size:17px; font-weight:bold; fill:#5b21b6; }
    .sol { font-size:17px; font-weight:bold; fill:#9a4d0a; }
    .band{ font-size:18px; font-weight:bold; fill:#10233c; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5689"/></marker>
  </defs>
  <text class="ttl" x="400" y="40" text-anchor="middle">Trois endroits où agir</text>
  <rect x="30" y="70" width="220" height="285" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="t20" x="140" y="108" text-anchor="middle">1 · La source</text>
  <rect x="90" y="150" width="100" height="62" rx="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><circle cx="140" cy="181" r="20" fill="none" stroke="#5a6b7d" stroke-width="2.5"/><path d="M140,165 V197 M124,181 H156" stroke="#5a6b7d" stroke-width="2.5"/>
  <text class="lbl" x="140" y="252" text-anchor="middle">machine plus discrète</text>
  <text class="lbl" x="140" y="278" text-anchor="middle">vitesse réduite</text>
  <text class="lbl" x="140" y="304" text-anchor="middle">mode nuit</text>
  <path d="M254,212 H284" stroke="#2f5689" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <rect x="290" y="70" width="220" height="285" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="t20" x="400" y="108" text-anchor="middle">2 · Le chemin</text>
  <rect x="392" y="140" width="16" height="80" fill="#d9dee5" stroke="#5a6b7d" stroke-width="2"/>
      <path d="M376.7,192.9 A20,20 0 0 1 376.7,167.1" fill="none" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
      <path d="M359.8,207 A42,42 0 0 1 359.8,153" fill="none" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
      <path d="M423.3,167.1 A20,20 0 0 1 423.3,192.9" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round"/>
  <text class="lbl" x="400" y="252" text-anchor="middle">plots antivibratiles</text>
  <text class="lbl" x="400" y="278" text-anchor="middle">manchettes souples</text>
  <text class="lbl" x="400" y="304" text-anchor="middle">silencieux, écran</text>
  <text class="lbl" x="400" y="330" text-anchor="middle">capot</text>
  <path d="M514,212 H544" stroke="#2f5689" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <rect x="550" y="70" width="220" height="285" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="t20" x="660" y="108" text-anchor="middle">3 · Le récepteur</text>
  <circle cx="660" cy="160" r="15" fill="#1b3a63"/><path d="M630,214 q0,-38 30,-38 q30,0 30,38 z" fill="#1b3a63"/>
  <text class="lbl" x="660" y="252" text-anchor="middle">isoler le local</text>
  <text class="lbl" x="660" y="278" text-anchor="middle">éloigner les postes</text>
  <text class="lbl" x="660" y="304" text-anchor="middle">protection auditive</text>
  <rect x="30" y="385" width="740" height="70" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="400" y="416" text-anchor="middle">On agit d'abord à la source, puis sur le chemin,</text>
  <text class="band" x="400" y="440" text-anchor="middle">et en dernier chez le récepteur.</text>
</svg>
