<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img"
     aria-labelledby="t-bd" aria-describedby="d-bd" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-bd">Le réflexe du technicien : trois questions</title>
  <desc id="d-bd">Trois cartes reliées par des flèches : un, quel chemin, aérien, solidien ou les deux ; deux, où agir, d'abord la source puis le chemin ; trois, un pont, tube rigide, gaine fixée en dur, plot écrasé. En dessous, quatre étiquettes : plots, manchettes, silencieux, section de gaine. En bas, une bande rappelle qu'on mesure avant et après.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .t20 { font-weight:bold; font-size:20px; fill:#1b3a63; }
    .lbl { font-size:17px; fill:#10233c; }
    .lblb{ font-size:17px; font-weight:bold; fill:#1b3a63; }
    .sub { font-size:16px; fill:#5a6b7d; }
    .aer { font-size:17px; font-weight:bold; fill:#5b21b6; }
    .sol { font-size:17px; font-weight:bold; fill:#9a4d0a; }
    .band{ font-size:18px; font-weight:bold; fill:#10233c; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5689"/></marker>
  </defs>

  <text class="ttl" x="400" y="32" text-anchor="middle" fill="#10233c">Le réflexe : trois questions</text>
  
  <rect x="20" y="50" width="220" height="150" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="t20" x="130" y="92" text-anchor="middle">1 · Quel chemin ?</text>
  <text class="lbl" x="130" y="132" text-anchor="middle">aérien, solidien,</text>
  <text class="lbl" x="130" y="158" text-anchor="middle">ou les deux</text>
  
  <rect x="290" y="50" width="220" height="150" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="t20" x="400" y="92" text-anchor="middle">2 · Où agir ?</text>
  <text class="lbl" x="400" y="132" text-anchor="middle">d'abord la source,</text>
  <text class="lbl" x="400" y="158" text-anchor="middle">puis le chemin</text>
  
  <rect x="560" y="50" width="220" height="150" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="t20" x="670" y="92" text-anchor="middle">3 · Un pont ?</text>
  <text class="lbl" x="670" y="132" text-anchor="middle">tube rigide, gaine fixée</text>
  <text class="lbl" x="670" y="158" text-anchor="middle">en dur, plot écrasé</text>
  <path d="M244,125 H286" stroke="#2f5689" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M514,125 H556" stroke="#2f5689" stroke-width="4" fill="none" marker-end="url(#ah)"/>

  <text class="sub" x="400" y="268" text-anchor="middle">Les quatre outils du technicien</text>
  <rect x="20" y="290" width="175" height="50" rx="12" fill="#ede3f4" stroke="#6d28d9" stroke-width="2.5"/>
  <text class="lblb" x="107.5" y="321" text-anchor="middle">Plots</text><rect x="215" y="290" width="175" height="50" rx="12" fill="#ede3f4" stroke="#6d28d9" stroke-width="2.5"/>
  <text class="lblb" x="302.5" y="321" text-anchor="middle">Manchettes</text><rect x="410" y="290" width="175" height="50" rx="12" fill="#ede3f4" stroke="#6d28d9" stroke-width="2.5"/>
  <text class="lblb" x="497.5" y="321" text-anchor="middle">Silencieux</text><rect x="605" y="290" width="175" height="50" rx="12" fill="#ede3f4" stroke="#6d28d9" stroke-width="2.5"/>
  <text class="lblb" x="692.5" y="321" text-anchor="middle">Section de gaine</text>

  <rect x="60" y="380" width="680" height="80" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="400" y="414" text-anchor="middle">On mesure avant et après :</text>
  <text class="band" x="400" y="440" text-anchor="middle">sans mesure, pas de preuve du résultat.</text>
</svg>
