<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-sr" aria-describedby="d-sr" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-sr">Un silencieux à baffles dans une gaine de ventilation</title>
  <desc id="d-sr">Une gaine horizontale part d'un ventilateur à gauche et finit à une bouche à droite. Au milieu, un silencieux à baffles : trois lames parallèles de matériau absorbant, l'air passe entre elles, deux flèches le montrent avant et après. Au-dessus de la gaine, une onde violette montre le bruit : ample avant le silencieux, plus petite dans le silencieux, faible après. En bas, une bande rappelle que le bruit en sortie est le bruit en entrée moins l'atténuation du silencieux, exprimée en décibels, et que le silencieux freine l'air. Dans l'animation, l'onde se dessine de gauche à droite en s'affaiblissant.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .t20 { font-weight:bold; font-size:20px; fill:#1b3a63; }
    .lbl { font-size:17px; fill:#10233c; }
    .lblb{ font-size:17px; font-weight:bold; fill:#1b3a63; }
    .sub { font-size:16px; fill:#5a6b7d; }
    .aer { font-size:17px; font-weight:bold; fill:#5b21b6; }
    .sol { font-size:17px; font-weight:bold; fill:#9a4d0a; }
    .band{ font-size:18px; font-weight:bold; fill:#10233c; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5689"/></marker>
  </defs>

  <!-- le bruit, avant et après -->
  <path d="M140,125 q10,-40 20,0 q10,40 20,0 q10,-40 20,0 q10,40 20,0 q10,-40 20,0 q10,40 20,0 q10,-40 20,0 q10,40 20,0 q10,-40 20,0" fill="none" stroke="#6d28d9" stroke-width="5" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.06;0.22;1" dur="12s" repeatCount="indefinite"/></path>
  <path d="M320,125 q10,-24 20,0 q10,24 20,0 q10,-24 20,0 q10,24 20,0 q10,-24 20,0 q10,24 20,0 q10,-24 20,0 q10,24 20,0 q10,-24 20,0" fill="none" stroke="#6d28d9" stroke-width="4" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.22;0.4;1" dur="12s" repeatCount="indefinite"/></path>
  <path d="M500,125 q10,-10 20,0 q10,10 20,0 q10,-10 20,0 q10,10 20,0 q10,-10 20,0 q10,10 20,0 q10,-10 20,0 q10,10 20,0 q10,-10 20,0" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.4;0.56;1" dur="12s" repeatCount="indefinite"/></path>
  <text class="aer" x="230" y="75" text-anchor="middle">Bruit avant le silencieux</text>
  <text class="aer" x="590" y="75" text-anchor="middle">Bruit après</text>

  <!-- la gaine -->
  <rect x="40" y="190" width="90" height="100" rx="10" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <circle cx="85" cy="240" r="26" fill="none" stroke="#5a6b7d" stroke-width="2.5"/><path d="M85,218 V262 M63,240 H107" stroke="#5a6b7d" stroke-width="2.5"/>
  <rect x="130" y="190" width="560" height="100" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <rect x="330" y="200" width="160" height="12" rx="3" fill="#cfd8e3" stroke="#5a6b7d" stroke-width="2"/>
  <rect x="330" y="234" width="160" height="12" rx="3" fill="#cfd8e3" stroke="#5a6b7d" stroke-width="2"/>
  <rect x="330" y="268" width="160" height="12" rx="3" fill="#cfd8e3" stroke="#5a6b7d" stroke-width="2"/>
  <path d="M150,223 H290" stroke="#2f5689" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M520,223 H660" stroke="#2f5689" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M150,257 H290" stroke="#2f5689" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M520,257 H660" stroke="#2f5689" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <rect x="690" y="200" width="16" height="80" fill="#cfd8e3" stroke="#1b3a63" stroke-width="2.5"/>

  <text class="lblb" x="85" y="325" text-anchor="middle">Ventilateur</text>
  <text class="lblb" x="235" y="325" text-anchor="middle">Gaine</text>
  <text class="lblb" x="410" y="325" text-anchor="middle">Silencieux à baffles</text>
  <text class="lblb" x="700" y="325" text-anchor="middle">Bouche</text>

  <rect x="90" y="368" width="620" height="100" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <g>
    <text class="band" x="400" y="404" text-anchor="middle">Bruit en sortie = bruit en entrée − atténuation du silencieux</text>
    <text class="sub" x="400" y="432" text-anchor="middle">L'atténuation s'exprime en décibels (dB) et se soustrait.</text>
    <text class="sub" x="400" y="454" text-anchor="middle">Son prix : le silencieux freine l'air (perte de charge).</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.66;1" dur="12s" repeatCount="indefinite"/>
  </g>
</svg>
