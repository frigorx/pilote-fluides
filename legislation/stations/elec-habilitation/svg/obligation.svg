<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-obl" aria-describedby="d-obl" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-obl">Sur l'installation ou à côté : il faut être habilité</title>
  <desc id="d-obl">À gauche, un travailleur représenté par un pictogramme plein, avec un badge portant la mention habilité. Une flèche part vers la droite. À droite, une armoire électrique dessinée en bleu, entourée d'un cadre en pointillé qui représente la zone de voisinage. Une bande en bas rappelle la règle : seuls les travailleurs habilités peuvent effectuer des opérations sur les installations électriques ou dans leur voisinage.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#1b3a63; }
    .lbl { font-size:17px; fill:#10233c; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
  </style>
  <rect x="0" y="0" width="800" height="500" fill="#fffdf8"/>
  <text class="ttl" x="400" y="36" text-anchor="middle">Sur l'installation ou à côté : habilité</text>

  <!-- le travailleur : pictogramme plein -->
  <circle cx="120" cy="140" r="30" fill="#1b3a63"/>
  <path d="M60,250 q0,-70 60,-70 q60,0 60,70 z" fill="#1b3a63"/>
  <rect x="50" y="272" width="140" height="74" rx="10" fill="#f7edd8" stroke="#a16207" stroke-width="3"/>
  <text class="qui" x="120" y="303" text-anchor="middle" fill="#a16207">Travailleur</text>
  <text class="qui" x="120" y="330" text-anchor="middle" fill="#a16207">habilité</text>

  <!-- flèche -->
  <line x1="205" y1="215" x2="292" y2="215" stroke="#e8914a" stroke-width="5"/>
  <polygon points="300,215 284,205 284,225" fill="#e8914a"/>

  <!-- zone de voisinage (pointillé) -->
  <rect x="320" y="70" width="450" height="330" rx="22" fill="#fffdf8" stroke="#a16207" stroke-width="3.5" stroke-dasharray="12 8"/>
  <text class="qui" x="545" y="106" text-anchor="middle" fill="#a16207">zone de voisinage</text>

  <!-- armoire électrique : l'installation -->
  <rect x="440" y="135" width="210" height="170" rx="10" fill="#eef3f9" stroke="#1b3a63" stroke-width="3.5"/>
  <rect x="464" y="158" width="46" height="60" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <rect x="528" y="158" width="46" height="60" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <rect x="592" y="158" width="34" height="60" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <rect x="476" y="176" width="22" height="24" rx="3" fill="#1b3a63"/>
  <rect x="540" y="176" width="22" height="24" rx="3" fill="#1b3a63"/>
  <rect x="598" y="176" width="22" height="24" rx="3" fill="#e8914a"/>
  <line x1="464" y1="248" x2="626" y2="248" stroke="#5a6b7d" stroke-width="3"/>
  <line x1="464" y1="270" x2="626" y2="270" stroke="#5a6b7d" stroke-width="3"/>
  <text class="qui" x="545" y="340" text-anchor="middle">installation électrique</text>
  <text class="lbl" x="545" y="372" text-anchor="middle">opérations dessus, ou autour</text>

  <!-- bande règle -->
  <rect x="20" y="425" width="760" height="56" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="400" y="459" text-anchor="middle">Code du travail : seuls les travailleurs habilités</text>
</svg>
