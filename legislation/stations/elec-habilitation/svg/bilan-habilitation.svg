<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-bil" aria-describedby="d-bil" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-bil">Le réflexe : trois questions avant d'ouvrir</title>
  <desc id="d-bil">À gauche, un exemple de titre d'habilitation avec son symbole BR, son domaine de tension basse tension, les ouvrages concernés et une ligne de limites. À droite, trois questions à se poser avant d'ouvrir une armoire : mon symbole couvre-t-il ce geste, mon titre est-il à jour, l'installation est-elle consignée. Une coche apparaît devant chaque question, l'une après l'autre. Une bande en bas rappelle que l'habilitation dit je peux faire ceci, ici, et non je sais tout faire.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#a16207; }
    .lbl { font-size:17px; fill:#10233c; }
    .q   { font-size:18px; fill:#10233c; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
  </style>
  <rect x="0" y="0" width="800" height="500" fill="#fffdf8"/>
  <text class="ttl" x="400" y="34" text-anchor="middle">Avant d'ouvrir : lire son titre</text>

  <rect x="24" y="60" width="330" height="290" rx="14" fill="#f7edd8" stroke="#a16207" stroke-width="3"/>
  <text class="qui" x="44" y="96">TITRE D'HABILITATION</text>
  <line x1="44" y1="110" x2="334" y2="110" stroke="#a16207" stroke-width="2"/>
  <text class="lbl" x="44" y="146">Symbole : BR</text>
  <text class="lbl" x="44" y="182">Domaine : basse tension</text>
  <text class="lbl" x="44" y="218">Ouvrages : ceux de l'atelier</text>
  <text class="lbl" x="44" y="254">Limites : notées sur le titre</text>
  <text class="lbl" x="44" y="290">Délivré par : l'employeur</text>
  <text class="lbl" x="44" y="326">Validité : fixée par l'employeur</text>
  <rect x="390" y="80" width="386" height="80" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <rect x="410" y="102" width="36" height="36" rx="6" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="q" x="462" y="128">Mon symbole couvre-t-il ce geste ?</text>
  <path d="M416,120 l9,10 l16,-22" fill="none" stroke="#1e7e54" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.15;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <rect x="390" y="180" width="386" height="80" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <rect x="410" y="202" width="36" height="36" rx="6" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="q" x="462" y="228">Mon titre est-il à jour ?</text>
  <path d="M416,220 l9,10 l16,-22" fill="none" stroke="#1e7e54" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.32;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <rect x="390" y="280" width="386" height="80" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <rect x="410" y="302" width="36" height="36" rx="6" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="q" x="462" y="328">L'installation est-elle consignée ?</text>
  <path d="M416,320 l9,10 l16,-22" fill="none" stroke="#1e7e54" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.39;0.49;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <rect x="24" y="382" width="752" height="94" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="400" y="418" text-anchor="middle">L'habilitation ne dit pas « je sais tout faire ».</text>
  <text class="band" x="400" y="448" text-anchor="middle">Elle dit « je peux faire ceci, ici ».</text>
</svg>
