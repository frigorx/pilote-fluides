<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img"
     aria-labelledby="t-et" aria-describedby="d-et" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-et">Ce que l'entreprise doit tenir : un référent formé et une charte en six gestes</title>
  <desc id="d-et">À gauche, un encadré « Dans l'entreprise » : un responsable technique formé, désigné par
    qualification demandée ; la mention attachée à chaque établissement ; un sous-traitant qui doit lui-même
    être RGE dans le même domaine. À droite, six cartes numérotées reprenant la charte QualiPAC dans l'ordre
    d'un chantier : conseiller avec une étude thermique, remettre un devis descriptif détaillé, informer sur les
    aides, installer selon les règles professionnelles, réceptionner avec le client et proposer un contrat
    d'entretien, remettre une facture détaillée et les attestations pour les aides.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#3730a3; }
    .ttl2{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl { font-size:16px; fill:#10233c; }
    .num { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#fffdf8; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
  </style>

  <!-- Encadré de gauche -->
  <rect x="20" y="16" width="300" height="384" rx="14" fill="#fffdf8" stroke="#3730a3" stroke-width="3"/>
  <text class="ttl" x="170" y="50" text-anchor="middle">Dans l'entreprise</text>

  <text class="qui" x="40" y="94">Un responsable technique</text>
  <text class="lbl" x="40" y="118">formé, désigné pour chaque</text>
  <text class="lbl" x="40" y="140">qualification demandée</text>

  <text class="qui" x="40" y="196">Une mention par site</text>
  <text class="lbl" x="40" y="220">attachée à l'établissement</text>
  <text class="lbl" x="40" y="242">(numéro de SIRET)</text>

  <text class="qui" x="40" y="298">Un sous-traitant qualifié</text>
  <text class="lbl" x="40" y="322">lui aussi RGE, dans le</text>
  <text class="lbl" x="40" y="344">même domaine de travaux</text>

  <!-- Six gestes -->
  <text class="ttl2" x="620" y="36" text-anchor="middle">La charte QualiPAC, dans l'ordre d'un chantier</text>

  <rect x="344" y="56" width="266" height="100" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="372" cy="84" r="16" fill="#3730a3"/><text class="num" x="372" y="91" text-anchor="middle">1</text>
  <text class="qui" x="396" y="90">Conseiller</text>
  <text class="lbl" x="360" y="120">avec une étude thermique</text>
  <text class="lbl" x="360" y="142">adaptée au site</text>

  <rect x="630" y="56" width="250" height="100" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="658" cy="84" r="16" fill="#3730a3"/><text class="num" x="658" y="91" text-anchor="middle">2</text>
  <text class="qui" x="682" y="90">Chiffrer</text>
  <text class="lbl" x="646" y="120">un devis écrit, détaillé,</text>
  <text class="lbl" x="646" y="142">après visite sur site</text>

  <rect x="344" y="172" width="266" height="100" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="372" cy="200" r="16" fill="#3730a3"/><text class="num" x="372" y="207" text-anchor="middle">3</text>
  <text class="qui" x="396" y="206">Informer</text>
  <text class="lbl" x="360" y="236">sur les démarches et les</text>
  <text class="lbl" x="360" y="258">conditions des aides</text>

  <rect x="630" y="172" width="250" height="100" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="658" cy="200" r="16" fill="#3730a3"/><text class="num" x="658" y="207" text-anchor="middle">4</text>
  <text class="qui" x="682" y="206">Installer</text>
  <text class="lbl" x="646" y="236">selon les règles de l'art,</text>
  <text class="lbl" x="646" y="258">normes et textes</text>

  <rect x="344" y="288" width="266" height="112" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="372" cy="316" r="16" fill="#3730a3"/><text class="num" x="372" y="323" text-anchor="middle">5</text>
  <text class="qui" x="396" y="322">Réceptionner</text>
  <text class="lbl" x="360" y="352">avec le client, notices en</text>
  <text class="lbl" x="360" y="374">main, contrat d'entretien</text>

  <rect x="630" y="288" width="250" height="112" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="658" cy="316" r="16" fill="#3730a3"/><text class="num" x="658" y="323" text-anchor="middle">6</text>
  <text class="qui" x="682" y="322">Facturer</text>
  <text class="lbl" x="646" y="352">facture détaillée et</text>
  <text class="lbl" x="646" y="374">attestations pour les aides</text>

  <!-- Bande -->
  <rect x="20" y="418" width="860" height="40" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="450" y="444" text-anchor="middle">Et après : intervenir vite en cas d'anomalie, accepter les contrôles de Qualit'EnR</text>
</svg>
