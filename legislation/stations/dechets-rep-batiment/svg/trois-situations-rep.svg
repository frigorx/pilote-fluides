<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img"
     aria-labelledby="t-3s" aria-describedby="d-3s" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-3s">Trois situations de terrain et leur réponse</title>
  <desc id="d-3s">Trois cartes numérotées en cascade. Carte 1 : « je ne sais pas où déposer les
    chutes d'isolant » ; réponse, chercher un point de reprise REP bâtiment. Carte 2 : « le point de
    reprise a refusé mon dépôt » ; réponse, vérifier le tri. Carte 3 : « c'est plus simple de laisser
    les chutes sur le chantier voisin » ; réponse, c'est un dépôt sauvage, ce que le dispositif cherche
    à éviter.</desc>
  <style>
    .num { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:24px; fill:#fffdf8; text-anchor:middle; }
    .sit { font-size:15px; font-style:italic; fill:#10233c; }
    .rep { font-size:15px; fill:#10233c; }
    .fleche { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:34px; fill:#57534e; }
    .col { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:12px; fill:#57534e;
           text-transform:uppercase; letter-spacing:.06em; }
  </style>

  <!-- Carte 1 -->
  <rect x="40" y="20" width="820" height="160" rx="14" fill="#fffdf8" stroke="#57534e" stroke-width="2.5"/>
  <circle cx="95" cy="100" r="28" fill="#57534e"/>
  <text class="num" x="95" y="109">1</text>
  <text class="col" x="140" y="50">Situation</text>
  <text class="sit" x="140" y="72">« Je ne sais pas où déposer</text>
  <text class="sit" x="140" y="92">les chutes d'isolant de</text>
  <text class="sit" x="140" y="112">mon chantier. »</text>
  <text class="fleche" x="470" y="112">→</text>
  <text class="col" x="530" y="50">Réponse</text>
  <text class="rep" x="530" y="72">Chercher un point de reprise</text>
  <text class="rep" x="530" y="92">du dispositif REP bâtiment,</text>
  <text class="rep" x="530" y="112">financé pour cela.</text>

  <!-- Carte 2 -->
  <rect x="40" y="200" width="820" height="160" rx="14" fill="#fffdf8" stroke="#57534e" stroke-width="2.5"/>
  <circle cx="95" cy="280" r="28" fill="#57534e"/>
  <text class="num" x="95" y="289">2</text>
  <text class="col" x="140" y="230">Situation</text>
  <text class="sit" x="140" y="252">« Le point de reprise a</text>
  <text class="sit" x="140" y="272">refusé mon dépôt. »</text>
  <text class="fleche" x="470" y="292">→</text>
  <text class="col" x="530" y="230">Réponse</text>
  <text class="rep" x="530" y="252">Vérifier le tri : un déchet</text>
  <text class="rep" x="530" y="272">mélangé ou hors périmètre</text>
  <text class="rep" x="530" y="292">peut être refusé.</text>

  <!-- Carte 3 -->
  <rect x="40" y="380" width="820" height="160" rx="14" fill="#fffdf8" stroke="#57534e" stroke-width="2.5"/>
  <circle cx="95" cy="460" r="28" fill="#57534e"/>
  <text class="num" x="95" y="469">3</text>
  <text class="col" x="140" y="410">Situation</text>
  <text class="sit" x="140" y="432">« C'est plus simple de laisser</text>
  <text class="sit" x="140" y="452">les chutes sur le chantier</text>
  <text class="sit" x="140" y="472">voisin. »</text>
  <text class="fleche" x="470" y="472">→</text>
  <text class="col" x="530" y="410">Réponse</text>
  <text class="rep" x="530" y="432">C'est un dépôt sauvage —</text>
  <text class="rep" x="530" y="452">précisément ce que le</text>
  <text class="rep" x="530" y="472">dispositif REP évite.</text>
</svg>
