<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img"
     aria-labelledby="t-brb" aria-describedby="d-brb" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-brb">Bilan : du chantier au point de reprise</title>
  <desc id="d-brb">Un chemin complet en trois maillons : chantier, tri, point de reprise. Le maillon
    « tri » est mis en évidence en couleur ambre, avant la flèche qui mène au point de reprise. Un
    encadré rappelle le réflexe : trier avant de déposer, chercher le point de reprise plutôt que le
    terrain vague.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
    .lbl { font-size:15px; fill:#5a6b7d; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#57534e; }
  </style>

  <path d="M 100 130 H 800" stroke="#57534e" stroke-width="6" fill="none"/>

  <circle cx="100" cy="130" r="46" fill="#eef0ee" stroke="#57534e" stroke-width="3"/>
  <text class="ttl" x="100" y="135" text-anchor="middle">Chantier</text>

  <!-- Maillon mis en évidence : tri -->
  <circle cx="450" cy="130" r="54" fill="#fffdf8" stroke="#b06a00" stroke-width="5"/>
  <text class="ttl" x="450" y="125" text-anchor="middle" fill="#b06a00">Tri</text>
  <text class="lbl" x="450" y="146" text-anchor="middle" fill="#b06a00">par matière</text>

  <circle cx="800" cy="130" r="50" fill="#57534e" stroke="#57534e" stroke-width="3"/>
  <text class="ttl" x="800" y="125" text-anchor="middle" fill="#fffdf8">Point de</text>
  <text class="ttl" x="800" y="145" text-anchor="middle" fill="#fffdf8">reprise</text>

  <rect x="180" y="220" width="540" height="70" rx="12" fill="#fdf3e3" stroke="#b06a00" stroke-width="2"/>
  <text class="band" x="450" y="248" text-anchor="middle">Trier avant de déposer</text>
  <text class="band" x="450" y="270" text-anchor="middle">chercher le point de reprise, pas le terrain vague</text>
</svg>
