<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pc5" aria-describedby="d-pc5" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pc5">Pendant : le bon et la fiche d’intervention</title>
  <desc id="d-pc5">Deux papiers de l’intervention. Tableau à quatre colonnes : le papier, qui le remplit, qui le signe, où il va. Bon d'intervention : rempli par le technicien, signé par le client, en fin de visite, va copie au client, original à l'entreprise. Fiche d'intervention Cerfa 15497 : rempli par l'opérateur (l'entreprise attestée), signé par l'opérateur, et le détenteur au-delà du seuil de charge, va l'original au détenteur, une copie à l'opérateur. Le bon prouve la visite. La fiche prouve où est passé le fluide. Dans l'animation, les cases apparaissent une à une, de gauche à droite.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#c2410c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-pc5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<text class="nom" style="font-size:17px" x="120" y="32" text-anchor="middle"><tspan x="120" dy="0">Le papier</tspan></text><text class="nom" style="font-size:17px" x="324.5" y="32" text-anchor="middle"><tspan x="324.5" dy="0">Qui le remplit</tspan></text><text class="nom" style="font-size:17px" x="511.5" y="32" text-anchor="middle"><tspan x="511.5" dy="0">Qui le signe</tspan></text><text class="nom" style="font-size:17px" x="698.5" y="32" text-anchor="middle"><tspan x="698.5" dy="0">Où il va</tspan></text><g><rect x="15" y="48" width="210" height="165" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/><circle cx="53" cy="130.5" r="26" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(53 130.5) scale(0.85)"><path d="M-13,-19 h17 l10,10 v28 h-27 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M4,-19 v10 h10" fill="none" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-7,0 h14 M-7,7 h14 M-7,14 h8" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:17px" x="89" y="125.5" text-anchor="start"><tspan x="89" dy="0">Bon</tspan><tspan x="89" dy="21">d'intervention</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.040;0.107;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="237" y="48" width="175" height="165" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text class="txt" x="324.5" y="135.5" text-anchor="middle"><tspan x="324.5" dy="0">le technicien</tspan></text><path d="M226,124.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.107;0.175;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="424" y="48" width="175" height="165" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="txt" x="511.5" y="124.5" text-anchor="middle"><tspan x="511.5" dy="0">le client, en fin</tspan><tspan x="511.5" dy="22">de visite</tspan></text><path d="M413,124.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.175;0.242;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="611" y="48" width="175" height="165" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text class="txt" x="698.5" y="113.5" text-anchor="middle"><tspan x="698.5" dy="0">copie au client,</tspan><tspan x="698.5" dy="22">original à</tspan><tspan x="698.5" dy="22">l'entreprise</tspan></text><path d="M600,124.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.242;0.310;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="15" y="223" width="210" height="165" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/><circle cx="53" cy="305.5" r="26" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(53 305.5) scale(0.85)"><path d="M-13,-19 h17 l10,10 v28 h-27 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M4,-19 v10 h10" fill="none" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-7,0 h14 M-7,7 h14 M-7,14 h8" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:17px" x="89" y="290.5" text-anchor="start"><tspan x="89" dy="0">Fiche</tspan><tspan x="89" dy="21">d'intervention</tspan><tspan x="89" dy="21">Cerfa 15497</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.350;0.417;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="237" y="223" width="175" height="165" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text class="txt" x="324.5" y="288.5" text-anchor="middle"><tspan x="324.5" dy="0">l'opérateur</tspan><tspan x="324.5" dy="22">(l'entreprise</tspan><tspan x="324.5" dy="22">attestée)</tspan></text><path d="M226,299.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.417;0.485;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="424" y="223" width="175" height="165" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="txt" x="511.5" y="288.5" text-anchor="middle"><tspan x="511.5" dy="0">l'opérateur, et</tspan><tspan x="511.5" dy="22">le détenteur au-delà</tspan><tspan x="511.5" dy="22">du seuil de charge</tspan></text><path d="M413,299.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.485;0.552;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="611" y="223" width="175" height="165" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text class="txt" x="698.5" y="288.5" text-anchor="middle"><tspan x="698.5" dy="0">l'original au</tspan><tspan x="698.5" dy="22">détenteur, une copie</tspan><tspan x="698.5" dy="22">à l'opérateur</tspan></text><path d="M600,299.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.552;0.620;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="15" y="402" width="770" height="80" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="nomo" x="400" y="437" text-anchor="middle"><tspan x="400" dy="0">Le bon prouve la visite.</tspan><tspan x="400" dy="24">La fiche prouve où est passé le fluide.</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.720;0.780;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
