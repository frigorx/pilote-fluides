<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pc2" aria-describedby="d-pc2" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pc2">Avant (1) : le devis signé et l’ordre de service</title>
  <desc id="d-pc2">Deux papiers du contrat. Tableau à quatre colonnes : le papier, qui le remplit, qui le signe, où il va. Devis signé : rempli par l'entreprise, signé par le client, va chez le client et au dossier du chantier. Ordre de service : rempli par le maître d'œuvre, signé par le maître d'œuvre, va à l'entreprise, au dossier du chantier. Avant le premier outil : le client a dit oui, et on vous a dit de commencer. Dans l'animation, les cases apparaissent une à une, de gauche à droite.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#c2410c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-pc2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<text class="nom" style="font-size:17px" x="120" y="32" text-anchor="middle"><tspan x="120" dy="0">Le papier</tspan></text><text class="nom" style="font-size:17px" x="324.5" y="32" text-anchor="middle"><tspan x="324.5" dy="0">Qui le remplit</tspan></text><text class="nom" style="font-size:17px" x="511.5" y="32" text-anchor="middle"><tspan x="511.5" dy="0">Qui le signe</tspan></text><text class="nom" style="font-size:17px" x="698.5" y="32" text-anchor="middle"><tspan x="698.5" dy="0">Où il va</tspan></text><g><rect x="15" y="48" width="210" height="165" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/><circle cx="53" cy="130.5" r="26" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(53 130.5) scale(0.85)"><path d="M-13,-19 h17 l10,10 v28 h-27 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M4,-19 v10 h10" fill="none" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-7,0 h14 M-7,7 h14 M-7,14 h8" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:17px" x="89" y="135.5" text-anchor="start"><tspan x="89" dy="0">Devis signé</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.040;0.107;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="237" y="48" width="175" height="165" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text class="txt" x="324.5" y="135.5" text-anchor="middle"><tspan x="324.5" dy="0">l'entreprise</tspan></text><path d="M226,124.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.107;0.175;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="424" y="48" width="175" height="165" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="txt" x="511.5" y="135.5" text-anchor="middle"><tspan x="511.5" dy="0">le client</tspan></text><path d="M413,124.5 l8,6 l-8,6 z