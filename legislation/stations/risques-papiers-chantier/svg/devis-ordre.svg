fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="txt" x="511.5" y="299.5" text-anchor="middle"><tspan x="511.5" dy="0">le maître</tspan><tspan x="511.5" dy="22">d'œuvre</tspan></text><path d="M413,299.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.485;0.552;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="611" y="223" width="175" height="165" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text class="txt" x="698.5" y="288.5" text-anchor="middle"><tspan x="698.5" dy="0">à l'entreprise,</tspan><tspan x="698.5" dy="22">au dossier du</tspan><tspan x="698.5" dy="22">chantier</tspan></text><path d="M600,299.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.552;0.620;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="15" y="402" width="770" height="80" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="nomo" x="400" y="437" text-anchor="middle"><tspan x="400" dy="0">Avant le premier outil : le client a dit oui,</tspan><tspan x="400" dy="24">et on vous a dit de commencer.</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.720;0.780;1" dur="12s" repeatCount="indefinite"/></g>
