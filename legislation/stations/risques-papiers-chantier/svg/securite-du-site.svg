  <title id="t-pc3">Avant (2) : la sécurité du site</title>
  <desc id="d-pc3">Trois papiers de sécurité. Tableau à quatre colonnes : le papier, qui le remplit, qui le signe, où il va. Plan de prévention : rempli par les deux chefs d'entreprise, signé par les deux chefs d'entreprise, va chacun garde un exemplaire. PPSPS : rempli par votre entreprise, signé par son chef d'entreprise, va au coordonnateur SPS. Protocole de sécurité : rempli par les deux entreprises, signé par les deux entreprises, va chacune garde un exemplaire. Selon le lieu et le chantier, un ou plusieurs vous concernent. Vous êtes informé des dangers avant de commencer. Dans l'animation, les cases apparaissent une à une, de gauche à droite.</desc>
  <style>
