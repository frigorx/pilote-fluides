<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pc6" aria-describedby="d-pc6" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pc6">Après (1) : réception et mise en service</title>
  <desc id="d-pc6">Deux papiers de fin de chantier. Tableau à quatre colonnes : le papier, qui le remplit, qui le signe, où il va. Procès-verbal de réception : rempli par le client et l'entreprise, signé par le client et l'entreprise, va un exemplaire pour chacun. Fiche de mise en service : rempli par le technicien, signé par le technicien et le client, va au dossier de l'installation. La date du procès-verbal est le point de départ des garanties. Dans l'animation, les cases apparaissent une à une, de gauche à droite.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#c2410c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-pc6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<text class="nom" style="font-size:17px" x="120" y="32" text-anchor="middle"><tspan x="120" dy="0">Le papier</tspan></text><text class="nom" style="font-size:17px" x="324.5" y="32" text-anchor="middle"><tspan x="324.5" dy="0">Qui le remplit</tspan></text><text class="nom" style="font-size:17px" x="511.5" y="32" text-anchor="middle"><tspan x="511.5" dy="0">Qui le signe</tspan></text><text class="nom" style="font-size:17px" x="698.5" y="32" text-anchor="middle"><tspan x="698.5" dy="0">Où il va</tspan></text><g><rect x="15" y="48" width="210" height="165" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/><circle cx="53" cy="130.5" r="26" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(53 130.5) scale(0.85)"><rect x="-14" y="6" width="28" height="9" rx="2" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-6,6 V-2 a6,6 0 1 1 12,0 V6" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:17px" x="89" y="125.5" text-anchor="start"><tspan x="89" dy="0">Procès-verbal</tspan><tspan x="89" dy="21">de réception</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.040;0.107;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="237" y="48" width="175" height="165" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text class="txt" x="324.5" y="124.5" text-anchor="middle"><tspan x="324.5" dy="0">le client et</tspan><tspan x="324.5" dy="22">l'entreprise</tspan></text><path d="M226,124.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.107;0.175;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="424" y="48" width="175" height="165" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="txt" x="511.5" y="124.5" text-anchor="middle"><tspan x="511.5" dy="0">le client et</tspan><tspan x="511.5" dy="22">l'entreprise</tspan></text><path d="M413,124.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.175;0.242;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="611" y="48" width="175" height="165" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text class="txt" x="698.5" y="124.5" text-anchor="middle"><tspan x="698.5" dy="0">un exemplaire</tspan><tspan x="698.5" dy="22">pour chacun</tspan></text><path d="M600,124.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.242;0.310;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="15" y="223" width="210" height="165" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/><circle cx="53" cy="305.5" r="26" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(53 305.5) scale(0.85)"><rect x="-20" y="-13" width="40" height="28" rx="3" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-5" cy="1" r="9" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-5,-7 v16 M-13,1 h16" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M11,-7 v16 M15,-7 v16" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:17px" x="89" y="300.5" text-anchor="start"><tspan x="89" dy="0">Fiche de mise</tspan><tspan x="89" dy="21">en service</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.350;0.417;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="237" y="223" width="175" height="165" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text class="txt" x="324.5" y="310.5" text-anchor="middle"><tspan x="324.5" dy="0">le technicien</tspan></text><path d="M226,299.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.417;0.485;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="424" y="223" width="175" height="165" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="txt" x="511.5" y="299.5" text-anchor="middle"><tspan x="511.5" dy="0">le technicien et</tspan><tspan x="511.5" dy="22">le client</tspan></text><path d="M413,299.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.485;0.552;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="611" y="223" width="175" height="165" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text class="txt" x="698.5" y="299.5" text-anchor="middle"><tspan x="698.5" dy="0">au dossier de</tspan><tspan x="698.5" dy="22">l'installation</tspan></text><path d="M600,299.5 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.552;0.620;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="15" y="402" width="770" height="80" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="nomo" x="400" y="437" text-anchor="middle"><tspan x="400" dy="0">La date du procès-verbal est le point de départ</tspan><tspan x="400" dy="24">des garanties.</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.720;0.780;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
