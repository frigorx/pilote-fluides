<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pc7" aria-describedby="d-pc7" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pc7">Après (2) : BSFF, DOE et registre</title>
  <desc id="d-pc7">Trois papiers qui restent après le chantier. Tableau à quatre colonnes : le papier, qui le remplit, qui le signe, où il va. BSFF (bordereau) : rempli par l'émetteur du fluide récupéré, signé par l'émetteur, le transporteur, la destination, va dans Trackdéchets. DOE (dossier des ouvrages exécutés) : rempli par l'entreprise, signé par selon le marché, va au maître d'ouvrage. Registre de l'équipement : rempli par l'exploitant, avec vos données, signé par pas de signature type, va avec la machine, tenu à jour. Trois dossiers : le déchet, l’ouvrage, la machine. Dans l'animation, les cases apparaissent une à une, de gauche à droite.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#c2410c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-pc7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<text class="nom" style="font-size:17px" x="120" y="32" text-anchor="middle"><tspan x="120" dy="0">Le papier</tspan></text><text class="nom" style="font-size:17px" x="324.5" y="32" text-anchor="middle"><tspan x="324.5" dy="0">Qui le remplit</tspan></text><text class="nom" style="font-size:17px" x="511.5" y="32" text-anchor="middle"><tspan x="511.5" dy="0">Qui le signe</tspan></text><text class="nom" style="font-size:17px" x="698.5" y="32" text-anchor="middle"><tspan x="698.5" dy="0">Où il va</tspan></text><g><rect x="15" y="48" width="210" height="112" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/><circle cx="53" cy="104" r="26" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(53 104) scale(0.85)"><rect x="-9" y="-6" width="18" height="26" rx="7" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-4" y="-14" width="8" height="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-8" y="-19" width="16" height="5" rx="2" fill="#1b3a63"/></g><text class="nom" style="font-size:17px" x="89" y="99" text-anchor="start"><tspan x="89" dy="0">BSFF</tspan><tspan x="89" dy="21">(bordereau)</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.040;0.085;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="237" y="48" width="175" height="112" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text class="txt" x="324.5" y="98" text-anchor="middle"><tspan x="324.5" dy="0">l'émetteur du</tspan><tspan x="324.5" dy="22">fluide récupéré</tspan></text><path d="M226,98 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.085;0.130;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="424" y="48" width="175" height="112" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="txt" x="511.5" y="87" text-anchor="middle"><tspan x="511.5" dy="0">l'émetteur, le</tspan><tspan x="511.5" dy="22">transporteur, la</tspan><tspan x="511.5" dy="22">destination</tspan></text><path d="M413,98 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.130;0.175;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="611" y="48" width="175" height="112" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text class="txt" x="698.5" y="109" text-anchor="middle"><tspan x="698.5" dy="0">dans Trackdéchets</tspan></text><path d="M600,98 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.175;0.220;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="15" y="170" width="210" height="112" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/><circle cx="53" cy="226" r="26" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(53 226) scale(0.85)"><path d="M-20,16 V-12 h14 l4,5 h22 V16 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-20,-2 h40" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:17px" x="89" y="201" text-anchor="start"><tspan x="89" dy="0">DOE</tspan><tspan x="89" dy="21">(dossier des</tspan><tspan x="89" dy="21">ouvrages</tspan><tspan x="89" dy="21">exécutés)</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.247;0.292;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="237" y="170" width="175" height="112" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text class="txt" x="324.5" y="231" text-anchor="middle"><tspan x="324.5" dy="0">l'entreprise</tspan></text><path d="M226,220 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.292;0.337;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="424" y="170" width="175" height="112" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="txt" x="511.5" y="220" text-anchor="middle"><tspan x="511.5" dy="0">selon le</tspan><tspan x="511.5" dy="22">marché</tspan></text><path d="M413,220 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.337;0.381;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="611" y="170" width="175" height="112" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text class="txt" x="698.5" y="220" text-anchor="middle"><tspan x="698.5" dy="0">au maître</tspan><tspan x="698.5" dy="22">d'ouvrage</tspan></text><path d="M600,220 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.381;0.426;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="15" y="292" width="210" height="112" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/><circle cx="53" cy="348" r="26" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(53 348) scale(0.85)"><circle cx="-4" cy="-4" r="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M5,5 L17,17" stroke="#1b3a63" stroke-width="5" stroke-linecap="round"/></g><text class="nom" style="font-size:17px" x="89" y="343" text-anchor="start"><tspan x="89" dy="0">Registre de</tspan><tspan x="89" dy="21">l'équipement</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.453;0.498;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="237" y="292" width="175" height="112" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text class="txt" x="324.5" y="342" text-anchor="middle"><tspan x="324.5" dy="0">l'exploitant,</tspan><tspan x="324.5" dy="22">avec vos données</tspan></text><path d="M226,342 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.498;0.543;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="424" y="292" width="175" height="112" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="txt" x="511.5" y="342" text-anchor="middle"><tspan x="511.5" dy="0">pas de</tspan><tspan x="511.5" dy="22">signature type</tspan></text><path d="M413,342 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.543;0.588;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="611" y="292" width="175" height="112" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text class="txt" x="698.5" y="342" text-anchor="middle"><tspan x="698.5" dy="0">avec la machine,</tspan><tspan x="698.5" dy="22">tenu à jour</tspan></text><path d="M600,342 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.588;0.633;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="15" y="418" width="770" height="64" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="nomo" x="400" y="456" text-anchor="middle"><tspan x="400" dy="0">Trois dossiers : le déchet, l’ouvrage, la machine.</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.720;0.780;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
