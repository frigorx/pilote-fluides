<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pc4" aria-describedby="d-pc4" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pc4">Avant (3) : les trois autorisations</title>
  <desc id="d-pc4">Trois autorisations. Tableau à quatre colonnes : le papier, qui le remplit, qui le signe, où il va. Permis de feu : rempli par l'employeur ou son représentant, signé par l'employeur, le responsable d'intervention, le technicien, va un exemplaire à chaque signataire. Autorisation de travail : rempli par le chargé de travaux, signé par le chargé de travaux et l'exécutant, va un exemplaire à chacun. Attestation de consignation : rempli par le chargé de consignation, signé par le chargé de consignation, va au chargé de travaux. Les papiers demandés sont signés : feu vert, vous pouvez commencer. Dans l'animation, les cases apparaissent une à une, de gauche à droite.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#c2410c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-pc4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<text class="nom" style="font-size:17px" x="120" y="32" text-anchor="middle"><tspan x="120" dy="0">Le papier</tspan></text><text class="nom" style="font-size:17px" x="324.5" y="32" text-anchor="middle"><tspan x="324.5" dy="0">Qui le remplit</tspan></text><text class="nom" style="font-size:17px" x="511.5" y="32" text-anchor="middle"><tspan x="511.5" dy="0">Qui le signe</tspan></text><text class="nom" style="font-size:17px" x="698.5" y="32" text-anchor="middle"><tspan x="698.5" dy="0">Où il va</tspan></text><g><rect x="15" y="48" width="210" height="112" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/><circle cx="53" cy="104" r="26" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(53 104) scale(0.85)"><path d="M0,-22 C9,-10 15,-3 13,8 A13,13 0 0 1 -13,8 C-15,-1 -6,-8 0,-22 z" fill="#e8914a" stroke="#9a4d0c" stroke-width="2.5" stroke-linejoin="round"/><path d="M0,0 C5,5 7,9 5,13 A6,6 0 0 1 -5,13 C-6,8 -2,5 0,0 z" fill="#fdf1e6"/></g><text class="nom" style="font-size:17px" x="89" y="109" text-anchor="start"><tspan x="89" dy="0">Permis de feu</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.040;0.085;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="237" y="48" width="175" height="112" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text class="txt" x="324.5" y="98" text-anchor="middle"><tspan x="324.5" dy="0">l'employeur ou</tspan><tspan x="324.5" dy="22">son représentant</tspan></text><path d="M226,98 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.085;0.130;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="424" y="48" width="175" height="112" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/><text class="txt" x="511.5" y="76" text-anchor="middle"><tspan x="511.5" dy="0">l'employeur,</tspan><tspan x="511.5" dy="22">le responsable</tspan><tspan x="511.5" dy="22">d'intervention,</tspan><tspan x="511.5" dy="22">le technicien</tspan></text><pat