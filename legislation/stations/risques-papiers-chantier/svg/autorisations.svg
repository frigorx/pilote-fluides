="0">le chargé de</tspan><tspan x="511.5" dy="22">travaux et l'exécutant</tspan></text><path d="M413,220 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.337;0.381;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="611" y="170" width="175" height="112" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text class="txt" x="698.5" y="220" text-anchor="middle"><tspan x="698.5" dy="0">un exemplaire à</tspan><tspan x="698.5" dy="22">chacun</tspan></text><path d="M600,220 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.381;0.426;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="15" y="292" width="210" height="112" rx="12" fill="#fff" stroke="#c2410c" stroke-width="3"/><circle cx="53" cy="348" r="26" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(53 348) scale(0.85)"><rect x="-13" y="-2" width="26" height="20" rx="3" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-8,-2 V-9 a8,8 0 0 1 16,0 V-2" fill="none" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="0" cy="8" r="2.5" fill="#1b3a63"/></g><text class="nom" style="font-size:17px" x="89" y="343" text-anchor="start"><tspan x="89" dy="0">Attestation de</tspan><tspan x="89" dy="21">consignation</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.453;0.498;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="237" y="292" width="175" height="112" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text class="txt" x="324.5" y="342" text-anchor="middle"><tspan x="324.5" dy="0">le chargé de</tspan><tspan x="324.5" dy="22">consignation</tspan></text><path d="M226,342 l8,6 l-8,6 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.498;0.543;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="424" y="292" width="175" height="112" rx