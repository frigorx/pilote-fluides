<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-pc1" aria-describedby="d-pc1" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-pc1">Trois temps, un dossier : avant, pendant, après</title>
  <desc id="d-pc1">Trois colonnes alignées. Avant, huit papiers : devis signé, ordre de service, plan de prévention, PPSPS, protocole de sécurité, permis de feu, autorisation de travail, consignation. Pendant, deux papiers : bon d'intervention et fiche d'intervention Cerfa 15497. Après, cinq papiers : procès-verbal de réception, fiche de mise en service, BSFF, DOE, registre de l'équipement. Une bande en bas rappelle les trois questions à poser à chaque papier : qui le remplit, qui le signe, où va-t-il. Dans l'animation, les colonnes apparaissent l'une après l'autre.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#c2410c; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-pc1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<text class="ttl" x="400" y="28" text-anchor="middle"><tspan x="400" dy="0">Trois temps, un dossier</tspan></text><g><rect x="20" y="46" width="245" height="352" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><rect x="20" y="46" width="245" height="48" rx="12" fill="#1b3a63"/><rect x="20" y="76" width="245" height="18" fill="#1b3a63"/><text class="wht" x="142" y="78" text-anchor="middle"><tspan x="142" dy="0">AVANT</tspan></text><text class="nom" x="142" y="124" text-anchor="middle" fill="#1b3a63"><tspan x="142" dy="0">8 papiers</tspan></text><text class="txt" x="38" y="160" text-anchor="start"><tspan x="38" dy="0">devis signé</tspan></text><text class="txt" x="38" y="188" text-anchor="start"><tspan x="38" dy="0">ordre de service</tspan></text><text class="txt" x="38" y="216" text-anchor="start"><tspan x="38" dy="0">plan de prévention</tspan></text><text class="txt" x="38" y="244" text-anchor="start"><tspan x="38" dy="0">PPSPS</tspan></text><text class="txt" x="38" y="272" text-anchor="start"><tspan x="38" dy="0">protocole de sécurité</tspan></text><text class="txt" x="38" y="300" text-anchor="start"><tspan x="38" dy="0">permis de feu</tspan></text><text class="txt" x="38" y="328" text-anchor="start"><tspan x="38" dy="0">autorisation de travail</tspan></text><text class="txt" x="38" y="356" text-anchor="start"><tspan x="38" dy="0">consignation</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.050;0.120;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M267,222 l9,7 l-9,7 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.150;0.190;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="277" y="46" width="245" height="352" rx="12" fill="#fff" stroke="#e8914a" stroke-width="3"/><rect x="277" y="46" width="245" height="48" rx="12" fill="#e8914a"/><rect x="277" y="76" width="245" height="18" fill="#e8914a"/><text class="wht" x="399" y="78" text-anchor="middle"><tspan x="399" dy="0">PENDANT</tspan></text><text class="nom" x="399" y="124" text-anchor="middle" fill="#e8914a"><tspan x="399" dy="0">2 papiers</tspan></text><text class="txt" x="295" y="160" text-anchor="start"><tspan x="295" dy="0">bon d'intervention</tspan></text><text class="txt" x="295" y="188" text-anchor="start"><tspan x="295" dy="0">fiche d'intervention</tspan></text><text class="mut" x="295" y="216" text-anchor="start"><tspan x="295" dy="0">(Cerfa 15497)</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.210;0.280;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M524,222 l9,7 l-9,7 z" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.310;0.350;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="535" y="46" width="245" height="352" rx="12" fill="#fff" stroke="#1e7e54" stroke-width="3"/><rect x="535" y="46" width="245" height="48" rx="12" fill="#1e7e54"/><rect x="535" y="76" width="245" height="18" fill="#1e7e54"/><text class="wht" x="657" y="78" text-anchor="middle"><tspan x="657" dy="0">APRÈS</tspan></text><text class="nom" x="657" y="124" text-anchor="middle" fill="#1e7e54"><tspan x="657" dy="0">5 papiers</tspan></text><text class="txt" x="553" y="160" text-anchor="start"><tspan x="553" dy="0">PV de réception</tspan></text><text class="txt" x="553" y="188" text-anchor="start"><tspan x="553" dy="0">fiche de mise en service</tspan></text><text class="txt" x="553" y="216" text-anchor="start"><tspan x="553" dy="0">BSFF</tspan></text><text class="txt" x="553" y="244" text-anchor="start"><tspan x="553" dy="0">DOE</tspan></text><text class="txt" x="553" y="272" text-anchor="start"><tspan x="553" dy="0">registre de l'équipement</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.370;0.440;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="20" y="414" width="760" height="72" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="2.5"/><text class="nomo" x="400" y="444" text-anchor="middle"><tspan x="400" dy="0">Pour chaque papier, trois questions :</tspan></text><text class="nom" x="400" y="470" text-anchor="middle"><tspan x="400" dy="0">Qui le remplit ?   Qui le signe ?   Où va-t-il ?</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.580;0.660;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
