  <title id="t-exemple-11-14">Exemple résolu : les cadres 11 à 14 et les signatures</title>
  <desc id="d-exemple-11-14">En haut, le trajet du fluide, avec les appareils : une bouteille de fluide neuf, 4,0 kg, entre dans la climatisation (unité intérieure et unité extérieure) ; 3,8 kg de fluide pollué sortent dans une bouteille de récupération, pesée sur la balance. Au milieu, le cadre 11 : chargé 4,0 kg, dont 4,0 de fluide vierge ; récupéré 3,8 kg, dont 3,8 destinés au traitement. En dessous, les cadres 12, 13 et 14 : code UN non inflammable, installation de destination, observations. En bas, les signatures de l&#x27;opérateur et du détenteur.</desc>
