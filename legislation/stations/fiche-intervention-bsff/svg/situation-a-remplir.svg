<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-situation" aria-describedby="d-situation" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-situation">Une situation à remplir seul</title>
  <desc id="d-situation">Deux colonnes. À gauche, le client et la machine : un commerce, un meuble frigorifique au R-134a, charge totale 8,0 kg, PRP donné 1 430, avec un système permanent de détection de fuites. À droite, votre intervention : un contrôle d&#x27;étanchéité périodique avec le détecteur manuel DM-12, contrôlé le 4 mars 2026 ; une fuite est trouvée au raccord de l&#x27;évaporateur ; la pièce est commandée, la réparation n&#x27;est pas faite aujourd&#x27;hui ; vous ne rechargez rien et ne récupérez rien. En bas, ce qu&#x27;il faut faire : remplir les 14 cadres, dire lesquels restent vides, dire qui signe.</desc>
  
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">À vous : la situation</text>
  <rect x="30" y="46" width="360" height="264" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><text x="44" y="75.3" font-size="18" font-weight="bold" fill="#1b3a63">Le client et la machine</text><text x="44" y="99.8" font-size="16" fill="#10233c">Un commerce (le détenteur)</text><text x="44" y="129.6" font-size="16" fill="#10233c">Un meuble frigorifique</text><text x="44" y="159.3" font-size="16" fill="#10233c">Fluide : R-134a</text><text x="44" y="189.1" font-size="16" fill="#10233c">Charge totale : 8,0 kg</text><text x="44" y="218.8" font-size="16" fill="#10233c">PRP donné : 1 430</text><text x="44" y="248.6" font-size="16" fill="#10233c">Système permanent de détection de fuites :</text><text x="44" y="270.4" font-size="16" fill="#10233c">oui</text>
  <rect x="410" y="46" width="360" height="264" rx="12" fill="#fdf1e6" stroke="#9a4d0c" stroke-width="3" stroke-dasharray="10 7"/><text x="424" y="75.3" font-size="18" font-weight="bold" fill="#9a4d0c">Votre intervention</text><text x="424" y="99.8" font-size="16" fill="#10233c">Contrôle d&#x27;étanchéité périodique</text><text x="424" y="129.6" font-size="16" fill="#10233c">Détecteur manuel DM-12, contrôlé le</text><text x="424" y="151.3" font-size="16" fill="#10233c">04/03/2026</text><text x="424" y="181.1" font-size="16" fill="#10233c">Fuite trouvée au raccord de l&#x27;évaporateur</text><text x="424" y="210.8" font-size="16" fill="#10233c">Réparation pas aujourd&#x27;hui : la pièce est</text><text x="424" y="232.6" font-size="16" fill="#10233c">commandée</text><text x="424" y="262.4" font-size="16" fill="#10233c">Vous ne rechargez rien, vous ne récupérez</text><text x="424" y="284.1" font-size="16" fill="#10233c">rien</text>
  <rect x="30" y="326" width="740" height="144" rx="12" fill="#fff" stroke="#1e7e54" stroke-width="3"/>
  <text x="46" y="354" font-size="18" font-weight="bold" fill="#1e7e54">À faire sur la fiche vierge</text>
  <text x="46" y="382" font-size="16" fill="#10233c">1.  Remplissez les cadres qui doivent l&#x27;être.</text>
  <text x="46" y="408" font-size="16" fill="#10233c">2.  Dites quels cadres restent vides, et pourquoi.</text>
  <text x="46" y="434" font-size="16" fill="#10233c">3.  Calculez le tonnage équivalent CO2 : PRP × charge ÷ 1 000.</text>
  <text x="46" y="460" font-size="16" fill="#10233c">4.  Dites qui signe la fiche.</text>
</svg>
