<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-quatre-blocs" aria-describedby="d-quatre-blocs" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-quatre-blocs">Les 14 cadres du cerfa 15497, regroupés en quatre blocs</title>
  <desc id="d-quatre-blocs">Cinq bandes empilées. Bloc 1, trait plein : les cadres 1 à 4, qui, quoi, quand, toujours à remplir. Bloc 2, trait pointillé : les cadres 5 à 10, le contrôle d&#x27;étanchéité, dès que vous intervenez sur l&#x27;équipement. Bloc 3, trait tireté : le cadre 11, le fluide manipulé, dès que vous intervenez. Bloc 4, trait tireté et pointillé : les cadres 12 et 13, le déchet, seulement s&#x27;il y a un déchet de fluide. En bas : le cadre 14, les observations, et les signatures, toujours.</desc>
  
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">La fiche : 14 cadres, 4 blocs</text>
  <g><rect x="30" y="48" width="740" height="84" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><circle cx="54" cy="90" r="15" fill="#1b3a63"/><text x="54" y="96" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1</text><circle cx="88" cy="90" r="15" fill="#1b3a63"/><text x="88" y="96" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">2</text><circle cx="122" cy="90" r="15" fill="#1b3a63"/><text x="122" y="96" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">3</text><circle cx="156" cy="90" r="15" fill="#1b3a63"/><text x="156" y="96" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="252" y="78" font-size="17" font-weight="bold" fill="#10233c">Bloc 1 · Qui, quoi, quand</text><text x="252" y="102" font-size="16" fill="#10233c">opérateur, détenteur, équipement,</text><text x="252" y="122.0" font-size="16" fill="#10233c">nature</text><text x="560" y="82" font-size="16" font-weight="bold" fill="#1b3a63">Toujours</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.11;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="140" width="740" height="84" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="4" stroke-dasharray="2 7"/><circle cx="54" cy="182" r="15" fill="#0f766e"/><text x="54" y="188" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">5</text><circle cx="88" cy="182" r="15" fill="#0f766e"/><text x="88" y="188" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">6</text><circle cx="122" cy="182" r="15" fill="#0f766e"/><text x="122" y="188" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">7</text><circle cx="156" cy="182" r="15" fill="#0f766e"/><text x="156" y="188" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">8</text><circle cx="190" cy="182" r="15" fill="#0f766e"/><text x="190" y="188" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">9</text><circle cx="224" cy="182" r="15" fill="#0f766e"/><text x="224" y="188" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">10</text><text x="252" y="170" font-size="17" font-weight="bold" fill="#10233c">Bloc 2 · Contrôle d&#x27;étanchéité</text><text x="252" y="194" font-size="16" fill="#10233c">détecteur, tableau de charge, fuites</text><text x="560" y="174" font-size="16" font-weight="bold" fill="#0f766e">Dès que vous intervenez</text><text x="560" y="194.0" font-size="16" font-weight="bold" fill="#0f766e">sur l&#x27;équipement</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.25;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="232" width="740" height="84" rx="12" fill="#fdf1e6" stroke="#9a4d0c" stroke-width="3" stroke-dasharray="11 7"/><circle cx="54" cy="274" r="15" fill="#9a4d0c"/><text x="54" y="280" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">11</text><text x="252" y="262" font-size="17" font-weight="bold" fill="#10233c">Bloc 3 · Fluide manipulé</text><text x="252" y="286" font-size="16" fill="#10233c">chargé et récupéré, en kilogrammes</text><text x="560" y="266" font-size="16" font-weight="bold" fill="#9a4d0c">Dès que vous intervenez</text><text x="560" y="286.0" font-size="16" font-weight="bold" fill="#9a4d0c">sur l&#x27;équipement</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.39;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="324" width="740" height="84" rx="12" fill="#f8e6ee" stroke="#9d174d" stroke-width="3" stroke-dasharray="14 5 3 5"/><circle cx="54" cy="366" r="15" fill="#9d174d"/><text x="54" y="372" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">12</text><circle cx="88" cy="366" r="15" fill="#9d174d"/><text x="88" y="372" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">13</text><text x="252" y="354" font-size="17" font-weight="bold" fill="#10233c">Bloc 4 · Le déchet</text><text x="252" y="378" font-size="16" fill="#10233c">code UN, installation de destination</text><text x="560" y="358" font-size="16" font-weight="bold" fill="#9d174d">Seulement s&#x27;il y a un</text><text x="560" y="378.0" font-size="16" font-weight="bold" fill="#9d174d">déchet de fluide</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.53;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="416" width="740" height="58" rx="12" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><circle cx="54" cy="445" r="15" fill="#5a6b7d"/><text x="54" y="450" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">14</text><text x="82" y="451" font-size="16" font-weight="bold" fill="#10233c">Observations (si besoin)</text><text x="310" y="451" font-size="20" font-weight="bold" fill="#5a6b7d">+</text><text x="340" y="451" font-size="16" font-weight="bold" fill="#10233c">Signatures : opérateur et détenteur, toujours</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.67;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
