<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-bsff-cases" aria-describedby="d-bsff-cases" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-bsff-cases">Le bordereau BSFF dans Trackdéchets, case par case</title>
  <desc id="d-bsff-cases">Quatre onglets côte à côte. Un, le déchet : émetteur opérateur, code 14 06 01 étoile, code UN, contenant et quantité. Deux, émetteur et détenteur : votre SIRET, puis pour chaque fiche son numéro, la quantité retirée, le code postal du lieu et le SIRET du détenteur. Trois, le transporteur : SIRET, mode de transport, plaque. Quatre, la destination : l&#x27;entreprise qui reçoit, un contact, le code de traitement. Puis on clique sur Créer, et trois signatures se suivent : l&#x27;émetteur, le transporteur, l&#x27;installation de destination.</desc>
  <defs><marker id="mbsff-cases1e7e54" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e7e54"/></marker><marker id="mbsff-cases3730a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3730a3"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="28" font-size="20" font-weight="bold" fill="#10233c" text-anchor="middle">Le BSFF dans Trackdéchets : quatre onglets, puis trois signatures</text>
  <g><rect x="20" y="44" width="184" height="292" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><rect x="20" y="44" width="184" height="56" rx="12" fill="#1b3a63"/><text x="32" y="68" font-size="17" font-weight="bold" fill="#fff">1 · Déchet</text><text x="32" y="124" font-size="16" fill="#10233c">Émetteur : opérateur</text><text x="32" y="149.8" font-size="16" fill="#10233c">Code : 14 06 01*</text><text x="32" y="175.6" font-size="16" fill="#10233c">Code UN 1078,</text><text x="32" y="196.4" font-size="16" fill="#10233c">comme le cadre 12</text><text x="32" y="222.2" font-size="16" fill="#10233c">Contenant : n° de la</text><text x="32" y="243.0" font-size="16" fill="#10233c">bouteille et 3,8 kg</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.11;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="216" y="44" width="184" height="292" rx="12" fill="#fff" stroke="#9a4d0c" stroke-width="3" stroke-dasharray="10 7"/><rect x="216" y="44" width="184" height="56" rx="12" fill="#9a4d0c"/><text x="228" y="68" font-size="17" font-weight="bold" fill="#fff">2 · Émetteur et</text><text x="228" y="88.4" font-size="17" font-weight="bold" fill="#fff">détenteur</text><text x="228" y="124" font-size="16" fill="#10233c">Votre SIRET et vos</text><text x="228" y="144.8" font-size="16" fill="#10233c">coordonnées</text><text x="228" y="170.6" font-size="16" fill="#10233c">Puis, pour chaque</text><text x="228" y="191.4" font-size="16" fill="#10233c">fiche :</text><text x="228" y="217.2" font-size="16" fill="#10233c">n° de la fiche</text><text x="228" y="243.0" font-size="16" fill="#10233c">quantité retirée (kg)</text><text x="228" y="268.8" font-size="16" fill="#10233c">code postal du lieu</text><text x="228" y="294.6" font-size="16" fill="#10233c">SIRET du détenteur</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.23;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="412" y="44" width="184" height="292" rx="12" fill="#fff" stroke="#0f766e" stroke-width="3" stroke-dasharray="2 7"/><rect x="412" y="44" width="184" height="56" rx="12" fill="#0f766e"/><text x="424" y="68" font-size="17" font-weight="bold" fill="#fff">3 · Transporteur</text><text x="424" y="124" font-size="16" fill="#10233c">SIRET du</text><text x="424" y="144.8" font-size="16" fill="#10233c">transporteur</text><text x="424" y="170.6" font-size="16" fill="#10233c">mode de transport</text><text x="424" y="196.4" font-size="16" fill="#10233c">plaque</text><text x="424" y="217.2" font-size="16" fill="#10233c">d&#x27;immatriculation</text><text x="424" y="243.0" font-size="16" fill="#10233c">Si vous transportez</text><text x="424" y="263.8" font-size="16" fill="#10233c">vous-même : vous</text><text x="424" y="284.6" font-size="16" fill="#10233c">figurez ici aussi</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.35;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="608" y="44" width="184" height="292" rx="12" fill="#fff" stroke="#9d174d" stroke-width="3" stroke-dasharray="14 5 3 5"/><rect x="608" y="44" width="184" height="56" rx="12" fill="#9d174d"/><text x="620" y="68" font-size="17" font-weight="bold" fill="#fff">4 · Destination</text><text x="620" y="124" font-size="16" fill="#10233c">L&#x27;entreprise qui</text><text x="620" y="144.8" font-size="16" fill="#10233c">reçoit (SIRET)</text><text x="620" y="170.6" font-size="16" fill="#10233c">un contact</text><text x="620" y="196.4" font-size="16" fill="#10233c">code de traitement, à</text><text x="620" y="217.2" font-size="16" fill="#10233c">choisir dans la liste</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.47;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="20" y="354" width="200" height="112" rx="12" fill="#e8e6f6" stroke="#3730a3" stroke-width="3"/><text x="120" y="392" font-size="20" font-weight="bold" fill="#3730a3" text-anchor="middle">5 · Créer</text><text x="120" y="422" font-size="17" fill="#10233c" text-anchor="middle">puis signer</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.54;0.6;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M222,410 H262" fill="none" stroke="#3730a3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbsff-cases3730a3)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.63;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="266" y="354" width="140" height="112" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text x="278" y="384" font-size="17" font-weight="bold" fill="#1e7e54">Émetteur</text><text x="278" y="410" font-size="16" fill="#10233c">à l&#x27;enlèvement</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.7;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="428" y="354" width="140" height="112" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text x="440" y="384" font-size="17" font-weight="bold" fill="#1e7e54">Transporteur</text><text x="440" y="410" font-size="16" fill="#10233c">à l&#x27;enlèvement</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.8;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="590" y="354" width="190" height="112" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text x="602" y="384" font-size="17" font-weight="bold" fill="#1e7e54">Destination</text><text x="602" y="410" font-size="16" fill="#10233c">réception, acceptation,</text><text x="602" y="430.8" font-size="16" fill="#10233c">traitement</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.9;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M410,410 H424" fill="none" stroke="#1e7e54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbsff-cases1e7e54)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.76;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M572,410 H586" fill="none" stroke="#1e7e54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbsff-cases1e7e54)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.86;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
