<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-logiciel" aria-describedby="d-logiciel" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-logiciel">S&#x27;entraîner avec le logiciel inerWeb Fluide</title>
  <desc id="d-logiciel">Un parcours en trois étapes. Un : la démonstration d&#x27;inerWeb Fluide, avec des données fictives. Deux : le bouton Nouveau mouvement, un assistant en six étapes : Type, Machine, Bouteille, Pesées, Contrôle, Signature. Trois : le bouton Visualiser CERFA, qui montre la fiche remplie, à comparer avec la vôtre. En bas, un encadré orange tireté : le logiciel ne fait pas le bordereau BSFF ; son menu Déchets tient un suivi interne, et le vrai bordereau se fait dans Trackdéchets.</desc>
  <defs><marker id="mlogiciel1b3a63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b3a63"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">S&#x27;entraîner avec inerWeb Fluide</text>
  <g><rect x="30" y="48" width="230" height="130" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><text x="44" y="77.3" font-size="18" font-weight="bold" fill="#1b3a63">1 · La démonstration</text><text x="44" y="101.8" font-size="16" fill="#10233c">données fictives, rien ne</text><text x="44" y="123.6" font-size="16" fill="#10233c">sort de votre navigateur</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.09;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M262,113 H290" fill="none" stroke="#1b3a63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mlogiciel1b3a63)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.13;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="294" y="48" width="230" height="130" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text x="308" y="77.3" font-size="18" font-weight="bold" fill="#1b3a63">2 · Nouveau</text><text x="308" y="99.8" font-size="18" font-weight="bold" fill="#1b3a63">mouvement</text><text x="308" y="124.3" font-size="16" fill="#10233c">un assistant en 6 étapes</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.13;0.2;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M526,113 H554" fill="none" stroke="#1b3a63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mlogiciel1b3a63)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.21;0.24;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="558" y="48" width="212" height="130" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text x="572" y="77.3" font-size="18" font-weight="bold" fill="#1b3a63">3 · Visualiser CERFA</text><text x="572" y="101.8" font-size="16" fill="#10233c">la fiche, remplie : à</text><text x="572" y="123.6" font-size="16" fill="#10233c">comparer avec la vôtre</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.31;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="198" width="114" height="44" rx="8" fill="#e6f2ef" stroke="#0f766e" stroke-width="2.5"/><text x="87" y="226" font-size="16" font-weight="bold" fill="#0f766e" text-anchor="middle">1 Type</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.38;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="152" y="198" width="114" height="44" rx="8" fill="#e6f2ef" stroke="#0f766e" stroke-width="2.5"/><text x="209" y="226" font-size="16" font-weight="bold" fill="#0f766e" text-anchor="middle">2 Machine</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.44;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="274" y="198" width="114" height="44" rx="8" fill="#e6f2ef" stroke="#0f766e" stroke-width="2.5"/><text x="331" y="226" font-size="16" font-weight="bold" fill="#0f766e" text-anchor="middle">3 Bouteille</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.5;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="396" y="198" width="114" height="44" rx="8" fill="#e6f2ef" stroke="#0f766e" stroke-width="2.5"/><text x="453" y="226" font-size="16" font-weight="bold" fill="#0f766e" text-anchor="middle">4 Pesées</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.56;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="518" y="198" width="114" height="44" rx="8" fill="#e6f2ef" stroke="#0f766e" stroke-width="2.5"/><text x="575" y="226" font-size="16" font-weight="bold" fill="#0f766e" text-anchor="middle">5 Contrôle</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.62;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="640" y="198" width="114" height="44" rx="8" fill="#e6f2ef" stroke="#0f766e" stroke-width="2.5"/><text x="697" y="226" font-size="16" font-weight="bold" fill="#0f766e" text-anchor="middle">6 Signature</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.68;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="268" width="740" height="196" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3.5" stroke-dasharray="11 7"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="12s" repeatCount="indefinite"/></g>
  <g><text x="48" y="300" font-size="18" font-weight="bold" fill="#9a4d0c">Attention : le logiciel ne fait pas le bordereau BSFF.</text><text x="48" y="330" font-size="16" fill="#10233c">Son menu « Déchets / remise en filière » tient un suivi INTERNE.</text><text x="48" y="356.8" font-size="16" fill="#10233c">Le vrai bordereau se fait dans Trackdéchets.</text><text x="48" y="383.6" font-size="16" fill="#10233c">Vous reportez ensuite son numéro dans le logiciel.</text><text x="48" y="410.4" font-size="16" fill="#10233c">Ce qui sort de la démonstration porte le filigrane FORMATION.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.82;1" dur="12s" repeatCount="indefinite"/></g>
  <circle r="8" fill="#1b3a63" opacity="0" cx="0" cy="0"><animateMotion path="M262,113 H290" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.08;0.14;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.1;0.13;0.15;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle r="8" fill="#1b3a63" opacity="0" cx="0" cy="0"><animateMotion path="M526,113 H554" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2;0.26;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></circle>
</svg>
