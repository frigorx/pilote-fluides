<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-deux-moments" aria-describedby="d-deux-moments" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-deux-moments">Deux papiers, deux moments</title>
  <desc id="d-deux-moments">Un parcours de gauche à droite. Vous intervenez sur l&#x27;équipement. La fiche d&#x27;intervention, cerfa 15497, se remplit à chaque fois, en trait plein bleu. Puis une question : du fluide devient-il un déchet, c&#x27;est-à-dire part-il en bouteille de récupération vers le traitement ? Si oui, en haut, en trait tireté orange : un bordereau BSFF dans Trackdéchets. Si non, en bas, en vert : pas de bordereau, le fluide reste dans la machine. Dans l&#x27;animation, une goutte suit chaque chemin tour à tour.</desc>
  <defs><marker id="mdeux-moments1b3a63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b3a63"/></marker><marker id="mdeux-moments1e7e54" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e7e54"/></marker><marker id="mdeux-momentse8914a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8914a"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="34" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">Deux papiers, deux moments</text>
  <g><rect x="30" y="180" width="200" height="140" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><text x="44" y="209.3" font-size="18" font-weight="bold" fill="#1b3a63">Vous intervenez</text><text x="44" y="233.8" font-size="16" fill="#10233c">sur l&#x27;équipement :</text><text x="44" y="255.6" font-size="16" fill="#10233c">charge, entretien, mise</text><text x="44" y="277.3" font-size="16" fill="#10233c">en service, contrôle</text><text x="44" y="299.1" font-size="16" fill="#10233c">d&#x27;étanchéité</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.08;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M232,250 H266" fill="none" stroke="#1b3a63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mdeux-moments1b3a63)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.13;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="270" y="180" width="220" height="140" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="4"/><text x="284" y="209.3" font-size="18" font-weight="bold" fill="#1b3a63">Fiche d&#x27;intervention</text><text x="284" y="233.8" font-size="16" fill="#10233c">cerfa 15497 : à chaque</text><text x="284" y="255.6" font-size="16" fill="#10233c">fois, papier ou PDF</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.2;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M492,250 H536" fill="none" stroke="#1b3a63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mdeux-moments1b3a63)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.21;0.25;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="540" y="180" width="230" height="140" rx="12" fill="#fff" stroke="#5a6b7d" stroke-width="3"/><text x="554" y="209.3" font-size="18" font-weight="bold" fill="#10233c">Du fluide devient-il</text><text x="554" y="231.8" font-size="18" font-weight="bold" fill="#10233c">un déchet ?</text><text x="554" y="256.3" font-size="16" fill="#10233c">il part en bouteille vers le</text><text x="554" y="278.1" font-size="16" fill="#10233c">traitement</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.32;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M655,178 V152" fill="none" stroke="#e8914a" stroke-width="4" stroke-dasharray="10 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mdeux-momentse8914a)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.44;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="540" y="44" width="230" height="106" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3" stroke-dasharray="10 7"/><text x="554" y="73.3" font-size="18" font-weight="bold" fill="#9a4d0c">OUI : bordereau BSFF</text><text x="554" y="97.8" font-size="16" fill="#10233c">dans Trackdéchets</text><text x="554" y="119.6" font-size="16" fill="#10233c">(internet)</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.5;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M655,322 V348" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mdeux-moments1e7e54)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.72;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="540" y="350" width="230" height="106" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/><text x="554" y="379.3" font-size="18" font-weight="bold" fill="#1e7e54">NON : pas de</text><text x="554" y="401.8" font-size="18" font-weight="bold" fill="#1e7e54">bordereau</text><text x="554" y="426.3" font-size="16" fill="#10233c">le fluide reste dans la</text><text x="554" y="448.1" font-size="16" fill="#10233c">machine</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="12s" repeatCount="indefinite"/></g>
  <circle r="8" fill="#1b3a63" opacity="0" cx="0" cy="0"><animateMotion path="M232,250 H266" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.08;0.12;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.1;0.11;0.13;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle r="8" fill="#1b3a63" opacity="0" cx="0" cy="0"><animateMotion path="M492,250 H536" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2;0.24;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle r="8" fill="#e8914a" opacity="0" cx="0" cy="0"><animateMotion path="M655,320 V152" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.34;0.46;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.36;0.45;0.47;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle r="8" fill="#1e7e54" opacity="0" cx="0" cy="0"><animateMotion path="M655,322 V348" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.62;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.69;0.71;1" dur="12s" repeatCount="indefinite"/></circle>
  <rect x="30" y="358" width="460" height="98" rx="12" fill="#fff" stroke="#5a6b7d" stroke-width="2"/>
  <text x="46" y="386" font-size="16" font-weight="bold" fill="#1b3a63">Trait plein bleu : la fiche, toujours.</text>
  <text x="46" y="412" font-size="16" fill="#9a4d0c">Trait tireté orange : le bordereau, seulement s&#x27;il y a un déchet.</text>
  <text x="46" y="438" font-size="16" fill="#1e7e54">Trait vert : pas de déchet, pas de bordereau.</text>
</svg>
