<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img"
     aria-labelledby="t-hi" aria-describedby="d-hi" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-hi">La hiérarchie de protection, sur une ligne de pression croissante</title>
  <desc id="d-hi">Une ligne horizontale représente la pression, croissante de gauche à droite, sans
    aucune graduation chiffrée. Un premier repère bleu, plus tôt sur la ligne, marque le pressostat
    de sécurité : c'est là qu'il coupe le fonctionnement. Plus loin, un second repère vert marque la
    soupape de sûreté : c'est là qu'elle s'ouvre, en dernier recours. Tout à droite, un trait rouge
    marque la limite de l'équipement, sa PS, à ne jamais atteindre. Une note rappelle que le
    pressostat agit normalement avant que la soupape n'ait besoin de s'ouvrir.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; }
    .lbl  { font-size:15px; fill:#10233c; }
    .note { font-size:15px; fill:#5a6b7d; font-style:italic; }
    .axe  { font-size:15px; fill:#5a6b7d; }
  </style>

  <!-- La ligne de pression, croissante -->
  <line x1="60" y1="200" x2="820" y2="200" stroke="#10233c" stroke-width="4"/>
  <polygon points="820,200 800,192 800,208" fill="#10233c"/>
  <text class="axe" x="60" y="230">pression basse</text>
  <text class="axe" x="820" y="230" text-anchor="end">pression croissante →</text>

  <!-- Repère 1 : le pressostat -->
  <line x1="320" y1="160" x2="320" y2="240" stroke="#1b3a63" stroke-width="4"/>
  <circle cx="320" cy="200" r="9" fill="#1b3a63"/>
  <rect x="200" y="70" width="240" height="70" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/>
  <text class="ttl" x="320" y="98" text-anchor="middle" fill="#1b3a63">Le pressostat coupe</text>
  <text class="lbl" x="320" y="122" text-anchor="middle">il agit tôt : le fonctionnement</text>
  <text class="lbl" x="320" y="142" text-anchor="middle">s'arrête ici</text>
  <line x1="320" y1="140" x2="320" y2="160" stroke="#1b3a63" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Repère 2 : la soupape -->
  <line x1="600" y1="160" x2="600" y2="240" stroke="#1e7e54" stroke-width="4"/>
  <circle cx="600" cy="200" r="9" fill="#1e7e54"/>
  <rect x="480" y="240" width="240" height="70" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2"/>
  <text class="ttl" x="600" y="268" text-anchor="middle" fill="#1e7e54">La soupape protège</text>
  <text class="lbl" x="600" y="292" text-anchor="middle">en dernier recours,</text>
  <text class="lbl" x="600" y="312" text-anchor="middle">si la pression est montée trop haut</text>

  <!-- Limite de l'équipement : la PS -->
  <line x1="800" y1="150" x2="800" y2="250" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 6"/>
  <text class="ttl" x="800" y="138" text-anchor="middle" fill="#c0392b">limite (PS)</text>

  <text class="note" x="450" y="345" text-anchor="middle">Normalement, le pressostat agit avant que la soupape n'ait besoin de s'ouvrir</text>
</svg>
