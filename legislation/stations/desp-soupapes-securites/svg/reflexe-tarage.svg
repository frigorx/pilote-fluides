<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-rf" aria-describedby="d-rf" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-rf">Le réflexe : comparer le tarage à la PS</title>
  <desc id="d-rf">À gauche, une carte d'accessoire de sécurité portant son tarage. À droite, la
    plaque de l'équipement portant sa PS. Une flèche à double sens entre les deux porte le réflexe
    professionnel : toujours comparer le tarage indiqué sur l'accessoire à la PS inscrite sur la
    plaque de l'équipement. Une bande en bas résume les trois familles d'accessoires et la
    hiérarchie entre pressostat et soupape.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fffdf8; }
    .lbl  { font-size:15px; fill:#10233c; }
    .band { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
    .refl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#0c4a6e; }
  </style>

  <!-- Carte accessoire -->
  <rect x="30" y="30" width="330" height="150" rx="14" fill="#fffdf8" stroke="#b06a00" stroke-width="3"/>
  <rect x="30" y="30" width="330" height="40" rx="14" fill="#b06a00"/>
  <rect x="30" y="56" width="330" height="14" fill="#b06a00"/>
  <text class="ttl" x="195" y="56" text-anchor="middle">ACCESSOIRE DE SÉCURITÉ</text>
  <text class="lbl" x="195" y="110" text-anchor="middle">son tarage,</text>
  <text class="lbl" x="195" y="132" text-anchor="middle">indiqué sur l'accessoire</text>

  <!-- Flèche double sens -->
  <line x1="390" y1="105" x2="510" y2="105" stroke="#0c4a6e" stroke-width="4"/>
  <polygon points="390,105 408,95 408,115" fill="#0c4a6e"/>
  <polygon points="510,105 492,95 492,115" fill="#0c4a6e"/>
  <text class="refl" x="450" y="87" text-anchor="middle">comparer</text>

  <!-- Plaque équipement -->
  <rect x="540" y="30" width="330" height="150" rx="14" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <rect x="540" y="30" width="330" height="40" rx="14" fill="#0c4a6e"/>
  <rect x="540" y="56" width="330" height="14" fill="#0c4a6e"/>
  <text class="ttl" x="705" y="56" text-anchor="middle">PLAQUE DE L'ÉQUIPEMENT</text>
  <text class="lbl" x="705" y="110" text-anchor="middle">sa PS,</text>
  <text class="lbl" x="705" y="132" text-anchor="middle">la pression maximale admissible</text>

  <!-- Bande de synthèse -->
  <rect x="30" y="210" width="840" height="100" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="450" y="238" text-anchor="middle">Soupape (évacue), pressostat (coupe, sans évacuer), disque de rupture (cède d'un coup)</text>
  <text class="band" x="450" y="262" text-anchor="middle">Le pressostat agit avant que la soupape n'ait besoin de s'ouvrir</text>
  <text class="band" x="450" y="292" text-anchor="middle" fill="#0c4a6e">Le réflexe : comparer le tarage de l'accessoire à la PS de la plaque de l'équipement</text>
</svg>
