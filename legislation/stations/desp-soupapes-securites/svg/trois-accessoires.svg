<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"
     aria-labelledby="t-3ac" aria-describedby="d-3ac" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-3ac">Trois accessoires de sécurité, un même rôle</title>
  <desc id="d-3ac">Au centre, un équipement sous pression portant une plaque PS. Trois cartes
    l'entourent, chacune reliée à l'équipement par un trait : à gauche la soupape de sûreté, au
    centre le pressostat de sécurité, à droite le disque de rupture. Une bande en bas rappelle que
    les trois accessoires protègent le même équipement contre le dépassement de sa PS.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#0c4a6e; }
    .lbl  { font-size:15px; fill:#10233c; }
    .eqt  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fffdf8; }
    .band { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
  </style>

  <!-- L'équipement, au centre -->
  <rect x="345" y="20" width="210" height="100" rx="14" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <text class="eqt" x="450" y="20" dy="26" text-anchor="middle" fill="#0c4a6e">ÉQUIPEMENT</text>
  <text class="lbl" x="450" y="74" text-anchor="middle">sous pression</text>
  <rect x="405" y="90" width="90" height="30" rx="8" fill="#0c4a6e"/>
  <text class="eqt" x="450" y="111" text-anchor="middle">PS</text>

  <!-- Traits de liaison -->
  <line x1="345" y1="118" x2="150" y2="180" stroke="#5a6b7d" stroke-width="2"/>
  <line x1="450" y1="120" x2="450" y2="180" stroke="#5a6b7d" stroke-width="2"/>
  <line x1="555" y1="118" x2="750" y2="180" stroke="#5a6b7d" stroke-width="2"/>

  <!-- Carte 1 : la soupape -->
  <rect x="20" y="180" width="260" height="150" rx="14" fill="#fffdf8" stroke="#1e7e54" stroke-width="3"/>
  <text class="ttl" x="150" y="208" text-anchor="middle">La soupape de sûreté</text>
  <!-- icône : corps + clapet + flèche d'échappement -->
  <rect x="130" y="222" width="40" height="30" fill="none" stroke="#1e7e54" stroke-width="2.5"/>
  <line x1="150" y1="252" x2="150" y2="272" stroke="#1e7e54" stroke-width="4"/>
  <polygon points="150,205 138,222 162,222" fill="none" stroke="#1e7e54" stroke-width="2.5"/>
  <text class="lbl" x="150" y="300" text-anchor="middle">mécanique — s'ouvre,</text>
  <text class="lbl" x="150" y="320" text-anchor="middle">évacue, se referme</text>

  <!-- Carte 2 : le pressostat -->
  <rect x="320" y="180" width="260" height="150" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="ttl" x="450" y="208" text-anchor="middle">Le pressostat de sécurité</text>
  <!-- icône : contact électrique -->
  <circle cx="425" cy="245" r="6" fill="#1b3a63"/>
  <circle cx="475" cy="245" r="6" fill="#1b3a63"/>
  <line x1="431" y1="245" x2="469" y2="225" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="lbl" x="450" y="300" text-anchor="middle">électrique — coupe</text>
  <text class="lbl" x="450" y="320" text-anchor="middle">le fonctionnement</text>

  <!-- Carte 3 : le disque de rupture -->
  <rect x="620" y="180" width="260" height="150" rx="14" fill="#fffdf8" stroke="#b06a00" stroke-width="3"/>
  <text class="ttl" x="750" y="208" text-anchor="middle">Le disque de rupture</text>
  <!-- icône : membrane -->
  <circle cx="750" cy="240" r="18" fill="none" stroke="#b06a00" stroke-width="2.5"/>
  <line x1="732" y1="240" x2="768" y2="240" stroke="#b06a00" stroke-width="2.5"/>
  <text class="lbl" x="750" y="300" text-anchor="middle">membrane calibrée —</text>
  <text class="lbl" x="750" y="320" text-anchor="middle">cède d'un coup</text>

  <!-- Bande du bas -->
  <rect x="20" y="350" width="860" height="38" rx="12" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="450" y="374" text-anchor="middle">Trois familles, un même rôle : protéger l'équipement contre le dépassement de sa PS</text>
</svg>
