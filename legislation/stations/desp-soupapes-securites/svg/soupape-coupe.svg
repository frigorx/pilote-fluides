<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"
     aria-labelledby="t-sp" aria-describedby="d-sp" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-sp">La soupape de sûreté, fermée puis ouverte</title>
  <desc id="d-sp">Deux coupes schématiques côte à côte. À gauche, la soupape fermée : sous le seuil
    de tarage, un ressort presse le clapet sur son siège, la pression monte dessous sans
    s'échapper. À droite, la soupape ouverte : au-delà du seuil, le clapet est soulevé, un espace
    apparaît au siège, et l'excès de pression s'évacue vers le haut. Une bande en bas rappelle
    qu'elle se referme d'elle-même quand la pression redescend, et une note cite l'exemple d'une
    bouteille de fluide frigorigène ou d'un réservoir.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fffdf8; }
    .lbl  { font-size:15px; fill:#10233c; }
    .band { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .note { font-size:15px; fill:#5a6b7d; font-style:italic; }
  </style>

  <!-- Panneau gauche : fermée -->
  <rect x="20" y="20" width="410" height="250" rx="14" fill="#fffdf8" stroke="#1e7e54" stroke-width="3"/>
  <rect x="20" y="20" width="410" height="40" rx="14" fill="#1e7e54"/>
  <rect x="20" y="46" width="410" height="14" fill="#1e7e54"/>
  <text class="ttl" x="225" y="47" text-anchor="middle">FERMÉE — sous le seuil de tarage</text>

  <!-- tuyau -->
  <rect x="205" y="210" width="40" height="50" fill="none" stroke="#5a6b7d" stroke-width="2.5"/>
  <!-- corps de soupape -->
  <rect x="180" y="130" width="90" height="80" fill="none" stroke="#10233c" stroke-width="2.5"/>
  <!-- ressort -->
  <path d="M225 90 v14 l-10 6 l20 8 l-20 8 l20 8 l-10 6" fill="none" stroke="#10233c" stroke-width="2.5"/>
  <rect x="205" y="70" width="40" height="20" fill="none" stroke="#10233c" stroke-width="2.5"/>
  <!-- clapet fermé sur son siège : ligne continue, pas d'espace -->
  <line x1="188" y1="152" x2="262" y2="152" stroke="#10233c" stroke-width="4"/>
  <rect x="200" y="140" width="50" height="12" fill="#5a6b7d"/>
  <!-- flèche pression, s'arrête au clapet -->
  <line x1="225" y1="260" x2="225" y2="160" stroke="#1b3a63" stroke-width="3"/>
  <polygon points="225,152 217,168 233,168" fill="#1b3a63"/>
  <text class="lbl" x="130" y="240" text-anchor="middle">pression</text>
  <text class="lbl" x="130" y="258" text-anchor="middle">en dessous</text>
  <text class="lbl" x="330" y="150" text-anchor="middle">clapet posé</text>
  <text class="lbl" x="330" y="168" text-anchor="middle">sur le siège</text>

  <!-- Panneau droit : ouverte -->
  <rect x="470" y="20" width="410" height="250" rx="14" fill="#fffdf8" stroke="#c0392b" stroke-width="3"/>
  <rect x="470" y="20" width="410" height="40" rx="14" fill="#c0392b"/>
  <rect x="470" y="46" width="410" height="14" fill="#c0392b"/>
  <text class="ttl" x="675" y="47" text-anchor="middle">OUVERTE — au-delà du seuil</text>

  <rect x="655" y="210" width="40" height="50" fill="none" stroke="#5a6b7d" stroke-width="2.5"/>
  <rect x="630" y="130" width="90" height="80" fill="none" stroke="#10233c" stroke-width="2.5"/>
  <!-- ressort comprimé -->
  <path d="M675 96 v8 l-10 5 l20 6 l-20 6 l20 6 l-10 5" fill="none" stroke="#10233c" stroke-width="2.5"/>
  <rect x="655" y="80" width="40" height="16" fill="none" stroke="#10233c" stroke-width="2.5"/>
  <!-- clapet soulevé : espace visible au siège -->
  <line x1="638" y1="168" x2="712" y2="168" stroke="#10233c" stroke-width="4"/>
  <rect x="650" y="140" width="50" height="12" fill="#5a6b7d"/>
  <!-- flèches d'évacuation, échappant vers le haut, hors du clapet -->
  <line x1="675" y1="260" x2="675" y2="150" stroke="#1b3a63" stroke-width="3"/>
  <line x1="655" y1="130" x2="640" y2="70" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="640,60 632,80 649,76" fill="#c0392b"/>
  <line x1="695" y1="130" x2="710" y2="70" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="710,60 702,80 719,76" fill="#c0392b"/>
  <text class="lbl" x="760" y="80" text-anchor="middle">évacuation</text>
  <text class="lbl" x="580" y="240" text-anchor="middle">pression</text>
  <text class="lbl" x="580" y="258" text-anchor="middle">en dessous</text>

  <!-- Bande du bas -->
  <rect x="20" y="290" width="860" height="52" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="450" y="313" text-anchor="middle">Elle s'ouvre au-delà du seuil de tarage, laisse échapper l'excès</text>
  <text class="band" x="450" y="333" text-anchor="middle">puis se referme d'elle-même quand la pression redescend</text>

  <text class="note" x="450" y="378" text-anchor="middle">Exemple : la soupape d'une bouteille de fluide frigorigène ou d'un réservoir</text>
</svg>
