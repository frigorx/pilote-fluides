<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-cmp" aria-describedby="d-cmp" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-cmp">Comparatif des trois accessoires de sécurité</title>
  <desc id="d-cmp">Un tableau à trois colonnes, une par accessoire : la soupape de sûreté, le
    pressostat de sécurité, le disque de rupture. Trois lignes comparent leur mécanisme, s'ils
    évacuent de la matière, et s'ils se referment après usage. La soupape est mécanique, évacue et
    se referme d'elle-même. Le pressostat est électrique, n'évacue rien et se referme d'elle-même
    quand la pression redescend. Le disque de rupture est une membrane, évacue d'un coup et ne se
    referme pas — il doit être remplacé.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#fffdf8; }
    .crit { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:15px; fill:#10233c; }
    .lbl  { font-size:15px; fill:#10233c; }
  </style>

  <!-- Colonne des critères -->
  <rect x="20" y="60" width="180" height="220" fill="#eef3f9" stroke="#2f5689" stroke-width="1.5"/>
  <text class="crit" x="35" y="110">Mécanisme</text>
  <text class="crit" x="35" y="170">Évacue de</text>
  <text class="crit" x="35" y="188">la matière</text>
  <text class="crit" x="35" y="248">Se referme</text>
  <text class="crit" x="35" y="266">après usage</text>

  <!-- En-têtes des trois accessoires -->
  <rect x="200" y="20" width="220" height="40" fill="#1e7e54"/>
  <text class="ttl" x="310" y="45" text-anchor="middle">Soupape</text>
  <rect x="420" y="20" width="220" height="40" fill="#1b3a63"/>
  <text class="ttl" x="530" y="45" text-anchor="middle">Pressostat</text>
  <rect x="640" y="20" width="220" height="40" fill="#b06a00"/>
  <text class="ttl" x="750" y="45" text-anchor="middle">Disque de rupture</text>

  <!-- Grille -->
  <rect x="200" y="60" width="220" height="220" fill="#fffdf8" stroke="#d6dee7" stroke-width="1.5"/>
  <rect x="420" y="60" width="220" height="220" fill="#fffdf8" stroke="#d6dee7" stroke-width="1.5"/>
  <rect x="640" y="60" width="220" height="220" fill="#fffdf8" stroke="#d6dee7" stroke-width="1.5"/>
  <line x1="200" y1="140" x2="860" y2="140" stroke="#d6dee7" stroke-width="1.5"/>
  <line x1="200" y1="220" x2="860" y2="220" stroke="#d6dee7" stroke-width="1.5"/>

  <!-- Ligne 1 : mécanisme -->
  <text class="lbl" x="310" y="105" text-anchor="middle">mécanique</text>
  <text class="lbl" x="530" y="105" text-anchor="middle">électrique</text>
  <text class="lbl" x="750" y="105" text-anchor="middle">membrane</text>

  <!-- Ligne 2 : évacue -->
  <text class="lbl" x="310" y="185" text-anchor="middle">oui</text>
  <text class="lbl" x="530" y="185" text-anchor="middle">non</text>
  <text class="lbl" x="750" y="185" text-anchor="middle">oui, d'un coup</text>

  <!-- Ligne 3 : se referme -->
  <text class="lbl" x="310" y="255" text-anchor="middle">oui, seule</text>
  <text class="lbl" x="530" y="255" text-anchor="middle">oui, seul</text>
  <text class="lbl" x="750" y="255" text-anchor="middle">non — à remplacer</text>

  <text class="lbl" x="450" y="316" text-anchor="middle" font-style="italic" fill="#5a6b7d">Trois mécanismes différents, un même objectif : ne jamais dépasser la PS</text>
</svg>
