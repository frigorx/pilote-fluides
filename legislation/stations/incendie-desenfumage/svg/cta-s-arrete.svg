<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-f7" aria-describedby="d-f7" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-f7">Le désenfumage démarre, la ventilation de confort s'arrête</title>
  <desc id="d-f7">À gauche, en haut, un cadre du système de sécurité incendie qui donne l'ordre d'arrêt. Une
    flèche en tirets descend vers une centrale de traitement d'air dont l'hélice s'arrête. Un conduit
    horizontal relie la centrale à un local ; un clapet télécommandé s'y ferme. Le local, à droite, porte
    une couche de fumée sous le plafond et un conduit d'extraction au-dessus, avec une flèche rouge qui
    monte et un ventilateur. L'animation montre la centrale qui tourne d'abord, avec des flèches d'air
    dans le conduit, puis l'ordre du système de sécurité incendie : l'hélice ralentit et s'arrête, les
    flèches d'air disparaissent, le clapet se ferme, et l'extraction des fumées s'établit. L'image fixe
    montre cet état final.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .lbl { font-size:17px; fill:#10233c; }
    .bd  { font-weight:bold; font-size:17px; fill:#10233c; }
    .cap { font-weight:bold; font-size:18px; fill:#10233c; }
  </style>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text class="ttl" x="400" y="36" text-anchor="middle">L'ordre arrive : la CTA s'arrête, le désenfumage travaille</text>

  <!-- SSI -->
  <rect x="40" y="70" width="210" height="60" rx="10" fill="#fdecea" stroke="#b91c1c" stroke-width="3.5">
    <animate attributeName="fill" values="#eef3f9;#eef3f9;#fdecea;#fdecea" keyTimes="0;0.26;0.3;1" dur="13s" repeatCount="indefinite"/>
  </rect>
  <text class="bd" x="145" y="106" text-anchor="middle">SSI : ordre d'arrêt</text>
  <line x1="145" y1="132" x2="145" y2="178" stroke="#b91c1c" stroke-width="4" stroke-dasharray="9 6"/>
  <polygon points="145,196 135,176 155,176" fill="#b91c1c"/>

  <!-- CTA -->
  <rect x="40" y="200" width="210" height="130" rx="10" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <circle cx="145" cy="265" r="38" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <g>
    <path d="M145,265 L145,232 M145,265 L174,282 M145,265 L116,282" stroke="#1b3a63" stroke-width="5" fill="none" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" additive="replace" values="0 145 265;1440 145 265;1440 145 265" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.15 0.5 0.4 1;0 0 1 1" dur="13s" repeatCount="indefinite"/>
  </g>
  <text class="bd" x="145" y="358" text-anchor="middle">CTA</text>
  <text class="lbl" x="145" y="380" text-anchor="middle">ventilation de confort</text>

  <!-- conduit vers le local -->
  <rect x="250" y="245" width="290" height="40" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <!-- flèches d'air : présentes au début, disparues à l'arrêt -->
  <g opacity="0">
    <path d="M280,265 H310 M300,255 L312,265 L300,275" stroke="#2f5689" stroke-width="4" fill="none"/>
    <path d="M330,265 H360 M350,255 L362,265 L350,275" stroke="#2f5689" stroke-width="4" fill="none"/>
    <path d="M440,265 H470 M460,255 L472,265 L460,275" stroke="#2f5689" stroke-width="4" fill="none"/>
    <path d="M490,265 H520 M510,255 L522,265 L510,275" stroke="#2f5689" stroke-width="4" fill="none"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.42;1" dur="13s" repeatCount="indefinite"/>
  </g>
  <!-- clapet télécommandé : fermé à la fin -->
  <rect x="386" y="242" width="8" height="46" fill="#b91c1c">
    <animateTransform attributeName="transform" type="rotate" additive="replace" values="90 390 265;90 390 265;0 390 265;0 390 265" keyTimes="0;0.38;0.5;1" dur="13s" repeatCount="indefinite"/>
  </rect>
  <text class="bd" x="390" y="318" text-anchor="middle">Clapet</text>
  <text class="lbl" x="390" y="340" text-anchor="middle">télécommandé</text>

  <!-- le local désenfumé -->
  <rect x="540" y="190" width="230" height="190" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <rect x="543" y="193" width="224" height="58" fill="#5a6b7d" fill-opacity="0.6"/>
  <rect x="712" y="118" width="30" height="72" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <circle cx="727" cy="96" r="18" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <g>
    <path d="M727,96 L727,80 M727,96 L741,104 M727,96 L713,104" stroke="#1b3a63" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" additive="replace" values="0 727 96;0 727 96;0 727 96;2880 727 96" keyTimes="0;0.34;0.4;1" dur="13s" repeatCount="indefinite"/>
  </g>
  <!-- extraction : s'établit quand l'ordre arrive -->
  <g>
    <line x1="727" y1="180" x2="727" y2="140" stroke="#b91c1c" stroke-width="5"/>
    <polygon points="727,128 717,146 737,146" fill="#b91c1c"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.4;1" dur="13s" repeatCount="indefinite"/>
  </g>
  <text class="bd" x="690" y="100" text-anchor="end">Extraction</text>
  <text class="lbl" x="690" y="122" text-anchor="end">des fumées</text>
  <text class="bd" x="655" y="406" text-anchor="middle">Local désenfumé</text>

  <text class="cap" x="400" y="452" text-anchor="middle">Le confort attend : l'air soufflé ne doit pas brasser les fumées.</text>
</svg>
