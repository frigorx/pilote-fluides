<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-frise" aria-describedby="d-frise" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-frise">Après l&#x27;attestation : déclarer, prévenir, être contrôlé</title>
  <desc id="d-frise">Quatre colonnes. Cinq ans au plus : la durée de l&#x27;attestation. Chaque année : la déclaration des quantités de fluide à l&#x27;organisme. Un mois : en cas de changement de personnel ou d&#x27;outillage, il faut prévenir l&#x27;organisme. Trente jours : si un contrôle trouve un défaut, l&#x27;entreprise a trente jours pour se mettre en règle. En bas : sinon l&#x27;organisme peut suspendre ou retirer l&#x27;attestation, et sans attestation l&#x27;entreprise ne peut plus toucher au fluide.</desc>
  
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">Les rendez-vous de l&#x27;entreprise attestée</text>
  <g><rect x="30" y="52" width="170" height="46" rx="23" fill="#1b3a63"/><text x="115" y="82" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">5 ans au plus</text><rect x="30" y="112" width="170" height="214" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><text x="42" y="142" font-size="18" font-weight="bold" fill="#10233c">La durée</text><text x="42" y="171.6" font-size="16" fill="#10233c">L&#x27;attestation est</text><text x="42" y="193.0" font-size="16" fill="#10233c">délivrée pour 5 ans</text><text x="42" y="214.5" font-size="16" fill="#10233c">au plus.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.12;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="220" y="52" width="170" height="46" rx="23" fill="#0f766e"/><text x="305" y="82" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Chaque année</text><rect x="220" y="112" width="170" height="214" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="3" stroke-dasharray="2 7"/><text x="232" y="142" font-size="18" font-weight="bold" fill="#10233c">La déclaration</text><text x="232" y="171.6" font-size="16" fill="#10233c">Les quantités de</text><text x="232" y="193.0" font-size="16" fill="#10233c">fluide de l&#x27;année</text><text x="232" y="214.5" font-size="16" fill="#10233c">passée, avant le 31</text><text x="232" y="235.9" font-size="16" fill="#10233c">janvier.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.26;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="410" y="52" width="170" height="46" rx="23" fill="#9a4d0c"/><text x="495" y="82" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1 mois</text><rect x="410" y="112" width="170" height="214" rx="12" fill="#fdf1e6" stroke="#9a4d0c" stroke-width="3" stroke-dasharray="10 7"/><text x="422" y="142" font-size="18" font-weight="bold" fill="#10233c">Du changement</text><text x="422" y="171.6" font-size="16" fill="#10233c">Nouveau</text><text x="422" y="193.0" font-size="16" fill="#10233c">technicien, départ,</text><text x="422" y="214.5" font-size="16" fill="#10233c">outil changé :</text><text x="422" y="235.9" font-size="16" fill="#10233c">prévenir</text><text x="422" y="257.4" font-size="16" fill="#10233c">l&#x27;organisme dans le</text><text x="422" y="278.8" font-size="16" fill="#10233c">mois.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.4;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="600" y="52" width="170" height="46" rx="23" fill="#9d174d"/><text x="685" y="82" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">30 jours</text><rect x="600" y="112" width="170" height="214" rx="12" fill="#f8e6ee" stroke="#9d174d" stroke-width="3" stroke-dasharray="14 5 3 5"/><text x="612" y="142" font-size="18" font-weight="bold" fill="#10233c">Un contrôle pas</text><text x="612" y="163.6" font-size="18" font-weight="bold" fill="#10233c">en règle</text><text x="612" y="193.2" font-size="16" fill="#10233c">L&#x27;organisme laisse</text><text x="612" y="214.6" font-size="16" fill="#10233c">30 jours pour se</text><text x="612" y="236.1" font-size="16" fill="#10233c">mettre en</text><text x="612" y="257.5" font-size="16" fill="#10233c">conformité.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.54;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="346" width="740" height="122" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3.5" stroke-dasharray="11 7"/><text x="46" y="378" font-size="18" font-weight="bold" fill="#9a4d0c">Si ces règles ne sont pas respectées :</text><text x="46" y="408" font-size="16" fill="#10233c">l&#x27;organisme peut suspendre ou retirer l&#x27;attestation.</text><text x="46" y="436" font-size="16" font-weight="bold" fill="#10233c">Sans attestation, l&#x27;entreprise ne peut plus toucher au fluide.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.72;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
