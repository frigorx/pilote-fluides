<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-capacite" aria-describedby="d-capacite" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-capacite">L&#x27;attestation de capacité : qui la délivre, ce qu&#x27;elle dit</title>
  <desc id="d-capacite">En haut, trois étapes de gauche à droite : l&#x27;entreprise demande, l&#x27;organisme agréé vérifie les techniciens et l&#x27;outillage, l&#x27;attestation de capacité est délivrée pour l&#x27;établissement. Au milieu, trois cartes : un établissement, une attestation ; cinq ans au plus ; elle dit sur quels équipements et quelles activités l&#x27;entreprise peut intervenir. En bas, à gauche : le client peut demander une copie de l&#x27;attestation. À droite, en orange tireté : sans attestation, c&#x27;est une contravention de cinquième classe. Dans l&#x27;animation, une goutte suit le parcours.</desc>
  <defs><marker id="mcapacite1b3a63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b3a63"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">L&#x27;attestation de capacité</text>
  <g><rect x="30" y="46" width="210" height="130" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><text x="44" y="75.3" font-size="18" font-weight="bold" fill="#1b3a63">L&#x27;entreprise</text><text x="44" y="99.8" font-size="16" fill="#10233c">demande l&#x27;attestation,</text><text x="44" y="121.6" font-size="16" fill="#10233c">avec son dossier</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.08;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M242,111 H290" fill="none" stroke="#1b3a63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mcapacite1b3a63)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.12;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="294" y="46" width="212" height="130" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text x="308" y="75.3" font-size="18" font-weight="bold" fill="#1b3a63">L&#x27;organisme agréé</text><text x="308" y="99.8" font-size="16" fill="#10233c">vérifie les techniciens et</text><text x="308" y="121.6" font-size="16" fill="#10233c">l&#x27;outillage</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.18;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M508,111 H556" fill="none" stroke="#1b3a63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mcapacite1b3a63)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.19;0.22;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="560" y="46" width="210" height="130" rx="12" fill="#f8e6ee" stroke="#9d174d" stroke-width="4"/><text x="574" y="75.3" font-size="18" font-weight="bold" fill="#9d174d">L&#x27;attestation</text><text x="574" y="99.8" font-size="16" fill="#10233c">délivrée pour</text><text x="574" y="121.6" font-size="16" fill="#10233c">l&#x27;établissement</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.28;1" dur="12s" repeatCount="indefinite"/></g>
  <circle r="8" fill="#1b3a63" opacity="0" cx="0" cy="0"><animateMotion path="M242,111 H290" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.08;0.13;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.1;0.12;0.14;1" dur="12s" repeatCount="indefinite"/></circle>
  <circle r="8" fill="#1b3a63" opacity="0" cx="0" cy="0"><animateMotion path="M508,111 H556" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.18;0.23;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.22;0.24;1" dur="12s" repeatCount="indefinite"/></circle>
  <g><rect x="30" y="196" width="236" height="122" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="3" stroke-dasharray="2 7"/><text x="44" y="225.3" font-size="18" font-weight="bold" fill="#0f766e">Un établissement</text><text x="44" y="249.8" font-size="16" fill="#10233c">une attestation par</text><text x="44" y="271.6" font-size="16" fill="#10233c">établissement</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.38;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="282" y="196" width="236" height="122" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="3" stroke-dasharray="2 7"/><text x="296" y="225.3" font-size="18" font-weight="bold" fill="#0f766e">5 ans au plus</text><text x="296" y="249.8" font-size="16" fill="#10233c">durée de l&#x27;attestation</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.46;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="534" y="196" width="236" height="122" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="3" stroke-dasharray="2 7"/><text x="548" y="225.3" font-size="18" font-weight="bold" fill="#0f766e">Elle précise</text><text x="548" y="249.8" font-size="16" fill="#10233c">sur quels équipements et</text><text x="548" y="271.6" font-size="16" fill="#10233c">quelles activités vous</text><text x="548" y="293.3" font-size="16" fill="#10233c">pouvez intervenir</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.54;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="338" width="360" height="128" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><text x="44" y="367.3" font-size="18" font-weight="bold" fill="#1b3a63">Le client peut la demander</text><text x="44" y="391.8" font-size="16" fill="#10233c">Le détenteur d&#x27;un équipement fait appel à</text><text x="44" y="413.6" font-size="16" fill="#10233c">une entreprise attestée : il peut en demander</text><text x="44" y="435.3" font-size="16" fill="#10233c">une copie.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.66;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="410" y="338" width="360" height="128" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3" stroke-dasharray="11 7"/><text x="424" y="367.3" font-size="18" font-weight="bold" fill="#9a4d0c">Sans attestation</text><text x="424" y="391.8" font-size="16" fill="#10233c">Toucher au fluide sans attestation de</text><text x="424" y="413.6" font-size="16" fill="#10233c">capacité : contravention de 5e classe.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.74;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
