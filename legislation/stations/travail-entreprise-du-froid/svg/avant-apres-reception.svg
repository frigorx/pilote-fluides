<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-garanties" aria-describedby="d-garanties" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-garanties">Avant et après la réception : qui répond de quoi, et pendant combien de temps</title>
  <desc id="d-garanties">Une frise, à la même échelle. Une barre avant la réception : jusqu&#x27;à la réception, l&#x27;entreprise répond de l&#x27;ouvrage. À la réception, le client accepte l&#x27;ouvrage. Puis la garantie de parfait achèvement dure un an ; la garantie décennale dure dix ans. En bas : pendant tout ce temps, la responsabilité civile joue : celui qui cause un dommage doit le réparer, et le patron répond aussi du dommage causé par ses salariés dans leur travail.</desc>
  
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">Avant et après la réception</text>
  <g><rect x="40" y="84" width="186" height="40" rx="8" fill="#fff" stroke="#5a6b7d" stroke-width="2.5" stroke-dasharray="8 6"/><text x="52" y="110" font-size="16" font-weight="bold" fill="#10233c">Jusqu&#x27;à la réception</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.1;1" dur="12s" repeatCount="indefinite"/></g>
  <g><text x="230" y="62" font-size="17" font-weight="bold" fill="#9d174d" text-anchor="middle">Réception</text><path d="M230,70 V318" stroke="#9d174d" stroke-width="3" stroke-dasharray="6 6"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.2;1" dur="12s" repeatCount="indefinite"/></g>
  <g><text x="244" y="160" font-size="17" font-weight="bold" fill="#10233c">Parfait achèvement : 1 an</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.29;1" dur="12s" repeatCount="indefinite"/></g><rect x="230" y="170" width="50" height="30" rx="6" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"><animate attributeName="width" values="0;0;50;50" keyTimes="0;0.26;0.36;1" dur="12s" repeatCount="indefinite"/></rect>
  <g><text x="244" y="230" font-size="17" font-weight="bold" fill="#10233c">Garantie décennale : 10 ans</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.43;1" dur="12s" repeatCount="indefinite"/></g><rect x="230" y="240" width="500" height="30" rx="6" fill="#f8e6ee" stroke="#9d174d" stroke-width="3"><animate attributeName="width" values="0;0;500;500" keyTimes="0;0.4;0.62;1" dur="12s" repeatCount="indefinite"/></rect>
  <g><path d="M230,322 H730 M230,316 V328 M280,316 V328 M730,316 V328" stroke="#5a6b7d" stroke-width="2"/><text x="230" y="348" font-size="16" fill="#5a6b7d" text-anchor="middle">0</text><text x="280" y="348" font-size="16" fill="#5a6b7d" text-anchor="middle">1 an</text><text x="730" y="348" font-size="16" fill="#5a6b7d" text-anchor="middle">10 ans</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.3;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="362" width="740" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="3" stroke-dasharray="2 7"/><text x="46" y="390" font-size="18" font-weight="bold" fill="#0f766e">Tout le temps : la responsabilité civile</text><text x="46" y="416" font-size="16" fill="#10233c">Celui qui cause un dommage doit le réparer.</text><text x="46" y="442" font-size="16" fill="#10233c">Le patron répond aussi du dommage causé par ses salariés dans leur travail.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.78;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
