<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-organigramme" aria-describedby="d-organigramme" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-organigramme">Une entreprise du froid : qui fait quoi</title>
  <desc id="d-organigramme">Un organigramme. En haut, le dirigeant, qui décide, signe les contrats et répond de l&#x27;entreprise. En dessous, trois fonctions : le chargé d&#x27;affaires, qui parle au client, fait le devis et suit le chantier ; l&#x27;administratif, qui tient les factures, les déclarations et les dossiers ; les techniciens, qui installent, entretiennent, dépannent et remplissent la fiche d&#x27;intervention. Une note rappelle que dans une petite entreprise, une même personne tient souvent plusieurs rôles.</desc>
  
  <rect width="800" height="500" fill="#fffdf8"/>
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#10233c" text-anchor="middle">Qui fait quoi dans l&#x27;entreprise</text>
  <g><rect x="270" y="44" width="260" height="112" rx="12" fill="#f8e6ee" stroke="#9d174d" stroke-width="3"/><circle cx="300" cy="67" r="9" fill="#9d174d"/><path d="M285,96 q0,-17 15,-17 q15,0 15,17 z" fill="#9d174d"/><text x="328" y="84" font-size="18" font-weight="bold" fill="#10233c">Le dirigeant</text><text x="284" y="118" font-size="16" fill="#10233c">décide, signe les contrats,</text><text x="284" y="139.8" font-size="16" fill="#10233c">répond de l&#x27;entreprise</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.03;0.09;1" dur="12s" repeatCount="indefinite"/></g>
  <g><path d="M400,158 V176 M145,176 H655 M145,176 V196 M400,176 V196 M655,176 V196" fill="none" stroke="#5a6b7d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.14;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="198" width="230" height="176" rx="12" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><circle cx="60" cy="221" r="9" fill="#1b3a63"/><path d="M45,250 q0,-17 15,-17 q15,0 15,17 z" fill="#1b3a63"/><text x="88" y="238" font-size="18" font-weight="bold" fill="#10233c">Le chargé d&#x27;affaires</text><text x="44" y="272" font-size="16" fill="#10233c">parle au client, fait le devis,</text><text x="44" y="293.8" font-size="16" fill="#10233c">suit le chantier</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.22;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="285" y="198" width="230" height="176" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="3" stroke-dasharray="2 7"/><circle cx="315" cy="221" r="9" fill="#0f766e"/><path d="M300,250 q0,-17 15,-17 q15,0 15,17 z" fill="#0f766e"/><text x="343" y="238" font-size="18" font-weight="bold" fill="#10233c">L&#x27;administratif</text><text x="299" y="272" font-size="16" fill="#10233c">tient les factures, les</text><text x="299" y="293.8" font-size="16" fill="#10233c">déclarations et les dossiers</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.34;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="540" y="198" width="230" height="176" rx="12" fill="#fdf1e6" stroke="#9a4d0c" stroke-width="3" stroke-dasharray="10 7"/><circle cx="570" cy="221" r="9" fill="#9a4d0c"/><path d="M555,250 q0,-17 15,-17 q15,0 15,17 z" fill="#9a4d0c"/><text x="598" y="238" font-size="18" font-weight="bold" fill="#10233c">Les techniciens</text><text x="554" y="272" font-size="16" fill="#10233c">installent, entretiennent,</text><text x="554" y="293.8" font-size="16" fill="#10233c">dépannent et remplissent</text><text x="554" y="315.5" font-size="16" fill="#10233c">la fiche d&#x27;intervention</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.46;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="30" y="392" width="740" height="84" rx="12" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><text x="46" y="420" font-size="16" font-weight="bold" fill="#10233c">Dans une petite entreprise, une même personne tient souvent plusieurs rôles.</text><text x="46" y="448" font-size="16" fill="#10233c">Un organigramme dit qui travaille avec qui : apprenez à le lire.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.62;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
