<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img"
     aria-labelledby="t-ac" aria-describedby="d-ac" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-ac">Les trois catégories d'accès du local : a, b et c</title>
  <desc id="d-ac">Trois cartes côte à côte. La catégorie a, accès général : une foule de six pictogrammes de personnes, n'importe qui peut entrer sans connaître les consignes, exemples logement, école, hôtel, magasin. La catégorie b, accès surveillé : trois pictogrammes, un nombre limité de personnes dont certaines connaissent les consignes générales, exemples bureaux et laboratoires. La catégorie c, accès autorisé : un seul pictogramme casqué, seules des personnes autorisées et formées aux consignes générales et particulières, exemples atelier de production et entrepôt frigorifique. Une bande rappelle que plus le public est large et non averti, plus la limite de charge est sévère.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .hd  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#fffdf8; }
    .nom { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .lbl { font-size:17px; fill:#10233c; }
    .ex  { font-size:17px; fill:#5a6b7d; font-style:italic; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
  </style>
  <text class="ttl" x="450" y="32" text-anchor="middle">Qui a accès au local où se trouve le fluide ?</text>
  <rect x="20" y="52" width="270" height="314" rx="14" fill="#fffdf8" stroke="#0f766e" stroke-width="4"/>
  <rect x="20" y="52" width="270" height="42" rx="14" fill="#0f766e"/>
  <rect x="20" y="80" width="270" height="14" fill="#0f766e"/>
  <text class="hd" x="155" y="82" text-anchor="middle">catégorie a</text>
  <circle cx="70" cy="142" r="9" fill="#0f766e"/><path d="M58,168 L58,158 Q58,150 70,150 Q82,150 82,158 L82,168 Z" fill="#0f766e"/>
  <circle cx="104" cy="142" r="9" fill="#0f766e"/><path d="M92,168 L92,158 Q92,150 104,150 Q116,150 116,158 L116,168 Z" fill="#0f766e"/>
  <circle cx="138" cy="142" r="9" fill="#0f766e"/><path d="M126,168 L126,158 Q126,150 138,150 Q150,150 150,158 L150,168 Z" fill="#0f766e"/>
  <circle cx="172" cy="142" r="9" fill="#0f766e"/><path d="M160,168 L160,158 Q160,150 172,150 Q184,150 184,158 L184,168 Z" fill="#0f766e"/>
  <circle cx="206" cy="142" r="9" fill="#0f766e"/><path d="M194,168 L194,158 Q194,150 206,150 Q218,150 218,158 L218,168 Z" fill="#0f766e"/>
  <circle cx="240" cy="142" r="9" fill="#0f766e"/><path d="M228,168 L228,158 Q228,150 240,150 Q252,150 252,158 L252,168 Z" fill="#0f766e"/>
  <text class="nom" x="155" y="214" text-anchor="middle">Accès général</text>
  <text class="lbl" x="155" y="242" text-anchor="middle">n’importe qui peut entrer,</text>
  <text class="lbl" x="155" y="264" text-anchor="middle">sans connaître les consignes</text>
  <text class="ex" x="155" y="298" text-anchor="middle">ex. : logement, école, hôtel, magasin</text>
  <rect x="315" y="52" width="270" height="314" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="4"/>
  <rect x="315" y="52" width="270" height="42" rx="14" fill="#1b3a63"/>
  <rect x="315" y="80" width="270" height="14" fill="#1b3a63"/>
  <text class="hd" x="450" y="82" text-anchor="middle">catégorie b</text>
  <circle cx="416" cy="142" r="9" fill="#1b3a63"/><path d="M404,168 L404,158 Q404,150 416,150 Q428,150 428,158 L428,168 Z" fill="#1b3a63"/>
  <circle cx="450" cy="142" r="9" fill="#1b3a63"/><path d="M438,168 L438,158 Q438,150 450,150 Q462,150 462,158 L462,168 Z" fill="#1b3a63"/>
  <circle cx="484" cy="142" r="9" fill="#1b3a63"/><path d="M472,168 L472,158 Q472,150 484,150 Q496,150 496,158 L496,168 Z" fill="#1b3a63"/>
  <text class="nom" x="450" y="214" text-anchor="middle">Accès surveillé</text>
  <text class="lbl" x="450" y="242" text-anchor="middle">un nombre limité de personnes,</text>
  <text class="lbl" x="450" y="264" text-anchor="middle">dont certaines connaissent</text>
  <text class="lbl" x="450" y="286" text-anchor="middle">les consignes générales</text>
  <text class="ex" x="450" y="320" text-anchor="middle">ex. : bureaux, laboratoires</text>
  <rect x="610" y="52" width="270" height="314" rx="14" fill="#fffdf8" stroke="#e8914a" stroke-width="4"/>
  <rect x="610" y="52" width="270" height="42" rx="14" fill="#e8914a"/>
  <rect x="610" y="80" width="270" height="14" fill="#e8914a"/>
  <text class="hd" x="745" y="82" text-anchor="middle" style="fill:#10233c">catégorie c</text>
  <circle cx="745" cy="142" r="9" fill="#1b3a63"/><path d="M734,140 Q734,126 745,126 Q756,126 756,140 Z" fill="#e8914a" stroke="#10233c" stroke-width="1.5"/><path d="M733,168 L733,158 Q733,150 745,150 Q757,150 757,158 L757,168 Z" fill="#1b3a63"/>
  <text class="nom" x="745" y="214" text-anchor="middle">Accès autorisé</text>
  <text class="lbl" x="745" y="242" text-anchor="middle">seules des personnes autorisées,</text>
  <text class="lbl" x="745" y="264" text-anchor="middle">formées aux consignes</text>
  <text class="lbl" x="745" y="286" text-anchor="middle">générales et particulières</text>
  <text class="ex" x="745" y="320" text-anchor="middle">ex. : atelier de production,</text>
  <text class="ex" x="745" y="342" text-anchor="middle">entrepôt frigorifique</text>
  <rect x="20" y="380" width="860" height="48" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="450" y="410" text-anchor="middle">Plus le public est large et non averti, plus la limite de charge est sévère.</text>
</svg>
