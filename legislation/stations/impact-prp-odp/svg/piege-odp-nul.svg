<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-pn" aria-describedby="d-pn" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-pn">Le piège : ODP nul ne veut pas dire propre</title>
  <desc id="d-pn">Une carte centrée sur le R-410A, fluide très utilisé en froid et en climatisation.
    Deux blocs de statistiques : à gauche, l'ODP marqué « nul » avec une coche verte dans un cercle ;
    à droite, le PRP marqué « 2088 » avec un triangle d'alerte ambre. En bas, la phrase fausse la
    plus répandue est barrée en rouge : « il ne touche pas l'ozone donc il est propre », suivie de la
    conclusion correcte : un PRP de 2088 veut dire que, s'il fuit, il réchauffe le climat 2088 fois
    plus qu'une même masse de CO2.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#10233c; }
    .lbl  { font-size:16px; fill:#10233c; }
    .val  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:30px; }
    .cap  { font-size:15px; fill:#5a6b7d; }
    .faux { font-size:16px; fill:#c0392b; font-style:italic; }
  </style>

  <rect x="20" y="20" width="860" height="60" rx="14" fill="#1b3a63"/>
  <text class="ttl" x="450" y="58" text-anchor="middle" fill="#fffdf8">R-410A — un HFC très utilisé en froid et en climatisation</text>

  <!-- bloc ODP -->
  <rect x="60" y="104" width="360" height="120" rx="14" fill="#e6f2f0" stroke="#047857" stroke-width="3"/>
  <circle cx="120" cy="164" r="26" fill="#fffdf8" stroke="#047857" stroke-width="3"/>
  <path d="M 108,164 L 118,176 L 136,150" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cap" x="270" y="132" text-anchor="middle">ODP</text>
  <text class="val" x="270" y="172" text-anchor="middle" fill="#047857">nul</text>
  <text class="cap" x="270" y="200" text-anchor="middle">ne détruit pas l'ozone</text>

  <!-- bloc PRP -->
  <rect x="480" y="104" width="360" height="120" rx="14" fill="#fff4e0" stroke="#b06a00" stroke-width="3"/>
  <path d="M 540,182 L 560,144 L 580,182 Z" fill="#fffdf8" stroke="#b06a00" stroke-width="3" stroke-linejoin="round"/>
  <text x="560" y="176" text-anchor="middle" font-size="18" font-weight="bold" fill="#b06a00">!</text>
  <text class="cap" x="710" y="132" text-anchor="middle">PRP</text>
  <text class="val" x="710" y="172" text-anchor="middle" fill="#b06a00">2088</text>
  <text class="cap" x="710" y="200" text-anchor="middle">réchauffe fortement s'il fuit</text>

  <!-- la phrase fausse, barrée -->
  <text class="faux" x="450" y="266" text-anchor="middle">« Il ne touche pas l'ozone, donc il est propre »</text>
  <line x1="205" y1="261" x2="695" y2="261" stroke="#c0392b" stroke-width="2.5"/>

  <rect x="40" y="284" width="820" height="42" rx="10" fill="#eef3f9" stroke="#2f5689" stroke-width="1.5"/>
  <text class="lbl" x="450" y="310" text-anchor="middle">S'il fuit, il réchauffe 2088 fois plus qu'une même masse de CO₂.</text>
</svg>
