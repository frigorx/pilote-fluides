<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img"
     aria-labelledby="t-qs" aria-describedby="d-qs" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-qs">Le raisonnement en quatre réflexes</title>
  <desc id="d-qs">Quatre cartes numérotées en rangée. Carte 1 : un fluide a un ODP nul, la question
    « est-il sans impact climatique ? » et la réponse « non, regardez son PRP ». Carte 2 : deux
    sources donnent deux valeurs de PRP différentes, la question « laquelle retenir ? » et la
    réponse « la plus élevée ». Carte 3 : une fuite se produit, la question « la masse suffit-elle
    à juger l'impact ? » et la réponse « non, masse fois PRP ». Carte 4 : bilan, la question
    « comment lire l'ODP et le PRP ? » et la réponse « toujours ensemble, jamais l'un à la place de
    l'autre ».</desc>
  <style>
    .num  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#fffdf8; }
    .sit  { font-size:15px; fill:#10233c; }
    .q    { font-size:15px; fill:#5a6b7d; font-style:italic; }
    .rep  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#047857; }
  </style>

  <!-- carte 1 -->
  <rect x="20" y="20" width="200" height="280" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="18" fill="#1b3a63"/>
  <text class="num" x="50" y="57" text-anchor="middle">1</text>
  <text class="sit" x="120" y="90" text-anchor="middle">Un fluide a un</text>
  <text class="sit" x="120" y="110" text-anchor="middle">ODP nul.</text>
  <text class="q" x="120" y="150" text-anchor="middle">Sans impact</text>
  <text class="q" x="120" y="168" text-anchor="middle">climatique ?</text>
  <text class="rep" x="120" y="220" text-anchor="middle">Non —</text>
  <text class="rep" x="120" y="240" text-anchor="middle">regardez son PRP</text>

  <!-- carte 2 -->
  <rect x="240" y="20" width="200" height="280" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <circle cx="270" cy="50" r="18" fill="#1b3a63"/>
  <text class="num" x="270" y="57" text-anchor="middle">2</text>
  <text class="sit" x="340" y="90" text-anchor="middle">Deux sources,</text>
  <text class="sit" x="340" y="110" text-anchor="middle">deux valeurs de PRP.</text>
  <text class="q" x="340" y="150" text-anchor="middle">Laquelle</text>
  <text class="q" x="340" y="168" text-anchor="middle">retenir ?</text>
  <text class="rep" x="340" y="220" text-anchor="middle">La valeur</text>
  <text class="rep" x="340" y="240" text-anchor="middle">la plus élevée</text>

  <!-- carte 3 -->
  <rect x="460" y="20" width="200" height="280" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <circle cx="490" cy="50" r="18" fill="#1b3a63"/>
  <text class="num" x="490" y="57" text-anchor="middle">3</text>
  <text class="sit" x="560" y="90" text-anchor="middle">Une fuite</text>
  <text class="sit" x="560" y="110" text-anchor="middle">se produit.</text>
  <text class="q" x="560" y="150" text-anchor="middle">La masse suffit-elle</text>
  <text class="q" x="560" y="168" text-anchor="middle">à juger l'impact ?</text>
  <text class="rep" x="560" y="220" text-anchor="middle">Non — masse</text>
  <text class="rep" x="560" y="240" text-anchor="middle">× PRP</text>

  <!-- carte 4 -->
  <rect x="680" y="20" width="200" height="280" rx="14" fill="#e6f2f0" stroke="#047857" stroke-width="3"/>
  <circle cx="710" cy="50" r="18" fill="#047857"/>
  <text class="num" x="710" y="57" text-anchor="middle">4</text>
  <text class="sit" x="780" y="90" text-anchor="middle">Bilan du</text>
  <text class="sit" x="780" y="110" text-anchor="middle">raisonnement.</text>
  <text class="q" x="780" y="150" text-anchor="middle">Comment lire</text>
  <text class="q" x="780" y="168" text-anchor="middle">ODP et PRP ?</text>
  <text class="rep" x="780" y="210" text-anchor="middle">Toujours ensemble,</text>
  <text class="rep" x="780" y="230" text-anchor="middle">jamais l'un à la</text>
  <text class="rep" x="780" y="250" text-anchor="middle">place de l'autre</text>
</svg>
