<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
     aria-labelledby="t-bp" aria-describedby="d-bp" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-bp">Bilan : deux échelles, une règle de doublon</title>
  <desc id="d-bp">Deux blocs en haut : à gauche, l'ODP représenté comme un interrupteur à deux
    positions, « nul » ou « non nul », binaire. À droite, le PRP représenté comme une barre en
    dégradé, du vert au rouge, une échelle continue comparée au CO2. En bas, un schéma de la règle
    du doublon de sources : deux barres verticales de hauteurs différentes, l'une en trait tireté
    marquée « source A », l'autre plus haute et pleine marquée « source B », avec une flèche vers
    le haut et la mention « en cas de doublon, retenir la valeur la plus élevée ».</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#10233c; }
    .lbl { font-size:16px; fill:#10233c; }
    .cap { font-size:15px; fill:#5a6b7d; }
    .val { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; }
  </style>

  <!-- bloc ODP -->
  <rect x="40" y="20" width="380" height="140" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="ttl" x="230" y="46" text-anchor="middle">ODP — échelle binaire</text>
  <rect x="70" y="70" width="140" height="50" rx="25" fill="#e6f2f0" stroke="#047857" stroke-width="2.5"/>
  <circle cx="100" cy="95" r="15" fill="#fffdf8" stroke="#047857" stroke-width="3"/>
  <path d="M92,96 L98,102 L110,86" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="val" x="128" y="101" fill="#047857">nul</text>
  <rect x="240" y="70" width="160" height="50" rx="25" fill="#fbe7e4" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="270" cy="95" r="15" fill="#fffdf8" stroke="#c0392b" stroke-width="3"/>
  <path d="M262,87 L278,103 M278,87 L262,103" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <text class="val" x="298" y="101" fill="#c0392b">non nul</text>
  <text class="cap" x="230" y="145" text-anchor="middle">chlore ou brome présents, ou non</text>

  <!-- bloc PRP -->
  <rect x="480" y="20" width="380" height="140" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="ttl" x="670" y="46" text-anchor="middle">PRP — échelle continue</text>
  <defs>
    <linearGradient id="grad-prp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="55%" stop-color="#b06a00"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>
  <rect x="520" y="80" width="300" height="24" rx="12" fill="url(#grad-prp)"/>
  <text class="cap" x="530" y="76">faible</text>
  <text class="cap" x="790" y="76" text-anchor="end">très élevé</text>
  <text class="cap" x="670" y="140" text-anchor="middle">comparée au CO₂ = 1, sans borne fixe</text>

  <!-- règle du doublon -->
  <rect x="40" y="190" width="820" height="170" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="ttl" x="450" y="218" text-anchor="middle">Deux sources, deux valeurs : la règle du doublon</text>

  <line x1="380" y1="330" x2="380" y2="260" stroke="#5a6b7d" stroke-width="10" stroke-dasharray="8 6"/>
  <text class="cap" x="380" y="348" text-anchor="middle">source A</text>

  <line x1="460" y1="330" x2="460" y2="240" stroke="#047857" stroke-width="10"/>
  <text class="cap" x="460" y="348" text-anchor="middle">source B</text>

  <line x1="520" y1="255" x2="520" y2="235" stroke="#10233c" stroke-width="3" marker-end="url(#f-haut)"/>
  <text class="lbl" x="640" y="250" text-anchor="middle">on retient</text>
  <text class="lbl" x="640" y="272" text-anchor="middle">la valeur la plus élevée</text>

  <defs>
    <marker id="f-haut" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,10 L5,0 L10,10 Z" fill="#10233c"/>
    </marker>
  </defs>
</svg>
