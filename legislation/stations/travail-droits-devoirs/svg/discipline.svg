<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" role="img"
     aria-labelledby="t-dis" aria-describedby="d-dis" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-dis">Le règlement intérieur et la procédure disciplinaire</title>
  <desc id="d-dis">En haut, une bande : le règlement intérieur fixe la nature et l'échelle des sanctions, et il est obligatoire dans les entreprises d'au moins cinquante salariés. Dessous, quatre cartes de gauche à droite : le fait fautif, la convocation, l'entretien, la sanction. Sous les cartes, deux accolades : les poursuites doivent être engagées dans les deux mois après la connaissance du fait ; la sanction intervient entre deux jours ouvrables et un mois après l'entretien. En bas, deux règles : les griefs sont communiqués par écrit, et les amendes sont interdites. L'animation fait apparaître les éléments dans cet ordre ; l'image fixe est complète.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h    { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .ha   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#9d174d; }
    .b    { font-size:17px; fill:#10233c; }
    .bb   { font-size:17px; font-weight:bold; fill:#10233c; }
    .ba   { font-size:17px; font-weight:bold; fill:#9d174d; }
    .bo   { font-size:17px; font-weight:bold; fill:#b45309; }
    .g    { font-size:16px; fill:#5a6b7d; }
    .num  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#fffdf8; }
  </style>
  <rect x="20" y="16" width="860" height="72" rx="14" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="bb" x="450" y="46" text-anchor="middle">Le règlement intérieur fixe la nature et l'échelle des sanctions</text>
    <text class="bb" x="450" y="72" text-anchor="middle">Obligatoire dans les entreprises d'au moins 50 salariés (L. 1311-2)</text>
  <g>
    <rect x="20" y="112" width="200" height="176" rx="14" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
    <circle cx="48" cy="144" r="17" fill="#9d174d"/><text class="num" x="48" y="150" text-anchor="middle">1</text>
    <text class="ha" x="74" y="151" style="font-size:19px">Le fait fautif</text>
    <text class="b" x="36" y="196">L'employeur en a</text>
    <text class="b" x="36" y="222">connaissance : les</text>
    <text class="b" x="36" y="248">deux mois courent.</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.10;0.16;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g><polygon points="239,200 223,190 223,210" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.20;1" dur="12s" repeatCount="indefinite"/></g>
  <g>
    <rect x="240" y="112" width="200" height="176" rx="14" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
    <circle cx="268" cy="144" r="17" fill="#9d174d"/><text class="num" x="268" y="150" text-anchor="middle">2</text>
    <text class="ha" x="294" y="151" style="font-size:19px">La convocation</text>
    <text class="b" x="256" y="196">Elle précise l'objet,</text>
    <text class="b" x="256" y="222">sauf pour un</text>
    <text class="b" x="256" y="248">avertissement.</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.26;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g><polygon points="459,200 443,190 443,210" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.30;1" dur="12s" repeatCount="indefinite"/></g>
  <g>
    <rect x="460" y="112" width="200" height="176" rx="14" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
    <circle cx="488" cy="144" r="17" fill="#9d174d"/><text class="num" x="488" y="150" text-anchor="middle">3</text>
    <text class="ha" x="514" y="151" style="font-size:19px">L'entretien</text>
    <text class="b" x="476" y="196">Motif indiqué,</text>
    <text class="b" x="476" y="222">explications recueillies,</text>
    <text class="b" x="476" y="248">assistance possible.</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.36;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g><polygon points="679,200 663,190 663,210" fill="#5a6b7d"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.36;0.40;1" dur="12s" repeatCount="indefinite"/></g>
  <g>
    <rect x="680" y="112" width="200" height="176" rx="14" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
    <circle cx="708" cy="144" r="17" fill="#9d174d"/><text class="num" x="708" y="150" text-anchor="middle">4</text>
    <text class="ha" x="734" y="151" style="font-size:19px">La sanction</text>
    <text class="b" x="696" y="196">Motivée et notifiée,</text>
    <text class="b" x="696" y="222">après l'entretien,</text>
    <text class="b" x="696" y="248">dans un délai encadré.</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.40;0.46;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <path d="M120 310 V324 H340 V310" fill="none" stroke="#b45309" stroke-width="3"/>
    <text class="bo" x="230" y="352" text-anchor="middle">poursuites engagées au plus</text>
    <text class="bo" x="230" y="376" text-anchor="middle">tard deux mois après la connaissance</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.58;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <path d="M560 310 V324 H780 V310" fill="none" stroke="#b45309" stroke-width="3"/>
    <text class="bo" x="670" y="352" text-anchor="middle">sanction entre deux jours ouvrables</text>
    <text class="bo" x="670" y="376" text-anchor="middle">et un mois après l'entretien</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.68;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="20" y="420" width="860" height="116" rx="14" fill="#fffdf8" stroke="#5a6b7d" stroke-width="2.5"/>
    <text class="ba" x="44" y="456" style="fill:#1e7e54">Toujours</text>
    <text class="b" x="160" y="456">les griefs sont communiqués au salarié, par écrit (L. 1332-1)</text>
    <text class="ba" x="44" y="504" style="fill:#c0392b">Jamais</text>
    <text class="b" x="160" y="504">d'amendes ni de sanctions pécuniaires (L. 1331-2)</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.82;1" dur="12s" repeatCount="indefinite"/>
  </g>
</svg>
