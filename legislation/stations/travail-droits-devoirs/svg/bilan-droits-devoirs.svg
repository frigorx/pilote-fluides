<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"
     aria-labelledby="t-bil" aria-describedby="d-bil" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-bil">Bilan : l'employeur et le salarié, trois lignes</title>
  <desc id="d-bil">Un tableau à deux colonnes, l'employeur et le salarié, et trois lignes : le lien, la sécurité, les garde-fous. L'employeur ordonne, contrôle, sanctionne ; il doit la sécurité et respecte une procédure écrite. Le salarié exécute de bonne foi, prend soin de la sécurité, alerte puis se retire d'un danger grave et imminent. Une bande rappelle les trois veilleurs : le comité social et économique, l'inspection du travail, la santé au travail. Une dernière bande donne le réflexe face à un danger.</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h    { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .ha   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#9d174d; }
    .b    { font-size:17px; fill:#10233c; }
    .bb   { font-size:17px; font-weight:bold; fill:#10233c; }
    .ba   { font-size:17px; font-weight:bold; fill:#9d174d; }
    .bo   { font-size:17px; font-weight:bold; fill:#b45309; }
    .g    { font-size:16px; fill:#5a6b7d; }
    .num  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#fffdf8; }
  </style>
  <text class="h" x="340" y="40" text-anchor="middle">L'employeur</text>
  <text class="ha" x="695" y="40" text-anchor="middle">Le salarié</text>
  <rect x="20" y="56" width="150" height="78" rx="14" fill="#f2f4f6" stroke="#5a6b7d" stroke-width="2.5"/>
  <text class="bb" x="95" y="102" text-anchor="middle">Le lien</text>
  <rect x="180" y="56" width="320" height="78" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="b" x="196" y="90">Ordonne, contrôle,</text>
    <text class="b" x="196" y="114">sanctionne</text>
  <rect x="510" y="56" width="370" height="78" rx="14" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
  <text class="b" x="526" y="90">Exécute,</text>
    <text class="b" x="526" y="114">de bonne foi</text>
  <rect x="20" y="146" width="150" height="78" rx="14" fill="#f2f4f6" stroke="#5a6b7d" stroke-width="2.5"/>
  <text class="bb" x="95" y="192" text-anchor="middle">La sécurité</text>
  <rect x="180" y="146" width="320" height="78" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="b" x="196" y="180">Doit la sécurité :</text>
    <text class="b" x="196" y="204">mesures, information, formation</text>
  <rect x="510" y="146" width="370" height="78" rx="14" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
  <text class="b" x="526" y="180">Prend soin de sa sécurité</text>
    <text class="b" x="526" y="204">et de celle des autres</text>
  <rect x="20" y="236" width="150" height="78" rx="14" fill="#f2f4f6" stroke="#5a6b7d" stroke-width="2.5"/>
  <text class="bb" x="95" y="282" text-anchor="middle">Les garde-fous</text>
  <rect x="180" y="236" width="320" height="78" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="b" x="196" y="270">Procédure écrite ;</text>
    <text class="b" x="196" y="294">pas d'amende</text>
  <rect x="510" y="236" width="370" height="78" rx="14" fill="#fffdf8" stroke="#9d174d" stroke-width="2.5"/>
  <text class="b" x="526" y="270">Alerte, puis se retire d'un</text>
    <text class="b" x="526" y="294">danger grave et imminent</text>
  <rect x="20" y="336" width="860" height="62" rx="14" fill="#fff4e0" stroke="#e8914a" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text class="bb" x="450" y="372" text-anchor="middle">Trois veilleurs : le CSE, l'inspection du travail, la santé au travail</text>
  <rect x="20" y="414" width="860" height="84" rx="14" fill="#f3e1e3" stroke="#9d174d" stroke-width="3"/>
  <text class="ba" x="44" y="448">Le réflexe</text>
  <text class="b" x="44" y="476">Danger grave et imminent : j'alerte, je me mets en sécurité, je confirme par écrit.</text>
</svg>
