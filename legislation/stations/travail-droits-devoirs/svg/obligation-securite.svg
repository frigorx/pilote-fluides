<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" role="img"
     aria-labelledby="t-sec" aria-describedby="d-sec" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-sec">L'obligation de sécurité de l'employeur : trois familles de mesures</title>
  <desc id="d-sec">En haut, l'article L. 4121-1 : l'employeur prend les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs. Dessous, trois colonnes : la prévention des risques, l'information et la formation, l'organisation et les moyens adaptés. Une bande rappelle que l'employeur adapte ces mesures quand les circonstances changent. Tout en bas, deux cartes renvoient aux stations voisines : les neuf principes de prévention (article L. 4121-2) et le document unique d'évaluation des risques (article L. 4121-3).</desc>
  <style>
    .ttl  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#10233c; }
    .h    { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#1b3a63; }
    .ha   { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#9d174d; }
    .b    { font-size:17px; fill:#10233c; }
    .bb   { font-size:17px; font-weight:bold; fill:#10233c; }
    .ba   { font-size:17px; font-weight:bold; fill:#9d174d; }
    .bo   { font-size:17px; font-weight:bold; fill:#b45309; }
    .g    { font-size:16px; fill:#5a6b7d; }
    .num  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; fill:#fffdf8; }
  </style>
  <rect x="20" y="20" width="820" height="96" rx="14" fill="#f3e1e3" stroke="#9d174d" stroke-width="3"/>
  <text class="bb" x="40" y="50">Article L. 4121-1 : l'employeur prend les mesures</text>
    <text class="bb" x="40" y="76">nécessaires pour assurer la sécurité et protéger</text>
    <text class="bb" x="40" y="102">la santé physique et mentale des travailleurs.</text>
  <rect x="20" y="140" width="260" height="162" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <circle cx="50" cy="172" r="17" fill="#1b3a63"/><text class="num" x="50" y="178" text-anchor="middle">1</text>
  <text class="h" x="78" y="170">Prévention</text>
  <text class="h" x="78" y="194">des risques</text>
  <text class="b" x="36" y="238">des actions pour prévenir</text>
    <text class="b" x="36" y="262">les risques professionnels</text>
  <rect x="300" y="140" width="260" height="162" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <circle cx="330" cy="172" r="17" fill="#1b3a63"/><text class="num" x="330" y="178" text-anchor="middle">2</text>
  <text class="h" x="358" y="170">Information</text>
  <text class="h" x="358" y="194">et formation</text>
  <text class="b" x="316" y="238">notamment à l'embauche et</text>
    <text class="b" x="316" y="262">au changement de poste</text>
  <rect x="580" y="140" width="260" height="162" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <circle cx="610" cy="172" r="17" fill="#1b3a63"/><text class="num" x="610" y="178" text-anchor="middle">3</text>
  <text class="h" x="638" y="170">Organisation</text>
  <text class="h" x="638" y="194">et moyens adaptés</text>
  <text class="b" x="596" y="238">une organisation et</text>
    <text class="b" x="596" y="262">des moyens adaptés</text>
  <rect x="20" y="322" width="820" height="52" rx="14" fill="#fff4e0" stroke="#e8914a" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text class="bb" x="430" y="355" text-anchor="middle">Il adapte ces mesures : les circonstances changent, les situations s'améliorent.</text>
  <text class="g" x="30" y="404">Pour aller plus loin, deux stations du réseau :</text>
  <rect x="20" y="416" width="400" height="100" rx="14" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="h" x="40" y="446">Les neuf principes</text>
  <text class="b" x="40" y="474">Article L. 4121-2 : les principes qui</text>
    <text class="b" x="40" y="496">guident les choix de l'employeur</text>
  <rect x="440" y="416" width="400" height="100" rx="14" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="h" x="460" y="446">Le DUERP</text>
  <text class="b" x="460" y="474">Article L. 4121-3 : évaluer les risques</text>
    <text class="b" x="460" y="496">dans un document unique</text>
</svg>
