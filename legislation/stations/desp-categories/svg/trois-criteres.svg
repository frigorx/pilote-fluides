<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"
     aria-labelledby="t-crit" aria-describedby="d-crit" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-crit">Trois critères croisés déterminent la catégorie</title>
  <desc id="d-crit">Trois cartes en haut : la pression maximale admissible (PS), le volume ou le
    diamètre pour une tuyauterie, et le groupe du fluide. Une flèche part de chaque carte et converge
    vers une case unique en bas, « la catégorie, de I à IV ». Une note rappelle qu'aucun de ces
    critères ne suffit seul.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fffdf8; }
    .lbl { font-size:15px; fill:#10233c; }
    .res { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#0c4a6e; }
    .note{ font-size:15px; fill:#5a6b7d; font-style:italic; }
  </style>

  <!-- Carte PS -->
  <rect x="20" y="20" width="260" height="130" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <rect x="20" y="20" width="260" height="42" rx="14" fill="#1b3a63"/>
  <rect x="20" y="48" width="260" height="14" fill="#1b3a63"/>
  <text class="ttl" x="150" y="48" text-anchor="middle">Pression maximale</text>
  <text class="lbl" x="150" y="100" text-anchor="middle">la PS de l'équipement,</text>
  <text class="lbl" x="150" y="124" text-anchor="middle">celle qu'il ne doit pas dépasser</text>

  <!-- Carte volume -->
  <rect x="320" y="20" width="260" height="130" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <rect x="320" y="20" width="260" height="42" rx="14" fill="#1b3a63"/>
  <rect x="320" y="48" width="260" height="14" fill="#1b3a63"/>
  <text class="ttl" x="450" y="48" text-anchor="middle">Volume (ou diamètre)</text>
  <text class="lbl" x="450" y="100" text-anchor="middle">le volume de l'équipement,</text>
  <text class="lbl" x="450" y="124" text-anchor="middle">le diamètre pour une tuyauterie</text>

  <!-- Carte groupe du fluide -->
  <rect x="620" y="20" width="260" height="130" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <rect x="620" y="20" width="260" height="42" rx="14" fill="#1b3a63"/>
  <rect x="620" y="48" width="260" height="14" fill="#1b3a63"/>
  <text class="ttl" x="750" y="48" text-anchor="middle">Groupe du fluide</text>
  <text class="lbl" x="750" y="100" text-anchor="middle">dangereux (groupe 1)</text>
  <text class="lbl" x="750" y="124" text-anchor="middle">ou pas (groupe 2)</text>

  <!-- Flèches convergentes -->
  <path d="M 150 150 L 420 230" stroke="#0c4a6e" stroke-width="3.5" fill="none" marker-end="url(#fl-c1)"/>
  <path d="M 450 150 L 450 230" stroke="#0c4a6e" stroke-width="3.5" fill="none" marker-end="url(#fl-c2)"/>
  <path d="M 750 150 L 480 230" stroke="#0c4a6e" stroke-width="3.5" fill="none" marker-end="url(#fl-c3)"/>
  <defs>
    <marker id="fl-c1" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0c4a6e"/></marker>
    <marker id="fl-c2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0c4a6e"/></marker>
    <marker id="fl-c3" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0c4a6e"/></marker>
  </defs>

  <!-- Résultat -->
  <rect x="300" y="248" width="300" height="90" rx="14" fill="#eef3f9" stroke="#0c4a6e" stroke-width="3"/>
  <text class="res" x="450" y="286" text-anchor="middle">LA CATÉGORIE</text>
  <text class="lbl" x="450" y="312" text-anchor="middle">de I à IV</text>

  <text class="note" x="450" y="372" text-anchor="middle">Changez un seul des trois critères, et la catégorie peut changer avec lui.</text>
</svg>
