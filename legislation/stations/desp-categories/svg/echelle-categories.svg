<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"
     aria-labelledby="t-ech" aria-describedby="d-ech" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-ech">Une échelle de contrôle : plus la catégorie monte, plus il pèse</title>
  <desc id="d-ech">Quatre marches montantes, de la catégorie I à la catégorie IV. La marche I, la plus
    basse, porte la mention « évaluation assurée par le fabricant seul ». Les marches II et III
    montent progressivement, avec un contrôle qui s'alourdit. La marche IV, la plus haute, porte la
    mention « inspection par un organisme notifié ». Une flèche verticale à droite indique que le
    contrôle par un organisme extérieur grandit avec la hauteur des marches.</desc>
  <style>
    .num  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:26px; fill:#fffdf8; }
    .lbl  { font-size:14.5px; fill:#10233c; }
    .ax   { font-size:15px; fill:#10233c; font-weight:bold; }
    .note { font-size:15px; fill:#5a6b7d; font-style:italic; }
  </style>

  <!-- Ligne de base -->
  <line x1="60" y1="360" x2="760" y2="360" stroke="#10233c" stroke-width="2"/>

  <!-- Marche I -->
  <rect x="80" y="290" width="150" height="70" fill="#eef3f9" stroke="#0c4a6e" stroke-width="3"/>
  <text class="num" x="155" y="335" text-anchor="middle" fill="#0c4a6e">I</text>
  <text class="lbl" x="155" y="270" text-anchor="middle">Évaluation assurée</text>
  <text class="lbl" x="155" y="288" text-anchor="middle" font-weight="bold">par le fabricant seul</text>

  <!-- Marche II -->
  <rect x="250" y="230" width="150" height="130" fill="#dbe7f2" stroke="#0c4a6e" stroke-width="3"/>
  <text class="num" x="325" y="335" text-anchor="middle" fill="#0c4a6e">II</text>
  <text class="lbl" x="325" y="210" text-anchor="middle">Contrôle un peu</text>
  <text class="lbl" x="325" y="228" text-anchor="middle" font-weight="bold">plus poussé</text>

  <!-- Marche III -->
  <rect x="420" y="160" width="150" height="200" fill="#c7dced" stroke="#0c4a6e" stroke-width="3"/>
  <text class="num" x="495" y="335" text-anchor="middle" fill="#0c4a6e">III</text>
  <text class="lbl" x="495" y="140" text-anchor="middle">L'organisme notifié</text>
  <text class="lbl" x="495" y="158" text-anchor="middle" font-weight="bold">intervient davantage</text>

  <!-- Marche IV -->
  <rect x="590" y="80" width="150" height="280" fill="#0c4a6e"/>
  <text class="num" x="665" y="335" text-anchor="middle">IV</text>
  <text class="lbl" x="665" y="60" text-anchor="middle" fill="#10233c">Inspection par un</text>
  <text class="lbl" x="665" y="78" text-anchor="middle" font-weight="bold" fill="#10233c">organisme notifié</text>

  <!-- Flèche du contrôle croissant -->
  <path d="M 800 350 L 800 60" stroke="#b06a00" stroke-width="4" fill="none" marker-end="url(#fl-ech)"/>
  <defs>
    <marker id="fl-ech" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M0,10 L5,0 L10,10 z" fill="#b06a00"/></marker>
  </defs>
  <text class="ax" x="820" y="210" transform="rotate(-90 820 210)" text-anchor="middle">contrôle par un organisme extérieur</text>

  <text class="note" x="420" y="400" text-anchor="middle">D'une auto-certification en catégorie basse jusqu'à l'inspection tierce dans les catégories les plus hautes.</text>
</svg>
