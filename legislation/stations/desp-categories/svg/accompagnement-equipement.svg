<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img"
     aria-labelledby="t-acc" aria-describedby="d-acc" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-acc">Ce qui accompagne l'équipement</title>
  <desc id="d-acc">Un équipement sous pression au centre, relié par quatre traits à quatre éléments qui
    l'accompagnent : le marquage CE, la déclaration de conformité établie par le fabricant, la notice
    d'instructions, et un accessoire de sécurité qui protège contre le dépassement de la PS.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
    .lbl { font-size:14.5px; fill:#10233c; }
    .ce  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#0c4a6e; }
  </style>

  <!-- Équipement central -->
  <rect x="380" y="190" width="140" height="120" rx="14" fill="#1b3a63"/>
  <rect x="425" y="165" width="50" height="28" fill="#5a6b7d"/>
  <text class="ttl" x="450" y="440" text-anchor="middle">L'équipement</text>

  <!-- Marquage CE, en haut -->
  <line x1="450" y1="190" x2="450" y2="80" stroke="#5a6b7d" stroke-width="2.5"/>
  <rect x="370" y="20" width="160" height="60" rx="12" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <text class="ce" x="450" y="60" text-anchor="middle">CE</text>

  <!-- Déclaration de conformité, à gauche -->
  <line x1="380" y1="240" x2="200" y2="240" stroke="#5a6b7d" stroke-width="2.5"/>
  <rect x="20" y="185" width="180" height="110" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <rect x="40" y="205" width="140" height="10" fill="#1b3a63"/>
  <rect x="40" y="225" width="140" height="10" fill="#d6dee7"/>
  <rect x="40" y="245" width="90" height="10" fill="#d6dee7"/>
  <text class="lbl" x="110" y="282" text-anchor="middle" font-weight="bold">Déclaration de conformité</text>

  <!-- Notice d'instructions, à droite -->
  <line x1="520" y1="240" x2="700" y2="240" stroke="#5a6b7d" stroke-width="2.5"/>
  <rect x="700" y="185" width="180" height="110" rx="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <rect x="720" y="205" width="140" height="10" fill="#1b3a63"/>
  <rect x="720" y="225" width="140" height="10" fill="#d6dee7"/>
  <rect x="720" y="245" width="100" height="10" fill="#d6dee7"/>
  <text class="lbl" x="790" y="282" text-anchor="middle" font-weight="bold">Notice d'instructions</text>

  <!-- Accessoire de sécurité, en bas -->
  <line x1="450" y1="310" x2="450" y2="380" stroke="#5a6b7d" stroke-width="2.5"/>
  <rect x="350" y="380" width="200" height="70" rx="12" fill="#fffdf8" stroke="#b06a00" stroke-width="3"/>
  <text class="lbl" x="450" y="405" text-anchor="middle" font-weight="bold">Accessoire de sécurité</text>
  <text class="lbl" x="450" y="425" text-anchor="middle">protège contre le dépassement de la PS</text>
</svg>
