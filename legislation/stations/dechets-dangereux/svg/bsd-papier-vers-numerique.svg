<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-p2n" aria-describedby="d-p2n" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-p2n">Le bordereau existe aujourd'hui sous forme numérique</title>
  <desc id="d-p2n">À gauche, un document papier représentant l'ancien bordereau de suivi, marqué
    « papier » et traversé d'un trait en diagonale pour signaler qu'il a laissé la place à autre chose.
    Une flèche part vers la droite, jusqu'à un écran affichant la même chaîne de traçabilité en trois
    maillons que sur le document papier — pour montrer que le principe ne change pas, seul le support
    change. Une bande en bas précise qu'il s'agit d'un registre national numérique.</desc>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#fffdf8; }
    .lbl { font-size:16px; fill:#10233c; }
    .petit { font-size:14px; fill:#5a6b7d; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
  </style>

  <!-- Document papier -->
  <rect x="60" y="50" width="220" height="180" rx="10" fill="#fffdf8" stroke="#5a6b7d" stroke-width="3"/>
  <rect x="60" y="50" width="220" height="34" rx="10" fill="#5a6b7d"/>
  <rect x="60" y="66" width="220" height="18" fill="#5a6b7d"/>
  <text class="ttl" x="170" y="74" text-anchor="middle">BSD — PAPIER</text>
  <line x1="86" y1="108" x2="254" y2="108" stroke="#d6dee7" stroke-width="4"/>
  <line x1="86" y1="132" x2="254" y2="132" stroke="#d6dee7" stroke-width="4"/>
  <line x1="86" y1="156" x2="220" y2="156" stroke="#d6dee7" stroke-width="4"/>
  <!-- trait diagonal signalant l'ancien support -->
  <line x1="70" y1="220" x2="270" y2="92" stroke="#c0392b" stroke-width="3"/>
  <text class="petit" x="170" y="252" text-anchor="middle">l'ancien support</text>

  <!-- Flèche -->
  <line x1="310" y1="140" x2="560" y2="140" stroke="#57534e" stroke-width="6"/>
  <polygon points="560,140 534,124 534,156" fill="#57534e"/>
  <text class="petit" x="435" y="118" text-anchor="middle">le principe ne change pas</text>

  <!-- Écran numérique -->
  <rect x="600" y="40" width="240" height="170" rx="12" fill="#10233c"/>
  <rect x="618" y="58" width="204" height="134" rx="6" fill="#fffdf8"/>
  <text class="lbl" x="720" y="80" text-anchor="middle" font-weight="bold" font-size="14px">REGISTRE NUMÉRIQUE</text>
  <circle cx="654" cy="112" r="12" fill="none" stroke="#1b3a63" stroke-width="3"/>
  <line x1="666" y1="112" x2="694" y2="112" stroke="#d6dee7" stroke-width="3"/>
  <circle cx="720" cy="112" r="12" fill="none" stroke="#1b3a63" stroke-width="3"/>
  <line x1="732" y1="112" x2="760" y2="112" stroke="#d6dee7" stroke-width="3"/>
  <circle cx="786" cy="112" r="12" fill="none" stroke="#1b3a63" stroke-width="3"/>
  <text class="petit" x="720" y="146" text-anchor="middle">même chaîne, même suivi</text>
  <rect x="700" y="212" width="40" height="16" fill="#5a6b7d"/>
  <rect x="668" y="228" width="104" height="10" rx="4" fill="#5a6b7d"/>

  <!-- Bande de conclusion -->
  <rect x="60" y="266" width="780" height="52" rx="12" fill="#efece9" stroke="#57534e" stroke-width="2"/>
  <text class="band" x="450" y="298" text-anchor="middle">Un registre national numérique — seul le support a changé</text>
</svg>
