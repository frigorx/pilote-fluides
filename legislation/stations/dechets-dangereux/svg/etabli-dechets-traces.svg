<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
     aria-labelledby="t-etab" aria-describedby="d-etab" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-etab">Ce qu'un frigoriste trace vraiment sur un chantier</title>
  <desc id="d-etab">Un établi de frigoriste. À gauche, encadrés en rouge et reliés par un trait plein
    à un bordereau de suivi : une bouteille de fluide récupéré non réutilisable, un bidon d'huile
    usagée, et un filtre déshydrateur contaminé — les déchets dangereux à tracer. À droite, hors de ce
    cadre rouge et sans lien vers le bordereau : une chute de cuivre et un carton, qui suivent la
    filière classique de tri.</desc>
  <style>
    .lbl { font-size:15.5px; fill:#10233c; }
    .titre { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
  </style>

  <!-- Plan de l'établi -->
  <rect x="20" y="290" width="860" height="20" fill="#8fa0b0"/>
  <rect x="40" y="310" width="16" height="40" fill="#5a6b7d"/>
  <rect x="824" y="310" width="16" height="40" fill="#5a6b7d"/>

  <text class="titre" x="220" y="40" text-anchor="middle">Déchets dangereux — tracés</text>
  <text class="titre" x="700" y="40" text-anchor="middle" fill="#57534e">Tri classique — non tracés</text>

  <!-- Cadre rouge : déchets dangereux -->
  <rect x="30" y="54" width="380" height="170" rx="14" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="12 6"/>

  <!-- Bouteille de fluide -->
  <rect x="52" y="80" width="50" height="18" rx="6" fill="#5a6b7d"/>
  <rect x="46" y="98" width="62" height="96" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="lbl" x="77" y="216" text-anchor="middle" font-size="13.5px">Fluide non</text>
  <text class="lbl" x="77" y="232" text-anchor="middle" font-size="13.5px">réutilisable</text>

  <!-- Bidon d'huile -->
  <rect x="150" y="100" width="70" height="16" fill="none" stroke="#5a6b7d" stroke-width="5" stroke-linecap="round"/>
  <rect x="135" y="112" width="100" height="82" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="lbl" x="185" y="216" text-anchor="middle" font-size="13.5px">Huile usagée</text>

  <!-- Filtre déshydrateur -->
  <rect x="272" y="120" width="100" height="46" rx="20" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <circle cx="278" cy="143" r="5" fill="#1b3a63"/>
  <circle cx="366" cy="143" r="5" fill="#1b3a63"/>
  <text class="lbl" x="322" y="216" text-anchor="middle" font-size="13.5px">Filtre contaminé</text>

  <!-- Lien vers le bordereau -->
  <line x1="220" y1="224" x2="220" y2="252" stroke="#c0392b" stroke-width="4"/>
  <rect x="80" y="252" width="280" height="40" rx="10" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
  <text class="lbl" x="220" y="278" text-anchor="middle" font-weight="bold" font-size="14.5px">Bordereau de suivi (BSD)</text>

  <!-- Zone hors cadre : cuivre et carton -->
  <!-- chute de cuivre -->
  <path d="M 560 100 q 40 -20 80 0 q 20 30 -10 60 q -50 20 -80 -20 q -10 -20 10 -40 z" fill="#e8914a" stroke="#b06a00" stroke-width="3"/>
  <text class="lbl" x="600" y="216" text-anchor="middle" font-size="13.5px">Chute de cuivre</text>

  <!-- carton -->
  <rect x="700" y="110" width="110" height="90" rx="8" fill="#fffdf8" stroke="#5a6b7d" stroke-width="3"/>
  <line x1="700" y1="110" x2="755" y2="155" stroke="#5a6b7d" stroke-width="2"/>
  <line x1="810" y1="110" x2="755" y2="155" stroke="#5a6b7d" stroke-width="2"/>
  <text class="lbl" x="755" y="216" text-anchor="middle" font-size="13.5px">Carton</text>

  <text class="lbl" x="755" y="270" text-anchor="middle" fill="#5a6b7d" font-size="14px">hors du bordereau —</text>
  <text class="lbl" x="755" y="288" text-anchor="middle" fill="#5a6b7d" font-size="14px">filière de tri classique</text>

  <!-- Bande de conclusion -->
  <rect x="20" y="330" width="860" height="42" rx="10" fill="#efece9" stroke="#57534e" stroke-width="2"/>
  <text class="band" x="450" y="356" text-anchor="middle">Fluide non réutilisable, huile, filtre contaminé : ce que le frigoriste trace</text>
</svg>
