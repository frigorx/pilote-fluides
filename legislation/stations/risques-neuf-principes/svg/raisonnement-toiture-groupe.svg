<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img"
     aria-labelledby="t-rt" aria-describedby="d-rt" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-rt">Le raisonnement filé sur une intervention de groupe en toiture, principe après principe</title>
  <desc id="d-rt">Cinq étapes numérotées reliées par une flèche qui descend en escalier, sur fond d'un
    profil de toiture avec un groupe extérieur posé dessus. Étape 1, éviter : peut-on intervenir depuis le
    sol ou une nacelle plutôt que monter. Étape 2, évaluer : hauteur, état du toit, météo du jour. Étape 3,
    collectif : garde-corps ou ligne de vie posée avant que quiconque monte. Étape 4, planifier : créneau
    et matériel prévus à l'avance, pas improvisés sur place. Étape 5, dernière étape tracée en orange :
    instructions données au technicien puis harnais, comme filet si la protection collective ne suffit
    pas entièrement.</desc>
  <style>
    .num  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#fffdf8; }
    .tit  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:15px; fill:#1b3a63; }
    .tit-last { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:15px; fill:#c2410c; }
    .lbl  { font-size:14px; fill:#10233c; }
  </style>

  <!-- toit en fond, discret -->
  <polygon points="560,440 880,440 880,340 720,280 560,340" fill="#eef3f9" stroke="#d6dee7" stroke-width="2"/>
  <rect x="740" y="300" width="40" height="30" fill="#fffdf8" stroke="#5a6b7d" stroke-width="2"/>

  <!-- étape 1 -->
  <circle cx="46" cy="46" r="18" fill="#1b3a63"/><text class="num" x="46" y="52" text-anchor="middle">1</text>
  <rect x="76" y="24" width="300" height="52" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
  <text class="tit" x="90" y="44">ÉVITER</text>
  <text class="lbl" x="90" y="66">Le faire depuis le sol ou une nacelle ?</text>

  <line x1="60" y1="76" x2="60" y2="106" stroke="#1b3a63" stroke-width="2.5" marker-end="url(#fd)"/>

  <!-- étape 2 -->
  <circle cx="46" cy="132" r="18" fill="#1b3a63"/><text class="num" x="46" y="138" text-anchor="middle">2</text>
  <rect x="76" y="110" width="300" height="52" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
  <text class="tit" x="90" y="130">ÉVALUER</text>
  <text class="lbl" x="90" y="152">Hauteur, état du toit, météo du jour</text>

  <line x1="60" y1="162" x2="60" y2="192" stroke="#1b3a63" stroke-width="2.5" marker-end="url(#fd)"/>

  <!-- étape 3 -->
  <circle cx="46" cy="218" r="18" fill="#1b3a63"/><text class="num" x="46" y="224" text-anchor="middle">3</text>
  <rect x="76" y="196" width="300" height="52" rx="10" fill="#fffdf8" stroke="#1e7e54" stroke-width="2"/>
  <text class="tit" x="90" y="216" fill="#1e7e54">COLLECTIF</text>
  <text class="lbl" x="90" y="238">Garde-corps posé avant que quiconque monte</text>

  <line x1="60" y1="248" x2="60" y2="278" stroke="#1b3a63" stroke-width="2.5" marker-end="url(#fd)"/>

  <!-- étape 4 -->
  <circle cx="46" cy="304" r="18" fill="#1b3a63"/><text class="num" x="46" y="310" text-anchor="middle">4</text>
  <rect x="76" y="282" width="300" height="52" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
  <text class="tit" x="90" y="302">PLANIFIER</text>
  <text class="lbl" x="90" y="324">Créneau et matériel prévus à l'avance</text>

  <line x1="60" y1="334" x2="60" y2="364" stroke="#c2410c" stroke-width="2.5" marker-end="url(#fo)"/>

  <!-- étape 5 : instructions + EPI en dernier -->
  <circle cx="46" cy="390" r="18" fill="#c2410c"/><text class="num" x="46" y="396" text-anchor="middle">5</text>
  <rect x="76" y="368" width="300" height="66" rx="10" fill="#fffdf8" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text class="tit-last" x="90" y="390">INSTRUCTIONS PUIS EPI</text>
  <text class="lbl" x="90" y="410">Le technicien sait comment s'accrocher ;</text>
  <text class="lbl" x="90" y="428">le harnais vient en dernier filet</text>

  <defs>
    <marker id="fd" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,10 L10,0 Z" fill="#1b3a63"/>
    </marker>
    <marker id="fo" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,10 L10,0 Z" fill="#c2410c"/>
    </marker>
  </defs>
</svg>
