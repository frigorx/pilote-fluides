<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-6" aria-describedby="d-6" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-6">Le réflexe : vérifier avant de sortir le matériel</title>
  <desc id="d-6">Une silhouette de technicien se tient au pied d'un accès en hauteur, une fiche à la main.
    La fiche porte deux cases cochées en vert : « accès vérifié » et « garde-corps en place ». Un sac à
    outils fermé, posé au sol à côté, indique que le matériel n'est pas encore sorti.</desc>
  <style>
    .lbl{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .sub{ font-size:14px; fill:#5a6b7d; }
  </style>

  <!-- Silhouette -->
  <circle cx="220" cy="130" r="24" fill="#fde9d0" stroke="#10233c" stroke-width="2.5"/>
  <rect x="196" y="154" width="48" height="80" rx="14" fill="#fde9d0" stroke="#10233c" stroke-width="2.5"/>

  <!-- Fiche à la main -->
  <rect x="250" y="170" width="150" height="90" rx="10" fill="#fffdf8" stroke="#c2410c" stroke-width="3"/>
  <rect x="266" y="188" width="20" height="20" rx="5" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2.5"/>
  <path d="M270 198 l5 5 l10 -12" fill="none" stroke="#1e7e54" stroke-width="3" stroke-linecap="round"/>
  <text x="294" y="203" font-size="13" fill="#10233c">Accès vérifié</text>
  <rect x="266" y="218" width="20" height="20" rx="5" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2.5"/>
  <path d="M270 228 l5 5 l10 -12" fill="none" stroke="#1e7e54" stroke-width="3" stroke-linecap="round"/>
  <text x="294" y="233" font-size="13" fill="#10233c">Garde-corps en place</text>

  <!-- Sac à outils au sol, fermé -->
  <rect x="500" y="250" width="90" height="55" rx="10" fill="#e9d9b0" stroke="#b06a00" stroke-width="2.5"/>
  <rect x="530" y="238" width="30" height="16" rx="4" fill="none" stroke="#b06a00" stroke-width="2.5"/>
  <text class="sub" x="545" y="322" text-anchor="middle">matériel encore au sol</text>

  <!-- Accès en fond -->
  <line x1="700" y1="60" x2="700" y2="300" stroke="#1b3a63" stroke-width="6"/>
  <line x1="740" y1="60" x2="740" y2="300" stroke="#1b3a63" stroke-width="6"/>
  <line x1="700" y1="100" x2="740" y2="100" stroke="#1b3a63" stroke-width="4"/>
  <line x1="700" y1="150" x2="740" y2="150" stroke="#1b3a63" stroke-width="4"/>
  <line x1="700" y1="200" x2="740" y2="200" stroke="#1b3a63" stroke-width="4"/>
  <text class="lbl" x="720" y="330" text-anchor="middle">Accès</text>
</svg>
