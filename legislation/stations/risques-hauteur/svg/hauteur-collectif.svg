<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-3" aria-describedby="d-3" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-3">Le garde-corps : la protection collective avant l'individuelle</title>
  <desc id="d-3">Le bord d'une toiture est représenté avec un garde-corps mis en évidence en orange,
    montant à mi-hauteur d'une silhouette debout à côté. Une bande en bas rappelle que cette protection
    profite à toute personne présente, avant même de penser à un équipement individuel.</desc>
  <style>
    .toit{ fill:#eef3f9; stroke:#2f5689; stroke-width:2; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
  </style>

  <rect class="toit" x="60" y="180" width="500" height="60"/>

  <!-- Garde-corps -->
  <line x1="560" y1="180" x2="560" y2="90" stroke="#c2410c" stroke-width="7" stroke-linecap="round"/>
  <line x1="560" y1="110" x2="700" y2="110" stroke="#c2410c" stroke-width="7" stroke-linecap="round"/>
  <line x1="560" y1="150" x2="700" y2="150" stroke="#c2410c" stroke-width="7" stroke-linecap="round"/>
  <line x1="700" y1="180" x2="700" y2="90" stroke="#c2410c" stroke-width="7" stroke-linecap="round"/>

  <!-- Silhouette -->
  <circle cx="330" cy="130" r="22" fill="#fde9d0" stroke="#10233c" stroke-width="2.5"/>
  <rect x="312" y="152" width="36" height="60" rx="12" fill="#fde9d0" stroke="#10233c" stroke-width="2.5"/>

  <rect x="30" y="270" width="840" height="56" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="450" y="305" text-anchor="middle">Le garde-corps protège tout le monde — installé avant l'équipement individuel</text>
</svg>
