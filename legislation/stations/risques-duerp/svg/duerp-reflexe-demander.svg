<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img"
     aria-labelledby="t-rf" aria-describedby="d-rf" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-rf">Le réflexe concret : demander à voir le document</title>
  <desc id="d-rf">À gauche, un technicien porte une bulle de parole listant les questions à poser :
    coactivité, accès, engins, atmosphère particulière. Une flèche en pointillé part de lui vers
    la droite, où un responsable du site tient un document, avec la mention « demander à voir le
    document, ou poser ces questions ». En bas, une bande rappelle que ce geste se fait avant
    l'intervention, sur tout site qui n'est pas le sien.</desc>
  <style>
    .lbl { font-size:14.5px; fill:#10233c; }
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:15px; fill:#10233c; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
    .petit{ font-size:13px; fill:#5a6b7d; }
  </style>

  <!-- technicien -->
  <circle cx="140" cy="150" r="15" fill="#fffdf8" stroke="#10233c" stroke-width="2.5"/>
  <line x1="140" y1="165" x2="140" y2="205" stroke="#10233c" stroke-width="2.5"/>
  <line x1="140" y1="178" x2="118" y2="198" stroke="#10233c" stroke-width="2.5"/>
  <line x1="140" y1="178" x2="162" y2="198" stroke="#10233c" stroke-width="2.5"/>
  <line x1="140" y1="205" x2="124" y2="235" stroke="#10233c" stroke-width="2.5"/>
  <line x1="140" y1="205" x2="156" y2="235" stroke="#10233c" stroke-width="2.5"/>
  <text class="petit" x="140" y="252" text-anchor="middle">le technicien</text>

  <!-- bulle de parole avec les questions -->
  <rect x="40" y="20" width="270" height="98" rx="14" fill="#fffdf8" stroke="#c2410c" stroke-width="2.5"/>
  <path d="M120,118 L108,140 L146,120 Z" fill="#fffdf8" stroke="#c2410c" stroke-width="2.5"/>
  <text class="ttl" x="175" y="42" text-anchor="middle">Les questions à poser</text>
  <text class="lbl" x="60" y="64">— coactivité avec d'autres corps de métier ?</text>
  <text class="lbl" x="60" y="82">— accès particulier ?</text>
  <text class="lbl" x="60" y="100">— engins de levage, zone particulière ?</text>

  <!-- responsable du site, à droite, avec document -->
  <circle cx="700" cy="150" r="15" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
  <line x1="700" y1="165" x2="700" y2="205" stroke="#1b3a63" stroke-width="2.5"/>
  <line x1="700" y1="178" x2="678" y2="192" stroke="#1b3a63" stroke-width="2.5"/>
  <line x1="700" y1="178" x2="722" y2="192" stroke="#1b3a63" stroke-width="2.5"/>
  <line x1="700" y1="205" x2="684" y2="235" stroke="#1b3a63" stroke-width="2.5"/>
  <line x1="700" y1="205" x2="716" y2="235" stroke="#1b3a63" stroke-width="2.5"/>
  <text class="petit" x="700" y="252" text-anchor="middle">le responsable du site</text>

  <!-- document tenu -->
  <rect x="715" y="175" width="46" height="60" rx="4" fill="#fffdf8" stroke="#1e7e54" stroke-width="2"/>
  <rect x="722" y="184" width="32" height="5" fill="#1e7e54"/>
  <rect x="722" y="196" width="32" height="4" fill="#d6dee7"/>
  <rect x="722" y="206" width="32" height="4" fill="#d6dee7"/>

  <!-- flèche pointillée -->
  <defs>
    <marker id="fl-rf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <path d="M180,180 C320,150 500,150 610,175" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#fl-rf)"/>
  <text class="ttl" x="400" y="150" text-anchor="middle" fill="#c2410c">demander à voir le document</text>

  <!-- bande basse -->
  <rect x="20" y="280" width="860" height="58" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="450" y="315" text-anchor="middle">Avant d'intervenir, sur tout site qui n'est pas le vôtre</text>
</svg>
