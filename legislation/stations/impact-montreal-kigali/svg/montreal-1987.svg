<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img"
     aria-labelledby="t-mtl" aria-describedby="d-mtl" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-mtl">1987, le protocole de Montréal : le problème de l'ozone</title>
  <desc id="d-mtl">À gauche, un schéma de l'atmosphère : le soleil en haut, puis un bandeau représentant la couche
    d'ozone, avec en son centre une zone plus claire et pointillée qui figure son amincissement. En dessous, trois
    petites molécules portant chacune la lettre Cl ou Br montent vers cette zone claire, avec des flèches, pour
    montrer que le chlore et le brome sont ceux qui attaquent l'ozone stratosphérique. À droite, un document
    intitulé Protocole de Montréal, 1987, qui liste deux cibles dans l'ordre : d'abord les CFC, puis les HCFC.</desc>
  <style>
    .ttl{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fffdf8; }
    .lblGras{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
    .lbl{ font-size:15px; fill:#10233c; }
    .lblMut{ font-size:15px; fill:#5a6b7d; }
    .mol{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:15px; fill:#fffdf8; }
    .num{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#fffdf8; }
  </style>

  <!-- ===== Partie gauche : l'atmosphère ===== -->
  <rect x="20" y="20" width="400" height="320" rx="14" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="70" cy="66" r="26" fill="#b06a00"/>
  <text class="lblMut" x="70" y="112" text-anchor="middle">soleil</text>

  <!-- couche d'ozone : bandeau avec zone amincie au centre -->
  <rect x="45" y="140" width="130" height="26" fill="#1b3a63"/>
  <rect x="175" y="140" width="90" height="26" fill="#c7d6e6" stroke="#1b3a63" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="265" y="140" width="130" height="26" fill="#1b3a63"/>
  <text class="lblMut" x="220" y="188" text-anchor="middle">couche d'ozone</text>
  <text class="lblMut" x="220" y="206" text-anchor="middle">la zone claire s'amincit</text>

  <!-- molécules Cl/Br montant vers la zone amincie -->
  <circle cx="150" cy="290" r="18" fill="#c0392b"/>
  <text class="mol" x="150" y="295" text-anchor="middle">Cl</text>
  <path d="M155,272 L200,168" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-dasharray="4 4"/>

  <circle cx="220" cy="300" r="18" fill="#c0392b"/>
  <text class="mol" x="220" y="305" text-anchor="middle">Cl</text>
  <path d="M220,282 L220,170" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-dasharray="4 4"/>

  <circle cx="290" cy="290" r="18" fill="#c0392b"/>
  <text class="mol" x="290" y="295" text-anchor="middle">Br</text>
  <path d="M285,272 L240,168" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-dasharray="4 4"/>

  <text class="lbl" x="220" y="330" text-anchor="middle" fill="#c0392b">le chlore et le brome attaquent l'ozone</text>

  <!-- ===== Partie droite : le document ===== -->
  <rect x="450" y="20" width="430" height="320" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <rect x="450" y="20" width="430" height="46" rx="14" fill="#1b3a63"/>
  <rect x="450" y="52" width="430" height="14" fill="#1b3a63"/>
  <text class="ttl" x="665" y="52" text-anchor="middle">PROTOCOLE DE MONTRÉAL — 1987</text>
  <text class="lblMut" x="665" y="90" text-anchor="middle">traité international pour sauver l'ozone</text>

  <!-- cible 1 : CFC -->
  <circle cx="500" cy="140" r="20" fill="#1b3a63"/>
  <text class="num" x="500" y="146" text-anchor="middle">1</text>
  <text class="lblGras" x="536" y="134">Les CFC</text>
  <text class="lbl" x="536" y="156">supprimés progressivement</text>

  <path d="M500,180 L500,208" stroke="#5a6b7d" stroke-width="2.5" fill="none"/>

  <!-- cible 2 : HCFC -->
  <circle cx="500" cy="240" r="20" fill="#1b3a63"/>
  <text class="num" x="500" y="246" text-anchor="middle">2</text>
  <text class="lblGras" x="536" y="234">Puis les HCFC</text>
  <text class="lbl" x="536" y="256">supprimés à leur tour</text>

  <rect x="470" y="284" width="380" height="42" rx="10" fill="#eef3f9" stroke="#2f5689" stroke-width="1.5"/>
  <text class="lbl" x="660" y="310" text-anchor="middle">deux familles : chlore ou brome dans la molécule</text>
</svg>
