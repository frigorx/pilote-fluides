<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"
     aria-labelledby="t-qs" aria-describedby="d-qs" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-qs">Quatre situations de terrain pour raisonner</title>
  <desc id="d-qs">Quatre cartes numérotées de 1 à 4, disposées en grille de deux colonnes. Chacune porte une
    situation rencontrée sur le terrain et la réponse qui s'en déduit : remplacer un vieux CFC repéré au chlore,
    utiliser une machine à HFC à PRP élevé qui reste conforme pour l'ozone mais sous surveillance pour le climat,
    choisir un fluide à faible PRP comme le CO2, le propane ou l'ammoniac, et lire l'étiquette HCFC d'un fluide
    encore visé par le protocole de Montréal.</desc>
  <style>
    .lblGras{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
    .lbl{ font-size:15px; fill:#10233c; }
    .num{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:20px; fill:#fffdf8; }
    .reponse{ font-size:15px; fill:#047857; font-weight:bold; }
  </style>

  <!-- Carte 1 -->
  <rect x="20" y="20" width="420" height="180" rx="14" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
  <circle cx="56" cy="56" r="20" fill="#047857"/>
  <text class="num" x="56" y="63" text-anchor="middle">1</text>
  <text class="lblGras" x="90" y="62">« Je remplace un vieux CFC. »</text>
  <text class="lbl" x="44" y="98">Le repérer : il contient du chlore,</text>
  <text class="lbl" x="44" y="120">c'est lui que Montréal vise en premier.</text>
  <text class="reponse" x="44" y="156">→ le remplacer par un fluide sans</text>
  <text class="reponse" x="44" y="178">chlore ni brome.</text>

  <!-- Carte 2 -->
  <rect x="460" y="20" width="420" height="180" rx="14" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
  <circle cx="496" cy="56" r="20" fill="#047857"/>
  <text class="num" x="496" y="63" text-anchor="middle">2</text>
  <text class="lblGras" x="530" y="52">« Ma machine tourne au HFC,</text>
  <text class="lblGras" x="530" y="72">PRP élevé. »</text>
  <text class="lbl" x="484" y="106">Conforme pour l'ozone : ODP nul.</text>
  <text class="reponse" x="484" y="142">→ sous surveillance pour le climat,</text>
  <text class="reponse" x="484" y="164">via Kigali et F-Gaz 3.</text>

  <!-- Carte 3 -->
  <rect x="20" y="220" width="420" height="180" rx="14" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
  <circle cx="56" cy="256" r="20" fill="#047857"/>
  <text class="num" x="56" y="263" text-anchor="middle">3</text>
  <text class="lblGras" x="90" y="252">« Je choisis un fluide à faible</text>
  <text class="lblGras" x="90" y="272">PRP. »</text>
  <text class="lbl" x="44" y="306">CO₂, propane, ammoniac : des</text>
  <text class="lbl" x="44" y="328">exemples au PRP très bas.</text>
  <text class="reponse" x="44" y="364">→ un choix qui anticipe la suite</text>
  <text class="reponse" x="44" y="386">du mouvement engagé par Kigali.</text>

  <!-- Carte 4 -->
  <rect x="460" y="220" width="420" height="180" rx="14" fill="#fffdf8" stroke="#047857" stroke-width="2.5"/>
  <circle cx="496" cy="256" r="20" fill="#047857"/>
  <text class="num" x="496" y="263" text-anchor="middle">4</text>
  <text class="lblGras" x="530" y="262">« Je vois HCFC sur une étiquette. »</text>
  <text class="lbl" x="484" y="296">Un fluide historique, avec du chlore,</text>
  <text class="lbl" x="484" y="318">visé lui aussi par Montréal.</text>
  <text class="reponse" x="484" y="354">→ un fluide en retrait progressif,</text>
  <text class="reponse" x="484" y="376">à surveiller à chaque intervention.</text>
</svg>
