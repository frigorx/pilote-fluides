<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-7" aria-describedby="d-7" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-7">Les quatre familles d'EPI du métier</title>
  <desc id="d-7">Quatre pictogrammes schématiques alignés horizontalement, chacun dans un cadre et nommé
    en dessous : un gant, une paire de lunettes, une chaussure de sécurité, un casque antibruit.</desc>
  <style>
    .cadre{ fill:#fffdf8; stroke:#d6dee7; stroke-width:2; }
    .lbl{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:16px; fill:#10233c; }
  </style>

  <!-- Gant -->
  <rect class="cadre" x="30" y="40" width="190" height="220" rx="14"/>
  <path d="M100 200 v-70 q0 -14 14 -14 q14 0 14 14 v34
           q0 -14 14 -14 q14 0 14 14 v26
           q0 -12 12 -12 q12 0 12 12 v50 q0 24 -24 24 h-50 q-14 0 -14 -14 z"
        fill="#fde9d0" stroke="#c2410c" stroke-width="2.5"/>
  <text class="lbl" x="125" y="240" text-anchor="middle">Gants</text>

  <!-- Lunettes -->
  <rect class="cadre" x="245" y="40" width="190" height="220" rx="14"/>
  <ellipse cx="310" cy="150" rx="26" ry="18" fill="#fff" stroke="#c2410c" stroke-width="3"/>
  <ellipse cx="370" cy="150" rx="26" ry="18" fill="#fff" stroke="#c2410c" stroke-width="3"/>
  <line x1="336" y1="150" x2="344" y2="150" stroke="#c2410c" stroke-width="3"/>
  <text class="lbl" x="340" y="240" text-anchor="middle">Lunettes</text>

  <!-- Chaussure -->
  <rect class="cadre" x="460" y="40" width="190" height="220" rx="14"/>
  <path d="M500 190 h60 q20 0 20 -18 v-10 l-30 -20 h-50 z" fill="#fde9d0" stroke="#c2410c" stroke-width="2.5"/>
  <rect x="495" y="188" width="95" height="14" rx="6" fill="#10233c"/>
  <text class="lbl" x="555" y="240" text-anchor="middle">Chaussures</text>

  <!-- Casque antibruit -->
  <rect class="cadre" x="675" y="40" width="195" height="220" rx="14"/>
  <path d="M715 160 a58 58 0 0 1 116 0" fill="none" stroke="#c2410c" stroke-width="6"/>
  <rect x="705" y="150" width="26" height="40" rx="8" fill="#fde9d0" stroke="#c2410c" stroke-width="2.5"/>
  <rect x="821" y="150" width="26" height="40" rx="8" fill="#fde9d0" stroke="#c2410c" stroke-width="2.5"/>
  <text class="lbl" x="772" y="240" text-anchor="middle">Protection auditive</text>
</svg>
