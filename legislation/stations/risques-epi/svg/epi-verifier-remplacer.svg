<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-4" aria-describedby="d-4" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-4">Un EPI abîmé se remplace, il ne se répare pas</title>
  <desc id="d-4">Une fiche de vérification porte deux silhouettes de gant. Le gant de gauche montre une
    déchirure schématique et une croix rouge avec la mention « à changer ». Le gant de droite est intact et
    porte une coche verte avec la mention « bon état ».</desc>
  <style>
    .fiche{ fill:#fffdf8; stroke:#d6dee7; stroke-width:2; }
    .lbl{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:18px; }
    .sub{ font-size:15px; fill:#5a6b7d; }
  </style>

  <rect class="fiche" x="30" y="30" width="840" height="280" rx="16"/>
  <text x="450" y="66" text-anchor="middle" font-family="'Trebuchet MS',Calibri,sans-serif" font-weight="bold" font-size="19" fill="#10233c">Fiche de vérification avant usage</text>

  <!-- Gant abîmé -->
  <path d="M170 110 q-30 0 -30 40 v70 q0 30 30 30 h100 q30 0 30 -30 v-70 q0 -40 -30 -40 z"
        fill="#fde9d0" stroke="#10233c" stroke-width="2.5"/>
  <path d="M190 150 l20 30 l-8 6 l-20 -30 z" fill="#fffdf8" stroke="#c0392b" stroke-width="2"/>
  <circle cx="330" cy="140" r="22" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
  <path d="M320 130 l20 20 M340 130 l-20 20" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <text class="lbl" x="220" y="270" text-anchor="middle" fill="#c0392b">À changer</text>
  <text class="sub" x="220" y="292" text-anchor="middle">gant percé</text>

  <!-- Gant bon état -->
  <path d="M570 110 q-30 0 -30 40 v70 q0 30 30 30 h100 q30 0 30 -30 v-70 q0 -40 -30 -40 z"
        fill="#fde9d0" stroke="#10233c" stroke-width="2.5"/>
  <circle cx="730" cy="140" r="22" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/>
  <path d="M720 140 l7 8 l14 -16" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round"/>
  <text class="lbl" x="620" y="270" text-anchor="middle" fill="#1e7e54">Bon état</text>
  <text class="sub" x="620" y="292" text-anchor="middle">gant intact</text>
</svg>
