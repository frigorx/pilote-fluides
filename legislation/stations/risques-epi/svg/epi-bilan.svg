<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="t-8" aria-describedby="d-8" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-8">La fiche du réflexe : trois questions avant de commencer</title>
  <desc id="d-8">Une fiche récapitulative porte trois cases à cocher, toutes trois cochées en vert :
    « adapté à la tâche », « en bon état », « bien porté ». Un bandeau en tête rappelle qu'il s'agit du
    réflexe à avoir avant chaque intervention.</desc>
  <style>
    .fiche{ fill:#fffdf8; stroke:#d6dee7; stroke-width:2; }
    .ttl{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#fffdf8; }
    .lbl{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
  </style>

  <rect class="fiche" x="150" y="30" width="600" height="280" rx="16"/>
  <rect x="150" y="30" width="600" height="50" rx="16" fill="#c2410c"/>
  <rect x="150" y="56" width="600" height="16" fill="#c2410c"/>
  <text class="ttl" x="450" y="63" text-anchor="middle">Avant de commencer</text>

  <g>
    <rect x="190" y="110" width="34" height="34" rx="8" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/>
    <path d="M198 128 l8 8 l18 -20" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round"/>
    <text class="lbl" x="245" y="134">Adapté à la tâche du jour</text>
  </g>
  <g>
    <rect x="190" y="170" width="34" height="34" rx="8" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/>
    <path d="M198 188 l8 8 l18 -20" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round"/>
    <text class="lbl" x="245" y="194">En bon état, vérifié</text>
  </g>
  <g>
    <rect x="190" y="230" width="34" height="34" rx="8" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/>
    <path d="M198 248 l8 8 l18 -20" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round"/>
    <text class="lbl" x="245" y="254">Bien porté, bien ajusté</text>
  </g>
</svg>
