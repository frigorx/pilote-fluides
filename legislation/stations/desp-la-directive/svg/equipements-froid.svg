<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img"
     aria-labelledby="t-fro" aria-describedby="d-fro" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-fro">Cinq équipements frigorifiques concernés par la directive</title>
  <desc id="d-fro">Cinq cartes alignées, chacune avec un pictogramme simple et son nom : une bouteille
    de fluide frigorigène, un réservoir de liquide, un séparateur d'huile, un condenseur, et une
    tuyauterie frigorifique. Les quatre premiers portent l'étiquette « récipient », le cinquième
    l'étiquette « tuyauterie ». Une bande sous les cartes rappelle que chacun entre dans le champ de
    la directive dès qu'il dépasse le seuil de pression fixé par le texte.</desc>
  <style>
    .nom  { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:15.5px; fill:#0c4a6e; }
    .tag  { font-size:13.5px; fill:#5a6b7d; }
    .band { font-size:16px; fill:#10233c; font-weight:bold; }
  </style>

  <!-- Carte 1 : bouteille de fluide frigorigène -->
  <rect x="20" y="20" width="160" height="260" rx="12" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <rect x="82" y="48" width="16" height="14" fill="#0c4a6e"/>
  <rect x="70" y="62" width="40" height="90" rx="10" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <line x1="70" y1="94" x2="110" y2="94" stroke="#0c4a6e" stroke-width="2"/>
  <text class="nom" x="100" y="182" text-anchor="middle">Bouteille de fluide</text>
  <text class="nom" x="100" y="200" text-anchor="middle">frigorigène</text>
  <rect x="45" y="220" width="110" height="26" rx="8" fill="#eef3f9" stroke="#2f5689" stroke-width="1.5"/>
  <text class="tag" x="100" y="238" text-anchor="middle">récipient</text>

  <!-- Carte 2 : réservoir de liquide -->
  <rect x="195" y="20" width="160" height="260" rx="12" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <rect x="235" y="80" width="90" height="46" rx="23" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <line x1="215" y1="103" x2="235" y2="103" stroke="#0c4a6e" stroke-width="3"/>
  <line x1="325" y1="103" x2="345" y2="103" stroke="#0c4a6e" stroke-width="3"/>
  <text class="nom" x="275" y="182" text-anchor="middle">Réservoir de</text>
  <text class="nom" x="275" y="200" text-anchor="middle">liquide</text>
  <rect x="220" y="220" width="110" height="26" rx="8" fill="#eef3f9" stroke="#2f5689" stroke-width="1.5"/>
  <text class="tag" x="275" y="238" text-anchor="middle">récipient</text>

  <!-- Carte 3 : séparateur d'huile -->
  <rect x="370" y="20" width="160" height="260" rx="12" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <rect x="425" y="58" width="50" height="100" rx="16" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <line x1="405" y1="80" x2="425" y2="80" stroke="#0c4a6e" stroke-width="3"/>
  <line x1="475" y1="130" x2="495" y2="130" stroke="#0c4a6e" stroke-width="3"/>
  <text class="nom" x="450" y="182" text-anchor="middle">Séparateur</text>
  <text class="nom" x="450" y="200" text-anchor="middle">d'huile</text>
  <rect x="395" y="220" width="110" height="26" rx="8" fill="#eef3f9" stroke="#2f5689" stroke-width="1.5"/>
  <text class="tag" x="450" y="238" text-anchor="middle">récipient</text>

  <!-- Carte 4 : condenseur -->
  <rect x="545" y="20" width="160" height="260" rx="12" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <rect x="580" y="70" width="90" height="70" rx="8" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <line x1="590" y1="88" x2="660" y2="88" stroke="#0c4a6e" stroke-width="2"/>
  <line x1="590" y1="104" x2="660" y2="104" stroke="#0c4a6e" stroke-width="2"/>
  <line x1="590" y1="120" x2="660" y2="120" stroke="#0c4a6e" stroke-width="2"/>
  <text class="nom" x="625" y="182" text-anchor="middle">Condenseur</text>
  <text class="nom" x="625" y="200" text-anchor="middle">(haute pression)</text>
  <rect x="570" y="220" width="110" height="26" rx="8" fill="#eef3f9" stroke="#2f5689" stroke-width="1.5"/>
  <text class="tag" x="625" y="238" text-anchor="middle">récipient</text>

  <!-- Carte 5 : tuyauterie -->
  <rect x="720" y="20" width="160" height="260" rx="12" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <path d="M 760 130 H 800 V 90 H 840" stroke="#0c4a6e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="760" cy="130" r="7" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <circle cx="840" cy="90" r="7" fill="#fffdf8" stroke="#0c4a6e" stroke-width="3"/>
  <text class="nom" x="800" y="182" text-anchor="middle">Tuyauterie</text>
  <text class="nom" x="800" y="200" text-anchor="middle">frigorifique</text>
  <rect x="745" y="220" width="110" height="26" rx="8" fill="#eef3f9" stroke="#2f5689" stroke-width="1.5"/>
  <text class="tag" x="800" y="238" text-anchor="middle">tuyauterie</text>

  <!-- Bande du bas -->
  <rect x="20" y="290" width="860" height="52" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="450" y="322" text-anchor="middle">Chacun entre dans le champ dès qu'il dépasse le seuil de pression fixé par le texte</text>
</svg>
