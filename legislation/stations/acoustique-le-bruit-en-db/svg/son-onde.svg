<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-onde" aria-describedby="d-onde" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t-onde">Un son : une pression d'air qui varie et qui se propage</title>
  <desc id="d-onde">Une machine à gauche émet des ondes : quatre arcs concentriques violets s'éloignent d'elle vers la droite. En dessous, une courbe ondulée montre la pression de l'air en un point au fil du temps, autour d'une ligne pointillée qui marque la pression au repos. Quand la courbe monte, l'air est comprimé ; quand elle descend, il est détendu. Dans l'animation, les arcs s'allument un à un en s'éloignant de la source et un point parcourt la courbe.</desc>
  <style>
    .ti{font-size:22px;font-weight:bold;fill:#1b3a63}
    .lb{font-size:17px;fill:#10233c}
    .lg{font-size:18px;font-weight:bold;fill:#1b3a63}
    .gr{font-size:16px;fill:#5a6b7d}
    .vv{font-size:20px;font-weight:bold;fill:#6d28d9}
    .oo{font-size:18px;font-weight:bold;fill:#b45f1a}
  </style>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text class="ti" x="30" y="32">Un son : la pression de l'air qui varie</text>
