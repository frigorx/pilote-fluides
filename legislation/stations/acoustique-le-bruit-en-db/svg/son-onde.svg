  <text class="lg" x="470" y="150">Les ondes s'éloignent de la source</text>
  <text class="gr" x="470" y="176">L'air ne voyage pas : il oscille sur place</text>
  <text class="gr" x="470" y="198">et passe le mouvement à l'air voisin.</text>
  <text class="lg" x="60" y="345">Ce que voit un point de l'espace</text>
