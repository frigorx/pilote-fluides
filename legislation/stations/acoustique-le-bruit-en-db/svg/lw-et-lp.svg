<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-lwlp" aria-describedby="d-lwlp" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t-lwlp">Puissance acoustique Lw et pression acoustique Lp</title>
  <desc id="d-lwlp">À gauche, une machine extérieure émet des ondes ; au-dessus, la mention Lw, puissance acoustique, ce que la machine émet. À droite, deux sonomètres, l'un plus proche de la machine et l'autre plus loin, chacun avec la mention Lp, pression acoustique, ce que l'on mesure à cet endroit. Une ligne de distance sous le dessin relie la machine aux deux points de mesure. Une bande en bas rappelle qu'il n'y a qu'un Lw par machine mais autant de Lp que de lieux de mesure.</desc>
  <style>
    .ti{font-size:22px;font-weight:bold;fill:#1b3a63}
    .lb{font-size:17px;fill:#10233c}
    .lg{font-size:18px;font-weight:bold;fill:#1b3a63}
    .gr{font-size:16px;fill:#5a6b7d}
    .vv{font-size:20px;font-weight:bold;fill:#6d28d9}
    .oo{font-size:18px;font-weight:bold;fill:#b45f1a}
  </style>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text class="vv" x="40" y="60">Lw : puissance acoustique</text>
  <text class="lb" x="40" y="86">ce que la machine émet</text>
  <text class="vv" x="420" y="60">Lp : pression acoustique</text>
  <text class="lb" x="420" y="86">ce que l'on mesure à un endroit</text>
  <rect x="40" y="190" width="110" height="90" rx="9" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><circle cx="95.0" cy="235.0" r="28.8" fill="none" stroke="#5a6b7d" stroke-width="2"/><path d="M69.1,235.0 H120.9 M95.0,209.1 V260.9" stroke="#5a6b7d" stroke-width="2"/>
  <path d="M179.7,210.3 A35,35 0 0 1 179.7,259.7" fill="none" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
  <path d="M201.0,189.0 A65,65 0 0 1 201.0,281.0" fill="none" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
  <path d="M222.2,167.8 A95,95 0 0 1 222.2,302.2" fill="none" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
  <line x1="433" y1="194" x2="433" y2="214" stroke="#1b3a63" stroke-width="3"/><circle cx="433" cy="190" r="6" fill="#1b3a63"/><rect x="420" y="214" width="26" height="46" rx="5" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><rect x="425" y="220" width="16" height="12" fill="#6d28d9"/><circle cx="433" cy="246" r="5" fill="#e8914a"/>
  <line x1="673" y1="194" x2="673" y2="214" stroke="#1b3a63" stroke-width="3"/><circle cx="673" cy="190" r="6" fill="#1b3a63"/><rect x="660" y="214" width="26" height="46" rx="5" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/><rect x="665" y="220" width="16" height="12" fill="#6d28d9"/><circle cx="673" cy="246" r="5" fill="#e8914a"/>
  <text class="lg" x="433" y="300" text-anchor="middle">Lp ici</text>
  <text class="lg" x="673" y="300" text-anchor="middle">Lp là</text>
  <line x1="95" y1="360" x2="673" y2="360" stroke="#5a6b7d" stroke-width="2"/>
  <line x1="95" y1="350" x2="95" y2="370" stroke="#5a6b7d" stroke-width="2"/>
  <line x1="433" y1="350" x2="433" y2="370" stroke="#5a6b7d" stroke-width="2"/>
  <line x1="673" y1="350" x2="673" y2="370" stroke="#5a6b7d" stroke-width="2"/>
  <text class="gr" x="264" y="388" text-anchor="middle">distance courte</text>
  <text class="gr" x="553" y="388" text-anchor="middle">distance plus grande</text>
  <rect x="40" y="420" width="720" height="60" rx="12" fill="#ece6f8" stroke="#6d28d9" stroke-width="2"/>
  <text class="lb" x="400" y="446" text-anchor="middle">Une seule valeur de Lw par machine (fiche du constructeur).</text>
  <text class="lb" x="400" y="470" text-anchor="middle">Autant de valeurs de Lp que de lieux et de distances de mesure.</text>
</svg>
