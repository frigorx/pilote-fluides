<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-addition" aria-describedby="d-addition" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t-addition">Deux sources ne font pas le double</title>
  <desc id="d-addition">Cinq colonnes, de gauche à droite : une, deux, trois, quatre puis cinq machines identiques, chacune de 80 décibels pondérés A. Sous chaque groupe, le niveau obtenu : 80, 83, 85, 86 puis 87 décibels pondérés A. Entre les colonnes, l'écart gagné : plus 3, plus 2, plus 1, plus 1. En dessous, quatre constats : 80 plus 80 ne font pas 160, c'est faux ; deux machines identiques ajoutent 3 décibels seulement ; arrêter l'une des deux retire 3 décibels seulement ; dix machines identiques donnent 90. Dans l'animation, les machines s'ajoutent une colonne après l'autre.</desc>
  <style>
    .ti{font-size:22px;font-weight:bold;fill:#1b3a63}
    .lb{font-size:17px;fill:#10233c}
    .lg{font-size:18px;font-weight:bold;fill:#1b3a63}
    .gr{font-size:16px;fill:#5a6b7d}
    .vv{font-size:20px;font-weight:bold;fill:#6d28d9}
    .oo{font-size:18px;font-weight:bold;fill:#b45f1a}
  </style>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text class="ti" x="30" y="34">Chaque machine fait 80 dB(A) à elle seule</text>
  <g><rect x="72.0" y="90" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="90.0" cy="108.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M79.6,108.0 H100.4 M90.0,97.6 V118.4" stroke="#5a6b7d" stroke-width="1.5"/><text class="lb" x="90" y="205" text-anchor="middle">1 machine</text><text class="vv" x="90" y="242" text-anchor="middle">80 dB(A)</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.10;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="200.0" y="90" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="218.0" cy="108.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M207.6,108.0 H228.4 M218.0,97.6 V118.4" stroke="#5a6b7d" stroke-width="1.5"/><rect x="244.0" y="90" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="262.0" cy="108.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M251.6,108.0 H272.4 M262.0,97.6 V118.4" stroke="#5a6b7d" stroke-width="1.5"/><text class="lb" x="240" y="205" text-anchor="middle">2 machines</text><text class="vv" x="240" y="242" text-anchor="middle">83 dB(A)</text><text class="oo" x="165" y="242" text-anchor="middle">+3</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.21;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="328.0" y="90" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="346.0" cy="108.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M335.6,108.0 H356.4 M346.0,97.6 V118.4" stroke="#5a6b7d" stroke-width="1.5"/><rect x="372.0" y="90" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="390.0" cy="108.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M379.6,108.0 H400.4 M390.0,97.6 V118.4" stroke="#5a6b7d" stroke-width="1.5"/><rect x="416.0" y="90" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="434.0" cy="108.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M423.6,108.0 H444.4 M434.0,97.6 V118.4" stroke="#5a6b7d" stroke-width="1.5"/><text class="lb" x="390" y="205" text-anchor="middle">3 machines</text><text class="vv" x="390" y="242" text-anchor="middle">85 dB(A)</text><text class="oo" x="315" y="242" text-anchor="middle">+2</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.27;0.32;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="500.0" y="90" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="518.0" cy="108.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M507.6,108.0 H528.4 M518.0,97.6 V118.4" stroke="#5a6b7d" stroke-width="1.5"/><rect x="544.0" y="90" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="562.0" cy="108.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M551.6,108.0 H572.4 M562.0,97.6 V118.4" stroke="#5a6b7d" stroke-width="1.5"/><rect x="500.0" y="134" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="518.0" cy="152.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M507.6,152.0 H528.4 M518.0,141.6 V162.4" stroke="#5a6b7d" stroke-width="1.5"/><rect x="544.0" y="134" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="562.0" cy="152.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M551.6,152.0 H572.4 M562.0,141.6 V162.4" stroke="#5a6b7d" stroke-width="1.5"/><text class="lb" x="540" y="205" text-anchor="middle">4 machines</text><text class="vv" x="540" y="242" text-anchor="middle">86 dB(A)</text><text class="oo" x="465" y="242" text-anchor="middle">+1</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.43;1" dur="12s" repeatCount="indefinite"/></g>
  <g><rect x="628.0" y="90" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="646.0" cy="108.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M635.6,108.0 H656.4 M646.0,97.6 V118.4" stroke="#5a6b7d" stroke-width="1.5"/><rect x="672.0" y="90" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="690.0" cy="108.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M679.6,108.0 H700.4 M690.0,97.6 V118.4" stroke="#5a6b7d" stroke-width="1.5"/><rect x="716.0" y="90" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="734.0" cy="108.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M723.6,108.0 H744.4 M734.0,97.6 V118.4" stroke="#5a6b7d" stroke-width="1.5"/><rect x="650.0" y="134" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="668.0" cy="152.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M657.6,152.0 H678.4 M668.0,141.6 V162.4" stroke="#5a6b7d" stroke-width="1.5"/><rect x="694.0" y="134" width="36" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/><circle cx="712.0" cy="152.0" r="11.5" fill="none" stroke="#5a6b7d" stroke-width="1.5"/><path d="M701.6,152.0 H722.4 M712.0,141.6 V162.4" stroke="#5a6b7d" stroke-width="1.5"/><text class="lb" x="690" y="205" text-anchor="middle">5 machines</text><text class="vv" x="690" y="242" text-anchor="middle">87 dB(A)</text><text class="oo" x="615" y="242" text-anchor="middle">+1</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.49;0.54;1" dur="12s" repeatCount="indefinite"/></g>
  <path d="M50,300 l20,20 M70,300 l-20,20" stroke="#b03a2e" stroke-width="5" stroke-linecap="round"/>
  <text class="lb" x="92" y="318">Faux : 80 + 80 ne font pas 160. Les dB ne s'additionnent pas ainsi.</text>
  <path d="M50,361 l8,9 l14,-19" fill="none" stroke="#1e7e54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lb" x="92" y="368">Deux machines identiques : + 3 dB(A) seulement, soit 83.</text>
  <path d="M50,411 l8,9 l14,-19" fill="none" stroke="#1e7e54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lb" x="92" y="418">En arrêter une des deux : − 3 dB(A) seulement.</text>
  <path d="M50,461 l8,9 l14,-19" fill="none" stroke="#1e7e54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lb" x="92" y="468">Dix machines identiques : 90 dB(A).</text>
</svg>
