<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-pond" aria-describedby="d-pond" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t-pond">La pondération A : l'oreille entend moins les graves</title>
  <desc id="d-pond">À gauche, une courbe schématique de la sensibilité de l'oreille selon la fréquence, du grave à gauche à l'aigu à droite : elle part très bas pour les graves, monte vers les fréquences moyennes, puis redescend un peu vers les aigus. À droite, deux paires de barres : pour un bruit grave, la barre en décibels est haute et la barre en décibels pondérés A est plus basse ; pour un bruit médium, les deux barres ont la même hauteur. Schéma qualitatif sans valeur chiffrée.</desc>
  <style>
    .ti{font-size:22px;font-weight:bold;fill:#1b3a63}
    .lb{font-size:17px;fill:#10233c}
    .lg{font-size:18px;font-weight:bold;fill:#1b3a63}
    .gr{font-size:16px;fill:#5a6b7d}
    .vv{font-size:20px;font-weight:bold;fill:#6d28d9}
    .oo{font-size:18px;font-weight:bold;fill:#b45f1a}
  </style>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text class="ti" x="30" y="34">La pondération A</text>
  <text class="lg" x="60" y="92">L'oreille entend beaucoup moins les graves</text>
  <line x1="60" y1="120" x2="60" y2="340" stroke="#5a6b7d" stroke-width="2"/><line x1="60" y1="340" x2="470" y2="340" stroke="#5a6b7d" stroke-width="2"/>
  <path d="M60,330 C120,318 170,262 230,200 C280,150 330,140 370,152 C410,166 440,190 470,214" fill="none" stroke="#6d28d9" stroke-width="5" stroke-linecap="round"/>
  <text class="gr" x="60" y="366">grave</text><text class="gr" x="470" y="366" text-anchor="end">aigu</text>
  <text class="gr" x="265" y="366" text-anchor="middle">fréquence</text>
  <text class="lb" x="60" y="412">En dB(A), les graves comptent moins,</text>
  <text class="lb" x="60" y="436">les médiums comptent davantage.</text>
  <text class="lg" x="520" y="92">Le même bruit, deux lectures</text>
  <rect x="540" y="160" width="40" height="180" fill="#ece6f8" stroke="#1b3a63" stroke-width="2"/><text class="gr" x="560" y="364" text-anchor="middle">dB</text><rect x="590" y="240" width="40" height="100" fill="#e8914a" stroke="#1b3a63" stroke-width="2"/><text class="gr" x="610" y="364" text-anchor="middle">dB(A)</text>
  <rect x="670" y="200" width="40" height="140" fill="#ece6f8" stroke="#1b3a63" stroke-width="2"/><text class="gr" x="690" y="364" text-anchor="middle">dB</text><rect x="720" y="200" width="40" height="140" fill="#e8914a" stroke="#1b3a63" stroke-width="2"/><text class="gr" x="740" y="364" text-anchor="middle">dB(A)</text>
  <line x1="520" y1="340" x2="770" y2="340" stroke="#5a6b7d" stroke-width="2"/>
  <text class="lg" x="590" y="392" text-anchor="middle">Bruit grave</text>
  <text class="lg" x="710" y="392" text-anchor="middle">Bruit médium</text>
  <text class="gr" x="400" y="482" text-anchor="middle">Schéma qualitatif : aucune valeur chiffrée.</text>
</svg>
