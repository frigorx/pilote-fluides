<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-freq" aria-describedby="d-freq" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t-freq">Grave, aigu et plage des fréquences audibles</title>
  <desc id="d-freq">En haut, deux courbes : à gauche une onde lente, dont les vibrations sont espacées, qui correspond à un son grave ; à droite une onde rapide, aux vibrations serrées, qui correspond à un son aigu. En bas, une échelle des fréquences graduée en logarithme, de gauche à droite : les infrasons en dessous de 20 hertz, les sons audibles de 20 à 20 000 hertz, les ultrasons au-delà de 20 000 hertz. Sous la zone audible, un crochet marque la parole, de 100 à 6 000 hertz.</desc>
  <style>
    .ti{font-size:22px;font-weight:bold;fill:#1b3a63}
    .lb{font-size:17px;fill:#10233c}
    .lg{font-size:18px;font-weight:bold;fill:#1b3a63}
    .gr{font-size:16px;fill:#5a6b7d}
    .vv{font-size:20px;font-weight:bold;fill:#6d28d9}
    .oo{font-size:18px;font-weight:bold;fill:#b45f1a}
  </style>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text class="ti" x="30" y="34">Grave ou aigu : la fréquence</text>
