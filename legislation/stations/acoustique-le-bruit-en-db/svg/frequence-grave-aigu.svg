  <text class="lg" x="105" y="358" text-anchor="middle">Infrasons</text>
  <text class="gr" x="105" y="379" text-anchor="middle">moins de 20 Hz</text>
  <text class="lg" x="400" y="358" text-anchor="middle">Sons audibles : 20 à 20 000 Hz</text>
