  <text class="lb" x="215" y="224" text-anchor="middle">vibrations lentes, fréquence faible</text>
  <text class="lg" x="585" y="200" text-anchor="middle">Aigu</text>
  <text class="lb" x="585" y="224" text-anchor="middle">vibrations rapides, fréquence élevée</text>
