  <line x1="430.5" y1="290" x2="430.5" y2="336" stroke="#1b3a63" stroke-width="2"/>
  <text class="gr" x="430.5" y="280" text-anchor="middle">1 000 Hz</text>
  <line x1="583.8" y1="290" x2="583.8" y2="336" stroke="#1b3a63" stroke-width="2"/>
