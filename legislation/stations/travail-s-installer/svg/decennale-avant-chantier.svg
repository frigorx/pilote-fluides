<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img"
     aria-labelledby="t-dec" aria-describedby="d-dec" font-family="Calibri, 'Segoe UI', sans-serif">
  <title id="t-dec">L'assurance décennale se justifie avant l'ouverture du chantier</title>
  <desc id="d-dec">Quatre blocs en chaîne, reliés par des flèches : l'attestation d'assurance, justifiée avant
    l'ouverture du chantier ; les travaux ; la réception ; puis les dix ans de responsabilité décennale.
    En dessous, deux cartes : la première dit que le régime de micro-entrepreneur ne dispense de rien, car
    l'obligation suit l'activité exercée ; la seconde distingue la décennale, souscrite par l'entrepreneur,
    de la dommages-ouvrage, souscrite par le client. Une bande renvoie à la station Garanties pour savoir
    si un désordre relève de la décennale.</desc>
  <defs>
    <marker id="pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <style>
    .ttl { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:22px; fill:#1b3a63; }
    .qui { font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#10233c; }
    .lbl { font-size:17px; fill:#10233c; }
    .clair{ font-size:17px; fill:#fffdf8; }
    .quic{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:19px; fill:#fffdf8; }
    .band{ font-family:'Trebuchet MS',Calibri,sans-serif; font-weight:bold; font-size:17px; fill:#10233c; }
  </style>
  <text class="ttl" x="450" y="34" text-anchor="middle">Assuré avant d'ouvrir, responsable dix ans après</text>

  <rect x="20" y="60" width="190" height="112" rx="14" fill="#9d174d" stroke="#10233c" stroke-width="3"/>
  <text class="quic" x="115" y="100" text-anchor="middle">Attestation</text>
  <text class="clair" x="115" y="126" text-anchor="middle">justifiée avant</text>
  <text class="clair" x="115" y="150" text-anchor="middle">l'ouverture</text>
  <line x1="212" y1="116" x2="241" y2="116" stroke="#5a6b7d" stroke-width="3" marker-end="url(#pt)"/>

  <rect x="243" y="60" width="190" height="112" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="qui" x="338" y="123" text-anchor="middle">Travaux</text>
  <line x1="435" y1="116" x2="464" y2="116" stroke="#5a6b7d" stroke-width="3" marker-end="url(#pt)"/>

  <rect x="466" y="60" width="190" height="112" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="qui" x="561" y="123" text-anchor="middle">Réception</text>
  <line x1="658" y1="116" x2="687" y2="116" stroke="#5a6b7d" stroke-width="3" marker-end="url(#pt)"/>

  <rect x="689" y="60" width="191" height="112" rx="14" fill="#1b3a63" stroke="#10233c" stroke-width="3"/>
  <text class="quic" x="784" y="104" text-anchor="middle">Dix ans</text>
  <text class="clair" x="784" y="132" text-anchor="middle">responsabilité</text>
  <text class="clair" x="784" y="156" text-anchor="middle">décennale</text>

  <rect x="20" y="200" width="420" height="132" rx="14" fill="#fffdf8" stroke="#9d174d" stroke-width="3"/>
  <text class="qui" x="230" y="238" text-anchor="middle">Le statut ne dispense de rien</text>
  <text class="lbl" x="230" y="272" text-anchor="middle">Micro-entrepreneur ou société :</text>
  <text class="lbl" x="230" y="298" text-anchor="middle">l'obligation suit l'activité exercée.</text>

  <rect x="460" y="200" width="420" height="132" rx="14" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="qui" x="670" y="238" text-anchor="middle">Deux assurances distinctes</text>
  <text class="lbl" x="670" y="272" text-anchor="middle">Vous : la décennale, pour votre responsabilité.</text>
  <text class="lbl" x="670" y="298" text-anchor="middle">Le client : la dommages-ouvrage.</text>

  <rect x="20" y="360" width="860" height="66" rx="14" fill="#eef3f9" stroke="#2f5689" stroke-width="2"/>
  <text class="band" x="450" y="390" text-anchor="middle">Un désordre relève-t-il de la décennale ? C'est une autre question :</text>
  <text class="band" x="450" y="414" text-anchor="middle">la station Garanties donne la méthode.</text>
</svg>
