<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-ac1" aria-describedby="d-ac1" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-ac1">Onze acteurs, quatre familles</title>
  <desc id="d-ac1">Quatre bandes empilées. Première bande : ceux qui commandent et conçoivent, le maître d'ouvrage et le maître d'œuvre. Deuxième : ceux qui contrôlent et protègent, le bureau de contrôle et le coordonnateur SPS. Troisième : ceux qui fabriquent, vendent et installent, le fabricant, le distributeur de fluide, l'entreprise titulaire de l'attestation de capacité et le technicien titulaire de l'attestation d'aptitude, entouré d'un cadre orange tireté. Quatrième : ceux qui font vivre l'installation, le détenteur, le client ou utilisateur et l'installation de traitement des déchets. Dans l'animation, les bandes apparaissent l'une après l'autre ; l'image fixe montre tout.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#0f766e; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-ac1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
