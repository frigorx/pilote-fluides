xt class="txt" x="584" y="222" text-anchor="start"><tspan x="584" dy="0">organise la sécurité</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.180;0.240;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="30" y="262" width="176" height="96" rx="12" fill="#1b3a63"/><text class="wht" x="118" y="286" text-anchor="middle"><tspan x="118" dy="0">Ceux qui</tspan><tspan x="118" dy="22">fabriquent,</tspan><tspan x="118" dy="22">vendent</tspan><tspan x="118" dy="22">et installent</tspan></text><rect x="222" y="266" width="133.5" height="88" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><g transform="translate(288.75 290) scale(0.7)"><path d="M-20,18 V-2 l10,6 V-2 l10,6 V-2 l10,6 V-18 h10 V18 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-14,10 h4 M-4,10 h4 M6,10 h4" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:16px" x="288.75" y="324" text-anchor="middle"><tspan x="288.75" dy="0">Fabricant</tspan></text><rect x="363.5" y="266" width="133.5" height="88" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><g transform="translate(430.25 290) scale(0.7)"><rect x="-9" y="-6" width="18" height="26" rx="7" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-4" y="-14" width="8" height="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-8" y="-19" width="16" height="5" rx="2" fill="#1b3a63"/></g><text class="nom" style="font-size:16px" x="430.25" y="324" text-anchor="middle"><tspan x="430.25" dy="0">Distributeur</tspan><tspan x="430.25" dy="20">de fluide</tspan></text><rect x="505" y="266" width="133.5" height="88" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><g transform="translate(571.75 290) scale(0.7)"><rect x="-14" y="-18" width="28" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="0" cy="-6" r="5" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-8,9 a8,6 0 0 1 16,0" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-8,14 h16" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:16px" x="571.75" y="324" text-anchor="middle"><tspan x="571.75" dy="0">Entreprise</tspan><tspan x="571.75" dy="20">(capacité)</tspan></text><rect x="646.5" y="266" width="133.5" height="88" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="4"/><g transform="translate(713.25 290) scale(0.7)"><circle cx="0" cy="-8" r="7" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-10,-11 a10,10 0 0 1 20,0 z" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-13" y="-12" width="26" height="3" rx="1.5" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-15,19 v-3 a15,12 0 0 1 30,0 v3 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:16px" x="713.25" y="324" text-anchor="middle"><tspan x="713.25" dy="0">Technicien</tspan><tspan x="713.25" dy="20">(aptitude)</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.310;0.370;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="30" y="370" width="176" height="96" rx="12" fill="#1b3a63"/><text class="wht" x="118" y="404" text-anchor="middle"><tspan x="118" dy="0">Ceux qui</tspan><tspan x="118" dy="22">font vivre</tspan><tspan x="118" dy="22">l'installation</tspan></text><rect x="222" y="374" width="178" height="88" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><g transform="translate(311 398) scale(0.7)"><rect x="-20" y="-13" width="40" height="28" rx="3" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-5" cy="1" r="9" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-5,-7 v16 M-13,1 h16" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M11,-7 v16 M15,-7 v16" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:16px" x="311" y="432" text-anchor="middle"><tspan x="311" dy="0">Détenteur</tspan><tspan x="311" dy="20">(exploitant)</tspan></text><rect x="412" y="374" width="178" height="88" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><g transform="translate(501 398) scale(0.7)"><circle cx="0" cy="-10" r="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-15,18 v-3 a15,12 0 0 1 30,0 v3 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nom" style="font-size:16px" x="501" y="432" text-anchor="middle"><tspan x="501" dy="0">Client /</tspan><tspan x="501" dy="20">utilisateur</tspan></text><rect x="602" y="374" width="178" height="88" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/><g transform="translate(691 398) scale(0.7)"><path d="M-18,18 V0 l9,5 V-4 l9,5 V-4 l9,5 V-16 h9 V18 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-4,8 a7,7 0 1 1 8,6" fill="none" stroke="#1e7e54" stroke-width="3"/><path d="M5,17 l-1,-6 l-5,3 z" fill="#1e7e54"/></g><text class="nom" style="font-size:16px" x="691" y="432" text-anchor="middle"><tspan x="691" dy="0">Traitement</tspan><tspan x="691" dy="20">des déchets</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.440;0.500;1" dur="12s" repeatCou