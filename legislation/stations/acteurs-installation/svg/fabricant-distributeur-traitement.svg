<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-ac6" aria-describedby="d-ac6" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-ac6">Du fabricant à l'installation de traitement</title>
  <desc id="d-ac6">En haut, trois cartes alignées : le fabricant, qui construit l'équipement, déclare sa conformité et livre la notice ; le distributeur, qui vend le fluide et reprend le fluide usagé ; l'installation de traitement, qui reçoit, accepte ou refuse, puis régénère ou détruit. Une flèche orange va du distributeur à l'installation de traitement. En bas au centre, la machine chez le détenteur. Une flèche part du fabricant vers la machine avec l'équipement et la notice ; une flèche bleue descend du distributeur vers la machine avec le fluide neuf ; une flèche orange remonte de la machine vers le distributeur avec le fluide usagé. Une bande verte rappelle que chaque maillon a sa responsabilité et son papier.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#0f766e; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-ac6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<!-- 1 : le fabricant -->
<rect x="25" y="28" width="235" height="126" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="65" cy="91" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(65 91) scale(0.85)"><path d="M-20,18 V-2 l10,6 V-2 l10,6 V-2 l10,6 V-18 h10 V18 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-14,10 h4 M-4,10 h4 M6,10 h4" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="105" y="64.5" text-anchor="start"><tspan x="105" dy="0">Fabricant</tspan></text>
    <text class="txt" x="105" y="85.5" text-anchor="start"><tspan x="105" dy="0">construit, déclare</tspan><tspan x="105" dy="21">la conformité, livre</tspan><tspan x="105" dy="21">la notice</tspan></text>
<!-- 2 : le distributeur -->
<rect x="283" y="28" width="235" height="126" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="323" cy="91" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(323 91) scale(0.85)"><rect x="-9" y="-6" width="18" height="26" rx="7" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-4" y="-14" width="8" height="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-8" y="-19" width="16" height="5" rx="2" fill="#1b3a63"/></g>
    <text class="nom" x="363" y="64.5" text-anchor="start"><tspan x="363" dy="0">Distributeur</tspan></text>
    <text class="txt" x="363" y="85.5" text-anchor="start"><tspan x="363" dy="0">vend le fluide,</tspan><tspan x="363" dy="21">reprend le fluide</tspan><tspan x="363" dy="21">usagé</tspan></text>
<!-- 3 : l'installation de traitement -->
<rect x="541" y="28" width="235" height="126" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="581" cy="91" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(581 91) scale(0.85)"><path d="M-18,18 V0 l9,5 V-4 l9,5 V-4 l9,5 V-16 h9 V18 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-4,8 a7,7 0 1 1 8,6" fill="none" stroke="#1e7e54" stroke-width="3"/><path d="M5,17 l-1,-6 l-5,3 z" fill="#1e7e54"/></g>
    <text class="nom" x="621" y="64.5" text-anchor="start"><tspan x="621" dy="0">Traitement</tspan></text>
    <text class="txt" x="621" y="85.5" text-anchor="start"><tspan x="621" dy="0">reçoit, accepte ou</tspan><tspan x="621" dy="21">refuse, régénère</tspan><tspan x="621" dy="21">ou détruit</tspan></text><path d="M520,90 H538" fill="none" stroke="#e8914a" stroke-width="3" marker-end="url(#fl-ac6)"/>
<!-- 4 : la machine chez le détenteur -->
<rect x="250" y="250" width="300" height="126" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/>
    <circle cx="290" cy="313" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(290 313) scale(0.85)"><rect x="-20" y="-13" width="40" height="28" rx="3" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-5" cy="1" r="9" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-5,-7 v16 M-13,1 h16" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M11,-7 v16 M15,-7 v16" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="330" y="286.5" text-anchor="start"><tspan x="330" dy="0">La machine</tspan></text>
    <text class="txt" x="330" y="307.5" text-anchor="start"><tspan x="330" dy="0">chez le détenteur,</tspan><tspan x="330" dy="21">installée par</tspan><tspan x="330" dy="21">une entreprise attestée</tspan></text>
<!-- 5 : les flèches -->
<path d="M142,156 V312 H248" fill="none" stroke="#1b3a63" stroke-width="3" marker-end="url(#fl-ac6)"/><text class="mut" x="156" y="240" text-anchor="start"><tspan x="156" dy="0">équipement</tspan><tspan x="156" dy="20">et notice</tspan></text><path d="M345,156 V248" fill="none" stroke="#1b3a63" stroke-width="3" marker-end="url(#fl-ac6)"/><text class="mut" x="333" y="208" text-anchor="end"><tspan x="333" dy="0">fluide</tspan><tspan x="333" dy="20">neuf</tspan></text><path d="M456,248 V158" fill="none" stroke="#e8914a" stroke-width="3" marker-end="url(#fl-ac6)"/><text class="mut" x="468" y="208" text-anchor="start"><tspan x="468" dy="0">fluide</tspan><tspan x="468" dy="20">usagé</tspan></text><circle r="8" fill="#1b3a63" opacity="0" cx="0" cy="0"><animateMotion path="M345,156 V248" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.120;0.300;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.120;0.135;0.285;0.300;1" dur="12s" repeatCount="indefinite"/></circle><circle r="8" fill="#e8914a" opacity="0" cx="0" cy="0"><animateMotion path="M456,248 V158" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.360;0.540;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.360;0.375;0.525;0.540;1" dur="12s" repeatCount="indefinite"/></circle><circle r="8" fill="#e8914a" opacity="0" cx="0" cy="0"><animateMotion path="M520,90 H538" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.580;0.640;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.580;0.595;0.625;0.640;1" dur="12s" repeatCount="indefinite"/></circle>
<!-- 6 : la bande du bas -->
<rect x="25" y="410" width="750" height="72" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="2.5"/><text class="nomc" x="400" y="442" text-anchor="middle"><tspan x="400" dy="0">Chaque maillon a sa responsabilité et son papier.</tspan></text><text class="txt" x="400" y="468" text-anchor="middle"><tspan x="400" dy="0">Le fluide ne disparaît jamais sans trace : il suit sa filière.</tspan></text>
</svg>
