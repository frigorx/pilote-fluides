<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-ac7" aria-describedby="d-ac7" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-ac7">Informer, faire signer, transmettre</title>
  <desc id="d-ac7">À gauche, un grand cercle orange représente le technicien. Trois flèches en partent vers trois cartes empilées : informer, c'est dire ce que vous faites et ce que vous constatez, à l'oral puis par écrit ; faire signer, c'est faire valider le papier par celui qui doit le signer ; transmettre, c'est remettre une copie à celui qui doit la garder. Une bande verte donne un exemple : en cas de fuite, vous prévenez le détenteur, vous la notez sur la fiche et vous lui remettez l'original. Dans l'animation, les cartes apparaissent l'une après l'autre.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#0f766e; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-ac7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<g><circle cx="105" cy="215" r="80" fill="#fdf1e6" stroke="#e8914a" stroke-width="4"/><g transform="translate(105 180) scale(1.6)"><circle cx="0" cy="-8" r="7" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-10,-11 a10,10 0 0 1 20,0 z" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-13" y="-12" width="26" height="3" rx="1.5" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-15,19 v-3 a15,12 0 0 1 30,0 v3 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text class="nomo" x="105" y="252" text-anchor="middle"><tspan x="105" dy="0">Vous</tspan></text><text class="txt" x="105" y="276" text-anchor="middle"><tspan x="105" dy="0">le technicien</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.030;0.080;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M186,170 C240,130 250,85 306,85" fill="none" stroke="#1b3a63" stroke-width="3" marker-end="url(#fl-ac7)"/><rect x="310" y="30" width="465" height="110" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="350" cy="85" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(350 85) scale(0.85)"><path d="M-18,-14 h36 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-22 l-10,9 v-9 h-4 a4,4 0 0 1 -4,-4 v-16 a4,4 0 0 1 4,-4 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-12,-4 h24 M-12,3 h14" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="390" y="69" text-anchor="start"><tspan x="390" dy="0">Informer</tspan></text>
    <text class="txt" x="390" y="90" text-anchor="start"><tspan x="390" dy="0">dire ce que vous faites et ce que</tspan><tspan x="390" dy="21">vous constatez : à l'oral, puis par écrit</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.140;0.210;1" dur="12s" repeatCount="indefinite"/></g><circle r="8" fill="#1b3a63" opacity="0" cx="0" cy="0"><animateMotion path="M186,170 C240,130 250,85 306,85" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.210;0.290;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.210;0.225;0.275;0.290;1" dur="12s" repeatCount="indefinite"/></circle><g><path d="M186,215 C240,215 250,205 306,205" fill="none" stroke="#e8914a" stroke-width="3" marker-end="url(#fl-ac7)"/><rect x="310" y="150" width="465" height="110" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/>
    <circle cx="350" cy="205" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(350 205) scale(0.85)"><path d="M-14,16 L-10,6 L10,-14 L16,-8 L-4,12 z" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-14,16 L-10,6 L-4,12 z" fill="#1b3a63"/></g>
    <text class="nom" x="390" y="189" text-anchor="start"><tspan x="390" dy="0">Faire signer</tspan></text>
    <text class="txt" x="390" y="210" text-anchor="start"><tspan x="390" dy="0">faire valider le papier par celui</tspan><tspan x="390" dy="21">qui doit le signer</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.310;0.380;1" dur="12s" repeatCount="indefinite"/></g><circle r="8" fill="#e8914a" opacity="0" cx="0" cy="0"><animateMotion path="M186,215 C240,215 250,205 306,205" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.380;0.460;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.380;0.395;0.445;0.460;1" dur="12s" repeatCount="indefinite"/></circle><g><path d="M186,260 C240,300 250,325 306,325" fill="none" stroke="#1b3a63" stroke-width="3" marker-end="url(#fl-ac7)"/><rect x="310" y="270" width="465" height="110" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="350" cy="325" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(350 325) scale(0.85)"><rect x="-18" y="-12" width="36" height="24" rx="3" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-18,-10 L0,3 L18,-10" fill="none" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="390" y="309" text-anchor="start"><tspan x="390" dy="0">Transmettre</tspan></text>
    <text class="txt" x="390" y="330" text-anchor="start"><tspan x="390" dy="0">remettre une copie à celui qui</tspan><tspan x="390" dy="21">doit la garder</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.480;0.550;1" dur="12s" repeatCount="indefinite"/></g><circle r="8" fill="#1b3a63" opacity="0" cx="0" cy="0"><animateMotion path="M186,260 C240,300 250,325 306,325" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.550;0.630;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.550;0.565;0.615;0.630;1" dur="12s" repeatCount="indefinite"/></circle><g><rect x="25" y="410" width="750" height="72" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="2.5"/><text class="nomc" x="400" y="441" text-anchor="middle"><tspan x="400" dy="0">Exemple : une fuite. Vous prévenez le détenteur, vous la notez sur la fiche,</tspan></text><text class="txt" x="400" y="467" text-anchor="middle"><tspan x="400" dy="0">vous lui remettez l'original.</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.700;0.780;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
