<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-ac4" aria-describedby="d-ac4" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-ac4">L'entreprise attestée et le technicien attesté</title>
  <desc id="d-ac4">Deux cartes côte à côte reliées par un signe plus : à gauche l'entreprise avec son attestation de capacité, à droite le technicien avec son attestation d'aptitude, entouré d'orange. Deux flèches descendent vers une même case verte, en bas : l'intervention chez le détenteur, pour charger le fluide, mettre en service ou travailler sur le circuit, marquée d'une coche. Une bande orange rappelle qu'une entreprise en règle ne remplace jamais l'attestation du technicien, et inversement. Dans l'animation, les éléments apparaissent un par un et des points suivent les flèches.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#0f766e; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-ac4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<g><rect x="30" y="40" width="340" height="130" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="70" cy="105" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(70 105) scale(0.85)"><rect x="-15" y="-10" width="30" height="28" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-20,-10 L0,-24 L20,-10 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-5" y="4" width="10" height="14" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="110" y="89" text-anchor="start"><tspan x="110" dy="0">Entreprise</tspan></text>
    <text class="txt" x="110" y="110" text-anchor="start"><tspan x="110" dy="0">attestation de capacité</tspan><tspan x="110" dy="21">(l'entreprise a le droit)</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.040;0.100;1" dur="12s" repeatCount="indefinite"/></g><g><circle cx="400" cy="105" r="22" fill="#fff" stroke="#e8914a" stroke-width="3"/><path d="M389,105 h22 M400,94 v22" stroke="#e8914a" stroke-width="4"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.140;0.180;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="430" y="40" width="340" height="130" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/>
    <circle cx="470" cy="105" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(470 105) scale(0.85)"><rect x="-14" y="-18" width="28" height="36" rx="4" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="0" cy="-6" r="5" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-8,9 a8,6 0 0 1 16,0" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-8,14 h16" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="510" y="89" text-anchor="start"><tspan x="510" dy="0">Technicien</tspan></text>
    <text class="txt" x="510" y="110" text-anchor="start"><tspan x="510" dy="0">attestation d'aptitude</tspan><tspan x="510" dy="21">(vous avez le droit)</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.200;0.260;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M200,172 L330,256" fill="none" stroke="#1b3a63" stroke-width="3" marker-end="url(#fl-ac4)"/><path d="M600,172 L470,256" fill="none" stroke="#e8914a" stroke-width="3" marker-end="url(#fl-ac4)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.340;0.400;1" dur="12s" repeatCount="indefinite"/></g><circle r="8" fill="#e8914a" opacity="0" cx="0" cy="0"><animateMotion path="M200,172 L330,256" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.400;0.520;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.400;0.415;0.505;0.520;1" dur="12s" repeatCount="indefinite"/></circle><circle r="8" fill="#1b3a63" opacity="0" cx="0" cy="0"><animateMotion path="M600,172 L470,256" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.460;0.580;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.460;0.475;0.565;0.580;1" dur="12s" repeatCount="indefinite"/></circle><g><rect x="190" y="262" width="420" height="130" rx="12" fill="#e3f5ec" stroke="#1e7e54" stroke-width="3"/>
    <circle cx="230" cy="327" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(230 327) scale(0.85)"><rect x="-20" y="-13" width="40" height="28" rx="3" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-5" cy="1" r="9" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-5,-7 v16 M-13,1 h16" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M11,-7 v16 M15,-7 v16" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="270" y="311" text-anchor="start"><tspan x="270" dy="0">Intervention chez le détenteur</tspan></text>
    <text class="txt" x="270" y="332" text-anchor="start"><tspan x="270" dy="0">charger le fluide, mettre en service,</tspan><tspan x="270" dy="21">travailler sur le circuit</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.560;0.640;1" dur="12s" repeatCount="indefinite"/></g><g><circle cx="610" cy="262" r="20" fill="#fff"/><g transform="translate(610 262) scale(1.1)"><circle cx="0" cy="0" r="16" fill="#e3f5ec" stroke="#1e7e54" stroke-width="2.5"/><path d="M-8,0 l6,7 l11,-13" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.680;0.720;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="30" y="420" width="740" height="62" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="2.5"/><text class="nomo" x="400" y="449" text-anchor="middle"><tspan x="400" dy="0">Une entreprise en règle ne remplace jamais votre propre attestation.</tspan></text><text class="txt" x="400" y="471" text-anchor="middle"><tspan x="400" dy="0">Et votre attestation ne remplace pas la capacité de l'entreprise.</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.740;0.800;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
