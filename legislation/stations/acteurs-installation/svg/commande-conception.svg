<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-ac2" aria-describedby="d-ac2" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-ac2">Du maître d'ouvrage aux entreprises, comme du producteur à l'équipe de tournage</title>
  <desc id="d-ac2">À gauche, trois cartes empilées : le maître d'ouvrage, le client qui commande, paie et accepte ; le maître d'œuvre, qui conçoit, dirige et contrôle les travaux ; les entreprises, dont la vôtre, entourée d'orange, qui réalisent les travaux. Des flèches bleues descendent entre les cartes (commande, plans, ordres écrits) et des flèches orange remontent (réception, compte rendu). À droite, trois cartes grises montrent la même chaîne au cinéma : le producteur, le réalisateur, l'équipe technique, reliées aux cartes de gauche par un signe égal. Dans l'animation, les cartes puis les flèches apparaissent une à une.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#0f766e; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-ac2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<text class="ttl" x="215" y="30" text-anchor="middle"><tspan x="215" dy="0">Le chantier</tspan></text><text class="ttl" x="620" y="30" text-anchor="middle"><tspan x="620" dy="0">Au cinéma</tspan></text><g><rect x="30" y="48" width="370" height="100" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="70" cy="98" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(70 98) scale(0.85)"><rect x="-15" y="-10" width="30" height="28" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-20,-10 L0,-24 L20,-10 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-5" y="4" width="10" height="14" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="110" y="82" text-anchor="start"><tspan x="110" dy="0">Maître d'ouvrage</tspan></text>
    <text class="txt" x="110" y="103" text-anchor="start"><tspan x="110" dy="0">le client : il commande,</tspan><tspan x="110" dy="21">il paie, il accepte</tspan></text><circle cx="432" cy="98" r="14" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><path d="M425,93 h14 M425,103 h14" stroke="#5a6b7d" stroke-width="3"/><rect x="465" y="48" width="310" height="100" rx="12" fill="#f7f4ee" stroke="#5a6b7d" stroke-width="3"/>
    <circle cx="505" cy="98" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(505 98) scale(0.85)"><circle cx="0" cy="-10" r="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-15,18 v-3 a15,12 0 0 1 30,0 v3 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="545" y="92.5" text-anchor="start"><tspan x="545" dy="0">Producteur</tspan></text>
    <text class="txt" x="545" y="113.5" text-anchor="start"><tspan x="545" dy="0">il finance le film</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.040;0.100;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="30" y="188" width="370" height="100" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="70" cy="238" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(70 238) scale(0.85)"><rect x="-19" y="-14" width="38" height="28" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-12,-6 h24 M-12,0 h16 M-12,6 h24" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M12,2 l6,10 h-12 z" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="110" y="222" text-anchor="start"><tspan x="110" dy="0">Maître d'œuvre</tspan></text>
    <text class="txt" x="110" y="243" text-anchor="start"><tspan x="110" dy="0">il conçoit, dirige</tspan><tspan x="110" dy="21">et contrôle les travaux</tspan></text><circle cx="432" cy="238" r="14" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><path d="M425,233 h14 M425,243 h14" stroke="#5a6b7d" stroke-width="3"/><rect x="465" y="188" width="310" height="100" rx="12" fill="#f7f4ee" stroke="#5a6b7d" stroke-width="3"/>
    <circle cx="505" cy="238" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(505 238) scale(0.85)"><path d="M-18,-14 h36 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-22 l-10,9 v-9 h-4 a4,4 0 0 1 -4,-4 v-16 a4,4 0 0 1 4,-4 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-12,-4 h24 M-12,3 h14" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="545" y="232.5" text-anchor="start"><tspan x="545" dy="0">Réalisateur</tspan></text>
    <text class="txt" x="545" y="253.5" text-anchor="start"><tspan x="545" dy="0">il dirige le tournage</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.180;0.240;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="30" y="328" width="370" height="100" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/>
    <circle cx="70" cy="378" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(70 378) scale(0.85)"><circle cx="0" cy="-8" r="7" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-10,-11 a10,10 0 0 1 20,0 z" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-13" y="-12" width="26" height="3" rx="1.5" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-15,19 v-3 a15,12 0 0 1 30,0 v3 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="110" y="362" text-anchor="start"><tspan x="110" dy="0">Entreprises</tspan></text>
    <text class="txt" x="110" y="383" text-anchor="start"><tspan x="110" dy="0">dont la vôtre : elles</tspan><tspan x="110" dy="21">réalisent les travaux</tspan></text><circle cx="432" cy="378" r="14" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><path d="M425,373 h14 M425,383 h14" stroke="#5a6b7d" stroke-width="3"/><rect x="465" y="328" width="310" height="100" rx="12" fill="#f7f4ee" stroke="#5a6b7d" stroke-width="3"/>
    <circle cx="505" cy="378" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(505 378) scale(0.85)"><circle cx="0" cy="-8" r="7" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-10,-11 a10,10 0 0 1 20,0 z" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-13" y="-12" width="26" height="3" rx="1.5" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-15,19 v-3 a15,12 0 0 1 30,0 v3 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="545" y="372.5" text-anchor="start"><tspan x="545" dy="0">Équipe technique</tspan></text>
    <text class="txt" x="545" y="393.5" text-anchor="start"><tspan x="545" dy="0">elle fabrique le film</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.320;0.380;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M70,148 V186" fill="none" stroke="#1b3a63" stroke-width="3" marker-end="url(#fl-ac2)"/><text class="mut" x="84" y="174" text-anchor="start"><tspan x="84" dy="0">commande, plans</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.200;0.240;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M370,188 V150" fill="none" stroke="#e8914a" stroke-width="3" marker-end="url(#fl-ac2)"/><text class="mut" x="356" y="174" text-anchor="end"><tspan x="356" dy="0">réception</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.520;0.560;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M70,288 V326" fill="none" stroke="#1b3a63" stroke-width="3" marker-end="url(#fl-ac2)"/><text class="mut" x="84" y="314" text-anchor="start"><tspan x="84" dy="0">ordres écrits</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.340;0.380;1" dur="12s" repeatCount="indefinite"/></g><g><path d="M370,328 V290" fill="none" stroke="#e8914a" stroke-width="3" marker-end="url(#fl-ac2)"/><text class="mut" x="356" y="314" text-anchor="end"><tspan x="356" dy="0">compte rendu</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.620;0.660;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
