<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-ac8" aria-describedby="d-ac8" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-ac8">Bilan : onze acteurs, un verbe chacun</title>
  <desc id="d-ac8">Deux colonnes de cartes. À gauche : le maître d'ouvrage commande, paie et accepte ; le maître d'œuvre conçoit, dirige et contrôle ; le bureau de contrôle donne un avis technique ; le coordonnateur SPS organise la sécurité commune ; le fabricant construit et déclare la conformité ; le distributeur de fluide vend et reprend le fluide usagé. À droite : l'entreprise titulaire de la capacité intervient et tient la fiche ; le technicien titulaire de l'aptitude, entouré d'orange, manipule, informe et fait signer ; le détenteur répond de la machine ; le client ou utilisateur commande, utilise et est informé ; l'installation de traitement reçoit, régénère ou détruit. En bas à droite, le réflexe : trois noms avant d'intervenir.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#0f766e; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
