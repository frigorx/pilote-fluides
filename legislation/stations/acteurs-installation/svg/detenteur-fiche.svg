<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="t-ac5" aria-describedby="d-ac5" font-family="'Segoe UI', Calibri, Arial, sans-serif">
  <title id="t-ac5">La fiche d'intervention entre l'opérateur et le détenteur</title>
  <desc id="d-ac5">Trois cartes alignées, reliées par des flèches numérotées. Un : l'opérateur, l'entreprise attestée dont vous faites partie, remplit la fiche d'intervention, Cerfa 15497. Deux : le détenteur de la machine la signe, quand la charge dépasse le seuil. Trois : la fiche donne deux exemplaires, représentés par deux dossiers en bas : une copie reste chez l'opérateur, l'original reste chez le détenteur, chacun pour au moins cinq ans. Une bande verte résume l'ordre : remplir, signer, garder. Dans l'animation, des points suivent les flèches.</desc>
  <style>
    .ttl { font-weight:bold; font-size:22px; fill:#10233c; }
    .nom { font-weight:bold; font-size:18px; fill:#1b3a63; }
    .nomo{ font-weight:bold; font-size:18px; fill:#9a4d0c; }
    .nomc{ font-weight:bold; font-size:18px; fill:#0f766e; }
    .txt { font-size:16px; fill:#10233c; }
    .mut { font-size:16px; fill:#5a6b7d; }
    .wht { font-weight:bold; font-size:18px; fill:#ffffff; }
  </style>
  <defs><marker id="fl-ac5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
  <rect width="800" height="500" fill="#fffdf8"/>
<g><rect x="25" y="40" width="225" height="110" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="65" cy="95" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(65 95) scale(0.85)"><circle cx="0" cy="-8" r="7" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-10,-11 a10,10 0 0 1 20,0 z" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-13" y="-12" width="26" height="3" rx="1.5" fill="#e8914a" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-15,19 v-3 a15,12 0 0 1 30,0 v3 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="105" y="79" text-anchor="start"><tspan x="105" dy="0">Opérateur</tspan></text>
    <text class="txt" x="105" y="100" text-anchor="start"><tspan x="105" dy="0">entreprise attestée,</tspan><tspan x="105" dy="21">vous dedans</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.040;0.090;1" dur="12s" repeatCount="indefinite"/></g><g><circle cx="276" cy="66" r="13" fill="#e8914a"/><text class="wht" x="276" y="72" text-anchor="middle"><tspan x="276" dy="0">1</tspan></text><path d="M252,96 H292" fill="none" stroke="#1b3a63" stroke-width="3" marker-end="url(#fl-ac5)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.120;0.160;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="300" y="40" width="200" height="110" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/>
    <circle cx="340" cy="95" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(340 95) scale(0.85)"><path d="M-13,-19 h17 l10,10 v28 h-27 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M4,-19 v10 h10" fill="none" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-7,0 h14 M-7,7 h14 M-7,14 h8" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="380" y="79" text-anchor="start"><tspan x="380" dy="0">Fiche</tspan></text>
    <text class="txt" x="380" y="100" text-anchor="start"><tspan x="380" dy="0">d'intervention</tspan><tspan x="380" dy="21">Cerfa 15497</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.180;0.240;1" dur="12s" repeatCount="indefinite"/></g><g><circle cx="526" cy="66" r="13" fill="#e8914a"/><text class="wht" x="526" y="72" text-anchor="middle"><tspan x="526" dy="0">2</tspan></text><path d="M502,96 H542" fill="none" stroke="#1b3a63" stroke-width="3" marker-end="url(#fl-ac5)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.280;0.320;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="550" y="40" width="225" height="110" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="590" cy="95" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(590 95) scale(0.85)"><rect x="-20" y="-13" width="40" height="28" rx="3" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-5" cy="1" r="9" fill="#fff" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-5,-7 v16 M-13,1 h16" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M11,-7 v16 M15,-7 v16" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="630" y="79" text-anchor="start"><tspan x="630" dy="0">Détenteur</tspan></text>
    <text class="txt" x="630" y="100" text-anchor="start"><tspan x="630" dy="0">signe, au-delà du</tspan><tspan x="630" dy="21">seuil de charge</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.340;0.400;1" dur="12s" repeatCount="indefinite"/></g><circle r="8" fill="#e8914a" opacity="0" cx="0" cy="0"><animateMotion path="M250,96 H300" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.120;0.200;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.120;0.135;0.185;0.200;1" dur="12s" repeatCount="indefinite"/></circle><circle r="8" fill="#e8914a" opacity="0" cx="0" cy="0"><animateMotion path="M500,96 H550" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.280;0.360;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.280;0.295;0.345;0.360;1" dur="12s" repeatCount="indefinite"/></circle><g><circle cx="400" cy="206" r="13" fill="#e8914a"/><text class="wht" x="400" y="212" text-anchor="middle"><tspan x="400" dy="0">3</tspan></text><path d="M360,152 L212,258" fill="none" stroke="#e8914a" stroke-width="3" marker-end="url(#fl-ac5)"/><path d="M440,152 L588,258" fill="none" stroke="#1b3a63" stroke-width="3" marker-end="url(#fl-ac5)"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.460;0.520;1" dur="12s" repeatCount="indefinite"/></g><circle r="8" fill="#e8914a" opacity="0" cx="0" cy="0"><animateMotion path="M360,152 L212,258" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.520;0.640;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.520;0.535;0.625;0.640;1" dur="12s" repeatCount="indefinite"/></circle><circle r="8" fill="#1b3a63" opacity="0" cx="0" cy="0"><animateMotion path="M440,152 L588,258" dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.520;0.640;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.520;0.535;0.625;0.640;1" dur="12s" repeatCount="indefinite"/></circle><g><rect x="25" y="262" width="370" height="110" rx="12" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
    <circle cx="65" cy="317" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(65 317) scale(0.85)"><path d="M-20,16 V-12 h14 l4,5 h22 V16 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-20,-2 h40" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="105" y="301" text-anchor="start"><tspan x="105" dy="0">Une copie chez l'opérateur</tspan></text>
    <text class="txt" x="105" y="322" text-anchor="start"><tspan x="105" dy="0">dans votre entreprise,</tspan><tspan x="105" dy="21">au moins cinq ans</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.620;0.680;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="405" y="262" width="370" height="110" rx="12" fill="#fdf1e6" stroke="#e8914a" stroke-width="3"/>
    <circle cx="445" cy="317" r="28" fill="#fff" stroke="#5a6b7d" stroke-width="2"/><g transform="translate(445 317) scale(0.85)"><path d="M-20,16 V-12 h14 l4,5 h22 V16 z" fill="#eef3f9" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-20,-2 h40" stroke="#1b3a63" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text class="nom" x="485" y="301" text-anchor="start"><tspan x="485" dy="0">L'original chez le détenteur</tspan></text>
    <text class="txt" x="485" y="322" text-anchor="start"><tspan x="485" dy="0">avec ses autres papiers,</tspan><tspan x="485" dy="21">au moins cinq ans</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.700;0.760;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="25" y="400" width="750" height="82" rx="12" fill="#e6f2ef" stroke="#0f766e" stroke-width="2.5"/><text class="nomc" x="400" y="432" text-anchor="middle"><tspan x="400" dy="0">1. L'opérateur remplit la fiche. 2. Le détenteur la signe.</tspan></text><text class="txt" x="400" y="458" text-anchor="middle"><tspan x="400" dy="0">3. Chacun garde son exemplaire : on informe, on fait signer, on transmet.</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.800;0.860;1" dur="12s" repeatCount="indefinite"/></g>
</svg>
