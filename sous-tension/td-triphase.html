function initProgress() {
    const bar = document.getElementById("progressBar");
    bar.innerHTML = "";
    for (let i = 0; i < totalSteps; i++) {
        const d = document.createElement("div");
        if (i === 0) d.classList.add("active");
        bar.appendChild(d);
    }
    // Plan déroulé
    const planLabels = ["Intro", "Alternateur", "Tensions", "√3", "Vecteurs", "Triangle", "Étoile", "Plaque", "Barr. Δ", "Barr. Y", "Éval", "Résultats", "Bonus"];
    const planDiv = document.getElementById("planEtapes");
    planDiv.innerHTML = "";
    planLabels.forEach((label, i) => {
        const span = document.createElement("span");
        span.className = "plan-etape" + (i === 0 ? " active" : "");
        span.textContent = label;
        span.onclick = () => { if (i <= currentStep || i === 0) showStep(i); };
        planDiv.appendChild(span);
    });
}

function showStep(idx) {
    const steps = document.querySelectorAll(".step");
    if (idx < 0 || idx >= steps.length) return;
    steps.forEach((s, i) => s.classList.toggle("active", i === idx));
    currentStep = idx;
    const bar = document.querySelectorAll(".progress div");
    bar.forEach((b, i) => { b.classList.remove("active", "done"); if (i < currentStep) b.classList.add("done"); if (i === currentStep) b.classList.add("active"); });
    const sections = ["Introduction", "Alternateur", "Tensions", "Récapitulatif √3", "Vecteurs", "Triangle", "Étoile", "Plaque", "Barrettes Δ", "Barrettes Y", "Évaluation", "Résultats", "Pour aller plus loin"];
    document.getElementById("headerSection").textContent = sections[idx] || "";
    // Mise à jour plan déroulé
    const planEtapes = document.querySelectorAll(".plan-etape");
    planEtapes.forEach((e, i) => {
        e.classList.remove("active", "done");
        if (i < currentStep) e.classList.add("done");
        if (i === currentStep) e.classList.add("active");
    });
    window.scrollTo(0, 0);
}

// =============== ANIMATION GÉNÉRATRICE ===============
function toggleAnim() { animRunning ? stopAnim() : startAnim(); }
function startAnim() { animRunning = true; document.getElementById("btnAnim").textContent = "⏸ Pause"; document.getElementById("btnAnim").classList.add("active"); anim(); }
function stopAnim() { animRunning = false; document.getElementById("btnAnim").textContent = "▶ Démarrer"; document.getElementById("btnAnim").classList.remove("active"); if (animId) cancelAnimationFrame(animId); }
function resetAnim() { stopAnim(); rotorAngle = 0; document.getElementById("rotor").setAttribute("transform", "rotate(0 90 90)"); document.getElementById("sin1").setAttribute("d", ""); document.getElementById("sin2").setAttribute("d", ""); document.getElementById("sin3").setAttribute("d", ""); }

function setPhases(n) {
    nbPhases = n;
    document.getElementById("btnP1").classList.toggle("active", n === 1);
    document.getElementById("btnP2").classList.toggle("active", n === 2);
    document.getElementById("btnP3").classList.toggle("active", n === 3);
    document.getElementById("bobine2").style.opacity = n >= 2 ? "1" : "0";
    document.getElementById("bobine3").style.opacity = n >= 3 ? "1" : "0";
    const expl = document.getElementById("phaseExplanation");
    if (n === 1) expl.innerHTML = `<h4>🔌 Monophasé (1 bobine)</h4><p>Une seule bobine = une seule sinusoïde. C'est le courant domestique (prise 230V).</p>`;
    else if (n === 2) expl.innerHTML = `<h4>⚡ Deux bobines</h4><p>Deux bobines décalées = 2 sinusoïdes décalées de 120°.</p>`;
    else expl.innerHTML = `<h4>⚡⚡⚡ Triphasé (3 bobines)</h4><p>Trois bobines à 120° = 3 sinusoïdes décalées. C'est le triphasé industriel !</p>`;
    resetAnim();
}

function anim() {
    if (!animRunning) return;
    rotorAngle += 2; if (rotorAngle > 720) rotorAngle = 0;
    document.getElementById("rotor").setAttribute("transform", `rotate(${rotorAngle} 90 90)`);
    const maxX = Math.min(rotorAngle / 720 * 200, 200);
    let d1 = "M10,90", d2 = "M10,90", d3 = "M10,90";
    for (let x = 0; x <= maxX; x += 2) {
        const a = x / 200 * 4 * Math.PI;
        d1 += ` L${10+x},${90 - Math.sin(a) * 55}`;
        if (nbPhases >= 2) d2 += ` L${10+x},${90 - Math.sin(a - 2*Math.PI/3) * 55}`;
        if (nbPhases >= 3) d3 += ` L${10+x},${90 - Math.sin(a - 4*Math.PI/3) * 55}`;
    }
    document.getElementById("sin1").setAttribute("d", d1);
    document.getElementById("sin2").setAttribute("d", nbPhases >= 2 ? d2 : "");
    document.getElementById("sin3").setAttribute("d", nbPhases >= 3 ? d3 : "");
    animId = requestAnimationFrame(anim);
}

const posY = { L1: 30, L2: 70, L3: 110, N: 150 };

function nextTensionStep() {
    if (tensionStep < tensionSteps.length) {
        const e = tensionSteps[tensionStep];
        document.getElementById("tensionExplication").innerHTML = `<h4>${e.titre}</h4>${e.texte}`;
        
        const voltDisplay = document.getElementById("voltValeur");
        voltDisplay.textContent = e.tension;
        if (e.tension == V_SIMPLE) { voltDisplay.style.color = "#a855f7"; voltDisplay.style.textShadow = "0 0 12px #a855f7"; }
        else if (e.tension == V_COMPOSEE) { voltDisplay.style.color = "#f59e0b"; voltDisplay.style.textShadow = "0 0 12px #f59e0b"; }
        else { voltDisplay.style.color = "#22c55e"; voltDisplay.style.textShadow = "0 0 12px #22c55e"; }
        
        const filMesure = document.getElementById("filMesure");
        if (e.mesure) {
            const y1 = posY[e.mesure.de], y2 = posY[e.mesure.vers], x = e.mesure.x;
            document.getElementById("filLigne").setAttribute("x1", x);
            document.getElementById("filLigne").setAttribute("y1", Math.min(y1, y2));
            document.getElementById("filLigne").setAttribute("x2", x);
            document.getElementById("filLigne").setAttribute("y2", Math.max(y1, y2));
            document.getElementById("point1").setAttribute("cx", x); document.getElementById("point1").setAttribute("cy", y1);
            document.getElementById("point2").setAttribute("cx", x); document.getElementById("point2").setAttribute("cy", y2);
            filMesure.style.display = "block";
        } else { filMesure.style.display = "none"; }
        
        // À la dernière étape, afficher le bouton vers le récapitulatif
        if (e.showRecap) {
            document.getElementById("btnToRecap").style.display = "block";
        }
        
        tensionStep++;
        document.getElementById("btnTensionPrev").disabled = false;
        if (tensionStep >= tensionSteps.length) { document.getElementById("btnTensionNext").disabled = true; document.getElementById("btnTensionNext").textContent = "✓ Terminé"; }
    }
}

function prevTensionStep() {
    if (tensionStep > 1) {
        tensionStep -= 2;
        nextTensionStep();
    } else if (tensionStep === 1) {
        tensionStep = 0;
        document.getElementById("tensionExplication").innerHTML = tensionSteps[0].texte.replace("<h4>", `<h4>${tensionSteps[0].titre}</h4>`);
        document.getElementById("voltValeur").textContent = "---"; document.getElementById("voltValeur").style.color = "#22c55e";
        document.getElementById("filMesure").style.display = "none";
        document.getElementById("recapTensions").style.display = "none";
        document.getElementById("formuleTensions").style.display = "none";
        document.getElementById("btnToVectors").style.display = "none";
        document.getElementById("btnTensionPrev").disabled = true;
        document.getElementById("btnTensionNext").disabled = false;
        document.getElementById("btnTensionNext").textContent = "Suivant →";
    }
}

function nextVecStep() {
    if (vecStep < vecExplanations.length) {

        document.getElementById(step.el).style.transition = "opacity 0.5s";

}

function prevVecStep() {
    if (vecStep > 1) { // Ne pas descendre en dessous de 1 (V1)
        vecStep--;
        document.getElementById(vecExplanations[vecStep].el).style.opacity = "0";
        if (vecStep > 0) { 
            const prev = vecExplanations[vecStep - 1]; 
            document.getElementById("vecExplanation").innerHTML = `<h4>${prev.title}</h4><p>${prev.text}</p>`; 
        }

    }
}

function resetVec() {
    vecStep = 1; // On commence à 1 car V1 est déjà visible

// =============== ÉVALUATION ===============
function startEval() { evalIndex = 0; score = 0; answers = []; document.getElementById("scoreBadge").style.display = "inline-flex"; document.getElementById("scoreValue").textContent = "0"; showStep(10); renderQ(); }

function renderQ() {
    const q = evalQuestions[evalIndex];
    document.getElementById("qIdx").textContent = evalIndex + 1;
    document.getElementById("qTxt").textContent = q.q;
    document.getElementById("qTag").textContent = q.section;
    const box = document.getElementById("qChoices"); box.innerHTML = "";
    q.choices.forEach((ch, i) => { const btn = document.createElement("button"); btn.className = "btn-quiz"; btn.textContent = ch; btn.onclick = () => selectAns(i); box.appendChild(btn); });
    document.getElementById("btnNextQ").disabled = true;
    document.getElementById("btnNextQ").textContent = evalIndex === evalQuestions.length - 1 ? "Voir les résultats →" : "Question suivante →";
}

function selectAns(i) {
    const q = evalQuestions[evalIndex];
    const btns = document.querySelectorAll("#qChoices .btn-quiz");
    btns.forEach((b, j) => { b.onclick = null; if (j === q.correct) b.classList.add("correct"); if (j === i && j !== q.correct) b.classList.add("wrong"); });
    if (i === q.correct) score++;
    document.getElementById("scoreValue").textContent = score;
    answers.push({ idx: evalIndex, ok: i === q.correct, section: q.section });
    document.getElementById("btnNextQ").disabled = false;
}

function nextQ() { if (evalIndex < evalQuestions.length - 1) { evalIndex++; renderQ(); } else { finishEval(); showStep(11); } }

function finishEval() {
    document.getElementById("finalScore").textContent = score + "/20";
    document.getElementById("finalScore").style.color = score >= 10 ? "#16a34a" : "#dc2626";
    document.getElementById("resNom").textContent = studentName;
    document.getElementById("resClasse").textContent = studentClasse;
    const e = document.getElementById("resEmoji"), t = document.getElementById("resTitle"), m = document.getElementById("resMsg");
    if (score >= 16) { e.textContent = "🥇"; t.textContent = "Excellent !"; m.textContent = "Tu maîtrises très bien le sujet."; }
    else if (score >= 12) { e.textContent = "✅"; t.textContent = "Satisfaisant"; m.textContent = "L'essentiel est compris."; }
    else if (score >= 8) { e.textContent = "🧐"; t.textContent = "À renforcer"; m.textContent = "Certaines notions sont à revoir."; }
    else { e.textContent = "⚠️"; t.textContent = "Insuffisant"; m.textContent = "Reprends le cours depuis le début."; }
    const stats = {};
    answers.forEach(a => { if (!stats[a.section]) stats[a.section] = { t: 0, c: 0 }; stats[a.section].t++; if (a.ok) stats[a.section].c++; });
    let dHtml = "";
    Object.entries(stats).forEach(([n, d]) => { const p = Math.round(d.c / d.t * 100); dHtml += `<p style="display:flex;justify-content:space-between;margin:3px 0;font-size:0.85rem;"><span>${n}</span><span style="color:${p>=60?'#16a34a':'#dc2626'};font-weight:600;">${d.c}/${d.t} (${p}%)</span></p>`; });
    document.getElementById("details").innerHTML = dHtml;
    buildComp(stats);
}

function buildComp(stats) {
    const cont = document.getElementById("compTable");
    if (!studentClasse || !competenceProfiles[studentClasse]) { cont.innerHTML = "<p style='font-size:0.85rem;'>Aucun profil pour cette classe.</p>"; return; }
    const prof = competenceProfiles[studentClasse];
    let html = `<table><tr><th>Code</th><th>Compétence</th><th style="text-align:center;">Niveau</th></tr>`;
    prof.forEach(c => {
        let tot = 0, cor = 0;
        c.sections.forEach(s => { if (stats[s]) { tot += stats[s].t; cor += stats[s].c; } });
        let pct = tot > 0 ? Math.round(cor / tot * 100) : 0;
        let niv = "Non évalué", bg = "#e5e7eb", col = "#111";
        if (tot > 0) {
            if (pct < 40) { niv = "Non acquis"; bg = "#fee2e2"; col = "#b91c1c"; }
            else if (pct < 60) { niv = "En cours"; bg = "#fef9c3"; col = "#92400e"; }
            else if (pct < 85) { niv = "Acquis"; bg = "#dcfce7"; col = "#166534"; }
            else { niv = "Parfait"; bg = "#bbf7d0"; col = "#166534"; }
        }
        html += `<tr><td>${c.code}</td><td>${c.label}</td><td style="text-align:center;"><span style="display:inline-block;padding:2px 6px;border-radius:999px;background:${bg};color:${col};font-size:0.7rem;">${niv} (${pct}%)</span></td></tr>`;
    });
    html += "</table>";
    cont.innerHTML = html;
}

function sendEmail() {
    const email = document.getElementById("emailProf").value;
    if (!email) { alert("Entre l'email."); return; }
    const dur = Math.round((new Date() - startTime) / 60000);
    const subj = encodeURIComponent(`TD Triphasé - ${studentName} (${studentClasse}) - ${score}/20`);
    let body = `RÉSULTAT TD TRIPHASÉ & COUPLAGE\n================================\n\nÉlève : ${studentName}\nClasse : ${studentClasse}\nDate : ${new Date().toLocaleDateString('fr-FR')}\nDurée : ${dur} min\nScore : ${score}/20\n\n`;
    body += `DÉTAIL :\n`;
    answers.forEach((a, i) => { body += `Q${i+1} [${a.section}] : ${a.ok ? '✓' : '✗'}\n`; });
    window.location.href = `mailto:${email}?subject=${subj}&body=${encodeURIComponent(body)}`;
}

// =============== DRAG & DROP AMÉLIORÉ ===============
let draggedElement = null;

// Initialiser le drag & drop après le chargement
document.addEventListener('DOMContentLoaded', function() {
    // Attendre que les steps soient générés
    setTimeout(initDragDrop, 300);
});

function initDragDrop() {
    // Tous les éléments draggables
    document.querySelectorAll('.exo-draggable').forEach(function(el) {
        el.addEventListener('dragstart', handleDragStart);
        el.addEventListener('dragend', handleDragEnd);
        // Support tactile
        el.addEventListener('touchstart', handleTouchStart, {passive: false});
        el.addEventListener('touchmove', handleTouchMove, {passive: false});
        el.addEventListener('touchend', handleTouchEnd);
    });
    
    // Toutes les zones de dépôt
    document.querySelectorAll('.exo-dropzone').forEach(function(zone) {
        zone.addEventListener('dragover', handleDragOver);
        zone.addEventListener('dragleave', handleDragLeave);
        zone.addEventListener('drop', handleDrop);
    });
}

function handleDragStart(e) {
    draggedElement = e.target;
    e.target.style.opacity = '0.6';
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', e.target.dataset.value);
}

function handleDragEnd(e) {
    e.target.style.opacity = '1';
    // Enlever tous les effets dragover
    document.querySelectorAll('.exo-dropzone').forEach(function(z) {
        z.classList.remove('dragover');
    });
}

function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    e.currentTarget.classList.add('dragover');
}

function handleDragLeave(e) {
    e.currentTarget.classList.remove('dragover');
}

function handleDrop(e) {
    e.preventDefault();
    var dropzone = e.currentTarget;
    dropzone.classList.remove('dragover');
    
    var value = e.dataTransfer.getData('text/plain');
    var content = dropzone.querySelector('.drop-content');
    
    if (content && draggedElement) {
        content.textContent = draggedElement.textContent;
        content.dataset.value = value;
        draggedElement.classList.add('placed');
    }
}

// Support tactile amélioré
var touchDragElement = null;
var touchClone = null;

function handleTouchStart(e) {
    touchDragElement = e.target;
    // Créer un clone pour le suivi visuel
    touchClone = e.target.cloneNode(true);
    touchClone.style.position = 'fixed';
    touchClone.style.pointerEvents = 'none';
    touchClone.style.opacity = '0.8';
    touchClone.style.zIndex = '9999';
    touchClone.style.transform = 'scale(1.1)';
    document.body.appendChild(touchClone);
    
    e.target.style.opacity = '0.4';
    e.preventDefault();
}

function handleTouchMove(e) {
    if (!touchClone) return;
    var touch = e.touches[0];
    touchClone.style.left = (touch.clientX - 50) + 'px';
    touchClone.style.top = (touch.clientY - 25) + 'px';
    
    // Highlight de la zone sous le doigt
    var elementUnder = document.elementFromPoint(touch.clientX, touch.clientY);
    document.querySelectorAll('.exo-dropzone').forEach(function(z) {
        z.classList.remove('dragover');
    });
    if (elementUnder && elementUnder.classList.contains('exo-dropzone')) {
        elementUnder.classList.add('dragover');
    } else if (elementUnder && elementUnder.closest('.exo-dropzone')) {
        elementUnder.closest('.exo-dropzone').classList.add('dragover');
    }
    
    e.preventDefault();
}

function handleTouchEnd(e) {
    if (!touchDragElement) return;
    
    // Trouver la zone sous le doigt
    var touch = e.changedTouches[0];
    var elementUnder = document.elementFromPoint(touch.clientX, touch.clientY);
    var dropzone = null;
    
    if (elementUnder && elementUnder.classList.contains('exo-dropzone')) {
        dropzone = elementUnder;
    } else if (elementUnder && elementUnder.closest('.exo-dropzone')) {
        dropzone = elementUnder.closest('.exo-dropzone');
    }
    
    if (dropzone) {
        var content = dropzone.querySelector('.drop-content');
        if (content) {
            content.textContent = touchDragElement.textContent;
            content.dataset.value = touchDragElement.dataset.value;
            touchDragElement.classList.add('placed');
        }
    }
    
    // Nettoyer
    touchDragElement.style.opacity = '1';
    if (touchClone && touchClone.parentNode) {
        touchClone.parentNode.removeChild(touchClone);
    }
    document.querySelectorAll('.exo-dropzone').forEach(function(z) {
        z.classList.remove('dragover');
    });
    
    touchDragElement = null;
    touchClone = null;
}

// =============== FONCTIONS DE VÉRIFICATION ===============

function verifierTensions() {
    var zones = {
        'drop-phase-neutre': '230',
        'drop-phase-phase': '400'
    };
    var correct = 0;
    var total = 0;
    
    for (var zoneId in zones) {
        var zone = document.getElementById(zoneId);
        if (!zone) continue;
        var content = zone.querySelector('.drop-content');
        var value = content ? content.dataset.value : null;
        total++;
        
        zone.classList.remove('correct', 'wrong');
        if (value === zones[zoneId]) {
            zone.classList.add('correct');
            correct++;
        } else if (value) {
            zone.classList.add('wrong');
        }
    }
    
    var feedback = document.getElementById('exo-tensions-feedback');
    if (correct === total) {
        feedback.textContent = '✅ Parfait ! 230V entre phase-neutre, 400V entre deux phases.';
        feedback.className = 'exo-feedback success show';
    } else {
        feedback.textContent = '❌ Pas tout à fait. Rappel : Phase-Neutre = 230V, Phase-Phase = 400V.';
        feedback.className = 'exo-feedback error show';
    }
}

function verifierBarrettes() {

        'drop-2-horizontales': 'etoile'
    };

// ----- Export PDF avec jsPDF -----
function exportPDF() {
    if (typeof jspdf === 'undefined') {
        alert('⚠️ Erreur : jsPDF non chargé. Vérifiez votre connexion ou utilisez une version offline.');
        return;
    }
    
    const { jsPDF } = jspdf;
    const doc = new jsPDF();
    
    // En-tête avec la marque
    doc.setFillColor(15, 23, 42);
    doc.rect(0, 0, 210, 35, 'F');
    doc.setTextColor(56, 189, 248);
    doc.setFontSize(22);
    doc.setFont(undefined, 'bold');
    doc.text('inerweb.fr', 15, 20);
    doc.setTextColor(229, 231, 235);
    doc.setFontSize(10);
    doc.setFont(undefined, 'normal');
    doc.text('inerweb.fr', 15, 27);
    
    // Titre du document
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(16);
    doc.setFont(undefined, 'bold');
    doc.text('Bilan TD Triphasé & Couplages', 15, 50);
    
    // Informations élève
    doc.setFontSize(11);
    doc.setFont(undefined, 'normal');
    doc.text(`Élève : ${studentName}`, 15, 65);
    doc.text(`Classe : ${studentClasse}`, 15, 72);
    doc.text(`Date : ${new Date().toLocaleDateString('fr-FR')}`, 15, 79);
    const duree = startTime ? Math.round((new Date() - startTime) / 60000) : 0;
    doc.text(`Durée : ${duree} minutes`, 15, 86);
    
    // Score global
    doc.setFontSize(14);
    doc.setFont(undefined, 'bold');
    const scoreColor = score >= 10 ? [22, 197, 94] : [220, 38, 38];
    doc.setTextColor(scoreColor[0], scoreColor[1], scoreColor[2]);
    doc.text(`Score : ${score}/20`, 15, 100);
    
    // Appréciation
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(10);
    doc.setFont(undefined, 'normal');
    let appreciation = '';
    if (score >= 16) appreciation = 'Excellent ! Tu maîtrises très bien le sujet.';
    else if (score >= 12) appreciation = 'Satisfaisant. L\'essentiel est compris.';
    else if (score >= 8) appreciation = 'À renforcer. Certaines notions sont à revoir.';
    else appreciation = 'Insuffisant. Reprends le cours depuis le début.';
    doc.text(appreciation, 15, 108);
    
    // Détail par thème
    doc.setFontSize(12);
    doc.setFont(undefined, 'bold');
    doc.text('Détail par thème :', 15, 125);
    doc.setFontSize(10);
    doc.setFont(undefined, 'normal');
    
    const stats = {};
    answers.forEach(a => {
        if (!stats[a.section]) stats[a.section] = { t: 0, c: 0 };
        stats[a.section].t++;
        if (a.ok) stats[a.section].c++;
    });
    
    let yPos = 135;
    Object.entries(stats).forEach(([nom, data]) => {
        const pct = Math.round(data.c / data.t * 100);
        doc.text(`• ${nom} : ${data.c}/${data.t} (${pct}%)`, 20, yPos);
        yPos += 7;
    });
    
    // Compétences évaluées
    yPos += 10;
    if (yPos > 250) {
        doc.addPage();
        yPos = 20;
    }
    doc.setFontSize(12);
    doc.setFont(undefined, 'bold');
    doc.text('Compétences évaluées :', 15, yPos);
    yPos += 10;
    
    if (studentClasse && competenceProfiles[studentClasse]) {
        const prof = competenceProfiles[studentClasse];
        doc.setFontSize(9);
        doc.setFont(undefined, 'normal');
        
        prof.forEach(c => {
            if (yPos > 270) {
                doc.addPage();
                yPos = 20;
            }
            let tot = 0, cor = 0;
            c.sections.forEach(s => {
                if (stats[s]) { tot += stats[s].t; cor += stats[s].c; }
            });
            let pct = tot > 0 ? Math.round(cor / tot * 100) : 0;
            let niv = pct < 40 ? 'Non acquis' : pct < 60 ? 'En cours' : pct < 85 ? 'Acquis' : 'Parfait';
            
            doc.text(`${c.code} - ${c.label}`, 20, yPos);
            doc.text(`${niv} (${pct}%)`, 150, yPos);
            yPos += 6;
        });
    }
    
    // Pied de page
    const totalPages = doc.internal.pages.length - 1;
    for (let i = 1; i <= totalPages; i++) {
        doc.setPage(i);
        doc.setFontSize(8);
        doc.setTextColor(150, 150, 150);
        doc.text(`Document généré par inerweb.fr - Page ${i}/${totalPages}`, 105, 290, { align: 'center' });
    }
    
    // Télécharger
    const filename = `TD_Triphase_${studentName.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.pdf`;
    doc.save(filename);
}

// ----- Sauvegarde localStorage (optionnel) -----
function saveProgress() {
    const data = {
        step: currentStep,
        score: score,
        answers: answers,
        name: studentName,
        classe: studentClasse,
        time: startTime
    };
    localStorage.setItem('tdTriphase_progress', JSON.stringify(data));
}

function loadProgress() {
    const saved = localStorage.getItem('tdTriphase_progress');
    if (!saved) return false;
    
    try {
        const data = JSON.parse(saved);
        currentStep = data.step;
        score = data.score;
        answers = data.answers;
        studentName = data.name;
        studentClasse = data.classe;
        startTime = data.time;
        return true;
    } catch(e) {
        return false;
    }
}

// Sauvegarder automatiquement à chaque changement d'étape
const originalNextStep = nextStep;
nextStep = function() {
    originalNextStep();
    saveProgress();
};
