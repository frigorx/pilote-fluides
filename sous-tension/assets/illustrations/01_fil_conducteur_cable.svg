<title id="title">Fil, conducteur, câble</title>
<desc id="desc">Illustration pédagogique originale pour un cours sur les câbles électriques.</desc>
<style>
  .bg{fill:#f7f7f5;}
  .card{fill:#fff;stroke:#e6e6e2;stroke-width:2;}
  .title{font:700 32px Arial, sans-serif;fill:#1b3a63;}
  .subtitle{font:700 22px Arial, sans-serif;fill:#2b2b2b;}
  .txt{font:18px Arial, sans-serif;fill:#2b2b2b;}
  .small{font:15px Arial, sans-serif;fill:#5b6472;}
  .label{font:700 16px Arial, sans-serif;fill:#fff;}
  .blue{fill:#1b3a63;}
  .orange{fill:#ff6b35;}
  .copper{fill:#d98b3a;}
  .brown{fill:#6b4226;}
  .green{fill:#2e7d32;}
  .yellow{fill:#f4c430;}
  .grey{fill:#5b6472;}
  .dark{fill:#2b2b2b;}
  .aluminium{fill:#cfd6df;}
  .stroke-blue{stroke:#1b3a63;}
  .stroke-dark{stroke:#2b2b2b;}
  .stroke-grey{stroke:#5b6472;}
  .stroke-orange{stroke:#ff6b35;}
  .stroke-copper{stroke:#d98b3a;}
  .stroke-green{stroke:#2e7d32;}
  .line{fill:none;stroke-linecap:round;stroke-linejoin:round;}
</style>
<rect class="bg" width="100%" height="100%"/>

<text x="45" y="55" class="title">Fil, conducteur, câble : les 3 mots à ne pas mélanger</text>
<rect x="45" y="90" width="810" height="360" rx="24" class="card"/>
<g transform="translate(95 150)">
  <text x="0" y="-35" class="subtitle">Conducteur</text>
  <line x1="0" y1="45" x2="210" y2="45" stroke="#d98b3a" stroke-width="34" stroke-linecap="round"/>
  <text x="0" y="115" class="txt">Métal nu : cuivre ou aluminium</text>
</g>
<g transform="translate(345 150)">
  <text x="0" y="-35" class="subtitle">Fil isolé</text>
  <line x1="0" y1="45" x2="210" y2="45" stroke="#6b4226" stroke-width="46" stroke-linecap="round"/>
  <line x1="0" y1="45" x2="210" y2="45" stroke="#d98b3a" stroke-width="22" stroke-linecap="round"/>
  <text x="0" y="115" class="txt">Un conducteur + un isolant</text>
</g>
<g transform="translate(595 150)">
  <text x="0" y="-35" class="subtitle">Câble</text>
  <rect x="0" y="20" width="210" height="55" rx="28" class="dark"/>
  <circle cx="60" cy="48" r="16" class="brown"/><circle cx="60" cy="48" r="7" class="copper"/>
  <circle cx="105" cy="48" r="16" fill="#2f6fb0"/><circle cx="105" cy="48" r="7" class="copper"/>
  <circle cx="150" cy="48" r="16" class="green"/><circle cx="150" cy="48" r="7" class="copper"/>
  <text x="0" y="115" class="txt">Plusieurs fils dans une gaine</text>
</g>
<text x="95" y="405" class="small">Idée-clé : le câble est un ensemble. Le fil est un élément. Le conducteur est la partie métallique.</text>

</svg>