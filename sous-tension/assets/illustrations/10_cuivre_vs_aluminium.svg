<rect class="bg" width="100%" height="100%"/>

<text x="45" y="55" class="title">Cuivre ou aluminium : même rôle, contraintes différentes</text>
<rect x="55" y="100" width="380" height="345" rx="24" class="card"/>
<rect x="465" y="100" width="380" height="345" rx="24" class="card"/>
<text x="95" y="150" class="subtitle">Cuivre</text>
<line x1="105" y1="245" x2="350" y2="245" stroke="#d98b3a" stroke-width="62" stroke-linecap="round"/>
<text x="95" y="335" class="txt">Bonne conductivité</text>
<text x="95" y="365" class="small">Plus courant sur petites/moyennes sections</text>
<text x="505" y="150" class="subtitle">Aluminium</text>
<line x1="515" y1="245" x2="760" y2="245" stroke="#cfd6df" stroke-width="62" stroke-linecap="round"/>
<text x="505" y="335" class="txt">Plus léger, souvent grosses sections</text>
<text x="505" y="365" class="small">Raccordements adaptés obligatoires</text>
<text x="95" y="420" class="small">Le « A » du code (U1000 AR2V) signale une âme en aluminium.</text>

