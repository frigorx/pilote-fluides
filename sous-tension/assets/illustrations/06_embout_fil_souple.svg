<title id="title">Embout sur fil souple</title>
<desc id="desc">Illustration pédagogique originale pour un cours sur les câbles électriques.</desc>
<style>
  .bg{fill:#f7f7f5;}
  .card{fill:#fff;stroke:#e6e6e2;stroke-width:2;}
  .title{font:700 32px Arial, sans-serif;fill:#1b3a63;}
  .subtitle{font:700 22px Arial, sans-serif;fill:#2b2b2b;}
  .txt{font:18px Arial, sans-serif;fill:#2b2b2b;}
  .small{font:15px Arial, sans-serif;fill:#5b6472;}
  .label{font:700 16px Arial, sans-serif;fill:#fff;}
  .blue{fill:#1b3a63;}
  .orange{fill:#ff6b35;}
  .copper{fill:#d98b3a;}
  .brown{fill:#6b4226;}
  .green{fill:#2e7d32;}
  .yellow{fill:#f4c430;}
  .grey{fill:#5b6472;}
  .dark{fill:#2b2b2b;}
  .aluminium{fill:#cfd6df;}
  .stroke-blue{stroke:#1b3a63;}
  .stroke-dark{stroke:#2b2b2b;}
  .stroke-grey{stroke:#5b6472;}
  .stroke-orange{stroke:#ff6b35;}
  .stroke-copper{stroke:#d98b3a;}
  .stroke-green{stroke:#2e7d32;}
  .line{fill:none;stroke-linecap:round;stroke-linejoin:round;}
</style>
<rect class="bg" width="100%" height="100%"/>

<text x="45" y="55" class="title">Fil souple en borne : l’embout évite les brins écrasés</text>
<rect x="55" y="100" width="790" height="345" rx="24" class="card"/>
<g transform="translate(90 160)">
  <text x="0" y="-20" class="subtitle">Sans embout</text>
  <line x1="0" y1="80" x2="250" y2="80" stroke="#6b4226" stroke-width="34" stroke-linecap="round"/>
  <g stroke="#d98b3a" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M240 70 q35 -25 65 -35"/><path d="M245 80 q40 0 70 0"/><path d="M240 90 q35 25 65 35"/>
  </g>
  <rect x="300" y="35" width="105" height="90" rx="8" fill="#e9edf2" stroke="#5b6472" stroke-width="3"/>
  <line x1="352" y1="35" x2="352" y2="125" stroke="#5b6472" stroke-width="3"/>
  <text x="0" y="170" class="small">Risque : brins coupés, mauvais serrage</text>
</g>
<g transform="translate(500 160)">
  <text x="0" y="-20" class="subtitle">Avec embout</text>
  <line x1="0" y1="80" x2="170" y2="80" stroke="#6b4226" stroke-width="34" stroke-linecap="round"/>
  <rect x="150" y="58" width="95" height="44" rx="8" fill="#cfd6df" stroke="#5b6472" stroke-width="3"/>
  <rect x="245" y="35" width="105" height="90" rx="8" fill="#e9edf2" stroke="#5b6472" stroke-width="3"/>
  <line x1="297" y1="35" x2="297" y2="125" stroke="#5b6472" stroke-width="3"/>
  <path d="M385 75 l20 20 l42 -55" fill="none" stroke="#2e7d32" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="0" y="170" class="small">Serrage propre, si borne adaptée / exigée</text>
</g>

</svg>