<text x="45" y="55" class="title">Sécurité incendie : réaction au feu ou résistance au feu ?</text>
<rect x="55" y="100" width="380" height="345" rx="24" class="card"/>
<rect x="465" y="100" width="380" height="345" rx="24" class="card"/>
<text x="95" y="150" class="subtitle">Réaction au feu</text>
<path d="M230 310 C160 245, 220 220, 205 160 C270 215, 315 245, 280 315 Z" fill="#ff6b35"/>
<path d="M235 308 C205 265, 250 245, 235 205 C280 240, 295 265, 270 315 Z" fill="#f4c430"/>
<line x1="120" y1="335" x2="355" y2="335" stroke="#2b2b2b" stroke-width="34" stroke-linecap="round"/>
<text x="95" y="390" class="small">Comment le câble alimente ou limite l’incendie</text>
<text x="505" y="150" class="subtitle">Résistance au feu</text>
<path d="M640 310 C570 245, 630 220, 615 160 C680 215, 725 245, 690 315 Z" fill="#ff6b35" opacity="0.85"/>
<line x1="530" y1="335" x2="765" y2="335" stroke="#2b2b2b" stroke-width="34" stroke-linecap="round"/>
<path d="M555 335 C610 285, 685 385, 745 335" fill="none" stroke="#f4c430" stroke-width="8" stroke-linecap="round"/>
<text x="505" y="390" class="small">Le circuit continue de fonctionner pendant un temps</text>

