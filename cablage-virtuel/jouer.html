<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>Câblage virtuel</title>
<link rel="stylesheet" href="moteur/cablage.css?v=20260927-1212">
<link rel="stylesheet" href="moteur/tutoriel.css?v=20260927-1212">
</head>
<body class="jeu">
<header class="barre">
  <a class="retour" href="index.html" title="Liste des exercices">‹</a>
  <div class="logo">Câblage <b>virtuel</b></div>
  <div class="titre" id="titre">…</div>
  <nav class="modes activites" id="activites" aria-label="Activité">
    <button data-activite="colorier">1 Colorier</button>
    <button data-activite="reperer">2 Repérer</button>
    <button data-activite="cabler">3 Câbler</button>
  </nav>
  <nav class="modes" id="modes" aria-label="Mode">
    <button data-mode="guide">Guidé</button>
    <button data-mode="aide">Aidé</button>
    <button data-mode="reel">Réel</button>
  </nav>
</header>

<div class="consigne" id="consigne"><div class="texte" id="consigne-texte">Chargement…</div></div>
<div class="nomenclature" id="nomenclature"></div>

<main class="scene">
  <section class="panneau" id="carte">
    <div class="entete"><b>La carte</b> <span>le schéma à lire</span><span class="spacer"></span>
      <button class="zoom" data-zoom="moins" title="Réduire">−</button><button class="zoom" data-zoom="plus" title="Agrandir">+</button><button class="zoom" data-zoom="ajuster" title="Tout voir">⤢</button>
      <button id="btn-numeros" title="Afficher les numéros de bornes sur le schéma">N° bornes</button>
      <button id="btn-detacher" title="Ouvrir la carte dans une autre fenêtre (deuxième écran)">Autre écran</button>
    </div>
    <div class="corps" id="carte-corps"></div>
  </section>
  <section class="panneau" id="platine">
    <div class="entete"><b>La platine</b> <span>tirez les fils de borne à borne</span><span class="spacer"></span>
      <button class="zoom" data-zoom="moins" title="Réduire">−</button><button class="zoom" data-zoom="plus" title="Agrandir">+</button><button class="zoom" data-zoom="ajuster" title="Tout voir">⤢</button>
      <button id="btn-vue-reelle" hidden>Vue réelle</button>
      <span id="compteur-fils">0 fil</span></div>
    <div class="corps" id="platine-corps"></div>
    <div class="visee" id="visee" hidden></div>
  </section>
</main>

<footer class="outils">
  <div class="couleurs" id="couleurs"></div>
  <span class="couleur-nom" id="couleur-nom"></span>
  <span class="spacer"></span>
  <div class="actions">
    <button class="action" id="btn-aide">Aide</button>
    <button class="action" id="btn-supprimer" disabled>Supprimer le fil</button>
    <button class="action" id="btn-recommencer">Recommencer</button>
    <button class="action principal" id="btn-controler">Contrôler</button>
  </div>
</footer>

<div class="voile" id="voile"><div class="resultat" id="resultat"></div></div>
<div class="voile" id="petit-ecran"><div class="resultat">
  <h2>Écran trop petit</h2>
  <p>Sur un téléphone, les bornes sont trop petites pour être touchées du doigt.
     Utilisez une <b>tablette</b> ou un <b>ordinateur</b>.</p>
  <button class="action principal" id="btn-petit-ecran">Continuer quand même</button>
</div></div>

<script>window.CABLAGE_VERSION = '20260927-1212';</script>
<script src="exercices/index.js?v=20260927-1212"></script>
<script src="moteur/cablage.js?v=20260927-1212"></script>
<script src="moteur/tutoriel.js?v=20260927-1212"></script>
<script src="moteur/marque.js?v=20260927-1212" data-cartouche="Édu" data-licence="cc-by-nc-nd" data-prototype></script>
</body>
</html>
