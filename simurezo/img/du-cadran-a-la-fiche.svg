<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-cf" aria-describedby="d-cf" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t-cf">Du cadran à la fiche : chaque cadran donne une ligne de la fiche</title>
  <desc id="d-cf">À gauche, un manomètre basse pression à aiguille et un thermomètre pincé sur le tube d'aspiration d'un petit groupe de condensation. À droite, la fiche de mise en service à trois lignes. Une flèche en pointillé part du manomètre vers la ligne « Température d'évaporation » : moins dix degrés Celsius. Une deuxième part du thermomètre vers la ligne « Température d'aspiration » : moins trois degrés Celsius. Une troisième part de ces deux lignes vers la ligne « Surchauffe = T aspiration moins t évaporation » : sept kelvins, en orange. Dans l'animation, l'aiguille se pose, puis les trois flèches avancent l'une après l'autre et chaque valeur s'écrit. Le dessin reste ensuite complet.</desc>
  <style>
    .ti{font-size:22px;font-weight:bold;fill:#1b3a63}
    .lb{font-size:16px;fill:#10233c}
    .lg{font-size:16px;font-weight:bold;fill:#1b3a63}
    .fh{font-size:20px;font-weight:bold;fill:#1b3a63}
    .vv{font-size:28px;font-weight:bold;fill:#1b3a63}
    .v7{font-size:32px;font-weight:bold;fill:#ff6b35}
    .tr{stroke:#1b3a63;stroke-width:3;fill:none}
    .pt{stroke:#1b3a63;stroke-width:3;fill:none;stroke-dasharray:9 7;stroke-linecap:round}
    .hd{fill:#1b3a63}
    .aig{transform:rotate(10deg);transform-origin:110px 150px}
    .rev{stroke-dashoffset:0}
    .cl{transform-origin:420px 0}
    .a1{animation:aig 1.8s .3s ease-out backwards}
    .rev{animation:rev 1s linear backwards}
    .hd,.hd7{animation:ap .2s backwards}
    .cl{animation:ecrit .8s ease-out backwards}
    @keyframes aig{0%{transform:rotate(-135deg)}60%{transform:rotate(24deg)}80%{transform:rotate(2deg)}100%{transform:rotate(10deg)}}
    @keyframes rev{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes ap{from{opacity:0}to{opacity:1}}
    @keyframes ecrit{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion: reduce){.a1,.rev,.hd,.cl{animation:none!important}}
  </style>
  <defs>
    <mask id="m1" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="500"><path d="M175,150 H394" fill="none" stroke="#fff" stroke-width="14" pathLength="1" stroke-dasharray="1" class="rev" style="animation-delay:2.2s;animation-duration:1s"/></mask>
    <mask id="m2" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="500"><path d="M270,305 V250 H394" fill="none" stroke="#fff" stroke-width="14" pathLength="1" stroke-dasharray="1" class="rev" style="animation-delay:4.3s;animation-duration:1s"/></mask>
    <mask id="m3" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="500"><path d="M737,150 H772 V357 H752" fill="none" stroke="#fff" stroke-width="14" pathLength="1" stroke-dasharray="1" class="rev" style="animation-delay:6.4s;animation-duration:1s"/></mask>
    <mask id="m4" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="500"><path d="M737,250 H772" fill="none" stroke="#fff" stroke-width="14" pathLength="1" stroke-dasharray="1" class="rev" style="animation-delay:6.4s;animation-duration:1s"/></mask>
    <clipPath id="c1"><rect class="cl" x="420" y="150" width="200" height="45" style="animation-delay:3.3s;transform-origin:420px 150px"/></clipPath>
    <clipPath id="c2"><rect class="cl" x="420" y="250" width="200" height="45" style="animation-delay:5.4s;transform-origin:420px 250px"/></clipPath>
    <clipPath id="c3"><rect class="cl" x="420" y="362" width="200" height="46" style="animation-delay:7.5s;animation-duration:1.2s;transform-origin:420px 362px"/></clipPath>
  </defs>
  <rect width="800" height="500" fill="#fffdf8"/>
  <text class="ti" x="30" y="32">Du cadran à la fiche</text>

  <circle cx="110" cy="150" r="62" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
  <g stroke="#1b3a63" stroke-width="2"><line x1="76.1" y1="183.9" x2="69.7" y2="190.3"/><line x1="64.3" y1="164.8" x2="55.8" y2="167.6"/><line x1="62.6" y1="142.5" x2="53.7" y2="141.1"/><line x1="71.2" y1="121.8" x2="63.9" y2="116.5"/><line x1="88.2" y1="107.2" x2="84.1" y2="99.2"/><line x1="110.0" y1="102.0" x2="110.0" y2="93.0"/><line x1="131.8" y1="107.2" x2="135.9" y2="99.2"/><line x1="148.8" y1="121.8" x2="156.1" y2="116.5"/><line x1="157.4" y1="142.5" x2="166.3" y2="141.1"/><line x1="155.7" y1="164.8" x2="164.2" y2="167.6"/><line x1="143.9" y1="183.9" x2="150.3" y2="190.3"/></g>
  <text class="lg" x="110" y="196" text-anchor="middle">BP</text>
  <g class="aig a1"><line x1="110" y1="150" x2="110" y2="100" stroke="#1b3a63" stroke-width="4" stroke-linecap="round"/></g>
  <circle cx="110" cy="150" r="7" fill="#1b3a63"/>
  <text class="lg" x="110" y="240" text-anchor="middle">Manomètre basse pression</text>

  <rect x="40" y="330" width="170" height="70" rx="8" fill="#eef3f9" stroke="#1b3a63" stroke-width="3"/>
  <rect x="55" y="345" width="50" height="40" rx="6" fill="#fff" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="165" cy="365" r="22" fill="#fff" stroke="#1b3a63" stroke-width="2"/>
  <path d="M143,365 H187 M165,343 V387" stroke="#1b3a63" stroke-width="2"/>
  <path d="M210,365 H350" stroke="#1b3a63" stroke-width="8" stroke-linecap="round"/>
  <rect x="259" y="355" width="22" height="20" rx="3" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <rect x="265" y="305" width="10" height="52" rx="5" fill="#fff" stroke="#1b3a63" stroke-width="3"/>
  <path d="M270,357 V325" stroke="#1b3a63" stroke-width="4"/>
  <text class="lb" x="225" y="398">Thermomètre pincé</text>
  <text class="lb" x="225" y="420">sur l'aspiration</text>
  <text class="lg" x="40" y="446">Groupe de condensation</text>

  <rect x="400" y="60" width="345" height="370" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="3"/>
  <text class="fh" x="424" y="90">Fiche de mise en service</text>
  <rect x="410" y="105" width="325" height="90" rx="6" fill="#fff" stroke="#1b3a63" stroke-width="2"/>
  <text class="lb" x="424" y="133">Température d'évaporation</text>
  <text class="vv" x="424" y="178" clip-path="url(#c1)">−10 °C</text>
  <rect x="410" y="205" width="325" height="90" rx="6" fill="#fff" stroke="#1b3a63" stroke-width="2"/>
  <text class="lb" x="424" y="233">Température d'aspiration</text>
  <text class="vv" x="424" y="278" clip-path="url(#c2)">−3 °C</text>
  <rect x="410" y="305" width="325" height="105" rx="6" fill="#fff" stroke="#ff6b35" stroke-width="3"/>
  <text class="lb" x="424" y="331">Surchauffe =</text>
  <text class="lb" x="424" y="352">T aspiration − t évaporation</text>
  <text class="v7" x="424" y="398" clip-path="url(#c3)">7 K</text>

  <path class="pt" d="M175,150 H394" mask="url(#m1)"/>
  <polygon class="hd" points="408,150 394,142 394,158" style="animation-delay:3.2s"/>
  <path class="pt" d="M270,305 V250 H394" mask="url(#m2)"/>
  <polygon class="hd" points="408,250 394,242 394,258" style="animation-delay:5.3s"/>
  <path class="pt" d="M737,150 H772 V357 H752" mask="url(#m3)"/>
  <path class="pt" d="M737,250 H772" mask="url(#m4)"/>
  <polygon class="hd" points="738,357 752,349 752,365" style="animation-delay:7.4s"/>
</svg>
