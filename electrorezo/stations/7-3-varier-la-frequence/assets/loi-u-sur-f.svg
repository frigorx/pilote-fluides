<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230" role="img"
     aria-label="La loi U sur f : la tension monte avec la fréquence, de 0 volt à l’arrêt jusqu’à 400 volts à 50 hertz, avec un rapport constant de 8 volts par hertz ; au-delà de 50 hertz, la tension reste à 400 volts.">
<rect width="380" height="230" fill="#fffdf8"/>
<text x="190" y="22" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="14" font-weight="700" fill="#1b3a63">La loi U sur f : un rapport de 8</text>

<!-- les axes -->
<line x1="50" y1="190" x2="320" y2="190" stroke="#637285" stroke-width="1.5"/>
<line x1="50" y1="190" x2="50" y2="36" stroke="#637285" stroke-width="1.5"/>
<text x="326" y="194" font-family="Bitter,Georgia,serif" font-size="12" fill="#637285">f (Hz)</text>
<text x="50" y="30" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12" fill="#637285">U (V)</text>
<text x="46" y="114" text-anchor="end" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">200</text>
<text x="46" y="48" text-anchor="end" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">400</text>
<text x="140" y="206" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">25</text>
<text x="230" y="206" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">50</text>
<text x="320" y="206" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">75</text>

<!-- la loi : de (0 Hz, 0 V) à (50 Hz, 400 V), puis la tension plafonne -->
<polyline points="50,190 230,44 320,44" fill="none" stroke="#c9451a" stroke-width="3.5" stroke-linejoin="round"/>
<circle cx="86" cy="161" r="5" fill="#1b3a63"/>
<circle cx="140" cy="117" r="5" fill="#1b3a63"/>
<circle cx="230" cy="44" r="5" fill="#1b3a63"/>
<text x="98" y="176" font-family="Bitter,Georgia,serif" font-size="11" fill="#1b3a63">10 Hz : 80 V</text>
<text x="152" y="134" font-family="Bitter,Georgia,serif" font-size="11" fill="#1b3a63">25 Hz : 200 V</text>
<text x="244" y="68" font-family="Bitter,Georgia,serif" font-size="11" fill="#1b3a63">50 Hz : 400 V</text>
<text x="250" y="100" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">au-delà de 50 Hz,</text>
<text x="250" y="114" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">la tension ne monte plus</text>
</svg>
