<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img"
     aria-label="Le relais bistable : une première impulsion le fait basculer et il y reste ; l’impulsion suivante le ramène.">
<rect width="460" height="260" fill="#fffdf8"/>
<text x="230" y="28" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="15"
      font-weight="700" fill="#1b3a63">L’exception : le relais bistable</text>

<!-- première impulsion -->
<text x="115" y="58" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="13"
      font-weight="700" fill="#c9451a">une impulsion</text>
<path d="M60 70 L60 84 L100 84 L100 70 L170 70" fill="none" stroke="#c9451a" stroke-width="3"/>
<text x="115" y="106" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">on appuie, on relâche</text>

<!-- le cliquet, position 1 -->
<rect x="58" y="126" width="114" height="58" rx="5" fill="none" stroke="#1b3a63" stroke-width="2.5"/>
<polyline points="70,168 100,168 100,144 160,144" fill="none" stroke="#1e7e54" stroke-width="4" stroke-linejoin="round"/>
<circle cx="100" cy="156" r="4" fill="#1b3a63"/>
<text x="115" y="204" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="13"
      font-weight="700" fill="#1e7e54">il bascule</text>
<text x="115" y="226" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12" fill="#1b3a63">et il y reste,</text>
<text x="115" y="244" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12" fill="#1b3a63">sans être alimenté</text>

<line x1="230" y1="46" x2="230" y2="234" stroke="rgba(27,58,99,.18)" stroke-width="2" stroke-dasharray="6 6"/>

<!-- deuxième impulsion -->
<text x="345" y="58" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="13"
      font-weight="700" fill="#c9451a">l’impulsion suivante</text>
<path d="M290 70 L290 84 L330 84 L330 70 L400 70" fill="none" stroke="#c9451a" stroke-width="3"/>
<text x="345" y="106" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">le même bouton, le même geste</text>

<rect x="288" y="126" width="114" height="58" rx="5" fill="none" stroke="#1b3a63" stroke-width="2.5"/>
<polyline points="300,144 330,144 330,168 390,168" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round"/>
<circle cx="330" cy="156" r="4" fill="#1b3a63"/>
<text x="345" y="204" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="13"
      font-weight="700" fill="#c0392b">il revient</text>
<text x="345" y="226" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12" fill="#1b3a63">C’est ce qu’il y a</text>
<text x="345" y="244" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12" fill="#1b3a63">dans une cage d’escalier.</text>
</svg>
