<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" role="img"
     aria-label="À gauche, une fin de course à galet poussée par une came portée par un chariot. À droite, un voyant monté sur la porte d’armoire.">
<rect width="460" height="300" fill="#fffdf8"/>

<!-- fin de course -->
<text x="115" y="30" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="15"
      font-weight="700" fill="#1b3a63">La fin de course</text>

<!-- le chariot et sa came -->
<rect x="30" y="66" width="120" height="26" rx="4" fill="#c9d6e6" stroke="#1b3a63" stroke-width="2.5"/>
<text x="90" y="84" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12" fill="#1b3a63">la pièce mobile</text>
<path d="M150 92 L172 92 L182 112 L150 112 Z" fill="#8fa4bd" stroke="#1b3a63" stroke-width="2.5"/>
<text x="196" y="106" font-family="Bitter,Georgia,serif" font-size="12" fill="#637285">la came</text>
<path d="M36 50 L120 50" stroke="#c9451a" stroke-width="3"/>
<path d="M112 44 L122 50 L112 56" fill="none" stroke="#c9451a" stroke-width="3"/>
<text x="60" y="42" font-family="Bitter,Georgia,serif" font-size="12" fill="#c9451a">elle avance</text>

<!-- le galet -->
<circle cx="150" cy="140" r="15" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
<circle cx="150" cy="140" r="3" fill="#1b3a63"/>
<text x="176" y="144" font-family="Bitter,Georgia,serif" font-size="12" fill="#637285">le galet</text>

<!-- le corps de l'appareil -->
<rect x="60" y="164" width="140" height="86" rx="5" fill="none" stroke="#1b3a63" stroke-width="2.5"/>
<line x1="150" y1="155" x2="150" y2="164" stroke="#1b3a63" stroke-width="2.5"/>
<line x1="150" y1="180" x2="150" y2="206" stroke="#1b3a63" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="118" y1="206" x2="150" y2="206" stroke="#1b3a63" stroke-width="1.6" stroke-dasharray="5 4"/>

<!-- contact NF, fermé au repos -->
<line x1="100" y1="176" x2="100" y2="192" stroke="#1b3a63" stroke-width="3"/>
<polyline points="112,192 100,218 100,238" fill="none" stroke="#1b3a63" stroke-width="3" stroke-linejoin="round"/>
<line x1="100" y1="195" x2="112" y2="195" stroke="#1b3a63" stroke-width="3"/>
<text x="115" y="270" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12" fill="#637285">Elle dit à la commande :</text>
<text x="115" y="288" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12"
      font-weight="700" fill="#1b3a63">c’est arrivé au bout.</text>

<line x1="250" y1="46" x2="250" y2="270" stroke="rgba(27,58,99,.18)" stroke-width="2" stroke-dasharray="6 6"/>

<!-- voyant -->
<text x="356" y="30" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="15"
      font-weight="700" fill="#1b3a63">Le voyant</text>

<!-- porte d'armoire, vue en coupe -->
<rect x="280" y="70" width="14" height="180" fill="#c9d6e6" stroke="#1b3a63" stroke-width="2.5"/>
<text x="270" y="264" text-anchor="end" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">la porte</text>

<!-- la tête, côté opérateur -->
<path d="M280 122 A 18 22 0 0 0 280 166" fill="#1e7e54" stroke="#1b3a63" stroke-width="2.5"/>
<path d="M270 116 L262 106 M258 144 L268 144 M270 172 L262 182"
      stroke="#c9451a" stroke-width="2.5" stroke-linecap="round"/>
<text x="300" y="102" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12"
      font-weight="700" fill="#1b3a63">on le voit porte fermée</text>

<!-- le corps et la lampe, côté armoire -->
<rect x="294" y="124" width="46" height="40" rx="3" fill="none" stroke="#1b3a63" stroke-width="2.5"/>
<circle cx="317" cy="144" r="12" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.5"/>
<line x1="309" y1="136" x2="325" y2="152" stroke="#1b3a63" stroke-width="2"/>
<line x1="325" y1="136" x2="309" y2="152" stroke="#1b3a63" stroke-width="2"/>
<line x1="340" y1="134" x2="380" y2="134" stroke="#1b3a63" stroke-width="3"/>
<line x1="340" y1="154" x2="380" y2="154" stroke="#1b3a63" stroke-width="3"/>
<text x="388" y="138" font-family="Bitter,Georgia,serif" font-size="12" fill="#637285">deux fils</text>
<text x="388" y="158" font-family="Bitter,Georgia,serif" font-size="12" fill="#637285">et rien d’autre</text>

<text x="356" y="216" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12" fill="#637285">Il n’a aucun contact.</text>
<text x="356" y="236" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12"
      font-weight="700" fill="#1b3a63">Il informe, il ne commande rien.</text>
<text x="356" y="264" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12" fill="#c0392b">Jamais en série dans la chaîne.</text>
</svg>
