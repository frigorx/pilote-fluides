<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img"
     aria-label="Coupe d’un arrêt d’urgence. Au repos, la lame touche et le courant passe. Frappé, la tête s’enfonce, un cran la retient, et la liaison rigide arrache la lame : le courant est coupé.">
<rect width="520" height="340" fill="#fffdf8"/>

<!-- au repos -->
<text x="132" y="28" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="15"
      font-weight="700" fill="#1b3a63">Au repos</text>

<path d="M84 62 A 48 26 0 0 1 180 62 L180 70 L84 70 Z" fill="#c0392b" stroke="#1b3a63" stroke-width="2.5"/>
<rect x="122" y="70" width="20" height="34" fill="#c0392b" stroke="#1b3a63" stroke-width="2.5"/>
<rect x="72" y="104" width="120" height="13" rx="2" fill="#e8b93a" stroke="#1b3a63" stroke-width="2.5"/>
<text x="200" y="114" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">la face avant</text>

<!-- tige, ressort et cran -->
<rect x="126" y="117" width="12" height="46" fill="#8fa4bd" stroke="#1b3a63" stroke-width="2"/>
<path d="M118 122 L106 130 L118 138 L106 146 L118 154" fill="none" stroke="#c9451a" stroke-width="2.5"/>
<text x="98" y="136" text-anchor="end" font-family="Bitter,Georgia,serif" font-size="11" fill="#c9451a">ressort</text>
<path d="M138 140 L152 140" stroke="#1b3a63" stroke-width="2.5"/>
<text x="158" y="144" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">le cran, dégagé</text>

<!-- liaison rigide vers la lame -->
<line x1="132" y1="163" x2="132" y2="206" stroke="#1b3a63" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="104" y1="206" x2="132" y2="206" stroke="#1b3a63" stroke-width="2" stroke-dasharray="6 4"/>
<text x="140" y="210" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">liaison rigide</text>

<!-- le contact NF, fermé -->
<line x1="80" y1="188" x2="80" y2="214" stroke="#1b3a63" stroke-width="4"/>
<polyline points="104,214 80,262 80,292" fill="none" stroke="#1b3a63" stroke-width="4" stroke-linejoin="round"/>
<line x1="80" y1="218" x2="104" y2="218" stroke="#1b3a63" stroke-width="4"/>
<text x="52" y="252" text-anchor="end" font-family="Bitter,Georgia,serif" font-size="11" fill="#1b3a63">11 · 12</text>
<text x="132" y="318" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="14"
      font-weight="700" fill="#1e7e54">le courant passe</text>

<line x1="262" y1="44" x2="262" y2="300" stroke="rgba(27,58,99,.18)" stroke-width="2" stroke-dasharray="6 6"/>

<!-- frappé -->
<text x="392" y="28" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="15"
      font-weight="700" fill="#1b3a63">Frappé — et il reste enfoncé</text>

<path d="M344 86 A 48 26 0 0 1 440 86 L440 94 L344 94 Z" fill="#c0392b" stroke="#1b3a63" stroke-width="2.5"/>
<rect x="382" y="94" width="20" height="10" fill="#c0392b" stroke="#1b3a63" stroke-width="2.5"/>
<rect x="332" y="104" width="120" height="13" rx="2" fill="#e8b93a" stroke="#1b3a63" stroke-width="2.5"/>

<rect x="386" y="117" width="12" height="46" fill="#8fa4bd" stroke="#1b3a63" stroke-width="2"/>
<path d="M378 122 L368 127 L378 132 L368 137 L378 142" fill="none" stroke="#c9451a" stroke-width="2.5"/>
<text x="360" y="162" text-anchor="end" font-family="Bitter,Georgia,serif" font-size="11" fill="#c9451a">comprimé</text>
<path d="M398 128 L414 128 L414 140" fill="none" stroke="#c9451a" stroke-width="3.5"/>
<text x="420" y="132" font-family="Bitter,Georgia,serif" font-size="11" font-weight="700" fill="#c9451a">le cran a mordu</text>

<line x1="392" y1="163" x2="392" y2="206" stroke="#1b3a63" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="364" y1="206" x2="392" y2="206" stroke="#1b3a63" stroke-width="2" stroke-dasharray="6 4"/>

<line x1="340" y1="188" x2="340" y2="214" stroke="#1b3a63" stroke-width="4"/>
<polyline points="364,214 340,262 340,292" fill="none" stroke="#1b3a63" stroke-width="4" stroke-linejoin="round"/>
<text x="312" y="252" text-anchor="end" font-family="Bitter,Georgia,serif" font-size="11" fill="#1b3a63">11 · 12</text>
<text x="392" y="318" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="14"
      font-weight="700" fill="#c0392b">le courant est coupé</text>
</svg>
