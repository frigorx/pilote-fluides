<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img"
     aria-label="Le gradateur : un triac monté en série sur la phase. Une impulsion le ferme au milieu de l’alternance, et le passage du courant par zéro le rouvre tout seul.">
<rect width="520" height="300" fill="#fffdf8"/>
<text x="260" y="30" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="15"
      font-weight="700" fill="#1b3a63">Un interrupteur qu’on ferme, et qui s’ouvre tout seul</text>

<!-- le circuit -->
<line x1="40" y1="86" x2="176" y2="86" stroke="#c9451a" stroke-width="4"/>
<text x="40" y="74" font-family="Bitter,Georgia,serif" font-size="13" font-weight="700" fill="#c9451a">Ph</text>

<rect x="176" y="62" width="72" height="48" rx="4" fill="none" stroke="#1b3a63" stroke-width="3"/>
<polygon points="192,72 214,86 192,100" fill="none" stroke="#1b3a63" stroke-width="2.5"/>
<polygon points="232,72 210,86 232,100" fill="none" stroke="#1b3a63" stroke-width="2.5"/>
<text x="212" y="128" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12"
      font-weight="700" fill="#1b3a63">le triac</text>
<line x1="212" y1="110" x2="212" y2="150" stroke="#637285" stroke-width="2" stroke-dasharray="5 4"/>
<text x="222" y="156" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">la commande, une impulsion par alternance</text>

<line x1="248" y1="86" x2="352" y2="86" stroke="#c9451a" stroke-width="4"/>
<rect x="352" y="58" width="72" height="56" rx="5" fill="none" stroke="#1b3a63" stroke-width="3"/>
<text x="388" y="92" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12" fill="#1b3a63">la charge</text>
<line x1="424" y1="86" x2="480" y2="86" stroke="#3d7fca" stroke-width="4"/>
<text x="480" y="74" text-anchor="end" font-family="Bitter,Georgia,serif" font-size="13" font-weight="700" fill="#3d7fca">N</text>

<!-- l'onde, en dessous -->
<line x1="60" y1="222" x2="470" y2="222" stroke="#637285" stroke-width="1.5"/>
<path d="M60 222 Q77 178 94 222 Q111 266 128 222" fill="none" stroke="rgba(27,58,99,.22)" stroke-width="2.5"/>
<path d="M128 222 Q145 178 162 222 Q179 266 196 222" fill="none" stroke="rgba(27,58,99,.22)" stroke-width="2.5"/>

<path d="M94 222 L94 222 Q105 194 111 222" fill="none" stroke="#c9451a" stroke-width="3.5"/>
<path d="M162 222 Q173 250 179 222" fill="none" stroke="#c9451a" stroke-width="3.5"/>
<path d="M60 222 L77 222" stroke="#c9451a" stroke-width="3.5"/>
<path d="M77 222 Q86 196 94 222" fill="none" stroke="#c9451a" stroke-width="3.5"/>
<path d="M128 222 L145 222" stroke="#c9451a" stroke-width="3.5"/>
<path d="M145 222 Q154 248 162 222" fill="none" stroke="#c9451a" stroke-width="3.5"/>

<line x1="77" y1="200" x2="77" y2="240" stroke="#1e7e54" stroke-width="2.5"/>
<text x="77" y="256" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="10" fill="#1e7e54">on ferme</text>
<line x1="94" y1="200" x2="94" y2="240" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="102" y="272" font-family="Bitter,Georgia,serif" font-size="10" fill="#c0392b">le zéro le rouvre</text>

<text x="330" y="204" font-family="Bitter,Georgia,serif" font-size="12.5" fill="#637285">en gris, l’onde du réseau</text>
<text x="330" y="224" font-family="Bitter,Georgia,serif" font-size="12.5" font-weight="700" fill="#c9451a">en orange, ce qui passe vraiment</text>
<text x="330" y="248" font-family="Bitter,Georgia,serif" font-size="12.5" fill="#637285">La hauteur ne change pas.</text>
<text x="330" y="268" font-family="Bitter,Georgia,serif" font-size="12.5" fill="#637285">La durée, oui.</text>
</svg>
