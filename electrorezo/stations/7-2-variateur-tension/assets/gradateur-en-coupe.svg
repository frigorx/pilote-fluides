<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img"
     aria-label="Le gradateur : un triac monté en série sur la phase. Une impulsion le ferme peu après le début de l’alternance, et le passage du courant par zéro le rouvre tout seul.">
<rect width="520" height="300" fill="#fffdf8"/>
<text x="260" y="30" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="15"
      font-weight="700" fill="#1b3a63">Un interrupteur qu’on ferme, et qui s’ouvre tout seul</text>

<!-- le circuit -->
<line x1="40" y1="86" x2="176" y2="86" stroke="#c0392b" stroke-width="4"/>
<text x="40" y="74" font-family="Bitter,Georgia,serif" font-size="13" font-weight="700" fill="#c0392b">Ph</text>

<!-- le triac : symbole de la bibliothèque (395_electronics_semiconductors/13_thyristors/triac.svg), tourné d'un quart de tour, jamais redessiné -->
<g transform="translate(212 86) rotate(-90) scale(1.8)" fill="none" stroke="#1b3a63" stroke-width="1.6" stroke-linejoin="round">
  <line x1="0" y1="-5" x2="0" y2="-20"/>
  <line x1="0" y1="5" x2="0" y2="20"/>
  <polyline points="-0.5,5.5 -4,10 -10,10"/>
  <line x1="8" y1="5" x2="-8" y2="5"/>
  <polygon points="-1,-5 4,5 9,-5"/>
  <line x1="-8" y1="-5" x2="8" y2="-5"/>
  <polygon points="-4,-5 -9,5 1,5"/>
</g>
<text x="212" y="56" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12"
      font-weight="700" fill="#1b3a63">le triac</text>
<line x1="230" y1="104" x2="230" y2="150" stroke="#637285" stroke-width="2" stroke-dasharray="5 4"/>
<text x="240" y="156" font-family="Bitter,Georgia,serif" font-size="11" fill="#637285">la commande, une impulsion par alternance</text>

<line x1="248" y1="86" x2="352" y2="86" stroke="#c0392b" stroke-width="4"/>
<rect x="352" y="58" width="72" height="56" rx="5" fill="none" stroke="#1b3a63" stroke-width="3"/>
<text x="388" y="92" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="12" fill="#1b3a63">la charge</text>
<line x1="424" y1="86" x2="480" y2="86" stroke="#3d7fca" stroke-width="4"/>
<text x="480" y="74" text-anchor="end" font-family="Bitter,Georgia,serif" font-size="13" font-weight="700" fill="#3d7fca">N</text>

