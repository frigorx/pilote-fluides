<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="../moteur/animations.js?v=c71a0f27da"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ÉlectroRézo — le réseau de l’électrotechnique</title>
<meta name="description" content="ÉlectroRézo : un coin d’atelier en 3D — l’armoire, le moteur, l’établi. Cliquez sur ce que vous reconnaissez, ses stations s’ouvrent.">
<link rel="canonical" href="https://inerweb.fr/electrorezo/">
<link rel="stylesheet" href="stations/_commun/station.css">
<style>
/* la page d'entrée : l'armoire en 3D, la fiche de la zone choisie, la carte du réseau qui s'allume */
.entete-armoire{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.55rem 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.entete-armoire .marque{font-weight:800;color:var(--navy);text-decoration:none}
.entete-armoire .marque span{background:#e8913a;color:#fff;border-radius:8px;padding:.05rem .45rem;margin-left:.3rem;font-size:.85em}
.entete-armoire h1{font-size:1.15rem;margin:0;color:var(--navy)}
.vues{margin-left:auto;display:flex;border:2px solid var(--navy);border-radius:12px;overflow:hidden}
.vues a{padding:.4rem .9rem;font-weight:700;color:var(--navy);text-decoration:none;background:var(--paper)}
.vues a[aria-current]{background:var(--navy);color:#fff}
.page-armoire{max-width:1600px;margin:.7rem auto 1.5rem;padding:0 16px;display:grid;grid-template-columns:1fr;gap:.9rem;align-items:start}
/* grand écran : la 3D reste à l'écran pendant qu'on parcourt la fiche et la carte (le survol de la carte l'allume) */
@media (min-width:1200px){
  .page-armoire{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .col-3d{position:sticky;top:.5rem}
  .page-armoire .e3d{grid-template-columns:1fr}
  .page-armoire .e3d-cote{display:none}
  .page-armoire .e3d-scene{max-height:calc(100vh - 330px);min-height:300px}
}
.page-armoire .e3d-bt-ralenti{display:none}
.fiche{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem}
.fiche h2{margin:.1rem 0 .2rem;color:var(--navy);font-size:1.2rem}
.fiche .ou{color:var(--muted);margin:.4rem 0 0;font-size:.92em}
.fiche .phrase{margin:.2rem 0 .6rem}
.fiche .retour{background:none;border:0;padding:0;min-height:0;color:var(--navy);font:inherit;font-size:.92em;text-decoration:underline;cursor:pointer}
.fiche .commencer{display:block;text-align:center;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:.55rem .8rem;margin:.4rem 0 .7rem}
.fiche ol{margin:0;padding-left:0;list-style:none}
.fiche li{border-top:1px solid var(--line);padding:.35rem 0}
.fiche li a{color:var(--ink);text-decoration:none}.fiche li a:hover{text-decoration:underline}
.fiche li b{color:var(--navy);display:inline-block;min-width:2.6em}
.fiche li.renvoi a{color:var(--muted)}.fiche li i{color:var(--muted);font-size:.88em}
.zones-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 1rem}
.zones-liste button{display:flex;gap:.5rem;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:.4rem 0;font:inherit;color:var(--ink);min-height:0}
.zones-liste button:hover{color:var(--navy);font-weight:700}
.zones-liste button span{background:var(--navy);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:grid;place-items:center;font-size:.8em;font-weight:700;flex:none}
/* la carte du réseau : la zone choisie s'y allume */
.fiche{margin-top:.9rem}
.carte-armoire{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:.6rem .8rem}
.carte-tete{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.carte-tete h2{font-size:1.05rem;margin:0;color:var(--navy)}
.carte-tete p{margin:0;color:var(--muted);font-size:.9em;flex:1}
.carte-tete button{min-height:36px;padding:.25rem .7rem}
#carte svg{display:block;width:100%;height:auto;margin-top:.4rem;border-radius:12px}
#carte svg a, #carte svg path{transition:opacity .35s}
#carte svg.filtre a{opacity:.18}
#carte svg.filtre path[stroke-width="9"]{opacity:.18}
#carte svg.filtre path.vive{opacity:1}
#carte svg.filtre a.aussi{opacity:.6}
#carte svg.filtre a.allume{opacity:1}
#carte svg a.allume circle:not(.cible){stroke:#c2410c;stroke-width:7;r:14}
#carte svg a.allume text{font-weight:800}
</style>
<script defer src="../moteur/retour-accueil.js?v=3c25e82f03" data-reseau-href="electrorezo/index.html" data-reseau-nom="⚡ ÉlectroRézo"></script>
</head>
<body>
<header class="entete-armoire">
  <a class="marque" href="index.html">inerWeb<span>ÉlectroRézo</span></a>
  <h1>Le réseau de l’électrotechnique</h1>
  <nav class="vues" aria-label="Trois entrées dans le réseau">
    <a href="armoire.html" aria-current="page">L’armoire</a>
    <a href="carte-reseau.html">La carte en grand</a>
    <a href="lignes.html">Les 8 lignes</a>
  </nav>
</header>

<main class="page-armoire">
  <div class="col-3d">
    <electro-3d id="armoire" modele="armoire" mode="decouvrir"></electro-3d>
  </div>
  <div class="col-droite">
    <section class="carte-armoire" aria-label="La carte du réseau">
      <div class="carte-tete"><h2>Sur la carte du réseau</h2>
        <p id="carteNote">Choisissez une zone : ses stations s’allument ici, avec leurs lignes.</p>
        <button type="button" id="toute">Toute la carte</button></div>
      <div id="carte"></div>
    </section>
    <aside class="fiche" id="fiche" aria-live="polite"></aside>
  </div>
</main>

<script src="assets/armoire-zones.js"></script>
<script src="assets/armoire-carte.js"></script>
<script src="stations/_commun/3d/electro3d.js"></script>
<script>
(() => {
  const Z = window.ZONES_ARMOIRE || [], e = document.getElementById('armoire'), fiche = document.getElementById('fiche');
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const lien = s => s.ailleurs ? s.ailleurs.url : s.url;
  const allumer3d = id => { if (e.survoler) e.survoler(id); };

  /* choisir une zone : par la 3D si elle est là (elle renvoie e3d-choix), sinon directement */
  const choisir = id => {
    if (!e.hidden && e._pieces) e.choisir(id);
    else { montrer(id, true); allumer(Z.find(x => x.id === id)); }
  };

  /* la fiche au repos : les quatorze zones en boutons (la seule porte si la 3D manque) */
  function accueil() {
    fiche.innerHTML = '<h2>Un coin d’atelier</h2>' +
      '<p class="phrase">Cliquez sur ce que vous reconnaissez dans la 3D, sur une zone ci-dessous, ou survolez une station de la carte : sa zone s’allume dans l’armoire.</p>' +
      '<div class="zones-liste"></div>' +
      '<p class="ou">Chaque appareil se manipule en détail dans sa station. La <a href="carte-reseau.html">carte du réseau</a> reste l’autre entrée.</p>';
    const r = fiche.querySelector('.zones-liste');
    Z.forEach((z, i) => {
      const b = document.createElement('button'); b.type = 'button';
      b.innerHTML = '<span>' + (i + 1) + '</span>' + esc(z.nom);
      b.addEventListener('click', () => choisir(z.id));
      b.addEventListener('pointerenter', () => allumer3d(z.id));
      b.addEventListener('pointerleave', () => allumer3d(null));
      r.appendChild(b);
    });
  }

  function montrer(id, defiler) {
    const z = Z.find(x => x.id === id);
    if (!z) { accueil(); return; }
    const n = Z.indexOf(z) + 1, premiere = z.stations.find(s => !s.renvoi);
    fiche.innerHTML = '<button type="button" class="retour">← Toutes les zones</button>' +
      '<h2>' + n + ' · ' + esc(z.nom) + '</h2><p class="ou">' + esc(z.ou) + '</p><p class="phrase">' + esc(z.phrase) + '</p>' +
      '<a class="commencer" href="' + lien(premiere) + '">Commencer par ' + premiere.id + ' · ' + esc(premiere.titre) + '</a>' +
      '<ol>' + z.stations.map(s => '<li class="' + (s.renvoi ? 'renvoi' : '') + '"><a href="' + lien(s) + '"><b>' + s.id + '</b>' + esc(s.titre) + '</a>' +
        (s.renvoi ? ' <i>— aussi ailleurs</i>' : '') + (s.ailleurs ? ' <i>→ ' + esc(s.ailleurs.titre) + '</i>' : '') + '</li>').join('') + '</ol>';
    fiche.querySelector('.retour').addEventListener('click', () => choisir(null));
    if (defiler && innerWidth < 1200) fiche.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------- la carte : les stations de la zone s'allument, la vue se resserre sur elles ---------- */
  const hote = document.getElementById('carte'), note = document.getElementById('carteNote');
  hote.innerHTML = window.CARTE_SVG || '';
  const svg = hote.querySelector('svg');
  const TOUT = [0, 0, 1800, 1200];
  let vb = TOUT.slice(), anim = 0;
  const lignes = svg ? [...svg.querySelectorAll('path[stroke-width="9"]')] : [];   /* dans l'ordre : lignes 1 à 8 */
  const noeuds = svg ? [...svg.querySelectorAll('a')] : [];
  if (svg) { svg.removeAttribute('width'); svg.removeAttribute('height'); }
  const poser = v => { vb = v; svg.setAttribute('viewBox', v.map(x => x.toFixed(1)).join(' ')); };
  const viser = cible => {
    if (!svg) return;
    cancelAnimationFrame(anim);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { poser(cible); return; }
    const de = vb.slice(), t0 = performance.now();
    const pas = t => { const k = Math.min(1, (t - t0) / 450), e2 = k * (2 - k); poser(de.map((x, i) => x + (cible[i] - x) * e2)); if (k < 1) anim = requestAnimationFrame(pas); };
    anim = requestAnimationFrame(pas);
  };
  function allumer(z) {
    if (!svg) return;
    svg.classList.toggle('filtre', !!z);
    noeuds.forEach(a => a.classList.remove('allume', 'aussi'));
    lignes.forEach(p => p.classList.remove('vive'));
    if (!z) { note.textContent = 'Choisissez une zone : ses stations s’allument ici, avec leurs lignes.'; viser(TOUT); return; }
    const pts = [];
    z.stations.forEach(s => {
      const a = noeuds.find(n => n.getAttribute('href') === s.url); if (!a) return;
      a.classList.add(s.renvoi ? 'aussi' : 'allume');
      const l = lignes[+s.id.split('.')[0] - 1]; if (l && !s.renvoi) l.classList.add('vive');
      const c = a.querySelector('circle'); if (!s.renvoi) pts.push([+c.getAttribute('cx'), +c.getAttribute('cy')]);
    });
    const lg = new Set(z.stations.filter(s => !s.renvoi).map(s => s.id.split('.')[0]));
    note.textContent = z.nom + ' : ' + z.stations.filter(s => !s.renvoi).length + ' stations, sur ' + (lg.size > 1 ? lg.size + ' lignes' : 'la ligne ' + [...lg][0]) + '.';
    if (!pts.length) return;
    /* le cadre : les stations allumées, avec leurs noms (au-dessus du rond), au format de la carte */
    let x0 = Math.min(...pts.map(p => p[0])) - 160, x1 = Math.max(...pts.map(p => p[0])) + 160;
    let y0 = Math.min(...pts.map(p => p[1])) - 110, y1 = Math.max(...pts.map(p => p[1])) + 80;
    let w = Math.max(x1 - x0, 720), h = Math.max(y1 - y0, 480);
    if (w / h > 1.5) h = w / 1.5; else w = h * 1.5;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    w = Math.min(w, 1800); h = Math.min(h, 1200);
    viser([Math.max(0, Math.min(1800 - w, cx - w / 2)), Math.max(0, Math.min(1200 - h, cy - h / 2)), w, h]);
  }
  document.getElementById('toute').addEventListener('click', () => viser(TOUT));

  /* le sens inverse : survoler une station de la carte allume sa zone dans la 3D */
  const zoneDe = {};
  Z.forEach(z => z.stations.forEach(s => { if (!s.renvoi) zoneDe[s.url] = z; }));
  noeuds.forEach(a => {
    const z = zoneDe[a.getAttribute('href')]; if (!z) return;
    const titre = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    titre.textContent = a.getAttribute('aria-label') + ' — dans l’armoire : ' + z.nom;
    a.appendChild(titre);
    const on = () => { allumer3d(z.id); note.textContent = a.getAttribute('aria-label') + ' : dans l’armoire, ' + z.nom.charAt(0).toLowerCase() + z.nom.slice(1) + '.'; };
    a.addEventListener('pointerenter', on); a.addEventListener('focus', on);
    a.addEventListener('pointerleave', () => allumer3d(null)); a.addEventListener('blur', () => allumer3d(null));
  });

  e.addEventListener('e3d-choix', ev => { montrer(ev.detail.id, true); allumer(Z.find(x => x.id === ev.detail.id)); });
  /* sans WebGL ou sans réseau : la 3D se retire, la liste des zones reste la porte */
  e.addEventListener('e3d-repli', () => { e.hidden = true; });
  accueil();
})();
</script>
<script src="assets/marque.js" data-cartouche="ÉlectroRézo" data-licence="cc-by-nc-nd" data-prototype defer></script>
</body>
</html>
