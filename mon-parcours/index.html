<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mon parcours inerWeb</title>
<style>
  :root {
    --navy: #1b3a63; --ink: #10233c; --muted: #637285; --cream: #f7f1e7; --paper: #fffdf8;
    --blue: #3d7fca; --blue-soft: #84b7ec; --orange-deep: #c9451a; --logo: #e8914a;
    --vert: #1e7e54; --vert-f: #e3f5ec; --ambre: #b06a00; --ambre-f: #fff4e0;
    --ombre: 0 2px 10px rgba(27,58,99,.10);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink);
    font: 17px/1.55 Calibri, "Segoe UI", system-ui, Arial, sans-serif; }
  h1, h2, h3, h4 { font-family: "Trebuchet MS", Calibri, Arial, sans-serif; color: var(--navy); margin: 0; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; position: relative; }
  .tete h1 { font-size: 32px; letter-spacing: -.015em; }
  .tete p { margin: 6px 0 0; font-size: 19px; max-width: 760px; }
  .etape { margin-top: 28px; }
  .etape h2 { font-size: 21px; display: flex; gap: 10px; align-items: center; }
  .num { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 999px;
    background: var(--navy); color: #fff; font-size: 16px; flex: none; }
  .choix { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .choix button { font: inherit; text-align: left; cursor: pointer; background: var(--paper);
    border: 2px solid #d9dfe7; border-radius: 14px; padding: 14px 18px; box-shadow: var(--ombre);
    color: var(--ink); min-width: 230px; flex: 1 1 230px; max-width: 340px; }
  .choix button strong { display: block; font-family: "Trebuchet MS", Calibri, sans-serif; color: var(--navy); font-size: 19px; }
  .choix button span { color: var(--muted); font-size: 16px; }
  .choix button:hover { border-color: var(--blue-soft); }
  .choix button[aria-pressed="true"] { border-color: var(--blue); background: #eef5fd; outline: 3px solid var(--blue-soft); }
  .choix button:focus-visible, .vue button:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  #resultat { margin-top: 32px; position: relative; }
  .bandeau { background: var(--paper); border: 2px solid var(--navy); border-radius: 14px; padding: 16px 20px;
    box-shadow: var(--ombre); position: relative; z-index: 1; }
  .bandeau h2 { font-size: 24px; }
  .bandeau .rncp { color: var(--muted); font-size: 16px; }
  .bandeau .chiffres { margin: 8px 0 0; font-size: 18px; }
  .vue { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .vue button { font: inherit; font-size: 16px; cursor: pointer; border-radius: 999px; padding: 6px 16px;
    border: 2px solid var(--navy); background: var(--paper); color: var(--navy); }
  .vue button[aria-pressed="true"] { background: var(--navy); color: #fff; }
  .sommaire { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; padding: 0; list-style: none; position: relative; z-index: 1; }
  .sommaire button { font: inherit; font-size: 16px; cursor: pointer; padding: 5px 13px; border-radius: 999px;
    background: var(--paper); border: 1px solid #c9d3df; color: var(--navy); }
  .sommaire button .n { color: var(--muted); }
  .sommaire button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .sommaire button[aria-pressed="true"] .n { color: #dbe6f3; }
  .plus, .suivante { font: inherit; cursor: pointer; margin-top: 10px; border-radius: 999px; padding: 6px 16px;
    border: 2px solid var(--blue); background: var(--paper); color: #2a5d96; }
  .suivante { display: block; margin-top: 28px; background: var(--navy); border-color: var(--navy); color: #fff; text-align: left; }
  .groupe { margin-top: 30px; position: relative; z-index: 1; scroll-margin-top: 12px; }
  .groupe > h3 { font-size: 22px; border-bottom: 2px solid var(--navy); padding-bottom: 4px; }
  .groupe > h3 .c { color: var(--muted); font-weight: normal; margin-right: 6px; }
  .code { margin-top: 18px; }
  .code h4 { font-size: 18px; }
  .code h4 .c { display: inline-block; min-width: 54px; margin-right: 10px; color: var(--orange-deep); }
  .code.parent h4 { font-size: 19px; border-bottom: 1px solid #c9d3df; padding-bottom: 2px; }
  .vide { margin: 6px 0 0; color: var(--muted); font-style: italic; }
  .cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; margin-top: 8px; }
  .carte { display: block; text-decoration: none; color: var(--ink); background: rgba(255,253,248,.9);
    border: 1px solid #c9d3df; border-left: 5px solid var(--vert); border-radius: 14px; padding: 10px 14px; box-shadow: var(--ombre); }
  .carte:hover { border-color: var(--blue); border-left-color: var(--vert); }
  .carte.appui { border-left: 5px dashed var(--blue-soft); }
  .carte[hidden] { display: none; }
  .carte .tc { display: block; font-size: 15px; margin-top: 4px; color: var(--ink); }
  .carte .tc b { color: var(--navy); font-weight: bold; }
  abbr[title] { text-decoration: underline dotted #9aa7b6; cursor: help; }
  .vue.mode { margin-top: 14px; padding-top: 12px; border-top: 1px solid #d9dfe7; }
  .bilan { margin: 16px 0 0; font-size: 17px; position: relative; z-index: 1; }
  .legende { font-size: 15px; color: var(--muted); position: relative; z-index: 1; }
  .defile { overflow-x: auto; margin-top: 10px; position: relative; z-index: 1; background: rgba(255,253,248,.92);
    border: 1px solid #c9d3df; border-radius: 14px; box-shadow: var(--ombre); }
  table.croise { border-collapse: collapse; font-size: 15px; min-width: 100%; }
  .croise th, .croise td { border-bottom: 1px solid #e3e8ef; padding: 6px 8px; text-align: left; vertical-align: top; }
  .croise thead th { position: sticky; top: 0; background: #eef3f9; color: var(--navy); white-space: nowrap; }
  .croise tbody th { font-weight: normal; min-width: 220px; position: sticky; left: 0; background: var(--paper); }
  .croise .coin { left: 0; z-index: 2; }
  .code-l { font-weight: bold; color: var(--orange-deep); white-space: nowrap; }
  .cel { display: inline-block; min-width: 34px; text-align: center; border-radius: 8px; padding: 2px 6px; font: inherit; font-weight: bold; }
  button.cel { cursor: pointer; }
  .cel.ok { background: var(--vert-f); color: var(--vert); border: 1px solid var(--vert); }
  .cel.trou { background: var(--ambre-f); color: var(--ambre); border: 2px dashed var(--ambre); }
  .cel.hors { color: #b8c2ce; font-weight: normal; }
  td.cel.hors { display: table-cell; }
  .mot-trou { color: var(--ambre); font-size: 14px; }
  .tri { font: inherit; font-weight: bold; color: var(--navy); background: none; border: 0; cursor: pointer; padding: 0; text-decoration: underline dotted; }
  .detail { position: relative; z-index: 1; margin-top: 20px; scroll-margin-top: 12px; }
  .detail h3 { font-size: 19px; }
  .carte .t { display: block; font-weight: bold; color: var(--navy); }
  .carte .p { display: block; font-size: 15.5px; margin-top: 2px; }
  .carte .m { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 14.5px; color: var(--muted); }
  .badge { border-radius: 999px; padding: 0 9px; font-size: 14px; }
  .badge.enseigne { background: var(--vert-f); color: var(--vert); }
  .badge.appui { background: #eef5fd; color: #2a5d96; }
  .badge.brouillon { background: var(--ambre-f); color: var(--ambre); border: 1px dashed var(--ambre); }
  .note { margin-top: 36px; font-size: 15.5px; color: var(--muted); position: relative; z-index: 1; }
  /* R9 : le filigrane vit DANS le contenu du parcours, derrière les cartes. */
  .filigrane { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .filigrane svg { position: absolute; width: min(520px, 80%); opacity: .10; transform: translateX(-50%) rotate(-10deg); left: 50%; }
  @media (max-width: 600px) {
    .tete h1 { font-size: 26px; }
    .choix button { max-width: none; }
    .cartes { grid-template-columns: 1fr; }
  }
  @media print { .choix, .vue, .sommaire { display: none; } .etape { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<main>
  <header class="tete">
    <h1>Mon parcours inerWeb</h1>
    <p>Choisissez votre niveau, puis votre diplôme. Vous voyez les stations inerWeb qui vous servent, rangées dans l'ordre de votre référentiel.</p>
  </header>

  <section class="etape" aria-labelledby="t-niveau">
    <h2 id="t-niveau"><span class="num">1</span> Mon niveau</h2>
    <div class="choix" id="niveaux"></div>
  </section>

  <section class="etape" aria-labelledby="t-diplome" id="etape-diplome" hidden>
    <h2 id="t-diplome"><span class="num">2</span> Mon diplôme</h2>
    <div class="choix" id="diplomes"></div>
  </section>

  <section id="resultat" aria-live="polite" hidden></section>
</main>

<script src="donnees-parcours.js?v=20261022d"></script>
<script>
(function () {
  "use strict";
  var P = window.PARCOURS, S = P.stations;
  var NIVEAUX = {
    3: { titre: "Niveau 3", detail: "CAP, titre professionnel" },
    4: { titre: "Niveau 4", detail: "Bac pro, brevet professionnel" }
  };
  var etat = { niveau: null, diplome: null, vue: "coeur", partie: null, mode: "stations", tab: null, tri: null };

  function el(tag, attrs, enfants) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "texte") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (enfants || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function bouton(titre, detail, presse, action) {
    var b = el("button", { type: "button", "aria-pressed": presse ? "true" : "false" },
      [el("strong", { texte: titre }), el("span", { texte: detail })]);
    b.addEventListener("click", action);
    return b;
  }
  function stationsDe(d, vue) {
    var vues = {};
    d.groupes.forEach(function (g) { g.codes.forEach(function (c) {
      c.coeur.forEach(function (i) { vues[i] = 1; });
      if (vue === "tout") c.appui.forEach(function (i) { vues[i] = 1; });
    }); });
    return Object.keys(vues).length;
  }

  /* Le logo figé (charte § 3.4, version compacte) + « by inerweb.fr », pour le filigrane R9. */
  function logoSvg() {
    return '<svg viewBox="0 0 400 78" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<text x="4" y="40" font-size="28">❄️</text>' +
      '<text x="44" y="38" font-family="Trebuchet MS, sans-serif" font-weight="bold" font-size="26" fill="#1b3a63">iner</text>' +
      '<text x="94" y="38" font-family="Segoe Script, Brush Script MT, cursive" font-size="26" fill="#1b3a63">Web</text>' +
      '<line x1="44" y1="42" x2="160" y2="42" stroke="#e8914a" stroke-width="2"/>' +
      '<rect x="166" y="14" width="92" height="24" rx="5" fill="#e8914a"/>' +
      '<text x="212" y="31" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="14" fill="#fff">Parcours</text>' +
      '<text x="44" y="66" font-family="Segoe UI, sans-serif" font-size="16" fill="#1b3a63">by inerweb.fr</text></svg>';
  }

  function dessinerChoix() {
    var n = document.getElementById("niveaux"); n.innerHTML = "";
    Object.keys(NIVEAUX).forEach(function (k) {
      var nb = P.diplomes.filter(function (d) { return String(d.niveau) === k; }).length;
      n.appendChild(bouton(NIVEAUX[k].titre, NIVEAUX[k].detail + " · " + nb + (nb > 1 ? " diplômes" : " diplôme"),
        String(etat.niveau) === k, function () { etat.niveau = +k; etat.diplome = null; etat.partie = null; majAdresse(); rendre(); }));
    });
    var bloc = document.getElementById("etape-diplome"), dz = document.getElementById("diplomes");
    bloc.hidden = !etat.niveau; dz.innerHTML = "";
    P.diplomes.filter(function (d) { return d.niveau === etat.niveau; }).forEach(function (d) {
      dz.appendChild(bouton(d.court, d.rncp + " · " + stationsDe(d, "coeur") + " stations qui l'enseignent",
        etat.diplome === d.id, function () { etat.diplome = d.id; etat.partie = null; majAdresse(); rendre(); document.getElementById("resultat").scrollIntoView({ behavior: "smooth" }); }));
    });
  }

  function carte(i, d, c, force) {
    var s = S[i];
    var meta = el("span", { class: "m" }, [
      el("span", { class: "badge " + (force === "coeur" ? "enseigne" : "appui"), texte: force === "coeur" ? "enseigne" : "en appui" }),
      el("span", { texte: s.r }),
      s.b ? el("span", { class: "badge brouillon", texte: "brouillon, à relire" }) : null
    ]);
    return el("a", { class: "carte" + (force === "appui" ? " appui" : ""), href: s.u, target: "_blank", rel: "noopener" }, [
      el("span", { class: "t", texte: s.t }),
      c.pourquoi[i] ? el("span", { class: "p", texte: c.pourquoi[i] }) : null,
      ligneTC(d, i),
      meta
    ]);
  }

  /* Tâches et compétences de la station pour ce diplôme ; le libellé officiel s'affiche au survol. */
  function libelle(liste, code) { var x = liste.filter(function (k) { return k.code === code; })[0]; return x ? x.libelle : ""; }
  function codesAvecTitres(liste, codes) {
    return codes.map(function (c) { return '<abbr title="' + libelle(liste, c).replace(/"/g, "&quot;") + '">' + c + "</abbr>"; }).join(", ");
  }
  function ligneTC(d, i) {
    var x = d.tc[i]; if (!x) return null;
    var h = "";
    if (x[1].length) h += "<b>Tâches</b> " + codesAvecTitres(d.taches, x[1]) + " · ";
    h += "<b>Compétences</b> " + codesAvecTitres(d.competences, x[0]);
    return el("span", { class: "tc", html: h });
  }

  /* ---------- Le tableau croisé : ce qui est fait, ce qui manque ---------- */
  function ensemble(d, idx, code) {
    var n = []; for (var i in d.tc) if (d.tc[i][idx].indexOf(code) >= 0) n.push(+i); return n;
  }
  function feuillesSavoirs(d) {
    var tous = [];
    d.groupes.forEach(function (g) { g.codes.forEach(function (c) { if (/^S/.test(c.code)) tous.push(c); }); });
    return tous.filter(function (c) { return !tous.some(function (x) { return x.code.indexOf(c.code + ".") === 0; }); });
  }
  function dessinerTableau(r, d) {
    var aTaches = d.taches.length > 0, savoirs = feuillesSavoirs(d);
    var vues = (aTaches ? [["tc", "Tâches × compétences"]] : []).concat([["comp", "Par compétence"]])
      .concat(savoirs.length ? [["sav", "Par savoir"]] : []);
    if (!vues.some(function (v) { return v[0] === etat.tab; })) etat.tab = vues[0][0];

    // Les chiffres d'ensemble
    var compOk = d.competences.filter(function (c) { return ensemble(d, 0, c.code).length; }).length;
    var tachOk = d.taches.filter(function (t) { return ensemble(d, 1, t.code).length; }).length;
    var savOk = savoirs.filter(function (c) { return c.coeur.length; }).length;
    var cases = 0, casesOk = 0;
    d.taches.forEach(function (t) { d.competences.forEach(function (c) {
      if ((d.tachesDe[c.code] || []).indexOf(t.code) < 0) return;
      cases++; if (croise(d, t.code, c.code).length) casesOk++;
    }); });
    var bilan = "<strong>" + compOk + " compétences sur " + d.competences.length + "</strong> ont au moins une station";
    if (aTaches) bilan += " · <strong>" + tachOk + " tâches sur " + d.taches.length + "</strong> · <strong>" + casesOk + " cases sur " + cases + "</strong> du référentiel (tâche × compétence) couvertes";
    if (savoirs.length) bilan += " · <strong>" + savOk + " savoirs sur " + savoirs.length + "</strong> enseignés";
    r.appendChild(el("p", { class: "bilan", html: bilan + "." }));

    var bar = el("div", { class: "vue", role: "group", "aria-label": "Lecture du tableau" });
    vues.forEach(function (v) {
      var b = el("button", { type: "button", "aria-pressed": etat.tab === v[0] ? "true" : "false", texte: v[1] });
      b.addEventListener("click", function () { etat.tab = v[0]; etat.tri = null; etat.cas = null; majAdresse(); dessinerResultat(); });
      bar.appendChild(b);
    });
    r.appendChild(bar);
    r.appendChild(el("p", { class: "legende", html: "<span class=\"cel ok\">3</span> stations dans la case · " +
      "<span class=\"cel trou\">0</span> <b>trou</b> : le référentiel relie ces deux codes, aucune station encore · " +
      "<span class=\"cel hors\">·</span> case que le référentiel ne relie pas" }));

    var boite = el("div", { class: "defile" }), tab = el("table", { class: "croise" });
    boite.appendChild(tab); r.appendChild(boite);
    var detail = el("div", { class: "detail", id: "detail-case" }); r.appendChild(detail);

    if (etat.tab === "tc") {
      var tete = "<thead><tr><th class=\"coin\">Tâche \\ compétence</th>" + d.competences.map(function (c) {
        return '<th scope="col"><abbr title="' + c.libelle.replace(/"/g, "&quot;") + '">' + c.code + "</abbr></th>"; }).join("") + "</tr></thead>";
      var corps = d.taches.map(function (t) {
        return '<tr><th scope="row"><span class="code-l">' + t.code + "</span> " + t.libelle + "</th>" + d.competences.map(function (c) {
          var off = (d.tachesDe[c.code] || []).indexOf(t.code) >= 0, n = croise(d, t.code, c.code).length;
          // Hors matrice officielle : une station à 2 compétences y serait comptée par ricochet ; on ne l'affiche pas.
          if (!off) return '<td class="cel hors">·</td>';
          return '<td><button type="button" class="cel ' + (n ? "ok" : "trou") + '" data-t="' + t.code + '" data-c="' + c.code + '" title="' +
            t.code + " × " + c.code + " : " + n + " station" + (n > 1 ? "s" : "") + (off ? "" : " (hors matrice officielle)") + '">' + n + "</button></td>";
        }).join("") + "</tr>";
      }).join("");
      tab.innerHTML = tete + "<tbody>" + corps + "</tbody>";
      tab.addEventListener("click", function (e) {
        var b = e.target.closest("button.cel"); if (!b) return;
        montrer(d, detail, b.dataset.t + " × " + b.dataset.c, croise(d, b.dataset.t, b.dataset.c));
      });
    } else {
      var lignes = etat.tab === "comp"
        ? d.competences.map(function (c) {
            var st = ensemble(d, 0, c.code), tt = {};
            st.forEach(function (i) { d.tc[i][1].forEach(function (t) { tt[t] = 1; }); });
            return { code: c.code, libelle: c.libelle, n: st.length, autre: Object.keys(tt).sort().join(", ") || "—", st: st };
          })
        : savoirs.map(function (c) { return { code: c.code, libelle: c.libelle, n: c.coeur.length, autre: c.appui.length, st: c.coeur }; });
      var t2 = etat.tab === "comp" ? (aTaches ? "Tâches où elle s'exerce" : "—") : "En appui";
      var tri = etat.tri || { col: "code", sens: 1 };
      lignes.sort(function (a, b) {
        var x = a[tri.col], y = b[tri.col];
        if (tri.col === "code") return tri.sens * String(x).localeCompare(String(y), "fr", { numeric: true });
        return tri.sens * ((+x || 0) - (+y || 0));
      });
      function th(col, nom) {
        var fl = tri.col === col ? (tri.sens > 0 ? " ▲" : " ▼") : "";
        return '<th scope="col"><button type="button" class="tri" data-col="' + col + '">' + nom + fl + "</button></th>";
      }
      tab.innerHTML = "<thead><tr>" + th("code", "Code") + "<th scope=\"col\">Libellé officiel</th>" + th("n", "Stations qui enseignent") +
        (etat.tab === "sav" ? th("autre", t2) : "<th scope=\"col\">" + t2 + "</th>") + "</tr></thead><tbody>" +
        lignes.map(function (l) {
          return "<tr><th scope=\"row\" class=\"code-l\">" + l.code + "</th><td>" + l.libelle + "</td><td>" +
            (l.n ? '<button type="button" class="cel ok" data-code="' + l.code + '">' + l.n + "</button>"
                 : '<span class="cel trou">0</span> <b class="mot-trou">trou</b>') + "</td><td>" + l.autre + "</td></tr>";
        }).join("") + "</tbody>";
      tab.addEventListener("click", function (e) {
        var s = e.target.closest("button.tri");
        if (s) { var c = s.dataset.col; etat.tri = { col: c, sens: tri.col === c ? -tri.sens : (c === "code" ? 1 : -1) }; dessinerResultat(); return; }
        var b = e.target.closest("button.cel"); if (!b) return;
        var l = lignes.filter(function (x) { return x.code === b.dataset.code; })[0];
        montrer(d, detail, l.code + " " + l.libelle, l.st);
      });
    }
  }
  function croise(d, t, c) {
    var n = []; for (var i in d.tc) if (d.tc[i][0].indexOf(c) >= 0 && d.tc[i][1].indexOf(t) >= 0) n.push(+i); return n;
  }
  function montrer(d, detail, titre, liste) {
    detail.innerHTML = "";
    detail.appendChild(el("h3", { texte: titre + " : " + liste.length + " station" + (liste.length > 1 ? "s" : "") }));
    var g = el("div", { class: "cartes" });
    liste.forEach(function (i) {
      var s = S[i];
      g.appendChild(el("a", { class: "carte", href: s.u, target: "_blank", rel: "noopener" }, [
        el("span", { class: "t", texte: s.t }), ligneTC(d, i),
        el("span", { class: "m" }, [el("span", { texte: s.r }), s.b ? el("span", { class: "badge brouillon", texte: "brouillon, à relire" }) : null])
      ]));
    });
    detail.appendChild(g);
    detail.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function dessinerResultat() {
    var r = document.getElementById("resultat"); r.innerHTML = "";
    var d = P.diplomes.filter(function (x) { return x.id === etat.diplome; })[0];
    r.hidden = !d; if (!d) return;
    var tout = etat.vue === "tout";

    var vue = el("div", { class: "vue", role: "group", "aria-label": "Ce que j'affiche" });
    [["coeur", "Ce qui m'enseigne"], ["tout", "Tout ce qui me sert"]].forEach(function (v) {
      var b = el("button", { type: "button", "aria-pressed": etat.vue === v[0] ? "true" : "false", texte: v[1] });
      b.addEventListener("click", function () { etat.vue = v[0]; majAdresse(); dessinerResultat(); });
      vue.appendChild(b);
    });
    // Deux lectures : les stations (l'élève) ou le tableau croisé (le professeur : fait / à faire).
    var mode = el("div", { class: "vue mode", role: "group", "aria-label": "Lecture" });
    [["stations", "📍 Mes stations"], ["tableau", "▦ Tableau croisé : fait et à faire"]].forEach(function (v) {
      var b = el("button", { type: "button", "aria-pressed": etat.mode === v[0] ? "true" : "false", texte: v[1] });
      b.addEventListener("click", function () { etat.mode = v[0]; majAdresse(); dessinerResultat(); });
      mode.appendChild(b);
    });
    r.appendChild(el("div", { class: "bandeau" }, [
      el("h2", { texte: d.nom }),
      el("div", { class: "rncp", texte: d.rncp + " · niveau " + d.niveau }),
      el("p", { class: "chiffres", html: "<strong>" + stationsDe(d, "coeur") + " stations</strong> enseignent un point de votre référentiel ; <strong>" +
        stationsDe(d, "tout") + "</strong> vous servent en tout." }),
      mode,
      etat.mode === "tableau" ? null : vue
    ]));
    if (etat.mode === "tableau") {
      dessinerTableau(r, d);
      r.appendChild(el("p", { class: "note", texte: "Tableau du " + P.date + " : il compte ce qu'inerWeb propose aujourd'hui. Une case « trou » est un point du référentiel qu'aucune station n'enseigne encore ; une partie se travaille en classe (communication, documents, anglais)." }));
      poserFiligrane(r);
      return;
    }

    // Une partie du référentiel à la fois : la page reste une carte, pas un pavé.
    function compte(g) {
      var n = {}; g.codes.forEach(function (c) { c.coeur.concat(tout ? c.appui : []).forEach(function (i) { n[i] = 1; }); });
      return Object.keys(n).length;
    }
    var partie = d.groupes.filter(function (g) { return g.code === etat.partie; })[0]
      || d.groupes.filter(function (g) { return compte(g); })[0] || d.groupes[0];
    var som = el("div", { class: "sommaire", role: "group", "aria-label": "Les parties de mon référentiel" });
    d.groupes.forEach(function (g) {
      var b = el("button", { type: "button", "aria-pressed": g === partie ? "true" : "false", title: g.libelle,
        html: g.code + " <span class=\"n\">(" + compte(g) + ")</span>" });
      b.addEventListener("click", function () { etat.partie = g.code; majAdresse(); dessinerResultat(); });
      som.appendChild(b);
    });
    r.appendChild(som);

    [partie].forEach(function (g) {
      var sec = el("section", { class: "groupe", id: "g-" + g.code }, [
        el("h3", { html: "<span class=\"c\">" + g.code + "</span>" }),
      ]);
      sec.firstChild.appendChild(document.createTextNode(g.libelle));
      g.codes.forEach(function (c) {
        var bloc = el("div", { class: "code" }, [el("h4", { html: "<span class=\"c\">" + c.code + "</span>" })]);
        bloc.firstChild.appendChild(document.createTextNode(c.libelle));
        var liste = c.coeur.map(function (i) { return [i, "coeur"]; })
          .concat(tout ? c.appui.map(function (i) { return [i, "appui"]; }) : []);
        // Un code parent (S4.1) sans lien direct n'est qu'un intertitre : ses sous-codes portent les stations.
        var parent = g.codes.some(function (x) { return x.code.indexOf(c.code + ".") === 0; });
        if (parent) bloc.className += " parent";
        if (!liste.length && parent) {
          // rien : l'intertitre suffit
        } else if (!liste.length) {
          bloc.appendChild(el("p", { class: "vide", texte: c.appui.length && !tout
            ? "Aucune station ne l'enseigne ; " + (c.appui.length > 1 ? c.appui.length + " s'en servent" : "1 s'en sert") +
              " (voir « Tout ce qui me sert »)."
            : "Pas encore de station inerWeb : ce point se travaille en classe." }));
        } else {
          var grille = el("div", { class: "cartes" }), MAX = 8;
          liste.forEach(function (x, k) {
            var ca = carte(x[0], d, c, x[1]); if (k >= MAX) ca.hidden = true; grille.appendChild(ca);
          });
          bloc.appendChild(grille);
          if (liste.length > MAX) {
            var plus = el("button", { type: "button", class: "plus", texte: "Voir les " + (liste.length - MAX) + " autres stations" });
            plus.addEventListener("click", function () {
              [].forEach.call(grille.children, function (x) { x.hidden = false; }); plus.remove(); poserFiligrane(r);
            });
            bloc.appendChild(plus);
          }
        }
        sec.appendChild(bloc);
      });
      var i = d.groupes.indexOf(g), suiv = d.groupes[i + 1];
      if (suiv) {
        var b = el("button", { type: "button", class: "suivante", texte: "Partie suivante : " + suiv.code + " " + suiv.libelle + " →" });
        b.addEventListener("click", function () {
          etat.partie = suiv.code; majAdresse(); dessinerResultat();
          document.getElementById("resultat").scrollIntoView({ behavior: "smooth" });
        });
        sec.appendChild(b);
      }
      r.appendChild(sec);
    });

    r.appendChild(el("p", { class: "note", texte: "Version d’essai du " + P.date + " : chaque lien a été proposé puis relu ; il sera validé au fil des retours. Une station « brouillon » est en ligne mais pas encore relue." }));

    poserFiligrane(r);
  }

  // Filigrane : un exemplaire tous les 1 400 px environ, dont un vers le centre.
  function poserFiligrane(r) {
    var f = r.querySelector(".filigrane");
    if (!f) { f = el("div", { class: "filigrane", "aria-hidden": "true" }); r.insertBefore(f, r.firstChild); }
    requestAnimationFrame(function () {
      f.innerHTML = "";
      var h = r.offsetHeight, n = Math.max(2, Math.min(8, Math.round(h / 1400) + 1));
      for (var k = 0; k < n; k++) {
        var w = el("div", { html: logoSvg() }).firstChild;
        w.style.top = Math.round((k + .5) * h / n - 60) + "px";
        f.appendChild(w);
      }
      // marque.js choisit sa place (fixe ou fin de page) au redimensionnement : la hauteur vient de changer.
      window.dispatchEvent(new Event("resize"));
    });
  }

  function majAdresse() {
    var p = [];
    if (etat.niveau) p.push("niveau=" + etat.niveau);
    if (etat.diplome) p.push("diplome=" + etat.diplome);
    if (etat.diplome && etat.vue !== "coeur") p.push("vue=" + etat.vue);
    if (etat.diplome && etat.partie && etat.mode !== "tableau") p.push("partie=" + etat.partie);
    if (etat.diplome && etat.mode === "tableau") p.push("mode=tableau" + (etat.tab ? "&tableau=" + etat.tab : ""));
    history.replaceState(null, "", p.length ? "#" + p.join("&") : location.pathname);
  }
  function lireAdresse() {
    location.hash.slice(1).split("&").forEach(function (kv) {
      var x = kv.split("="); if (x[0] === "niveau") etat.niveau = +x[1];
      if (x[0] === "diplome") etat.diplome = x[1]; if (x[0] === "vue" && x[1] === "tout") etat.vue = "tout";
      if (x[0] === "partie") etat.partie = decodeURIComponent(x[1]);
      if (x[0] === "mode" && x[1] === "tableau") etat.mode = "tableau";
      if (x[0] === "tableau") etat.tab = x[1];
    });
    var d = P.diplomes.filter(function (x) { return x.id === etat.diplome; })[0];
    if (d) etat.niveau = d.niveau; else etat.diplome = null;
    if (!NIVEAUX[etat.niveau]) etat.niveau = null;
  }
  function rendre() { dessinerChoix(); dessinerResultat(); }

  lireAdresse(); rendre();
})();
</script>
