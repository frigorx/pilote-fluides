  <title id="t">Pièce 1 - coude à 90 degrés en tube cuivre 1/4 pouce</title>
  <desc id="d">Plan coté d'un coude à 90 degrés, 80 millimètres par 70 millimètres, rayon à l'axe 14,3 millimètres et longueur de coupe 144 millimètres.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#1B3A63"/></marker>
  </defs>
  <rect x="8" y="8" width="984" height="584" fill="#fff" stroke="#1B3A63" stroke-width="3"/>
  <text x="40" y="55" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#1B3A63">PIÈCE 1 - COUDE 90°</text>
  <text x="740" y="55" font-family="Calibri" font-size="22" font-weight="700">Cuivre 1/4″</text>
  <path d="M190 360H610A100 100 0 0 1 710 460V520" fill="none" stroke="#B66A37" stroke-width="22" stroke-linecap="round"/>
  <path d="M190 360H610A100 100 0 0 1 710 460V520" fill="none" stroke="#5C341C" stroke-width="2" stroke-dasharray="9 7"/>
  <line x1="190" y1="305" x2="710" y2="305" stroke="#1B3A63" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="190" y1="320" x2="190" y2="375" stroke="#1B3A63"/>
  <line x1="710" y1="305" x2="710" y2="460" stroke="#1B3A63"/>
  <text x="420" y="292" font-family="Calibri" font-size="24" font-weight="700" fill="#1B3A63">80 mm</text>
  <line x1="785" y1="360" x2="785" y2="520" stroke="#1B3A63" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="710" y1="360" x2="800" y2="360" stroke="#1B3A63"/>
  <line x1="710" y1="520" x2="800" y2="520" stroke="#1B3A63"/>
  <text x="805" y="448" font-family="Calibri" font-size="24" font-weight="700" fill="#1B3A63">70 mm</text>
  <line x1="610" y1="460" x2="710" y2="460" stroke="#C9451A" stroke-width="3" marker-end="url(#a)"/>
  <text x="600" y="490" font-family="Calibri" font-size="21" font-weight="700" fill="#C9451A">R = 14,3 mm</text>
  <rect x="40" y="80" width="920" height="100" rx="12" fill="#F7F1E7" stroke="#1B3A63" stroke-width="2"/>
  <text x="65" y="118" font-family="Calibri" font-size="22"><tspan font-weight="700">Traçage :</tspan> mesurer 80 mm depuis l'extrémité gauche, puis aligner le trait sur L.</text>
  <text x="65" y="153" font-family="Calibri" font-size="22"><tspan font-weight="700">Coupe :</tspan> 144 mm - Tolérance sur la pièce finie : ± 1 mm.</text>
  <text x="40" y="570" font-family="Calibri" font-size="18" fill="#1B3A63">Cotes fonctionnelles jusqu'à l'axe de la branche - dessin non à l'échelle.</text>
</svg>
