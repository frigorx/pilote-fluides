  <line x1="210" y1="290" x2="210" y2="345" stroke="#1B3A63"/><line x1="692" y1="275" x2="692" y2="402" stroke="#1B3A63"/>
  <text x="420" y="262" font-family="Calibri" font-size="24" font-weight="700" fill="#1B3A63">80 mm</text>
  <line x1="210" y1="555" x2="692" y2="555" stroke="#1B3A63" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="210" y1="495" x2="210" y2="565" stroke="#1B3A63"/><line x1="692" y1="438" x2="692" y2="565" stroke="#1B3A63"/>
  <text x="420" y="545" font-family="Calibri" font-size="24" font-weight="700" fill="#1B3A63">80 mm</text>
  <line x1="785" y1="330" x2="785" y2="510" stroke="#1B3A63" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="620" y1="330" x2="800" y2="330" stroke="#1B3A63"/><line x1="620" y1="510" x2="800" y2="510" stroke="#1B3A63"/>
  <text x="805" y="428" font-family="Calibri" font-size="24" font-weight="700" fill="#1B3A63">60 mm</text>
  <text x="740" y="205" font-family="Calibri" font-size="20" font-weight="700" fill="#C9451A">R = 14,3 mm</text>
  <text x="40" y="585" font-family="Calibri" font-size="17" fill="#1B3A63">Entraxe coté à l'axe du tube - dessin non à l'échelle.</text>
