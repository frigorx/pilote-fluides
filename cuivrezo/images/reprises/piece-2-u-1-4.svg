  <title id="t">Pièce 2 - U à deux coudes à 90 degrés en tube cuivre 1/4 pouce</title>
  <desc id="d">Plan coté d'une pièce en U, deux branches de 80 millimètres, entraxe 60 millimètres, rayon à l'axe 14,3 millimètres et longueur de coupe 208 millimètres.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#1B3A63"/></marker></defs>
  <rect x="8" y="8" width="984" height="584" fill="#fff" stroke="#1B3A63" stroke-width="3"/>
  <text x="40" y="55" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#1B3A63">PIÈCE 2 - U À DEUX COUDES</text>
  <text x="740" y="55" font-family="Calibri" font-size="22" font-weight="700">Cuivre 1/4″</text>
  <rect x="40" y="80" width="920" height="92" rx="12" fill="#F7F1E7" stroke="#1B3A63" stroke-width="2"/>
  <text x="65" y="117" font-family="Calibri" font-size="22"><tspan font-weight="700">Méthode :</tspan> avancer de gauche vers la droite ; chaque trait est placé sur L.</text>
  <text x="65" y="150" font-family="Calibri" font-size="22"><tspan font-weight="700">Coupe :</tspan> 208 mm - 2 cintrages à 90° - tolérance ± 1 mm.</text>
