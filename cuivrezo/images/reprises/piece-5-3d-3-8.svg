  <title id="t">Pièce 5 - double coude dans deux plans en tube cuivre 3/8 pouce</title>
  <desc id="d">Plan en vues de face, de profil et isométrique d'une pièce en cuivre 3/8 pouce avec deux coudes à 90 degrés, dimensions 90, 70 et 80 millimètres, rayon 23,8 millimètres et longueur de coupe 220 millimètres.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#1B3A63"/></marker></defs>
  <rect x="8" y="8" width="984" height="584" fill="#fff" stroke="#1B3A63" stroke-width="3"/>
  <text x="40" y="55" font-family="Trebuchet MS" font-size="28" font-weight="700" fill="#1B3A63">PIÈCE 5 - DEUX PLANS</text>
  <text x="740" y="55" font-family="Calibri" font-size="22" font-weight="700">Cuivre 3/8″</text>
  <rect x="40" y="78" width="920" height="78" rx="12" fill="#F7F1E7" stroke="#1B3A63" stroke-width="2"/>
  <text x="65" y="112" font-family="Calibri" font-size="21"><tspan font-weight="700">Coupe :</tspan> 220 mm - 2 coudes à 90° - tourner le tube de 90° entre les deux cintrages.</text>
  <text x="65" y="140" font-family="Calibri" font-size="21"><tspan font-weight="700">Repère :</tspan> les deux traits sont alignés sur L ; le mouvement du manche reste identique.</text>
  <text x="65" y="195" font-family="Trebuchet MS" font-size="20" font-weight="700" fill="#1B3A63">VUE DE FACE</text>
  <path d="M85 320H340A70 70 0 0 1 410 390V500" fill="none" stroke="#B66A37" stroke-width="24" stroke-linecap="round"/>
  <line x1="85" y1="265" x2="410" y2="265" stroke="#1B3A63" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="220" y="252" font-family="Calibri" font-size="22" font-weight="700" fill="#1B3A63">90 mm</text>
  <line x1="455" y1="320" x2="455" y2="500" stroke="#1B3A63" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="470" y="420" font-family="Calibri" font-size="22" font-weight="700" fill="#1B3A63">70 mm</text>
  <text x="535" y="195" font-family="Trebuchet MS" font-size="20" font-weight="700" fill="#1B3A63">VUE ISOMÉTRIQUE</text>
  <path d="M555 300L700 385A62 62 0 0 1 725 470L670 535A62 62 0 0 0 735 535L900 440" fill="none" stroke="#B66A37" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M555 300L700 385A62 62 0 0 1 725 470L670 535A62 62 0 0 0 735 535L900 440" fill="none" stroke="#5C341C" stroke-width="2" stroke-dasharray="9 7"/>
  <path d="M715 425l34 20l-20 34" fill="none" stroke="#C9451A" stroke-width="4"/><text x="755" y="460" font-family="Calibri" font-size="19" font-weight="700" fill="#C9451A">rotation 90°</text>
  <line x1="735" y1="565" x2="900" y2="470" stroke="#1B3A63" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="810" y="555" font-family="Calibri" font-size="22" font-weight="700" fill="#1B3A63">80 mm</text>
  <text x="535" y="235" font-family="Calibri" font-size="20" font-weight="700" fill="#C9451A">R = 23,8 mm</text>
  <text x="40" y="585" font-family="Calibri" font-size="17" fill="#1B3A63">Contrôler la forme dans les deux vues ; tolérance dimensionnelle ± 1 mm.</text>
</svg>
